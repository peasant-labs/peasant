# setup is performed by the test below the case root before the script runs; child is what the
# profiled command does (this test binary, re-executed). See profile_push_copy_steps_test.go for the ops.
- name: reviewer-traversal-dry-clean
  setup:
    - {op: mkdir, path: anchor}
    - {op: mkdir, path: victim}
    - {op: write, path: victim/sentinel, content: untouched}
  args: [--dry-run, --clean, --work, '{root}/anchor/../victim', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  exactFiles: {victim/sentinel: untouched}
  absent: [summary, profile]
- name: symlinked-ancestor-dry-clean
  setup:
    - {op: mkdir, path: victim}
    - {op: write, path: victim/sentinel, content: untouched}
    - {op: symlink, path: anchor, to: victim}
  args: [--dry-run, --clean, --work, '{root}/anchor/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  exactFiles: {victim/sentinel: untouched}
  absent: [summary, victim/work]
- name: existing-empty-work
  setup:
    - {op: mkdir, path: work}
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: FATAL
  emptyDirs: [work]
  absent: [summary, ran]
- name: existing-nonempty-work
  setup:
    - {op: mkdir, path: work}
    - {op: write, path: work/sentinel, content: untouched}
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: FATAL
  exactFiles: {work/sentinel: untouched}
  absent: [summary, ran]
- name: existing-work-dry-clean
  setup:
    - {op: mkdir, path: work}
    - {op: write, path: work/sentinel, content: untouched}
  args: [--dry-run, --clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  exactFiles: {work/sentinel: untouched}
  absent: [summary]
- name: fresh-dry-clean
  args: [--dry-run, --clean, --work, '{root}/work', --profile-output, '{root}/profile', --trace-output, '{root}/trace', --summary-output, '{root}/summary']
  status: 0
  output: 'push profile dry run: ok'
  files: {summary: 'timing gate: structural assertions only'}
  absent: [work, profile, trace]
- name: fresh-dry-retain
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 0
  output: 'push profile dry run: ok'
  files: {summary: 'timing gate: structural assertions only'}
  absent: [work, profile]
- name: traversal-real-clean
  setup:
    - {op: mkdir, path: anchor}
    - {op: mkdir, path: victim}
    - {op: write, path: victim/sentinel, content: untouched}
  args: [--clean, --work, '{root}/anchor/../victim', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: FATAL
  exactFiles: {victim/sentinel: untouched}
  absent: [summary, profile, ran]
- name: symlinked-ancestor-real-clean
  setup:
    - {op: mkdir, path: victim}
    - {op: write, path: victim/sentinel, content: untouched}
    - {op: symlink, path: anchor, to: victim}
  args: [--clean, --work, '{root}/anchor/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: FATAL
  exactFiles: {victim/sentinel: untouched}
  absent: [summary, victim/work, ran]
- name: dangling-work-symlink
  setup:
    - {op: symlink, path: work, to: victim}
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: FATAL
  absent: [summary, victim, ran]
- name: missing-work-parent
  args: [--clean, --work, '{root}/missing/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: ran, content: ran}
  status: 1
  output: parent does not exist
  absent: [summary, missing, ran]
- name: unknown-option
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary', --oops]
  status: 1
  output: unknown flag
  absent: [work, profile, summary]
- name: missing-option-value
  args: [--clean, --work]
  status: 1
  output: needs a path
  absent: [work, summary]
- name: missing-command
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: a command after -- is required
  absent: [work, summary]
- name: success-retains-private-work
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --trace-output, '{root}/trace', --summary-output, '{root}/summary']
  child:
    - {op: expectArg, value: argument with spaces}
    - {op: expectSamePath, path: '{work}', to: work}
    - {op: expectSamePath, path: '{summary}', to: summary}
    - {op: expectDir, path: '{work}/data-home'}
    - {op: expectDir, path: '{work}/config-home'}
    - {op: expectDir, path: '{work}/state-home'}
    - {op: write, path: '{work}/data-home/payload', content: payload}
    - {op: write, path: '{profile}', content: '{}'}
    - {op: write, path: '{trace}', content: '{}'}
  status: 0
  output: 'profile status: 0'
  files: {work/data-home/payload: payload, profile: '{}', trace: '{}', summary: 'profile trace exists: yes'}
  privateDir: work
- name: failure-retains-private-work
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{work}/data-home/payload', content: payload}
    - {op: exit, status: 37}
  status: 37
  output: 'profile status: 37'
  files: {work/data-home/payload: payload, summary: 'profile status: 37'}
  privateDir: work
- name: success-cleans-owned-contents
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{work}/.hidden', content: payload}
    - {op: symlink, path: '{work}/link', to: sentinel}
  status: 0
  output: 'profile status: 0'
  files: {summary: 'profile status: 0'}
  emptyDirs: [work]
  privateDir: work
- name: failure-cleans-owned-contents
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{work}/data-home/payload', content: payload}
    - {op: exit, status: 42}
  status: 42
  output: 'profile status: 42'
  files: {summary: 'profile status: 42'}
  emptyDirs: [work]
- name: replaced-directory-refuses-cleanup
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: rename, path: '{work}', to: original}
    - {op: mkdir, path: '{work}'}
    - {op: write, path: '{work}/sentinel', content: untouched}
    - {op: exit, status: 23}
  status: 23
  output: cleanup refused
  exactFiles: {work/sentinel: untouched}
  files: {summary: 'profile status: 23'}
  emptyDirs: [original/data-home]
- name: replaced-symlink-refuses-cleanup
  setup:
    - {op: mkdir, path: victim}
    - {op: write, path: victim/sentinel, content: untouched}
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: rename, path: '{work}', to: original}
    - {op: symlink, path: '{work}', to: victim}
  status: 0
  output: cleanup refused
  exactFiles: {victim/sentinel: untouched}
  emptyDirs: [original/data-home]
- name: deleted-recreated-work-refuses-cleanup
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: removeAll, path: '{work}'}
    - {op: mkdir, path: '{work}'}
    - {op: write, path: '{work}/sentinel', content: untouched}
  status: 0
  output: cleanup refused
  exactFiles: {work/sentinel: untouched}
- name: replaced-ancestor-refuses-cleanup
  setup:
    - {op: mkdir, path: parent}
  args: [--clean, --work, '{root}/parent/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: rename, path: parent, to: original}
    - {op: symlink, path: parent, to: original}
    - {op: write, path: original/work/sentinel, content: untouched}
  status: 0
  output: cleanup refused
  exactFiles: {original/work/sentinel: untouched}
- name: replaced-physical-ancestor-refuses-cleanup
  setup:
    - {op: mkdir, path: parent}
  args: [--clean, --work, '{root}/parent/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: rename, path: parent, to: original}
    - {op: mkdir, path: parent}
    - {op: rename, path: original/work, to: parent/work}
    - {op: write, path: '{work}/sentinel', content: untouched}
  status: 0
  output: cleanup refused
  exactFiles: {parent/work/sentinel: untouched}
- name: output-traversal
  setup:
    - {op: mkdir, path: anchor}
  args: [--dry-run, --clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/anchor/../sentinel']
  status: 1
  output: FATAL
  absent: [work, summary]
- name: output-symlink-ancestor
  setup:
    - {op: mkdir, path: victim}
    - {op: symlink, path: alias, to: victim}
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/alias/summary']
  status: 1
  output: FATAL
  absent: [work, victim/summary]
- name: output-symlink-file
  setup:
    - {op: symlink, path: summary, to: sentinel}
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  absent: [work]
- name: output-hardlink-file
  setup:
    - {op: hardlink, path: summary, to: sentinel}
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  absent: [work]
- name: existing-profile-refused
  setup:
    - {op: hardlink, path: profile, to: sentinel}
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{profile}', content: overwritten}
  status: 1
  output: FATAL
  absent: [work, summary]
- name: existing-trace-refused
  setup:
    - {op: symlink, path: trace, to: sentinel}
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --trace-output, '{root}/trace', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{trace}', content: overwritten}
  status: 1
  output: FATAL
  absent: [work, summary]
- name: duplicate-output-paths
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/summary', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  absent: [work, summary]
- name: duplicate-trace-path
  args: [--dry-run, --work, '{root}/work', --profile-output, '{root}/profile', --trace-output, '{root}/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  absent: [work, profile, summary]
- name: profile-output-traversal
  setup:
    - {op: mkdir, path: anchor}
  args: [--work, '{root}/work', --profile-output, '{root}/anchor/../sentinel', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{profile}', content: overwritten}
  status: 1
  output: FATAL
  absent: [work, summary]
- name: trace-output-traversal
  setup:
    - {op: mkdir, path: anchor}
  args: [--work, '{root}/work', --profile-output, '{root}/profile', --trace-output, '{root}/anchor/../sentinel', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{trace}', content: overwritten}
  status: 1
  output: FATAL
  absent: [work, summary]
- name: output-equals-work
  args: [--dry-run, --clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/work']
  status: 1
  output: FATAL
  absent: [work, profile]
- name: output-under-work
  args: [--dry-run, --clean, --work, '{root}/work', --profile-output, '{root}/work/profile', --summary-output, '{root}/summary']
  status: 1
  output: FATAL
  absent: [work, summary]
- name: summary-replaced-by-child
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: rename, path: '{summary}', to: original-summary}
    - {op: symlink, path: '{summary}', to: sentinel}
    - {op: exit, status: 19}
  status: 19
  output: 'profile status: 19'
  files: {original-summary: 'profile status: 19'}
  emptyDirs: [work]
- name: child-summary-content-retained
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  child:
    - {op: write, path: '{summary}', content: "child summary\n"}
  status: 0
  output: 'profile status: 0'
  files:
    summary: "child summary\nprofile status: 0"
  emptyDirs: [work]
