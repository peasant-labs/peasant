- name: summary-replaced-by-child
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  command: mv "$PROFILE_SUMMARY" "$ROOT/original-summary"; ln -s "$ROOT/sentinel" "$PROFILE_SUMMARY"; exit 19
  status: 19
  output: 'profile status: 19'
  files: {original-summary: 'profile status: 19'}
  emptyDirs: [work]
- name: child-summary-content-retained
  args: [--clean, --work, '{root}/work', --profile-output, '{root}/profile', --summary-output, '{root}/summary']
  command: printf 'child summary\n' > "$PROFILE_SUMMARY"
  status: 0
  output: 'profile status: 0'
  files:
    summary: "child summary\nprofile status: 0"
  emptyDirs: [work]
