# Input closure and required child jobs for the release-PR gates.
#
# Keep this file in step with .github/workflows/e2e.yml and
# .github/workflows/release-validate.yml. A workflow change is itself an input
# of both gates, so a drift that adds or renames a child makes the gate run (the
# unknown child is rejected). A child removed from this file would silently
# weaken the proof, so TestManifestMatchesWorkflows pins the required names to
# the jobs (with their matrix expansion) defined by those workflows.
gates:
  - key: e2e
    prefix: "e2e (release PR) / "
    patterns:
      - '\.go$'                  # every package the CLI and the e2e suite compile
      - '^go\.mod$'              # dependency graph
      - '^go\.sum$'
      - '^Makefile$'             # the e2e target and its wrapper invocation
      - '^flake\.nix$'           # the dev shell the job runs in
      - '^flake\.lock$'
      - '^scripts/e2e-budget\.sh$'
      - '^internal/e2e/'         # the suite, its fixtures, and its contract data
      - '(^|/)testdata/'         # fixtures other packages read (Pi round-trip)
      - '^web/out/'              # the //go:embed all:web/out tree the CLI builds with
      - '^\.github/workflows/'   # the workflow-contract tests read these files
    children:
      - name: full-stack push e2e (podman)
  - key: release_validate
    prefix: "release-validate (release PR) / "
    patterns:
      - '\.go$'               # the binary the snapshot cross-compiles
      - '(^|/)testdata/'      # fixtures the Nix build tests read, root or nested
      - '^docs/'              # documentation tests run in the Nix build checkPhase
      - '^go\.mod$'
      - '^go\.sum$'
      - '^web/'               # the embedded dashboard `make web` builds
      - '^Makefile$'
      - '^flake\.nix$'        # the nix build job
      - '^flake\.lock$'
      - '^\.goreleaser\.yml$' # the packaging configuration itself
      - '^scripts/'           # install-goreleaser, the patch, notices and checks
      - '^\.github/workflows/'
      - '^LICENSE$'           # packaged into the archives and packages
      - '^README\.md$'
      - '^THIRD_PARTY_NOTICES$'
      - '^\.gitignore$'       # the clean-tree assertion after `make web`
    children:
      # The router job calls the shared reusable workflow, so GitHub names its
      # check run for both levels. It runs on every invocation of the workflow
      # and is required like the rest. (The arm64 and macOS children below keep
      # their own runners and do not read the router's output.)
      - name: determine-runner / pick
      - name: classify rc
      - name: goreleaser snapshot
      - name: nix build .#peasant
      - name: deb (quay.io/peasant-labs/ubuntu@sha256:8041f5d446321c3f50ff21bc57e939a6710302123929f779f7fc5ed6959efa34 / amd64)
      - name: deb (quay.io/peasant-labs/ubuntu@sha256:8041f5d446321c3f50ff21bc57e939a6710302123929f779f7fc5ed6959efa34 / arm64)
      - name: deb (quay.io/peasant-labs/ubuntu@sha256:c1be016f6ec91527a392928d11ea3083d86171e64c72571670357fb3c4d581c9 / amd64)
      - name: deb (quay.io/peasant-labs/ubuntu@sha256:c1be016f6ec91527a392928d11ea3083d86171e64c72571670357fb3c4d581c9 / arm64)
      - name: rpm (quay.io/fedora/fedora@sha256:e78cd1a688cd079c23864f289a89a49a3f4ad66d817864e325e1d058310ee95c)
      - name: rpm (registry.opensuse.org/opensuse/leap@sha256:e4d84bbc5e0fa0df64381e95ad7ea8e3867cc34f3b1d174e9948d0f559d223e2)
      - name: makepkg (archlinux x86_64)
      - name: brew style (linux)
      - name: macos cask install (rc only)
        optional: true        # runs on release candidates only
