version: 1
ts:
  roots: [web]
go:
  roots: [.]
schema:
  module: github.com/peasant-labs/schema
exempt:
  - rule: "*"
    paths:
      - internal/tui/theme/palette_gen.go
      - web/src/lib/session-detail/mock-redactions.ts
      - web/src/lib/share/redaction-policy.generated.ts
    reason: generated code, not hand-edited
exclude:
  - paths:
      - third_party
    reason: vendored, patched copy of the upstream zombiezen SQLite driver (see third_party/zombiezen-sqlite/PEASANT.md); upstream code is not owned by Peasant and is not linted
