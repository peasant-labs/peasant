generation:
  - name: unchanged-generation-commits
    actions: []
    changed: false
  - name: credential-rotation-refuses-old-response
    actions: [save-same]
    changed: true
  - name: account-switch-back-refuses-old-response
    actions: [save-other, save-same]
    changed: true
  - name: logout-refuses-old-response
    actions: [clear]
    changed: true
  - name: logout-login-same-account-refuses-old-response
    actions: [clear, save-same]
    changed: true
  - name: failed-save-before-replacement-preserves-snapshot
    actions: [save-invalid-time]
    changed: false
mutations:
  - name: cross-process-save-waits-for-commit
    action: save
    presentAfter: true
  - name: cross-process-clear-waits-for-commit
    action: clear
    presentAfter: false
profiles:
  - name: captured-profile-remains-pinned-after-environment-change
    otherUsername: other-profile
    otherUserId: 22222222-2222-4222-8222-222222222222
urls:
  - name: full-base-path-preserved
    input: https://VILLAGE.example:443/team/a/
    normalized: https://village.example/team/a
  - name: same-host-different-base-path
    input: https://village.example/team/b
    normalized: https://village.example/team/b
  - name: url-secrets-not-scope
    input: https://ignored:secret@VILLAGE.example/a?key=secret#fragment
    normalized: https://village.example/a
  - name: nondefault-port-preserved
    input: https://village.example:8443/a
    normalized: https://village.example:8443/a
  - name: explicit-loopback-development
    input: http://127.0.0.1:8080/
    normalized: http://127.0.0.1:8080
  - name: ipv6-default-port
    input: http://[::1]:80/a/
    normalized: http://[::1]/a
  - name: insecure-remote-refused
    input: http://village.example/a
    invalid: true
  - name: relative-url-refused
    input: /collectives
    invalid: true
  - name: ambiguous-parent-path-refused
    input: https://village.example/a/../b
    invalid: true
  - name: encoded-separator-refused
    input: https://village.example/a%2fb
    invalid: true
  - name: ambiguous-empty-path-segment-refused
    input: https://village.example/a//b
    invalid: true
  - name: unsupported-scheme-refused
    input: ftp://village.example/a
    invalid: true
