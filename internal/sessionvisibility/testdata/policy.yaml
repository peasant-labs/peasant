cases:
  - name: zero_policy_admits_user
    zero_policy: true
    candidate: {origin: user}
    result: error
    error_contains: run `peasant kickstart`
    discovery_result: visible
  - name: zero_policy_admits_unknown
    zero_policy: true
    candidate: {origin: unknown}
    result: error
    error_contains: run `peasant kickstart`
    discovery_result: visible
  - name: zero_policy_withholds_agent
    zero_policy: true
    candidate: {origin: agent}
    result: error
    error_contains: run `peasant kickstart`
    discovery_result: hidden
  - name: zero_policy_rejects_invalid_origin
    zero_policy: true
    candidate: {origin: teammate}
    result: error
    error_contains: run `peasant kickstart`
    discovery_result: error
    discovery_error_contains: re-ingest the session
  - name: all_mode
    mode: all
    candidate: {harness: claude-code, session_id: session-all, project_name: alpha, git_branch: main}
    result: visible
  - name: selected_empty
    mode: selected
    candidate: {harness: claude-code, session_id: session-empty, project_name: alpha, git_branch: main}
    result: hidden
  - name: unrestricted_named_harness
    mode: selected
    harnesses:
      claude-code: {}
    candidate: {harness: claude-code, session_id: session-harness, project_name: alpha, git_branch: main}
    result: visible
  - name: explicit_session_does_not_widen_siblings
    mode: selected
    harnesses:
      claude-code:
        sessions: [session-explicit]
    candidate: {harness: claude-code, session_id: session-sibling, project_name: alpha, git_branch: main}
    result: hidden
  - name: explicit_session_positive
    mode: selected
    harnesses:
      claude-code:
        sessions: [session-explicit]
    candidate: {harness: claude-code, session_id: session-explicit, project_name: alpha, git_branch: dev}
    result: visible
  - name: git_remote_identity_fallback
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: git@example.test:org/alpha.git}
    candidate: {harness: claude-code, session_id: session-remote, git_remote: git@example.test:org/alpha.git, git_branch: dev}
    result: visible
  - name: project_name_identity_fallback
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha}
    candidate: {harness: claude-code, session_id: session-name, project_name: alpha, git_branch: dev}
    result: visible
  - name: absent_branch_is_admitted_for_selected_project
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, branches: [main]}
    candidate: {harness: claude-code, session_id: session-unknown-branch, project_name: alpha}
    result: visible
  - name: mixed_harness_does_not_cross_select
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha}
      codex:
        sessions: [session-codex]
    candidate: {harness: opencode, session_id: session-other, project_name: alpha, git_branch: main}
    result: hidden
  - name: selected_branch
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, branches: [main]}
    candidate: {harness: claude-code, session_id: session-main, project_name: alpha, git_branch: main}
    result: visible
  - name: excluded_branch
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, branches: [main]}
    candidate: {harness: claude-code, session_id: session-dev, project_name: alpha, git_branch: dev}
    result: hidden
  - name: exact_branch_exclusion
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, clonePaths: [/workspace/alpha-a]}
        exclusions:
          branches:
            - {clonePath: /workspace/alpha-a, branches: [main]}
    candidate: {harness: claude-code, session_id: session-denied-branch, project_name: alpha, clone_path: /workspace/alpha-a, git_branch: main}
    result: hidden
  - name: branch_exclusion_does_not_cross_clone_boundary
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, clonePaths: [/workspace/alpha-a, /workspace/alpha-b]}
        exclusions:
          branches:
            - {clonePath: /workspace/alpha-a, branches: [main]}
    candidate: {harness: claude-code, session_id: session-sibling-branch, project_name: alpha, clone_path: /workspace/alpha-b, git_branch: main}
    result: visible
  - name: project_admitted_exact_session_exclusion
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha, clonePaths: [/workspace/alpha-session]}
        exclusions:
          sessions: [session-denied-exact]
    candidate: {harness: claude-code, session_id: session-denied-exact, project_name: alpha, clone_path: /workspace/alpha-session, git_branch: release}
    result: hidden
  - name: conflicting_branch_rules
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: git@example.test:org/alpha.git, branches: [main]}
          - {name: alpha, branches: [dev]}
    candidate:
      harness: claude-code
      session_id: session-conflict
      project_name: alpha
      git_remote: git@example.test:org/alpha.git
      git_branch: main
    error_contains: conflicting project branch rules
    result: error
  # Kickstart persists a git remote in the form reported by `git remote -v`
  # (SSH/SCP here), while the projects table stores the normalized bare
  # "host/owner/repo" form used by Candidate.GitRemote. Both forms must match
  # so selected mode does not hide the selected project's sessions.
  - name: git_remote_scp_config_matches_normalized_stored_form
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: "git@github.com:example-org/garden-app.git"}
    candidate: {harness: claude-code, session_id: session-garden-app-scp, git_remote: "github.com/example-org/garden-app", git_branch: main}
    result: visible
  - name: git_remote_https_config_matches_normalized_stored_form
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: "https://gitlab.com/example-team/sample-project.git"}
    candidate: {harness: claude-code, session_id: session-sample-project, git_remote: "gitlab.com/example-team/sample-project", git_branch: main}
    result: visible
  - name: git_remote_ssh_url_config_matches_normalized_stored_form
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: "ssh://git@github.com/example-org/garden-app.git"}
    candidate: {harness: claude-code, session_id: session-garden-app, git_remote: "github.com/example-org/garden-app", git_branch: main}
    result: visible
  # A config `name` rule is a short project name, but the store
  # reader that feeds Candidate.ProjectName populates it as the session's full
  # working-directory PATH (no separate short-name column in the projects
  # table) — a real config name can never equal a real stored path unmodified.
  - name: project_name_config_matches_path_shaped_stored_name
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: "sample-project"}
    candidate: {harness: claude-code, session_id: session-sample-project-name, project_name: "/home/developer/work/sample-project", git_branch: main}
    result: visible
  # Negative control: a project that genuinely is NOT selected — same real
  # forms as above, but naming a different repo/path — must stay hidden. The
  # fix must not turn the matcher into one that matches everything.
  - name: unselected_project_with_real_forms_stays_hidden
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: "git@github.com:example-org/garden-app.git"}
          - {name: "sample-project"}
    candidate: {harness: claude-code, session_id: session-unrelated, git_remote: "github.com/another-org/unrelated-repo", project_name: "/home/developer/work/other-project", git_branch: main}
    result: hidden
  # Explicit session-ID rules must keep working unchanged alongside the fixed
  # gitRemote/name rules (they never depended on normalization to begin with,
  # but this proves the fix didn't regress the allowlist path in a config that
  # also carries real-form project rules).
  - name: explicit_session_still_works_alongside_real_form_project_rules
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {gitRemote: "git@github.com:example-org/garden-app.git"}
        sessions: [session-explicit-forms]
    candidate: {harness: claude-code, session_id: session-explicit-forms, project_name: "/home/developer/work/other-project", git_branch: main}
    result: visible
  # Origin scope. `result` is the saved selection's INGEST/PUSH membership;
  # `discovery_result` is browsing, which applies origin only. An arm whose two
  # values differ is the evidence that the saved selection does not narrow the
  # viewer.
  #
  # Every withholding arm below is paired with a control that differs ONLY in
  # origin. Without the pair an arm proves nothing, because the row could have
  # been absent for the other scope's reason.
  - name: origin_scope_alone_hides_an_agent_root
    mode: all
    candidate: {harness: claude-code, session_id: session-agent-root, project_name: alpha, git_branch: main, origin: agent}
    result: visible
    discovery_result: hidden
  - name: origin_scope_alone_admits_a_user_root
    mode: all
    candidate: {harness: claude-code, session_id: session-agent-root, project_name: alpha, git_branch: main, origin: user}
    result: visible
    discovery_result: visible
  - name: origin_scope_alone_admits_an_unknown_root
    mode: all
    candidate: {harness: claude-code, session_id: session-agent-root, project_name: alpha, git_branch: main, origin: unknown}
    result: visible
    discovery_result: visible
  # A subagent transcript is stored as its own sessions row and reaches this
  # path with no parent filter in front of it. It leaves the list because its
  # origin is agent, and the control below is what makes that claim falsifiable:
  # the same parented row with a user origin must stay, so a parent filter added
  # here in place of origin scope turns this pair red.
  - name: origin_scope_alone_hides_an_agent_subagent_row
    mode: all
    candidate: {harness: claude-code, session_id: session-subagent-row, project_name: alpha, git_branch: main, origin: agent, parent_session_id: session-agent-root}
    result: visible
    discovery_result: hidden
  - name: a_subagent_row_a_person_drove_stays_in_discovery
    mode: all
    candidate: {harness: claude-code, session_id: session-subagent-row, project_name: alpha, git_branch: main, origin: user, parent_session_id: session-agent-root}
    result: visible
    discovery_result: visible
  # Selection scope alone hides the row from ingest/push metadata, but browsing
  # is origin-only: the same stored row stays in the viewer.
  - name: selection_scope_alone_hides_a_user_origin_row
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha}
    candidate: {harness: claude-code, session_id: session-unselected-user, project_name: beta, git_branch: main, origin: user}
    result: hidden
    discovery_result: visible
  # Both scopes together, on a project selection that admits the row: the
  # decision then rests entirely on origin, and the control proves it.
  - name: both_scopes_together_hide_an_agent_row_in_a_selected_project
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha}
    candidate: {harness: claude-code, session_id: session-selected-agent, project_name: alpha, git_branch: main, origin: agent}
    result: visible
    discovery_result: hidden
  - name: both_scopes_together_admit_a_user_row_in_a_selected_project
    mode: selected
    harnesses:
      claude-code:
        projects:
          - {name: alpha}
    candidate: {harness: claude-code, session_id: session-selected-agent, project_name: alpha, git_branch: main, origin: user}
    result: visible
    discovery_result: visible
  # An origin outside the stored menu is refused rather than guessed at: both
  # substitutions are wrong, so the list is withheld.
  - name: an_unusable_origin_withholds_the_discovery_list
    mode: all
    candidate: {harness: claude-code, session_id: session-corrupt-origin, project_name: alpha, git_branch: main, origin: teammate}
    result: visible
    discovery_result: error
    discovery_error_contains: unusable origin
