# A mutation before the write, with the write still expected to succeed. If the
# slot changed after the plan then the write must stop; a row expecting both is
# asserting that the guard does not work.
expectedCaseCount: 1
cases:
  - name: mutation-expecting-success
    requestedEvents: [post-commit, pre-push]
    seed:
      - event: post-commit
        kind: managed
      - event: pre-push
        kind: managed
    expected:
      - event: post-commit
        ownershipBefore: peasant
        plannedAction: replace
        installOutcome: replaced
        managedAfterInstall: true
        uninstallOutcome: removed
        presentAfterUninstall: false
        postPlanMutation:
          window: before-write
          shape: foreign-bytes
          mode: "0755"
          content: "#!/bin/sh\n# the user's own hook\n"
      - event: pre-push
        ownershipBefore: peasant
        plannedAction: replace
        installOutcome: replaced
        managedAfterInstall: true
        uninstallOutcome: removed
        presentAfterUninstall: false
