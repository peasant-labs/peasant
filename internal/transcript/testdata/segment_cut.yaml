cases:
  # The next turn would push the segment past the budget, so it is deferred to
  # the next segment instead of being appended. JSON size is content bytes + 2.
  - name: cut-defers-crossing-entry
    budgetBytes: 1048576
    turns:
      - {index: 4, role: user, contentBytes: 262144}
      - {index: 7, role: assistant, contentBytes: 524288}
      - {index: 11, role: assistant, contentBytes: 524288}
      - {index: 14, role: user, contentBytes: 131072}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 7, byteLength: 786436, conversationTurns: {before: 0, count: 2}}
        - {index: 1, firstTurn: 11, lastTurn: 14, byteLength: 655364, conversationTurns: {before: 2, count: 2}}
      crossingTurn: 11
  # A user turn never spans two segments: it is appended whole or deferred
  # whole. Here the assistant turn alone fills the first segment.
  - name: cut-user-turn-whole
    budgetBytes: 1048576
    turns:
      - {index: 4, role: assistant, contentBytes: 524288}
      - {index: 7, role: user, contentBytes: 1048576}
      - {index: 11, role: assistant, contentBytes: 262144}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 4, byteLength: 524290, conversationTurns: {before: 0, count: 1}}
        - {index: 1, firstTurn: 7, lastTurn: 7, byteLength: 1048578, conversationTurns: {before: 1, count: 1}}
        - {index: 2, firstTurn: 11, lastTurn: 11, byteLength: 262146, conversationTurns: {before: 2, count: 1}}
      crossingTurn: 7
  # A turn larger than the budget is appended to an empty segment, so the next
  # iteration always closes it: it ends up alone.
  - name: cut-oversized-turn-alone
    budgetBytes: 1048576
    turns:
      - {index: 4, role: user, contentBytes: 1024}
      - {index: 7, role: assistant, contentBytes: 4194304}
      - {index: 11, role: user, contentBytes: 2048}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 4, byteLength: 1026, conversationTurns: {before: 0, count: 1}}
        - {index: 1, firstTurn: 7, lastTurn: 7, byteLength: 4194306, conversationTurns: {before: 1, count: 1}}
        - {index: 2, firstTurn: 11, lastTurn: 11, byteLength: 2050, conversationTurns: {before: 2, count: 1}}
      crossingTurn: 7
  # A turn at exactly the budget is allowed and is not an overflow.
  - name: cut-exact-budget-turn
    budgetBytes: 1048576
    turns:
      - {index: 4, role: user, contentBytes: 1048574}
      - {index: 7, role: assistant, contentBytes: 2}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 4, byteLength: 1048576, conversationTurns: {before: 0, count: 1}}
        - {index: 1, firstTurn: 7, lastTurn: 7, byteLength: 4, conversationTurns: {before: 1, count: 1}}
      crossingTurn: 7
  - name: cut-single-turn
    budgetBytes: 1048576
    turns:
      - {index: 4, role: user, contentBytes: 4096}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 4, byteLength: 4098, conversationTurns: {before: 0, count: 1}}
  - name: cut-empty-session
    budgetBytes: 1048576
    turns: []
    expected:
      segments: []
  # The segment's byteLength is the sum of its turns' pre-bound sizes, including
  # tool-call arguments and results, which are each JSON-encoded with quotes.
  - name: cut-includes-tool-call-bytes
    budgetBytes: 1048576
    turns:
      - {index: 4, role: user, contentBytes: 8}
      - {index: 7, role: assistant, contentBytes: 16, argumentsBytes: [1048576], resultBytes: [1048576]}
      - {index: 11, role: user, contentBytes: 8}
    expected:
      segments:
        - {index: 0, firstTurn: 4, lastTurn: 4, byteLength: 10, conversationTurns: {before: 0, count: 1}}
        - {index: 1, firstTurn: 7, lastTurn: 7, byteLength: 2097174, conversationTurns: {before: 1, count: 1}}
        - {index: 2, firstTurn: 11, lastTurn: 11, byteLength: 10, conversationTurns: {before: 2, count: 1}}
      crossingTurn: 7
  # Positions count only conversation turns: system rows, tool rows, a
  # tool-only reply and a thinking-only reply are cut and measured like any
  # turn but move no position. Each turn is 10 bytes; three fit the budget.
  - name: cut-positions-skip-uncounted-rows
    budgetBytes: 30
    turns:
      - {index: 0, role: user, contentBytes: 8}
      - {index: 4, role: system, contentBytes: 8, entryType: system}
      - {index: 8, role: assistant, contentBytes: 8}
      - {index: 12, role: assistant, contentBytes: 8, entryType: tool_use}
      - {index: 16, role: tool, contentBytes: 8, entryType: tool_result}
      - {index: 20, role: assistant, contentBytes: 8}
      - {index: 24, role: user, contentBytes: 8}
      - {index: 28, role: assistant, contentBytes: 8, entryType: thinking}
      - {index: 32, role: system, contentBytes: 8}
    expected:
      uncountedSegments: 2
      segments:
        - {index: 0, firstTurn: 0, lastTurn: 8, byteLength: 30, conversationTurns: {before: 0, count: 2}}
        - {index: 1, firstTurn: 12, lastTurn: 20, byteLength: 30, conversationTurns: {before: 2, count: 1}}
        - {index: 2, firstTurn: 24, lastTurn: 32, byteLength: 30, conversationTurns: {before: 3, count: 1}}
  # A segment holding exactly one conversation turn among uncounted rows.
  - name: cut-positions-single-conversation-turn
    budgetBytes: 30
    turns:
      - {index: 0, role: user, contentBytes: 8}
      - {index: 4, role: assistant, contentBytes: 8}
      - {index: 8, role: user, contentBytes: 8}
      - {index: 12, role: system, contentBytes: 8, entryType: system}
      - {index: 16, role: assistant, contentBytes: 8}
      - {index: 20, role: tool, contentBytes: 8, entryType: tool_result}
    expected:
      segments:
        - {index: 0, firstTurn: 0, lastTurn: 8, byteLength: 30, conversationTurns: {before: 0, count: 3}}
        - {index: 1, firstTurn: 12, lastTurn: 20, byteLength: 30, conversationTurns: {before: 3, count: 1}}
  # A last segment with no conversation turn still states a span: its count is
  # 0 and its before is the whole session's count.
  - name: cut-positions-no-conversation-turns-segment
    budgetBytes: 20
    turns:
      - {index: 0, role: user, contentBytes: 8}
      - {index: 4, role: assistant, contentBytes: 8}
      - {index: 8, role: system, contentBytes: 8, entryType: system}
      - {index: 12, role: tool, contentBytes: 8, entryType: tool_result}
    expected:
      segments:
        - {index: 0, firstTurn: 0, lastTurn: 4, byteLength: 20, conversationTurns: {before: 0, count: 2}}
        - {index: 1, firstTurn: 8, lastTurn: 12, byteLength: 20, conversationTurns: {before: 2, count: 0}}
  # A middle segment with no conversation turn leaves the next segment's before
  # where the previous one ended.
  - name: cut-positions-zero-count-middle-segment
    budgetBytes: 20
    turns:
      - {index: 0, role: user, contentBytes: 8}
      - {index: 4, role: assistant, contentBytes: 8}
      - {index: 8, role: assistant, contentBytes: 8, entryType: tool_use}
      - {index: 12, role: tool, contentBytes: 8, entryType: tool_result}
      - {index: 16, role: user, contentBytes: 8}
      - {index: 20, role: assistant, contentBytes: 8}
    expected:
      segments:
        - {index: 0, firstTurn: 0, lastTurn: 4, byteLength: 20, conversationTurns: {before: 0, count: 2}}
        - {index: 1, firstTurn: 8, lastTurn: 12, byteLength: 20, conversationTurns: {before: 2, count: 0}}
        - {index: 2, firstTurn: 16, lastTurn: 20, byteLength: 20, conversationTurns: {before: 2, count: 2}}
