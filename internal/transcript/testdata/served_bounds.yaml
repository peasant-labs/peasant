cases:
  # 9 MiB is over the contract's 8 MiB served-document policy and under the
  # 256 MiB record cap ingest now accepts, so this is exactly the record that
  # used to make the whole session unreadable.
  - name: oversized_tool_result_is_bounded_with_a_note
    kind: tool_result
    fill: "x"
    fieldBytes: [9437184]
    expected:
      - bounded: true
        shownBytes: 1048576
        noteContains:
          - "tool result bounded for display"
          - "showing 1.0 MiB of 9.0 MiB"
          - "the full record is stored locally"
  - name: small_tool_result_is_served_whole
    kind: tool_result
    fill: "x"
    fieldBytes: [102400]
    expected:
      - bounded: false
  # Total recorded text far over the document budget, all fields equal: the
  # shared bound drops below the per-field bound and every field gives up the
  # same number of bytes.
  - name: many_large_tool_results_share_one_lowered_bound
    kind: tool_result
    fill: "x"
    fieldBytes:
      [
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
        262144,
      ]
    equalBoundAcrossBoundedFields: true
    allBounded: true
  # One field is far over the shared bound and the other is far under it, so the
  # large one is shortened while the small one is served whole.
  - name: largest_field_gives_up_bytes_before_a_small_one
    kind: tool_result
    fill: "x"
    fieldBytes: [12582912, 102400]
    expected:
      - bounded: true
      - bounded: false
  - name: oversized_turn_content_is_bounded_with_a_note
    kind: turn_content
    fill: "x"
    fieldBytes: [9437184]
    expected:
      - bounded: true
        shownBytes: 1048576
        noteContains:
          - "turn content bounded for display"
          - "showing 1.0 MiB of 9.0 MiB"
  # The per-field bound of 1048576 bytes lands one byte inside a three-byte
  # rune, so the cut backs up to 1048575 and the served text stays valid UTF-8.
  - name: multibyte_text_is_cut_on_a_rune_boundary
    kind: tool_result
    fill: "€"
    fieldBytes: [3145728]
    expected:
      - bounded: true
        shownBytes: 1048575
        noteContains:
          - "showing 1.0 MiB of 3.0 MiB"
