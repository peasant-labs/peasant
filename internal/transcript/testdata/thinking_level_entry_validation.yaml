# Entry-boundary thinking-level handling cases. Each case builds one indexed
# entry from its role and raw Extra JSON and drives both the warning collector
# and the shared entries-to-projection boundary. A malformed stored value is
# DROPPED with an actionable warning and served absent (never refused at the
# fold); the warning carries the what/why/where/when/meaning/fix shape and a
# repair hint. Accepted cases carry no warning and are served as recorded.
errorFragments:
  - "thinking-level stored evidence dropped"
  - "  what:"
  - "  why:"
  - "  where: transcript.ThinkingLevelEntryWarnings"
  - "  when:"
  - "  meaning:"
  - "  fix:"
cases:
  - {name: assistant_canonical_served, role: assistant, extra: '{"thinking_level":"off"}', dropped: false, servedLevel: "off"}
  - {name: assistant_canonical_with_raw_served, role: assistant, extra: '{"thinking_level":"high","thinking_level_raw":"High"}', dropped: false, servedLevel: "high", servedRaw: "High"}
  - {name: assistant_raw_only_served, role: assistant, extra: '{"thinking_level_raw":"deep"}', dropped: false, servedRaw: "deep"}
  - {name: absent_no_extra_served, role: user, dropped: false}
  - {name: absent_empty_extra_served, role: user, extra: '{}', dropped: false}
  - {name: user_level_dropped, role: user, extra: '{"thinking_level":"high"}', dropped: true}
  - {name: system_raw_dropped, role: system, extra: '{"thinking_level_raw":"deep"}', dropped: true}
  - {name: tool_level_dropped, role: tool, extra: '{"thinking_level":"high"}', dropped: true}
  - {name: non_string_level_dropped, role: assistant, extra: '{"thinking_level":7}', dropped: true}
  - {name: non_string_raw_dropped, role: assistant, extra: '{"thinking_level_raw":false}', dropped: true}
  - {name: unknown_canonical_dropped, role: assistant, extra: '{"thinking_level":"deep"}', dropped: true}
  - {name: edge_whitespace_raw_dropped, role: assistant, extra: '{"thinking_level_raw":" deep"}', dropped: true}
