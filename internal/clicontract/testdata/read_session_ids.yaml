# ReadSessionIDs cases. input is the exact bytes read; wantIDs is the parsed
# list in order. wantErrContains names text the error must carry (the line or
# index of the fault). wantNoIDs asserts the error is ErrNoSessionIDs: an input
# that names nothing is refused, never read as "all sessions". wantDropped is
# what a review document left out, as id and status; wantNoClean asserts the
# refusal of a document with no clean session.
cases:
  - name: newline_text
    input: |

      aaaaaaaa-0000-4000-8000-000000000001
      # a comment line is skipped

        aaaaaaaa-0000-4000-8000-000000000002
      aaaaaaaa-0000-4000-8000-000000000003
    wantIDs:
      - aaaaaaaa-0000-4000-8000-000000000001
      - aaaaaaaa-0000-4000-8000-000000000002
      - aaaaaaaa-0000-4000-8000-000000000003

  - name: json_array_of_strings
    input: '  ["b-2", "a-1", "c-3"]'
    wantIDs: [b-2, a-1, c-3]

  - name: sessions_list_output
    input: |
      [
        {"id": "a", "date": "2026-10-29", "harness": "claude-code"}
      ]
    wantIDs: [a]

  - name: object_with_session_id_key
    input: '[{"session_id": "s-1", "status": "new"}]'
    wantIDs: [s-1]

  - name: duplicates_collapse
    input: |
      x-2
      x-1
      x-2
      x-3
      x-1
    wantIDs: [x-2, x-1, x-3]

  - name: mixed_shapes_refused
    input: |
      ["a", "b"]
      c
    wantErrContains: line 2

  - name: empty_input_refused
    input: |

      # only a comment

    wantNoIDs: true

  - name: object_without_id_refused
    input: '[{"id": "a"}, {"date": "2026-10-29"}]'
    wantErrContains: index 1

  - name: empty_json_array_refused
    input: '[]'
    wantNoIDs: true

  - name: text_line_with_json_refused
    input: |
      a
      {"id": "b"}
    wantErrContains: line 2

  - name: non_string_element_refused
    input: '["a", 7]'
    wantErrContains: index 1

  - name: session_id_camel_key_in_array
    input: '[{"sessionId": "s-1"}, {"sessionId": "s-2", "note": "no status"}]'
    wantIDs: [s-1, s-2]

  - name: session_id_snake_key_keeps_its_own_status
    input: '[{"session_id": "s-1", "status": "findings"}]'
    wantIDs: [s-1]

  - name: review_document_takes_only_clean
    input: |
      {
        "level": "standard",
        "summary": {"sessions": 3, "clean": 1, "withFindings": 1, "errors": 1, "findings": 1},
        "sessions": [
          {"sessionId": "bad-1", "status": "findings", "reason": "", "findings": [{"kind": "foreign_email"}]},
          {"sessionId": "ok-1", "status": "clean", "reason": "", "findings": []},
          {"sessionId": "bad-2", "status": "error", "reason": "unreadable", "findings": []}
        ],
        "warnings": []
      }
    wantIDs: [ok-1]
    wantDropped:
      - { id: bad-1, status: findings }
      - { id: bad-2, status: error }

  - name: review_document_nothing_clean_refused
    input: '{"sessions": [{"sessionId": "bad-1", "status": "findings"}, {"sessionId": "bad-2", "status": "error"}]}'
    wantNoIDs: true
    wantNoClean: true

  - name: review_entries_keep_the_rule_without_the_document
    input: '[{"sessionId": "bad-1", "status": "findings"}, {"sessionId": "ok-1", "status": "clean"}]'
    wantIDs: [ok-1]
    wantDropped:
      - { id: bad-1, status: findings }

  - name: review_entries_keep_the_rule_beside_another_id_key
    input: '[{"id": "bad-1", "sessionId": "bad-1", "status": "error"}, {"id": "ok-1"}]'
    wantIDs: [ok-1]
    wantDropped:
      - { id: bad-1, status: error }

  - name: review_entries_unknown_status_refused
    input: '[{"sessionId": "s-1", "status": "fine"}]'
    wantErrContains: index 0

  - name: id_both_clean_and_not_clean_is_not_clean
    input: '{"sessions": [{"sessionId": "s-1", "status": "clean"}, {"sessionId": "s-1", "status": "findings"}, {"sessionId": "s-2", "status": "clean"}]}'
    wantIDs: [s-2]
    wantDropped:
      - { id: s-1, status: findings }

  - name: review_document_empty_sessions_refused
    input: '{"sessions": [], "warnings": []}'
    wantNoIDs: true

  - name: review_document_unknown_status_refused
    input: '{"sessions": [{"sessionId": "s-1", "status": "clean"}, {"sessionId": "s-2", "status": "pending"}]}'
    wantErrContains: index 1

  - name: review_document_missing_status_refused
    input: '{"sessions": [{"sessionId": "s-1"}]}'
    wantErrContains: index 0

  - name: review_document_needs_session_id_camel_key
    input: '{"sessions": [{"session_id": "s-1", "status": "clean"}]}'
    wantErrContains: index 0

  - name: object_without_sessions_refused
    input: '{"id": "s-1"}'
    wantErrContains: line 1

  - name: object_with_content_after_it_refused
    input: |
      {"sessions": [{"sessionId": "s-1", "status": "clean"}]}
      {"sessions": [{"sessionId": "s-2", "status": "findings"}]}
    wantErrContains: line 2
