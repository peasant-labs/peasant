  - name: empty-harness-cannot-scope-an-exclusion
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          "":
            exclusions:
              sessions: [11111111-1111-4111-8111-111111111111]
    valid: false
    error_contains:
      - 'selection.harnesses[""]'
      - harness name is empty

  - name: unknown-harness-cannot-scope-an-exclusion
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          unknown-agent:
            exclusions:
              sessions: [11111111-1111-4111-8111-111111111111]
    valid: false
    error_contains:
      - 'selection.harnesses["unknown-agent"]'
      - harness "unknown-agent" is not supported
