declared_rows: 19
cases:
  - name: legacy-selected-yaml-without-exclusions
    document: |
      version: 1
      selection:
        mode: selected
        autoIngestNewBranches: false
        harnesses:
          claude-code:
            projects:
              - clonePaths: [/workspace/garden]
    valid: true
    expected_harnesses: 1
    expected_branch_exclusions: 0
    expected_session_exclusions: 0
    expect_exclusions_key: false

  - name: selected-exact-exclusions-round-trip
    document: |
      version: 1
      selection:
        mode: selected
        autoIngestNewBranches: true
        harnesses:
          claude-code:
            projects:
              - clonePaths: [/workspace/garden]
            exclusions:
              branches:
                - clonePath: /workspace/garden
                  branches: [feature/one, release]
              sessions:
                - 11111111-1111-4111-8111-111111111111
    valid: true
    expected_harnesses: 1
    expected_branch_exclusions: 1
    expected_session_exclusions: 1
    expect_exclusions_key: true

  - name: identical-evidence-is-valid-across-harnesses
    document: |
      version: 1
      selection:
        mode: selected
        autoIngestNewBranches: false
        harnesses:
          claude-code:
            exclusions:
              branches:
                - clonePath: /workspace/garden
                  branches: [main]
              sessions: [11111111-1111-4111-8111-111111111111]
          opencode:
            exclusions:
              branches:
                - clonePath: /workspace/garden
                  branches: [main]
              sessions: [11111111-1111-4111-8111-111111111111]
    valid: true
    expected_harnesses: 2
    expected_branch_exclusions: 2
    expected_session_exclusions: 2
    expect_exclusions_key: true

  - name: exclusions-require-selected-mode
    document: |
      version: 1
      selection:
        mode: all
        autoIngestNewBranches: true
        harnesses:
          claude-code:
            exclusions:
              sessions: [11111111-1111-4111-8111-111111111111]
    valid: false
    error_contains:
      - 'selection.harnesses["claude-code"].exclusions'
      - selection.mode is "all"

  - name: empty-session-id-is-rejected
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          claude-code:
            exclusions:
              sessions: [""]
    valid: false
    error_contains:
      - 'selection.harnesses["claude-code"].exclusions.sessions[0]'
      - session ID is empty

  - name: malformed-session-id-is-rejected
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          claude-code:
            exclusions:
              sessions: [not-a-session-id]
    valid: false
    error_contains:
      - 'selection.harnesses["claude-code"].exclusions.sessions[0]'
      - session ID "not-a-session-id" is malformed

  - name: non-normalized-session-id-is-rejected
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          claude-code:
            exclusions:
              sessions: [" 11111111-1111-4111-8111-111111111111 "]
    valid: false
    error_contains:
      - 'selection.harnesses["claude-code"].exclusions.sessions[0]'
      - is not normalized

  - name: duplicate-session-id-is-rejected
    document: |
      version: 1
      selection:
        mode: selected
        harnesses:
          claude-code:
            exclusions:
              sessions:
                - 11111111-1111-4111-8111-111111111111
                - 11111111-1111-4111-8111-111111111111
    valid: false
    error_contains:
      - 'selection.harnesses["claude-code"].exclusions.sessions[1]'
      - duplicates sessions[0]

