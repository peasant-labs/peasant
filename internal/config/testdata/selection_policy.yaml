declared_rows: 13
cases:
  - name: explicit-session-does-not-select-sibling
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, branches: [main]}]
    explicit_sessions: [11111111-1111-4111-8111-111111111111]
    candidate_remote: https://github.com/other/project.git
    candidate_branch: main
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "rejected"
  - name: explicit-session-selects-itself
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, branches: [main]}]
    explicit_sessions: [11111111-1111-4111-8111-111111111111]
    candidate_remote: https://github.com/other/project.git
    candidate_branch: topic
    candidate_session: 11111111-1111-4111-8111-111111111111
    expected_discovery: "selected"
  - name: ssh-and-https-remotes-normalize
    harness: claude-code
    configured_projects: [{git_remote: "git@github.com:acme/tool.git"}]
    candidate_remote: https://github.com/acme/tool
    candidate_branch: main
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: unknown-branch-fails-explicit-discovery-scope
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, branches: [main]}]
    candidate_remote: https://github.com/acme/tool.git
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "rejected"
  - name: known-new-branch-off
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, branches: [main]}]
    candidate_remote: https://github.com/acme/tool.git
    candidate_branch: topic
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "rejected"
  - name: known-new-branch-on
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, branches: [main]}]
    auto_new_branches: true
    candidate_remote: https://github.com/acme/tool.git
    candidate_branch: topic
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: disabled-harness-is-not-selected
    harness: claude-code
    configured_harness: opencode
    candidate_remote: https://github.com/acme/tool.git
    candidate_branch: main
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "rejected"
  - name: name-only-match
    harness: claude-code
    configured_projects: [{name: local-tool}]
    candidate_project: local-tool
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: name-mismatch
    harness: claude-code
    configured_projects: [{name: local-tool}]
    candidate_project: other-tool
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "rejected"
  - name: remote-and-name-entry-matches-by-name
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, name: local-tool}]
    candidate_project: local-tool
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: remote-wins-over-nonmatching-name
    harness: claude-code
    configured_projects: [{git_remote: https://github.com/acme/tool.git, name: other-tool}]
    candidate_remote: https://github.com/acme/tool.git
    candidate_project: local-tool
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: mode-all-no-op
    harness: claude-code
    mode: all
    candidate_remote: https://github.com/acme/tool.git
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "selected"
  - name: conflicting-project-branches-are-withheld
    harness: claude-code
    configured_projects:
      - {git_remote: https://github.com/acme/tool.git, branches: [main]}
      - {name: tool, branches: [other]}
    candidate_remote: https://github.com/acme/tool.git
    candidate_project: tool
    candidate_branch: main
    candidate_session: 22222222-2222-4222-8222-222222222222
    expected_discovery: "withheld"
