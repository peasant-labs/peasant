# Canonical mounted current-parent navigation fixture.
#
# Three stored sessions in one project give the mounted viewer a real
# context_from source and a real started_by parent, both stored and both
# resolved by the local authorized read. The child additionally carries a
# retained earlier-history partition so the disclosure state can be restored on
# Back. The child's five main records come from one input submission, so the
# served detail separates inputSubmissionCount from turnCount.
#
# The Go mock provider and the real-binary visual smoke both read this one
# file, so a route, link target, or label can never drift between them.
