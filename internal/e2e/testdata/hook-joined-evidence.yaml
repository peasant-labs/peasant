# Evidence for the repository-scoped upload hook, driven against the REAL built
# binary in REAL git repositories. Every value the tests assert on lives here, so
# a contract change is one edit in one file.
#
# Two outcomes, because the hook has two jobs and they fail in opposite
# directions. `publishes` proves the whole chain works. `refuses` proves that when
# a run cannot happen, Git still finishes - a hook that breaks every commit in a
# repository is worse than one that never publishes.
#
# HOW TO READ THE ASSERTED STRINGS. The direction of a check decides how a bad
# value fails, and the two are not equally safe:
#
#   !strings.Contains(output, needle)  an EMPTY needle is a GUARANTEED PASS.
#                                      Contains against "" is always true, so the
#                                      assertion silently stops existing.
#   strings.Contains(output, needle)   an empty needle is a guaranteed FAILURE.
#                                      Noisy, but never silent.
#
# So every value here is validated non-blank by the loader, and any needle that is
# RENDERED rather than read from this file is checked again where it is used - the
# loader can only guard what it reads.
#
# SIX WAYS AN ASSERTION HERE CAN PASS WITHOUT CHECKING ANYTHING. All six have been
# hit for real on this corpus or its neighbours, so none is hypothetical:
#
#   1. An EMPTY needle under a negated check - a guaranteed pass (above).
#   2. A needle DERIVED from code rather than read from this file - outside the
#      loader's reach entirely, since the loader can only guard what it reads.
#      Guarded again at the point of use.
#   3. A forbid pinned to text that NO LONGER EXISTS - it can never match, and
#      because it is a forbid it can never fail either. Forbidden entries are
#      therefore short PHRASES, and each is absent from the code today: they are
#      tripwires whose value comes from being proven to catch a re-introduction,
#      not from failing now.
#   4. An assertion evaluated BEFORE the action that produces the output. Go
#      evaluates arguments left to right, so `return buf.String(), run()` captures
#      an empty buffer. A forbid against an empty buffer always passes.
#   5. A pass caused by the ENVIRONMENT rather than by the code under test.
#   6. A needle that occurs TWICE - found, but not where you think. A short token
#      can match somewhere harmless while the thing it was meant to check is
#      broken. Pin the surrounding phrase, not the token.
#
# Doors 1-3 are handled by the loader and the corpus; 4 and 6 can only be checked
# by looking at real output, so both have been measured rather than assumed.
expectedCaseCount: 2
cases:
  - name: post_commit_publishes_the_configured_repository_to_a_real_village
    outcome: publishes
    # Sessions the configured repository publishes, and sessions a second
    # repository records that must never leave it.
    expected_transcripts: 2
    excluded_transcripts: 2
    # The identifiers the second repository's copy of the committed Claude
    # fixture is renamed onto, so both copies coexist in one store and the
    # exclusion assertion can name the sessions that must stay unpublished.
    second_root_session_id: 7b57cde9-c476-5719-cf8e-6712f3eea916
    second_subagent_session_id: agent-b194171
    # Configured values the real hook run must apply. Public is verified from
    # Village's persisted row rather than from request intent or response text.
    redaction_level: standard
    visibility: public
    identity_basis: worktree-path
    # Published content redaction is asserted by
    # TestPipeline_PublishedBodyIsRedacted, which drives the production pipeline
    # and inspects every part the publisher receives. This joined fixture focuses
    # on installation, execution, and persisted publication evidence.
    install_disclosure_contains:
      - "created"
    disclosure_contains:
      - "pushed 2 session(s), 0 error(s)"
    forbidden_contains:
      - "public visibility is not yet implemented"
      - "downgraded safely to private visibility"
      - "set push.visibility to private"
    warning_contains:
      - "peasant: village upload did not complete"
      - "retry by hand with this exact bound command"
    success_result: "pushed 2 session(s), 0 error(s)"

  - name: pre_push_refuses_an_unsupported_level_without_blocking_the_push
    outcome: refuses
    # pre-push, NOT post-commit, and this is the whole point of the case.
    #
    # Git IGNORES the exit status of post-commit: the commit is already made, so
    # a hook that fails there cannot break anything, and an assertion that "git
    # still succeeded" after a post-commit hook can never fail. Proven by
    # mutation - making the generated hook propagate the upload's exit status
    # left a post-commit version of this case green.
    #
    # Git HONOURS the exit status of pre-push: a non-zero pre-push aborts the
    # push. So pre-push is the only event where "a Peasant failure must not block
    # ordinary Git work" is both at risk and testable.
    event: pre-push
    # The level the hook is installed under, then the level the configuration is
    # edited to afterwards. Installing at an unsupported level is refused
    # outright, so the only way to reach this state is to change the setting
    # after the hook exists - which is exactly what a user does.
    installed_redaction_level: standard
    redaction_level: maximum
    # The refusal must be actionable on a path the user never asked to read: it
    # names the setting to edit AND the value to use, as one contiguous remedy.
    #
    # Checking "redaction.level" and "standard" separately was VACUOUS and is the
    # reason this is one phrase. Measured in the real push output: "standard"
    # occurs 3 times and "minimal" twice, because the message also lists the
    # supported levels. Blanking the recommended value would degrade the remedy to
    # "set redaction.level to  " while leaving both tokens findable elsewhere on
    # the same line, and both separate checks would still pass. Contiguity, not
    # presence, is the property that matters.
    refusal_contains:
      - "redaction level is not supported in this version"
      - "set redaction.level to standard"
      # A correct exit code carrying a false message is the real hazard here. The
      # hook branches on the upload's status, and its generic-failure text claims
      # whatever finished "is on the village and is recorded as published" - which
      # is a lie for a refusal that contacted nothing. This pins the truthful
      # framing; the matching lie is forbidden below.
      - "nothing reached the village"
    # A refusal reaches this surface once per commit, forever, until the setting
    # is fixed. Cobra prints the flag listing on error by default, and a usage
    # dump on every commit is a user-facing defect even when the exit status is
    # right.
    forbidden_contains:
      - "Usage:"
      - "is on the village and is recorded as published"
