cases:
  - id: checkout-local-tag-rewritten
    scenario: annotated-reachable
    rewrite_local_tag: true
    want_success: true
    want_output: "::notice::remote annotated release tag v9.8.7-rc1 peels to protected develop commit"
  - id: checkout-local-tag-points-to-other-commit
    scenario: annotated-reachable-local-other
    rewrite_local_tag_to_other_commit: true
    want_success: true
    want_output: "::notice::remote annotated release tag v9.8.7-rc1 peels to protected develop commit"
  - id: remote-tag-missing
    scenario: missing
    want_output: "remote origin does not advertise refs/tags/v9.8.7-rc1"
  - id: remote-tag-lightweight
    scenario: lightweight
    want_output: "is not an annotated tag (remote object type 'commit')"
  - id: remote-peeled-record-missing
    scenario: peeled-record-missing
    omit_peeled_record: true
    want_output: "remote origin does not advertise peeled record refs/tags/v9.8.7-rc1^{}"
  - id: remote-peeled-record-mismatch
    scenario: peeled-record-mismatch
    replace_peeled_record: true
    want_output: "does not match fetched tag target"
  - id: remote-tag-unreachable-from-develop
    scenario: annotated-unreachable
    want_output: "which is not reachable from protected branch origin/develop"
