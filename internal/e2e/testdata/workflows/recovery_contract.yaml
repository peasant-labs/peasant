workflow:
  path: .github/workflows/release-recovery.yml
  trigger: workflow_dispatch
  inputs:
    - e2e_run_id
    - release_e2e_run_id
    - confirm_tag
    - confirm_commit
    - confirm_recovery_commit
  concurrency_group: release-refs/tags/v0.1.0
  concurrency_cancel_in_progress: "false"
  top_env:
    - key: TAG
      value: v0.1.0
    - key: TAG_REF
      value: refs/tags/v0.1.0
    - key: TAG_OBJECT_SHA
      value: b1f8fe4b9a40ac32c1d7e1a8748cb11575595c4f
    - key: TAG_COMMIT_SHA
      value: 807a1b68c8ec1952db6c289f383f42cbb0701db9
  preflight_env:
    - key: GH_TOKEN
      value: '${{ github.token }}'
      test_value: fixture-token
    - key: RECOVERY_REPOSITORY
      value: '${{ github.repository }}'
      test_value: peasant-labs/peasant
    - key: RECOVERY_EVENT
      value: '${{ github.event_name }}'
      test_value: workflow_dispatch
    - key: RECOVERY_REF
      value: '${{ github.ref }}'
      test_value: refs/heads/develop
    - key: RECOVERY_RUN_ID
      value: '${{ github.run_id }}'
      test_value: "91001"
    - key: RECOVERY_RUN_ATTEMPT
      value: '${{ github.run_attempt }}'
      test_value: "1"
    - key: RECOVERY_ACTOR
      value: '${{ github.actor }}'
      test_value: dayvidpham
    - key: RECOVERY_ACTOR_ID
      value: '${{ github.actor_id }}'
      test_value: "22456875"
    - key: RECOVERY_HEAD_SHA
      value: '${{ github.sha }}'
      test_value: "1111111111111111111111111111111111111111"
    - key: E2E_RUN_ID
      value: '${{ inputs.e2e_run_id }}'
      test_value: "91002"
    - key: RELEASE_E2E_RUN_ID
      value: '${{ inputs.release_e2e_run_id }}'
      test_value: "91003"
    - key: CONFIRM_TAG
      value: '${{ inputs.confirm_tag }}'
      test_value: v0.1.0
    - key: CONFIRM_COMMIT
      value: '${{ inputs.confirm_commit }}'
      test_value: 807a1b68c8ec1952db6c289f383f42cbb0701db9
    - key: CONFIRM_RECOVERY_COMMIT
      value: '${{ inputs.confirm_recovery_commit }}'
      test_value: "1111111111111111111111111111111111111111"
  jobs:
    - job: preflight
      permissions:
        - key: actions
          value: read
        - key: contents
          value: read
    - job: nix-vendor-hash
      permissions:
        - key: contents
          value: read
    - job: release
      permissions:
        - key: actions
          value: read
        - key: contents
          value: write
    - job: smoke
      permissions:
        - key: contents
          value: read
  tag_checkout_jobs:
    - preflight
    - nix-vendor-hash
    - release
  required_source:
    - 'group: release-refs/tags/v0.1.0'
    - 'ref: refs/tags/v0.1.0'
    - 'path: release-src'
    - 'persist-credentials: false'
    - 'GORELEASER_CURRENT_TAG: v0.1.0'
    - 'AUR_KEY: unset-publisher-disabled'
    - 'TAP_GITHUB_TOKEN: unset-publisher-disabled'
    - 'go run ./cmd/release-recovery-verify preflight'
    - 'go run ./cmd/release-recovery-verify pre-publish'
  forbidden_source:
    - 'actions: write'
    - 'actions/create-github-app-token'
    - 'secrets.'
    - 'gh release create'
    - 'git tag '
    - 'git push '
    - 'git update-ref'
    - 'git tag -d'
preflight_cases:
  - name: accepts_exact_evidence
    mutation: none
  - name: rejects_wrong_repository_id
    mutation: wrong_repository_id
    want_error: repository identity or default branch differs
  - name: rejects_wrong_dispatch_actor
    mutation: wrong_dispatch_actor
    want_error: dispatcher is not the fixed recovery operator
  - name: rejects_mismatched_recovery_head
    mutation: mismatched_recovery_head
    want_error: executing recovery commit is missing, malformed, or differs
  - name: rejects_recovery_run_head_drift
    mutation: recovery_run_head_drift
    want_error: GitHub run metadata differs from the fixed first-attempt develop dispatch
  - name: rejects_missing_recovery_confirmation
    mutation: missing_recovery_confirmation
    want_error: executing recovery commit is missing, malformed, or differs
  - name: rejects_prior_recovery_dispatch
    mutation: prior_recovery_dispatch
    want_error: current run is not the only recovery workflow dispatch
  - name: rejects_stale_operator_permission
    mutation: stale_operator_permission
    want_error: no longer has admin or maintain permission
  - name: rejects_same_named_branch
    mutation: same_named_branch
    want_error: ref name is ambiguous
  - name: rejects_moved_tag_object
    mutation: moved_tag_object
    want_error: no longer points to the reviewed annotated tag object
  - name: rejects_changed_ruleset
    mutation: changed_ruleset
    want_error: differs from the reviewed App-only policy
  - name: rejects_wrong_original_workflow
    mutation: wrong_original_workflow
    want_error: differs from the reviewed App-created startup failure
  - name: rejects_original_jobs
    mutation: original_has_job
    want_error: original run contains executable job records
  - name: rejects_wrong_gate_sha
    mutation: wrong_gate_sha
    gate: e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_wrong_gate_actor
    mutation: wrong_gate_actor
    gate: e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_wrong_gate_workflow
    mutation: wrong_gate_workflow
    gate: e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_second_gate_attempt
    mutation: second_gate_attempt
    gate: e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_zero_gate_jobs
    mutation: zero_gate_jobs
    gate: e2e
    want_error: did not produce exactly one successful first-attempt production job
  - name: rejects_failed_critical_step
    mutation: failed_critical_step
    gate: e2e
    want_error: critical gate step is missing or did not succeed
  - name: rejects_stale_gate
    mutation: stale_gate
    gate: e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_release_e2e_wrong_sha
    mutation: wrong_gate_sha
    gate: release_e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_release_e2e_wrong_actor
    mutation: wrong_gate_actor
    gate: release_e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_release_e2e_wrong_workflow
    mutation: wrong_gate_workflow
    gate: release_e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_release_e2e_second_attempt
    mutation: second_gate_attempt
    gate: release_e2e
    want_error: supplied gate run is stale or differs
  - name: rejects_release_e2e_zero_jobs
    mutation: zero_gate_jobs
    gate: release_e2e
    want_error: did not produce exactly one successful first-attempt production job
  - name: rejects_release_e2e_failed_critical_step
    mutation: failed_critical_step
    gate: release_e2e
    want_error: critical gate step is missing or did not succeed
  - name: rejects_expired_recovery
    mutation: expired_recovery
    want_error: outside its approved time window
  - name: rejects_draft_created_during_preflight
    mutation: draft_release
    want_error: release record already exists
release_absence_cases:
  - name: accepts_no_release
    mutation: none
  - name: rejects_draft
    mutation: draft_release
    want_error: release record already exists
  - name: rejects_partial_assets
    mutation: partial_release
    want_error: release record already exists
  - name: rejects_published_endpoint
    mutation: published_release_endpoint
    want_error: existing release for the immutable tag
  - name: rejects_unbounded_first_page
    mutation: full_release_page
    want_error: first release page is full
pre_publish_cases:
  - name: accepts_exact_state
    mutation: none
  - name: rejects_remote_tag_moved_after_preflight
    mutation: moved_tag_object
    want_error: no longer points to the reviewed annotated tag object
  - name: rejects_concurrent_redispatch_after_preflight
    mutation: prior_recovery_dispatch
    want_error: current run is not the only recovery workflow dispatch
  - name: rejects_partial_release_after_preflight
    mutation: partial_release
    want_error: release record already exists
publisher_cases:
  - name: accepts_both_disabled
    mutation: none
  - name: rejects_enabled_aur
    mutation: enabled_aur
    want_error: aurs skip_upload is not the exact string true
  - name: rejects_enabled_homebrew
    mutation: enabled_homebrew
    want_error: homebrew_casks skip_upload is not the exact string true
  - name: rejects_unquoted_boolean
    mutation: unquoted_aur_boolean
    want_error: aurs skip_upload is not the exact string true
