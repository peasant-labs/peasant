# GitHub Release publication contract for .github/workflows/release.yml.
#
# Publish: release assets reach a GitHub Release only through the five-step
# release-intent publish-release job, built from the pinned infra commit
# before downloading release-dist, under tag-keyed concurrency with
# cancel-in-progress: false and gated on verify-tag without status functions.
#
# Staging: the build job turns GoReleaser's dist into one flat dist/assets
# directory, because publish-release requires flat regular files there, and
# keeps the release notes beside it rather than inside it. The cases run the
# build job's two staging steps against a fake GoReleaser dist. The metadata
# list repeats the one in the "Verify the staged release assets" step of
# release.yml; change both together.
workflow: .github/workflows/release.yml
publish:
  job: publish
  concurrency_group: "release-${{ github.ref }}"
  verify_job: verify-tag
  needs:
    - guard
    - verify-tag
    - build
  runs_on: ubuntu-latest
  permissions:
    - key: contents
      value: write
  job_env:
    - key: TAG
      value: "${{ github.ref_name }}"
  infra_ref: db8f1938e9a67a40914c2ab0a232ebc2243adaac
  steps:
    - Check out release-intent
    - Set up Go
    - Build release-intent
    - Download the release artifacts
    - Publish GitHub Release
  allowed_actions:
    - actions/checkout
    - actions/setup-go
    - actions/download-artifact
  tool_checkout_step: Check out release-intent
  tool_checkout_with:
    - key: repository
      value: peasant-labs/infra
    - key: ref
      value: db8f1938e9a67a40914c2ab0a232ebc2243adaac
    - key: path
      value: infra-tool
    - key: sparse-checkout
      value: tools/release
    - key: persist-credentials
      value: "false"
  setup_go_step: Set up Go
  setup_go_with:
    - key: go-version-file
      value: infra-tool/tools/release/go.mod
    - key: cache
      value: "false"
  build_step: Build release-intent
  build_env:
    - key: GOWORK
      value: "off"
  build_run: 'go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent'
  download_step: Download the release artifacts
  download_with:
    - key: name
      value: release-dist
    - key: path
      value: dist
  publish_step: Publish GitHub Release
  publish_env:
    - key: GH_TOKEN
      value: "${{ github.token }}"
    - key: PRERELEASE
      value: "${{ needs.guard.outputs.prerelease }}"
    - key: LATEST
      value: "${{ needs.guard.outputs.latest }}"
  publish_run: '"${RUNNER_TEMP}/release-intent" publish-release --tag "$TAG" --repo "$GITHUB_REPOSITORY" --assets dist/assets --notes dist/release-notes.md --prerelease "$PRERELEASE" --latest "$LATEST"'
  forbidden_commands:
    - gh release create
    - gh release upload
    - gh release edit
    - gh release list
    - --rehearse
staging:
  job: build
  # The staging steps read the notes name from this build-job env variable.
  notes_env: RELEASE_NOTES
  # The checksummed names below must be exactly what this GoReleaser config
  # renders for version; a test derives them from its name templates.
  goreleaser_config: .goreleaser.yml
  # How GoReleaser names its output, for rendering the config: archive
  # formats named by their extension, the bare binary format (with an .exe
  # suffix on Windows), and nfpm packages, which are built for Linux only.
  goreleaser_names:
    extension_formats: [tar.gz, zip]
    binary_format: binary
    exe_goos: windows
    exe_suffix: .exe
    package_goos: linux
  version: 1.2.3
  stage_step: Stage the release assets in one flat directory
  verify_step: Verify the staged release assets
  notes: release-notes.md
  checksums: checksums.txt
  checksummed:
    - peasant_1.2.3_darwin_amd64.tar.gz
    - peasant_1.2.3_darwin_arm64.tar.gz
    - peasant_1.2.3_linux_amd64.deb
    - peasant_1.2.3_linux_amd64.rpm
    - peasant_1.2.3_linux_amd64.tar.gz
    - peasant_1.2.3_linux_arm64.deb
    - peasant_1.2.3_linux_arm64.rpm
    - peasant_1.2.3_linux_arm64.tar.gz
    - peasant_1.2.3_windows_amd64.exe
    - peasant_1.2.3_windows_amd64.zip
  metadata:
    - CHANGELOG.md
    - artifacts.json
    - config.yaml
    - metadata.json
  build_outputs:
    - peasant_linux_amd64_v1/peasant
    - peasant_windows_amd64_v1/peasant.exe
    - homebrew/Casks/peasant.rb
  cases:
    - name: goreleaser output stages flat
      want_ok: true
    - name: unchecksummed top-level file
      add_top_level: [stray.txt]
      want_ok: false
    - name: missing metadata file
      remove: [config.yaml]
      want_ok: false
    - name: asset changed after checksums
      corrupt: [peasant_1.2.3_linux_amd64.deb]
      want_ok: false
