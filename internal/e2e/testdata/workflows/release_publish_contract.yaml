# GitHub Release publication contract for .github/workflows/release.yml.
#
# Publish: one gh release create makes the draft and uploads every asset to
# that same release, so no second creator or upload action can fill a release
# that is never published. The listed steps are the publish job's complete
# step list, in order.
#
# Staging: the build job turns GoReleaser's dist into one flat dist/assets
# directory, because gh release create refuses a directory, and keeps the
# release notes beside it rather than inside it. The cases run the build
# job's two staging steps against a fake GoReleaser dist. The metadata list
# repeats the one in the "Verify the staged release assets" step of
# release.yml; change both together.
workflow: .github/workflows/release.yml
publish:
  job: publish
  steps:
    - Download the release artifacts
    - Look for an existing release
    - Verify the existing release is complete
    - Refuse an existing release for the tag
    - Create the draft release with its assets
    - Verify the draft before publishing
    - Publish the release
    - Verify the published release
  create_step: Create the draft release with its assets
  create_run_contains:
    - --draft
    - --verify-tag
    - --notes-file dist/release-notes.md
    - "'dist/assets/*'"
  allowed_actions:
    - actions/download-artifact
  forbidden_commands:
    - gh release upload
  # One contract per publish step; every name in steps above must have one.
  # A step with unconditional runs with no if:. continue_on_error is the
  # only step allowed to set it.
  step_contracts:
    - name: Download the release artifacts
      unconditional: true
    - name: Look for an existing release
      id: view
      unconditional: true
      continue_on_error: true
      run_contains: ['gh release view "$TAG" --repo "$GITHUB_REPOSITORY"']
    - name: Verify the existing release is complete
      if_contains: ["steps.view.outcome == 'success'"]
      run_contains: [--json isDraft,assets]
    - name: Refuse an existing release for the tag
      id: list
      if_contains: ["steps.view.outcome == 'failure'"]
      if_excludes: [steps.list, steps.create]
      run_contains: [gh release list, --limit 100, select(.tagName == env.TAG)]
    - name: Create the draft release with its assets
      id: create
      if_contains: ["steps.view.outcome == 'failure'", "steps.list.outcome == 'success'"]
      run_contains: [--draft, --verify-tag, --prerelease="$PRERELEASE"]
      run_excludes: [--latest, --draft=false]
    - name: Verify the draft before publishing
      if_contains: ["steps.view.outcome == 'failure'", "steps.create.outcome == 'success'"]
      run_contains: [--json isDraft,assets, .isDraft != true]
    - name: Publish the release
      if_contains: ["steps.view.outcome == 'failure'", "steps.create.outcome == 'success'"]
      run_contains: [gh release edit, --draft=false, --prerelease="$PRERELEASE", --latest="$LATEST"]
      run_excludes: [--draft=true]
    - name: Verify the published release
      if_contains: ["steps.view.outcome == 'failure'", "steps.create.outcome == 'success'"]
      run_contains: [--json isDraft,assets, .isDraft != false]

# Each release-state check runs its step's real script with a stubbed gh that
# requires exactly args before the final --jq filter and then applies that
# filter with jq. required is the deletion-protection manifest of case names.
view_checks:
  - step: Verify the existing release is complete
    args: release view v1.2.3 --repo peasant-labs/peasant --json isDraft,assets --jq
    required:
      - complete-published-release
      - draft-with-assets
      - published-without-assets
      - missing-draft-state
      - invalid-assets
      - non-json-response
      - api-failure
    cases:
      - name: complete-published-release
        response: '{"isDraft":false,"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 0
        expected_output: existing release is published and has assets
      - name: draft-with-assets
        response: '{"isDraft":true,"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: 'release is an unpublished draft; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; do not create a new tag'
      - name: published-without-assets
        response: '{"isDraft":false,"assets":[]}'
        expected_exit: 1
        expected_output: published release has no assets; tags are never moved, so fix forward with a new tag
      - name: missing-draft-state
        response: '{"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: release draft status is invalid; inspect the release before retrying
      - name: invalid-assets
        response: '{"isDraft":false,"assets":null}'
        expected_exit: 1
        expected_output: published release assets are invalid; inspect the release before retrying
      - name: non-json-response
        response: not-json
        expected_exit: 1
        expected_output: parse error
      - name: api-failure
        api_exit: 1
        expected_exit: 1
        expected_output: mock API unavailable
  - step: Refuse an existing release for the tag
    args: release list --repo peasant-labs/peasant --limit 100 --json tagName,isDraft --jq
    required:
      - no-release-for-tag
      - published-release-for-tag
      - draft-for-tag
      - non-json-response
      - api-failure
    cases:
      - name: no-release-for-tag
        response: '[{"tagName":"v1.2.2","isDraft":false},{"tagName":"v1.2.3-rc1","isDraft":true}]'
        expected_exit: 0
        expected_output: no release or draft exists for this tag
      - name: published-release-for-tag
        response: '[{"tagName":"v1.2.3","isDraft":false}]'
        expected_exit: 1
        expected_output: 'a release or draft already exists for this tag, so nothing was created; list the drafts with gh api repos/$GITHUB_REPOSITORY/releases, delete stale drafts by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
      - name: draft-for-tag
        response: '[{"tagName":"v1.2.3","isDraft":true}]'
        expected_exit: 1
        expected_output: a release or draft already exists for this tag, so nothing was created
      - name: non-json-response
        response: not-json
        expected_exit: 1
        expected_output: parse error
      - name: api-failure
        api_exit: 1
        expected_exit: 1
        expected_output: mock API unavailable
  - step: Verify the draft before publishing
    args: release view v1.2.3 --repo peasant-labs/peasant --json isDraft,assets --jq
    required:
      - draft-with-assets
      - draft-without-assets
      - draft-with-invalid-assets
      - published-instead-of-draft
      - missing-draft-state
      - non-json-response
      - api-failure
    cases:
      - name: draft-with-assets
        response: '{"isDraft":true,"assets":[{"name":"checksums.txt"},{"name":"peasant_1.2.3_linux_amd64.tar.gz"}]}'
        expected_exit: 0
        expected_output: draft holds 2 assets
      - name: draft-without-assets
        response: '{"isDraft":true,"assets":[]}'
        expected_exit: 1
        expected_output: &draft-refused 'the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
      - name: draft-with-invalid-assets
        response: '{"isDraft":true,"assets":null}'
        expected_exit: 1
        expected_output: *draft-refused
      - name: published-instead-of-draft
        response: '{"isDraft":false,"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: *draft-refused
      - name: missing-draft-state
        response: '{"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: *draft-refused
      - name: non-json-response
        response: not-json
        expected_exit: 1
        expected_output: parse error
      - name: api-failure
        api_exit: 1
        expected_exit: 1
        expected_output: mock API unavailable
  - step: Verify the published release
    args: release view v1.2.3 --repo peasant-labs/peasant --json isDraft,assets --jq
    required:
      - published-with-assets
      - still-a-draft
      - published-without-assets
      - invalid-assets
      - missing-draft-state
      - non-json-response
      - api-failure
    cases:
      - name: published-with-assets
        response: '{"isDraft":false,"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 0
        expected_output: release is published and holds 1 assets
      - name: still-a-draft
        response: '{"isDraft":true,"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: &publish-refused 'the release did not publish with its assets; inspect it with gh release view $TAG, and fix forward with a new tag rather than moving this one'
      - name: published-without-assets
        response: '{"isDraft":false,"assets":[]}'
        expected_exit: 1
        expected_output: *publish-refused
      - name: invalid-assets
        response: '{"isDraft":false,"assets":null}'
        expected_exit: 1
        expected_output: *publish-refused
      - name: missing-draft-state
        response: '{"assets":[{"name":"checksums.txt"}]}'
        expected_exit: 1
        expected_output: *publish-refused
      - name: non-json-response
        response: not-json
        expected_exit: 1
        expected_output: parse error
      - name: api-failure
        api_exit: 1
        expected_exit: 1
        expected_output: mock API unavailable
staging:
  job: build
  # The staging steps read the notes name from this build-job env variable.
  notes_env: RELEASE_NOTES
  # The checksummed names below must be exactly what this GoReleaser config
  # renders for version; a test derives them from its name templates.
  goreleaser_config: .goreleaser.yml
  # How GoReleaser names its output, for rendering the config: archive
  # formats named by their extension, the bare binary format (with an .exe
  # suffix on Windows), and nfpm packages, which are built for Linux only.
  goreleaser_names:
    extension_formats: [tar.gz, zip]
    binary_format: binary
    exe_goos: windows
    exe_suffix: .exe
    package_goos: linux
  version: 1.2.3
  stage_step: Stage the release assets in one flat directory
  verify_step: Verify the staged release assets
  notes: release-notes.md
  checksums: checksums.txt
  checksummed:
    - peasant_1.2.3_darwin_amd64.tar.gz
    - peasant_1.2.3_darwin_arm64.tar.gz
    - peasant_1.2.3_linux_amd64.deb
    - peasant_1.2.3_linux_amd64.rpm
    - peasant_1.2.3_linux_amd64.tar.gz
    - peasant_1.2.3_linux_arm64.deb
    - peasant_1.2.3_linux_arm64.rpm
    - peasant_1.2.3_linux_arm64.tar.gz
    - peasant_1.2.3_windows_amd64.exe
    - peasant_1.2.3_windows_amd64.zip
  metadata:
    - CHANGELOG.md
    - artifacts.json
    - config.yaml
    - metadata.json
  build_outputs:
    - peasant_linux_amd64_v1/peasant
    - peasant_windows_amd64_v1/peasant.exe
    - homebrew/Casks/peasant.rb
  cases:
    - name: goreleaser output stages flat
      want_ok: true
    - name: unchecksummed top-level file
      add_top_level: [stray.txt]
      want_ok: false
    - name: missing metadata file
      remove: [config.yaml]
      want_ok: false
    - name: asset changed after checksums
      corrupt: [peasant_1.2.3_linux_amd64.deb]
      want_ok: false
