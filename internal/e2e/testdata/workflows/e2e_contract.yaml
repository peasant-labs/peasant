expected_village_ref: 4d48936be9be8e8c52ef2c04eaa5fcc6369ff82a
e2e:
  required_triggers:
    - push
    - workflow_dispatch
    - workflow_call
  required_paths:
    - internal/e2e/**
    - internal/ingest/**
    - internal/pull/**
    - internal/push/**
    - cmd/**
    - go.mod
    - go.sum
    - Makefile
    - .github/workflows/e2e.yml
  parity_step: Verify schema module pin parity
  parity_run_contains: make e2e-schema-parity
  parity_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_step: make e2e
  driver_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_contains:
    - E2E_MEMORY_MODE=external
    - make e2e
    - E2E_TEST_FLAGS=-v
  asserted_tests:
    - TestPiRoundTripE2E
    - TestSkipGateE2E
    - TestPullRoundTripE2E
    - TestHarnessRefreshE2E
    - TestPublicationConvergenceE2E
    - TestPostCommitHookPublishesConfiguredRepositoryToRealVillage
    - TestPrePushHookRefusesUnsupportedRedactionWithoutBlockingThePush
  cleanup_required_statuses:
    - status=exited
    - status=stopped
  cleanup_forbidden_statuses:
    - value: status=dead
      reason: podman 4.9 rejects the Docker-only dead state
    - value: status=created
      reason: a newly created sibling stack may still be starting
    - value: status=running
      reason: a running sibling stack must never be removed
  # The warm-stack driver is pinned directly to the amd64 Blacksmith runner, not
  # routed through determine-runner: rootless podman and the disposable Village
  # stack do not come up inside the self-hosted pool containers, so a pool
  # landing leaves the harness t.Skip()ing and the gate failing with no coverage.
  # The harness provisions an amd64-only Village stack, so the label must never
  # be an arm64 one.
  driver_runner: blacksmith-4vcpu-ubuntu-2404
  driver_forbidden_runner_substring: "-arm"
  driver_forbidden_router: determine-runner
release:
  parity_step: Verify schema module pin parity
  parity_run_contains: make e2e-schema-parity
  parity_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_step: Run release per-distro e2e driver
  driver_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_contains:
    - go test -race
    - -tags=e2e
    - -count=1
    - TestReleasePerDistro
  output_guards:
    - no tests to run
    - "--- SKIP: TestReleasePerDistro"
    - "--- PASS: TestReleasePerDistro"
release_guard:
  workflow: .github/workflows/release.yml
  job: guard
  job_if_condition: github.event_name == 'push'
  required_pr_branches:
    - develop
  required_pr_paths:
    - .github/workflows/release.yml
    - .github/workflows/e2e.yml
    - .github/workflows/release-e2e.yml
    - .github/workflows/release-validate.yml
  required_job_permissions:
    - key: contents
      value: read
  required_job_env:
    - key: TAG
      value: '${{ github.ref_name }}'
  actor_step: Verify release tag actor
  actor_env:
    - key: RELEASE_ACTOR
      value: '${{ github.actor }}'
    - key: RELEASE_ACTOR_ID
      value: '${{ github.actor_id }}'
    - key: EXPECTED_RELEASE_ACTOR
      value: peasant-labs-releaser[bot]
    - key: EXPECTED_RELEASE_ACTOR_ID
      value: "291504229"
  actor_run: |-
    if [ "$RELEASE_ACTOR" != "$EXPECTED_RELEASE_ACTOR" ] || [ "$RELEASE_ACTOR_ID" != "$EXPECTED_RELEASE_ACTOR_ID" ]; then
      echo "::error::release tag ${TAG} was pushed by ${RELEASE_ACTOR} (${RELEASE_ACTOR_ID}), not the peasant-labs-releaser App. Create releases only by merging a protected release PR."
      exit 1
    fi
  checkout_step: Checkout repository (full history + tags)
  parse_step: Parse + classify the tag
  checkout_fetch_depth: "0"
  checkout_fetch_tags: "true"
reusable_callers:
  - workflow: .github/workflows/release.yml
    jobs:
      - job: e2e
        uses: ./.github/workflows/e2e.yml
        permissions:
          - key: contents
            value: read
      - job: release-e2e
        uses: ./.github/workflows/release-e2e.yml
        permissions:
          - key: contents
            value: read
      - job: validate-packaging
        uses: ./.github/workflows/release-validate.yml
        needs: guard
        if_contains:
          - contains(github.ref_name, '-rc')
        permissions:
          - key: contents
            value: read
  - workflow: .github/workflows/release-pr.yml
    jobs:
      - job: tests
        uses: ./.github/workflows/tests.yml
        needs: [validate]
        if_contains:
          - startsWith(github.event.pull_request.title, 'release(')
          - contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
          - github.event.label.name == 'full-gate'
        permissions:
          - key: contents
            value: read
          - key: checks
            value: read
          - key: pull-requests
            value: read
      - job: e2e
        uses: ./.github/workflows/e2e.yml
        needs: [validate, changes]
        if_contains:
          - startsWith(github.event.pull_request.title, 'release(')
          - contains(fromJSON('["opened","reopened"]'), github.event.action)
          - needs.changes.outputs.e2e != 'false'
          - needs.changes.result != 'success'
          - needs.validate.result == 'success'
          - github.event.label.name == 'full-gate'
        permissions:
          - key: contents
            value: read
      - job: release-validate
        uses: ./.github/workflows/release-validate.yml
        needs: [validate, changes]
        if_contains:
          - startsWith(github.event.pull_request.title, 'release(')
          - contains(fromJSON('["opened","reopened"]'), github.event.action)
          - needs.changes.outputs.release_validate != 'false'
          - needs.changes.result != 'success'
          - needs.validate.result == 'success'
          - github.event.label.name == 'full-gate'
        permissions:
          - key: contents
            value: read
release_validate:
  workflow: .github/workflows/release-validate.yml
  required_triggers:
    - workflow_call
  forbidden_triggers:
    - pull_request
  # The snapshot producer is pinned directly to the amd64 Blacksmith runner, not
  # routed through determine-runner: the pool keeps a runner's workspace between
  # jobs and an earlier container run leaves root-owned dist/ that goreleaser's
  # --clean cannot unlink. The install jobs still route through the router.
  snapshot_job: snapshot
  snapshot_runner: blacksmith-4vcpu-ubuntu-2404
  snapshot_forbidden_router: determine-runner
tests_workflow:
  triggers:
    - pull_request
    - push
  required_paths:
    - .github/workflows/**
    - .github/release-guard.policy.yml
  post_merge_evidence:
    job: post-merge-evidence
    job_if_condition: github.event_name == 'push'
    required_permissions:
      - key: checks
        value: read
      - key: pull-requests
        value: read
    output: skip
    step: Prove the merged tree already passed the checks
    step_id: evidence
    command: scripts/post-merge-evidence
    check_needs: post-merge-evidence
