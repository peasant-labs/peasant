expected_village_ref: 750e84719cb8e50f6557cca2cd4d12829311eda3
e2e:
  required_triggers:
    - push
    - workflow_dispatch
    - workflow_call
  required_paths:
    - internal/e2e/**
    - internal/ingest/**
    - internal/pull/**
    - internal/push/**
    - cmd/**
    - go.mod
    - go.sum
    - Makefile
    - .github/workflows/e2e.yml
  parity_step: Verify schema module pin parity
  parity_run_contains: make e2e-schema-parity
  parity_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_step: make e2e
  driver_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_contains:
    - go test -race
    - -tags=e2e
    - -count=1
  asserted_tests:
    - TestSkipGateE2E
    - TestPullRoundTripE2E
    - TestHarnessRefreshE2E
    - TestPublicationConvergenceE2E
    - TestPostCommitHookPublishesConfiguredRepositoryToRealVillage
    - TestPrePushHookRefusesUnsupportedRedactionWithoutBlockingThePush
  cleanup_required_statuses:
    - status=exited
    - status=stopped
  cleanup_forbidden_statuses:
    - value: status=dead
      reason: podman 4.9 rejects the Docker-only dead state
    - value: status=created
      reason: a newly created sibling stack may still be starting
    - value: status=running
      reason: a running sibling stack must never be removed
release:
  parity_step: Verify schema module pin parity
  parity_run_contains: make e2e-schema-parity
  parity_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_step: Run release per-distro e2e driver
  driver_env:
    key: VILLAGE_REPO
    value: '${{ github.workspace }}/_village'
  driver_contains:
    - go test -race
    - -tags=e2e
    - -count=1
    - TestReleasePerDistro
  output_guards:
    - no tests to run
    - "--- SKIP: TestReleasePerDistro"
    - "--- PASS: TestReleasePerDistro"
release_guard:
  workflow: .github/workflows/release.yml
  job: guard
  job_if_condition: github.event_name == 'push'
  required_pr_branches:
    - develop
  required_pr_paths:
    - .github/workflows/release.yml
    - .github/workflows/e2e.yml
    - .github/workflows/release-e2e.yml
    - .github/workflows/release-validate.yml
  step: Final-release guard (initial final or green same-version rc)
  if_condition: steps.parse.outputs.kind == 'final'
  initial_final: v0.1.0
  expected_run: 'go run github.com/peasant-labs/schema/cmd/release-guard check-final --tag "$TAG" --initial-final v0.1.0'
  required_job_permissions:
    - key: contents
      value: read
    - key: actions
      value: read
  required_job_env:
    - key: TAG
      value: '${{ github.ref_name }}'
    - key: GH_TOKEN
      value: '${{ github.token }}'
  actor_step: Verify release tag actor
  actor_env:
    - key: RELEASE_ACTOR
      value: '${{ github.actor }}'
    - key: RELEASE_ACTOR_ID
      value: '${{ github.actor_id }}'
    - key: EXPECTED_RELEASE_ACTOR
      value: peasant-labs-releaser[bot]
    - key: EXPECTED_RELEASE_ACTOR_ID
      value: "291504229"
  actor_run: |-
    if [ "$RELEASE_ACTOR" != "$EXPECTED_RELEASE_ACTOR" ] || [ "$RELEASE_ACTOR_ID" != "$EXPECTED_RELEASE_ACTOR_ID" ]; then
      echo "::error::release tag ${TAG} was pushed by ${RELEASE_ACTOR} (${RELEASE_ACTOR_ID}), not the peasant-labs-releaser App. Create releases only by merging a protected release PR."
      exit 1
    fi
  checkout_step: Checkout repository (full history + tags)
  parse_step: Parse + classify the tag
  checkout_fetch_depth: "0"
  checkout_fetch_tags: "true"
reusable_callers:
  - workflow: .github/workflows/release.yml
    jobs:
      - job: e2e
        permissions:
          - key: contents
            value: read
      - job: release-e2e
        permissions:
          - key: contents
            value: read
      - job: validate-packaging
        permissions:
          - key: contents
            value: read
  - workflow: .github/workflows/release-pr.yml
    jobs:
      - job: tests
        permissions:
          - key: contents
            value: read
      - job: e2e
        permissions:
          - key: contents
            value: read
      - job: release-validate
        permissions:
          - key: contents
            value: read
release_validate:
  workflow: .github/workflows/release-validate.yml
  required_paths:
    - .goreleaser.yml
    - .github/workflows/release.yml
    - .github/workflows/release-e2e.yml
    - .github/workflows/release-pr.yml
    - .github/workflows/release-validate.yml
    - scripts/install-goreleaser
    - scripts/goreleaser-v2.17.1-homebrew.patch
    - flake.nix
    - flake.lock
    - go.mod
    - go.sum
    - web/package.json
    - web/pnpm-lock.yaml
    - "**.go"
    - Makefile
tests_workflow:
  triggers:
    - pull_request
    - push
  required_paths:
    - .github/workflows/**
    - .github/release-guard.policy.yml
