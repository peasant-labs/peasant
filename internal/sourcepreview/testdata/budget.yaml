# The web preview's budgets, by name and value, read by TestBudgets
# (internal/sourcepreview/budget_test.go). The values ARE the contract here:
# changing one changes how much a preview reads, holds or sends, so the fixture
# states each value and the test compares it with the constant production
# uses. The capture itself takes every bound as an option; these are the
# values the web surface passes, not package defaults.
#
# unboundedOptions are the options a surface passes to keep today's unbounded
# terminal behaviour: zero source cap and zero turn cap. The test proves they
# validate and that they are not the web's.
#
# requiredNames names the budgets that must stay present.
requiredNames:
  - first-read-bytes
  - continuation-read-bytes
  - segment-budget-bytes
  - frame-cap-bytes
  - web-source-cap-bytes
  - web-serialized-cap-bytes
  - web-turn-cap
  - web-live-captures
  - web-parse-workers
  - web-idle-seconds
budgets:
  - {name: first-read-bytes, value: 262144}
  - {name: continuation-read-bytes, value: 8388608}
  - {name: segment-budget-bytes, value: 1048576}
  - {name: frame-cap-bytes, value: 4194304}
  # 16 MiB. The web capture re-parses its whole loaded prefix on every read,
  # and a re-parse briefly needs about 5.5 times the prefix (the live
  # expansion factor BenchmarkCaptureWebHeap measures with GOGC 10). The rule:
  # the transient peak stays at or under 128 MiB. 16 MiB peaked at about
  # 92 MiB; 24 MiB at about 132 MiB, over it; 32 MiB at about 172 MiB. The
  # serialized cap matches the source cap.
  - {name: web-source-cap-bytes, value: 16777216}
  - {name: web-serialized-cap-bytes, value: 16777216}
  - {name: web-turn-cap, value: 20000}
  - {name: web-live-captures, value: 2}
  - {name: web-parse-workers, value: 1}
  - {name: web-idle-seconds, value: 300}
unboundedOptions: {sourceCapBytes: 0, turnCap: 0}
