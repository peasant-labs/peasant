cases:
  - name: exact_observed_model_capability
    response:
      annotationSchemaVersion: "1.0"
      pushContractVersion: "0.1.1"
      minPushContractVersion: "0.1.0"
      contentCapabilities:
        - capability: observed_model
          version: "1.0.0"
    supportsObservedModel: true
  - name: legacy_response_without_capabilities
    response:
      annotationSchemaVersion: "1.0"
      pushContractVersion: "0.1.1"
      minPushContractVersion: "0.1.0"
    supportsObservedModel: false
  - name: unknown_capability_does_not_authorize
    response:
      annotationSchemaVersion: "1.0"
      pushContractVersion: "0.1.1"
      minPushContractVersion: "0.1.0"
      contentCapabilities:
        - capability: future_evidence
          version: "1.0.0"
    supportsObservedModel: false
  - name: wrong_observed_model_version_does_not_authorize
    response:
      annotationSchemaVersion: "1.0"
      pushContractVersion: "0.1.1"
      minPushContractVersion: "0.1.0"
      contentCapabilities:
        - capability: observed_model
          version: "2.0.0"
    supportsObservedModel: false
