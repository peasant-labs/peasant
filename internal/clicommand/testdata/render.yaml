# Rendering cases for the neutral command vocabulary. Every expected string is
# the exact byte sequence a hook header, a recovery line, or a pasted command
# carries today; changing one changes what users see and what hooks run.
render:
  - name: unbound
    binding: {}
    root: ""
    prefix: "peasant"
    manualPush: "peasant village push"
  - name: unbound-scoped
    binding: {}
    root: /tmp/repository
    prefix: "peasant"
    manualPush: "peasant village push --repository '/tmp/repository'"
  - name: every-path-bound-in-flag-order
    binding: {configPath: /tmp/c/config.yaml, configDir: /tmp/c, dataDir: /tmp/d, stateDir: /tmp/s}
    root: /tmp/repository
    prefix: "peasant --config '/tmp/c/config.yaml' --config-dir '/tmp/c' --data-dir '/tmp/d' --state-dir '/tmp/s'"
    manualPush: "peasant --config '/tmp/c/config.yaml' --config-dir '/tmp/c' --data-dir '/tmp/d' --state-dir '/tmp/s' village push --repository '/tmp/repository'"
  - name: space-and-apostrophe-stay-one-argument
    binding: {dataDir: "/tmp/bound data"}
    root: "/tmp/it's here"
    prefix: "peasant --data-dir '/tmp/bound data'"
    manualPush: "peasant --data-dir '/tmp/bound data' village push --repository '/tmp/it'\\''s here'"
quote:
  - {name: plain, value: /tmp/repository, quoted: "'/tmp/repository'"}
  - {name: empty, value: "", quoted: "''"}
  - {name: space, value: "/tmp/my repo", quoted: "'/tmp/my repo'"}
  - {name: apostrophe, value: "it's", quoted: "'it'\\''s'"}
  - {name: dollar-and-backtick-stay-literal, value: "$HOME/`x`", quoted: "'$HOME/`x`'"}
unquoteVerbatim:
  - {name: unquoted-value, value: /tmp/repository}
  - {name: lone-quote, value: "'"}
  - {name: open-quote-only, value: "'/tmp/repository"}
