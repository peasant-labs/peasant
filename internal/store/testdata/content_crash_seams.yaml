# content_crash_seams — the harmonized session content model crash-seam family
# (design llm/peasant--harmonized-content-model.md section 10, ratified revision 17).
#
# Each case interrupts the writer at one seam and asserts exactly the old or
# the new generation is visible, detail parity holds, and the next harvest
# clears the flag and the orphans. `seam` names the writer seam;
# `batch_bytes` forces budget-split staging where the seam needs more than
# one staging transaction (empty means the shipped budget).
abandonedMarker: big
recoveryMarker: recovered
batchSessionIDs:
  - e4e4e4e4-e4e4-44e4-84e4-e4e4e4e4e4e4
  - f5f5f5f5-f5f5-45f5-85f5-f5f5f5f5f5f5
earlierSessionID: c4c4c4c4-c4c4-44c4-84c4-c4c4c4c4c4c4
cases:
  - name: after-prepare
    seam: after-prepare
  - name: after-sweep-flag
    seam: after-sweep-flag
    expected_sweep_flag: false
    expected_staged_bodies: 0
  - name: between-stage-txns
    seam: between-stage-txns
    batch_bytes: 64
    expected_sweep_flag: true
    expected_staged_bodies: 1
  - name: before-commit
    seam: before-commit
  - name: commit-rollback
    seam: at-commit
  - name: mid-activation-batch
    seam: mid-activation-batch
    expected_batch_committed: false
    expected_sweep_flag: true
  - name: savepoint-isolation
  - name: after-commit-before-sweep
    seam: after-commit
  - name: mid-sweep-batch
