# Named local-owner and claim-log cases from peasant-labs/peasant#890. Each case
# is driven by typed steps and asserts per-artifact owner pointers ("first",
# "second", "third", or "null") against the ordered claim entries. The names
# guard the set in both directions; owner_test.go decodes this file strictly.
#
# The four automatic-claim B1 cases live in internal/ingest/testdata because
# they exercise the pipeline's FirstStored write flag, not the store. The
# already-signed-in notice case lives in cmd/peasant/testdata because it counts
# two interactive runs, not store rows.
requiredNames:
  - owner-created-without-village-login
  - owner-survives-sign-out
  - owner-second-row-refused
  - claim-default-unclaimed-only
  - claim-all-retains-earlier-entries
  - claim-all-counts-only-moved
  - claim-username-snapshot-only
  - claim-username-reuse-different-uuid
  - claim-reassign-other-account-retains-entries
  - claim-default-nothing-to-move-appends-entry
  - claim-empty-store-appends-entry
  - claim-never-touches-pulled-transcripts
  - claim-harvest-covers-entry-targets
  - auto-claim-leaves-other-account-rows
  - auto-claim-leaves-other-account-annotations
  - auto-claim-after-reassign-back
  - auto-claim-after-own-manual-claim
  - auto-claim-after-own-automatic-then-manual
  - auto-claim-follows-insertion-order-after-clock-step
  - auto-claim-reuses-newest-automatic
  - ownership-counts-two-accounts
  - ownership-counts-signed-out
  - ownership-counts-annotations-three-way
  - claim-annotations-never-moves-other-account

cases:
  - name: owner-created-without-village-login
    steps:
      - {kind: ensureOwner, nowMs: 1000}
      - {kind: ensureOwner, nowMs: 2000}
    expect:
      ownerStable: true
      ownerRows: 1
      ownerFile: true
      credentialsAbsent: true

  - name: owner-survives-sign-out
    steps:
      - {kind: ensureOwner, nowMs: 1000}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 2000}
      - {kind: signOut}
      - {kind: ensureOwner, nowMs: 3000}
    expect:
      ownerStable: true
      ownerRows: 1

  - name: owner-second-row-refused
    steps:
      - {kind: ensureOwner, nowMs: 1000}
      - {kind: insertSecondOwner, wantError: "exactly one row"}
    expect:
      ownerRows: 1

  - name: claim-default-unclaimed-only
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c], annotations: [owner-session-a, owner-session-b]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
      - {kind: claimDefault, source: manual, nowMs: 3000}
    expect:
      claimCount: 2
      claimSources: [automatic, manual]
      sessions:
        owner-session-a: first
        owner-session-b: second
        owner-session-c: second
      annotations:
        owner-session-a: first
        owner-session-b: second

  - name: claim-all-retains-earlier-entries
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: claimAll, source: manual, nowMs: 2000}
    expect:
      claimCount: 2
      claimSources: [manual, manual]
      sessions:
        owner-session-a: second
        owner-session-b: second

  - name: claim-all-counts-only-moved
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c, owner-session-d, owner-session-e, owner-session-f, owner-session-g, owner-session-h, owner-session-i, owner-session-j, owner-session-k, owner-session-l]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a, owner-session-b, owner-session-c], source: automatic, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimSessions, sessions: [owner-session-d, owner-session-e, owner-session-f, owner-session-g], source: automatic, nowMs: 2000}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimAll, source: manual, nowMs: 3000}
    expect:
      claimCount: 3
      claimed: 9
      alreadyClaimed: 3
      claimUserIDs: [one, two, one]
      claimSources: [automatic, automatic, manual]

  - name: claim-username-snapshot-only
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: one, username: alice-renamed}
      - {kind: claimAll, source: manual, nowMs: 2000}
    expect:
      claimCount: 2
      claimUsernames: [alice, alice-renamed]
      claimUserIDs: [one, one]
      sessions:
        owner-session-a: second

  - name: claim-username-reuse-different-uuid
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: shared-name}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: two, username: shared-name}
      - {kind: claimAll, source: manual, nowMs: 2000}
    expect:
      claimCount: 2
      claimUsernames: [shared-name, shared-name]
      claimUserIDs: [one, two]
      sessions:
        owner-session-a: second

  - name: claim-reassign-other-account-retains-entries
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimAll, source: manual, nowMs: 2000}
    expect:
      claimCount: 2
      claimUserIDs: [one, two]
      sessions:
        owner-session-a: second

  - name: claim-never-touches-pulled-transcripts
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: seedPulled}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimAll, source: manual, nowMs: 2000}
    expect:
      pulledUnchanged: true
      sessions:
        owner-session-a: first

  - name: claim-harvest-covers-entry-targets
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b], annotations: [owner-session-a, owner-session-b], entryAnnotations: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
    expect:
      claimCount: 1
      annotations:
        owner-session-a: first
        entry:owner-session-a: first
        owner-session-b: "null"

  - name: auto-claim-leaves-other-account-rows
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: seed, sessions: [owner-session-d, owner-session-e]}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimSessions, sessions: [owner-session-b, owner-session-d], source: automatic, nowMs: 2000}
      - {kind: claimSessions, sessions: [owner-session-e], source: automatic, nowMs: 3000}
    expect:
      claimCount: 2
      claimUserIDs: [one, two]
      sessions:
        owner-session-a: first
        owner-session-b: first
        owner-session-c: first
        owner-session-d: second
        owner-session-e: second

  - name: claim-default-nothing-to-move-appends-entry
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: claimDefault, source: manual, nowMs: 2000}
    expect:
      claimCount: 2
      claimSources: [manual, manual]
      sessions:
        owner-session-a: first

  - name: claim-empty-store-appends-entry
    steps:
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
    expect:
      claimCount: 1
      claimSources: [manual]

  - name: auto-claim-leaves-other-account-annotations
    steps:
      - {kind: seed, sessions: [owner-session-a], annotations: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
    expect:
      claimCount: 2
      claimUserIDs: [one, two]
      sessions:
        owner-session-a: first
      annotations:
        owner-session-a: first

  - name: auto-claim-after-reassign-back
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimAll, source: manual, nowMs: 2000}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 3000}
    expect:
      claimCount: 3
      claimSources: [manual, manual, automatic]
      claimUserIDs: [one, two, one]
      sessions:
        owner-session-a: second

  - name: auto-claim-after-own-manual-claim
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
    expect:
      claimCount: 2
      claimSources: [manual, automatic]
      sessions:
        owner-session-a: first

  - name: auto-claim-after-own-automatic-then-manual
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 1000}
      - {kind: claimSessions, sessions: [owner-session-b], source: manual, nowMs: 2000}
      - {kind: claimSessions, sessions: [owner-session-c], source: automatic, nowMs: 3000}
    expect:
      claimCount: 3
      claimSources: [automatic, manual, automatic]
      claimUserIDs: [one, one, one]
      sessions:
        owner-session-a: first
        owner-session-b: second
        owner-session-c: third

  - name: auto-claim-follows-insertion-order-after-clock-step
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimSessions, sessions: [owner-session-b], source: manual, nowMs: 1000}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-c], source: automatic, nowMs: 1500}
    expect:
      claimCount: 3
      claimSources: [automatic, manual, automatic]
      claimUserIDs: [one, two, one]
      sessions:
        owner-session-a: first
        owner-session-b: second
        owner-session-c: third

  - name: auto-claim-reuses-newest-automatic
    steps:
      - {kind: seed, sessions: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 1000}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 2000}
    expect:
      claimCount: 1
      claimSources: [automatic]
      sessions:
        owner-session-a: first

  - name: ownership-counts-two-accounts
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimSessions, sessions: [owner-session-a], source: automatic, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimSessions, sessions: [owner-session-b], source: automatic, nowMs: 2000}
      - {kind: signIn, user: one, username: alice}
    expect:
      ownership:
        sessions: {total: 3, unclaimed: 1, mine: 1, others: 1}
        annotations: {total: 0, unclaimed: 0, mine: 0, others: 0}

  - name: ownership-counts-signed-out
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signOut}
    expect:
      ownership:
        sessions: {total: 2, unclaimed: 0, mine: 0, others: 2}
        annotations: {total: 0, unclaimed: 0, mine: 0, others: 0}

  - name: ownership-counts-annotations-three-way
    steps:
      - {kind: seed, sessions: [owner-session-a, owner-session-b, owner-session-c], annotations: [owner-session-a, owner-session-b, owner-session-c]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimAnnotations, annotations: [owner-session-a], source: automatic, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimAnnotations, annotations: [owner-session-b], source: automatic, nowMs: 2000}
      - {kind: signIn, user: one, username: alice}
    expect:
      claimCount: 2
      ownership:
        sessions: {total: 3, unclaimed: 3, mine: 0, others: 0}
        annotations: {total: 3, unclaimed: 1, mine: 1, others: 1}

  - name: claim-annotations-never-moves-other-account
    steps:
      - {kind: seed, sessions: [owner-session-a], annotations: [owner-session-a]}
      - {kind: signIn, user: one, username: alice}
      - {kind: claimDefault, source: manual, nowMs: 1000}
      - {kind: signIn, user: two, username: bob}
      - {kind: claimAnnotations, annotations: [owner-session-a], source: automatic, nowMs: 2000}
    expect:
      claimCount: 2
      claimUserIDs: [one, two]
      annotations:
        owner-session-a: first
