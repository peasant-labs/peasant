# One stored state per case. The test seeds the named state on top of the
# synthetic managed source and asserts the named refusal reason; nothing may
# change.
cases:
  - name: non-active-source-is-refused
    state: non_active_source
    reason: source-not-active
  - name: file-backed-source-is-refused
    state: file_backed_row
    reason: source-unsupported
  - name: latest-attempt-is-refused
    state: latest_attempt
    reason: latest-attempt-held
  - name: missing-harmonized-row-is-refused
    state: missing_catalog_row
    reason: source-unsupported
