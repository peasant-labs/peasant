# The V73 upgrade folds every stored session once. A session with entries takes
# the folded conversation count; a session whose entries are gone copies the
# legacy value and is named in the migration report, even when that value is
# NULL (unknown, not a measured zero).
expectedCaseCount: 4
requiredNames:
  - entryful_native_folds_its_conversation_turns
  - entryless_native_copies_the_legacy_value
  - null_legacy_value_is_unknown_not_a_measured_zero
  - entryful_legacy_session_is_folded_too
sessions:
  - name: entryful_native_folds_its_conversation_turns
    sessionID: 11111111-1111-4111-8111-111111111111
    activeGeneration: true
    legacyTurnCount: 9
    # A managed generation, not a native mirror: every entry carries a source
    # reference and the assistant row has no stored preview. The reader still
    # serves it (a ref-addressed turn survives an empty preview), so the served
    # detail reports the user turn plus the assistant turn. expected is that
    # detail turn count.
    entries:
      - {index: 0, role: user, entryType: text, depth: 0, content: "run the checks"}
      - {index: 1, role: system, entryType: text, depth: 0, content: "mode: normal"}
      - {index: 2, role: assistant, entryType: text, depth: 0, content: ""}
    expected: 2
  - name: entryless_native_copies_the_legacy_value
    sessionID: 22222222-2222-4222-8222-222222222222
    activeGeneration: true
    legacyTurnCount: 4
    expected: 4
    reportedEntryLess: true
  - name: null_legacy_value_is_unknown_not_a_measured_zero
    sessionID: 33333333-3333-4333-8333-333333333333
    activeGeneration: true
    legacyTurnCount: null
    expected: 0
    reportedEntryLess: true
  - name: entryful_legacy_session_is_folded_too
    sessionID: 44444444-4444-4444-8444-444444444444
    activeGeneration: false
    legacyTurnCount: 6
    entries:
      - {index: 0, role: user, entryType: text, depth: 0, content: "run the checks"}
      - {index: 1, role: assistant, entryType: text, depth: 0, content: "done"}
    expected: 2
