# Owned-root filesystem safety oracle: a symlink at any ancestor inside the
# owned root cannot redirect staging, reading, repair, removal or locking
# outside the root. Recursive removal verifies owned identity first and
# preserves unrelated content. No diagnostic exposes the private root path.
session:
  id: "88888888-8888-4888-8888-888888888888"
  harness: claude-code
generation:
  complete_id: gen_fs_g1
  inactive_id: gen_fs_old
cases:
  - name: session-symlink-preserves-external-sentinel
    ancestor: session
  - name: generations-symlink-preserves-external-sentinel
    ancestor: generations
  - name: unrelated-file-preserved-on-cleanup
    ancestor: unrelated
  - name: lock-namespace-confined
    ancestor: locks
sentinel:
  outside_file: sentinel-outside-do-not-delete
  unrelated_file: sentinel-unrelated-keep
