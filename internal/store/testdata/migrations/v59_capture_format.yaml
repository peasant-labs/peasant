      - "INSERT INTO sessions (session_id,model_harness,model_id,opaque_host_id,project_hash,start_ms,end_ms,ingested_ms,source_path,source_format) VALUES ('11111111-1111-4111-8111-111111111111','claude-code','fixture-model','fixture-host','fixture-project',1,2,3,'/fixture/a.jsonl','jsonl')"
      - "INSERT INTO sessions (session_id,model_harness,model_id,opaque_host_id,project_hash,start_ms,end_ms,ingested_ms,source_path,source_format) VALUES ('22222222-2222-4222-8222-222222222222','claude-code','fixture-model','fixture-host','fixture-project',1,2,3,'/fixture/b.jsonl','jsonl')"
      - "INSERT INTO sessions (session_id,model_harness,model_id,opaque_host_id,project_hash,start_ms,end_ms,ingested_ms,source_path,source_format) VALUES ('33333333-3333-4333-8333-333333333333','claude-code','fixture-model','fixture-host','fixture-project',1,2,3,'/fixture/c.jsonl','jsonl')"
      - "INSERT INTO sessions (session_id,model_harness,model_id,opaque_host_id,project_hash,start_ms,end_ms,ingested_ms,source_path,source_format) VALUES ('44444444-4444-4444-8444-444444444444','claude-code','fixture-model','fixture-host','fixture-project',1,2,3,'/fixture/d.jsonl','jsonl')"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_revision,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('11111111-1111-4111-8111-111111111111','complete','new_ingest',1,'full-content-v1',3,3,'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',41,NULL,NULL,7)"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_revision,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('22222222-2222-4222-8222-222222222222','complete','peasant_snapshot',2,'full-source-v1',5,5,'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',42,NULL,NULL,9)"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_revision,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('33333333-3333-4333-8333-333333333333','incomplete','none',0,'preview-only-v50',2,0,NULL,43,NULL,NULL,0)"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_revision,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('44444444-4444-4444-8444-444444444444','incomplete','none',0,'legacy-preview-only-v52',1,0,NULL,44,'legacy_preview_only','Full content has not been captured; run harvest index --force with retained artifacts.',0)"
    assertions:
      # The three canonical formats each survive the rename with their mapping.
      - {query: "SELECT capture_format FROM session_content_captures WHERE session_id='11111111-1111-4111-8111-111111111111'", want: full}
      - {query: "SELECT capture_format FROM session_content_captures WHERE session_id='22222222-2222-4222-8222-222222222222'", want: full}
      - {query: "SELECT capture_format FROM session_content_captures WHERE session_id='33333333-3333-4333-8333-333333333333'", want: preview_only}
      - {query: "SELECT capture_format FROM session_content_captures WHERE session_id='44444444-4444-4444-8444-444444444444'", want: legacy_preview_only}
      # The unconstrained predecessor column is gone.
      - {query: "SELECT COUNT(*) FROM pragma_table_info('session_content_captures') WHERE name='capture_revision'", want: '0'}
      - {query: "SELECT COUNT(*) FROM pragma_table_info('session_content_captures') WHERE name='capture_format'", want: '1'}
      # The status index is recreated by the rebuild.
      - {query: "SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_session_content_captures_status' AND tbl_name='session_content_captures'", want: '1'}
      # Every other retained fact is preserved byte-for-byte.
      - {query: "SELECT status || ':' || source_authority || ':' || transcript_origin || ':' || entry_count || ':' || content_row_count || ':' || full_capture_sha256 || ':' || captured_at_ms || ':' || publication_capture_revision FROM session_content_captures WHERE session_id='11111111-1111-4111-8111-111111111111'", want: 'complete:new_ingest:1:3:3:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:41:7'}
      - {query: "SELECT status || ':' || source_authority || ':' || transcript_origin || ':' || entry_count || ':' || failure_code || ':' || failure_message FROM session_content_captures WHERE session_id='44444444-4444-4444-8444-444444444444'", want: 'incomplete:none:0:1:legacy_preview_only:Full content has not been captured; run harvest index --force with retained artifacts.'}
      - {query: 'SELECT COUNT(*) FROM pragma_foreign_key_check', want: '0'}
      - {query: 'PRAGMA foreign_keys', want: '1'}
    rejects:
      # The rebuilt column is a closed set; every neighbouring constraint stays.
      - "UPDATE session_content_captures SET capture_format='full-content-v1'"
      - "UPDATE session_content_captures SET capture_format='preview-only-v50'"
      - "UPDATE session_content_captures SET capture_format=''"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_format,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('55555555-5555-4555-8555-555555555555','incomplete','none',0,'not-a-capture-format',0,0,NULL,45,NULL,NULL,0)"
      - "UPDATE session_content_captures SET status='not-a-status' WHERE session_id='33333333-3333-4333-8333-333333333333'"
      - "UPDATE session_content_captures SET source_authority='not-an-authority' WHERE session_id='33333333-3333-4333-8333-333333333333'"
      - "UPDATE session_content_captures SET status='complete' WHERE session_id='33333333-3333-4333-8333-333333333333'"
      - "UPDATE session_content_captures SET publication_capture_revision=-1 WHERE session_id='33333333-3333-4333-8333-333333333333'"
      - "UPDATE session_content_captures SET full_capture_sha256='short' WHERE session_id='33333333-3333-4333-8333-333333333333'"

  - name: unmapped_capture_value_fails_migration
    migrationFails: true
    # The refusal must roll back completely: the user repairs the offending row
    # from the predecessor schema, so that row, that column and that index must
    # all survive, and the rebuild scratch table must not be left behind.
    failedAssertions:
      - {query: "SELECT capture_revision FROM session_content_captures WHERE session_id='66666666-6666-4666-8666-666666666666'", want: unrecognised-capture-tag}
      - {query: "SELECT status || ':' || source_authority || ':' || entry_count || ':' || captured_at_ms FROM session_content_captures WHERE session_id='66666666-6666-4666-8666-666666666666'", want: 'incomplete:none:0:46'}
      - {query: "SELECT COUNT(*) FROM pragma_table_info('session_content_captures') WHERE name='capture_format'", want: '0'}
      - {query: "SELECT COUNT(*) FROM sqlite_master WHERE name='session_content_captures_v58'", want: '0'}
      - {query: "SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_session_content_captures_status'", want: '1'}
    # The refusal must be answerable: which row, which value, what to do next.
    failedOpenMessage:
      - "66666666-6666-4666-8666-666666666666"
      - "unrecognised-capture-tag"
      - "peasant harvest index --force"
    seed:
      - "INSERT INTO projects (project_hash, canonical_cwd) VALUES ('fixture-project', '/fixture/project')"
      - "INSERT INTO host_slugs (opaque_id, host_slug) VALUES ('fixture-host', 'fixture-host')"
      - "INSERT INTO sessions (session_id,model_harness,model_id,opaque_host_id,project_hash,start_ms,end_ms,ingested_ms,source_path,source_format) VALUES ('66666666-6666-4666-8666-666666666666','claude-code','fixture-model','fixture-host','fixture-project',1,2,3,'/fixture/e.jsonl','jsonl')"
      - "INSERT INTO session_content_captures (session_id,status,source_authority,transcript_origin,capture_revision,entry_count,content_row_count,full_capture_sha256,captured_at_ms,failure_code,failure_message,publication_capture_revision) VALUES ('66666666-6666-4666-8666-666666666666','incomplete','none',0,'unrecognised-capture-tag',0,0,NULL,46,NULL,NULL,0)"

