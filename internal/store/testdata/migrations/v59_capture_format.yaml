      - {query: "SELECT COUNT(*) FROM pragma_table_info('session_content_captures') WHERE name='capture_format'", want: '0'}
      - {query: "SELECT COUNT(*) FROM sqlite_master WHERE name='session_content_captures_v58'", want: '0'}
    failedOpenMessage:
      - "77777777-7777-4777-8777-777777777777"
