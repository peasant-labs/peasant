declared_records: 4
declared_rejections: 5

# Records the store must hold and return unchanged.
records:
  - name: root transcript with an identity and two spawns
    source_path: /home/example/.claude/projects/-workspace/11111111-1111-4111-8111-111111111111.jsonl
    scope: root
    mod_time_unix_nano: 1750000000000000001
    size_bytes: 4096
    has_conversation: true
    identity_team: migration
    identity_name: tests
    spawns:
      - team: migration
        name: tests
      - team: migration
        name: docs
    title: coordinate work
    branch: main
    cwd: /workspace

  - name: root transcript with an ambiguous identity keeps no identity
    source_path: /home/example/.claude/projects/-workspace/22222222-2222-4222-8222-222222222222.jsonl
    scope: root
    mod_time_unix_nano: 1750000000000000002
    size_bytes: 128
    has_conversation: true
    spawns: []
    title: write tests
    branch: ""
    cwd: /workspace

  - name: root transcript without a conversation record
    source_path: /home/example/.claude/projects/-workspace/33333333-3333-4333-8333-333333333333.jsonl
    scope: root
    mod_time_unix_nano: 1750000000000000003
    size_bytes: 0
    has_conversation: false
    spawns: []
    title: ""
    branch: ""
    cwd: ""

  - name: subagent transcript carries only the conversation answer
    source_path: /home/example/.claude/projects/-workspace/11111111-1111-4111-8111-111111111111/subagents/agent-a3aee4f.jsonl
    scope: subagent
    mod_time_unix_nano: 1750000000000000004
    size_bytes: 512
    has_conversation: true
    spawns: []
    title: ""
    branch: ""
    cwd: ""

# Rows the table must refuse, so a wrong value can never reach discovery.
rejections:
  - name: unknown scope
    sql: >-
      INSERT INTO claude_transcript_evidence
      (source_path, scope, mod_time_unix_nano, size_bytes, has_conversation, spawns_json, title, branch, cwd)
      VALUES ('/tmp/a.jsonl', 'teammate', 1, 1, 1, '[]', '', '', '')
  - name: negative size
    sql: >-
      INSERT INTO claude_transcript_evidence
      (source_path, scope, mod_time_unix_nano, size_bytes, has_conversation, spawns_json, title, branch, cwd)
      VALUES ('/tmp/b.jsonl', 'root', 1, -1, 1, '[]', '', '', '')
  - name: conversation flag outside the closed set
    sql: >-
      INSERT INTO claude_transcript_evidence
      (source_path, scope, mod_time_unix_nano, size_bytes, has_conversation, spawns_json, title, branch, cwd)
      VALUES ('/tmp/c.jsonl', 'root', 1, 1, 2, '[]', '', '', '')
  - name: spawn list that is not JSON
    sql: >-
      INSERT INTO claude_transcript_evidence
      (source_path, scope, mod_time_unix_nano, size_bytes, has_conversation, spawns_json, title, branch, cwd)
      VALUES ('/tmp/d.jsonl', 'root', 1, 1, 1, 'not json', '', '', '')
  - name: half an identity
    sql: >-
      INSERT INTO claude_transcript_evidence
      (source_path, scope, mod_time_unix_nano, size_bytes, has_conversation, identity_team, spawns_json, title, branch, cwd)
      VALUES ('/tmp/e.jsonl', 'root', 1, 1, 1, 'migration', '[]', '', '', '')
