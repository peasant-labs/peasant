# Per-state parent-lane cases. Every case names one stored child and the
# evidence, managed-metadata snapshot, and availability-cache inputs that decide
# its projection. The same rows drive the V70 backfill test (seeded on the
# predecessor schema) and the per-state drift test (seeded through the
# production writers and the managed metadata writer), so the two cannot
# describe different states.
#
# The ONE rule, from LogicalParentSQL:
#   - evidence in the generation scope (started_by OR context_from) is
#     authoritative; an explicit none or a context_from-only row is a root, and
#     a snapshot or cache value cannot override it;
#   - with no evidence at all, the managed metadata ParentUUID snapshot answers,
#     then the sessions.parent_id availability cache.
#
# evidenceState is "" for a generation with no started_by evidence, otherwise one
# of the five stored target states. evidenceKind defaults to started_by.
#
# cacheParent is "" for a NULL sessions.parent_id, otherwise "target" for a
# stored parent row.
#
# snapshot is "" for no managed metadata parentUuid, otherwise "snapshot" for
# the unstored snapshot parent. evidenceTarget is "" for no target local
# identifier, "target" for the stored parent row, or "unstored" for a logical
# parent the store does not hold; the last case is a child that still resolves.
target: 1a1a1a1a-1a1a-4a1a-8a1a-1a1a1a1a1a1a
unstored: 2b2b2b2b-2b2b-4b2b-8b2b-2b2b2b2b2b2b
snapshot: 3d3d3d3d-3d3d-4d3d-8d3d-3d3d3d3d3d3d
cases:
  - name: root-no-evidence
    child: 3c3c3c3c-3c3c-4c3c-8c3c-3c3c3c3c3c3c
    evidenceState: ""
    evidenceTarget: ""
    cacheParent: ""
    snapshot: ""
    wantState: root
    wantResolvedParent: ""
  - name: root-explicit-none
    child: 4d4d4d4d-4d4d-4d4d-8d4d-4d4d4d4d4d4d
    evidenceState: explicit_none
    evidenceTarget: ""
    cacheParent: ""
    snapshot: ""
    wantState: root
    wantResolvedParent: ""
  - name: root-explicit-none-despite-snapshot-and-cache
    child: 5d5d5d5d-5d5d-4d5d-8d5d-5d5d5d5d5d5d
    evidenceState: explicit_none
    evidenceTarget: ""
    cacheParent: target
    snapshot: snapshot
    wantState: root
    wantResolvedParent: ""
  - name: root-context-from-only-despite-snapshot
    child: 6d6d6d6d-6d6d-4d6d-8d6d-6d6d6d6d6d6d
    evidenceKind: context_from
    evidenceState: target_known
    evidenceTarget: target
    cacheParent: target
    snapshot: snapshot
    wantState: root
    wantResolvedParent: ""
  - name: resolved-evidence-target
    child: 5e5e5e5e-5e5e-4e5e-8e5e-5e5e5e5e5e5e
    evidenceState: target_known
    evidenceTarget: target
    cacheParent: ""
    snapshot: ""
    wantState: resolved
    wantResolvedParent: target
  - name: resolved-retained-target
    child: 6f6f6f6f-6f6f-4f6f-8f6f-6f6f6f6f6f6f
    evidenceState: target_known_retained
    evidenceTarget: target
    cacheParent: ""
    snapshot: ""
    wantState: resolved
    wantResolvedParent: target
  - name: resolved-cache-fallback
    child: 7a7a7a7a-7a7a-4a7a-8a7a-7a7a7a7a7a7a
    evidenceState: ""
    evidenceTarget: ""
    cacheParent: target
    snapshot: ""
    wantState: resolved
    wantResolvedParent: target
  - name: resolved-snapshot-cache-null
    child: 8a8a8a8a-8a8a-4a8a-8a8a-8a8a8a8a8a8a
    evidenceState: ""
    evidenceTarget: ""
    cacheParent: ""
    snapshot: snapshot
    wantState: resolved
    wantResolvedParent: snapshot
  - name: resolved-snapshot-beats-cache
    child: 9b9b9b9b-9b9b-4b9b-8b9b-9b9b9b9b9b9b
    evidenceState: ""
    evidenceTarget: ""
    cacheParent: target
    snapshot: snapshot
    wantState: resolved
    wantResolvedParent: snapshot
  - name: resolved-inactive-evidence-snapshot-decides
    child: 0c0c0c0c-0c0c-4c0c-8c0c-0c0c0c0c0c0c
    evidenceState: ""
    evidenceTarget: ""
    cacheParent: ""
    snapshot: snapshot
    inactiveEvidence: true
    wantState: resolved
    wantResolvedParent: snapshot
  - name: resolved-unstored-parent
    child: 8b8b8b8b-8b8b-4b8b-8b8b-8b8b8b8b8b8b
    evidenceState: target_known
    evidenceTarget: unstored
    cacheParent: ""
    snapshot: ""
    wantState: resolved
    wantResolvedParent: unstored
  - name: unresolved-unknown-with-cache
    child: 9c9c9c9c-9c9c-4c9c-8c9c-9c9c9c9c9c9c
    evidenceState: unknown
    evidenceTarget: ""
    cacheParent: target
    snapshot: ""
    wantState: unresolved
    wantResolvedParent: ""
  - name: unresolved-conflicting
    child: 0d0d0d0d-0d0d-4d0d-8d0d-0d0d0d0d0d0d
    evidenceState: conflicting_current_native_evidence
    evidenceTarget: ""
    cacheParent: ""
    snapshot: ""
    wantState: unresolved
    wantResolvedParent: ""
rejections:
  - name: null-state
    stateLiteral: "NULL"
  - name: unknown-state
    stateLiteral: "'not-a-parent-state'"
