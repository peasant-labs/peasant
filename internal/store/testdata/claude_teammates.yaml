# Claude Code teammate identity, read from the stored transcript evidence cache.
#
# Each case seeds the sessions and the cached root-transcript evidence it names,
# then asks the store for the subject session's teammate. A case's `want_present`
# says whether that one session may carry an identity: the identity is evidence
# (a parent transcript that records spawning that exact team and agent), never a
# guess from a parent link, a team name, or another harness's parentage.
requiredNames:
  - positive-spawn-edge
  - parent-without-spawn
  - same-team-different-name
  - non-claude-child
  - missing-parent
cases:
  - name: positive-spawn-edge
    subject: 22222222-2222-4222-8222-222222222222
    sessions:
      - id: 11111111-1111-4111-8111-111111111111
        harness: claude-code
        source_path: /captured/11111111-1111-4111-8111-111111111111.jsonl
        identity: { team: migration, name: lead }
        spawns:
          - { team: migration, name: tests }
      - id: 22222222-2222-4222-8222-222222222222
        harness: claude-code
        source_path: /captured/22222222-2222-4222-8222-222222222222.jsonl
        parent_id: 11111111-1111-4111-8111-111111111111
        identity: { team: migration, name: tests }
    want_present: true
    want_teammate: { team: migration, name: tests }

  - name: parent-without-spawn
    subject: 22222222-2222-4222-8222-222222222222
    sessions:
      - id: 11111111-1111-4111-8111-111111111111
        harness: claude-code
        source_path: /captured/11111111-1111-4111-8111-111111111111.jsonl
        identity: { team: migration, name: lead }
      - id: 22222222-2222-4222-8222-222222222222
        harness: claude-code
        source_path: /captured/22222222-2222-4222-8222-222222222222.jsonl
        parent_id: 11111111-1111-4111-8111-111111111111
        identity: { team: migration, name: tests }
    want_present: false

  - name: same-team-different-name
    subject: 22222222-2222-4222-8222-222222222222
    sessions:
      - id: 11111111-1111-4111-8111-111111111111
        harness: claude-code
        source_path: /captured/11111111-1111-4111-8111-111111111111.jsonl
        identity: { team: migration, name: lead }
        spawns:
          - { team: migration, name: reviewer }
      - id: 22222222-2222-4222-8222-222222222222
        harness: claude-code
        source_path: /captured/22222222-2222-4222-8222-222222222222.jsonl
        parent_id: 11111111-1111-4111-8111-111111111111
        identity: { team: migration, name: tests }
    want_present: false

  - name: non-claude-child
    subject: 22222222-2222-4222-8222-222222222222
    sessions:
      - id: 11111111-1111-4111-8111-111111111111
        harness: claude-code
        source_path: /captured/11111111-1111-4111-8111-111111111111.jsonl
        identity: { team: migration, name: lead }
        spawns:
          - { team: migration, name: tests }
      # Another harness's child: the parent transcript still records the spawn,
      # and the child carries an identity record, but the child is not Claude
      # Code, so the teammate identity is never projected onto it.
      - id: 22222222-2222-4222-8222-222222222222
        harness: codex
        source_path: /captured/22222222-2222-4222-8222-222222222222.jsonl
        parent_id: 11111111-1111-4111-8111-111111111111
        identity: { team: migration, name: tests }
    want_present: false

  - name: missing-parent
    subject: 22222222-2222-4222-8222-222222222222
    sessions:
      # A spawner discovery could not resolve leaves its child parentless while
      # the child's own transcript still declares the identity. With no stored
      # parent there is no transcript that records the spawn, so there is no
      # teammate.
      - id: 22222222-2222-4222-8222-222222222222
        harness: claude-code
        source_path: /captured/22222222-2222-4222-8222-222222222222.jsonl
        identity: { team: migration, name: tests }
    want_present: false
