cases:
  - {name: acquired-evidence, eventSeq: 41, origin: agent, wantCursor: 41, wantOrigin: agent}
  # A resolver already judged this row and recorded the rule version it judged
  # at. session_origin and origin_version are one verdict moved by one
  # statement, so adapter evidence may not replace half of it: doing so would
  # leave the row above the resolver's watermark carrying an unjudged origin,
  # where the pass that exists to correct it can never revisit it.
  - {name: judged-origin-outranks-adapter-evidence, judgedOrigin: agent, origin: user, eventSeq: 41, wantCursor: 41, wantOrigin: agent}
  - {name: retained-preserves-evidence, wantCursor: 40, wantOrigin: user}
  - {name: explicit-zero-cursor, eventSeq: 0, origin: unknown, wantCursor: 0, wantOrigin: unknown}
  - {name: association-failure-rolls-back, eventSeq: 41, origin: agent, invalidCommit: true, wantError: true, wantCursor: 40, wantOrigin: user}
  # A non-independent harness keeps its existing refusal: a child whose parent
  # is not stored is not reconciled.
  - {name: orphan-refused, harness: claude-code, orphan: true, wantError: true}
  # An independently admitted Codex/OpenCode child is retained with a nil FK
  # cache when its logical parent is missing; the managed metadata keeps the
  # logical evidence.
  - {name: opencode-orphan-retained, orphan: true}
  - {name: parent-first, parentFirst: true}
  - {name: future-stored-adapter-refused, storedAdapter: 999, wantError: true, wantCursor: 40, wantOrigin: user}
  - {name: missing-stats-stay-unknown, missingStats: true}
