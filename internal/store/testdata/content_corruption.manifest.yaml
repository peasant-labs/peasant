# Required-name manifest for content_corruption: deletion protection by NAME, never by count.
requiredNames:
  - entry-column-altered
  - chunk-byte-flipped
  - chunk-missing
  - header-length-wrong
  - descriptor-digest-wrong
  - capture-hash-wrong
  - body-row-missing-fk-blocked
  - preview-read-not-verified
  - routing-read-not-verified
  - repair-mode-rewrites-object
  - repair-mode-rewrites-blob
  - repair-mode-rederives-descriptor
  - repair-identical-candidate-rewrites-corrupt-body
  - swept-corrupt-body-rebuilds-index
