# Deterministic read/write interleaves and the single cross-process activation
# proof. Every case executes a production store entry point.
cases:
  - name: reader-during-stage
    mode: reader-stage
    seam: snapshot-callback
    expect: original-detail
    firstText: original reader bytes
    nextText: staged reader bytes
  - name: reader-during-commit
    mode: reader-commit
    seam: snapshot-callback
    expect: original-detail-after-sweep
    firstText: original reader bytes
    nextText: committed reader bytes
  - name: two-harvests-same-session
    mode: same-candidate
    seam: before-commit
    expect: committed-once
    crossProcess: true
  - name: concurrent-staging-same-session
    mode: staged-cas
    seam: after-staging
    expect: stale-state-refused
  - name: harvest-vs-reclaim
    mode: reclaim
    seam: activation
    expect: settled-no-orphans
  - name: harvest-vs-migrate
    mode: migrate
    seam: exclusive-lock
    expect: lock-refused-then-committed
  - name: sweep-vs-stage
    mode: sweep
    seam: after-staging
    expect: fk-refused-then-committed
  # sweep-writer: a second SQLite connection writes at a sweep seam. path is
  # the sweep's delete path: bounded (one transaction) or batch (the
  # resumable fallback a one-row budget forces). expect decides what the
  # competitor does: writer-waits (commit inside a sweep transaction, must
  # find the writer held), writer-commits (commit between sweep
  # transactions), sweep-waits (hold the writer, the sweep must wait).
  - name: sweep-vs-commit-after-its-read
    mode: sweep-writer
    path: bounded
    seam: first-sweep-write
    expect: writer-waits-then-swept
  - name: sweep-vs-held-writer
    mode: sweep-writer
    path: bounded
    seam: after-commit-before-sweep
    expect: sweep-waits-then-swept
  - name: sweep-batch-vs-commit-at-first-write
    mode: sweep-writer
    path: batch
    seam: first-sweep-write
    expect: writer-commits-then-swept
  - name: sweep-batch-vs-held-writer
    mode: sweep-writer
    path: batch
    seam: after-commit-before-sweep
    expect: sweep-waits-then-swept
  - name: sweep-batch-vs-held-writer-mid-batch
    mode: sweep-writer
    path: batch
    seam: mid-sweep-batch
    expect: sweep-waits-then-swept
  - name: sweep-batch-vs-commit-after-body-verify
    mode: sweep-writer
    path: batch
    seam: before-verified-body-delete
    expect: writer-waits-then-swept
  - name: harvest-during-search-consolidation
    mode: consolidation
    seam: sqlite-authorizer
    expect: committed-body-searchable
