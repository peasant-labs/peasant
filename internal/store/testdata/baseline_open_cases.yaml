# Case family for the fresh-install baseline schema. Each row names one
# observable the fresh path must satisfy; requiredNames guards the set in both
# directions. decoded by the local strict loader in baseline_open_test.go
# (testutil.DecodeNamedFixtureYAML cannot be used here: internal/testutil
# imports internal/store).
requiredNames:
  - fresh-open-applies-baseline
  - fresh-timestamps-in-open-interval
  - foreign-application-id-refused
  - version-zero-with-user-objects
  - predecessor-upgrades-with-data
  - stale-probe-recheck
  - concurrent-fresh-open

cases:
  - name: fresh-open-applies-baseline
    kind: fresh-open
  - name: fresh-timestamps-in-open-interval
    kind: clock-interval
  - name: foreign-application-id-refused
    kind: foreign-app-id
    applicationID: 287454020
  - name: version-zero-with-user-objects
    kind: v0-objects
  - name: predecessor-upgrades-with-data
    kind: predecessor
    predecessorSlot: 60
  - name: stale-probe-recheck
    kind: stale-probe
  - name: concurrent-fresh-open
    kind: concurrent-open

# The seeded rows whose clock column is written at install time. Each cell is
