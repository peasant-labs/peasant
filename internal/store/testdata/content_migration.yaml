  - name: native-shim-mismatch-rolls-back
  - name: native-aux-json-mismatch-rolls-back
  - name: native-full-shape-mismatch-rolls-back
  - name: native-capture-hash-mismatch-rolls-back
  - name: native-session-hash-mismatch-rolls-back
  - name: null-session-entries-hash-skips-dimension
  - name: native-detail-bytes-mismatch-halts
  - name: data-rollback-threshold-halts
