# content_migration — the full section-10 case inventory for the in-place
# conversion (design llm/peasant--harmonized-content-model.md section 10,
# ratified revision 17). The required-names manifest protects every name
# from the start.
#
# native-stats-backfilled is filled by the v62 migration itself (the stats
# row and sweep flag backfilled from the active generation's metadata_json).
# Every other conversion case carries ownedBy conversion with a seed profile,
# an optional damage, and the expected disposition: the conversion runner
# builds the file-backed seed from the profile, applies the damage, runs
# the conversion, and asserts the end state. Stats documents use the
# live-store shape (a Go-marshaled SessionStats under $.stats).
#
# Profiles: clean, superseded, pending-intent, non-emitted, extra-keys,
# newer-stats, rich-metadata, annotated, preview-only, non-native-full,
# non-native-preview-only, settled-refusal.
# Damages (each corrupts exactly one dimension of the seeded input or of
# the conversion's derived output): field-blob, missing-blob,
# damaged-blob, serialization, shim, aux-json, full-shape, capture-hash,
# session-hash, null-hash, detail-bytes, unknown-key. stale-hash is not a
# corruption: it backdates the stored hash the way live resumes do, and the
# conversion still proceeds.
# expect: converted, rolled-back, halted, skipped.
cases:

  - name: native-clean
    ownedBy: conversion
    profile: clean
    expect: converted
  - name: native-superseded-identical-discarded
    ownedBy: conversion
    profile: superseded
    expect: converted
  - name: native-pending-intent-discarded
    ownedBy: conversion
    profile: pending-intent
    expect: converted
  - name: native-non-emitted
    ownedBy: conversion
    profile: non-emitted
    expect: converted
  - name: native-two-earlier-partitions-converts
    ownedBy: conversion
    profile: two-earlier
    expect: converted
  - name: native-empty-non-emitted-converts
    ownedBy: conversion
    profile: empty-blob
    expect: converted
  - name: native-extra-keys-promoted
    ownedBy: conversion
    profile: extra-keys
    expect: converted
  - name: native-stats-backfilled
    sessionId: s-v62-full
    activeGeneration: gen-active
    generations:
      - id: gen-active
        metadataJson: '{"schemaVersion":11,"sessionId":"s-v62-full","harness":"opencode","model":"m","version":"1","timestamp":{},"source":{},"git":{},"project":{},"hostSlug":"h","stats":{"turnCount":12,"inputSubmissionCount":3,"toolCallCount":7,"subagentCount":2,"durationMs":90000,"tokensIn":100,"tokensOut":200,"thoughtTokens":10,"cachedReadTokens":20,"cachedWriteTokens":30},"subagents":[],"diagnostics":{},"contentHash":"c","metadataHash":"m","redaction":{}}'
        installedAtMs: 1699999999000
        activatedAtMs: 1700000000000
      - id: gen-old
        metadataJson: '{}'
        installedAtMs: 1699999990000
        activatedAtMs: null
    expected:
      turnCount: 12
      inputSubmissionCount: 3
      toolCallCount: 7
      subagentCount: 2
      durationMs: 90000
      tokensIn: 100
      tokensOut: 200
      thoughtTokens: 10
      cachedReadTokens: 20
      cachedWriteTokens: 30
      seedJson: '{"turnCount":12,"inputSubmissionCount":3,"toolCallCount":7,"subagentCount":2,"durationMs":90000,"tokensIn":100,"tokensOut":200,"thoughtTokens":10,"cachedReadTokens":20,"cachedWriteTokens":30}'
      source: harness
      updatedAtMs: 1700000000000
    expectedFlag: 1
  - name: native-newer-stats-row-converts
    ownedBy: conversion
    profile: newer-stats
    expect: converted
  - name: native-metadata-hash-recomputed
    ownedBy: conversion
    profile: rich-metadata
    expect: converted
  - name: native-parent-only-metadata-heals-row
    ownedBy: conversion
    profile: parent-only-metadata
    expect: converted
  - name: native-parent-divergence-rolls-back
