  - name: native-field-blob-mismatch-rolls-back-and-marks
    ownedBy: conversion
    profile: clean
    expect: rolled-back
    damage: field-blob
  - name: native-missing-blob-rolls-back-and-marks
    ownedBy: conversion
    profile: clean
    expect: rolled-back
    damage: missing-blob
  - name: native-damaged-blob-rolls-back-and-marks
    ownedBy: conversion
    profile: clean
    expect: rolled-back
    damage: damaged-blob
  - name: native-annotated
    ownedBy: conversion
