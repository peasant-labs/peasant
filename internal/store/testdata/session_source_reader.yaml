cases:
  - name: sources_primary_key_batch
    kind: sources
    seed:
      - parent
      - cachedChild
    ids:
      - parent
      - cachedChild
    wantSources:
      - session: parent
        harness: codex
        path: /synthetic/sessions/parent.jsonl
        parent: ""
      - session: cachedChild
        harness: codex
        path: /synthetic/sessions/cached-child.jsonl
        parent: parent

  - name: sources_empty_input
    kind: sources
    seed:
      - parent
    ids: []
    wantSources: []

  - name: children_cached_parent
    kind: children
    seed:
      - parent
      - cachedChild
    parents:
      - parent
    wantChildren:
      parent:
        - cachedChild

  - name: children_uncached_relationship_evidence
    kind: children
    seed:
      - parent
      - relationshipChild
    parents:
      - parent
    wantChildren:
      parent:
        - relationshipChild
    wantChildCacheEmpty:
      - relationshipChild

  - name: children_uncached_publication_metadata
    kind: children
    seed:
      - parent
      - publicationChild
    parents:
      - parent
    wantChildren:
      parent:
        - publicationChild
    wantChildCacheEmpty:
      - publicationChild

  - name: children_absent_parent
    kind: children
    seed:
      - parent
      - unrelated
    parents:
      - parent
    wantChildren:
      parent: []

  - name: children_uncached_missing_parent_row
    kind: children
    seed:
      - orphanChild
    parents:
      - unstoredParent
    wantChildren:
      unstoredParent:
        - orphanChild
    wantChildCacheEmpty:
      - orphanChild
