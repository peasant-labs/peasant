# Crash-seam oracle for the harmonized V2 activation protocol. Each named case
# interrupts the real activation at one durable boundary and asserts exactly G1
# (the prior generation) or G2 (the new generation) is visible, that no success
# is stamped before the activation commit, and that retry settles on G2 with
# the same generation identity. `seam` names the writer seam; `visible` names
# the generation a reader must see immediately after the interruption;
# `recovery` names how G2 is completed (`retry` re-runs activation after the
# fault clears, `complete` runs the post-commit pass when the commit is
# already durable). `tiny_budget` forces budget-split staging so the
# between-transactions seam can fire.
session:
  id: "11111111-1111-4111-8111-111111111111"
  harness: claude-code
generation:
  complete_id: gen_g1
  failed_id: gen_g2
  discarded_id: gen_g3
  # Content longer than the preview limit by more than 1024 characters, so a
  # bounded preview cannot be mistaken for the committed full content.
  long_text_padding: 4096
cases:
  - name: after-prepare
    seam: after-prepare
    visible: g1
    recovery: retry
  - name: between-stage-txns
    seam: between-stage-txns
    visible: g1
    recovery: retry
    tiny_budget: true
  - name: before-commit
    seam: before-commit
    visible: g1
    recovery: retry
  - name: commit-rollback
    seam: at-commit
    visible: g1
    recovery: retry
  - name: after-commit-before-sweep
    seam: after-commit
    visible: g2
    recovery: complete
