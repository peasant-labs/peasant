cases:
  - name: long_unicode
    prefix: "語🙂"
    repeats: 30000
    tail: "SAFE-TAIL-ONE"
    replacement_tail: "SAFE-TAIL-TWO"
    entries: 3
    budget: 250000
  - name: oversized_progress
    prefix: "x"
    repeats: 1100000
    tail: "SAFE-OVERSIZED-TAIL"
    replacement_tail: "SAFE-UPDATED-TAIL"
    entries: 2
    budget: 1048576
  - name: unicode_preview_boundary
    prefix: "語"
    repeats: 1000
    tail: "SAFE-UNICODE-TAIL"
    replacement_tail: "SAFE-UNICODE-UPDATE"
    entries: 3
    budget: 4000
corruptions:
  - name: missing_chunk
    sql: "DELETE FROM session_entry_full_content_chunks WHERE chunk_index=0"
  - name: damaged_chunk
    sql: "UPDATE session_entry_full_content_chunks SET data=x'00' WHERE chunk_index=0"
  - name: wrong_capture_hash
    sql: "UPDATE session_content_captures SET full_capture_sha256=printf('%064d',0)"
  - name: wrong_tool_input
    sql: "UPDATE session_entries SET tool_input='changed' WHERE entry_index=0"
  - name: wrong_manifest_hash
    sql: "UPDATE session_entry_full_content SET full_sha256=printf('%064d',0) WHERE entry_index=0"
shape_changes:
  - name: extra
    sql: "UPDATE session_entries SET extra='{}' WHERE entry_index=0"
  - name: parent_id
    sql: "UPDATE session_entries SET parent_entry_id='changed' WHERE entry_index=0"
  - name: derived_ext
    sql: "DELETE FROM session_entries_ext"
  - name: derived_command
    sql: "DELETE FROM session_commands"
  - name: timestamp
    sql: "UPDATE session_entries SET timestamp_ms=1 WHERE entry_index=0"
  - name: tool_output
    sql: "UPDATE session_entries SET tool_output='changed' WHERE entry_index=0"
capture_format_rejections:
  - name: unknown_capture_format
    format: not-a-capture-format
# Content modes this build SERVES, and what each one does to a session whose
# stored capture is either a verified complete capture or a bounded preview.
# read_mode and write_mode are parsed through the ingest constructors, so a
# member that disappears from a closed set fails the fixture before any store
# call. Every case also proves the operation left the producer evidence and the
# stored entry projection untouched.
#
#   complete_capture: seed a verified full capture instead of a bounded preview.
#   want_full_text:   the read must return the whole entry text, not its preview.
#   want_error_contains: the case must FAIL, with this in its message.
mode_behaviours:
  - name: available_read_serves_complete_capture
    read_mode: available
    complete_capture: true
    want_full_text: true
  - name: available_read_serves_bounded_preview
    read_mode: available
    want_full_text: false
  - name: format_conversion_write_keeps_complete_capture
    write_mode: format_conversion
    complete_capture: true
  - name: format_conversion_write_refuses_a_new_producer_claim
    write_mode: format_conversion
    complete_capture: true
    indexer_version: true
    want_error_contains: "a conversion changes only the representation"
