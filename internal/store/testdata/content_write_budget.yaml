# content_write_budget — the harmonized session content model write-budget family
# (design llm/peasant--harmonized-content-model.md section 10, ratified revision 17).
#
# The 8 cases this change owns carry typed expectations and run real assertions
# in content_write_budget_test.go under their section-10 names; the gates assert
# the invariants against the configured knobs, never the constants. The 4
# writer-owned cases (staging-batch-commits-once, activation-batch-commits-once,
# oversized-session-stages-alone, skip-commits-nothing) stay name placeholders
# until the writer change fills them; the loader's manifest check still protects
# their names, and a case with no typed fields runs as a placeholder.
hostSlug: github.com-write-budget-fixture
projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
transcript: '{"type":"user","message":{"role":"user","content":"write budget fixture"}}'
cases:
  - name: splitter-single-home
    minSites: 2
  - name: staging-batch-commits-once
    action: stage-batch
    sessions: 1
    wantCommits: 1
  - name: activation-batch-commits-once
    action: activate-batch
    sessions: 2
    wantCommits: 1
  - name: oversized-session-stages-alone
    action: stage-oversized
    sessions: 1
    wantCommits: 2
  - name: skip-commits-nothing
    action: skip-refresh
    sessions: 1
    wantMaxCommits: 1
  - name: state-read-commits-nothing
    action: read-index-state
    sessions: 1
    wantCommits: 0
  - name: commit-count-budget
    action: refresh
    sessions: 1
    wantMaxCommits: 4
  - name: hold-under-busy-timeout
    workers: [1, 8]
  - name: batch-under-configured-caps
    batchBytes: 8388608
    batchSessions: 64
    stagedMemoryBytes: 150994944
    workers: [8]
  - name: buffers-preallocated-partitioned
    workers: [4]
  - name: staged-memory-under-cap
    workers: [1, 2, 7, 8, 32]
  - name: flush-on-interval
    flushIntervalsMs: [50, 3600000]
    minSites: 2
