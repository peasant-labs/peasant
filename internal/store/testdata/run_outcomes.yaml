requiredNames: [worker-error, session-diagnostic, run-diagnostic, retention-prunes-refresh-rows-with-the-other-outcomes]
outcomes:
  - name: worker-error
    sessionId: 59000000-0000-0000-0000-000000000001
    kind: worker_error
    reason: error
  - name: session-diagnostic
    sessionId: 59000000-0000-0000-0000-000000000002
    kind: diagnostic
    reason: record_too_large
  - name: run-diagnostic
    kind: diagnostic
    reason: index_coverage_unavailable
  # A refresh row is an outcome row: the writer, the reader and the retention
  # rule treat it like the others.
  - name: retention-prunes-refresh-rows-with-the-other-outcomes
    sessionId: 59000000-0000-0000-0000-000000000003
    kind: refresh
    reason: source_changed
