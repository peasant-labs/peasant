# Every whole search index rebuild with its widened postings budget. Each case
# runs a real entry point on a store whose postings need several flushes at
# FTS5's default budget, then rebuilds a copy of the result at the default
# budget: the same rows and ranks for every query, one segment, and the index
# configuration the store had before. A repair step stopped inside its
# transaction must roll back with no stored budget; a clean upgrade
# afterwards must give the same results.
requiredNames:
  - repair-step-commits
  - repair-step-fails
  - repair-step-cancelled
  - search-index-rebuild-commits
  - prune-health-gate-commits
  - prune-untrusted-delete-commits
  - sweep-flagged-commits
# Body rows of filler text, in a session of their own, added before the
# rebuild. Words are drawn from w0..w(vocabulary-1) with a fixed seed.
filler:
  rows: 600
  rowBytes: 6000
  vocabulary: 20000
queries:
  - "w1"
  - "w19999"
  - "w123 w4*"
  - "w12*"
  - "NEAR(w1* w2*, 3)"
  - "(w5 OR w6) NOT w7"
  - "mitochondria"
cases:
  # The upgrade's search trigger repair on a store with stale results: the
  # step's transaction sets the budget before the migration's script and
  # removes it after.
  - {name: repair-step-commits, entry: repair-step, outcome: commit}
  # The step fails inside its transaction after its rebuild.
  - {name: repair-step-fails, entry: repair-step, outcome: fail}
  # The upgrade is cancelled inside the step's transaction.
  - {name: repair-step-cancelled, entry: repair-step, outcome: cancel}
  # The rebuild a harvest runs when the search index needs one.
  - {name: search-index-rebuild-commits, entry: search-index-rebuild, outcome: commit}
  # A prune whose health gate finds the index flagged and rebuilds it first.
  - {name: prune-health-gate-commits, entry: prune-health-gate, outcome: commit}
  # A prune whose delete cannot be trusted and rebuilds after its deletes.
  - {name: prune-untrusted-delete-commits, entry: prune-untrusted-delete, outcome: commit}
  # A content sweep that finds the index flagged and rebuilds it.
  - {name: sweep-flagged-commits, entry: sweep-flagged, outcome: commit}
