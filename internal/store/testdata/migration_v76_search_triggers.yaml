# Migration V76 search-trigger repair with residue detection: a store
# consolidated before V75 ends up with its session_entries triggers pointed
# at the retired session_entries_fts (V75 re-creates it) while
# session_search_fts goes stale for every session_entries write. External
# content FTS5 removes postings by value, so deleted rows leave ghosts and
# updated rows leave removed terms; session_entries reuses rowids (no
# AUTOINCREMENT), so a stale term can match a new, unrelated row and pass
# the unified read. V76 re-points the triggers at session_search_fts, then
# either rebuilds the whole union index (residue predicate true) or brings
# the entries half current with the cheap re-sync (predicate false), and
# drops the retired index. Each chain case builds a V74 store, simulates the
# production consolidation, seeds entries and bodies, migrates, writes after
# the migration legs, and asserts what the union index serves. Leg A writes
# land between V75 and V76; leg B writes land after the final leg.
#
# chain selects the migration under test: full runs V75 then V76, v75 caps
# the chain at V75 to pin the defect V76 repairs (the capped case stays red
# until V76 heals it, so removing V76 fails the healed cases). On the full
# chain the residue predicate fires on the leg A window, so V76 rebuilds and
# every removed term and ghost is gone; leg B writes go through live union
# triggers with exact old values. The runner hardcodes the invariants: the
# untouched seed, both body terms, and a clean FTS integrity-check on every
# chain; the legacy-side landing of the capped chain's writes (the defect
# mechanism); and the production-path reads.
#
# The residue predicate compares union entries-half docsize against the
# retired index, which the window keeps trigger-current. docsize sz is the
# token count, so the predicate fires on deleted rows, on updates that
# change the token count, and on reused rowids whose new content differs in
# count — and stays silent on clean stores, insert-only windows, and stores
# that cross v75 and v76 in one run. It is blind to token-count-preserving
# swaps, which no docsize comparison can see.
cases:
  - name: healed-entries-writes-reach-union
    chain: full
    presetNeedsRebuild: false
    wantInsertedInUnion: true
    wantUpdatedNewInUnion: true
    wantLegAUpdatedOldInUnion: false
    wantLegBUpdatedOldInUnion: false
    wantLegAGhostInUnion: false
    wantLegBGhostInUnion: false
    wantLegacyAbsent: true
    wantTriggersTarget: union
    wantNeedsRebuild: false
  - name: rebuild-path-clears-a-pending-rebuild-flag
    chain: full
    presetNeedsRebuild: true
    wantInsertedInUnion: true
    wantUpdatedNewInUnion: true
    wantLegAUpdatedOldInUnion: false
    wantLegBUpdatedOldInUnion: false
    wantLegAGhostInUnion: false
    wantLegBGhostInUnion: false
    wantLegacyAbsent: true
    wantTriggersTarget: union
    wantNeedsRebuild: false
  - name: v75-defect-union-misses-new-entries-writes
    chain: v75
    presetNeedsRebuild: false
    wantInsertedInUnion: false
    wantUpdatedNewInUnion: false
    wantLegAUpdatedOldInUnion: true
    wantLegBUpdatedOldInUnion: true
    wantLegAGhostInUnion: true
    wantLegBGhostInUnion: true
    wantLegacyAbsent: false
    wantTriggersTarget: legacy
    wantNeedsRebuild: false

# Residue predicate cases: each builds a V74 store, simulates consolidation,
# seeds, migrates to V75, applies its window, and evaluates the Go predicate
# against the vendored SQLite. The window shapes pin the gate: silence on a
# clean store, on inserts alone, and on token-count-preserving updates (the
# documented blind spot — no docsize comparison can see them); residue on a
# delete, on a token-count-changing update, and on a reused rowid.
predicateCases:
  - name: predicate-clean-no-window-writes
    window: none
    wantResidue: false
  - name: predicate-delete-leaves-residue
    window: delete
    wantResidue: true
  - name: predicate-reused-rowid-leaves-residue
    window: reuse
    wantResidue: true
  - name: predicate-insert-only-window-clean
    window: insert
    wantResidue: false
  - name: predicate-update-same-count-clean
    window: update-same-count
    wantResidue: false
  - name: predicate-update-count-changed-residue
    window: update-count-changed
    wantResidue: true

# Open-driven cases: the window is applied to a v75 store on a raw
# connection, the store is closed, and Open runs the chain while the notice
# writer is captured. The affected path prints the one-line rebuild notice
# and heals the window; the crossing and insert paths stay silent and take
# the targeted insert; the same-count path stays silent (predicate blind) and
# keeps the stale term. The notice only warns. A body-half sentinel posting
# probes the SQL gate: it survives the targeted insert and is gone only after
# a whole-index rebuild. The rebuild branch clears a pending rebuild flag; the
# targeted-insert branch leaves a set flag set. crossing-from-v74 stops the
# build at v74 so one Open crosses v75 and v76 with no window between.
# tampered drops the retired index without re-pointing the triggers: the
# pre-open check errors, Open warns once and continues, and v76 rebuilds.
openCases:
  - name: open-affected-window-rebuilds-with-notice
    window: affected
    wantNotice: true
  - name: open-crossing-in-one-run-silent
    window: none
    wantNotice: false
  - name: open-insert-only-window-silent-resync
    window: insert
    wantNotice: false
  - name: open-update-same-count-silent-stale-matches
    window: update-same-count
    wantNotice: false
  - name: open-consolidated-after-v75-silent
    window: consolidated
    wantNotice: false
  - name: clean-path-leaves-a-set-rebuild-flag-set
    window: none
    wantNotice: false
    presetNeedsRebuild: true
    wantNeedsRebuild: true
  - name: open-true-crossing-from-v74-silent
    window: crossing-from-v74
    wantNotice: false
  - name: open-tampered-store-warns-and-rebuilds
    window: tampered
    wantNotice: false
    wantPrecheckWarning: true
