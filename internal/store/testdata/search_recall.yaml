# search_recall — the harmonized session content model recall family
# (design llm/peasant--harmonized-content-model.md section 10, ratified revision 17).
# Each case carries its query term and the production result it must return
# through the consolidated index: result sets per query, with native
# widening only where the design states it. The loader enforces the
# required-names manifest in both directions, so a deletion or rename goes red.
