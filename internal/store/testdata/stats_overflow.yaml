cases:
  - name: file-backed-refresh-retains-prior-raw-stats
    refresh: true
    refreshCount: 2
    checkSkip: true
    statsJson: '{"inputSubmissionCount":1,"futureZ":{"count":7},"futureA":null}'
    want:
      inputSubmissionCount: 1
    overflow: '{"futureA":null,"futureZ":{"count":7}}'
    keys: [futureA, futureZ]
    expect: converted
  - name: file-backed-refresh-retains-legacy-only-seed
    refresh: true
    refreshCount: 1
    legacySeedOnly: true
    statsJson: '{"inputSubmissionCount":1,"futureLegacy":{"count":3}}'
    want:
      inputSubmissionCount: 1
    overflow: '{"futureLegacy":{"count":3}}'
    keys: [futureLegacy]
    expect: converted
  - name: unknown-kind-kept-in-overflow
    statsJson: '{"turnCount":2,"inputSubmissionCount":1,"futureZ":{"count":7},"futureA":null}'
    want:
      turnCount: 2
      inputSubmissionCount: 1
    overflow: '{"futureA":null,"futureZ":{"count":7}}'
    keys: [futureA, futureZ]
    expect: converted
  # conversationTurnCount is a modeled stat: a retained document that carries
  # it converts with no overflow entry and no stats-overflow diagnostic.
  - name: conversation-turn-count-is-a-known-stat
    statsJson: '{"turnCount":4,"inputSubmissionCount":1,"conversationTurnCount":2}'
    want:
      turnCount: 4
      inputSubmissionCount: 1
    expect: converted
  # The two count columns come only from the index-time fold and the upgrade
  # recount. The retained document's numbers (4 and 2) are in its producer's
  # unit and must not replace the recounted 9 and 7.
  - name: conversion-keeps-recounted-turn-counts
    statsJson: '{"turnCount":4,"inputSubmissionCount":1,"conversationTurnCount":2}'
    recountedTurnCounts: {turnCount: 9, conversationTurnCount: 7}
    # want is the row the V62 backfill leaves, before the recounted values are
    # written; after the conversion the row holds the recounted 9.
    want:
      turnCount: 4
      inputSubmissionCount: 1
    expect: converted
  - name: absent-stays-null-through-conversion
    statsJson: '{"inputSubmissionCount":1,"tokensIn":12,"thoughtTokens":null}'
    want:
      tokensIn: 12
      inputSubmissionCount: 1
    expect: converted
  - name: explicit-zero-stays-zero
    statsJson: '{"turnCount":0,"inputSubmissionCount":0,"toolCallCount":0,"subagentCount":0,"durationMs":0,"tokensIn":0,"tokensOut":0,"thoughtTokens":0,"cachedReadTokens":0,"cachedWriteTokens":0}'
    want:
      turnCount: 0
      inputSubmissionCount: 0
      toolCallCount: 0
      subagentCount: 0
      durationMs: 0
      tokensIn: 0
      tokensOut: 0
      thoughtTokens: 0
      cachedReadTokens: 0
      cachedWriteTokens: 0
    expect: converted
  - name: overflow-diagnostic-emitted
    reportDriver: true
    statsJson: '{"turnCount":1,"inputSubmissionCount":1,"newCost":4.25}'
    want:
      turnCount: 1
      inputSubmissionCount: 1
    overflow: '{"newCost":4.25}'
    keys: [newCost]
    expect: converted
  - name: shadow-detects-dropped-overflow
    statsJson: '{"turnCount":1,"inputSubmissionCount":1,"futureCount":8}'
    want:
      turnCount: 1
      inputSubmissionCount: 1
    overflow: '{"futureCount":8}'
    keys: [futureCount]
    damage: drop-overflow
    expect: rolled-back
