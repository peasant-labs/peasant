# The upgrade plan's estimate of the search trigger repair. The v75 window
# names the writes made between migrations 75 and 76 (see the v76 fixtures):
# a delete leaves stale results, so the repair rebuilds the index and the
# plan estimates it from the index's size; an insert alone leaves none, so
# the repair is quick and has no estimate; a tampered store whose retired
# index is gone rebuilds too, after a warning.
requiredNames:
  - stale-results-rebuild
  - insert-only-quick
  - retired-index-missing-rebuild
# Body rows of filler text, so the index's pages dominate its size.
filler:
  rows: 200
  rowBytes: 6000
  vocabulary: 20000
cases:
  - {name: stale-results-rebuild, window: delete, wantEstimate: true}
  - {name: insert-only-quick, window: insert, wantEstimate: false}
  - {name: retired-index-missing-rebuild, window: tampered, wantEstimate: true}
