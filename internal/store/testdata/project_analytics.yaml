# The consumer copy of the schema-owned ProjectAnalytics field set. The schema
# module owns the contract; this file is Peasant's producer-side assertion that
# the aggregate it computes carries exactly that set. A field added on either
# side fails the parity test until both copies move together.
types:
  - name: ProjectAnalytics
    fields:
      - totalSessions
      - totalContributors
      - totalProjects
      - sessionsPerWeek
      - weeklyActiveContributors
      - returningContributorRate
      - longestStreak
      - newContributorVelocity
      - sessionToCommitRate
      - avgDurationPerActiveWeek
      - outcomeDistribution
      - sessionStats
      - perContributorBreakdown
  - name: WeekCount
    fields: [week, count]
  - name: WeekContributors
    fields: [week, contributors]
  - name: ReturningContributorRate
    fields: [total, returning, rate]
  - name: LongestStreak
    fields: [weeks, startWeek, endWeek]
  - name: WeekNewContributors
    fields: [week, newContributors]
  - name: SessionToCommitRate
    fields: [total, withCommit, rate]
  - name: WeekAvgDuration
    fields: [week, avgDurationMins, sessions]
  - name: OutcomeDistribution
    fields: [resolved, partial, failed, unknown, total]
  - name: MedianP90
    fields: [count, median, p90]
  - name: AnalyticsSessionStats
    fields: [durationMins, totalTokens, turnCount, toolCallCount]
  - name: ContributorBreakdown
    fields:
      - contributorId
      - sessions
      - activeWeeks
      - totalTokens
      - totalDurationMins
      - totalTurns
      - totalToolCalls
      - sessionsWithCommit
      - totalCommits
      - outcomes
      - firstSeen
      - lastSeen

# One library sample the aggregate must fold into the bundle below. Every
# session belongs to the one local contributor the store can attribute; the
# three Monday-of-week buckets exercise the streak, velocity, and weekly
# averages. Outcomes include the unknown arm a NULL stored outcome produces.
