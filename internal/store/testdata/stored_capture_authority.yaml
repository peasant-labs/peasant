# Stored content-capture authority oracle for the OpenCode V1 authority bridge.
# Each case seeds one session_content_captures row (or none) and states whether
# the stored certificate holds last-good full authority. The bridge applies the
# writer's own publishable-capture predicate, so a publication revision is never
# proof; the want_* fields are what the bridge must report back.
session:
  id: 9f9f9f9f-9999-4999-8999-9f9f9f9f9f9f
cases:
  - name: complete-full-is-authoritative
    present: true
    status: complete
    sourceAuthority: provider_source
    captureFormat: full
    publicationCaptureRevision: 0
    wantAuthority: true
    wantSourceAuthority: provider_source
    wantCaptureFormat: full
  - name: complete-full-with-publication-revision-is-authoritative
    present: true
    status: complete
    sourceAuthority: new_ingest
    captureFormat: full
    publicationCaptureRevision: 7
    wantAuthority: true
    wantSourceAuthority: new_ingest
    wantCaptureFormat: full
  - name: complete-preview-only-is-authoritative
    # A complete capture is certified by its status and the absence of a
    # failure; the format is not questioned by the shared rule.
    present: true
    status: complete
    sourceAuthority: peasant_snapshot
    captureFormat: preview_only
    publicationCaptureRevision: 0
    wantAuthority: true
    wantSourceAuthority: peasant_snapshot
    wantCaptureFormat: preview_only
  - name: incomplete-full-accounted-omissions-is-authoritative
    present: true
    status: incomplete
    sourceAuthority: provider_source
    captureFormat: full
    failureCode: source_records_omitted
    publicationCaptureRevision: 0
    wantAuthority: true
    wantSourceAuthority: provider_source
    wantCaptureFormat: full
  - name: incomplete-full-retained-unknown-is-authoritative
    present: true
    status: incomplete
    sourceAuthority: provider_source
    captureFormat: full
    failureCode: unknown_data_retained
    publicationCaptureRevision: 0
    wantAuthority: true
    wantSourceAuthority: provider_source
    wantCaptureFormat: full
  - name: incomplete-preview-only-strict-refused-is-not-authoritative
    present: true
    status: incomplete
    sourceAuthority: peasant_snapshot
    captureFormat: preview_only
    failureCode: strict_capture_refused
    publicationCaptureRevision: 9
    wantAuthority: false
  - name: incomplete-preview-only-accounted-code-is-not-authoritative
    present: true
    status: incomplete
    sourceAuthority: provider_source
    captureFormat: preview_only
    failureCode: source_records_omitted
    publicationCaptureRevision: 0
    wantAuthority: false
  - name: incomplete-legacy-preview-only-is-not-authoritative
    present: true
    status: incomplete
    sourceAuthority: peasant_snapshot
    captureFormat: legacy_preview_only
    failureCode: legacy_preview_only
    publicationCaptureRevision: 0
    wantAuthority: false
  - name: failed-is-not-authoritative
    present: true
    status: failed
    sourceAuthority: provider_source
    captureFormat: full
    failureCode: strict_capture_refused
    publicationCaptureRevision: 12
    wantAuthority: false
  - name: absent-is-not-authoritative
    present: false
    wantAuthority: false
