# Search repair cost cases (the upgrade plan's cost for the step that
# repairs the search triggers): version and docsize content pin the
# read-only pre-open check against the vendored SQLite. The builder creates
# only what the helper reads (user_version plus the two FTS docsize tables),
# so each window is isolated from migration machinery. no-window-writes and
# insert-only stay silent; a delete and a reused rowid report residue.
# missing-file proves a fresh install proceeds.
cases:
  - name: version-74-never-migrated
    version: 74
    unionTerms: []
    legacyTerms: []
    wantResidue: false
  - name: version-75-clean-no-window
    version: 75
    unionTerms:
      - {id: 1, text: "keep me"}
      - {id: 2, text: "steady state"}
    legacyTerms:
      - {id: 1, text: "keep me"}
      - {id: 2, text: "steady state"}
    wantResidue: false
  - name: version-75-delete-leaves-residue
    version: 75
    unionTerms:
      - {id: 1, text: "kangaroo ghost"}
      - {id: 2, text: "keep me"}
    legacyTerms:
      - {id: 2, text: "keep me"}
    wantResidue: true
  - name: version-75-reused-rowid-leaves-residue
    version: 75
    unionTerms:
      - {id: 1, text: "kangaroo ghost"}
      - {id: 2, text: "keep me"}
    legacyTerms:
      - {id: 1, text: "quasar"}
      - {id: 2, text: "keep me"}
    wantResidue: true
  - name: version-75-insert-only-window-clean
    version: 75
    unionTerms:
      - {id: 1, text: "keep me"}
    legacyTerms:
      - {id: 1, text: "keep me"}
      - {id: 2, text: "quasar lonely insert"}
    wantResidue: false
  - name: version-76-already-migrated
    version: 76
    unionTerms:
      - {id: 1, text: "kangaroo ghost"}
    legacyTerms: []
    wantResidue: false
  - name: missing-file-fresh-install
    missing: true
    wantResidue: false
