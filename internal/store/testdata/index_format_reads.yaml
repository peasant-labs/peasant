requiredNames: [unsupported-projection, unmarked-projection, supported-scope, never-indexed, metadata-stays-readable, unknown-format-before-search-limit, bounded-bulk-preview]
requiredOperations: [entries, range, maximum, exists, first-message, bulk-preview, entry-annotations, entry-annotation, annotation-inputs, entries-hash, api-detail, export, search, metadata, session-annotations]
cases:
  - name: unsupported-projection
    format: 99
    entries: true
    refuse: true
    operations: [entries, range, maximum, exists, first-message, bulk-preview, entry-annotations, entry-annotation, annotation-inputs, entries-hash, api-detail, export]
  - name: unmarked-projection
    entries: true
    refuse: true
    operations: [entries, range, maximum, exists, first-message, bulk-preview, annotation-inputs, entries-hash]
  - name: supported-scope
    format: 99
    entries: true
    otherSession: true
    managedTranscript: '{"type":"user","message":{"role":"user","content":"searchable healthy"}}'
    operations: [entries, range, maximum, exists, first-message, bulk-preview, entry-annotations, entry-annotation, annotation-inputs, entries-hash, api-detail, export]
  - name: never-indexed
    operations: [entries, range, maximum, exists, first-message, bulk-preview, annotation-inputs, entries-hash]
  - name: metadata-stays-readable
    format: 99
    entries: true
    operations: [metadata, session-annotations]
  - name: unknown-format-before-search-limit
    format: 99
    entries: true
    otherSession: true
    refuse: true
    operations: [search]
  - name: bounded-bulk-preview
    format: 99
    entries: true
    otherSession: true
    previewIDs: 300
    variableLimit: 256
    operations: [bulk-preview]
