# Native recovery matrix (PROPOSAL-3 section 5.3 disposition + 5.5 reads).
#
# Each case drives real staged artifacts and SQLite through the production
# activation and recovery paths, failing the exact I/O dependency before or
# after commit as named. Every case asserts authority (active generation,
# prior preservation) AND per-invocation counts (CommittedNow once,
# AlreadyCommitted/NotCommitted zero) plus actual read verdicts (full and
# available, never readiness alone). Repair failures assert pending repair
# with committed authority, never rollback or duplicate counts. Recovery
# carrier evidence (payload, coordinates, pointer) originates here, never in
# the test body.
required_names:
  - preview-direct-write
  - preview-intent-replay
  - stale-input
  - missing-blob
  - new-commit-repair-success
  - new-commit-repair-failure
  - already-active-retry-repair-success
  - already-active-retry-repair-failure
  - unrelated-prior-intent-failure
  - preamble-recovery-commit
  - retry-no-double-count
  - forged-intent-replay
  - same-id-mismatched-intent
  - same-id-unbindable-request
cases:
  - name: preview-direct-write
    completeness: incomplete_new
    fault: none
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 0
    want_repair_pending: false
    want_active: candidate
    want_full_read: refused
    want_available: success
  - name: preview-intent-replay
    completeness: incomplete_new
    fault: intent_replay
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 0
    want_repair_pending: false
    want_active: candidate
    want_full_read: refused
    want_available: success
  - name: stale-input
    completeness: complete
    fault: stale
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: prior
    want_full_read: success
    want_available: success
  - name: missing-blob
    completeness: complete
    fault: missing_blob
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: none
    want_full_read: refused
    want_available: success_empty
  - name: new-commit-repair-success
    completeness: complete
    fault: none
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_repair_pending: false
    want_active: candidate
    want_full_read: success
    want_available: success
  - name: new-commit-repair-failure
    completeness: complete
    fault: fail_repair
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_repair_pending: true
    want_active: candidate
    want_full_read: success
    want_available: success
  - name: already-active-retry-repair-success
    completeness: complete
    fault: retry
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: already_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: candidate
    want_full_read: success
    want_available: success
  - name: already-active-retry-repair-failure
    completeness: complete
    fault: retry_fail_repair
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: already_committed
    want_occurrences: 0
    want_repair_pending: true
    want_active: candidate
    want_full_read: success
    want_available: success
  - name: unrelated-prior-intent-failure
    completeness: complete
    fault: unrelated_prior
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: prior
    want_full_read: success
    want_available: success
  - name: preamble-recovery-commit
    completeness: complete
    fault: preamble_pending
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_repair_pending: false
    want_active: candidate
    want_full_read: success
    want_available: success
  # retry-no-double-count replays over a seeded prior full authority while
  # already-active-retry-repair-success replays with no prior: same retry
  # shape, distinct authority setup.
  - name: retry-no-double-count
    completeness: complete
    fault: retry
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: already_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: candidate
    want_full_read: success
    want_available: success
  # Forged recovery: an incomplete_new candidate staged under an intent that
  # claims a full/complete capture. Recovery replays the persisted envelope
  # through the same guarded write, which refuses the forged claim and
  # preserves last-good authority (none here).
  - name: forged-intent-replay
    completeness: incomplete_new
    fault: forged_intent_replay
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: none
    want_full_read: refused
    want_available: success_empty
  # A replayable pending intent names the requested identifier but binds
  # different installed bytes: it is discarded, never replayed, and the
  # requested envelope is refused against the immutable installed identifier.
  - name: same-id-mismatched-intent
    completeness: complete
    fault: same_id_mismatched_intent
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: none
    want_full_read: refused
    want_available: success_empty
    want_intent_cleared: true
    want_error_contains: "immutable identifiers cannot be reused"
  # A replayable pending intent names the requested identifier, but the
  # requested envelope itself cannot be bound (a captured blob is missing):
  # refused with the binding category instead of riding the recorded intent,
  # last-good authority unchanged.
  - name: same-id-unbindable-request
    completeness: complete
    fault: same_id_unbindable_request
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_repair_pending: false
    want_active: prior
    want_full_read: success
    want_available: success
    want_error_contains: "store: bind activation for generation"
