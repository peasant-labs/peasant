# Native recovery matrix for the harmonized writer.
#
# Each case drives real staged objects and SQLite through the production
# activation path, failing the exact dependency before or after commit as
# named. Every case asserts authority (active generation, prior
# preservation) AND per-invocation counts (CommittedNow once,
# AlreadyCommitted/NotCommitted zero) plus the committed rows (the
# generation row, its mapping and its bodies are present exactly when a
# commit happened, never readiness alone). Repair carrier evidence
# (payload, coordinates, pointer) originates here, never in the test body.
required_names:
  - preview-direct-write
  - preview-staged-retry
  - stale-input
  - missing-blob
  - new-commit
  - new-commit-fault
  - already-active-retry
  - retry-commit-fault
  - unrelated-staged-objects-ignored
  - preamble-staged-commit
  - retry-no-double-count
  - forged-capture-refused
  - same-id-mismatched-refused
  - same-id-unbindable-request
cases:
  - name: preview-direct-write
    completeness: incomplete_new
    fault: none
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 0
    want_active: candidate
    want_rows: present
  - name: preview-staged-retry
    completeness: incomplete_new
    fault: prestaged
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 0
    want_active: candidate
    want_rows: present
  - name: stale-input
    completeness: complete
    fault: stale
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: prior
    want_rows: absent
  - name: missing-blob
    completeness: complete
    fault: missing_blob
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: none
    want_rows: absent
    want_error_contains: "names no emitted entry and carries no staged bytes"
  - name: new-commit
    completeness: complete
    fault: none
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_active: candidate
    want_rows: present
  - name: new-commit-fault
    completeness: complete
    fault: commit_fault
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: none
    want_rows: absent
  - name: already-active-retry
    completeness: complete
    fault: retry
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: already_committed
    want_occurrences: 0
    want_active: candidate
    want_rows: present
  - name: retry-commit-fault
    completeness: complete
    fault: retry_commit_fault
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: candidate
    want_rows: present
  - name: unrelated-staged-objects-ignored
    completeness: complete
    fault: unrelated_staged
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_active: candidate
    want_rows: present
  - name: preamble-staged-commit
    completeness: complete
    fault: prestaged
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: committed_now
    want_occurrences: 1
    want_active: candidate
    want_rows: present
  # retry-no-double-count replays over a seeded prior full authority while
  # already-active-retry replays with no prior: same retry shape, distinct
  # authority setup.
  - name: retry-no-double-count
    completeness: complete
    fault: retry
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: already_committed
    want_occurrences: 0
    want_active: candidate
    want_rows: present
  # Forged capture: an incomplete_new candidate that claims a full/complete
  # capture. The guarded write refuses the forged claim and preserves
  # last-good authority (none here).
  - name: forged-capture-refused
    completeness: incomplete_new
    fault: forged_capture
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: none
    want_rows: absent
  # The same identifier staged with different bytes is refused against the
  # immutable installed identifier: the first activation commits, the
  # colliding retry does not.
  - name: same-id-mismatched-refused
    completeness: complete
    fault: same_id_mismatched
    prior: none
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: candidate
    want_rows: present
    want_error_contains: "immutable identifiers cannot be reused"
  # The requested envelope itself cannot be bound (a captured blob is
  # missing): refused with the binding category, last-good authority
  # unchanged.
  - name: same-id-unbindable-request
    completeness: complete
    fault: same_id_unbindable
    prior: full
    carrier_namespace: message_block
    carrier_kind: future
    carrier_source_ref: src-recovery
    carrier_record_index: 3
    carrier_position: 5
    carrier_pointer: /payload/content/1
    carrier_payload: '{"type":"future","value":9}'
    want_disposition: not_committed
    want_occurrences: 0
    want_active: prior
    want_rows: absent
    want_error_contains: "names no emitted entry and carries no staged bytes"
