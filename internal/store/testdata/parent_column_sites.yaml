# The classified set of production declarations that still carry the raw
# parent-column token in a string literal.
#
# sessions.parent_id is a nullable FK availability cache. The parent ANSWER is
# the logical-parent rule (LogicalParentSQL in parent_reader.go, the in-memory
# startedByTarget predicate, and every reader that embeds them). A declaration
# that reads the raw column answers a DIFFERENT question, and every one of those
# is listed here with its class and its reason.
#
# The unit is (file, enclosing declaration) with the COUNT of token-bearing
# string literals in that declaration, derived with go/parser. Comments and
# identifiers are excluded by construction; a multi-line or concatenated raw
# string is one literal. The count is part of the unit: a new literal inside an
# already-listed declaration changes the set and fails the guard, exactly like a
# new declaration does.
#
# Sections:
#   residual  declarations that still contain the token after this change.
#             Classes: renderer (the one raw SELECT that answers the parent
#             question), availability (which cached row exists, not who is the
#             parent), integrity-compare (the stored document against the stored
#             pair), migration-oracle (the V1 lane's durable logical record),
#             write-guard (the reverse lookup's own NULL-only and cycle guards),
#             writers (the four statements that SET the column), ddl (immutable
#             historical schema and migration text), and cross-package (a parent
#             answer whose rendering belongs to the cross-package reader slice;
#             it appears here only while that slice has not yet routed the
#             declaration, and it disappears from this section — and from the
#             class set's reason to be exercised — when those entries move to
#             routed).
#   routed    declarations that render the rule: asserted to carry ZERO
#             token-bearing literals AND to contain a LogicalParentSQL( or
#             parentGenerationScopeSQL( call.
#   foreign   declarations whose token names a different database or is not a
#             column at all.
#
# Scan scope: production .go files under internal/ and cmd/ only. The embedded
# internal/store/baseline_schema.sql is outside this closure; drift there is
# caught by its own generator gate.
#
# Reconciliation note: the design's routed inventory names ten declarations.
# Two of them (the codemap project listing and the research root filter) are
# parent answers rendered outside internal/store. They were moved from this
# residual section into the routed section in the same change that routed them,
# and the exact-set assertion fails if the move is half-done in either
# direction.
residual:
  - name: store-home-identity-parent-cache
    file: internal/store/home_reader.go
    declaration: Store.HomeIdentityCohort
    literals: 1
    class: availability
    reason: >-
      The narrow identity cohort carries the cache only as input to
      SyncParentIdentities. The shared identity reader applies generation and
      snapshot authority before this last fallback; candidate root/child
      membership and child counts never use the cache directly.
  - name: store-logical-parent-renderer
    file: internal/store/parent_reader.go
    declaration: LogicalParentSQL
    literals: 1
    class: renderer
    reason: >-
      The one raw SELECT that answers the parent question. Every other answer
      reader embeds this rendering instead of re-spelling it.
  - name: store-push-sessions-parent
    file: internal/store/push_reader.go
    declaration: sqlPushSessionsBase
    literals: 1
    class: availability
    reason: >-
      The push row carries the availability cache so consumers can build on-disk
      paths. It answers which cached row exists, not who the parent is. The sync
      identity reader is the one consumer that reads it, and only as its LAST
      fallback arm after generation evidence and the stored document parent are
      both silent; it never reports the cache as a session's parent answer.
  - name: store-lookup-session-location
    file: internal/store/metrics_reader.go
    declaration: sqlLookupSessionLocation
    literals: 1
    class: availability
    reason: >-
      On-disk layout lookup. Routing it would move file lookups, so it keeps the
      raw cache and documents the distinction.
  - name: store-bulk-lookup-session-locations
    file: internal/store/reader.go
    declaration: Store.BulkLookupSessionLocations
    literals: 1
    class: availability
    reason: >-
      The batched on-disk layout lookup, same distinction as the single lookup.
  - name: store-publication-metadata-select
    file: internal/store/publication_metadata.go
    declaration: publicationMetadataSelect
    literals: 1
    class: integrity-compare
    reason: >-
      The capture-integrity compare reads the stored pair, not a parent answer.
      Changing it would change what a stored capture is validated against.
  - name: store-validate-stored-publication-capture
    file: internal/store/publication_metadata.go
    declaration: validateStoredPublicationCapture
    literals: 1
    class: integrity-compare
    reason: >-
      Validates the stored document against the stored pair before publication;
      the documented orphan tolerance depends on this exact comparison.
  - name: store-read-migrate-oracle-session
    file: internal/store/harmonized_migrate_session.go
    declaration: readMigrateOracleSessionOnConn
    literals: 1
    class: migration-oracle
    reason: >-
      For the V1 lane the column IS the durable logical record; the conversion
      reads it as the oracle input before the writer persists it.
  - name: store-reconcile-parent-cache
    file: internal/store/parent_reconcile.go
    declaration: Store.ReconcileParentCache
    literals: 1
    class: write-guard
    reason: >-
      The reverse lookup's cycle walk reads the cache as it will leave it, which
      is a write guard, not a parent answer.
  - name: store-parent-cache-legacy-lookup
    file: internal/store/parent_reconcile.go
    declaration: parentCacheLegacyLookupTemplate
    literals: 1
    class: write-guard
    reason: >-
      The heal is NULL-only: the template selects only children whose cache is
      empty, so a populated cache is never overwritten.
  - name: store-parent-cache-durable-lookup
