# Fresh-install versus migrated-schema parity for the harmonized tables. A
# fresh baseline install and a chain-migrated store must allocate the first
# body_id identically and carry identical schemas, so writers behave the same
# wherever the database came from. The golden-template leg of the trio lives
# in TestGoldenTemplateBodyInsert, which allocates on a real storetest golden
# copy.
cases:
  - name: fresh-first-body-id
    kind: fresh-body-id
  - name: migrated-first-body-id
    kind: migrated-body-id
  - name: golden-template-body-insert
    kind: golden-body-id
    ownedBy: TestGoldenTemplateBodyInsert
  - name: fresh-equals-migrated-schema
    kind: schema-equality
