# Detector cases. Every value here is an obviously fake canary. entries run
# through the real redactor at the standard level, so a case that says nothing
# is found proves the redactor removed it first. An entry's index is its
# position. ownerEmails is the owner set. want lists the findings in order, and
# an absent want means none. advisory marks a finding of an advisory kind.
# wantClean asserts that no finding blocks. kinds lists finding kinds for a case that asserts
# only those.
closedLists:
  findingKinds:
    - credential_assignment
    - credential_file_output
    - foreign_email
    - shareable_document_link
    - redaction_residue
  credentialFileNames:
    - .credentials.json
    - .env
    - .netrc
    - .npmrc
    - .pgpass
    - .pypirc
    - application_default_credentials.json
    - auth.json
    - credentials
    - credentials.json
    - id_ed25519
    - id_rsa
    - secrets.json
    - secrets.yaml
    - secrets.yml
    - service-account.json
    - service_account.json
    - token.json
  credentialFileNamePrefixes: [.env.]
  credentialFileTemplateSuffixes: [.dist, .example, .sample, .template]
  credentialFilePaths: [.kube/config]
  passwordNameSuffixes: [password, passwd, passphrase, secret, token]
  inlinePasswordCommands: [mysql, mysqldump, mysqladmin, mariadb, mariadb-dump]
  shareableHosts:
    - docs.google.com
    - drive.google.com
    - dropbox.com
    - www.dropbox.com
    - 1drv.ms
    - .sharepoint.com
    - app.box.com

cases:
  - name: clean_session
    entries:
      - { role: user, text: "please fix the failing test in the parser" }
      - { role: assistant, text: "the parser now handles an empty line" }

  - name: known_key_is_redacted_not_reported
    entries:
      - { role: tool, output: "the key is sk-ant-api03-FAKEcanaryFAKEcanaryFAKEcanaryFAKEcanaryFAKEcanaryFAKEcanary" }

  - name: unknown_format_assignment
    entries:
      - { role: user, text: "secret_key: FAKE-canary-value-not-real-0123456789-abcd" }
    want:
      - { kind: credential_assignment, entry: 0, role: user, rule: credential_name_value, preview: "secret_key=**** (len 32-63)" }

  - name: low_entropy_value_ignored
    entries:
      - { role: user, text: "token: example" }
      - { role: user, text: "password = aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1" }

  - name: code_expression_is_not_a_value
    entries:
      - { role: assistant, text: "key = getConfiguredProvider-Name.fromSettings" }

  - name: placeholder_is_not_a_value
    entries:
      - { role: tool, output: "API_TOKEN=<REDACTED_BY_AN_EARLIER_PASS_01234>" }

  - name: credentials_json_tool_result
    entries:
      - { role: user, text: "read the file" }
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/credentials.json"}', toolKind: read }
      - { role: tool, toolCallId: call-1, output: '{"type": "service_account", "private": "FAKE-canary-value-not-real-0123456789-abcd"}' }
    want:
      - { kind: credential_file_output, entry: 2, role: tool, rule: credential_file_name, preview: "credentials.json: content=****" }

  - name: failed_read_of_credentials_is_not_output
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/credentials.json"}', toolKind: read }
      - { role: tool, toolCallId: call-1, output: "no such file", isError: true }

  - name: write_of_credentials_is_not_output
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/.env"}', toolKind: edit }
      - { role: tool, toolCallId: call-1, output: "file written" }

  - name: env_listing_tool_result
    entries:
      - { role: tool, output: "ACCESS_KEY=FAKEcanary0access1key\nSECRET_KEY=FAKE-canary-value-not-real-0123456789-abcd\nPATH_STYLE=true" }
    want:
      - { kind: credential_file_output, entry: 0, role: tool, rule: secret_env_listing, preview: "2 secret-named lines=****" }

  - name: env_listing_of_numbers_ignored
    entries:
      - { role: tool, output: "MAX_TOKENS=4000\nTOKEN_LIMIT=100" }

  - name: owner_email_ignored
    ownerEmails: ["Andre@Univ.Example.edu", "andré@univ.example.edu"]
    entries:
      - { role: user, text: "write to andré@univ.example.edu" }

  - name: foreign_email_in_prompt
    entries:
      - { role: user, text: "write to andré@univ.example.edu" }
    want:
      - { kind: foreign_email, entry: 0, role: user, rule: foreign_email, preview: "***@***.edu" }

  - name: foreign_email_in_tool_result
    entries:
      - { role: tool, output: "owner: andré@univ.example.edu" }
    want:
      - { kind: foreign_email, entry: 0, role: tool, rule: foreign_email, preview: "***@***.edu" }

  - name: redacted_email_not_reported
    entries:
      - { role: user, text: "write to someone.else@example.org" }

  - name: git_remote_is_not_an_email
    entries:
      - { role: user, text: "git@example.org is the deploy account" }

  - name: shareable_link_each_host
    entries:
      - { role: user, text: "https://docs.google.com/document/d/FAKEdocument/edit?usp=sharing" }
      - { role: user, text: "https://drive.google.com/file/d/FAKEdocument/view" }
      - { role: user, text: "https://dropbox.com/s/FAKEdocument/notes.txt" }
      - { role: user, text: "https://www.dropbox.com/scl/fi/FAKEdocument/notes.txt?dl=0" }
      - { role: user, text: "https://1drv.ms/u/FAKEdocument" }
      - { role: user, text: "https://acme.sharepoint.com/:w:/FAKEdocument" }
      - { role: user, text: "https://app.box.com/s/FAKEdocument" }
    want:
      - { kind: shareable_document_link, entry: 0, role: user, rule: share_google_docs, preview: "docs.google.com/document/****" }
      - { kind: shareable_document_link, entry: 1, role: user, rule: share_google_drive, preview: "drive.google.com/file/****" }
      - { kind: shareable_document_link, entry: 2, role: user, rule: share_dropbox, preview: "dropbox.com/s/****" }
      - { kind: shareable_document_link, entry: 3, role: user, rule: share_dropbox, preview: "www.dropbox.com/scl/****" }
      - { kind: shareable_document_link, entry: 4, role: user, rule: share_onedrive, preview: "1drv.ms/u/****" }
      - { kind: shareable_document_link, entry: 5, role: user, rule: share_sharepoint, preview: "****.sharepoint.com/:w:/****" }
      - { kind: shareable_document_link, entry: 6, role: user, rule: share_box, preview: "app.box.com/s/****" }

  - name: private_link_ignored
    entries:
      - { role: user, text: "https://docs.google.com/document/u/0/" }
      - { role: user, text: "https://www.dropbox.com/home/notes" }
      - { role: user, text: "https://evil.example.org/document/d/FAKEdocument" }

  - name: residue_passthrough
    entries:
      - { role: tool, output: "Bearer FAKEcanaryNOTaTOKEN" }
    want:
      - { kind: redaction_residue, entry: 0, role: tool, rule: residue_bearer_token, preview: "residue_bearer_token: ****", advisory: true }

  - name: git_remote_is_not_also_an_email_residue
    entries:
      - { role: user, text: "clone git@gitlab.com:acme/tools.git" }
    want:
      - { kind: redaction_residue, entry: 0, role: user, rule: residue_git_remote_ssh, preview: "residue_git_remote_ssh: ****", advisory: true }

  - name: assignment_is_not_also_residue
    entries:
      - { role: user, text: "session_token: 0123456789abcdef0123456789abcdef" }
    want:
      - { kind: credential_assignment, entry: 0, role: user, rule: credential_name_value, preview: "session_token=**** (len 32-63)" }

  - name: link_is_not_also_residue
    entries:
      - { role: user, text: "https://docs.google.com/document/d/FAKEdocumentFAKEdocumentFAKEdocumentFAKEdocument1" }
    want:
      - { kind: shareable_document_link, entry: 0, role: user, rule: share_google_docs, preview: "docs.google.com/document/****" }

  - name: repeated_finding_reported_once
    entries:
      - { role: tool, output: "Bearer FAKEcanaryNOTaTOKEN then Bearer FAKEcanaryNOTaTOKEN" }
    want:
      - { kind: redaction_residue, entry: 0, role: tool, rule: residue_bearer_token, preview: "residue_bearer_token: ****", advisory: true }

  - name: preview_max_length
    entries:
      - { role: user, text: "an_extremely_long_secret_key_name_that_keeps_going_for_a_while: FAKE-canary-value-not-real-0123456789-abcd" }
      - { role: user, text: "write to andré@a-very-long-department-name.of-a-university.example.edu" }
      - { role: user, text: "https://a-very-long-tenant-name-of-a-company-somewhere.sharepoint.com/:w:/FAKEdocument" }

  # Ordinary coding output: commit ids, module downloads, image digests, and
  # long repository paths. The redact module's advisory rules hit on these, and
  # their hits are reported as advisory only, so the session stays clean.
  - name: git_and_go_output_is_advisory_only
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"command": "git log -3 --format=%H && go mod download -x"}', toolKind: execute }
      - role: tool
        toolCallId: call-1
        output: |
          3514f651c0ffee1234567890abcdef1234567890
          6782d9af0badc0de9876543210fedcba98765432
          go: downloading github.com/wasilibs/go-re2 v1.13.0
          go: downloading golang.org/x/term v0.36.0
          FROM docker.io/library/golang@sha256:4f1c8f2b9e0d7a6c5b3a29180f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c
          ok  	github.com/example/project/internal/storage/migrations/sqlite/schema	0.412s
      - { role: assistant, text: "HEAD is now at 3514f651c0ffee1234567890abcdef1234567890, and the module graph resolved" }
    wantClean: true
    want:
      - { kind: redaction_residue, entry: 1, role: tool, rule: residue_base64_long, preview: "residue_base64_long: ****", advisory: true }
      - { kind: redaction_residue, entry: 1, role: tool, rule: residue_hex_long, preview: "residue_hex_long: ****", advisory: true }
      - { kind: redaction_residue, entry: 1, role: tool, rule: residue_go_import_path, preview: "residue_go_import_path: ****", advisory: true }
      - { kind: redaction_residue, entry: 2, role: assistant, rule: residue_base64_long, preview: "residue_base64_long: ****", advisory: true }
      - { kind: redaction_residue, entry: 2, role: assistant, rule: residue_hex_long, preview: "residue_hex_long: ****", advisory: true }

  # A Read tool prints its file with line-number prefixes, as cat -n does or as
  # "1→". The line patterns see the line after the prefix.
  - name: read_output_line_numbers_cat_n
    entries:
      - { role: tool, output: "     1\tACCESS_KEY=FAKEcanary0access1key\n     2\tSECRET_KEY=FAKE-canary-value-not-real-0123456789-abcd\n" }
    want:
      - { kind: credential_file_output, entry: 0, role: tool, rule: secret_env_listing, preview: "2 secret-named lines=****" }

  - name: read_output_line_numbers_arrow
    entries:
      - { role: tool, output: "1→ACCESS_KEY=FAKEcanary0access1key\n2→SECRET_KEY=FAKE-canary-value-not-real-0123456789-abcd" }
    want:
      - { kind: credential_file_output, entry: 0, role: tool, rule: secret_env_listing, preview: "2 secret-named lines=****" }

  - name: env_variant_and_kube_config_reads
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/.env.local"}', toolKind: read }
      - { role: tool, toolCallId: call-1, output: "     1\tFEATURE=on" }
      - { role: assistant, toolCallId: call-2, toolInput: '{"file_path": "/srv/app/.env.production"}', toolKind: read }
      - { role: tool, toolCallId: call-2, output: "     1\tFEATURE=on" }
      - { role: assistant, toolCallId: call-3, toolInput: '{"file_path": "/home/dev/.kube/config"}', toolKind: read }
      - { role: tool, toolCallId: call-3, output: "apiVersion: v1\nkind: Config" }
    want:
      - { kind: credential_file_output, entry: 1, role: tool, rule: credential_file_name, preview: ".env.local: content=****" }
      - { kind: credential_file_output, entry: 3, role: tool, rule: credential_file_name, preview: ".env.production: content=****" }
      - { kind: credential_file_output, entry: 5, role: tool, rule: credential_file_name, preview: ".kube/config: content=****" }

  - name: env_template_and_plain_config_are_not_credentials
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/.env.example"}', toolKind: read }
      - { role: tool, toolCallId: call-1, output: "     1\tFEATURE=on" }
      - { role: assistant, toolCallId: call-2, toolInput: '{"file_path": "/srv/app/config"}', toolKind: read }
      - { role: tool, toolCallId: call-2, output: "     1\tFEATURE=on" }
      - { role: assistant, toolCallId: call-3, toolInput: '{"file_path": "/srv/app/.environment"}', toolKind: read }
      - { role: tool, toolCallId: call-3, output: "     1\tFEATURE=on" }

  # A Write or Edit tool call carries the file content in its input, so writing a
  # credential file publishes its content as reading one does.
  - name: env_written_through_write_and_edit
    entries:
      - { role: assistant, toolCallId: call-1, toolInput: '{"file_path": "/srv/app/.env", "content": "FEATURE=on\n"}', toolKind: edit }
      - { role: tool, toolCallId: call-1, output: "file written" }
      - { role: assistant, toolCallId: call-2, toolInput: '{"file_path": "/srv/app/.env.production", "old_string": "FEATURE=off", "new_string": "FEATURE=on"}', toolKind: edit }
      - { role: tool, toolCallId: call-2, output: "file edited" }
    want:
      - { kind: credential_file_output, entry: 0, role: assistant, rule: credential_file_write, preview: ".env: written content=****" }
      - { kind: credential_file_output, entry: 2, role: assistant, rule: credential_file_write, preview: ".env.production: written content=****" }

  - name: tool_output_json_array_is_decoded
    entries:
      - { role: tool, output: '[{"type": "text", "text": "ACCESS_KEY=FAKEcanary0access1key\nSECRET_KEY=FAKE-canary-value-not-real-0123456789-abcd"}]' }
    want:
      - { kind: credential_file_output, entry: 0, role: tool, rule: secret_env_listing, preview: "2 secret-named lines=****" }

  # A password-named value is caught with symbols in it or with no digit.
  - name: password_named_value_with_symbols_or_no_digit
    entries:
      - { role: user, text: "db_password = Xy7!kL9#mN2$pQ4%rS6^tU8&" }
      - { role: user, text: "DB_PASSWORD=correct-horse-battery-staple-river" }
      - { role: assistant, text: 'client_secret: "FAKE canary"' }
    want:
      - { kind: credential_assignment, entry: 0, role: user, rule: credential_name_value, preview: "db_password=**** (len<32)" }
      - { kind: credential_assignment, entry: 1, role: user, rule: credential_name_value, preview: "DB_PASSWORD=**** (len 32-63)" }

  - name: inline_mysql_password
    entries:
      - { role: assistant, toolInput: '{"command": "mysql -h db.internal -u root -pFAKEcanaryPw1 appdb"}', toolKind: execute }
      - { role: user, text: "run mysqldump --user=root -pFAKE!canary appdb > dump.sql" }
    want:
      - { kind: credential_assignment, entry: 0, role: assistant, rule: inline_password_flag, preview: "mysql -p**** (len<32)" }
      - { kind: credential_assignment, entry: 1, role: user, rule: inline_password_flag, preview: "mysqldump -p**** (len<32)" }

  # Credential-like names on configuration, code and prompts are not values.
  - name: password_like_names_without_a_value_ignored
    entries:
      - { role: tool, output: "PASSWORD_MIN_LENGTH=12\nTOKEN_TTL=3600\nPWD=/home/dev/projects/service-api" }
      - { role: assistant, toolInput: '{"command": "mysql -u root -p appdb"}', toolKind: execute }
      - { role: assistant, text: "const login = { password: hashedPassword, token: request.headers.authorization };" }
      - { role: assistant, text: 'password = os.Getenv("DB_PASSWORD") and token: ${{ secrets.DEPLOY_TOKEN }}' }
      - { role: assistant, text: "password: true, secret: null, api_token: $API_TOKEN, db_password: ********" }
      - { role: assistant, text: "secret: https://vault.example.org/v1/app" }
      - { role: assistant, text: "SECRET_MANAGER_REGION=us-west-2b" }
      - { role: assistant, text: "PASSWORD_HASH_ALGORITHM=argon2id-v19" }
      - { role: assistant, toolInput: '{"command": "mysql -u root -p\"\" appdb"}', toolKind: execute }

  # A preview never holds the matched value: an address keeps only its top
  # level domain, and a tenant host only its fixed suffix.
  - name: previews_hold_no_domain_or_tenant
    entries:
      - { role: user, text: "write to j.doe@bücher.de" }
      - { role: user, text: "https://contoso-legal.sharepoint.com/:x:/r/FAKEdocument" }
    want:
      - { kind: foreign_email, entry: 0, role: user, rule: foreign_email, preview: "***@***.de" }
      - { kind: shareable_document_link, entry: 1, role: user, rule: share_sharepoint, preview: "****.sharepoint.com/:x:/****" }

  # An address the assistant writes, or puts in a tool call, is published as
  # one in a prompt is.
  - name: foreign_email_in_assistant_text_and_tool_input
    entries:
      - { role: assistant, text: "I will mail andré@univ.example.edu the results" }
      - { role: assistant, toolInput: '{"command": "git commit --author \"Andre <andré@univ.example.org>\""}', toolKind: execute }
    want:
      - { kind: foreign_email, entry: 0, role: assistant, rule: foreign_email, preview: "***@***.edu" }
      - { kind: foreign_email, entry: 1, role: assistant, rule: foreign_email, preview: "***@***.org" }
