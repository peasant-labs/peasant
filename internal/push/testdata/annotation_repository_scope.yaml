# Which annotations a push publishes when a session selection is active, with
# and without a repository scope on top of it.
#
# The session gate alone has a hole: an annotation with no target session passes
# it unconditionally. That is correct for a selection, which is about sessions,
# but wrong for a repository scope: a hook installed in one repository would
# publish annotations belonging to every other one, on every commit.
#
# Under a repository scope an unattributable annotation is withheld, and a
# project-targeted one is published only when the project it names is the one in
# scope. Without a repository scope, behaviour is exactly what it was.
#
# The Share wizard and the CLI chooser publish sessions the user chose one by
# one, so they scope the annotation push to exactly those sessions
# (sessions-only): an annotation with no target session is withheld, whatever
# project it names.
#
# Every case must account for all five candidates: leaving one unlisted would let
# a silent publish pass unnoticed. Deleting a case fails
# annotation_repository_scope.manifest.yaml, and every scope needs a case.
cases:
  - name: a selection alone publishes everything it cannot attribute to a session
    scope: selection-only
    published:
      - selected-session
      - scoped-project
      - other-project
      - unattributable
    withheld:
      - other-session

  - name: a repository scope publishes only what it can attribute to that repository
    scope: repository-scoped
    published:
      - selected-session
      - scoped-project
    withheld:
      - other-session
      - other-project
      - unattributable

  - name: a sessions-only scope publishes only the annotations of the chosen sessions
    scope: sessions-only
    published:
      - selected-session
    withheld:
      - other-session
      - scoped-project
      - other-project
      - unattributable
