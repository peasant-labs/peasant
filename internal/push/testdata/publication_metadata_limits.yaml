  - {name: mapper_output_past_former_cap, path: mapper-output, documentBytes: 4097, accepted: true, redactorCalled: true}
  - {name: preflight_input_below_limit, path: preflight-input, documentBytes: 8191, accepted: true}
  - {name: preflight_input_at_limit, path: preflight-input, documentBytes: 8192, accepted: true}
  - {name: preflight_input_above_limit, path: preflight-input, documentBytes: 8193, accepted: false, errorContains: 'document exceeds 8192 bytes'}
  - {name: preflight_input_past_former_cap, path: preflight-input, documentBytes: 4097, accepted: true}
  - {name: final_preflight_below_limit, path: final-preflight, documentBytes: 8191, accepted: true}
