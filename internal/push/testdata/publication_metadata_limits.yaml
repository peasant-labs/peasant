# The production caps as literal data. A revert of the 128 MiB metadata cap or a
# removed mapper/preflight scan fails these checks; nothing here materializes a
# 128 MiB document.
policy:
  capBytes: 134217728
  belowCapBytes: 134217727
  atCapBytes: 134217728
  aboveCapBytes: 134217729
  formerCapBytes: 4194304
  depth: 64
  refusal: 'raw JSON validation failed at schema.ScanRawJSONDocument: document exceeds 134217728 bytes; decoding would exceed the caller boundary; reduce the document'

# Small limits injected through the unexported mapper/preflight seams. The same
# production paths run with these, so every mechanics case is a few KiB.
mechanics:
  limitBytes: 8192
  formerLimitBytes: 4096
  depth: 64

cases:
  - {name: mapper_input_below_limit, path: mapper-input, documentBytes: 8191, accepted: true, redactorCalled: true}
  - {name: mapper_input_at_limit, path: mapper-input, documentBytes: 8192, accepted: true, redactorCalled: true}
  - {name: mapper_input_above_limit, path: mapper-input, documentBytes: 8193, accepted: false, redactorCalled: false, errorContains: 'document exceeds 8192 bytes'}
  - {name: mapper_input_past_former_cap, path: mapper-input, documentBytes: 4097, accepted: true, redactorCalled: true}
  - {name: mapper_output_below_limit, path: mapper-output, documentBytes: 8191, accepted: true, redactorCalled: true}
  - {name: mapper_output_at_limit, path: mapper-output, documentBytes: 8192, accepted: true, redactorCalled: true}
