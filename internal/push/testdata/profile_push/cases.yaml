cases:
  - &success
    name: push_success_with_receipt
    sessions: [sess_a]
    concurrency: 1
    publishStatus: 201
    expectedPublished: 1
    expectedSaved: 1
    expectedRequests: 2
    expectedDBReads: 6
    expectedHighWater: 1
    stages: [push.discovery, push.selection, push.session, push.session.load, push.session.redact, push.payload.build, push.negotiate, push.publish, push.receipt.persist]
  - <<: *success
    name: push_partial_failure
    sessions: [sess_b, sess_a]
    failSession: sess_b
    publishStatus: 422
    expectedFailed: 1
    expectedRequests: 3
    expectedDBReads: 10
  - <<: *success
    name: push_retryable_publish_failure
    publishStatus: 503
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    retryable: true
    failedStage: push.publish
    stages: [push.publish, push.retry]
  - <<: *success
    name: push_nonretryable_publish_failure
    publishStatus: 422
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    failedStage: push.publish
    stages: [push.publish, push.retry]
  - <<: *success
    name: push_visibility_update
    visibility: public
    expectedRequests: 3
    expectedPatches: 1
    stages: [push.publish, push.visibility.update, push.receipt.persist]
  - <<: *success
    name: push_visibility_failure
    visibility: public
    patchStatus: 403
    expectedRequests: 3
    expectedPatches: 1
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    failedStage: push.visibility.update
    stages: [push.publish, push.visibility.update, push.retry]
  - <<: *success
    name: push_annotation_publish
    annotations: true
    expectedRequests: 4
    expectedAnnotationRequests: 2
    expectedDBReads: 9
    stages: [push.publish, push.annotations.publish]
  - <<: *success
    name: push_annotation_partial_failure
    annotations: true
    annotationErrors: 1
    expectedRequests: 4
    expectedAnnotationRequests: 2
    expectedDBReads: 9
    failedStage: push.annotations.publish
    stages: [push.annotations.publish]
  - <<: *success
    name: push_receipt_persist
    persistFailure: true
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    failedStage: push.receipt.persist
  - <<: *success
    name: push_receipt_mismatch
    receiptMismatch: true
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    failedStage: push.receipt.persist
  - <<: *success
    name: push_receipt_malformed
    malformedReceipt: true
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    failedStage: push.publish
    stages: [push.publish]
  - <<: *success
    name: push_concurrent_ordering
    sessions: [sess_c, sess_a, sess_b]
    concurrency: 3
    barrier: true
    expectedPublished: 3
    expectedSaved: 3
    expectedRequests: 4
    expectedDBReads: 14
    expectedHighWater: 3
  - <<: *success
    name: push_disabled_invariance
    disabled: true
  - <<: *success
    name: push_dry_run
    dryRun: true
    expectedPublished: 0
    expectedSaved: 0
    expectedRequests: 0
    expectedDBReads: 5
    expectedHighWater: 0
    stages: [push.discovery, push.selection, push.session.load, push.session.redact, push.payload.build]
  - <<: *success
    name: push_preflight_read_failure
    entryReadFailOnCall: 1
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    expectedRequests: 0
    expectedDBReads: 3
    expectedHighWater: 0
    failedStage: push.session.load
    stages: [push.discovery, push.selection, push.session.load]
  - <<: *success
    name: push_session_read_failure
    entryReadFailOnCall: 2
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    expectedRequests: 1
    expectedDBReads: 5
    failedStage: push.session.load
    stages: [push.session, push.session.load]
  - <<: *success
    name: push_provider_query_accounting
    sources: [claude-code, codex]
    expectedDBReads: 7
  - <<: *success
    name: push_selection_excludes_everything
    excludeAll: true
    expectedPublished: 0
    expectedSaved: 0
    expectedRequests: 0
    expectedDBReads: 2
    expectedHighWater: 0
    stages: [push.discovery, push.selection]
  - <<: *success
    name: push_preflight_counts_unstarted_sessions
    sessions: [sess_b, sess_a]
    entryReadFailOnCall: 1
    expectedPublished: 0
    expectedFailed: 1
    expectedSkipped: 1
    expectedSaved: 0
    expectedRequests: 0
    expectedDBReads: 3
    expectedHighWater: 0
    failedStage: push.session.load
    stages: [push.discovery, push.selection, push.session.load]
  - <<: *success
    name: push_unsafe_subject_never_enters_profile
    sessions: [PRIVATE_TRANSCRIPT_SENTINEL]
    expectedPublished: 0
    expectedFailed: 1
    expectedSaved: 0
    expectedRequests: 1
    failedStage: push.payload.build
    stages: [push.session, push.payload.build]
  - <<: *success
    name: push_negotiation_fallback_is_skipped
    negotiateStatus: 503
    retryable: true
    skippedStage: push.negotiate
  - <<: *success
    name: push_config_recorder_reaches_transport
    configRecorder: true
