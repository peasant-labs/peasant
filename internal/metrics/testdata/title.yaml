cases:
  - name: shared_project_path_parity
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>private setup</system-reminder><user_query>Fix /Users/alice/work/app/src/auth.go</user_query>'
    expected: 'Fix /Users/<USER>/<PATH>/app/src/auth.go'
  - name: canonical_cwd_fallback
    assertion: exact
    harness: claude-code
    canonical_cwd: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: 'Review /Users/alice/work/app/internal/store/query.go'
    expected: 'Review /Users/<USER>/<PATH>/app/internal/store/query.go'
  - name: nested_user_is_not_title
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 1
        preview: nested candidate
      - role: user
        depth: 0
        preview: root candidate
    expected: root candidate
  - name: malformed_wrapper_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>truncated private setup'
  - name: no_root_user_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: assistant
        depth: 0
        preview: assistant text
  - name: context_lookup_error_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    context_error: stored context unavailable
    entries:
      - role: user
        depth: 0
        preview: 'Do not generate this title without its stored context'
  - name: unicode_code_point_cap
    assertion: unicode_cap
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '修正 認証 処理 の 問題 を 調査 して 安全 な 解決 方法 を 実装 し 回帰 テスト を 追加 して 文書 も 更新 してください 修正 認証 処理 の 問題 を 調査 して 安全 な 解決 方法 を 実装 し 回帰 テスト を 追加 して 文書 も 更新 してください'
    max_runes: 80
  - name: generated_title_is_idempotent
    assertion: idempotent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: 'Fix /Users/alice/work/app/src/auth.go without exposing private paths'
    expected: 'Fix /Users/<USER>/<PATH>/app/src/auth.go without exposing private paths'
  - name: command_with_args_titles_the_argument_prose
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: "<command-name>/research</command-name>\n<command-message>research</command-message>\n<command-args>compare the two cache eviction policies</command-args>"
    expected: 'compare the two cache eviction policies'
  - name: bare_command_then_prose_titles_the_prose
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: "<command-name>/effort</command-name>\n<command-message>effort</command-message>\n<command-args></command-args>"
      - role: user
        depth: 0
        preview: 'Raise the retry budget for the ingest worker'
    expected: 'Raise the retry budget for the ingest worker'
  - name: local_command_output_then_prose_titles_the_prose
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<local-command-caveat>Caveat: the messages below were generated while running local commands.</local-command-caveat>'
      - role: user
        depth: 0
        preview: '<local-command-stdout>On branch develop, nothing to commit</local-command-stdout>'
      - role: user
        depth: 0
        preview: 'Explain why the branch has no staged changes'
    expected: 'Explain why the branch has no staged changes'
  - name: codex_environment_context_then_prose_titles_the_prose
    assertion: exact
    harness: codex
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<environment_context>shell: zsh, os: linux</environment_context>'
      - role: user
        depth: 0
        preview: 'Add a timeout to the publish request'
    expected: 'Add a timeout to the publish request'
  - name: system_reminder_then_prose_titles_the_prose
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>private setup notes</system-reminder>'
      - role: user
        depth: 0
        preview: 'Document the pull skip-gate behaviour'
    expected: 'Document the pull skip-gate behaviour'
  - name: malformed_first_candidate_then_prose_titles_the_prose
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>truncated private setup'
      - role: user
        depth: 0
        preview: 'Rename the release guard step'
    expected: 'Rename the release guard step'
  - name: only_injected_turns_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<local-command-caveat>Caveat: the messages below were generated while running local commands.</local-command-caveat>'
      - role: user
        depth: 0
        preview: "<command-name>/effort</command-name>\n<command-message>effort</command-message>"
      - role: user
        depth: 0
        preview: 'Base directory for this skill: /Users/alice/.claude/skills/epoch'
