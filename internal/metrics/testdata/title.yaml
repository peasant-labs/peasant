cases:
  - name: shared_project_path_parity
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>private setup</system-reminder><user_query>Fix /Users/alice/work/app/src/auth.go</user_query>'
    expected: 'Fix /Users/<USER>/<PATH>/app/src/auth.go'
  - name: canonical_cwd_fallback
    assertion: exact
    harness: claude-code
    canonical_cwd: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: 'Review /Users/alice/work/app/internal/store/query.go'
    expected: 'Review /Users/<USER>/<PATH>/app/internal/store/query.go'
  - name: nested_user_is_not_title
    assertion: exact
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 1
        preview: nested candidate
      - role: user
        depth: 0
        preview: root candidate
    expected: root candidate
  - name: malformed_wrapper_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '<system-reminder>truncated private setup'
  - name: no_root_user_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: assistant
        depth: 0
        preview: assistant text
  - name: context_lookup_error_omits_title
    assertion: absent
    harness: claude-code
    worktree: /Users/alice/work/app
    context_error: stored context unavailable
    entries:
      - role: user
        depth: 0
        preview: 'Do not generate this title without its stored context'
  - name: unicode_code_point_cap
    assertion: unicode_cap
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: '修正 認証 処理 の 問題 を 調査 して 安全 な 解決 方法 を 実装 し 回帰 テスト を 追加 して 文書 も 更新 してください 修正 認証 処理 の 問題 を 調査 して 安全 な 解決 方法 を 実装 し 回帰 テスト を 追加 して 文書 も 更新 してください'
    max_runes: 80
  - name: generated_title_is_idempotent
    assertion: idempotent
    harness: claude-code
    worktree: /Users/alice/work/app
    entries:
      - role: user
        depth: 0
        preview: 'Fix /Users/alice/work/app/src/auth.go without exposing private paths'
    expected: 'Fix /Users/<USER>/<PATH>/app/src/auth.go without exposing private paths'
