# Segment read and directory cases over synthetic turns. No real transcript
# text, session id or personal path is recorded here.
directory_cases:
  - name: empty-session
    turns: []
    expected: {totalTurns: 0, totalSegments: 0}
  - name: single-segment-session
    turns:
      - {index: 4, role: user, contentBytes: 64}
      - {index: 8, role: assistant, contentBytes: 64}
    expected: {totalTurns: 2, totalSegments: 1}
segment_cases:
  # A page of ordinary rows is served whole; none is truncated.
  - name: twelve-small-rows
    turns:
      - {index: 0, role: user, contentBytes: 1024}
      - {index: 4, role: assistant, contentBytes: 1024}
      - {index: 8, role: user, contentBytes: 1024}
      - {index: 12, role: assistant, contentBytes: 1024}
      - {index: 16, role: user, contentBytes: 1024}
      - {index: 20, role: assistant, contentBytes: 1024}
      - {index: 24, role: user, contentBytes: 1024}
      - {index: 28, role: assistant, contentBytes: 1024}
      - {index: 32, role: user, contentBytes: 1024}
      - {index: 36, role: assistant, contentBytes: 1024}
      - {index: 40, role: user, contentBytes: 1024}
      - {index: 44, role: assistant, contentBytes: 1024}
    expected: {turns: 12, truncated: false, turnByteLength: 1026, segmentByteLength: 12312}
  # A single turn larger than the segment budget is alone in its segment,
  # bounded per field, and reports its pre-bound size.
  - name: one-oversized-turn
    turns:
      - {index: 4, role: assistant, contentBytes: 4194304}
    expected: {turns: 1, truncated: true, turnByteLength: 4194306, segmentByteLength: 4194306}
  # A turn with an oversized tool result reports the pre-bound sum.
  - name: oversized-tool-result-turn
    turns:
      - {index: 4, role: assistant, contentBytes: 10, toolArgumentsBytes: [64], toolResultBytes: [2097152]}
    expected: {turns: 1, truncated: true, turnByteLength: 2097232, segmentByteLength: 2097232}
  # A turn larger than the 8 MiB continuation budget is served whole: the soft
  # byte budget rises to the directory's declared segment size, so the Limit that
  # already bounds the read is the only stop. Each field is still bounded for
  # display and the row reports its pre-bound size.
  - name: oversized-multi-entry-turn
    turns:
      - {index: 4, role: assistant, contentBytes: 10, toolArgumentsBytes: [64, 64, 64, 64, 64], toolResultBytes: [2097152, 2097152, 2097152, 2097152, 2097152]}
    expected: {turns: 1, truncated: true, turnByteLength: 10486112, segmentByteLength: 10486112}
  # A store that returns the declared turn range but folds one turn from fewer
  # entries is caught by the byte-length check; it is a genuine partial fold, not
  # a budget stop.
  - name: partial-turn-fold
    turns:
      - {index: 4, role: assistant, contentBytes: 10, toolArgumentsBytes: [64, 64], toolResultBytes: [1024, 2048]}
    dropOnRead: [5]
    expected: {status: 409, contains: ["declared 3220 bytes", "returned 2128 bytes"], notContains: ["peasant harvest --force"]}
  # The directory declares a longer range than a damaged store read returns:
  # the read refuses with 409 instead of serving a short segment.
  - name: short-store-page
    turns:
      - {index: 0, role: user, contentBytes: 64}
      - {index: 4, role: assistant, contentBytes: 64}
      - {index: 8, role: user, contentBytes: 64}
    shortAfter: 1
    expected: {status: 409, contains: ["declared turns 0-8"]}
# Conversation turn positions on the directory read. Turns are written as runs:
# each run adds count turns of one size, spaced four entry indexes apart. The
# role "alternating" gives user to an even session position and assistant to an
# odd one; a system run adds rows that are served but hold no position. A turn
# measures contentBytes + 2. Every expected number is a literal.
position_cases:
  # Four segments over 80 turns: 77 user or assistant text turns and 3 system
  # rows, one system row in each of the first three segments. The budget fits
  # twenty 50-byte turns, twenty-five 40-byte turns, and eighteen 55-byte turns.
  - name: positions-eighty-rows-three-system
    budgetBytes: 1000
    runs:
      - {count: 10, role: alternating, contentBytes: 48}
      - {count: 1, role: system, contentBytes: 48}
      - {count: 9, role: alternating, contentBytes: 48}
      - {count: 12, role: alternating, contentBytes: 38}
      - {count: 1, role: system, contentBytes: 38}
      - {count: 12, role: alternating, contentBytes: 38}
      - {count: 9, role: alternating, contentBytes: 53}
      - {count: 1, role: system, contentBytes: 53}
      - {count: 25, role: alternating, contentBytes: 53}
    expected:
      totalTurns: 80
      totalSegments: 4
      totalConversationTurns: 77
      pages: 1
      segments:
        - {index: 0, before: 0, count: 19}
        - {index: 1, before: 19, count: 24}
        - {index: 2, before: 43, count: 17}
        - {index: 3, before: 60, count: 17}
  # More segments than one directory page holds, cut by the production cut with
  # a budget of one turn per segment. The system row is segment 6000, so the
  # second page's first segment has 9,999 conversation turns before it: before
  # is a session-wide count that a page does not restart.
  - name: positions-paged-second-page
    budgetBytes: 10
    page: 2
    runs:
      - {count: 6000, role: alternating, contentBytes: 8}
      - {count: 1, role: system, contentBytes: 8}
      - {count: 4049, role: alternating, contentBytes: 8}
    expected:
      totalTurns: 10050
      totalSegments: 10050
      totalConversationTurns: 10049
      pages: 2
      pageSegments: 50
      segments:
        - {index: 10000, before: 9999, count: 1}
        - {index: 10049, before: 10048, count: 1}
  # The cut returns a second segment that starts one conversation turn late.
  # The directory still answers, without any position field, and says why once.
  - name: positions-withheld-on-failed-self-check
    budgetBytes: 20
    runs:
      - {count: 6, role: alternating, contentBytes: 8}
    corrupt: {segment: 1, addBefore: 1}
    expected:
      totalTurns: 6
      totalSegments: 3
      pages: 1
      withheld: {rule: continuity, segment: 1}
  # The cut returns a negative count on its second segment.
  - name: positions-withheld-on-negative-count
    budgetBytes: 20
    runs:
      - {count: 6, role: alternating, contentBytes: 8}
    corrupt: {segment: 1, setCount: -1}
    expected:
      totalTurns: 6
      totalSegments: 3
      pages: 1
      withheld: {rule: continuity, segment: 1}
