# Home repository identity evidence. Home no longer consults the saved selector,
# so it no longer needs repository topology at all: a recorded directory that is
# outside Git, and a captured worktree that no longer resolves, are both ordinary
# stored rows on this page.
requiredNames: [non-git-recorded-directory, stale-git-worktree-directory]
cases:
  - name: non-git-recorded-directory
    storedWorktree: false
    status: 200
    ids: [session-recorded-directory]
  - name: stale-git-worktree-directory
    storedWorktree: true
    status: 200
    ids: [session-recorded-directory]
