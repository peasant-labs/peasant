# Home repository identity evidence. The page itself no longer filters by the
# saved selector, but its publication metadata still reports canonical ingest
# membership. A project recorded outside Git is ordinary data; a captured
# worktree that no longer resolves makes that membership ambiguous and fails the
# metadata read closed.
requiredNames: [non-git-recorded-directory, stale-git-worktree-directory]
cases:
  - name: non-git-recorded-directory
    storedWorktree: false
    status: 200
    ids: [session-recorded-directory]
  - name: stale-git-worktree-directory
    storedWorktree: true
    status: 500
    ids: []
