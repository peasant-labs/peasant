cases:
  - name: selected_session_newer_hidden_sibling
    classification: must-pass
    provenance: {source: requirement, ref: familiarity-visible-selected}
    mutation: {description: add a newer hidden sibling that touches both hidden-only and shared files}
    input:
      project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      selection:
        mode: selected
        harnesses:
          claude-code:
            sessions: [11111111-1111-1111-1111-111111111111]
      sessions:
        - id: 11111111-1111-1111-1111-111111111111
          start_ms: 1700000000000
          duration_ms: 60000
          files:
            - {path: src/selected.go, interaction: discussed, turn_count: 3, human_turns: 2}
            - {path: src/shared.go, interaction: read, turn_count: 2, human_turns: 1}
        - id: 22222222-2222-2222-2222-222222222222
          start_ms: 1710000000000
          duration_ms: 120000
          files:
            - {path: src/hidden.go, interaction: questioned, turn_count: 8, human_turns: 5}
            - {path: src/shared.go, interaction: questioned, turn_count: 7, human_turns: 5}
    expected:
      file_paths: [src/selected.go, src/shared.go]
      file_session_counts: {src/selected.go: 1, src/shared.go: 1}
      file_total_turns: {src/selected.go: 3, src/shared.go: 2}
      last_engaged_session: {src/selected.go: 11111111-1111-1111-1111-111111111111, src/shared.go: 11111111-1111-1111-1111-111111111111}
      trail_session_ids: [11111111-1111-1111-1111-111111111111]
      suggestion_paths: [src/selected.go]
      absent_session_ids: [22222222-2222-2222-2222-222222222222]
      arrays_non_null: true

  - name: hidden_only
    classification: must-pass
    provenance: {source: requirement, ref: familiarity-visible-hidden-only}
    mutation: {description: leave project session files present while the selected allowlist matches none}
    input:
      project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      selection:
        mode: selected
        harnesses:
          claude-code:
            sessions: [99999999-9999-9999-9999-999999999999]
      sessions:
        - id: 22222222-2222-2222-2222-222222222222
          start_ms: 1710000000000
          duration_ms: 120000
          files:
            - {path: src/hidden.go, interaction: questioned, turn_count: 8, human_turns: 5}
    expected:
      file_paths: []
      file_session_counts: {}
      file_total_turns: {}
      last_engaged_session: {}
      trail_session_ids: []
      suggestion_paths: []
      absent_session_ids: [22222222-2222-2222-2222-222222222222]
      arrays_non_null: true

  - name: all_mode_baseline
    classification: must-pass
    provenance: {source: requirement, ref: familiarity-visible-all}
    mutation: {description: admit both sessions so the raw project-wide baseline remains unchanged}
    input:
      project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      selection: {mode: all}
      sessions:
        - id: 11111111-1111-1111-1111-111111111111
          start_ms: 1700000000000
          duration_ms: 60000
          files:
            - {path: src/visible.go, interaction: discussed, turn_count: 3, human_turns: 2}
            - {path: src/shared.go, interaction: read, turn_count: 2, human_turns: 1}
        - id: 22222222-2222-2222-2222-222222222222
          start_ms: 1710000000000
          duration_ms: 120000
          files:
            - {path: src/hidden.go, interaction: questioned, turn_count: 8, human_turns: 5}
            - {path: src/shared.go, interaction: questioned, turn_count: 7, human_turns: 5}
    expected:
      file_paths: [src/hidden.go, src/shared.go, src/visible.go]
      file_session_counts: {src/hidden.go: 1, src/shared.go: 2, src/visible.go: 1}
      file_total_turns: {src/hidden.go: 8, src/shared.go: 9, src/visible.go: 3}
      last_engaged_session: {src/hidden.go: 22222222-2222-2222-2222-222222222222, src/shared.go: 22222222-2222-2222-2222-222222222222, src/visible.go: 11111111-1111-1111-1111-111111111111}
      trail_session_ids: [22222222-2222-2222-2222-222222222222, 11111111-1111-1111-1111-111111111111]
      suggestion_paths: [src/hidden.go, src/shared.go, src/visible.go]
      absent_session_ids: []
      arrays_non_null: true

  - name: policy_error
    classification: must-fail
    provenance: {source: requirement, ref: familiarity-visible-conflict}
    mutation: {description: give the project conflicting remote and name branch rules before aggregation}
    input:
      project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      selection:
        mode: selected
        harnesses:
          claude-code:
            projects:
              - {gitRemote: "example.test/org/repo", branches: [main]}
              - {name: /home/test/repo, branches: [dev]}
      sessions:
        - id: 11111111-1111-1111-1111-111111111111
          start_ms: 1700000000000
          duration_ms: 60000
          git_remote: "git@example.test:org/repo.git"
          git_branch: main
          files:
            - {path: src/conflict.go, interaction: read, turn_count: 1, human_turns: 0}
    expected:
      error_contains: conflicting project branch rules

  - name: selected_session_survives_hidden_trail_cap
    classification: must-pass
    provenance: {source: boundary, ref: familiarity-visible-trail-cap}
    mutation: {description: place eleven newer hidden sessions ahead of the selected trail before the ten-trail cap}
    input:
      project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      selection:
        mode: selected
        harnesses:
          claude-code:
            sessions: [ffffffff-ffff-ffff-ffff-ffffffffffff]
      sessions:
        - {id: 00000000-0000-0000-0000-000000000001, start_ms: 1710000011000, duration_ms: 1000, files: [{path: src/hidden-1.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000002, start_ms: 1710000010000, duration_ms: 1000, files: [{path: src/hidden-2.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000003, start_ms: 1710000009000, duration_ms: 1000, files: [{path: src/hidden-3.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000004, start_ms: 1710000008000, duration_ms: 1000, files: [{path: src/hidden-4.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000005, start_ms: 1710000007000, duration_ms: 1000, files: [{path: src/hidden-5.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000006, start_ms: 1710000006000, duration_ms: 1000, files: [{path: src/hidden-6.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000007, start_ms: 1710000005000, duration_ms: 1000, files: [{path: src/hidden-7.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000008, start_ms: 1710000004000, duration_ms: 1000, files: [{path: src/hidden-8.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-000000000009, start_ms: 1710000003000, duration_ms: 1000, files: [{path: src/hidden-9.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-00000000000a, start_ms: 1710000002000, duration_ms: 1000, files: [{path: src/hidden-10.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: 00000000-0000-0000-0000-00000000000b, start_ms: 1710000001000, duration_ms: 1000, files: [{path: src/hidden-11.go, interaction: read, turn_count: 1, human_turns: 0}]}
        - {id: ffffffff-ffff-ffff-ffff-ffffffffffff, start_ms: 1700000000000, duration_ms: 1000, files: [{path: src/selected-cap.go, interaction: read, turn_count: 1, human_turns: 0}]}
    expected:
      file_paths: [src/selected-cap.go]
      file_session_counts: {src/selected-cap.go: 1}
      file_total_turns: {src/selected-cap.go: 1}
      last_engaged_session: {src/selected-cap.go: ffffffff-ffff-ffff-ffff-ffffffffffff}
      trail_session_ids: [ffffffff-ffff-ffff-ffff-ffffffffffff]
      suggestion_paths: []
      absent_session_ids:
