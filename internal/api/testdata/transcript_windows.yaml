# Window descriptors served by the mounted window read over the sparse 55-turn
# session. The anchor, extent and covering-segment rule is the wire contract's
# (schema.ResolveTranscriptWindow) and its cases live with the contract; these
# rows pin that the route hands the resolver the directory it built: every
# turn's identity and role, and the refs cut from the same turns.
cases:
  - name: window-ten-assistants-each-side
    anchor: 72
    span: 10
    expected: {anchorTurn: 72, firstTurn: 39, lastTurn: 103, hasOlder: true, hasNewer: true}
  - name: window-snaps-lower-user-turn
    anchor: 74
    span: 1
    expected: {anchorTurn: 72, firstTurn: 71, lastTurn: 76, hasOlder: true, hasNewer: true}
  - name: window-at-transcript-end
    anchor: 149
    span: 10
    expected: {anchorTurn: 140, firstTurn: 112, lastTurn: 149, hasOlder: true, hasNewer: false}
