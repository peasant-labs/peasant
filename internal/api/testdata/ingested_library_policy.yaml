requiredNames: [mode_all, selected_restrictive, selected_empty, selected_excluded, selected_stale]
# Home is a root page. The helper is grouped under its person-driven owner, so it
# appears on that owner's child page; the combined set is the whole library.
homeRootIds: [lib-c, lib-b, lib-a]
homeChildIds: [lib-h]
homeParentId: lib-a
cases:
  - name: mode_all
    selection:
      mode: all
    outside_selection: []

  - name: selected_restrictive
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: alpha-project}
    # Only lib-a is admitted by the saved ingest/push selector.
    outside_selection: [lib-b, lib-c, lib-h]

  - name: selected_empty
    selection:
      mode: selected
    outside_selection: [lib-a, lib-b, lib-c, lib-h]

  - name: selected_excluded
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: alpha-project}
          exclusions:
            sessions: [lib-a]
    outside_selection: [lib-a, lib-b, lib-c, lib-h]

  - name: selected_stale
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: deleted-project}
          sessions: [lib-gone]
    outside_selection: [lib-a, lib-b, lib-c, lib-h]
