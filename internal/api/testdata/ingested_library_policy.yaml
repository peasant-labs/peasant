requiredNames: [mode_all, selected_restrictive, selected_empty, selected_excluded, selected_stale]
sessions:
  - {id: ses_liba, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, origin: user, pushable: true, text: libraryneedle}
  - {id: lib-b, projectHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, origin: user, pushable: true, text: libraryneedle}
  - {id: lib-c, projectHash: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc, origin: agent, pushable: true, text: libraryneedle}
  - {id: lib-h, projectHash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd, origin: agent, purpose: helper_review, owner: ses_liba, ownerState: target_known, pushable: true, text: libraryneedle}
# Home is a root page. The helper is grouped under its person-driven owner, so it
# appears on that owner's child page; the combined set is the whole library.
homeRootIds: [lib-c, lib-b, ses_liba]
homeChildIds: [lib-h]
homeParentId: ses_liba
# Project options carry no publication metadata and are ordered by project name,
# then hash: alpha, beta, gamma. The helper project has no root session.
homeProjectHashes:
  - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
cases:
  - name: mode_all
    selection:
      mode: all
    outside_selection: []

  - name: selected_restrictive
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: alpha-project}
    # Only ses_liba is admitted by the saved ingest/push selector.
    outside_selection: [lib-b, lib-c, lib-h]

  - name: selected_empty
    selection:
      mode: selected
    outside_selection: [ses_liba, lib-b, lib-c, lib-h]

  - name: selected_excluded
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: alpha-project}
          exclusions:
            sessions: [ses_liba]
    outside_selection: [ses_liba, lib-b, lib-c, lib-h]

  - name: selected_stale
    selection:
      mode: selected
      harnesses:
        codex:
          projects:
            - {name: deleted-project}
          sessions: [lib-gone]
    outside_selection: [ses_liba, lib-b, lib-c, lib-h]
