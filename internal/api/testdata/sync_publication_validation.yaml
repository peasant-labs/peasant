- name: incomplete-capture
  action: invalidate
  expectedError: metadata and indexed entries are not a verified capture
- name: missing-model
  # An assistant reply recorded no model: an ingest gap a re-index can fix.
  action: missing-model
  expectedError: run peasant ingest with source model evidence and retry
- name: no-model-reply
  # No assistant reply at all: the source names no model, and no re-index can
  # add one.
  action: no-model-reply
  expectedError: re-indexing cannot add one
- name: database-unavailable
  action: close
  expectedError: load publication input from peasant.db before publication
