# Link resolution versus discovery scope, on the mounted routes.
#
# Every row that must be ABSENT from the discovery list is paired with a control
# that differs only in the one fact that withholds it, so an absence cannot pass
# because the row would have been missing anyway:
#   hidden-agent-root            <-> listed-user-root          (origin)
#   hidden-unselected-user-root  <-> listed-user-root          (selection)
#   hidden-agent-subagent-row    <-> listed-user-subagent-row  (origin, both parented)
#
# Both hidden roles must still resolve through the by-id route, which applies
# NEITHER scope. That is the whole point: hiding is discovery scope, never
# access control.
harness: claude-code
# An identifier no stored session carries. The by-id route omits it instead of
# failing the batch, so one stale link cannot break a whole evidence set.
unresolvable_session_id: 7fffffff-ffff-4fff-8fff-ffffffffffff
rows:
  - role: listed-user-root
    session_id: 71111111-1111-4111-8111-111111111111
    project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    project_name: listed-project
    clone: listed-clone
    git_branch: main
    host_slug: github.com-example-listed
    start_ms: 1705276800000
    tokens_in: 1000
    tokens_out: 500
    turn_count: 10
    tool_call_count: 5
    duration_ms: 60000
    origin: user
    selected: true
    listed: true
