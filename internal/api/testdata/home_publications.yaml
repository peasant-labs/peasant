requiredNames:
  - historical-project-receipt
  - unpublished-filter-before-page
  - signed-out
  - other-origin
  - published-parent-unpublished-child
  - poison-on-page-refuses
  - current-project-filter
  - historical-receipt-is-not-current-project
sessions:
  - {id: sess_a, project: a}
  - {id: sess_b, project: a}
  - {id: sess_child, project: a}
  - {id: sess_z, project: c}
receipts:
  # Matches testutil.VillageFixtureAccountID used by the real credential helper.
  - {session: sess_a, origin: 'https://village.example', owner: &selected_account '11111111-1111-4111-8111-111111111111', project: b, transcript: '11111111-1111-4111-8111-111111111111', updated: 1000}
  - {session: sess_a, origin: 'https://village.example', owner: *selected_account, project: c, transcript: '22222222-2222-4222-8222-222222222222', updated: 2000}
  - {session: sess_b, origin: 'https://village.example', owner: '11111111-1111-4111-8111-222222222222', project: b, transcript: '33333333-3333-4333-8333-333333333333', updated: 2000}
  - {session: sess_b, origin: 'https://other.example', owner: *selected_account, project: b, transcript: '44444444-4444-4444-8444-444444444444', updated: 2000}
  - {session: sess_z, origin: 'https://village.example', owner: *selected_account, project: b, transcript: '55555555-5555-4555-8555-555555555555', updated: 2000, poison: true}
cases:
  - name: historical-project-receipt
    origin: https://village.example
    query: publication=published&maxItems=25&projectHash=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ids: [sess_a]
    states: [published]
    transcript: '22222222-2222-4222-8222-222222222222'
  - name: unpublished-filter-before-page
    origin: https://village.example
    query: publication=not-published&maxItems=25
    ids: [sess_b]
    states: [unpublished]
  - name: signed-out
    query: publication=published
    ids: []
    states: []
  - name: other-origin
    origin: https://absent.example
    query: publication=not-published&maxItems=25
    ids: [sess_a, sess_b, sess_z]
    states: [unpublished, unpublished, unpublished]
  - name: published-parent-unpublished-child
    origin: https://village.example
    query: parentSessionId=sess_a
    ids: [sess_child]
    states: [unpublished]
  - name: poison-on-page-refuses
    origin: https://village.example
    query: publication=published&maxItems=25&projectHash=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    status: 500
  - name: current-project-filter
    origin: https://village.example
    query: publication=published&maxItems=25&projectHash=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ids: [sess_a]
    states: [published]
    transcript: '22222222-2222-4222-8222-222222222222'
  - name: historical-receipt-is-not-current-project
    origin: https://village.example
    query: publication=published&projectHash=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    ids: []
    states: []
