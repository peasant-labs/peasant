# First-run selection-step UX: the pruned advance footer, the sessionless-root
# collapse default, and the select-all 3-way cycle (select all / unselect all /
# reset to the selection captured when the cycle activated). Every case drives
# the real kickstart Program against a config that does NOT yet exist (a
# genuine first run: nothing tracked), so only the `ingested` list marks a
# session as already imported. Two projects with distinct remotes give two
# independent roots.
expectedCaseCount: 8
listings:
  - harness: claude-code
    projectName: acme/alpha
    gitRemote: "git@github.com:acme/alpha.git"
    branch: main
    workingDir: /fixtures/alpha
    title: alpha session
    sessionId: a-1
  - harness: claude-code
    projectName: acme/beta
    gitRemote: "git@github.com:acme/beta.git"
    branch: main
    workingDir: /fixtures/beta
    title: beta session
    sessionId: b-1
cases:
  # No imported or tracked session anywhere: every root folds to its project
  # line, so a first run reads as a short project list, not every session.
  - name: first-run-folds-every-sessionless-root
    ingested: []
    keys: []
    wantContains: ["github:acme/alpha", "github:acme/beta"]
    wantMissing: [alpha session, beta session]
    footerContains: ["tab: next step", "a: toggle all", "?: help"]
    footerMissing: ["space: select", "down", "select all"]

  # Only the alpha root holds an imported session, so it opens expanded while
  # the untouched beta root stays folded.
  - name: imported-root-opens-expanded-others-fold
    ingested: [a-1]
    keys: []
    wantContains: [alpha session, "github:acme/beta"]
    wantMissing: [beta session]

  # With imported sessions in both roots the footer still shows only the
  # advance and help affordances; the full tree key set moves behind help.
  - name: footer-shows-only-advance-and-help
    ingested: [a-1, b-1]
    keys: []
    wantContains: [alpha session, beta session]
    footerContains: ["tab: next step", "a: toggle all", "?: help"]
    footerMissing: ["space: select", "select all", "collapse", "next project"]

  # The select-all cycle's first ring step ("select all") is a no-op on an
  # already fully-selected forest (the first-run forest opens fully selected),
  # so skip-no-op advances straight to "unselect all" - the key is never a
  # silent no-op.
  - name: select-all-skips-redundant-select-and-unselects
    ingested: [a-1, b-1]
    keys: [a]
    wantSomeUnchecked: true

  # A second press continues the ring to its third step, "reset to the
  # baseline captured when the cycle activated" - which was the fully-selected
  # forest, so it reads the same as a full reselect.
  - name: select-all-second-press-restores-full-baseline
    ingested: [a-1, b-1]
    keys: [a, a]
    wantNoUnchecked: true

  # Deselecting a root leaves some boxes empty...
  - name: deselect-clears-a-subtree
    ingested: [a-1, b-1]
    keys: [space]
    wantSomeUnchecked: true

  # ...and select-all then visibly reselects everything: the manual toggle
  # invalidated any prior cycle, so this is a fresh ring whose first step
  # ("select all") is not a no-op against the now-partial forest.
  - name: select-all-reselects-after-a-deselect
    ingested: [a-1, b-1]
    keys: [space, a]
    wantNoUnchecked: true

  # Three presses after a manual deselect completes a fresh cycle's full lap:
  # select all, unselect all, then reset to the baseline captured right after
  # the manual deselect (partial - some boxes unchecked) rather than to the
  # original fully-selected forest.
  - name: select-all-third-press-restores-post-deselect-baseline
    ingested: [a-1, b-1]
    keys: [space, a, a, a]
    wantSomeUnchecked: true
