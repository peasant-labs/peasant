# Assertions over the canonical kickstart Program/Flow/Registry selection step.
# Discovery and preview data come from the strict selection_render fixture; this
# document owns saved-selection state and interaction expectations.
expectedCaseCount: 7
savedSelection:
  mode: selected
  autoIngestNewBranches: false
  harnesses:
    claude-code:
      sessions: [cc-parent]
cases:
  - name: default-shows-one-search-bar-and-row-local-state
    surface: selection
    expectedSearchCursors: 0
    keys: []
    wantContains: ["search:"]
    wantMissing:
      ["transcripts", "scope:", "previous scope", "next scope", "search scope",
       "tracked =", "imported =", "selected sessions:", "hidden by filters:", "view only:"]
    rowAssertions:
      - label: parent session
        wantContains: ["[✓]", tracked]
        wantMissing: [already imported]
      - label: imported session
        wantContains: ["[ ]", already imported]
        wantMissing: [tracked]

  - name: removed-scope-keys-do-not-change-the-selection-surface
    surface: selection
    expectedSearchCursors: 0
    keys: ["[", "]"]
    wantContains: ["search:", parent session, cursor session]
    wantMissing: ["scope:", "previous scope", "next scope", "search scope"]

  - name: search-editing-shows-one-focused-cursor-and-typed-lifecycle
    surface: selection
    expectedSearchCursors: 1
    keys: ["/"]
    wantContains:
      ["search: ▏", "backspace: delete", "enter: keep filter", "esc: clear filter"]
    wantMissing: ["type to filter", "search scope"]

  - name: help-is-derived-from-global-tree-availability
    surface: help
    expectedSearchCursors: 0
    keys: ["?"]
    wantContains:
      ["keyboard shortcuts", "/            search", "←/h          collapse", "ctrl+l       focus right pane"]
    wantMissing:
      ["[            previous scope", "]            next scope", "/            search scope", "→/l          expand"]

  - name: leaf-help-omits-no-op-expand-and-collapse-actions
    surface: help
    expectedSearchCursors: 0
    keys: [j, j, "?"]
    wantContains: ["keyboard shortcuts", "space        select", "/            search"]
    wantMissing:
      ["→/l          expand", "←/h          collapse", "previous scope", "next scope", "search scope"]

  - name: pre-load-facet-key-is-unavailable-and-does-not-narrow-after-load
    surface: selection
    expectedSearchCursors: 0
    beforeLoad: true
    drainAfterKeys: true
    keys: [f]
    wantBeforeDrainContains: [scanning projects, "search:"]
    wantBeforeDrainMissing: ["f: filter", "scope:"]
    wantContains: [cursor session, "> all 3", "search:"]

  - name: preview-focus-suppresses-tree-search-dispatch
    surface: selection
    expectedSearchCursors: 0
    keys: [ctrl+l, "/"]
    wantContains: [">", "PgDn: page down", "search:"]
    wantMissing: ["/: search", "space: select", "search scope", "▏"]
