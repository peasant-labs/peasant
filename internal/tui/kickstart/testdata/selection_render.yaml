# The rendered "choose sessions to import" step, captured as golden
# snapshots. The listing is built to exercise every answer this step gives at
# once: two harnesses (so the facet gutter has values to group and narrow by), a
# parent session with a subagent chain (so a row carries a child count), and an
# already-imported session (so the branch splits into not-yet then imported).
#
# stored names the sessions the local store already holds, keyed by session id;
# their text is what the preview pane shows. Each case drives the step into one
# state and captures the whole screen.
#
# States:
#   default        - as the step opens: gutter shown, every harness visible
#   narrowed       - one press of the filter key: narrowed to the first harness
#   gutter-hidden  - the last press of the cycle: gutter and filter both off
#   session-cursor   - cursor moved onto the already-imported session row
#   preview-focused  - the same row, with input moved to the preview pane
#   preview-scrolled - the preview focused and scrolled down
#   search-editing      - one hierarchy-wide query is being typed
#   kept-filter         - a global session-label query remains after enter
#   global-branch-match - a branch-label match retains its subtree and context
#   global-session-match - a session-label match retains shallow ancestors
#   overflow-middle  - usable rows exist above and below the viewport
#   overflow-bottom  - the cursor is at the final usable row
#
# previewAssertions names, per captured state, what the preview pane must show:
# the palette token a highlighted code word carries, the text that must (or must
# not) be visible, and which way the divider's focus marker points. The goldens
# below would happily record a pane that stopped rendering markdown or stopped
# indicating focus; these rows are what make that a failure instead.
#
# expectedCaseCount is the row-count guard; expectedHarnessCount pins how many
# harnesses the listing carries, since the facet cycle length derives from it.
# bothThemeStates names the new content states that must have matching-size dark
# and light captures rather than relying on filename convention alone.
expectedCaseCount: 23
expectedSessionCount: 5
expectedHarnessCount: 2
expectedBothThemeStateCount: 6
bothThemeStates:
  [search-editing, kept-filter, global-branch-match, global-session-match,
   overflow-middle, overflow-bottom]
renderAssertions:
  expectedRowCount: 11
  rows:
    - case: default-dark
      wantContains:
        [+ 2 child sessions, already imported, harness, claude code, cursor,
         "project: github.com:acme/tool", "git directory: /fixtures/claude/acme-tool"]
      wantMissing: [child subagent, grandchild subagent]
    - case: narrowed-dark
      wantContains: [+ 2 child sessions, claude code]
      wantMissing: [cursor session]
    - case: gutter-hidden-dark
      wantContains: [+ 2 child sessions, cursor session]
      wantMissing: [claude code 3]
    - case: session-cursor-dark
      wantContains:
        ["harness: claude code", you, please refactor the ingest pipeline, os.Rename]
      wantMissing: [imported session]
    - case: session-cursor-narrow
      wantContains: ["harness: claude code", please refactor the ingest]
      wantMissing: [child sessions, already imported]
    - case: search-editing-dark
      wantContains: ["search: a▏", "backspace: delete", "enter: keep filter", "esc: clear filter"]
      wantMissing: [type to filter, "scope:"]
    - case: kept-filter-dark
      wantContains: ["search: cursor", cursor session]
      wantMissing: [parent session, imported session]
    - case: global-branch-match-dark
      wantContains: ["search: main", "parent ses", already imported, cursor session]
      wantMissing: ["scope:"]
    - case: global-session-match-dark
      wantContains: ["search: cursor", cursor session]
      wantMissing: [parent session, imported session, "scope:"]
    - case: overflow-middle-dark
      wantContains: ["↑  ▾", "↓      [✓]"]
    - case: overflow-bottom-dark
      wantContains: ["↑▾"]
      wantMissing: [↕, "↓ "]
# The stored body is markdown, as a recorded first message from a person to a
# coding agent usually is: the pane renders it rather than showing the raw
# characters, so the fenced code below is syntax-highlighted in the capture.
stored:
  cc-imported: |
    please refactor the ingest pipeline so a **failed write** cannot leave a
    partial session behind.

    ```go
    func write(dst string) error {
        // atomic: temp dir, then rename
        return os.Rename(tmp, dst)
    }
    ```
previewAssertions:
  expectedRowCount: 3
  rows:
    - case: session-cursor-dark
      wantVisible: [failed, os.Rename]
      wantColored:
        - text: func
          token: mauve
        - text: "// atomic: temp dir, then rename"
          token: ink-3
      wantFocusMarker: left
    - case: preview-focused-dark
      wantVisible: [failed, os.Rename]
      wantColored:
        - text: func
          token: mauve
      wantFocusMarker: right
    # Scrolled past the prose at the top of the body, so the first words are no
    # longer on screen and the code below them is.
    - case: preview-scrolled-dark
      wantVisible: [os.Rename, assistant, write to a temp directory first]
      wantMissing: [please refactor]
      wantFocusMarker: right
listings:
  - harness: claude-code
    projectName: acme/tool
    gitRemote: "git@github.com:acme/tool.git"
    branch: main
    workingDir: /fixtures/claude/acme-tool
    title: parent session
    sessionId: cc-parent
    subagentIds: [cc-child]
  - harness: claude-code
    projectName: acme/tool
    gitRemote: "git@github.com:acme/tool.git"
    branch: main
    workingDir: /fixtures/claude/acme-tool
    title: child subagent
