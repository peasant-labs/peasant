    saved:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
      sessionExclusions:
        - {harness: claude-code, ids: [99999999-9999-4999-8999-999999999999]}
    actions: [down, down, down, down, down, down, toggle]
    refresh: true
    expectedCheckedSessions:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
      - 33333333-3333-4333-8333-333333333333
    expected:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
        - {harness: claude-code, gitRemote: "git@github.com:acme/other.git", pathKeys: [clone-c]}
