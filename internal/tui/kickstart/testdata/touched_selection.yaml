expectedCaseCount: 8
expectedNames:
  - unrelated-project-action-preserves-visible-policies
  - unrelated-project-action-preserves-scanner-absent-policy
  - auto-branch-deny-survives-refresh
  - branch-reselect-clears-deny
  - project-admitted-session-deny-survives-refresh
  - session-reselect-clears-deny-without-redundant-positive
  - filtered-select-all-leaves-hidden-harness-clear
  - exact-project-clear-preserves-sibling-clone
cases:
  - name: unrelated-project-action-preserves-visible-policies
    paths:
      - {key: clone-a, state: directory}
      - {key: clone-b, state: directory}
      - {key: clone-c, state: directory}
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", pathKey: clone-a, branch: main, sessionId: 11111111-1111-4111-8111-111111111111, title: clone a}
      - {harness: claude-code, projectName: tool, gitRemote: "https://github.com/acme/tool.git", pathKey: clone-b, branch: release, sessionId: 22222222-2222-4222-8222-222222222222, title: clone b}
      - {harness: claude-code, projectName: other, gitRemote: "git@github.com:acme/other.git", pathKey: clone-c, branch: dev, sessionId: 33333333-3333-4333-8333-333333333333, title: clone c}
    saved:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
      sessionExclusions:
        - {harness: claude-code, ids: [99999999-9999-4999-8999-999999999999]}
    actions: [down, down, down, down, down, down, toggle]
    refresh: true
    expectedCheckedSessions:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
      - 33333333-3333-4333-8333-333333333333
    expected:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
        - {harness: claude-code, gitRemote: "git@github.com:acme/other.git", pathKeys: [clone-c]}
      sessionExclusions:
        - {harness: claude-code, ids: [99999999-9999-4999-8999-999999999999]}

  - name: unrelated-project-action-preserves-scanner-absent-policy
    paths:
      - {key: clone-a, state: directory}
      - {key: clone-b, state: moved, target: moved-b}
      - {key: clone-c, state: directory}
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", pathKey: clone-a, branch: main, sessionId: 11111111-1111-4111-8111-111111111111, title: clone a}
      - {harness: claude-code, projectName: tool, gitRemote: "https://github.com/acme/tool.git", pathKey: clone-b, branch: release, sessionId: 22222222-2222-4222-8222-222222222222, title: unavailable clone b}
      - {harness: claude-code, projectName: other, gitRemote: "git@github.com:acme/other.git", pathKey: clone-c, branch: dev, sessionId: 33333333-3333-4333-8333-333333333333, title: clone c}
    saved:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
    actions: [down, down, down, toggle]
    refresh: true
    expectedCheckedSessions:
      - 11111111-1111-4111-8111-111111111111
      - 33333333-3333-4333-8333-333333333333
    expected:
      mode: selected
      autoIngestNewBranches: false
      projects:
        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a], branches: [main]}
        - {harness: claude-code, gitRemote: "https://github.com/acme/tool.git", pathKeys: [clone-b], branches: [release]}
        - {harness: claude-code, gitRemote: "git@github.com:acme/other.git", pathKeys: [clone-c]}

