        - {harness: claude-code, gitRemote: "git@github.com:acme/tool.git", pathKeys: [clone-a]}
      sessionExclusions:
        - {harness: claude-code, ids: [55555555-5555-4555-8555-555555555555]}
    actions: [down, down, toggle]
    refresh: true
