      - {key: clone-b, state: directory}
      - {key: clone-c, state: directory}
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", pathKey: clone-a, branch: main, sessionId: 11111111-1111-4111-8111-111111111111, title: clone a}
