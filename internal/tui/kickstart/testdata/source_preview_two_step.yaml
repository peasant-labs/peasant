# Two-step preview reads of an OpenCode SQLite session, driven by
# TestSourceTurns_ReadsAFirstPageBeforeTheWholeSession
# (internal/tui/kickstart/source_preview_two_step_test.go).
#
# The preview of a very long session paints the capture's first page and then
# swaps in the whole read: the first page plus one later read of the same
# capture. Each case names a synthetic database the testfixture package
# materializes, discovers one session from it, and reads that session both ways.
#
# first_page_budget_bytes is the capture's first read; preview_budget_bytes is
# each later read (zero keeps the terminal's). A case whose session fits its
# first read is read ONCE - expect_more is false and no second read runs. A
# legacy OpenCode session exposes no change marker, so its capture reads once
# and stops with a sentence saying it cannot be read further: it, too, is read
# once.
#
# Two rules every case asserts, because they are what keeps a fast first paint
# honest:
#   - the pane never shows the whole read's note above the first page;
#   - the whole read goes back to the source; it is not the first page again.
#
# required_cases names the cases that must stay present; removing one goes red
# by name. Adding a case need not appear here.
required_cases:
  - a-legacy-session-over-its-first-read-is-read-once-and-stops
  - a-current-session-over-its-first-page-bound-is-read-in-two-steps
  - a-legacy-session-inside-its-first-page-bound-is-read-once
  - a-current-session-inside-its-first-page-bound-is-read-once
  - the-note-of-a-two-step-read-describes-the-whole-read-not-the-slice
cases:
  - name: a-legacy-session-over-its-first-read-is-read-once-and-stops
    source_fixture: legacy-mounted-projection
    origin: opencode-legacy-sqlite
    first_page_budget_bytes: 700
    min_first_turns: 1
    expect_more: false

  - name: a-current-session-over-its-first-page-bound-is-read-in-two-steps
    source_fixture: semantic-parity-current
    origin: opencode-current-sqlite
    first_page_budget_bytes: 1
    min_first_turns: 1
    expect_more: true

  - name: a-legacy-session-inside-its-first-page-bound-is-read-once
    source_fixture: legacy-mounted-projection
    origin: opencode-legacy-sqlite
    first_page_budget_bytes: 1048576
    min_first_turns: 1
    expect_more: false

  - name: a-current-session-inside-its-first-page-bound-is-read-once
    source_fixture: semantic-parity-current
    origin: opencode-current-sqlite
    first_page_budget_bytes: 1048576
    min_first_turns: 1
    expect_more: false

  # The whole read still leaves more of the session, so it carries the note.
  # The first page before it must carry none, and the note that finally shows
  # must be the whole read's.
  - name: the-note-of-a-two-step-read-describes-the-whole-read-not-the-slice
    source_fixture: semantic-parity-current
    origin: opencode-current-sqlite
    first_page_budget_bytes: 1
    preview_budget_bytes: 1
    min_first_turns: 1
    expect_more: true
    expect_notice_contains:
      - showing the first
      - scroll to the bottom to load more
      - the full session ingests normally
