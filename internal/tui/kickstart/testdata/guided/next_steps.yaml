expectedRowCount: 4
rows:
  - name: canonical-catalog
    valid: true
    kinds: [config, web-start, village-login, village-push]
    wantPreamble:
      - these useful next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart runs none of them.
    wantContains:
      - modify configuration interactively
      - peasant config
      - opens the settings editor without importing or publishing
      - open the local dashboard
      - peasant web start
      - starts the dashboard and prints or opens its actual url
      - connect to a village later
      - peasant village login
      - connects this machine without publishing a transcript
      - publish later, explicitly
      - peasant village push
      - starts a separate explicit publish flow
    wantMissing: ['http://localhost:8690', completion guidance unavailable]
  - name: unknown-kind
    valid: false
    kinds: [unknown]
    wantContains: [completion guidance unavailable, 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
    wantMissing: [peasant config, peasant web start, peasant village login, peasant village push]
  - name: empty-provider-result
    valid: false
    kinds: []
    wantContains: [completion guidance unavailable, no actions, 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
    wantMissing: [peasant config, peasant web start, peasant village login, peasant village push]
  - name: duplicate-kind
    valid: false
    kinds: [web-start, web-start]
    wantContains: [completion guidance unavailable, repeats, 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
    wantMissing: [peasant config, peasant web start, peasant village login, peasant village push]
