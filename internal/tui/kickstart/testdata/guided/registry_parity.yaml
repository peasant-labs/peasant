# One canonical registry is mounted by both production presentations for every
# row. The section contract and scenario counts prevent silent loss of a field,
# conditional section, or parity behavior.
expectedSectionCount: 7
sections:
  - key: selection
    title: choose transcripts to import
    fieldKey: transcripts
    fieldKind: tree
    fieldText: no projects
    guideIntro: choose which recorded sessions to import.
    conditional: false
  - key: auto-ingest
    title: auto-ingest new branches
    fieldKey: auto-ingest-new-branches
    fieldKind: toggle
    fieldText: auto-ingest new branches in fully-selected projects
    guideIntro: choose how new branches in selected projects enter local history.
    conditional: true
  - key: privacy
    title: privacy
    fieldKey: redaction-level
    fieldKind: radio
    fieldText: redaction level
    guideIntro: choose how much sensitive context peasant removes.
    conditional: false
  - key: license
    title: content license
    fieldKey: content-license
    fieldKind: radio
    fieldText: default license attached to pushed transcripts
    guideIntro: choose the default license for later shares.
    conditional: false
  - key: destination
    title: sharing
    fieldKey: default-visibility
    fieldKind: radio
    fieldText: default visibility for pushed transcripts
    guideIntro: choose visibility for later explicit pushes.
    conditional: true
  - key: retention
    title: claude retention
    fieldKey: claude-retention-days
    fieldKind: radio
    fieldText: how long claude code keeps its transcripts
    guideIntro: choose how long claude keeps local transcripts.
    conditional: true
  - key: receipt
    title: review and save
    fieldKey: summary
    fieldKind: info
    fieldText: 'transcripts:'
    guideIntro: review settings before local import begins.
    conditional: false

forbiddenRegistryOptions:
  expectedNameCount: 5
  names: [presentation, configmode, hide, replace, screen]

expectedRowCount: 6
rows:
  - name: local all-mode visibility and framing
    operation: visibility
    selectionMode: all
    villageConnected: false
    claudeSessionsPresent: false
    initialRetention: 30
    expectedVisibleSections: [selection, privacy, license, receipt]

  - name: connected selected-mode visibility and framing
    operation: visibility
    selectionMode: selected
    villageConnected: true
    claudeSessionsPresent: true
    initialRetention: 30
    expectedVisibleSections: [selection, auto-ingest, privacy, license, destination, retention, receipt]

  - name: transient retention accessor and dirty parity
    operation: transient-dirty
    selectionMode: all
    villageConnected: false
    claudeSessionsPresent: true
    initialRetention: 30
    selectedRetention: 90
    expectedVisibleSections: [selection, privacy, license, retention, receipt]

  - name: yaml-backed accessor and persistence parity
    operation: persisted-edit
    selectionMode: all
    villageConnected: false
    claudeSessionsPresent: false
    initialRetention: 30
    selectedLicense: CC0-1.0
    expectedVisibleSections: [selection, privacy, license, receipt]

  - name: hidden section edit drop and persistence parity
    operation: hidden-drop
    selectionMode: selected
    villageConnected: false
    claudeSessionsPresent: false
    initialRetention: 30
    expectedAutoIngest: true
    expectedVisibleSections: [selection, auto-ingest, privacy, license, receipt]

  - name: external drift fails closed in both presentations
    operation: drift-failure
    selectionMode: all
    villageConnected: false
    claudeSessionsPresent: false
    initialRetention: 30
    selectedLicense: CC0-1.0
    expectedVisibleSections: [selection, privacy, license, receipt]
