# Guided framing cases cover the production connect step, every canonical
# registry section when visible, each conditional section when hidden, and the
# optional derived-example contract. The exact count prevents silent case loss.
expectedRowCount: 12
rows:
  - name: connect-before-settings
    surface: connect
    wantContains:
      - connect to a village
      - a village is a shared commons for agent transcripts.
      - publishing stays explicit and opt-in.

  - name: selection-guide
    surface: registry-section
    sectionKey: selection
    sectionTitle: choose transcripts to import
    selectionMode: all
    wantVisible: true
    fieldKey: transcripts
    fieldKind: tree
    fieldText: no projects
    guide:
      intro: choose which recorded sessions to import.
      hints:
        - select all or narrow by project, branch, or session.

  - name: auto-ingest-guide
    surface: registry-section
    sectionKey: auto-ingest
    sectionTitle: auto-ingest new branches
    selectionMode: selected
    wantVisible: true
    fieldKey: auto-ingest-new-branches
    fieldKind: toggle
    fieldText: auto-ingest new branches in fully-selected projects
    guide:
      intro: choose how new branches in selected projects enter local history.
      hints:
        - only fully selected projects are affected.

  - name: privacy-guide
    surface: registry-section
    sectionKey: privacy
    sectionTitle: privacy
    selectionMode: all
    wantVisible: true
    fieldKey: redaction-level
    fieldKind: radio
    fieldText: redaction level
    guide:
      intro: choose how much sensitive context peasant removes.
      hints:
        - you can change this later.

  - name: license-guide
    surface: registry-section
    sectionKey: license
    sectionTitle: content license
    selectionMode: all
    wantVisible: true
    fieldKey: content-license
    fieldKind: radio
    fieldText: default license attached to pushed transcripts
    guide:
      intro: choose the default license for later shares.
      hints:
        - kickstart does not publish.

  - name: destination-guide
    surface: registry-section
    sectionKey: destination
    sectionTitle: sharing
    selectionMode: all
    villageConnected: true
    wantVisible: true
    fieldKey: default-visibility
    fieldKind: radio
    fieldText: default visibility for pushed transcripts
    guide:
      intro: choose visibility for later explicit pushes.
      hints:
        - saving does not publish.

  - name: retention-guide
    surface: registry-section
    sectionKey: retention
    sectionTitle: claude retention
    selectionMode: all
    claudeSessionsPresent: true
    wantVisible: true
    fieldKey: claude-retention-days
    fieldKind: radio
    fieldText: how long claude code keeps its transcripts
    guide:
      intro: choose how long claude keeps local transcripts.
      hints:
        - applied after save.

  - name: review-guide
    surface: registry-section
    sectionKey: receipt
    sectionTitle: review and save
    selectionMode: all
    wantVisible: true
    fieldKey: summary
    fieldKind: info
    fieldText: 'transcripts:'
    guide:
      intro: review settings before local import begins.
      hints:
        - nothing is written until you confirm.

  - name: hidden-auto-ingest-guide
    surface: registry-section
    sectionKey: auto-ingest
    sectionTitle: auto-ingest new branches
    selectionMode: all
    wantVisible: false
    fieldKey: auto-ingest-new-branches
    fieldKind: toggle
    fieldText: auto-ingest new branches in fully-selected projects
    guide:
      intro: choose how new branches in selected projects enter local history.
      hints:
        - only fully selected projects are affected.

  - name: hidden-destination-guide
    surface: registry-section
    sectionKey: destination
    sectionTitle: sharing
    selectionMode: all
    villageConnected: false
    wantVisible: false
    fieldKey: default-visibility
    fieldKind: radio
    fieldText: default visibility for pushed transcripts
    guide:
      intro: choose visibility for later explicit pushes.
      hints:
        - saving does not publish.

  - name: hidden-retention-guide
    surface: registry-section
    sectionKey: retention
    sectionTitle: claude retention
    selectionMode: all
    claudeSessionsPresent: false
    wantVisible: false
    fieldKey: claude-retention-days
    fieldKind: radio
    fieldText: how long claude code keeps its transcripts
    guide:
      intro: choose how long claude keeps local transcripts.
      hints:
        - applied after save.

  - name: derived-example
    surface: derived-example
    sectionKey: example
    sectionTitle: example
    wantVisible: true
    fieldKey: unchanged-field
    fieldKind: info
    fieldText: field output remains unchanged
    exampleText: 'current village: https://village.example'
    guide:
      intro: see how the current draft affects this step.
      hints:
        - this example is derived without changing the draft.
