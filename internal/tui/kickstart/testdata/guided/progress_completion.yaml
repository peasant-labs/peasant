expectedProgressCount: 6
progress:
  - name: stable-monotonic-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: DISCOVER, started: true, done: 4, total: 10}]
    wantContains: ['local import elapsed: 2s', 'discover 4/10', 'observed elapsed: 2s', 'estimate: 3s']
    wantMissing: [estimate unavailable]
  - name: unknown-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 0}]
      - advanceSeconds: 2
        stages: [{stage: DISCOVER, started: true, done: 3, total: 0}]
    wantContains: ['discover 3', 'estimate unavailable']
  - name: changing-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DIFF, started: true, done: 1, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: DIFF, started: true, done: 4, total: 12}]
    wantContains: ['diff 4/12', 'estimate unavailable']
  - name: non-monotonic-progress
    observations:
      - advanceSeconds: 0
        stages: [{stage: FILTER, started: true, done: 4, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: FILTER, started: true, done: 3, total: 10}]
    wantContains: ['filter 3/10', 'estimate unavailable']
  - name: concurrent-aggregate
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 1, total: 10}
          - {stage: INDEX, started: true, done: 1, total: 10}
      - advanceSeconds: 2
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 4, total: 10}
          - {stage: INDEX, started: true, done: 3, total: 10}
    wantContains: ['extract+write 4/10', 'index 3/10', 'estimate unavailable']
  - name: failed-stage
    observations:
      - advanceSeconds: 0
        stages: [{stage: REPORT, started: true, done: 0, total: 2}]
      - advanceSeconds: 1
        stages: [{stage: REPORT, started: true, done: 1, total: 2, ended: true, hasErr: true}]
    wantContains: ['report 1/2', 'failed', 'estimate unavailable']

expectedCompletionCount: 2
completion:
  - name: successful-local-import
    attemptErrors: [""]
    wantContains:
      - config saved
      - local import completed
      - peasant web start
      - starts the dashboard and prints or opens its actual url
      - peasant village login
      - peasant village push
      - kickstart published nothing
    wantMissing: ['http://localhost:8690']
    wantIngestCalls: 1
    wantRetentionCalls: 1
    wantProgressResets: 1
  - name: retry-local-import-only
    attemptErrors: [synthetic local import failure, ""]
    mutateConfigBeforeRetry: true
    wantFailureContains:
      - config remains saved
      - retention remains applied
      - local import failed
      - estimate unavailable
      - retry local import only
      - kickstart published nothing
    wantRetryContains:
      - 'local import elapsed: 0s'
      - estimate unavailable
    wantContains:
      - local import completed
      - peasant web start
      - peasant village login
      - peasant village push
    wantMissing: ['http://localhost:8690']
    wantIngestCalls: 2
    wantRetentionCalls: 1
    wantProgressResets: 2
