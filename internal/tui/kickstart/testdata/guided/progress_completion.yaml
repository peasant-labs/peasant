expectedProgressCount: 13
expectedFocusPriorityCount: 3
expectedLatestActiveFocusCount: 1
expectedFailedFocusCount: 1
expectedLatestCompletedFocusCount: 1
progress:
  - name: stable-monotonic-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: DISCOVER, started: true, done: 4, total: 10}]
    wantContains: ['discover', '4/10', 'total elapsed: 2s', 'estimate: 3s']
    wantMissing: [estimate unavailable]
  - name: bursty-progress-smooths-estimate
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 100}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 10, total: 100}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 12, total: 100}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 90, total: 100}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 92, total: 100}]
    wantContains: ['discover', '92/100', 'estimate: 0s']
  - name: unknown-total-recovers-estimate
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 2, total: 0}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 2, total: 5}]
      - advanceSeconds: 1
        stages: [{stage: DISCOVER, started: true, done: 4, total: 5}]
    wantContains: ['discover', '4/5', 'estimate: 1s']
  - name: unknown-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 0}]
      - advanceSeconds: 2
        stages: [{stage: DISCOVER, started: true, done: 3, total: 0}]
    wantContains: ['discover', '░', 'estimate unavailable']
  - name: changing-total
    observations:
      - advanceSeconds: 0
        stages: [{stage: DIFF, started: true, done: 1, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: DIFF, started: true, done: 4, total: 12}]
    wantContains: ['diff', '4/12', 'estimate unavailable']
  - name: non-monotonic-progress
    observations:
      - advanceSeconds: 0
        stages: [{stage: FILTER, started: true, done: 4, total: 10}]
      - advanceSeconds: 2
        stages: [{stage: FILTER, started: true, done: 3, total: 10}]
    wantContains: ['filter', '3/10', 'estimate unavailable']
  - name: concurrent-aggregate
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 1, total: 10}
          - {stage: INDEX, started: true, done: 1, total: 10}
      - advanceSeconds: 2
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 4, total: 10}
          - {stage: INDEX, started: true, done: 3, total: 10}
    wantContains: ['extract+write', '4/10', 'index', '3/10', 'estimate: 7s']
  - name: failed-stage
    observations:
      - advanceSeconds: 0
        stages: [{stage: REPORT, started: true, done: 0, total: 2}]
      - advanceSeconds: 1
        stages: [{stage: REPORT, started: true, done: 1, total: 2, ended: true, hasErr: true}]
    wantContains: ['report', '1/2', '✗', 'estimate unavailable']
  - name: full-pipeline-report-active-at-common-height
    terminalWidth: 80
    terminalHeight: 24
    legacyUnboundedOverflow: true
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: RECONCILE, started: true, done: 10, total: 10, ended: true}
          - {stage: DISCOVER, started: true, done: 10, total: 10, ended: true}
          - {stage: DIFF, started: true, done: 10, total: 10, ended: true}
          - {stage: FILTER, started: true, done: 10, total: 10, ended: true}
          - {stage: EXTRACT+WRITE, started: true, done: 10, total: 10, ended: true}
          - {stage: DB INSERT, started: true, done: 10, total: 10, ended: true}
          - {stage: CONTENT, started: true, done: 10, total: 10, ended: true}
          - {stage: INDEX, started: true, done: 10, total: 10, ended: true}
          - {stage: COMPUTE, started: true, done: 10, total: 10, ended: true}
          - {stage: ANNOTATE, started: true, done: 10, total: 10, ended: true}
          - {stage: CLEANUP, started: true, done: 10, total: 10, ended: true}
          - {stage: REPORT, started: true, done: 0, total: 10}
      - advanceSeconds: 2
        stages:
          - {stage: RECONCILE, started: true, done: 10, total: 10, ended: true}
          - {stage: DISCOVER, started: true, done: 10, total: 10, ended: true}
          - {stage: DIFF, started: true, done: 10, total: 10, ended: true}
          - {stage: FILTER, started: true, done: 10, total: 10, ended: true}
          - {stage: EXTRACT+WRITE, started: true, done: 10, total: 10, ended: true}
          - {stage: DB INSERT, started: true, done: 10, total: 10, ended: true}
          - {stage: CONTENT, started: true, done: 10, total: 10, ended: true}
          - {stage: INDEX, started: true, done: 10, total: 10, ended: true}
          - {stage: COMPUTE, started: true, done: 10, total: 10, ended: true}
          - {stage: ANNOTATE, started: true, done: 10, total: 10, ended: true}
          - {stage: CLEANUP, started: true, done: 10, total: 10, ended: true}
          - {stage: REPORT, started: true, done: 4, total: 10}
    wantContains: ['report', '4/10', 'total elapsed: 2s', 'estimate: 3s']
    wantMissing: [estimate unavailable]
  - name: full-pipeline-late-failure-at-common-height
    terminalWidth: 80
    terminalHeight: 24
    legacyUnboundedOverflow: true
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: RECONCILE, started: true, done: 10, total: 10, ended: true}
          - {stage: DISCOVER, started: true, done: 10, total: 10, ended: true}
          - {stage: DIFF, started: true, done: 10, total: 10, ended: true}
          - {stage: FILTER, started: true, done: 10, total: 10, ended: true}
          - {stage: EXTRACT+WRITE, started: true, done: 10, total: 10, ended: true}
          - {stage: DB INSERT, started: true, done: 10, total: 10, ended: true}
          - {stage: CONTENT, started: true, done: 10, total: 10, ended: true}
          - {stage: INDEX, started: true, done: 10, total: 10, ended: true}
          - {stage: COMPUTE, started: true, done: 10, total: 10, ended: true}
          - {stage: ANNOTATE, started: true, done: 10, total: 10, ended: true}
          - {stage: CLEANUP, started: true, done: 10, total: 10, ended: true}
          - {stage: REPORT, started: true, done: 0, total: 2}
      - advanceSeconds: 1
        stages:
          - {stage: RECONCILE, started: true, done: 10, total: 10, ended: true}
          - {stage: DISCOVER, started: true, done: 10, total: 10, ended: true}
          - {stage: DIFF, started: true, done: 10, total: 10, ended: true}
          - {stage: FILTER, started: true, done: 10, total: 10, ended: true}
          - {stage: EXTRACT+WRITE, started: true, done: 10, total: 10, ended: true}
          - {stage: DB INSERT, started: true, done: 10, total: 10, ended: true}
          - {stage: CONTENT, started: true, done: 10, total: 10, ended: true}
          - {stage: INDEX, started: true, done: 10, total: 10, ended: true}
          - {stage: COMPUTE, started: true, done: 10, total: 10, ended: true}
          - {stage: ANNOTATE, started: true, done: 10, total: 10, ended: true}
          - {stage: CLEANUP, started: true, done: 10, total: 10, ended: true}
          - {stage: REPORT, started: true, done: 1, total: 2, ended: true, hasErr: true}
    wantContains: ['report', '1/2', '✗', 'total elapsed: 1s', 'estimate unavailable']
  - name: latest-active-stage-owns-detail
    focusProbe: latest-active
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 0, total: 10}
      - advanceSeconds: 2
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 4, total: 10}
          - {stage: INDEX, started: true, done: 1, total: 10}
      - advanceSeconds: 3
        stages:
          - {stage: EXTRACT+WRITE, started: true, done: 6, total: 10}
          - {stage: INDEX, started: true, done: 3, total: 10}
    wantContains: ['extract+write', '6/10', 'index', '3/10', 'estimate: 11s']
    wantFocusStage: INDEX
    wantFocusElapsed: 'total elapsed: 5s'
    wantFocusEstimate: 'estimate: 11s'
  - name: latest-failure-wins-over-active-and-completed
    focusProbe: failed-before-active
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: DISCOVER, started: true, done: 0, total: 2}
          - {stage: DIFF, started: true, done: 0, total: 2}
      - advanceSeconds: 2
        stages:
          - {stage: DISCOVER, started: true, done: 2, total: 2, ended: true}
          - {stage: DIFF, started: true, done: 1, total: 2}
          - {stage: REPORT, started: true, done: 0, total: 10}
      - advanceSeconds: 3
        stages:
          - {stage: DISCOVER, started: true, done: 2, total: 2, ended: true}
          - {stage: DIFF, started: true, done: 1, total: 2, ended: true, hasErr: true}
          - {stage: REPORT, started: true, done: 4, total: 10}
    wantContains: ['discover', '2/2', 'diff', '1/2', '✗', 'report', '4/10']
    wantFocusStage: DIFF
    wantFocusElapsed: 'total elapsed: 5s'
    wantFocusEstimate: estimate unavailable
  - name: latest-completed-stage-owns-detail
    focusProbe: latest-completed
    observations:
      - advanceSeconds: 0
        stages:
          - {stage: DIFF, started: true, done: 0, total: 2}
      - advanceSeconds: 2
        stages:
          - {stage: DIFF, started: true, done: 2, total: 2, ended: true}
          - {stage: INDEX, started: true, done: 0, total: 3}
      - advanceSeconds: 3
        stages:
          - {stage: DIFF, started: true, done: 2, total: 2, ended: true}
          - {stage: INDEX, started: true, done: 3, total: 3, ended: true}
    wantContains: ['diff', '2/2', 'index', '3/3']
    wantFocusStage: INDEX
    wantFocusElapsed: 'total elapsed: 5s'
    wantFocusEstimate: estimate unavailable

requiredTimingNames:
  - qualified-estimate-expires-during-stall
  - completed-stage-clock-stays-frozen
timing:
  - name: qualified-estimate-expires-during-stall
    observations:
      - advanceSeconds: 0
        stages: [{stage: INDEX, started: true, done: 0, total: 100}]
        wantContains: ["total elapsed: 0s", estimate unavailable]
        wantElapsed: {INDEX: 0s}
      - advanceSeconds: 2
        stages: [{stage: INDEX, started: true, done: 20, total: 100}]
        wantContains: ["total elapsed: 2s", "estimate: 8s"]
        wantMissing: [estimate unavailable]
        wantElapsed: {INDEX: 2s}
      - advanceSeconds: 6
        stages: [{stage: INDEX, started: true, done: 20, total: 100}]
        wantContains: ["total elapsed: 8s", estimate unavailable]
        wantMissing: ["estimate: 8s"]
        wantElapsed: {INDEX: 8s}
  - name: completed-stage-clock-stays-frozen
    observations:
      - advanceSeconds: 0
        stages: [{stage: DISCOVER, started: true, done: 0, total: 4}]
        wantContains: ["total elapsed: 0s", estimate unavailable]
        wantElapsed: {DISCOVER: 0s}
      - advanceSeconds: 2
        stages: [{stage: DISCOVER, started: true, done: 4, total: 4, ended: true}]
        wantContains: ["total elapsed: 2s", estimate unavailable]
        wantElapsed: {DISCOVER: 2s}
      - advanceSeconds: 6
        stages: [{stage: DISCOVER, started: true, done: 4, total: 4, ended: true}]
        wantContains: ["total elapsed: 8s", estimate unavailable]
        wantElapsed: {DISCOVER: 2s}

expectedCompletionCount: 3
requiredChildMessageNames:
  - older-observation-ignored
  - equal-observation-accepted
  - authoritative-earlier-final
  - already-ended-clock-survives-final
  - final-before-speculative-start
  - final-replaces-absent-and-unstarted-stages
  - final-absorbs-late-messages
  - cancel-retains-qualified-estimate
  - observation-cancel-retains-before-error
  - final-cancel-retains-before-error
  - pending-cancel-overridden-by-success
  - pending-cancel-overridden-by-failure
childMessages:
  - name: older-observation-ignored
    events:
      - &childInitial
        action: observe
        atSeconds: 0
        stages: [{stage: INDEX, started: true, done: 0, total: 100}]
        want:
          total: 0s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '●', count: 0/100, elapsed: 0s}]
      - &childQualified
        action: observe
        atSeconds: 2
        stages: [{stage: INDEX, started: true, done: 20, total: 100}]
        want: &qualifiedView
          total: 2s
          estimate: 'estimate: 8s'
          rows: [{stage: INDEX, icon: '●', count: 20/100, elapsed: 2s}]
      - action: observe
        atSeconds: 1
        stages: [{stage: INDEX, started: true, done: 5, total: 100, hasErr: true}]
        want: *qualifiedView
  - name: equal-observation-accepted
    events:
      - *childInitial
      - *childQualified
      - action: observe
        atSeconds: 2
        stages: [{stage: INDEX, started: true, done: 30, total: 100}]
        want:
          total: 2s
          estimate: 'estimate: 5s'
          rows: [{stage: INDEX, icon: '●', count: 30/100, elapsed: 2s}]
  - name: authoritative-earlier-final
    events:
      - *childInitial
      - *childQualified
      - action: observe
        atSeconds: 8
        stages: [{stage: INDEX, started: true, done: 80, total: 100, ended: true}]
        want:
          total: 8s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✓', count: 80/100, elapsed: 8s}]
      - action: final
        atSeconds: 5
        outcome: failed
        stages: [{stage: INDEX, started: true, done: 40, total: 90, ended: true, hasErr: true}]
        want:
          total: 5s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✗', count: 40/90, elapsed: 5s}]
  - name: already-ended-clock-survives-final
    events:
      - *childInitial
      - *childQualified
      - action: observe
        atSeconds: 9
        stages: [{stage: INDEX, started: true, done: 90, total: 100, ended: true}]
        want:
          total: 9s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✓', count: 90/100, elapsed: 9s}]
      - action: final
        atSeconds: 12
        outcome: canceled
        stages: [{stage: INDEX, started: true, done: 70, total: 80, ended: true, hasErr: true}]
        want:
          total: 12s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✗', count: 70/80, elapsed: 9s}]
  - name: final-before-speculative-start
    events:
      - action: observe
        atSeconds: 8
        stages: [{stage: INDEX, started: true, done: 80, total: 100, ended: true}]
        want:
          total: 8s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✓', count: 80/100, elapsed: 0s}]
      - action: final
        atSeconds: 5
        outcome: failed
        stages: [{stage: INDEX, started: true, done: 40, total: 100, ended: true, hasErr: true}]
        want:
          total: 5s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✗', count: 40/100, elapsed: 0s}]
  - name: final-replaces-absent-and-unstarted-stages
    events:
      - action: observe
        atSeconds: 0
        stages:
          - {stage: DISCOVER, started: true, done: 4, total: 10, ended: true, hasErr: true}
          - {stage: DIFF, started: true, done: 3, total: 10, ended: true}
          - {stage: INDEX, started: true, done: 2, total: 100, hasErr: true}
        want:
          total: 0s
          estimate: estimate unavailable
          rows:
            - {stage: DISCOVER, icon: '✗', count: 4/10, elapsed: 0s}
            - {stage: DIFF, icon: '✓', count: 3/10, elapsed: 0s}
            - {stage: INDEX, icon: '✗', count: 2/100, elapsed: 0s}
      - action: final
        atSeconds: 5
        outcome: succeeded
        stages:
          - {stage: DIFF, started: false}
          - {stage: INDEX, started: true, done: 100, total: 100, ended: true}
        want:
          total: 5s
          estimate: estimate unavailable
          rows:
            - {stage: DISCOVER, icon: '○', count: '', elapsed: ''}
            - {stage: DIFF, icon: '○', count: '', elapsed: ''}
            - {stage: INDEX, icon: '✓', count: 100/100, elapsed: 5s}
  - name: final-absorbs-late-messages
    events:
      - *childInitial
      - *childQualified
      - &childCancel
        action: cancel
        atSeconds: 2
        want: *qualifiedView
      - action: final
        atSeconds: 3
        outcome: canceled
        stages: [{stage: INDEX, started: true, done: 30, total: 100, ended: true, hasErr: true}]
        want: &canceledView
          total: 3s
          estimate: 'estimate: 8s'
          rows: [{stage: INDEX, icon: '✗', count: 30/100, elapsed: 3s}]
      - action: observe
        atSeconds: 9
        stages: [{stage: INDEX, started: true, done: 90, total: 100}]
        want: *canceledView
      - action: cancel
        atSeconds: 9
        want: *canceledView
      - action: final
        atSeconds: 10
        outcome: succeeded
        stages: [{stage: INDEX, started: true, done: 100, total: 100, ended: true}]
        want: *canceledView
      - action: final
        atSeconds: 11
        outcome: failed
        stages: []
        want: *canceledView
  - name: cancel-retains-qualified-estimate
    events:
      - *childInitial
      - *childQualified
      - *childCancel
      - &childError
        action: observe
        atSeconds: 9
        stages: [{stage: INDEX, started: true, done: 40, total: 100, hasErr: true}]
        want: &pendingErrorView
          total: 9s
          estimate: 'estimate: 8s'
          rows: [{stage: INDEX, icon: '✗', count: 40/100, elapsed: 9s}]
      - action: cancel
        atSeconds: 10
        want: *pendingErrorView
      - action: final
        atSeconds: 12
        outcome: canceled
        stages: [{stage: INDEX, started: true, done: 50, total: 100, ended: true, hasErr: true}]
        want:
          total: 12s
          estimate: 'estimate: 8s'
          rows: [{stage: INDEX, icon: '✗', count: 50/100, elapsed: 12s}]
  - name: observation-cancel-retains-before-error
    events:
      - *childInitial
      - *childQualified
      - <<: *childError
        cancelRequested: true
      - action: cancel
        atSeconds: 10
        want: *pendingErrorView
  - name: final-cancel-retains-before-error
    events:
      - *childInitial
      - *childQualified
      - action: final
        atSeconds: 3
        outcome: canceled
        stages: [{stage: INDEX, started: true, done: 30, total: 100, ended: true, hasErr: true}]
        want: *canceledView
  - name: pending-cancel-overridden-by-success
    events:
      - *childInitial
      - *childQualified
      - *childCancel
      - *childError
      - action: final
        atSeconds: 12
        outcome: succeeded
        stages: [{stage: INDEX, started: true, done: 100, total: 100, ended: true}]
        want:
          total: 12s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✓', count: 100/100, elapsed: 12s}]
  - name: pending-cancel-overridden-by-failure
    events:
      - *childInitial
      - *childQualified
      - *childCancel
      - *childError
      - action: final
        atSeconds: 12
        outcome: failed
        stages: [{stage: INDEX, started: true, done: 50, total: 100, ended: true, hasErr: true}]
        want:
          total: 12s
          estimate: estimate unavailable
          rows: [{stage: INDEX, icon: '✗', count: 50/100, elapsed: 12s}]
completion:
  - name: successful-local-import
    terminalWidth: 80
    terminalHeight: 24
    attemptErrors: [""]
    wantPreamble:
      - these useful next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart runs none of them.
    wantContains:
      - config saved
      - local import completed
      - modify configuration interactively
      - peasant config
      - opens the settings editor without importing or publishing
      - open the local dashboard
      - peasant web start
      - starts the dashboard and prints or opens its actual url
      - connect to a village later
      - peasant village login
      - connects this machine without publishing a transcript
      - publish later, explicitly
      - peasant village push
      - starts a separate explicit publish flow
      - kickstart published nothing
    wantMissing: ['http://localhost:8690']
    wantIngestCalls: 1
    wantRetentionCalls: 1
    wantProgressResets: 1
  - name: retry-local-import-only
    terminalWidth: 80
    terminalHeight: 24
    attemptErrors: [synthetic local import failure, ""]
    mutateConfigBeforeRetry: true
    useRealProgress: true
    wantFailureContains:
      - config remains saved
      - retention remains applied
      - local import failed
      - estimate unavailable
      - retry local import only
      - kickstart published nothing
    wantRetryContains:
      - 'local import progress'
      - '○'
      - discover
    wantRetryMissing:
      - '1/2'
      - '✗'
      - stale prior-attempt progress
    wantPreamble:
      - these useful next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart runs none of them.
    wantContains:
      - local import completed
      - modify configuration interactively
      - peasant config
      - opens the settings editor without importing or publishing
      - open the local dashboard
      - peasant web start
      - starts the dashboard and prints or opens its actual url
      - connect to a village later
      - peasant village login
      - connects this machine without publishing a transcript
      - publish later, explicitly
      - peasant village push
      - starts a separate explicit publish flow
    wantMissing: ['http://localhost:8690']
    wantIngestCalls: 2
    wantRetentionCalls: 1
    wantProgressResets: 2
  - name: retention-and-local-import-fail
    attemptErrors: [synthetic local import failure]
    retentionError: synthetic retention failure
    wantContains:
      - config remains saved
      - claude retention change failed
      - synthetic retention failure
      - 'where: kickstart after config save'
      - 'fix: update claude settings manually and rerun kickstart if needed'
      - local import failed
      - synthetic local import failure
      - 'where: kickstart local ingest after config and retention effects'
      - 'fix: correct the reported local problem, then press enter to retry local import only'
      - kickstart published nothing
    wantMissing: [retention remains applied]
    wantIngestCalls: 1
    wantRetentionCalls: 1
    wantProgressResets: 1

expectedPreambleMutationCount: 4
preambleMutations:
  - name: not-useful
    lines:
      - these not useful next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart runs none of them.
  - name: not-optional
    lines:
      - these useful but not optional next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart runs none of them.
  - name: negated-no-auto-execution
    lines:
      - these useful next steps let you modify config, open the local dashboard, connect to a village, or explicitly publish later; it is false that kickstart runs none of them.
  - name: hedged-usefulness
    lines:
      - these potentially useful next steps might let you modify config, open the local dashboard, connect to a village, or explicitly publish later; kickstart might run none of them.
