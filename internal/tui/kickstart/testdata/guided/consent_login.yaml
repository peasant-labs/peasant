expectedConsentCount: 5
consent:
  - name: local-all-no-license
    selectionMode: all
    autoIngestNewBranches: true
    license: ""
    visibility: private
    connected: false
    claudeSessionsPresent: false
    wantContains:
      - 'selection: all discovered sessions'
      - 'publication privacy: standard redaction; local imports remain original unless you run `peasant redact`'
      - 'later publish license: none; all rights remain and reuse requires permission'
      - save the visible choices to peasant configuration
      - import the selected transcripts into the local peasant store
      - publish nothing; sharing requires a later explicit push
    wantMissing:
      - auto-ingest future branches in fully-selected projects
      - apply claude code retention
      - 'default visibility:'
  - name: selected-connected-retention
    selectionMode: selected
    autoIngestNewBranches: true
    license: CC-BY-SA-4.0
    visibility: group
    connected: true
    claudeSessionsPresent: true
    retentionDays: 90
    wantContains:
      - 'selection: 1 session you chose'
      - 'auto-ingest future branches in fully-selected projects: on'
      - 'publication privacy: standard redaction; local imports remain original unless you run `peasant redact`'
      - 'later publish license: CC-BY-SA-4.0'
      - 'default visibility after a later publish: group'
      - 'claude code source retention: 90 days'
      - save the visible choices to peasant configuration
      - apply claude code retention after config saves
      - import the selected transcripts into the local peasant store
      - publish nothing; sharing requires a later explicit push
  - name: selected-local-manual-future-branches
    selectionMode: selected
    autoIngestNewBranches: false
    license: CC-BY-4.0
    visibility: public
    connected: false
    claudeSessionsPresent: false
    wantContains:
      - 'selection: 1 session you chose'
      - 'auto-ingest future branches in fully-selected projects: off'
      - 'publication privacy: standard redaction; local imports remain original unless you run `peasant redact`'
      - 'later publish license: CC-BY-4.0'
      - save the visible choices to peasant configuration
      - import the selected transcripts into the local peasant store
      - publish nothing; sharing requires a later explicit push
    wantMissing:
      - 'default visibility after a later publish:'
      - apply claude code retention
  # The never-expire period is stored as 99999 days. The terminal's review says
  # "never expire", as the retention stop does, and never prints the number.
  - name: summary-names-never-expire-for-the-sentinel
    selectionMode: all
    autoIngestNewBranches: false
    license: CC-BY-4.0
    visibility: private
    connected: false
    claudeSessionsPresent: true
    retentionDays: 99999
    wantContains:
      - 'selection: all discovered sessions'
      - 'claude code source retention: never expire'
      - apply claude code retention after config saves
    wantMissing:
      - '99999'
      - 'retention: 99999'
  # The selection line says what was chosen in plain words and carries no word
  # of the implementation.
  - name: summary-selection-line-has-no-internal-words
    selectionMode: selected
    autoIngestNewBranches: false
    license: CC-BY-4.0
    visibility: private
    connected: false
    claudeSessionsPresent: false
    wantContains:
      - 'selection: 1 session you chose'
    wantMissing:
      - buffered
      - 'only the'

expectedLoginCount: 3
login:
  - name: successful-visibility-login
    outcome: success
    username: example-user
    bufferedLicense: CC-BY-4.0
    wantContains:
      - sharing
      - default visibility for pushed transcripts
  - name: failed-visibility-login
    outcome: failure
    error: synthetic login refusal
    bufferedLicense: CC-BY-4.0
    wantContains: ['what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
  - name: declined-visibility-login
    outcome: decline
    bufferedLicense: CC-BY-4.0
    wantContains: ['review your changes']
