# Privacy rows describe synthetic inputs only. Expected redacted text is always
# produced by the real Standard redactor at test/runtime, never stored here.
expectedPrivacySampleCount: 4
privacySamples:
  - name: synthetic-secret
    category: secrets
    categoryLabel: CREDENTIAL
    before: sk-ant-api03-EXAMPLEKEY0000000000000
  - name: synthetic-email
    category: pii
    categoryLabel: PII
    before: user@example.com
  - name: synthetic-home-path
    category: paths
    categoryLabel: PATH
    before: /Users/example/projects/sample/
  - name: synthetic-project-import
    category: project
    categoryLabel: INTERNAL
    before: '"github.com/example-org/example-repo"'

expectedFailureCount: 4
failures:
  - name: constructor-failure
    kind: constructor-error
    wantContains: ['example unavailable', 'unverified output withheld', 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
  - name: unknown-category
    kind: unknown-category
    wantContains: ['example unavailable', 'unverified output withheld', 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
  - name: missing-claimed-category
    kind: missing-category
    wantContains: ['example unavailable', 'unverified output withheld', 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']
  - name: unchanged-output
    kind: unchanged-output
    wantContains: ['example unavailable', 'unverified output withheld', 'what:', 'why:', 'where:', 'when:', 'means:', 'fix:']

expectedLabelMutationCount: 3
labelMutations:
  - name: raw-storage-label-is-rejected
    kind: raw
    sampleName: synthetic-secret
    categoryLabel: secrets
  - name: invalid-public-label-is-rejected
    kind: invalid
    sampleName: synthetic-email
    categoryLabel: PERSONAL
  - name: zero-public-label-is-rejected
    kind: zero
    sampleName: synthetic-project-import
    categoryLabel: ""

expectedViewportCount: 2
expectedViewportMutationCount: 1
viewport:
  # The split keeps the control ALWAYS visible on the left, so this row now
  # confirms the opposite regression from before the split: the control must
  # already be on screen with no keys pressed, while the tail of the
  # scrollable example (the last category) has not scrolled into view yet.
  - name: common-height-shows-the-control-with-no-keys
    width: 80
    height: 18
    wantContains: ['redaction level', '(•) standard', credential]
    wantMissing: ['github.com/example-org/example-repo']
  - name: common-height-focus-right-then-page-down-reveals-the-last-category
    width: 80
    height: 18
    # The split's right pane now sizes itself to the left control's shorter
    # (wrapped-description) content height rather than the full remaining
    # terminal height, so its page size shrank too - two page-downs are now
    # needed to reach the last category instead of one.
    keys: [focus-right, page-down, page-down]
    wantContains:
      - '(•) standard'
      - 'github.com/example-org/example-repo'
    wantMissing: ['sk-ant-api03-EXAMPLEKEY0000000000000']
    mutationProbe: true
    mutationReveal: 'github.com/example-org/example-repo'

expectedLicenseCount: 4
licenses:
  - name: no-license-default
    value: ""
    label: none (do not attach a license)
    guidance: attach no license. you keep all rights and others must ask to reuse the transcript.
    isDefault: true
  - name: cc0
    value: CC0-1.0
    label: CC0-1.0
    guidance: place the transcript in the public domain. anyone may reuse it without credit.
  - name: cc-by
    value: CC-BY-4.0
    label: CC-BY-4.0
    guidance: allow anyone to reuse the transcript with credit to you.
  - name: cc-by-sa
    value: CC-BY-SA-4.0
    label: CC-BY-SA-4.0
    guidance: allow anyone to reuse the transcript with credit, under this same license.
