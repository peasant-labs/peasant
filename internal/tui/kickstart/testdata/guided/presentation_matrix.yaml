expectedSectionCount: 6
expectedThemeCount: 2
expectedSizeCount: 2
expectedCaseCount: 24
sections:
  - key: auto-ingest
    heading: auto-ingest new branches in fully-selected projects
    control: '[on]'
    intro: decide how future branches enter your saved local selection.
  - key: publication
    heading: publication preference
    control: '(•) keep local, do not publish'
    intro: choose whether to keep transcripts local or plan to publish later.
  - key: privacy
    heading: redaction level
    control: '(•) standard'
    intro: preview standard redaction before a later explicit publication.
    markers: ['- before:', '+ after:']
  - key: license
    heading: default license attached to pushed transcripts
    control: '(•) none (do not attach a license)'
    intro: choose the default license for a later explicit publish.
  - key: destination
    heading: default visibility for pushed transcripts
    control: '(•) private'
    intro: choose who may see transcripts after a later explicit publish.
  - key: retention
    heading: how long claude code keeps its transcripts
    control: '( ) 30 days'
    intro: choose how long claude code keeps its source transcript files.
