# Assertions about the privacy step's guide copy (intro plus hints). These strings
# are user-facing guidance text, never synthetic redaction inputs. The intro must
# read as one short sentence; the git-remote guidance must agree with the
# project-identity example the step renders at the Standard level (a Go import path
# shown as <GO_IMPORT>) instead of promising a git-remote before/after the Standard
# preview cannot produce. Standard is the only offered level, so the copy must not
# name maximum (a refused level the user cannot choose). The PII acronym is spelled
# out on the example heading, not in these guide hints (see privacyExampleHeading).
#
# sentence_names_label_remote_and_path: the hint is config.ProjectIdentitySentence
# verbatim (shared with the push wizard's noticePanel), so it must name the
# repository label, the git remote url, and the <PATH> placeholder the project
# path uses when no label is sendable - the three project-identity outcomes D8/D10
# describe.
introMaxSentences: 1
requiredGuideText:
  - "repository label"
  - "git remote url"
  - "<PATH>"
  - "the git remote url is not redacted at the standard level"
  - "only the project hash identifies the project"
forbiddenGuideText:
  - "maximum"
  - "standard keeps git remote urls and branch output; maximum removes them"
  - "examples below use synthetic text and the same redactor as explicit publication"
