# Preview cases over an OpenCode SQLite session that discovery found but the
# local store has not imported. Each case names a synthetic database the
# testfixture package materializes, discovers one session from it, and previews
# that session through the transcript materializer. A SQLite session's source
# path is the provider database, so the preview must never read that path
# directly; it must materialize the one selected session's rows instead.
#
# preview_budget_bytes bounds how much of the session the preview materializes.
# A case that leaves it unset previews the whole session and must show no
# notice. A case that sets a tiny budget forces the bound and must show the
# notice naming what the preview left out, WITH the turns it did read.
#
# required_cases names the cases that must stay present; removing one goes red
# by name. Adding a case need not appear here.
required_cases:
  - legacy-sqlite-session-previews-through-the-materializer
  - current-sqlite-session-previews-through-the-materializer
  - legacy-sqlite-session-over-budget-previews-a-prefix-with-a-notice
  - current-sqlite-session-over-budget-previews-a-prefix-with-a-notice
cases:
  - name: legacy-sqlite-session-previews-through-the-materializer
    source_fixture: legacy-mounted-projection
    origin: opencode-legacy-sqlite
    min_turns: 1
  - name: current-sqlite-session-previews-through-the-materializer
    source_fixture: semantic-parity-current
    origin: opencode-current-sqlite
    min_turns: 1

  - name: legacy-sqlite-session-over-budget-previews-a-prefix-with-a-notice
    source_fixture: legacy-scrollable-session
    origin: opencode-legacy-sqlite
    min_turns: 1
    # Enough for the session's message rows and its first part, so the preview
    # shows a turn while the bound leaves the rest of the session to a scroll.
    preview_budget_bytes: 2000
    expect_notice_contains:
      - showing the first
      - session
      - scroll to the bottom to load more
      - the full session ingests normally

  - name: current-sqlite-session-over-budget-previews-a-prefix-with-a-notice
    source_fixture: semantic-parity-current
    origin: opencode-current-sqlite
    min_turns: 1
    preview_budget_bytes: 1
    expect_notice_contains:
      - showing the first
      - session
      - scroll to the bottom to load more
      - the full session ingests normally
