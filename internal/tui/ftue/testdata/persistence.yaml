    session_id: 77777777-7777-4777-8777-777777777777

# selection_cases pin what `peasant kickstart` pre-checks when it is re-run over
# an existing saved selection. Each row states TWO independent things:
#
#   expected_match     what the canonical matcher answers for this configuration
#   expected_precheck  unticked | ticked | flagged — the box the wizard draws,
#                      which is also what it will WRITE BACK on confirm
#
# They are separate columns because the wizard deliberately does NOT simply
# mirror the matcher, and the two places it diverges are product decisions that
# must be readable here rather than inferred from the code:
#
#   * a WITHHELD (conflicted) session stays CHECKED — the configuration does
#     select it, and ingest discloses the withholding separately;
#   * an UNRESTRICTED harness pre-checks NOTHING even though the matcher selects
#     every session, because "this harness has no project entries yet" must not
#     silently become "everything is already chosen".
#
# One boolean column could state neither decision: the matcher is three-valued,
# and the box carries two independent facts (kept on confirm / will be ingested)
# that only agree for two of the three states.
declared_selection_rows: 6
selection_cases:
  - name: normalized-remote-is-prechecked
    git_remote: https://github.com/acme/tool
    configured_entries:
      - git_remote: "git@github.com:acme/tool.git"
    session_id: 11111111-1111-4111-8111-111111111111
    expected_match: "selected"
    expected_precheck: "ticked"
    expected_precheck_toggled: "unticked"
  - name: entry-carrying-remote-and-name-is-prechecked-by-name
    git_remote: https://github.com/acme/other
    project_name: tool
    configured_entries:
      - git_remote: https://github.com/acme/tool.git
        name: tool
    session_id: 33333333-3333-4333-8333-333333333333
    expected_match: "selected"
    expected_precheck: "ticked"
    expected_precheck_toggled: "unticked"
  - name: unrestricted-harness-does-not-precheck-select-sessions
    git_remote: https://github.com/acme/tool
    unrestricted_harness: true
    session_id: 22222222-2222-4222-8222-222222222222
    expected_match: "selected"
    expected_precheck: "unticked"
    expected_precheck_toggled: "ticked"
  - name: conflicting-entries-leave-the-session-prechecked
    git_remote: https://github.com/acme/tool.git
    project_name: tool
    branch: main
    configured_entries:
      - git_remote: https://github.com/acme/tool.git
        branches: [main]
      - name: tool
        branches: [other]
    session_id: 44444444-4444-4444-8444-444444444444
    expected_match: "withheld"
    expected_precheck: "flagged"
    expected_precheck_toggled: "unticked"
  - name: unlisted-branch-without-auto-ingest-is-not-prechecked
    git_remote: https://github.com/acme/tool.git
    branch: topic
    configured_entries:
      - git_remote: https://github.com/acme/tool.git
        branches: [main]
    auto_ingest_new_branches: false
    session_id: 55555555-5555-4555-8555-555555555555
    expected_match: "rejected"
    expected_precheck: "unticked"
    expected_precheck_toggled: "ticked"
  - name: unlisted-branch-with-auto-ingest-is-prechecked
    git_remote: https://github.com/acme/tool.git
    branch: topic
    configured_entries:
      - git_remote: https://github.com/acme/tool.git
        branches: [main]
    auto_ingest_new_branches: true
    session_id: 55555555-5555-4555-8555-555555555555
    expected_match: "selected"
    expected_precheck: "ticked"
    expected_precheck_toggled: "unticked"
