cases:
  - name: preserves-unrelated-loaded-settings
    user_email: person@example.test
    output_path: /custom/output
    village_url: https://village.example.test
    redaction_level: maximum
    source_path: /custom/source
    session_id: 66666666-6666-4666-8666-666666666666
  - name: preserves-a-second-distinct-set-of-loaded-settings
    user_email: other@example.test
    output_path: /other/output
    village_url: https://other-village.example.test
    # Deliberately NOT the BaseConfig default: a fixture value equal to the
