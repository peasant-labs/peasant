# Selection-config equivalence oracle: the ONE ratified divergence.
#
# Selecting everything ("root-check") is the single scenario where the kickstart
# rebuild must NOT reproduce what the current wizard writes.
#
# What the current project-first wizard does: selecting every project produces a
# scoped, enumerated allowlist (mode:selected) listing exactly today's projects.
# A project discovered LATER is therefore NOT ingested until onboarding is re-run.
#
# The ratified behaviour: root-check means "ingest everything" as a standing
# policy — mode:all — so projects discovered after onboarding are auto-included
# without re-running the wizard. This is an intentional behaviour change, ratified
# rather than patched into the current wizard, so the rebuild is measured against
# `ratifiedExpected`, not against `golden`.
#
# `golden` here records what the current wizard ACTUALLY writes today so the
# divergence is concrete and testable: the test drives the wizard, asserts it
# writes `golden`, and asserts `golden` differs from `ratifiedExpected` — making
# the divergence a live, non-vacuous requirement rather than a comment.
expectedScenarioCount: 1
scenarios:
  - name: select-everything-root-check
    doc: >
      User selects every project across every harness (root-check). The current
      wizard enumerates them into mode:selected; the rebuilt flow must instead
      persist mode:all so later-discovered projects are auto-ingested.
    oracle: ratified-divergence
    wantImport: true
    autoIngestNewBranches: false
    providers:
      - harness: claude-code
        importAll: false
      - harness: opencode
        importAll: false
    scopes:
      - level: project
        sessions:
          - harness: claude-code
            gitRemote: "git@github.com:acme/tool.git"
            branch: main
            sessionId: cc-main-1
      - level: project
        sessions:
          - harness: opencode
            gitRemote: "https://github.com/acme/tool.git"
            branch: main
            sessionId: oc-main-1
    # What the CURRENT wizard actually persists for select-everything (driven and
    # asserted by the test). Enumerated, mode:selected — the behaviour the ratified
    # policy deliberately replaces.
    golden:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - gitRemote: "git@github.com:acme/tool.git"
        opencode:
          projects:
            - gitRemote: "https://github.com/acme/tool.git"
    # What the REBUILT kickstart MUST emit: mode:all as a standing policy, with new
    # branches auto-ingested. The current wizard has no code path that produces
    # this, so it is a forward expectation the rebuild is measured against.
    ratifiedExpected:
      mode: all
      autoIngestNewBranches: true
