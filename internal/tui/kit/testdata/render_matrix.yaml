# Render fixture matrix for the kit components: every component is rendered in
# BOTH themes (dark, light) at THREE constrained sizes - 80x10, 40x8, and the
# component's own declared minimum - and its final frame is compared against a
# banked .golden file. The row-count guards in render_matrix_test.go assert
# this file stays exhaustive: exactly the listed components, each with exactly its
# dark+light x three-size rows, and no size dropped.
expectedCaseCount: 90
expectedComponentCount: 15
expectedSizesPerComponentTheme: 3
components:
  - frame
  - overlay
  - confirm
  - spinner
  - list
  - textfield
  - toggle
  - radio
  - multiselect
  - statusbar
  - tree
  - previewsplit
  - previewsplit-loading-the-rest
  - previewsplit-loading-more
  - previewsplit-more-to-load
cases:
