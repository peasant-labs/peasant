  - name: frame/dark/80x10
    component: frame
    theme: dark
    width: 80
    height: 10
  - name: frame/dark/40x8
    component: frame
    theme: dark
    width: 40
    height: 8
  - name: frame/dark/min
    component: frame
    theme: dark
    width: 4
    height: 3
