# Scoped search, lifecycle actions, and viewport markers for kit.Tree. Every
# case drives the real component from a freshly loaded project -> branch ->
# session forest. The row-count guard and strict loader make adding or removing
# a behavior an explicit fixture edit.
expectedCaseCount: 17
width: 52
height: 4
forest:
  - id: project-alpha
    label: alpha project
    children:
      - id: alpha-main
        label: main
        children:
          - {id: alpha-ingest, label: ingest pipeline}
      - id: alpha-feature
        label: feature-search
        children:
          - {id: alpha-share, label: share bridge}
  - id: project-beta
    label: beta project
    children:
      - id: beta-develop
        label: develop
        children:
          - {id: beta-audit, label: governance audit}
cases:
  - name: pre-load-advertises-no-row-actions
    start: pre-load
    keys: []
    expectScope: project
    expectMode: inactive
    wantAvailable: [help, back]
    wantUnavailable: [down, next-scope, search-scope, toggle, expand, collapse, select-all]

  - name: successful-empty-load-advertises-no-row-actions
    start: empty
    keys: []
    expectScope: project
    expectMode: inactive
    wantAvailable: [help, back]
    wantUnavailable: [down, next-scope, search-scope, toggle, expand, collapse, select-all]
    wantViewContains: [no projects]

  - name: expanded-interior-advertises-collapse-not-expand
    keys: []
    expectScope: project
    expectMode: inactive
    expectCursorID: project-alpha
    expectOverflowBottom: true
    wantAvailable: [collapse, toggle]
    wantUnavailable: [expand, up, page-up, top, prev-project]

  - name: collapsed-interior-advertises-expand-not-collapse
    keys: [left]
    expectScope: project
    expectMode: inactive
    expectCursorID: project-alpha
    expectVisibleIDs: [project-alpha, project-beta, beta-develop, beta-audit]
    wantAvailable: [expand, toggle]
    wantUnavailable: [collapse, up, page-up, top, prev-project]

  - name: project-scope-starts-with-bottom-overflow-and-search
    keys: []
    expectScope: project
    expectMode: inactive
    expectVisibleIDs:
      [project-alpha, alpha-main, alpha-ingest, alpha-feature, alpha-share,
       project-beta, beta-develop, beta-audit]
    expectOverflowBottom: true
    wantAvailable: [next-scope, search-scope]
    wantUnavailable: [prev-scope, clear-filter]
    wantViewContains: ["↓"]
    wantViewMissing: ["↑"]

  - name: page-down-shows-both-overflow-directions
    keys: [pgdown]
    expectScope: project
    expectMode: inactive
    expectOverflowTop: true
    expectOverflowBottom: true
    wantViewContains: ["↑", "↓"]

  - name: bottom-removes-only-the-bottom-overflow-marker
    keys: [shift+g]
    expectScope: project
    expectMode: inactive
    expectOverflowTop: true
    expectOverflowBottom: false
    wantViewContains: ["↑"]
    wantViewMissing: ["↓"]

  - name: next-scope-navigates-to-branch-without-expanding
    keys: ["]"]
    expectScope: branch
    expectMode: inactive
    expectCursorID: alpha-main
    expectOverflowBottom: true
    wantAvailable: [prev-scope, next-scope, search-scope, collapse]
    wantUnavailable: [expand]

  - name: next-scope-navigates-to-session-without-moving-pane-focus
    keys: ["]", "]"]
    expectScope: session
    expectMode: inactive
    expectCursorID: alpha-ingest
    expectOverflowTop: true
    expectOverflowBottom: true
    wantAvailable: [prev-scope, search-scope, toggle]
    wantUnavailable: [next-scope, focus-pane-left, focus-pane-right, expand, collapse]

  - name: previous-scope-returns-from-session-to-branch
    keys: ["]", "]", "["]
    expectScope: branch
    expectMode: inactive
    expectCursorID: alpha-main
    expectOverflowBottom: true

  - name: project-search-keeps-the-matching-project-subtree
    keys: ["/", a, l, p, h, a, enter]
    expectScope: project
    expectMode: kept
    expectQuery: alpha
    expectVisibleIDs:
      [project-alpha, alpha-main, alpha-ingest, alpha-feature, alpha-share]
    expectOverflowBottom: true
    wantAvailable: [search-scope, clear-filter, toggle]
    wantUnavailable: [keep-filter, delete-filter]

  - name: branch-search-preserves-project-context
    keys: ["]", "/", f, e, a, t, u, r, e, enter]
    expectScope: branch
    expectMode: kept
    expectQuery: feature
    expectVisibleIDs: [project-alpha, alpha-feature, alpha-share]

  - name: session-search-preserves-project-and-branch-context
    keys: ["]", "]", "/", a, u, d, i, t, enter]
    expectScope: session
    expectMode: kept
    expectQuery: audit
    expectVisibleIDs: [project-beta, beta-develop, beta-audit]

  - name: editing-advertises-delete-keep-clear-and-delete-mutates-query
    keys: ["]", "]", "/", s, h, a, backspace]
    expectScope: session
    expectMode: editing
    expectQuery: sh
    wantAvailable: [delete-filter, keep-filter, clear-filter]
    wantUnavailable: [up, down, toggle, search-scope]

  - name: no-match-message-names-the-active-session-scope
    keys: ["]", "]", "/", z, z, enter]
    expectScope: session
    expectMode: kept
    expectQuery: zz
    wantAvailable: [prev-scope, search-scope, clear-filter]
    wantViewContains: ["no matching sessions"]
    wantViewMissing: ["no projects"]

  - name: clear-restores-the-complete-forest-and-selection-navigation
    keys: ["]", "]", "/", a, u, d, i, t, enter, esc]
    expectScope: session
    expectMode: inactive
    expectQuery: ""
    expectCursorID: alpha-ingest
    expectVisibleIDs:
      [project-alpha, alpha-main, alpha-ingest, alpha-feature, alpha-share,
       project-beta, beta-develop, beta-audit]
    expectOverflowTop: true
    expectOverflowBottom: true
    wantAvailable: [prev-scope, search-scope, toggle]
    wantUnavailable: [clear-filter, keep-filter, delete-filter]

  - name: clear-after-no-match-restores-the-prefilter-cursor
    keys: ["]", "]", "/", z, z, enter, esc]
    expectScope: session
    expectMode: inactive
    expectQuery: ""
    expectCursorID: alpha-ingest
    expectOverflowTop: true
    expectOverflowBottom: true
    wantAvailable: [prev-scope, search-scope, toggle]
    wantUnavailable: [clear-filter, keep-filter, delete-filter]
