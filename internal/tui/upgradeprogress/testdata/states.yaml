      from: 69
      to: 76
      storeBytes: 46170898432
      steps:
        - {version: 70, kind: schema, title: "add derived lookups", cost: quick}
        - {version: 71, kind: schema, title: "add the dispatch index", cost: quick}
        - {version: 72, kind: schema, title: "add the model reference table", cost: quick}
        - {version: 73, kind: schema, title: "widen the stored harness set", cost: scales_with_rows}
        - {version: 74, kind: schema, title: "count conversation turns and fill the count", cost: scales_with_rows, counts: sessions}
        - {version: 75, kind: schema, title: "widen entry types and rebuild search", cost: scales_with_text}
        - {version: 76, kind: schema, title: "repair the search triggers", cost: quick}
    events:
      - {kind: step_started, step: 1, elapsedMs: 0}
      - {kind: step_finished, step: 1, elapsedMs: 2000, walBytes: 4096}
      - {kind: step_started, step: 2, elapsedMs: 0}
      - {kind: step_finished, step: 2, elapsedMs: 4000, walBytes: 8192}
      - {kind: step_started, step: 3, elapsedMs: 0}
      - {kind: step_finished, step: 3, elapsedMs: 3000, walBytes: 8192}
      - {kind: step_started, step: 4, elapsedMs: 0}
      - {kind: step_finished, step: 4, elapsedMs: 41000, walBytes: 262144}
      - {kind: step_started, step: 5, elapsedMs: 0}
      - {kind: step_finished, step: 5, elapsedMs: 185000, walBytes: 1048576}
      - {kind: step_started, step: 6, elapsedMs: 0}
      - {kind: step_progress, step: 6, elapsedMs: 41000, walBytes: 13107200}
    wantContains: ["step 6 of 7", "widen entry types and rebuild search", "41s elapsed", "write-ahead log grew 12.5 MiB", "●"]
    wantAbsent: ["estimate", "█", "░", "finished 7 step(s)"]

  - key: running-counted-step
    plan:
      from: 69
      to: 76
      storeBytes: 46170898432
