      - {kind: step_started, step: 2, elapsedMs: 0}
      - {kind: step_finished, step: 2, elapsedMs: 4000}
      - {kind: step_started, step: 3, elapsedMs: 0}
      - {kind: step_finished, step: 3, elapsedMs: 3000}
      - {kind: step_started, step: 4, elapsedMs: 0}
      - {kind: step_finished, step: 4, elapsedMs: 41000}
      - {kind: step_started, step: 5, elapsedMs: 0}
      - {kind: step_finished, step: 5, elapsedMs: 185000}
      - {kind: step_started, step: 6, elapsedMs: 0}
      - {kind: step_finished, step: 6, elapsedMs: 72000}
      - {kind: step_started, step: 7, elapsedMs: 0}
      - {kind: step_finished, step: 7, elapsedMs: 5000}
    finished:
      - {step: 1, durationMs: 2000}
      - {step: 2, durationMs: 4000}
      - {step: 3, durationMs: 3000}
      - {step: 4, durationMs: 41000}
      - {step: 5, durationMs: 185000}
      - {step: 6, durationMs: 72000}
      - {step: 7, durationMs: 5000}
    outcome: done
    wantContains: ["finished 7 step(s) in 5m12s", "schema 69 → 76", "✓"]
    wantAbsent: ["ctrl+c rolls back", "stopped by user", "failed:", "refused:"]

  - key: stopped-by-user
    plan:
      from: 69
      to: 76
      storeBytes: 46170898432
      steps:
        - {version: 70, kind: schema, title: "add derived lookups", cost: quick}
        - {version: 71, kind: schema, title: "add the dispatch index", cost: quick}
        - {version: 72, kind: schema, title: "add the model reference table", cost: quick}
        - {version: 73, kind: schema, title: "widen the stored harness set", cost: scales_with_rows}
