    events: []
    wantContains: [upgrading the local store, "schema 69 → 76", "step 6 of 7", "widen entry types and rebuild search", "long", "a precise fraction is not available", "○"]
    wantAbsent: ["█", "░", "estimate", "finished 7 step(s)"]

