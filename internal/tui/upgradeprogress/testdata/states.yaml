# Strict capture states for the explicit store upgrade's terminal progress.
# Every plan, event, duration and byte count is synthetic. The test renders
# each state in both themes at 80x24 and 120x40 through the production model.
states:
  - key: plan-quick-only
    plan:
      from: 71
      to: 74
      storeBytes: 46170898432
      steps:
        - {version: 72, kind: schema, title: "add the model reference table", cost: quick}
        - {version: 73, kind: schema, title: "widen the stored harness set", cost: scales_with_rows}
        - {version: 74, kind: schema, title: "count conversation turns and fill the count", cost: scales_with_rows, counts: sessions}
    events: []
    wantContains: [upgrading the local store, "schema 71 → 74", "43.0 GiB", "step 1 of 3", "add the model reference table", "○"]
    wantAbsent: ["█", "░", "estimate", "finished 7 step(s)"]

