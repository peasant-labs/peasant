cases:
  - name: unrelated-action-preserves-distinct-policies-and-exclusions
    operation: project-on
    current:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
            - {gitRemote: "https://github.com/acme/tool.git", clonePaths: [/fixtures/b], branches: [release]}
          sessions: [99999999-9999-4999-8999-999999999999]
          exclusions:
            branches:
              - {clonePath: /fixtures/b, branches: [topic]}
            sessions: [88888888-8888-4888-8888-888888888888]
    scope:
      harness: claude-code
      clonePath: /fixtures/c
      gitRemote: "git@github.com:acme/other.git"
      projectName: other
      visibleSessions:
        - {branch: dev, sessionId: 11111111-1111-4111-8111-111111111111}
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
            - {gitRemote: "https://github.com/acme/tool.git", clonePaths: [/fixtures/b], branches: [release]}
            - {gitRemote: "git@github.com:acme/other.git", clonePaths: [/fixtures/c]}
          sessions: [99999999-9999-4999-8999-999999999999]
          exclusions:
            branches:
              - {clonePath: /fixtures/b, branches: [topic]}
            sessions: [88888888-8888-4888-8888-888888888888]

  - name: scanner-absent-policy-survives-branch-deny
    operation: branch-off
    current:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
            - {gitRemote: "https://github.com/acme/tool.git", clonePaths: [/fixtures/b], branches: [release]}
            - {gitRemote: "git@github.com:acme/other.git", clonePaths: [/fixtures/c]}
    scope:
      harness: claude-code
      clonePath: /fixtures/c
      gitRemote: "git@github.com:acme/other.git"
      projectName: other
      branch: dev
      visibleSessions:
        - {branch: dev, sessionId: 11111111-1111-4111-8111-111111111111}
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
            - {gitRemote: "https://github.com/acme/tool.git", clonePaths: [/fixtures/b], branches: [release]}
            - {gitRemote: "git@github.com:acme/other.git", clonePaths: [/fixtures/c]}
          exclusions:
            branches:
              - {clonePath: /fixtures/c, branches: [dev]}

  - name: multi-path-project-clear-splits-only-target
    operation: project-off
    current:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a, /fixtures/b], branches: [main]}
            - {name: keep, clonePaths: [/fixtures/keep]}
          sessions: [11111111-1111-4111-8111-111111111111, 99999999-9999-4999-8999-999999999999]
    scope:
      harness: claude-code
      clonePath: /fixtures/a
      gitRemote: "git@github.com:acme/tool.git"
      projectName: tool
      visibleSessions:
        - {branch: main, sessionId: 11111111-1111-4111-8111-111111111111}
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/b], branches: [main]}
            - {name: keep, clonePaths: [/fixtures/keep]}
          sessions: [99999999-9999-4999-8999-999999999999]

  - name: auto-branch-deny
    operation: branch-off
    current:
      mode: selected
      autoIngestNewBranches: true
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
    scope:
      harness: claude-code
      clonePath: /fixtures/a
      gitRemote: "git@github.com:acme/tool.git"
      branch: topic
      visibleSessions:
        - {branch: topic, sessionId: 22222222-2222-4222-8222-222222222222}
    expected:
      mode: selected
      autoIngestNewBranches: true
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main]}
          exclusions:
            branches:
              - {clonePath: /fixtures/a, branches: [topic]}

