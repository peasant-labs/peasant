          exclusions:
            branches:
              - {clonePath: /fixtures/a, branches: [topic, release]}
            sessions: [22222222-2222-4222-8222-222222222222]
    scope:
      harness: claude-code
      clonePath: /fixtures/a
      gitRemote: "git@github.com:acme/tool.git"
      branch: topic
      visibleSessions:
        - {branch: topic, sessionId: 22222222-2222-4222-8222-222222222222}
    expected:
