      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a]}
    projectIdentity: two-branch-project-a
    harness: claude-code
    clonePath: /fixtures/a
    gitRemote: "git@github.com:acme/tool.git"
    branch: main
    sessionId: 11111111-1111-4111-8111-111111111111
    secondBranch: release
    secondBranchSessionId: 22222222-2222-4222-8222-222222222222
    # Uncheck both branch rows, then restore them by hand; the saved rule must
    # stay branch-level instead of collapsing back to the branchless template.
    keys: [down, toggle, down, down, toggle, toggle, up, up, toggle]
    expectedSessionState: checked
    expectedSecondSessionState: checked
    expectedSetCount: 4
    expectReconcileError: false
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
