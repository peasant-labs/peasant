  # Manual branch toggles are branch-level intent: checking every branch row
  # persists the branch list, while the project row keeps the branchless
  # project rule and the select-all key keeps its project-level behavior.
  - name: manual-branch-toggles-keep-branch-level
    current: {mode: selected, autoIngestNewBranches: false}
    projectIdentity: two-branch-project-a
    harness: claude-code
    clonePath: /fixtures/a
    gitRemote: "git@github.com:acme/tool.git"
    branch: main
    sessionId: 11111111-1111-4111-8111-111111111111
    secondBranch: release
    secondBranchSessionId: 22222222-2222-4222-8222-222222222222
    keys: [down, toggle, down, down, toggle]
    expectedSessionState: checked
    expectedSecondSessionState: checked
    expectedSetCount: 2
    expectReconcileError: false
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/a], branches: [main, release]}

  - name: manual-branch-recheck-under-branchless-rule-keeps-branch-level
