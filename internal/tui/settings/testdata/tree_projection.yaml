# Full-forest selection behavior through the real Flow -> treeField ->
# PreviewSplit -> Tree path. The saved allowlist, imported rows, current checks,
# text query, and harness view are intentionally independent axes.
fixture: faceted
expectedSessionCount: 4
expectedCaseCount: 11
width: 128
height: 28
savedSelection:
  mode: selected
  autoIngestNewBranches: false
  harnesses:
    opencode:
      sessions: [oc-1]
importedSessionIDs: [cc-1]
sessions:
  - id: cc-1
    label: ingest pipeline refactor
    harness: claude-code
    remote: "git@github.com:peasant-labs/peasant.git"
    project: ""
    branch: develop
  - id: oc-1
    label: commit detector fix
    harness: opencode
    remote: "git@github.com:peasant-labs/peasant.git"
    project: ""
    branch: develop
  - id: cc-2
    label: share bridge scan
    harness: claude-code
    remote: "git@github.com:peasant-labs/peasant.git"
    project: ""
    branch: feature-x
  - id: oc-2
    label: governance audit trigger
    harness: opencode
    remote: "git@github.com:peasant-labs/village.git"
    project: ""
    branch: develop
cases:
  - name: saved-imported-and-current-state-render-independently
    keys: []
    expectScope: project
    expectMode: inactive
    expectSelected: [oc-1]
    expectUnselected: [cc-1, cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 0
    wantVisibleRows:
      [ingest pipeline refactor, commit detector fix, share bridge scan,
       governance audit trigger]
    wantViewContains:
      - "tracked = included by previous saved selection"
      - "imported = already in local store"
      - "/: search this scope"
    rowAssertions:
      - label: commit detector fix
        wantContains: ["[✓]", tracked]
        wantMissing: [already imported]
      - label: ingest pipeline refactor
        wantContains: ["[ ]", already imported]
        wantMissing: [tracked]

  - name: harness-projection-keeps-mixed-project-and-hidden-selection
    keys: [f]
    expectScope: project
    expectMode: inactive
    expectSelected: [oc-1]
    expectUnselected: [cc-1, cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantVisibleRows: [ingest pipeline refactor, share bridge scan]
    wantMissingRows: [commit detector fix, governance audit trigger]
  - name: text-filter-and-toggle-mutate-the-canonical-forest-once
    keys: ["]", "]", "/", s, h, a, r, e, enter, down, down, space]
    expectScope: session
    expectMode: kept
    expectQuery: share
    expectSelected: [oc-1, cc-2]
    expectUnselected: [cc-1, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantVisibleRows: [share bridge scan]
    wantMissingRows: [commit detector fix, ingest pipeline refactor]
    rowAssertions:
      - label: share bridge scan
        wantContains: ["[✓]"]
        wantMissing: [tracked, already imported]

  - name: clear-restores-the-forest-with-both-current-selections
    keys: ["]", "]", "/", s, h, a, r, e, enter, down, down, space, esc]
    expectScope: session
    expectMode: inactive
    expectSelected: [oc-1, cc-2]
    expectUnselected: [cc-1, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 0
    wantVisibleRows:
      [ingest pipeline refactor, commit detector fix, share bridge scan,
       governance audit trigger]
    rowAssertions:
      - label: commit detector fix
        wantContains: ["[✓]", tracked]
      - label: share bridge scan
        wantContains: ["[✓]"]

  - name: harness-and-text-projections-compose-with-shared-identity
    keys: [f, "]", "]", "/", i, n, g, e, s, t, enter, down, down, space]
    expectScope: session
    expectMode: kept
    expectQuery: ingest
    expectSelected: [oc-1, cc-1]
    expectUnselected: [cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantVisibleRows: [ingest pipeline refactor]
    wantMissingRows: [commit detector fix, share bridge scan, governance audit trigger]
    rowAssertions:
      - label: ingest pipeline refactor
        wantContains: ["[✓]", already imported]
        wantMissing: [tracked]

  - name: preview-focus-does-not-steal-or-advertise-tree-search
    keys: [ctrl+l, "/"]
    expectPane: right
    expectScope: project
    expectMode: inactive
    expectSelected: [oc-1]
    checkHiddenSelected: true
    expectHiddenSelected: 0
    wantViewMissing: ["/: search this scope"]

  - name: preview-focus-keeps-active-filter-and-clear-return-path-visible
    keys: ["]", "]", "/", i, n, g, e, s, t, enter, ctrl+l]
    expectPane: right
    expectScope: session
    expectMode: kept
    expectQuery: ingest
    expectSelected: [oc-1]
    expectUnselected: [cc-1, cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantVisibleRows: [ingest pipeline refactor]
    wantMissingRows: [commit detector fix, share bridge scan, governance audit trigger]
    wantViewContains:
      - "preview focused; filter session: ingest"
      - "ctrl+h returns to tree"
      - "esc: clear filter"
    wantViewMissing: ["/: search this scope"]

  - name: returning-to-tree-restores-current-scope-search-dispatch
    keys: [ctrl+l, ctrl+h, "/"]
    expectPane: left
    expectScope: project
    expectMode: editing
    expectSelected: [oc-1]
    checkHiddenSelected: true
    expectHiddenSelected: 0
    wantViewContains:
      - "type to filter"
      - "backspace: delete"
      - "enter: keep filter"
      - "esc: clear filter"

  - name: ctrl-h-terminal-backspace-deletes-while-tree-search-has-focus
    keys: ["]", "]", "/", s, h, a, ctrl+h, enter]
    expectPane: left
    expectScope: session
    expectMode: kept
    expectQuery: sh
    expectSelected: [oc-1]
    expectUnselected: [cc-1, cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantVisibleRows: [share bridge scan]
    wantMissingRows: [ingest pipeline refactor, commit detector fix, governance audit trigger]
    wantViewContains:
      - "filter session: sh"
      - "hidden by filters: 1"

  - name: search-text-keeps-global-shortcut-letters-as-query-content
    keys: ["]", "]", "/", b, q, "?", enter]
    expectScope: session
    expectMode: kept
    expectQuery: "bq?"
    expectSelected: [oc-1]
    expectUnselected: [cc-1, cc-2, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 1
    wantMissingRows:
      [ingest pipeline refactor, commit detector fix, share bridge scan,
       governance audit trigger]
    wantViewContains:
      - "filter session: bq?"
      - "hidden by filters: 1"

  - name: registry-rebuild-keeps-saved-tracked-and-buffered-current-state-independent
    keys: []
    workingSelection:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          sessions: [cc-2]
    expectScope: project
    expectMode: inactive
    expectSelected: [cc-2]
    expectUnselected: [cc-1, oc-1, oc-2]
    checkHiddenSelected: true
    expectHiddenSelected: 0
    wantVisibleRows:
      [ingest pipeline refactor, commit detector fix, share bridge scan,
       governance audit trigger]
    rowAssertions:
      - label: commit detector fix
        wantContains: ["[ ]", tracked]
        wantMissing: [already imported]
      - label: share bridge scan
        wantContains: ["[✓]"]
        wantMissing: [tracked, already imported]
