# Shared allowlist for the internal/tui/gates hardcoded-value grep gates.
#
# The color grep gate (colors_test.go) checks entries naming the "colors"
# gate; the key grep gate (keys_test.go, added by the keymap slice) checks
# entries naming the "keys" gate - see gates.Kind. Both gates share this ONE
# file; a path may carry an independent expectedHits for each gate it needs
# (e.g. internal/push/wizard.go below pins both a colors count and a keys
# count).
#
# Every entry's gates list PINS THE EXACT HIT COUNT (expectedHits) the named
# path (or, for a "dir/*" entry, everything under that directory) currently
# carries for that gate - not just "this path is exempt". A file-granular
# allowlist without a count cannot see a NEW hardcoded value added to an
# already-listed file; pinning the count is what makes that visible (actual
# > expected fails as a new violation) while still letting a value be
# removed without the entry going stale silently (actual < expected fails
# too, and must be reconciled by lowering the count or deleting the entry).
#
# This allowlist is expected to SHRINK over the life of the epoch it was
# created for: an entry whose expectedHits reaches 0 is fully retired and
# must be deleted, not left behind as a zero-weight permanent allowance.
#
# internal/tui/ftue/* is THIS epic's own entry and must reach expectedHits: 0
# for BOTH gates (and then be deleted) before the epoch closes - every other
# entry belongs to a different, later piece of work.
expectedEntryCount: 9
entries:
  - path: internal/tui/styles.go
    gates:
      - gate: colors
        expectedHits: 23
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "shared base/header/selected/dim/border styles for the pre-kit dashboard, session, trends, and annotation screens; a hand-picked terminal palette predating internal/tui/theme"
  - path: internal/tui/session.go
    gates:
      - gate: colors
        expectedHits: 2
      - gate: keys
        expectedHits: 2
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "session list row foreground/background colors; two switch-msg.String() key dispatch blocks (session list nav, detail view nav) predating internal/tui/keymap"
  - path: internal/tui/annotations.go
    gates:
      - gate: colors
        expectedHits: 2
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "annotation type badge colors"
  - path: internal/tui/annotation_editor.go
    gates:
      - gate: colors
        expectedHits: 1
      - gate: keys
        expectedHits: 1
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "annotation editor panel border color; one switch-msg.String() escape-key check predating internal/tui/keymap (the 1-9 digit-shortcut byte extraction elsewhere in this file is a distinct idiom the key grep gate does not flag)"
  - path: internal/tui/app.go
    gates:
      - gate: keys
        expectedHits: 3
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/keymap (not yet filed)"
    reason: "top-level tab-switcher captures msg.String() into a local and raw-compares it for quit/tab-switch handling, predating internal/tui/keymap"
  - path: internal/tui/dashboard.go
    gates:
      - gate: colors
        expectedHits: 1
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "dashboard metric row color"
  - path: internal/tui/trends.go
    gates:
      - gate: colors
        expectedHits: 1
    retiredBy: "a future TUI-kit adoption follow-up migrating legacy internal/tui screens onto internal/tui/theme (not yet filed)"
    reason: "trend bar chart color"
  - path: internal/push/wizard.go
    gates:
      - gate: colors
        expectedHits: 10
      - gate: keys
        expectedHits: 5
    retiredBy: "planned peasant#26"
    reason: "share wizard styling colors predating internal/tui/theme; five switch-msg.String() key dispatch blocks (one per wizard step) predating internal/tui/keymap"
  - path: internal/tui/ftue/*
    gates:
      - gate: colors
        expectedHits: 13
      - gate: keys
        expectedHits: 18
    retiredBy: "this epic (peasant#28); must reach zero before epoch close"
    reason: "kickstart FTUE wizard styling colors, and its raw msg.String() equality/switch key dispatch (wizard.go + page.go); this epic's kit/kickstart slices are expected to migrate ftue onto internal/tui/theme and internal/tui/keymap before close"
