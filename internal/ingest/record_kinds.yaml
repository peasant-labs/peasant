          - {file: content_capture.go, symbol: captureContentBlockKinds, lists_only: true}
        kinds:
          - {<<: *text, kind: text}
          - {<<: *text, kind: thinking}
          - {<<: *tool, kind: tool_use}
          - {<<: *result, kind: tool_result}
