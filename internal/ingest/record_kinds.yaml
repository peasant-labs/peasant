# Parser behavior, not a native-input allowlist. One declaration per line.
# Inventories point at production admission/dispatch syntax. Unknown valid names
# use fallback without a new declaration. Invalid known fields remain errors.
version: 2
harnesses:
  claude-code:
    adapter_version: 1
    indexer_version: 18
    index_version: 1
    fallback: &fallback
      status: retained-unknown
      preview: no
      payload: complete redacted JSON and source coordinates in retainedUnknown
      visualized: hidden
      reason: Retain uninterpreted evidence and mark partial interpretation; display is deferred.
      source: internal/ingest/retained_unknown.go NewRetainedUnknownFromSource
    inventories:
      - context: retained-format-1
        namespace: record
        sources:
          - {file: content_capture.go, symbol: claudeStrictRecordKinds}
          - {file: content_capture.go, symbol: ClaudeIndexer.IndexTranscriptBytesForCapture, switch: line.Type}
          - {file: claude_control_records.go, symbol: claudeControlRecordTypes}
          - {file: claude_control_records.go, symbol: isClaudeControlRecordType, prefix_argument: recordType}
        kinds:
          - &text {kind: user, status: represented, preview: yes, payload: session entries, visualized: rendered, renderer: internal/transcript EntriesToTurns text projection and fairtrade TranscriptViewer}
          - {<<: *text, kind: assistant}
          - {<<: *text, kind: human}
          - {<<: *text, kind: system}
          - {<<: *text, kind: summary}
          - {<<: *text, kind: result}
          - &ignored {kind: progress, status: ignored-control, preview: no, payload: none, visualized: not-applicable, reason: Entryless control; unexpected conversation content remains a validation error.}
          - {<<: *ignored, kind: queue-operation}
          - {<<: *ignored, kind: file-history-snapshot}
          - {<<: *ignored, kind: last-prompt}
          - &control {kind: permission-mode, status: represented, preview: yes, payload: bounded control extra (oversized known controls retain identity only), visualized: planned}
          - {<<: *control, kind: mode}
          - {<<: *control, kind: agent-setting}
          - {<<: *control, kind: agent-name}
          - {<<: *control, kind: ai-title}
          - {<<: *control, kind: atis-latch}
          - {kind: attachment, status: tracked-only, preview: no, payload: bounded control extra, visualized: hidden}
          - {<<: *control, kind: bridge-session}
          - {<<: *control, kind: started}
          - {<<: *control, kind: cost-state}
          - {<<: *control, kind: custom-title}
          - {<<: *control, kind: file-history-delta}
          - {<<: *control, kind: frame-link}
          - {<<: *control, kind: fork-context-ref}
          - {<<: *control, kind: worktree-state}
          - {<<: *control, kind: launched}
          - {<<: *control, kind: pr-link}
          - {<<: *control, kind: artifact-, match: prefix}
      - context: retained-format-1
        namespace: system_subtype
        sources:
          - {file: content_capture.go, symbol: claudeStrictSystemSubtypes}
          - {file: content_capture.go, symbol: ClaudeIndexer.IndexTranscriptBytesForCapture, switch: line.Subtype}
        kinds:
          - {<<: *ignored, kind: turn_duration}
          - {<<: *control, kind: compact_boundary, payload: compactMetadata}
          - {<<: *ignored, kind: stop_hook_summary}
          - {<<: *text, kind: api_error}
      - context: retained-format-1
        namespace: content_block
        sources:
          - {file: content_capture.go, symbol: captureContentBlockKinds}
          - {file: content_capture.go, symbol: validateCaptureContent, switch: block.Type}
        kinds:
          - {<<: *text, kind: text}
          - {<<: *text, kind: thinking}
          - &tool {kind: tool_use, status: represented, preview: no, payload: tool name and arguments; renderer depends on recognized tool kind, visualized: planned}
          - &result {kind: tool_result, status: represented, preview: yes, payload: tool output; renderer depends on paired recognized tool kind, visualized: planned}
          - {<<: *ignored, kind: tool_reference}
  cursor:
    adapter_version: 1
    indexer_version: 17
    index_version: 1
    fallback: *fallback
    inventories:
      - context: retained-format-1
