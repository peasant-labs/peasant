# Record-kind registry: which harness record and part kinds peasant tracks,
# refuses, or ignores, and how each one is shown.
#
# This file is the per-harness mapping deliverable of peasant-labs/peasant#397.
# A test (record_kinds_drift_test.go) fails when production code and this file
# disagree in either direction: adding or removing a kind in a parser requires
# a registry edit in the same change.
#
# Closed rules, enforced by the loader and the drift test:
# - status: represented | tracked-only | ignored-control | refused
# - preview: yes | no
# - payload: the retained extra shape, or none
# - visualized: rendered | hidden | planned | not-applicable
# - reason: required for refused and ignored-control, empty otherwise
# - renderer: required for rendered, empty otherwise
# - source: a first-party code reference (file and symbol) or the census
#   comment on peasant-labs/peasant#385 that observed the kind
# - A kind absent from this file is refused: every strict parser ends its
#   dispatch with an UnrepresentedRecordError for an unlisted kind. The only
#   exception is the OpenCode legacy SQLite path, which tolerates an unknown
#   part with an OpenCodeUnknownPartType diagnostic instead of refusing; that
#   tolerance is recorded on the file kind below and is itself under review in
#   peasant-labs/peasant#447.
# - adapter_version and indexer_version name the HarvesterVersionRegistry
#   baseline this mapping was written against. A registry bump forces an
#   explicit re-verification here, so a version change cannot silently widen
#   or narrow the vocabulary.
# - Pi has no strict record vocabulary to walk (its indexer keeps PiExtra
#   state, never a kind switch), so it has no section until its mapping lands.
