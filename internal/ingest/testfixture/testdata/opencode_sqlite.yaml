        session_id: ses_history
        time_created: 5000
        time_updated: 5020
        data: '{"role":"assistant","version":"latest"}'
    legacy_parts:
      - id: part_latest
        message_id: msg_latest
        session_id: ses_history
        time_created: 5001
        time_updated: 5021
        data: '{"type":"text","text":"latest materialized part"}'
    current_messages:
      - id: sm_latest
        session_id: ses_history
        type: message
        time_created: 5002
        time_updated: 5022
        data: '{"role":"assistant","version":"latest-current"}'
        seq: 0
    ignored_history:
      - kind: event
        id: event_1
        session_id: ses_history
        stable_id: msg_latest
        time_created: 4990
        data: '{"version":"first"}'
      - kind: event
        id: event_2
        session_id: ses_history
        stable_id: msg_latest
        time_created: 4995
        data: '{"version":"second"}'
      - kind: delta
        id: delta_1
        session_id: ses_history
        stable_id: part_latest
        time_created: 4991
        data: '{"text":"first delta"}'
      - kind: delta
        id: delta_2
        session_id: ses_history
        stable_id: part_latest
        time_created: 4996
        data: '{"text":"second delta"}'
      - kind: input
        id: input_1
        session_id: ses_history
        stable_id: sm_latest
        time_created: 4992
        data: '{"ignored":true}'
      - kind: context
        id: context_1
        session_id: ses_history
        stable_id: sm_latest
        time_created: 4993
        data: '{"ignored":true}'
      - kind: migration
        id: migration_1
