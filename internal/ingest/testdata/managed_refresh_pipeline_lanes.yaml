# The lane a stored-metadata refresh takes, and whether the index stage tries
# the unchanged proof. Every case changes the metadata context or the indexer,
# so none is proven and every case parses.
cases:
  - name: adapter-behind
    mutation: adapter-behind
    reason: adapter_behind
    proof: true
  - name: adapter-stamp-absent
    mutation: adapter-absent
    reason: adapter_stamp_absent
    proof: true
  - name: indexer-behind
    mutation: indexer-behind
    reason: indexer_behind
    proof: false
