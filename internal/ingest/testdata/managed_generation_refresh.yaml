# The rule "a managed generation may settle through the metadata-only refresh"
# (managedGenerationRefreshApplies), one case per term. Every case starts from a
# stored-metadata result whose input was captured after the pair install and the
# managed mirror: the captured digest equals the stored index proof, the stored
# producer and index format are the target, the index is completed, no latest
# attempt is held, the adapter can extract from the stored transcript, and the
# store advertises the refresh capability.
#
# laneMarked:       the worker produced the input on the adapter-behind /
#                   adapter-stamp-absent stored-metadata lane for a managed
#                   target.
# managedTarget:    the harness target declares a managed (format 2) output.
# adapterExtractor: the harness adapter can extract metadata from the stored
#                   transcript (OpenCode and Strike cannot).
# storeCapability:  the store implements ManagedGenerationRefresher.
# proof:            complete (default) | incomplete | missing | different |
#                   index-format-old | producer-behind
# latestAttempt:    a latest attempt is held beside the active authority.
# want:             the metadata-only refresh may run instead of a parse.
cases:
  - name: adapter-behind-managed-installs-without-parse
    laneMarked: true
    want: true
  - name: adapter-stamp-absent-managed-installs-without-parse
    laneMarked: true
    want: true
  - name: indexer-behind-keeps-the-parse
    laneMarked: true
    proof: producer-behind
    want: false
  - name: missing-input-proof-keeps-the-parse
    laneMarked: true
    proof: missing
    want: false
  - name: different-input-proof-keeps-the-parse
    laneMarked: true
    proof: different
    want: false
  - name: incomplete-index-proof-keeps-the-parse
    laneMarked: true
    proof: incomplete
    want: false
  - name: old-index-format-keeps-the-parse
    laneMarked: true
    proof: index-format-old
    want: false
  - name: held-latest-attempt-keeps-the-parse
    laneMarked: true
    latestAttempt: true
    want: false
  - name: forced-run-keeps-the-parse
    laneMarked: true
    force: true
    want: false
  - name: reindex-keeps-the-parse
    laneMarked: true
    reindex: true
    want: false
  - name: native-only-adapter-keeps-the-parse
    laneMarked: true
    adapterExtractor: false
    want: false
  - name: strict-format-target-keeps-the-parse
    laneMarked: true
    managedTarget: false
    want: false
  - name: store-without-refresh-keeps-the-parse
    laneMarked: true
    storeCapability: false
    want: false
  - name: lane-marker-absent-keeps-the-parse
    laneMarked: false
    want: false
