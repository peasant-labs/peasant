# Pipeline parity: a full harvest and a session-scoped harvest over the same
# sources must leave the same store. Each case seeds a settled store, forks it,
# applies one mutation, then runs the full pipeline on A and the scoped pipeline
# on B and compares every non-exempt table as a multiset of normalized rows.
#
# The seed procedure is the eight steps in the ratified plan: baseline tree,
# full harvest, watermark settlement, the idempotence control on a byte copy,
# store-side planting, the fork to A and B, the case mutation, and the two runs.
# The runner performs steps 1-4 and 6-8 for every case, so no case can skip the
# control.
#
# Expected source-root operations are exact sets, relative to `root`. An empty
# list asserts the operation did not happen on the source root at all.
requiredNames:
  - control
  - stored-unchanged
  - stored-changed
  - new-direct-lookup
  - related-exclude
  - project-changed
  - stored-source-gone
  - stored-child-source-gone
  - derived-rebuild

root: /claude

volatileColumns:
  sessions:
    - ingested_ms
    - indexed_at
    - publication_capture_revision
    - indexed_publication_capture_revision
  claude_transcript_evidence:
    - mod_time_unix_nano
  session_publication_metadata:
    - capture_revision
    - metadata_json
    - metadata_hash
    - captured_at

exemptTables:
  ingest_log: >-
    Append-only run log: one row per run, an AUTOINCREMENT id and wall-clock
    start/finish times, so its rows are a property of the run, not of stored
    state. Asserted directly instead: one new row per store.
  index_log: >-
    Append-only per-session index audit log: AUTOINCREMENT id and run
    timestamps. Exempt from the whole-table diff; entries naming this run's
    cohort ids are compared under a cohort filter.
  ingest_run_outcomes: >-
    Append-only run log: AUTOINCREMENT id and the run's reason codes, a
    property of the run.
  session_entries_fts_data: >-
    FTS5 shadow table for external-content session_entries; its b-tree bytes
    depend on transaction boundaries, not on logical content, which the
    content table already compares.
  session_search_fts_data: >-
    FTS5 shadow table for external-content session_search_source; its bytes
    depend on transaction boundaries, not on logical content.

exemptColumns:
  ingest_log.id: AUTOINCREMENT surrogate assigned by the run, not a natural key.
  index_log.id: AUTOINCREMENT surrogate assigned by the run, not a natural key.
  ingest_run_outcomes.id: AUTOINCREMENT surrogate assigned by the run, not a natural key.
  push_log.id: AUTOINCREMENT surrogate; a harvest never writes this table, so it is constant across forks.
  scale_kinds.id: AUTOINCREMENT surrogate; seeded identically into every fork.

cases:
  - name: control
    harness: claude-code
    kind: control
    files:
      - path: project-a/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/work/project","message":{"role":"user","content":"drive"}}'
      - path: project-b/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/work/project-b","message":{"role":"user","content":"other"}}'
    mutation:
      action: none

  - name: stored-unchanged
