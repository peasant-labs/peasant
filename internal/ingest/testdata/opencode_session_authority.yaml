cases:
  - name: mixed-clockless-legacy-cannot-prove-absence
    fixture: native-current-rows
    setup: |
      DROP TABLE session;
      CREATE TABLE session (id TEXT PRIMARY KEY);
      CREATE TABLE session_v2 (id TEXT PRIMARY KEY);
    table: session_v2
    v2_layout: supported
    record_ids: []
    present_ids: []
    discovered_ids: [ses_3cd91f52effeXd3QAJ54jOyzn1]
  - name: mixed-malformed-legacy-keeps-presence
    fixture: native-current-rows
    setup: |
      UPDATE session SET time_updated='malformed';
      CREATE TABLE session_v2 (id TEXT PRIMARY KEY);
    table: session_v2
    v2_layout: supported
    diagnostic_contains: session metadata row(s) were dropped
    record_ids: []
    present_ids: []
    discovered_ids: [ses_3cd91f52effeXd3QAJ54jOyzn1]
  - name: mixed-live-records-with-orphans
    fixture: hybrid-deleted-sessions-skipped
    setup: |
      UPDATE session_message SET type='user', data='{"text":"current side of both","time":{"created":2100}}' WHERE id='sm_del_both';
      ALTER TABLE session ADD COLUMN directory TEXT;
      ALTER TABLE session ADD COLUMN title TEXT;
      UPDATE session SET directory='/fixtures/legacy', title='legacy child', time_created=1000, time_updated=8000, parent_id='ses_3cd91f52effeXd3QAJ54jOyzG2' WHERE id='ses_3cd91f52effeXd3QAJ54jOyzG1';
      UPDATE session SET directory='/fixtures/stale', title='stale shared', time_created=2000, time_updated=99000 WHERE id='ses_3cd91f52effeXd3QAJ54jOyzG2';
      CREATE TABLE session_v2 (id TEXT PRIMARY KEY, parent_id TEXT, time_updated INTEGER, directory TEXT, title TEXT, time_created INTEGER);
      INSERT INTO session_v2 VALUES ('ses_3cd91f52effeXd3QAJ54jOyzG2', NULL, 9000, '/fixtures/current', 'current parent', 3000);
    table: session_v2
    v2_layout: supported
    diagnostic_contains: no live record
    record_ids: [ses_3cd91f52effeXd3QAJ54jOyzG2]
    present_ids: [ses_3cd91f52effeXd3QAJ54jOyzG2]
    discovered_ids: [ses_3cd91f52effeXd3QAJ54jOyzG1, ses_3cd91f52effeXd3QAJ54jOyzG2]
    sessions:
      ses_3cd91f52effeXd3QAJ54jOyzG1: {title: legacy child, cwd: /fixtures/legacy, parent: ses_3cd91f52effeXd3QAJ54jOyzG2, created: 1000, updated: 8000, origin: legacy, transcript: DEL_LEGACY_ONLY}
      ses_3cd91f52effeXd3QAJ54jOyzG2: {title: current parent, cwd: /fixtures/current, parent: '', created: 3000, updated: 9000, origin: current, transcript: current side of both}
