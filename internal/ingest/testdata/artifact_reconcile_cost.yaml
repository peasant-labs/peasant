# Cost of reconciling the retained tree before discovery.
#
# Every case is one session in ONE corpus, not one run: the test seeds all of
# them through a real harvest, measures a second harvest over the settled
# corpus, then applies each case's change and measures a third harvest.
requiredNames:
  - settled-session-costs-no-transcript-read
  - changed-metadata-session-is-repaired
  - logs-only-session-is-bootstrapped
transcript: '{"type":"user","message":{"role":"user","content":"settled retained input"}}'
cases:
  - name: settled-session-costs-no-transcript-read
    sessionID: 33333333-3333-4333-8333-333333333333
    change: none
  - name: changed-metadata-session-is-repaired
    sessionID: 44444444-4444-4444-8444-444444444444
    change: metadata
  - name: logs-only-session-is-bootstrapped
    sessionID: 55555555-5555-4555-8555-555555555555
    change: unmirrored
