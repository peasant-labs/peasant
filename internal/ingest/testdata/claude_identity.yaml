          - '{"sessionId":"22222222-2222-4222-8222-222222222222","uuid":"own","parentUuid":"boundary","type":"user","message":{"role":"user","content":"synthetic"}}'
  - name: continuation copied history
    artifact: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    relationship: context_from
    target: 11111111-1111-4111-8111-111111111111
    files:
