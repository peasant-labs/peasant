required_cache_corruption_names: [missing recorded session id, null recorded session id, invalid recorded session id]
cache_corruptions:
  - {name: missing recorded session id, records_json: '[{"uuid":"agent-record"}]'}
  - {name: null recorded session id, records_json: '[{"sessionId":null,"uuid":"agent-record"}]'}
  - {name: invalid recorded session id, records_json: '[{"sessionId":"../other","uuid":"agent-record"}]'}
retained_expectations:
  context_from: {target_state: target_known_retained, evidence: retained_last_good, anchor: {kind: general_source_session}}
  started_by: {target_state: target_known_retained, evidence: retained_last_good}
  conflicting_current_native_evidence: {target_state: conflicting_current_native_evidence, evidence: conflict}
required_cache_upgrade_names: [legacy without structural proof, prior uncorrelated spawn proof]
cache_upgrades:
  - {name: legacy without structural proof, proof_version: 0}
  - {name: prior uncorrelated spawn proof, proof_version: 1}
required_retained_refusal_names:
  - changed multi-source bytes
  - absent multi-source digest with own-only replacement
required_case_names:
  - matching root
  - fork divergence with restamped history
  - continuation from source tail
  - continuation from compact boundary
  - continuation copied history
  - root agent native owner
  - workflow copied to continuation tree
  - duplicated agent content
  - whole file substitution
  - unrelated mixed identities
  - absent source snapshot
  - copied coordinate conflict
  - wrong native agent id
  - conflicting layout owner
  - native spawn proves copied layout owner
  - agent without native owner file
  - inconsistent sidechain identity
  - fork with unrelated foreign record
  - disconnected copied record
  - disconnected copied layout owner
  - duplicated differing agent snapshots
  - duplicated conflicting agent owners
  - layout owner after root rotation
  - copied history from multiple proved sources
  - corrupt source snapshot cannot prove continuation
  - substituted owner snapshot cannot prove root agent
  - uncorrelated tool output cannot prove agent spawn
  - legacy nested agent without sidechain flag
  - legacy layout wins over unproved root duplicate
  - explicit main-chain record without agent id is refused
  - disconnected local-command divergence
cases:
