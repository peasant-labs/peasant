required_case_names:
  - matching root
  - fork divergence with restamped history
  - continuation from source tail
  - continuation from compact boundary
  - continuation copied history
  - root agent native owner
  - workflow copied to continuation tree
  - duplicated agent content
  - whole file substitution
  - unrelated mixed identities
  - absent source snapshot
  - copied coordinate conflict
  - wrong native agent id
  - conflicting layout owner
  - native spawn proves copied layout owner
  - agent without native owner file
  - inconsistent sidechain identity
  - fork with unrelated foreign record
  - disconnected copied record
  - disconnected copied layout owner
  - duplicated differing agent snapshots
  - duplicated conflicting agent owners
cases:
  - name: matching root
    artifact: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    files:
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","uuid":"own","type":"user","message":{"role":"user","content":"synthetic"}}'
  - name: fork divergence with restamped history
    capture_status: incomplete
    capture_failure: unknown_data_retained
    artifact: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    relationship: context_from
    target: 11111111-1111-4111-8111-111111111111
    files:
      - &source
        path: -workspace/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"s1","type":"user","message":{"role":"user","content":"synthetic"}}'
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"s2","parentUuid":"s1","type":"assistant","message":{"role":"assistant","content":"synthetic"}}'
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","uuid":"s1","type":"user","message":{"role":"user","content":"synthetic"}}'
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"command","parentUuid":"s1","type":"system","subtype":"local_command"}'
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"fork-tail","parentUuid":"command","type":"assistant","message":{"role":"assistant","content":"synthetic"}}'
  - name: continuation from source tail
    artifact: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    relationship: context_from
    target: 11111111-1111-4111-8111-111111111111
    files:
      - *source
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"foreign","parentUuid":"s2","type":"user","message":{"role":"user","content":"synthetic"}}'
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","uuid":"own","parentUuid":"foreign","type":"assistant","message":{"role":"assistant","content":"synthetic"}}'
  - name: continuation from compact boundary
    artifact: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    relationship: context_from
    target: 11111111-1111-4111-8111-111111111111
    files:
      - path: -workspace/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","uuid":"s1","type":"user","message":{"role":"user","content":"synthetic"}}'
