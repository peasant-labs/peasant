cases:
  - name: section4-exact
    steps:
      - allocator: [e_old, e_u1, e_ctx1, e_media1, e_a1, e_reason1, e_call1, e_result1, s_u1]
        capture:
          id: gen-section4
          sessionId: sess_section4
          harness: codex
          sourceEvidenceDigest: sha256:section4
          completeness: complete
          earlierStates: [uncertain_migrated]
          metadata:
            sessionId: sess_section4
            modelHarness: codex
            schemaVersion: 11
            rootSessionId: sess_root
            purpose: interaction
          blocks:
            - nativeKey: old-q
              section: {earlier: true, index: 1}
              role: user
              entryType: text
              depth: 0
              content: unique old child question
              provenance:
                origin: submitted_input
                actor: unknown
                delivery: session_admission
                ownership: uncertain
                evidence: native_typed
                inputModality: text
            - nativeKey: u1
              submissionKey: accept-u1
              section: {index: 0}
              role: user
              entryType: text
              depth: 0
              content: fix parser
              provenance:
                origin: submitted_input
                actor: unknown
                delivery: session_admission
                ownership: local
                evidence: native_typed
                inputModality: text
            - nativeKey: ctx1
              section: {index: 0}
              role: system
              entryType: text
              depth: 0
              content: injected AGENTS content
            - nativeKey: media1
              submissionKey: accept-u1
              section: {index: 0}
              role: user
              entryType: text
              depth: 0
              content: canonical media display content
              provenance:
                origin: submitted_input
                actor: unknown
                delivery: session_admission
                ownership: local
                evidence: native_typed
                inputModality: media
            - nativeKey: a1
              section: {index: 0}
              role: assistant
              entryType: text
              depth: 0
              content: I will inspect.
            - nativeKey: reason1
              section: {index: 0}
              role: assistant
              entryType: thinking
              depth: 0
              content: I will inspect.
            - nativeKey: call1
              section: {index: 0}
              role: assistant
              entryType: tool_use
              depth: 1
              carrierNativeKey: a1
              toolCallKey: call-a1
              toolName: rg
              toolArguments: rg parser
            - nativeKey: result1
              section: {index: 0}
              role: tool
              entryType: tool_result
              depth: 1
              carrierNativeKey: a1
              toolCallKey: call-a1
              toolResult: parser.go:12 plus fixture long output
        want:
          turnCount: 5
          inputSubmissionCount: 1
          titleRefs: [e_u1]
          main:
            - {nativeKey: u1, index: 0, ref: e_u1, role: user, entryType: text, depth: 0, content: fix parser, submissionRef: s_u1, ownership: local}
            - {nativeKey: ctx1, index: 1, ref: e_ctx1, role: system, entryType: text, depth: 0, content: injected AGENTS content}
            - {nativeKey: media1, index: 2, ref: e_media1, role: user, entryType: text, depth: 0, content: canonical media display content, submissionRef: s_u1, ownership: local}
            - {nativeKey: a1, index: 3, ref: e_a1, role: assistant, entryType: text, depth: 0, content: I will inspect.}
            - {nativeKey: reason1, index: 4, ref: e_reason1, role: assistant, entryType: thinking, depth: 0, content: I will inspect.}
            - {nativeKey: call1, index: 5, ref: e_call1, role: assistant, entryType: tool_use, depth: 1, parentIndex: 3, toolInput: rg parser, toolCallId: e_call1}
            - {nativeKey: result1, index: 6, ref: e_result1, role: tool, entryType: tool_result, depth: 1, parentIndex: 3, toolOutput: parser.go:12 plus fixture long output, toolCallId: e_call1}
          earlier:
            - state: uncertain_migrated
              entries:
                - {nativeKey: old-q, index: 0, ref: e_old, role: user, entryType: text, depth: 0, content: unique old child question, ownership: uncertain}

