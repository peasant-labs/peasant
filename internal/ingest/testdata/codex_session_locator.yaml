# Parity between the full Codex walk and the two paths a scoped run uses: the
# by-name lookup and the located-source build. Each case builds its own tree,
# runs the production adapter over it, and asserts the exact filesystem
# operations the step performs. `now` anchors the lookup's two-folder window, so
# "own day folder" is 2026/11/08 and "the previous day" is 2026/11/07.
#
# A `located` case also compares its readable members, field for field, with what
# a full Discover of the same tree returns for those ids, so the two paths cannot
# drift apart.
requiredNames:
  - own-day-folder-hit
  - previous-day-folder-hit
  - outside-window-miss
  - suffix-match-only
  - duplicate-root-listed-once
  - lookup-failure-keeps-searched-set
  - stored-child-source-gone
  - stored-child-read-failed
  - stored-child-readable
  - stored-child-other-harness
  - nested-roots-prefer-the-sessions-tree
  - located-source-gone
  - located-source-id-mismatch
  - nested-thread-spawn-parent
  - stored-parent-recorded
  - located-read-failed
  - parent-not-a-session-id
now: "2026-11-08T09:30:00Z"
cases:
  - name: own-day-folder-hit
    roots:
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        parentID: "22222222-2222-4222-8222-222222222222"
        cwd: /work/project
      - path: sessions/2026/11/08/rollout-2026-11-08T08-00-00-33333333-3333-4333-8333-333333333333.jsonl
        kind: rollout
        sessionID: "33333333-3333-4333-8333-333333333333"
        cwd: /work/other
      # The id as a bare file name, and a file that is not a rollout: neither is
      # a session source, and neither may answer the lookup.
      - path: sessions/2026/11/08/11111111-1111-4111-8111-111111111111.jsonl
        kind: stray
        body: |
          the id names this file, but this is not a rollout
      - path: sessions/2026/11/08/notes.txt
        kind: stray
        body: |
          keep out of discovery
      - path: session_index.jsonl
        kind: index
        body: |
          {"id":"11111111-1111-4111-8111-111111111111","thread_name":"Plan the day"}
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      hits:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      reads:
        - session_index.jsonl
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      stats:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      expect:
        probeKind: ProbeCatalogWindow
        probeID: "22222222-2222-4222-8222-222222222222"

  - name: previous-day-folder-hit
    roots:
      - sessions
    files:
      - path: sessions/2026/11/07/rollout-2026-11-07T23-55-00-44444444-4444-4444-8444-444444444444.jsonl
        kind: rollout
        sessionID: "44444444-4444-4444-8444-444444444444"
        cwd: /work/project
    lookup:
      id: "44444444-4444-4444-8444-444444444444"
      hits:
        - sessions/2026/11/07/rollout-2026-11-07T23-55-00-44444444-4444-4444-8444-444444444444.jsonl
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07
    located:
      id: "44444444-4444-4444-8444-444444444444"
      path: sessions/2026/11/07/rollout-2026-11-07T23-55-00-44444444-4444-4444-8444-444444444444.jsonl
      reads:
        - session_index.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T23-55-00-44444444-4444-4444-8444-444444444444.jsonl
      stats:
        - sessions/2026/11/07/rollout-2026-11-07T23-55-00-44444444-4444-4444-8444-444444444444.jsonl
      expect: {}

  - name: outside-window-miss
    roots:
      - sessions
    files:
      - path: sessions/2026/11/06/rollout-2026-11-06T10-00-00-55555555-5555-4555-8555-555555555555.jsonl
        kind: rollout
        sessionID: "55555555-5555-4555-8555-555555555555"
        cwd: /work/project
    lookup:
      id: "55555555-5555-4555-8555-555555555555"
      hits: []
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07

  - name: suffix-match-only
    roots:
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        cwd: /work/project
      # The id in the middle of a rollout name is not the id that name carries.
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111-extra.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        cwd: /work/project
      - path: sessions/2026/11/08/11111111-1111-4111-8111-111111111111.jsonl
        kind: stray
        body: |
          the id names this file, but this is not a rollout
      - path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-33333333-3333-4333-8333-333333333333.jsonl
        kind: rollout
        sessionID: "33333333-3333-4333-8333-333333333333"
        cwd: /work/other
      - path: sessions/2026/11/07/11111111-1111-4111-8111-111111111111.jsonl
        kind: stray
        body: |
          the id names this file, but this is not a rollout
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      hits:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07

  - name: duplicate-root-listed-once
    # The same root written twice must be listed once: two claims on one file
    # would read downstream as a duplicate session.
    roots:
      - sessions
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        cwd: /work/project
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      hits:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07

  - name: lookup-failure-keeps-searched-set
    roots:
      - sessions
      - archive
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-33333333-3333-4333-8333-333333333333.jsonl
        kind: rollout
        sessionID: "33333333-3333-4333-8333-333333333333"
        cwd: /work/other
      - path: archive/2026/11/07/rollout-2026-11-07T10-00-00-44444444-4444-4444-8444-444444444444.jsonl
        kind: rollout
        sessionID: "44444444-4444-4444-8444-444444444444"
        cwd: /work/archive
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      faultFolder: archive/2026/11/08
      errorContains: could not be listed
      # The first root completed, so its searched entry is still returned; the
      # failing root's entry is the core's SearchFailed, added from the error.
      searchedRoots:
        - sessions
      folders:
        - sessions/2026/11/08
        - sessions/2026/11/07
        - archive/2026/11/08

  - name: stored-child-source-gone
    roots:
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        parentID: "22222222-2222-4222-8222-222222222222"
        cwd: /work/project
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      # Recorded, but its file is gone: a member with no source and its reason,
      # never dropped.
      storedChildren:
        - id: "66666666-6666-4666-8666-666666666666"
          harness: codex
          path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
          unreadable: SourceGone
      reads:
        - session_index.jsonl
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      stats:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
      expect:
        probeKind: ProbeCatalogWindow
        probeID: "22222222-2222-4222-8222-222222222222"

  - name: stored-child-read-failed
    roots:
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        cwd: /work/project
      - path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
        kind: rollout
        sessionID: "66666666-6666-4666-8666-666666666666"
        cwd: /work/project
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      storedChildren:
        - id: "66666666-6666-4666-8666-666666666666"
          harness: codex
          path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
          faultRead: true
          unreadable: SourceFailed
          detailContains: the child source could not be read
      reads:
        - session_index.jsonl
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
      stats:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
      expect: {}

  - name: stored-child-readable
    roots:
      - sessions
    files:
      - path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        kind: rollout
        sessionID: "11111111-1111-4111-8111-111111111111"
        cwd: /work/project
      - path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
        kind: rollout
        sessionID: "66666666-6666-4666-8666-666666666666"
        cwd: /work/child
      - path: session_index.jsonl
        kind: index
        body: |
          {"id":"11111111-1111-4111-8111-111111111111","thread_name":"Plan the day"}
          {"id":"66666666-6666-4666-8666-666666666666","thread_name":"Follow the plan"}
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
      # A readable child is built like any other member: its source, title and
      # recorded parent must equal what a full discovery produces.
      storedChildren:
        - id: "66666666-6666-4666-8666-666666666666"
          harness: codex
          path: sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
          parent: "11111111-1111-4111-8111-111111111111"
      reads:
        - session_index.jsonl
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
      stats:
        - sessions/2026/11/08/rollout-2026-11-08T09-00-00-11111111-1111-4111-8111-111111111111.jsonl
        - sessions/2026/11/07/rollout-2026-11-07T10-00-00-66666666-6666-4666-8666-666666666666.jsonl
      expect: {}

  - name: stored-child-other-harness
