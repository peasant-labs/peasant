# payloadBytes is the total byte size of the over-limit payload literal the
# loader builds per token below. The 8 MiB payload cannot be written literally,
# so each template carries a token the test replaces with the built literal:
#   {{OVER}}             a JSON string of digit ones over the limit, whose
#                        decoded text is itself a valid JSON document, so the
#                        authoritative path would accept the record apart from
#                        size and every integrity row names its true refusal;
#   {{OVER_INVALID}}     a JSON string of letter x over the limit, whose decoded
#                        text is not valid JSON (the deliberate content change);
#   {{OVER_RAW_INVALID}} a bracket-balanced but lexically invalid raw value over
#                        the limit (the deliberate raw-syntax change).
payloadBytes: 8388672

# precedenceCases drive ingest.ProjectRetainedUnknown over stored Extra
# templates at the real transfer limit. `extras` holds one template per carrier
# entry. `want` is the required outcome: `integrity` (an EvidenceIntegrityError,
# never the transfer refusal), `legacy` (the missing-coordinate refusal, never
# the transfer refusal), or `size` (the 8 MiB transfer refusal: the motivating
# path or a deliberate precedence change named in the probe header).
# `exportHarness` and `entryHarness` default to codex; setting one exercises the
# two-harness contract with distinct values.
precedenceCases:
  - name: oversized_with_missing_coordinates_keeps_legacy_refusal
    extras: ['{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1},"payloadText":{{OVER}}}]}']
    want: legacy
  - name: oversized_unknown_member_before_payload_keeps_integrity_refusal
    extras: ['{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","bogus":1,"position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":{{OVER}}}]}']
    want: integrity
  - name: oversized_unknown_member_after_payload_keeps_integrity_refusal
    extras: ['{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":{{OVER}},"bogus":1}]}']
