# Which files inside a session directory a publication owns, decided by name
# alone. An owned name may be written, replaced or retired by the publication;
# every other member of the directory belongs to whoever put it there and is
# never touched.
#
# Each case names one file relative to the session directory. SESSION_ID is
# replaced with the session under test, and OTHER_SESSION_ID with a different
# session's id, so a neighbour's artifact is not claimed by this one.
requiredNames:
  - metadata_document_is_owned
  - jsonl_transcript_is_owned
  - json_transcript_is_owned
  - source_capture_marker_is_owned
  - debug_output_is_owned
  - retired_debug_output_is_still_owned
  - unrelated_user_file_is_not_owned
  - another_sessions_metadata_is_not_owned
  - a_file_named_like_the_session_but_not_an_artifact_is_not_owned
  - a_nested_path_under_debug_is_not_owned
  - a_bare_directory_name_is_not_owned
  - a_path_that_escapes_the_session_directory_is_not_owned
cases:
  - name: metadata_document_is_owned
    relative: SESSION_ID--metadata.json
    kind: metadata
  - name: jsonl_transcript_is_owned
    relative: SESSION_ID--transcript.jsonl
    kind: transcript
  - name: json_transcript_is_owned
    relative: SESSION_ID--transcript.json
    kind: transcript
  - name: source_capture_marker_is_owned
    relative: SESSION_ID--source-capture
    kind: source-capture
  - name: debug_output_is_owned
    relative: debug/harness.log
    kind: debug
  # The rule reads the NAME, never what this run writes, so an output the
  # session no longer produces is still its own and can be retired.
  - name: retired_debug_output_is_still_owned
    relative: debug/obsolete.log
    kind: debug
  - name: unrelated_user_file_is_not_owned
    relative: notes-from-the-user.txt
  - name: another_sessions_metadata_is_not_owned
    relative: OTHER_SESSION_ID--metadata.json
  - name: a_file_named_like_the_session_but_not_an_artifact_is_not_owned
    relative: SESSION_ID--transcript.txt
  - name: a_nested_path_under_debug_is_not_owned
    relative: debug/nested/harness.log
  - name: a_bare_directory_name_is_not_owned
    relative: debug
  - name: a_path_that_escapes_the_session_directory_is_not_owned
    relative: ../OTHER_SESSION_ID--metadata.json
