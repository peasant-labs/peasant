          - '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/workspace","toolUseResult":{"status":"teammate_spawned","team_name":"migration","name":"tests"},"message":{"role":"user","content":"spawn"}}'
