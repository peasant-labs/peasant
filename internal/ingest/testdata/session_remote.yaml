# The one precedence for which git remote a session belongs to, for the tree and
# for the import filter: the remote the store holds for an unchanged stored
# session, then the remote of the one directory the session names. remote is what
# git answers for any directory. askedDirs is every directory git was asked for a
# remote. sourcePath and originalRoot name where the harness found the recording;
# they answer only for a session with no project directory.
# requiredNames is the deletion guard: every name below must still be present.
requiredNames:
  - stored-remote-beats-the-directory
  - stored-session-with-no-remote-is-not-asked-again
  - unstored-session-asks-its-project-directory
  - changed-source-is-not-stored-evidence
  - unreadable-remote-is-empty
  - no-resolver-and-nothing-stored-is-empty
  - stored-remote-needs-no-resolver
  - no-project-directory-asks-the-original-root
  - no-project-directory-or-original-root-asks-the-source-folder
  - nothing-to-ask-is-empty
cases:
  - name: stored-remote-beats-the-directory
    cwd: /work/tool
    storedRemote: https://github.com/example-org/stored.git
    storedKnown: true
    remote: https://github.com/example-org/moved.git
    wantRemote: https://github.com/example-org/stored.git
    askedDirs: []
  # The earlier import already looked at git and found no remote; a scan does not
  # walk git again for every such session.
  - name: stored-session-with-no-remote-is-not-asked-again
    cwd: /work/tool
    storedKnown: true
    remote: https://github.com/example-org/moved.git
    wantRemote: ""
    askedDirs: []
  - name: unstored-session-asks-its-project-directory
    cwd: /work/tool/packages/web
    sourcePath: /sessions/-work-tool/one.jsonl
    originalRoot: /sessions
    remote: https://github.com/example-org/demo.git
    wantRemote: https://github.com/example-org/demo.git
    askedDirs: [/work/tool/packages/web]
  # A recording that changed after the import is not stored evidence.
  - name: changed-source-is-not-stored-evidence
    cwd: /work/tool
    storedRemote: https://github.com/example-org/stored.git
    storedKnown: false
    remote: https://github.com/example-org/moved.git
    wantRemote: https://github.com/example-org/moved.git
    askedDirs: [/work/tool]
  - name: unreadable-remote-is-empty
    cwd: /work/tool
    remote: https://github.com/example-org/demo.git
    remoteFails: true
    wantRemote: ""
    askedDirs: [/work/tool]
  - name: no-resolver-and-nothing-stored-is-empty
    cwd: /work/tool
    noResolver: true
    wantRemote: ""
    askedDirs: []
  - name: stored-remote-needs-no-resolver
    cwd: /work/tool
    noResolver: true
    storedRemote: https://github.com/example-org/stored.git
    storedKnown: true
    wantRemote: https://github.com/example-org/stored.git
    askedDirs: []
  - name: no-project-directory-asks-the-original-root
    sourcePath: /sessions/-gone/one.jsonl
    originalRoot: /sessions
    remote: https://github.com/example-org/demo.git
    wantRemote: https://github.com/example-org/demo.git
    askedDirs: [/sessions]
  - name: no-project-directory-or-original-root-asks-the-source-folder
    sourcePath: /sessions/-gone/one.jsonl
    remote: https://github.com/example-org/demo.git
    wantRemote: https://github.com/example-org/demo.git
    askedDirs: [/sessions/-gone]
  - name: nothing-to-ask-is-empty
    remote: https://github.com/example-org/demo.git
    wantRemote: ""
    askedDirs: []
