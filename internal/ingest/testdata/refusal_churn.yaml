# A settled refusal must not make the harvest churn.
#
# A capture this build's strict parser refused is a steady state: re-reading
# the same source refuses the same record again. The stored publication
# readiness nevertheless stays "needs ingest" forever, so if the readiness
# trigger alone decided the diff, every such session would re-enter the worker
# on every harvest, re-read its native source, and write the same refusal back.
#
# Each case states what the SECOND harvest owes: how many times it read the
# native source, and how many sessions it reported updated and unchanged. The
# first harvest establishes the stored state (a strict refusal, or a complete
# capture converted to the migrated preview-only shape). The measured run is
# the harvest after it. The exact read counts ARE the contract: a run that
# stops warning while still re-reading, or stops working while still looking
# settled, is each wrong in a way a boolean cannot see.
required_names:
  - settled-refusal-does-not-reingest
  - legacy-preview-still-reads-native-source
  - changed-bytes-still-read-native-source
  - newer-indexer-still-retries
  - no-input-proof-still-retries

session_id: 11111111-1111-4111-8111-111111111111
transcript: |
  {"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","uuid":"entry-first","timestamp":"2023-11-14T22:13:20Z","cwd":"/workspace","message":{"role":"user","content":"first turn"}}
  {"sessionId":"11111111-1111-4111-8111-111111111111","type":"assistant","uuid":"entry-second","timestamp":"2023-11-14T22:13:21Z","message":{"role":"assistant","model":"claude-sonnet-4-20250514","content":[{"type":"text","text":"second turn"}]}}
# A well-formed record kind this build does not represent. It is a refusal, not
# corruption, and no amount of re-reading this source will represent it.
unrepresented_record: '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"future.additive.event","uuid":"entry-third","timestamp":"2023-11-14T22:13:22Z","data":{"payload":"a well-formed kind this build does not represent"}}'

cases:
  # The steady state: nothing changed, so the second harvest owes no native
  # read and no index write. This is the churn this change removes.
  - name: settled-refusal-does-not-reingest
    stored: refusal
    mutate: none
    second_source_reads: 0
    second_updated: 0
    second_unchanged: 1
  # A migrated preview-only capture recorded NO refusal: nothing has tried to
  # certify it, so it is pending work and this build owes the native read that
  # upgrades it. Treating it as settled would leave the user a preview forever.
  - name: legacy-preview-still-reads-native-source
    stored: legacy_preview
    mutate: none
    second_source_reads: 1
    second_updated: 1
    second_unchanged: 0
  # New bytes are new evidence whatever the previous refusal said. A real
  # append moves the source clock, so the clock trigger fires and the worker
  # re-reads the source before the fingerprint comparison inside it decides.
  - name: changed-bytes-still-read-native-source
    stored: refusal
    mutate: append_record
    second_source_reads: 1
    second_updated: 1
    second_unchanged: 0
  # A newer indexer might represent the record, so the steady state lifts and
  # the session is retried.
  - name: newer-indexer-still-retries
    stored: refusal
    mutate: bump_indexer
    second_source_reads: 1
    second_updated: 1
    second_unchanged: 0
  # A refusal with no input proof anchors nothing to the bytes it claims to
  # describe, so it is not a steady state and must be retried.
  - name: no-input-proof-still-retries
    stored: refusal
    mutate: clear_input_proof
    second_source_reads: 1
    second_updated: 1
    second_unchanged: 0

# THE PREDICATE ITSELF, over the DIFF location's stored refusal fields.
#
# A whole harvest cannot cheaply arrange every stored combination. The
# discovery hint reads the location's fields and the harness target, so each
# term is stated over its own inputs here, and the harvests above prove the
# caller asks it.
settled_required_names:
  - a-settled-refusal-is-not-change-evidence
  - a-refusal-under-a-newer-target-is-change-evidence
  - a-refusal-with-no-input-proof-is-change-evidence
  - a-migrated-legacy-preview-is-not-settled
  - a-capture-nothing-refused-is-not-settled
settled_cases:
  - name: a-settled-refusal-is-not-change-evidence
    failure_code: strict_capture_refused
    stored_indexer_version: 16
    target_indexer_version: 16
    input_proof: true
    expect: unchanged
  - name: a-refusal-under-a-newer-target-is-change-evidence
    failure_code: strict_capture_refused
    stored_indexer_version: 16
    target_indexer_version: 17
    input_proof: true
    expect: updated
  - name: a-refusal-with-no-input-proof-is-change-evidence
    failure_code: strict_capture_refused
    stored_indexer_version: 16
    target_indexer_version: 16
    input_proof: false
    expect: updated
  - name: a-migrated-legacy-preview-is-not-settled
    failure_code: legacy_preview_only
    stored_indexer_version: 16
    target_indexer_version: 16
    input_proof: true
    expect: updated
  - name: a-capture-nothing-refused-is-not-settled
    failure_code: ""
    stored_indexer_version: 16
    target_indexer_version: 16
    input_proof: true
    expect: updated
