required_names:
  - canonical_registry
  - injected_subset_without_indexers
  - missing_adapter_target
  - nonpositive_adapter
  - nonpositive_indexer
  - nonpositive_index
  - unused_output_format_without_indexers
  - unimplemented_harness
cases:
  - name: canonical_registry
    harnesses: [claude-code, opencode, codex, cursor, strike, pi]
    adapter: 1
    adapterOverrides: {claude-code: 2, codex: 2, pi: 3, opencode: 3}
    indexer: 15
    indexerOverrides: {claude-code: 19, codex: 18, cursor: 18, strike: 17, opencode: 18, pi: 18}
    nativeTargets:
      codex: {adapter_version: 3, indexer_version: 20, index_version: 2}
      opencode: {adapter_version: 4, indexer_version: 19, index_version: 2}
    index: 1
  - name: injected_subset_without_indexers
    harnesses: [claude-code]
    adapter: 1
    indexer: 16
    index: 1
  - name: missing_adapter_target
    harnesses: []
    error: has no version declaration
  - name: nonpositive_adapter
    harnesses: [claude-code]
    adapter: 0
    indexer: 15
    index: 1
    error: nonpositive versions
  - name: nonpositive_indexer
    harnesses: [claude-code]
    adapter: 1
    indexer: -1
    index: 1
    error: nonpositive versions
  - name: nonpositive_index
    harnesses: [claude-code]
    adapter: 1
    indexer: 15
    index: 0
    error: nonpositive versions
  - name: unused_output_format_without_indexers
    harnesses: [claude-code]
    adapter: 1
    indexer: 15
    index: 2
  - name: unimplemented_harness
    harnesses: [gemini]
    adapter: 1
    indexer: 15
    index: 1
    error: has no registered adapter
