# Capture assessment pins (PROPOSAL-3 section 5.2 V1 scope).
#
# Each case independently specifies parser facts and the expected capture
# tuple. The test builds real V1 entries (known carriers plus retained
# unknown carriers plus omission placeholders), runs AssessCapture, attempts
# checked ContentCapture conversion, and attempts a store write with matching
# versus forged tuples. Expected payloads and positions originate here, never
# from production capture.
required_names:
  - known-only
  - unknown-only
  - omitted-only
  - mixed-accounted
  - mixed-unaccounted
  - legacy-only
  - declared-format-mismatch
  - nil-result
  - typed-nil-result
  - zero-assessment
  - unsupported-enum
cases:
  - name: known-only
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    unknown_records: []
    omitted: false
    want_coverage: full
    want_failure: ""
    want_partial: false
    want_occurrences: 0
  - name: unknown-only
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    unknown_records:
      - namespace: record
        kind: future_record
        source_ref: src-unknown-only
        record_index: 0
        position: 0
        pointer: ""
        payload: '{"type":"future","value":1}'
        with_public: true
    omitted: false
    want_coverage: full
    want_failure: unknown_data_retained
    want_partial: true
    want_occurrences: 1
  - name: omitted-only
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: true
    unaccounted: false
    unknown_records: []
    omitted: true
    want_coverage: full
    want_failure: source_records_omitted
    want_partial: true
    want_occurrences: 0
  - name: mixed-accounted
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: true
    unaccounted: false
    unknown_records:
      - namespace: record
        kind: future_record
        source_ref: src-mixed
        record_index: 2
        position: 2
        pointer: ""
        payload: '{"type":"future","value":2}'
        with_public: true
    omitted: true
    want_coverage: full
    want_failure: source_records_omitted
    want_partial: true
    want_occurrences: 1
  - name: mixed-unaccounted
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: true
    unaccounted: true
    unknown_records:
      - namespace: record
        kind: future_record
        source_ref: src-mixed-unaccounted
        record_index: 2
        position: 2
        pointer: ""
        payload: '{"type":"future","value":3}'
        with_public: true
    omitted: true
    want_coverage: preview
    want_failure: strict_capture_refused
    want_partial: true
    want_occurrences: 1
  - name: legacy-only
    harness: claude-code
    policy: legacy
    authoritative: true
    source_omitted: false
    unaccounted: false
    unknown_records:
      - namespace: record
        kind: future_record
        source_ref: ""
        record_index: 0
        position: 0
        pointer: ""
        payload: '{"type":"future","value":4}'
        with_public: false
    omitted: false
    want_coverage: preview
    want_failure: legacy_preview_only
    want_partial: true
    want_occurrences: 1
  - name: declared-format-mismatch
    harness: claude-code
    policy: fresh
    authoritative: false
    source_omitted: false
    unaccounted: false
    unknown_records: []
    omitted: false
    want_coverage: preview
    want_failure: strict_capture_refused
    want_partial: true
    want_occurrences: 0
  - name: nil-result
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    nil_result: true
    want_coverage: error
    want_failure: ""
    want_partial: false
    want_occurrences: 0
  - name: typed-nil-result
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    typed_nil_result: true
    want_coverage: error
    want_failure: ""
    want_partial: false
    want_occurrences: 0
  - name: zero-assessment
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    zero_assessment: true
    want_coverage: error
    want_failure: ""
    want_partial: false
    want_occurrences: 0
  - name: unsupported-enum
    harness: claude-code
    policy: fresh
    authoritative: true
    source_omitted: false
    unaccounted: false
    unsupported_policy: 7
    want_coverage: error
    want_failure: ""
    want_partial: false
    want_occurrences: 0
