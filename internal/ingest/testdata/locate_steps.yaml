# LOCATE steps: one case per behavior the scoped path must preserve.
#
# Every case runs the real pipeline in dry-run mode with a real store and fake
# adapters that record the production lookup/build calls. A build result is
# "ok", "gone", "fail", or "noMember"; a lookup declares hits, a failure, or an
# unsupported format.
requiredNames:
  - stored_path_first
  - stored_path_gone_joins_children
  - lookup_fanout
  - lookup_failed
  - lookup_unsupported
  - unreadable_harness_disabled
  - since_filtered
  - several_misses
  - duplicate_claude_root
  - duplicate_codex_catalog
  - ancestor_catalog_window
  - ancestor_row_probe
  - ancestor_path_chain_cycle
  - readable_parent_unreadable_child
  - related_exclude

