# One row per leaf of schema.UnifiedMetadata (dotted Go field path), with a
# mutation value written as JSON. The validator oracle mutates that field in
# every stored metadata sidecar of its Claude corpus before the refresh; the
# oracle, not this file, decides the expected result. A test reflects the
# struct and requires exact membership, and the loader rejects a mutation
# equal to a corpus value. An optional opencode_mutation replaces the mutation
# in the OpenCode oracle where the shared value equals the OpenCode corpus value.
fields:
  - {field: SchemaVersion, mutation: '11'}
  - {field: SessionID, mutation: '"deadbeef-0000-4000-8000-000000000001"'}
  - {field: ParentUUID, mutation: '"deadbeef-0000-4000-8000-000000000002"'}
