    wantOver: false
  - name: probe_unknown_harness
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"bogus","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789"}]}'
