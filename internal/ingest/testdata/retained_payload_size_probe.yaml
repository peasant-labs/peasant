# probeHarness is the export harness the probe cases are asked for unless the
# case overrides it. The probe requires the envelope harness to name a known
# harness matching the export harness and the carrier entry harness.
probeHarness: codex

# transferLimitMiB is the published retained-evidence transfer limit the refusal
# label must state. It is an independent literal contract pin for the production
# constant (defaults.RetainedUnknownPayloadCapBytes), which mirrors the schema
# contract's inner per-payload 8 MiB raw-document bound, so a source revert to a
# decoupled limit fails even though the label would still agree with the
# enforcement.
transferLimitMiB: 8

# noMaterializationPayloadBytes sizes the allocation proof's over-limit payload.
# It must exceed the small injected limit the proof passes so the in-place probe
# refuses before the projection path materializes the payload; at or below the
# limit the probe would accept and the backstop would copy the payload first. It
# stays a few tens of KiB, so the proof observes the no-copy invariant on the
# production decision path without materializing a cap-sized document. The value
# is a literal here, never derived from the production constant.
noMaterializationPayloadBytes: 65536

# measureCases drive scanJSONString directly: `raw` is one JSON string literal
# and `want` is its decoded UTF-8 byte length.
measureCases:
  - { name: measure_plain, raw: '"hello"', want: 5 }
  - { name: measure_escaped_quote, raw: '"a\"b"', want: 3 }
  - { name: measure_basic_escapes, raw: '"\b\f\n\r\t\/\\"', want: 7 }
  - { name: measure_surrogate_pair, raw: '"\uD83D\uDE00"', want: 4 }
  - { name: measure_unpaired_high_surrogate, raw: '"\uD83D"', want: 3 }
  - { name: measure_unpaired_low_surrogate, raw: '"\uDE00"', want: 3 }
  - { name: measure_bmp_escape, raw: '"\u00e9"', want: 2 }
  - { name: measure_raw_multibyte, raw: '"héllo"', want: 6 }

# rawExtentCases drive skipJSONValue directly: `value` is one JSON value and
# `want` is its raw byte extent, which must equal len(json.RawMessage) from
# encoding/json. This is the quantity the probe compares to the transfer limit
# for the legacy raw `payload` encoding, whatever JSON kind the value is.
rawExtentCases:
  - { name: raw_extent_string, value: '"1111111111"', want: 12 }
  - { name: raw_extent_escaped_string, value: '"a\u00e9"', want: 9 }
  - { name: raw_extent_object, value: '{"a":"1111111111"}', want: 18 }
  - { name: raw_extent_array, value: '[1,2,3,4,5,6,7,8,9]', want: 19 }
  - { name: raw_extent_number, value: '123456789', want: 9 }
  - { name: raw_extent_true, value: 'true', want: 4 }
  - { name: raw_extent_nested_object, value: '{"a":{"b":1}}', want: 13 }

# probeCases drive storedRetainedExtraExceedsTransferLimit over one stored Extra
# root string. `limit` is the transfer limit the case exercises; a small value
# keeps every case cheap. `harness`, when set, overrides probeHarness;
# `entryHarness`, when set, carries a different harness on the entry itself so
# the entry-harness arm is exercised with distinct values. wantOver is the probe
# verdict. `declined: true` marks a shape the probe refuses to measure so the
# authoritative path owns the refusal; an unmarked wantOver:false case is a
# canonical record that stays under the limit. `decoderAccepts: true` on a
# declined row additionally pins that the authoritative decode accepts the
# shape (the probe is conservative there); `decoderRefuses: true` pins that the
# authoritative decode refuses it. Both flags are declined rows only. Cases
# with wantOver true are canonical records with an over-limit payload: each
# carries a non-public locator beside public (a non-zero line or sequence, a
# non-blank sourceId, or a valid sourceEntryRef) so the authoritative path
# would accept them apart from size, including canonical escaped spellings of
# owned strings and member names. Templates carry tokens the test replaces: {{FF}} is one raw
# 0xFF byte (invalid UTF-8, which YAML cannot spell literally), {{DEEP}} is a
# 12,001-deep raw array, {{DEEP9997}} is a 9,997-deep raw array one past the
# probe's conservative raw-payload budget (declined by the probe, accepted by
# the decoder), {{DEEP9996}} is a 9,996-deep raw array exactly at the probe's
# raw-payload budget (accepted by both), {{DEEP9999}} is a 9,999-deep raw
# array exactly at the extension budget (accepted by both), and {{DEEP10000}}
# is a 10,000-deep raw array one past the extension budget (declined by
# the probe, refused by the decoder). The depth spellings are expanded from
# localRawEvidenceDepth, the shared authoritative ceiling, in the test rather
# than from the probe's own budget constants, so narrowing a probe budget
# without moving the authority turns the accepted boundary row red instead of
# silently retargeting it. The
# measureCases unpaired-surrogate rows pin the measurement helper only; the
# probe declines those shapes via its whole-document pre-scan, pinned by the
# probe_lone_surrogate rows below. Deliberate size-precedence shapes (invalid
# payload content, cross-record corruption) are not pinned here; they are
# asserted end to end in TestProjectRetainedUnknownPrecedence.
probeCases:
  - name: probe_payload_text_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"1111111111"}]}'
    wantOver: true
  - name: probe_payload_text_under_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"1111"}]}'
    wantOver: false
  - name: probe_payload_text_escapes_over_limit
    limit: 3
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"11\u00311"}]}'
    wantOver: true
  - name: probe_raw_payload_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":123456789}]}'
    wantOver: true
  - name: probe_raw_string_over_limit_under_decoded
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1,"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":"aaaaaaa"}]}'
    wantOver: true
