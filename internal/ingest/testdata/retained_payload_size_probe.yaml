# noMaterializationCases drive the allocation proof in
# TestProjectRetainedUnknownRefusesOversizedPayloadBeforeMaterializing: each
# name is a required closed set over the stored encodings, including the
# escaped-owned-string shape, the escaped-owned-key shape, and the escaped
# evidence-root-key shape that once lost the early refusal. The proof payload is
# sized by noMaterializationPayloadBytes above, over the small injected limit the
# proof passes, so the in-place probe refuses before the projection path can
# materialize it.
noMaterializationCases:
  - { name: no_materialization_payload_text, encoding: payloadText }
  - { name: no_materialization_raw_payload, encoding: rawPayload }
  - { name: no_materialization_escaped_kind, encoding: escapedKind }
  - { name: no_materialization_escaped_key, encoding: escapedKey }
  - { name: no_materialization_escaped_root_key, encoding: escapedRootKey }

# capBoundaryCases drive TestProjectRetainedUnknownAtCapPayloads through the
# production entry with a small injected limit: each name is a required closed
# set over the stored encodings crossed with the at-cap and one-over positions.
# The at-cap/one-over mechanics run on few-KiB payloads; the real 8 MiB cap is
# asserted as data by transferLimitMiB above, and one real cap-sized proof lives
# in the non-race lane. One byte over the injected limit must be refused by the
# transfer probe.
capBoundaryCases:
  - { name: cap_boundary_payload_text_at_cap, encoding: payloadText, position: atCap }
  - { name: cap_boundary_payload_text_one_over, encoding: payloadText, position: oneOver }
  - { name: cap_boundary_raw_payload_at_cap, encoding: rawPayload, position: atCap }
  - { name: cap_boundary_raw_payload_one_over, encoding: rawPayload, position: oneOver }
