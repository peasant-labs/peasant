# probeHarness is the export harness the probe cases are asked for unless the
# case overrides it. The probe requires the envelope harness to name a known
# harness matching the export harness and the carrier entry harness.
probeHarness: codex

# measureCases drive scanJSONString directly: `raw` is one JSON string literal
# and `want` is its decoded UTF-8 byte length. `limit`, when set, also asserts
# that measurement stops as soon as the decoded length exceeds it.
measureCases:
  - { name: measure_plain, raw: '"hello"', want: 5 }
  - { name: measure_escaped_quote, raw: '"a\"b"', want: 3 }
  - { name: measure_basic_escapes, raw: '"\b\f\n\r\t\/\\"', want: 7 }
  - { name: measure_surrogate_pair, raw: '"\uD83D\uDE00"', want: 4 }
  - { name: measure_unpaired_high_surrogate, raw: '"\uD83D"', want: 3 }
  - { name: measure_unpaired_low_surrogate, raw: '"\uDE00"', want: 3 }
  - { name: measure_bmp_escape, raw: '"\u00e9"', want: 2 }
  - { name: measure_raw_multibyte, raw: '"héllo"', want: 6 }
  - { name: measure_over_limit_stops, raw: '"0123456789"', limit: 8, wantExceeded: true }

# rawExtentCases drive skipJSONValue directly: `value` is one JSON value and
# `want` is its raw byte extent, which must equal len(json.RawMessage) from
# encoding/json. This is the quantity the probe compares to the transfer limit
# for the legacy raw `payload` encoding, whatever JSON kind the value is.
rawExtentCases:
  - { name: raw_extent_string, value: '"0123456789"', want: 12 }
  - { name: raw_extent_escaped_string, value: '"a\u00e9"', want: 9 }
  - { name: raw_extent_object, value: '{"a":"0123456789"}', want: 18 }
  - { name: raw_extent_array, value: '[1,2,3,4,5,6,7,8,9]', want: 19 }
  - { name: raw_extent_number, value: '123456789', want: 9 }
  - { name: raw_extent_true, value: 'true', want: 4 }

# probeCases drive storedRetainedExtraExceedsTransferLimit over one stored Extra
# root string. `limit` is the transfer limit the case exercises; a small value
# keeps every case cheap. `harness`, when set, overrides probeHarness. wantOver
# is the probe verdict. `declined: true` marks a shape the probe refuses to
# measure so the authoritative path owns the refusal; an unmarked wantOver:false
# case is a canonical record that stays under the limit. Cases with wantOver
# true are canonical records with an over-limit payload.
probeCases:
  - name: probe_payload_text_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789"}]}'
    wantOver: true
  - name: probe_payload_text_under_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123"}]}'
    wantOver: false
  - name: probe_payload_text_escapes_over_limit
    limit: 3
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"a\u00e9b"}]}'
    wantOver: true
  - name: probe_raw_payload_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":123456789}]}'
    wantOver: true
  - name: probe_raw_string_over_limit_under_decoded
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":"aaaaaaa"}]}'
    wantOver: true
  - name: probe_raw_object_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":{"a":"0123456789"}}]}'
    wantOver: true
  - name: probe_raw_array_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":[1,2,3,4,5,6,7,8,9]}]}'
    wantOver: true
  - name: probe_extension_before_retained_evidence
    limit: 8
    extra: '{"other":{"a":1},"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789"}]}'
    wantOver: true
  - name: probe_retained_after_extension_payload
    limit: 8
    extra: '{"other":{"payloadText":"0123456789"},"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123"}]}'
    wantOver: false
  - name: probe_multiple_records_second_over_limit
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123"},{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":1,"position":1}},"payloadText":"0123456789"}]}'
    wantOver: true
  - name: probe_legacy_without_public_coordinates
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"line":1},"payloadText":"0123456789"}]}'
    wantOver: false
    declined: true
  - name: probe_unknown_envelope_member
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","bogus":1,"position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789"}]}'
    wantOver: false
    declined: true
  - name: probe_unknown_member_after_payload
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789","bogus":1}]}'
    wantOver: false
    declined: true
  - name: probe_both_payload_encodings
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payload":"x","payloadText":"0123456789"}]}'
    wantOver: false
    declined: true
  - name: probe_both_encodings_text_first
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789","payload":"x"}]}'
    wantOver: false
    declined: true
  - name: probe_corrupt_envelope_after_over_envelope
    limit: 8
    extra: '{"retainedUnknown":[{"harness":"codex","namespace":"record","kind":"future","position":{"public":{"sourceRef":"s","recordIndex":0,"position":0}},"payloadText":"0123456789"},{"harness":"codex","namespace":"record","kind":"future","bogus":1,"position":{"public":{"sourceRef":"s","recordIndex":1,"position":1}},"payloadText":"0123456789"}]}'
    wantOver: false
    declined: true
  - name: probe_non_object_root
    limit: 8
    extra: '[1,2,3]'
    wantOver: false
    declined: true
  - name: probe_missing_retained_array
    limit: 8
