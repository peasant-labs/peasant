cases:
  - name: codex-total-is-known-before-the-first-advance
    harness: codex
    files: &codex
      - {path: '2026/01/01/rollout-2026-01-01T00-00-00-11111111-1111-4111-8111-111111111111.jsonl', body: '{"type":"session_meta","payload":{"id":"11111111-1111-4111-8111-111111111111"}}'}
      - {path: '2026/01/01/rollout-2026-01-01T00-00-01-22222222-2222-4222-8222-222222222222.jsonl', body: '{"type":"session_meta","payload":{"id":"22222222-2222-4222-8222-222222222222"}}'}
    total: 2
  - {name: codex-advances-once-per-source, harness: codex, files: *codex, total: 2}
  - name: codex-counts-across-roots
    harness: codex
    roots: [first, second]
    files:
      - {path: 'first/2026/01/01/rollout-2026-01-01T00-00-00-11111111-1111-4111-8111-111111111111.jsonl', body: '{"type":"session_meta","payload":{"id":"11111111-1111-4111-8111-111111111111"}}'}
      - {path: 'second/2026/01/01/rollout-2026-01-01T00-00-01-22222222-2222-4222-8222-222222222222.jsonl', body: '{"type":"session_meta","payload":{"id":"22222222-2222-4222-8222-222222222222"}}'}
    total: 2
  - name: opencode-total-is-known-before-the-first-advance
    harness: opencode
    files: &opencode
      - {path: 'storage/session/project/ses_111.json', body: '{"id":"ses_111","directory":"/workspace"}'}
      - {path: 'storage/session/project/ses_222.json', body: '{"id":"ses_222","directory":"/workspace"}'}
    total: 2
  - {name: opencode-advances-once-per-source, harness: opencode, files: *opencode, total: 2}
  - name: pi-total-is-known-before-the-first-advance
    harness: pi
    files: &pi
      - {path: 'project/a.jsonl', body: '{"type":"session","version":3,"id":"11111111-1111-4111-8111-111111111111","cwd":"/workspace"}'}
      - {path: 'project/b.jsonl', body: '{"type":"session","version":3,"id":"22222222-2222-4222-8222-222222222222","cwd":"/workspace"}'}
    total: 2
  - {name: pi-advances-once-per-source, harness: pi, files: *pi, total: 2}
  - name: cursor-total-is-known-before-the-first-advance
    harness: cursor
    files: &cursor
      - {path: 'workspace/agent-transcripts/11111111-1111-4111-8111-111111111111/11111111-1111-4111-8111-111111111111.jsonl', body: '{"role":"user","message":{"content":"first"}}'}
      - {path: 'workspace/agent-transcripts/22222222-2222-4222-8222-222222222222/22222222-2222-4222-8222-222222222222.jsonl', body: '{"role":"user","message":{"content":"second"}}'}
    total: 2
  - {name: cursor-advances-once-per-source, harness: cursor, files: *cursor, total: 2}
  - name: cursor-counts-across-roots
    harness: cursor
    roots: [first, second]
    files:
      - {path: 'first/workspace/agent-transcripts/11111111-1111-4111-8111-111111111111/11111111-1111-4111-8111-111111111111.jsonl', body: '{"role":"user","message":{"content":"first"}}'}
      - {path: 'second/workspace/agent-transcripts/22222222-2222-4222-8222-222222222222/22222222-2222-4222-8222-222222222222.jsonl', body: '{"role":"user","message":{"content":"second"}}'}
    total: 2
  - name: strike-total-is-known-before-the-first-advance
    harness: strike
    files: &strike
      - {path: '11111111-1111-4111-8111-111111111111.jsonl', body: '{"type":"user.message","data":{"text":"first"}}'}
      - {path: '22222222-2222-4222-8222-222222222222.jsonl', body: '{"type":"user.message","data":{"text":"second"}}'}
    total: 2
  - {name: strike-advances-once-per-source, harness: strike, files: *strike, total: 2}
