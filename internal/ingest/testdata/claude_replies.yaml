# One stored reply per API message. Claude Code writes one message as several
# JSONL records that share message.id; the stored indexer groups them into one
# depth-0 assistant entry at the first record, holding the prose, with the
# thinking and tool calls as depth-1 children at their own positions.
#
# Each case runs the stored indexer (full depth) over `jsonl` and lists every
# stored entry in order. `parent` is -1 for a depth-0 entry. `tokensOut` and
# `stopReason` are empty when the entry records none. Sizes are summed over a
# reply's records: each `rawBytes` row names a reply entry and the line of its
# first record, and the entry's stored size must be the summed trimmed length
# of every line that carries that record's message id.
cases:
  - name: records-of-one-message-group-into-one-reply
    jsonl:
      - '{"type":"user","uuid":"u1","message":{"role":"user","content":"tidy the module"}}'
      - '{"type":"assistant","uuid":"a1","message":{"id":"msg_1","role":"assistant","content":[{"type":"thinking","thinking":"start with go.mod"}],"usage":{"input_tokens":3,"output_tokens":4}}}'
      - '{"type":"assistant","uuid":"a2","message":{"id":"msg_1","role":"assistant","content":[{"type":"text","text":"Tidying now."}],"usage":{"input_tokens":3,"output_tokens":7}}}'
      - '{"type":"assistant","uuid":"a3","message":{"id":"msg_1","role":"assistant","content":[{"type":"tool_use","id":"toolu_t","name":"Bash","input":{"command":"go mod tidy"}}],"usage":{"input_tokens":3,"output_tokens":9}},"stop_reason":"max_tokens"}'
    rawBytes: [{entry: 1, line: 1}]
    entries:
      - {index: 0, depth: 0, parent: -1, role: user, entryType: text, content: "tidy the module"}
      - {index: 1, depth: 0, parent: -1, role: assistant, entryType: text, content: "Tidying now.", toolNames: Bash, tokensOut: 9, stopReason: max_tokens}
      - {index: 2, depth: 1, parent: 1, role: assistant, entryType: thinking, content: "start with go.mod"}
      - {index: 3, depth: 1, parent: 1, role: assistant, entryType: tool_use, toolNames: Bash}

  - name: a-message-resumed-after-another-message-joins-its-reply
    jsonl:
      - '{"type":"assistant","uuid":"a1","message":{"id":"msg_a","role":"assistant","content":[{"type":"text","text":"Reading both files."}]}}'
      - '{"type":"assistant","uuid":"b1","message":{"id":"msg_b","role":"assistant","content":[{"type":"text","text":"A second reply."}]}}'
      - '{"type":"assistant","uuid":"a2","message":{"id":"msg_a","role":"assistant","content":[{"type":"tool_use","id":"toolu_r","name":"Read","input":{"path":"a.go"}}]}}'
      - '{"type":"user","uuid":"t1","message":{"role":"user","content":[{"type":"tool_result","tool_use_id":"toolu_r","content":"package a"}]}}'
    rawBytes: [{entry: 0, line: 0}]
    entries:
      - {index: 0, depth: 0, parent: -1, role: assistant, entryType: text, content: "Reading both files.", toolNames: Read}
      - {index: 1, depth: 0, parent: -1, role: assistant, entryType: text, content: "A second reply."}
      - {index: 2, depth: 1, parent: 0, role: assistant, entryType: tool_use, toolNames: Read}
      - {index: 3, depth: 0, parent: -1, role: tool, entryType: tool_result}
      - {index: 4, depth: 1, parent: 3, role: tool, entryType: tool_result, content: "package a"}

  - name: every-text-block-is-the-reply-prose
    jsonl:
      - '{"type":"assistant","uuid":"a1","message":{"id":"msg_p","role":"assistant","content":[{"type":"text","text":"First paragraph."}]}}'
      - '{"type":"assistant","uuid":"a2","message":{"id":"msg_p","role":"assistant","content":[{"type":"text","text":"Second paragraph."}]}}'
    rawBytes: [{entry: 0, line: 0}]
    entries:
      - {index: 0, depth: 0, parent: -1, role: assistant, entryType: text, content: "First paragraph.\n\nSecond paragraph."}

  - name: a-thinking-only-reply-holds-its-thinking
    jsonl:
      - '{"type":"assistant","uuid":"a1","message":{"id":"msg_t","role":"assistant","content":[{"type":"thinking","thinking":"first thought"}]}}'
      - '{"type":"assistant","uuid":"a2","message":{"id":"msg_t","role":"assistant","content":[{"type":"thinking","thinking":"second thought"}]}}'
    rawBytes: [{entry: 0, line: 0}]
    entries:
      - {index: 0, depth: 0, parent: -1, role: assistant, entryType: thinking, content: "first thought\n\nsecond thought"}

  - name: records-without-a-message-id-stay-separate-replies
    jsonl:
      - '{"type":"assistant","uuid":"a1","message":{"role":"assistant","content":[{"type":"text","text":"One."}]}}'
      - '{"type":"assistant","uuid":"a2","message":{"role":"assistant","content":[{"type":"text","text":"Two."}]}}'
    rawBytes: []
    entries:
      - {index: 0, depth: 0, parent: -1, role: assistant, entryType: text, content: "One."}
      - {index: 1, depth: 0, parent: -1, role: assistant, entryType: text, content: "Two."}

  - name: a-malformed-line-keeps-its-gap
    jsonl:
      - '{"type":"assistant","uuid":"a1","message":{"id":"msg_g","role":"assistant","content":[{"type":"thinking","thinking":"plan"}]}}'
      - '{"type":broken}'
      - '{"type":"assistant","uuid":"a2","message":{"id":"msg_g","role":"assistant","content":[{"type":"text","text":"Done."}]}}'
      - '{"type":"user","uuid":"u1","message":{"role":"user","content":"thanks"}}'
    rawBytes: [{entry: 0, line: 0}]
    entries:
      - {index: 0, depth: 0, parent: -1, role: assistant, entryType: text, content: "Done."}
      - {index: 1, depth: 1, parent: 0, role: assistant, entryType: thinking, content: "plan"}
      - {index: 3, depth: 0, parent: -1, role: user, entryType: text, content: "thanks"}
