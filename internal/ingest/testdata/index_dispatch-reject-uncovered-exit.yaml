# This corpus covers each source kind but omits directory input whose provider
# root AND recorded native locator are unavailable. Kind coverage alone cannot
# protect the refusal of an input that capture cannot reconstruct.

requiredNames:
  - an-undeclared-source-kind-is-refused
  - a-file-source-is-handed-the-bytes
  - a-file-source-with-no-bytes-reads-what-was-written
  - a-directory-source-is-never-handed-bytes
cases:
  - name: an-undeclared-source-kind-is-refused
    sourceKind: unknown
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: none
    indexOutcome: error
    errorContains: "unsupported source kind; declare a file or supported native directory source"

  - name: a-file-source-is-handed-the-bytes
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-file-source-with-no-bytes-reads-what-was-written
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: absent
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-directory-source-is-never-handed-bytes
    sourceKind: directory
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: tree
    indexOutcome: indexed
