# Dispatch after capture: file parsers receive exact committed bytes, including
# retained reindex with no extraction bytes. OpenCode directory input uses its
# canonical captured-tree implementation. The successful directory case recovers
# its root from the recorded native locator; the refusal has neither locator nor
# OriginalRoot. Existing case names remain the required regression manifest.
#
# transcriptBytes describes the caller before capture, not the parser argument.
# entryPoint is bytes, tree, or none. Refusals preserve the previous stored index.

requiredNames:
  - an-undeclared-source-kind-is-refused-rather-than-assumed-to-be-a-file
  - a-file-source-is-handed-the-bytes-so-the-second-read-is-really-avoided
  - a-file-source-with-no-bytes-in-hand-reads-what-was-written-instead
  - a-directory-source-is-never-handed-bytes-it-would-have-to-discard
  - a-directory-source-that-lost-its-provider-root-is-refused-not-guessed-at
directoryPreview: Hello from user
lastGoodPreview: previous successfully stored content
cases:
  - name: an-undeclared-source-kind-is-refused-rather-than-assumed-to-be-a-file
    sourceKind: unknown
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: none
    indexOutcome: error
    errorContains: "unsupported source kind; declare a file or supported native directory source"

  - name: a-file-source-is-handed-the-bytes-so-the-second-read-is-really-avoided
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-file-source-with-no-bytes-in-hand-reads-what-was-written-instead
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: absent
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-directory-source-is-never-handed-bytes-it-would-have-to-discard
    sourceKind: directory
    originalRoot: absent
    nativeLocator: present
    transcriptBytes: present
    entryPoint: tree
    indexOutcome: indexed

  - name: a-directory-source-that-lost-its-provider-root-is-refused-not-guessed-at
    sourceKind: directory
    originalRoot: absent
    nativeLocator: absent
    transcriptBytes: present
    entryPoint: none
    indexOutcome: error
    errorContains: valid original locator is unavailable
