# Expectations for the tolerated current control rows case. A well-formed
# current row whose message type is a control record (a model switch, an agent
# switch, an idle marker, or any id-less control row) no longer fails the
# session. A model switch carries its model id onto the following assistant
# turn as a model observation; an id-less unknown control row is skipped and
# named by one diagnostic per type; an interpreted idle marker is skipped with
# no diagnostic unless the settle failed, in which case its failure text renders
# as a system entry; and the user, assistant, and tool rows still materialize.
# required_cases names the cases that must stay present. Removing one goes red
# by name; adding a case need not appear here. The list, not a count, guards.
required_cases:
  - model-and-agent-switch-tolerated
  - idle-marker-tolerated-without-omission
  - idle-failure-text-preserved
  - mixed-unknown-control-reports-only-unknown
  - idle-type-only-failure-renders-type
cases:
  - name: model-and-agent-switch-tolerated
    source_fixture: current-control-rows-tolerated
    session_id: ses_3cd91f52effeXd3QAJ54jCtrl1
    expected_observed_model: gpt-5.5
    expected_tool_name: read
    expected_known_markers: [synthetic control request]
    expected_content_omitted: false
    expected_skipped_control_types:
      - {type: session-title-changed, count: 1}
  - name: idle-marker-tolerated-without-omission
    source_fixture: current-idle-control-tolerated
    session_id: ses_3cd91f52effeXd3QAJ54jIdl1
    expected_observed_model: ""
    expected_tool_name: read
    expected_known_markers: [synthetic idle request]
    expected_content_omitted: false
    expected_ignored_control_types: [idle]
    expected_skipped_control_types: []
  - name: idle-failure-text-preserved
    source_fixture: current-idle-failure-tolerated
    session_id: ses_3cd91f52effeXd3QAJ54jIdl2
    expected_observed_model: ""
    expected_tool_name: read
    expected_known_markers: [SYNTHETIC_PROVIDER_FAILURE_TEXT]
    expected_content_omitted: false
    expected_ignored_control_types: []
    expected_skipped_control_types: []
  - name: mixed-unknown-control-reports-only-unknown
    source_fixture: current-control-mixed-unknown
    session_id: ses_3cd91f52effeXd3QAJ54jIdl3
    expected_observed_model: ""
    expected_known_markers: [synthetic mixed request]
    expected_content_omitted: false
    expected_ignored_control_types: [idle]
    expected_skipped_control_types:
      - {type: session-title-changed, count: 1}
  - name: idle-type-only-failure-renders-type
    source_fixture: current-idle-type-only-failure
    session_id: ses_3cd91f52effeXd3QAJ54jIdl4
    expected_observed_model: ""
    expected_tool_name: ""
    expected_known_markers: [SYNTHETIC_ERROR_TYPE]
    expected_ignored_control_types: []
    expected_skipped_control_types: []
