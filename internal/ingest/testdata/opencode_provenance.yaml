# Typed OpenCode provenance fixture. Every case drives the real provenance row
# decoder, the section 3.2 classifier, and the shared projection builder. The
# rows are sanitized native JSON, never private transcript data.
cases:
  - name: opencode-current-typed-user
    scope:
      sessionId: ses_opencodeCurrentChild
      shape: current
      parentNullProven: true
      hasParent: false
    allocator:
      entries: [e_otext, e_ofile]
      submissions: [s_o]
    rows:
      - id: msg_o_user
        type: user
        seq: 0
        timeCreated: 1000
        timeUpdated: 1000
        data: '{"id":"msg_o_user","type":"user","text":"open the parser","time":{"created":1000},"files":[{"name":"parser.go","uri":"file://parser.go","mime":"text/plain"}]}'
    want:
      own: 1
      turnCount: 2
      titleRefs: [e_otext]
      main:
        - ref: e_otext
          index: 0
          role: user
          entryType: text
          depth: 0
          content: open the parser
          submission: s_o
          origin: submitted_input
          actor: unknown
          delivery: session_admission
          ownership: local
          evidence: native_typed
          modality: text
        - ref: e_ofile
          index: 1
          role: user
          entryType: text
          depth: 0
          content: parser.go
          submission: s_o
          origin: submitted_input
          actor: unknown
          delivery: session_admission
          ownership: local
          evidence: native_typed
          modality: media

  - name: opencode-agent-delivery
    scope:
      sessionId: ses_opencodeCurrentChild
      shape: current
      parentNullProven: false
      hasParent: true
    agentDelivered: true
    allocator:
      entries: [e_otext]
      submissions: []
    rows:
      - id: msg_o_user
        type: user
        seq: 0
        timeCreated: 1000
        timeUpdated: 1000
        data: '{"id":"msg_o_user","type":"user","text":"delegated instruction","time":{"created":1000}}'
    want:
      own: 0
      turnCount: 1
      titleRefs: []
      main:
        - ref: e_otext
          index: 0
          role: user
          entryType: text
          depth: 0
          content: delegated instruction
          origin: submitted_input
          actor: agent_delegate
          delivery: subagent_delivery
          ownership: local
          evidence: native_typed
          modality: text

  - name: opencode-unproved-child-delivery
