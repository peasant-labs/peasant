# Historical-shape controls. These drive the real JSON message/part readers,
# the pinned semantic parsers, the section 3.2 classifier, and the shared
# projection builder. A historical shape proves no typed admission route, so
# delivery stays unknown and no input or title is claimed.
historicalCases:
  - name: opencode-historical-user-and-synthetic
    sessionId: ses_opencodeHistorical
    allocator:
      entries: [e_hist, e_hist_syn]
      submissions: []
    messages:
      - id: hist_msg_a_user
        data: '{"id":"hist_msg_a_user","role":"user","time":{"created":1000}}'
        parts:
          - id: prt_hist_a_text
            data: '{"id":"prt_hist_a_text","messageID":"hist_msg_a_user","type":"text","text":"historical user text","time":{"created":1000}}'
      - id: hist_msg_b_synth
        data: '{"id":"hist_msg_b_synth","role":"user","time":{"created":1001}}'
        parts:
          - id: prt_hist_b_syn
            data: '{"id":"prt_hist_b_syn","messageID":"hist_msg_b_synth","type":"text","synthetic":true,"text":"injected harness note","time":{"created":1001}}'
    want:
      own: 0
      turnCount: 2
      titleRefs: []
      main:
        - ref: e_hist
          index: 0
          role: user
          entryType: text
          depth: 0
          content: historical user text
          origin: submitted_input
          actor: unknown
          delivery: unknown
          ownership: local
          evidence: existing_adapter
          modality: text
        - ref: e_hist_syn
          index: 1
          role: system
          entryType: system
          depth: 0
          content: injected harness note
          origin: harness_context
          actor: harness
          delivery: system_lifecycle
          ownership: local
          evidence: existing_adapter
          modality: text
