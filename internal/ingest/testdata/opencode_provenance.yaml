  - name: opencode-synthetic-system-skill-shell-compaction
    scope:
      sessionId: ses_opencodeCurrentChild
      shape: current
      parentNullProven: true
      hasParent: false
    allocator:
      entries: [e_osyn, e_osys, e_oskill, e_oshell, e_oshellout, e_ocompact]
      submissions: [s_oshell]
    rows:
      - id: msg_o_syn
        type: synthetic
        seq: 0
        timeCreated: 1000
        timeUpdated: 1000
        data: '{"id":"msg_o_syn","type":"synthetic","text":"injected harness note","time":{"created":1000}}'
      - id: msg_o_sys
        type: system
        seq: 1
        timeCreated: 1001
        timeUpdated: 1001
        data: '{"id":"msg_o_sys","type":"system","text":"system rule","time":{"created":1001}}'
      - id: msg_o_skill
        type: skill
        seq: 2
        timeCreated: 1002
