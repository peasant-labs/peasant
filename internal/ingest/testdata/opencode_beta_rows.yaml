# Shapes from public beta commit 52685d451777fbccc99736ab31ffc37de8475a45,
# packages/schema/src/{session-message,prompt,tool,shell,session-error}.ts.
required_names:
  - beta_tool_streaming
  - beta_tool_running
  - beta_tool_completed
  - beta_tool_error
  - beta_assistant_provider_state_and_retry
  - beta_user_attachments_and_skills
  - beta_shell_output_page
  - beta_synthetic_without_session_id
  - beta_system_description
  - beta_compaction_running
  - beta_compaction_completed
  - beta_compaction_failed
  - beta_skill_message
  - beta_file_attachment_visible
  - beta_running_tool_rejects_completed_fields
  - beta_completed_tool_rejects_empty_content
  - beta_error_tool_requires_error
  - beta_streaming_tool_rejects_object_input
  - beta_running_tool_rejects_missing_metadata
  - beta_shell_rejects_mixed_identity
  - beta_compaction_failed_rejects_summary
  - beta_file_rejects_invalid_base64
  - beta_retry_requires_error
  - beta_skill_attachment_requires_id
  - beta_shell_running_keeps_partial_output
  - beta_tool_error_text_output
  - beta_tool_mixed_output_stays_structured
  - beta_tool_text_fragments_preserve_boundaries
  - historical_tool_empty_completion
normalization_cases:
  - name: beta_tool_streaming
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_stream","name":"read","state":{"status":"streaming","input":"partial input"},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: partial input
  - name: beta_tool_running
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_run","name":"read","executed":false,"providerState":{"provider":{"key":"value"}},"state":{"status":"running","input":{"path":"running input"},"metadata":{"title":"reading"}},"time":{"created":1000,"ran":1500}}],"time":{"created":1000}}'}]
    expected_text: running input
    expected_managed: ['"structured":{"title":"reading"}']
  - name: beta_tool_completed
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_done","name":"read","providerResultState":{"provider":{"key":"value"}},"state":{"status":"completed","input":{},"content":[{"type":"text","text":"native completed output"}],"metadata":{"title":"read"}},"time":{"created":1000,"completed":2000}}],"time":{"created":1000,"completed":2000}}'}]
    expected_text: native completed output
    expected_tool_output: native completed output
  - name: beta_tool_error
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_error","name":"read","state":{"status":"error","input":{},"error":{"type":"permission","message":"native error message","status":403}},"time":{"created":1000,"completed":2000}}],"time":{"created":1000}}'}]
    expected_text: native error message
  - name: beta_assistant_provider_state_and_retry
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"providerState":{"provider":{"key":"value"}},"retry":{"attempt":1,"at":2000,"error":{"type":"rate_limit","message":"retry later","status":429}},"content":[{"type":"text","text":"native response","state":{"provider":{"key":"value"}}},{"type":"reasoning","text":"native reasoning","state":{"provider":{"key":"value"}},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: native response
    forbidden_managed: [providerState, '"state":{"provider"']
  - name: beta_user_attachments_and_skills
    rows: [{id: msg_beta, row_type: user, data: '{"text":"native attachments","files":[{"data":"aGk=","mime":"text/plain","source":{"type":"inline"},"name":"note.txt","mention":{"start":0,"end":4,"text":"note"}}],"agents":[{"name":"build","mention":{"start":0,"end":5,"text":"build"}}],"skills":[{"id":"skill_review","name":"review","text":"review instructions"}],"time":{"created":1000}}'}]
    expected_text: review instructions
  - name: beta_shell_output_page
    rows: [{id: msg_beta, row_type: shell, data: '{"shellID":"sh_native","command":"pwd","status":"exited","exit":0,"output":{"output":"native shell page","cursor":17,"size":17,"truncated":false},"time":{"created":1000,"completed":2000}}'}]
    expected_text: native shell page
  - name: beta_synthetic_without_session_id
    rows: [{id: msg_beta, row_type: synthetic, data: '{"text":"native synthetic text","description":"synthetic description","time":{"created":1000}}'}]
    expected_text: native synthetic text
  - name: beta_system_description
    rows: [{id: msg_beta, row_type: system, data: '{"text":"native system text","description":"system description","time":{"created":1000}}'}]
    expected_text: native system text
  - name: beta_compaction_running
    rows: [{id: msg_beta, row_type: compaction, data: '{"status":"running","reason":"auto","summary":"native running summary","recent":"recent context","time":{"created":1000}}'}]
    expected_text: native running summary
  - name: beta_compaction_completed
    rows: [{id: msg_beta, row_type: compaction, data: '{"status":"completed","reason":"manual","model":{"id":"model","providerID":"provider"},"providerState":{"provider":{}},"summary":"native completed summary","recent":"recent context","time":{"created":1000}}'}]
    expected_text: native completed summary
  - name: beta_compaction_failed
    rows: [{id: msg_beta, row_type: compaction, data: '{"status":"failed","reason":"auto","error":{"type":"rate_limit","message":"native compaction error","status":429},"time":{"created":1000}}'}]
    expected_text: native compaction error
    forbidden_managed: ['"type":"compaction"']
  - name: beta_skill_message
    rows: [{id: msg_beta, row_type: skill, data: '{"skill":"skill_review","name":"review","text":"native skill context","time":{"created":1000}}'}]
    expected_text: native skill context
  - name: beta_file_attachment_visible
    rows: [{id: msg_beta, row_type: user, data: '{"text":"request","files":[{"data":"aGk=","mime":"text/plain","source":{"type":"inline"},"name":"native-file.txt"}],"time":{"created":1000}}'}]
    expected_text: native-file.txt
    forbidden_managed: [aGk=]
  - name: beta_running_tool_rejects_completed_fields
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_run","name":"read","state":{"status":"running","input":{},"metadata":{},"content":[{"type":"text","text":"output"}]},"time":{"created":1000}}],"time":{"created":1000}}'}]
    error_contains: unknown field "content"
  - name: beta_completed_tool_rejects_empty_content
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_done","name":"read","state":{"status":"completed","input":{},"content":[]},"time":{"created":1000}}],"time":{"created":1000}}'}]
    error_contains: nonempty content
  - name: beta_error_tool_requires_error
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_error","name":"read","state":{"status":"error","input":{}},"time":{"created":1000}}],"time":{"created":1000}}'}]
    error_contains: requires object input and error
  - name: beta_streaming_tool_rejects_object_input
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_stream","name":"read","state":{"status":"streaming","input":{}},"time":{"created":1000}}],"time":{"created":1000}}'}]
    error_contains: cannot unmarshal object
  - name: beta_running_tool_rejects_missing_metadata
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_run","name":"read","state":{"status":"running","input":{}},"time":{"created":1000}}],"time":{"created":1000}}'}]
    error_contains: requires object input and metadata
  - name: beta_shell_rejects_mixed_identity
    rows: [{id: msg_beta, row_type: shell, data: '{"shellID":"sh_native","callID":"call_other","command":"pwd","status":"running","time":{"created":1000}}'}]
    error_contains: unknown field "callID"
  - name: beta_compaction_failed_rejects_summary
    rows: [{id: msg_beta, row_type: compaction, data: '{"status":"failed","reason":"auto","summary":"false summary","error":{"type":"error","message":"failure"},"time":{"created":1000}}'}]
    error_contains: cannot carry summary
  - name: beta_file_rejects_invalid_base64
    rows: [{id: msg_beta, row_type: user, data: '{"text":"request","files":[{"data":"not base64!","mime":"text/plain","source":{"type":"inline"}}],"time":{"created":1000}}'}]
    error_contains: data is not base64
  - name: beta_retry_requires_error
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"retry":{"attempt":1,"at":1000},"content":[],"time":{"created":1000}}'}]
    error_contains: required upstream field "error" is absent
  - name: beta_skill_attachment_requires_id
    rows: [{id: msg_beta, row_type: user, data: '{"text":"request","skills":[{"name":"review"}],"time":{"created":1000}}'}]
    error_contains: skill attachment requires id and name
  - name: beta_shell_running_keeps_partial_output
    rows: [{id: msg_beta, row_type: shell, data: '{"shellID":"sh_native","command":"pwd","status":"running","output":{"output":"native partial output","cursor":21,"size":21,"truncated":false},"time":{"created":1000}}'}]
    expected_text: native partial output
    expected_managed: ['"status":"running"']
    forbidden_managed: ['"status":"completed"']
  - name: beta_tool_error_text_output
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_error","name":"read","state":{"status":"error","input":{},"content":[{"type":"text","text":"partial "},{"type":"text","text":"output"}],"error":{"type":"failure","message":"tool failed"}},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: tool failed
    expected_tool_output: '{"type":"failure","message":"tool failed"}'
  - name: beta_tool_mixed_output_stays_structured
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_done","name":"read","state":{"status":"completed","input":{},"content":[{"type":"text","text":"output file"},{"type":"file","uri":"file:///synthetic/result","mime":"text/plain"}]},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: output file
    expected_tool_output: '[{"type":"text","text":"output file"},{"type":"file","uri":"file:///synthetic/result","mime":"text/plain"}]'
  - name: beta_tool_text_fragments_preserve_boundaries
    rows: [{id: msg_beta, row_type: assistant, data: '{"agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_done","name":"read","state":{"status":"completed","input":{},"content":[{"type":"text","text":"first "},{"type":"text","text":"second"}]},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: first second
    expected_tool_output: first second
  - name: historical_tool_empty_completion
    rows: [{id: msg_beta, row_type: assistant, data: '{"id":"msg_beta","agent":"build","model":{"id":"model","providerID":"provider"},"content":[{"type":"tool","id":"call_done","name":"read","state":{"status":"completed","input":{"path":"historical request"},"structured":{},"content":[]},"time":{"created":1000}}],"time":{"created":1000}}'}]
    expected_text: historical request
    expected_tool_output: '[]'
