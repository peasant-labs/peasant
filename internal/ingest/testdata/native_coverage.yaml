# Native coverage matrix (PROPOSAL-3 sections 5.2 native + 5.3 + 5.5 read split).
#
# Each case independently specifies completeness, retained carriers, prior
# authority, and Main/Earlier distribution. The test builds a real V2
# candidate with valid positions/payloads, activates through the real store,
# and asserts authority (active generation, prior preservation) AND
# per-invocation counts (CommittedNow once, AlreadyCommitted/NotCommitted
# zero) plus actual export verdicts (real ExportSession success/failure and
# byte stability), never readiness alone. Expected payloads originate here.
required_names:
  - complete-zero-carriers
  - complete-nonzero-carriers
  - incomplete-zero-carriers
  - incomplete-nonzero-carriers
  - first-discovery-preview
  - prior-full-preserved
  - main-and-earlier-one-set
  - main-and-earlier-duplicate-refused
  - forged-full-refused
  - complete-source-omitted-accounted
  - complete-source-omitted-unaccounted
cases:
  - name: complete-zero-carriers
    completeness: complete
    carriers:
      []
    prior: none
    want_disposition: committed_now
    want_occurrences: 0
    want_export: success
    want_full_read: success
    want_failure_code: ""
  - name: complete-nonzero-carriers
    completeness: complete
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-complete-nonzero
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":1}'
    prior: none
    want_disposition: committed_now
    want_occurrences: 1
    want_export: success
    want_full_read: success
    want_failure_code: unknown_data_retained
  - name: incomplete-zero-carriers
    completeness: incomplete_new
    carriers:
      []
    prior: none
    want_disposition: committed_now
    want_occurrences: 0
    want_export: refused
    want_full_read: refused
    want_failure_code: ""
  - name: incomplete-nonzero-carriers
    completeness: incomplete_new
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-incomplete-nonzero
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":2}'
    prior: none
    want_disposition: committed_now
    want_occurrences: 0
    want_export: refused
    want_full_read: refused
    want_failure_code: ""
  - name: first-discovery-preview
    completeness: incomplete_new
    carriers:
      - partition: main
        namespace: envelope
        kind: future
        source_ref: src-first-discovery
        record_index: 1
        position: 1
        pointer: ""
        payload: '{"type":"future","value":3}'
    prior: none
    want_disposition: committed_now
    want_occurrences: 0
    want_export: refused
    want_full_read: refused
    want_failure_code: ""
  - name: prior-full-preserved
    completeness: incomplete_new
    carriers:
      - partition: main
        namespace: envelope
        kind: future
        source_ref: src-prior-full
        record_index: 1
        position: 1
        pointer: ""
        payload: '{"type":"future","value":4}'
    prior: full
    want_disposition: not_committed
    want_occurrences: 0
    want_export: prior_preserved
    want_full_read: success
    want_failure_code: ""
  - name: main-and-earlier-one-set
    completeness: complete
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-one-set
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":5}'
      - partition: earlier
        namespace: envelope
        kind: future
        source_ref: src-one-set
        record_index: 5
        position: 9
        pointer: ""
        payload: '{"type":"future","value":6}'
    prior: none
    want_disposition: committed_now
    want_occurrences: 2
    want_export: success
    want_full_read: success
    want_failure_code: unknown_data_retained
  - name: main-and-earlier-duplicate-refused
    completeness: complete
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-duplicate
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":8}'
      - partition: earlier
        namespace: envelope
        kind: future
        source_ref: src-duplicate
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":8}'
    prior: none
    want_disposition: not_committed
    want_occurrences: 0
    want_export: refused
    want_full_read: refused
    want_failure_code: ""
  - name: forged-full-refused
    completeness: incomplete_new
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-forged-full
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":7}'
    prior: none
    forged_full: true
    want_disposition: not_committed
    want_occurrences: 0
    want_export: refused
    want_full_read: refused
    want_failure_code: ""
  # Source-omitted native rows (spec section 10: accounted/unaccounted cause).
  # Both stay preview with refused export: the omission placeholder
  # discriminator (outputRecordsItsOmissions) is V1-only by design, so a
  # native omission never reaches accounted full certification here — the
  # pipeline derives unaccounted from ContentOmitted for the same reason, and
  # placeholder-accounted fullossification stays V1-lane owned. These rows pin
  # the assessed failure-code distinction at the native scope.
  - name: complete-source-omitted-accounted
    completeness: complete
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-omitted-accounted
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":10}'
    prior: none
    source_omitted: true
    unaccounted: false
    want_disposition: committed_now
    want_occurrences: 1
    want_export: success
    want_full_read: refused
    want_failure_code: source_records_omitted
  - name: complete-source-omitted-unaccounted
    completeness: complete
    carriers:
      - partition: main
        namespace: message_block
        kind: future
        source_ref: src-omitted-unaccounted
        record_index: 3
        position: 5
        pointer: /payload/content/1
        payload: '{"type":"future","value":11}'
    prior: none
    source_omitted: true
    unaccounted: true
    want_disposition: committed_now
    want_occurrences: 1
    want_export: success
    want_full_read: refused
    want_failure_code: strict_capture_refused
