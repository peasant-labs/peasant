# What the OpenCode managed-projection readers refuse, and what they must read.
#
# The path a reader opens must hold the Peasant-owned projection, never the
# provider's own SQLite database: that database can be gigabytes, and loading it
# would end the process. A database announces itself in its first bytes, so the
# readers identify one by CONTENT and refuse it without reading it.
#
# Size decides nothing. A long OpenCode session legitimately produces a large
# projection, and refusing it would fail the whole session, so the case that
# sizes a file past the old bound must be READ.
#
# size = OpenCodeManagedProjectionMaxBytes + offset_from_bound, presented
# through a filesystem double, so no real large file is written.
# required_cases names the cases that must stay present; the list, not a count.
required_cases:
  - a_projection_past_the_old_bound_is_read
  - a_projection_far_past_the_old_bound_is_read
  - a_within_bound_projection_is_read
  - a_provider_database_is_refused_without_being_read
cases:
  - name: a_projection_past_the_old_bound_is_read
    origin: opencode-legacy-sqlite
    offset_from_bound: 1
    outcome: read
  - name: a_projection_far_past_the_old_bound_is_read
    origin: opencode-current-sqlite
    offset_from_bound: 1073741824
    outcome: read
  - name: a_within_bound_projection_is_read
    origin: opencode-current-sqlite
    offset_from_bound: -1048576
    outcome: read
  # The header alone identifies it, so the case is sized well under the old
  # bound: a database is refused for what it is, not for how big it happens
  # to be.
  - name: a_provider_database_is_refused_without_being_read
    origin: opencode-legacy-sqlite
    offset_from_bound: -1048576
    sqlite_header: true
    outcome: refused-as-provider-database
