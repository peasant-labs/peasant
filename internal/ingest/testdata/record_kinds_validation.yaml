required_names:
  - trailing YAML document rejected
  - unknown YAML field rejected
  - unknown status rejected
  - unknown preview rejected
  - unknown visualized rejected
  - unknown context rejected
  - unknown match rejected
  - duplicate kind rejected
  - same name different namespace accepted
  - overlapping prefix rejected
  - rendered without renderer rejected
  - ignored without reason rejected
  - missing supported harness rejected
  - unsupported adapter rejected
  - wrong baseline revision rejected
  - wrong native revision rejected
  - handler addition fails without row
  - handler removal fails while referenced
  - row removal fails while handled
  - status mutation fails production witness
  - preview mutation fails production witness
  - tracked control production witness
  - represented control production witness
  - arbitrary unseen record retains
  - arbitrary unseen block retains
  - retained media uses fallback
  - native media is specialized
  - diagnostic-only attribution remains represented
  - prefix family is explicit
cases:
  - {name: trailing YAML document rejected, operation: trailing, error: one YAML document}
  - {name: unknown YAML field rejected, operation: yaml, find: 'version: 2', replace: 'versoin: 2', error: field versoin}
  - {name: unknown status rejected, operation: yaml, find: 'status: represented', replace: 'status: representd', error: unknown status}
  - {name: unknown preview rejected, operation: yaml, find: 'preview: yes', replace: 'preview: maybe', error: unknown preview}
  - {name: unknown visualized rejected, operation: yaml, find: 'visualized: hidden', replace: 'visualized: hiddden', error: unknown visualization}
  - {name: unknown context rejected, operation: yaml, find: 'context: retained-format-1', replace: 'context: imaginary', error: unknown context}
  - {name: unknown match rejected, operation: yaml, find: 'match: prefix', replace: 'match: regexp', error: unknown match}
  - {name: duplicate kind rejected, operation: yaml, find: '{<<: *text, kind: assistant}', replace: '{<<: *text, kind: user}', error: duplicate kind}
  - {name: same name different namespace accepted, operation: yaml, find: '{<<: *text, kind: api_error}', replace: '{<<: *text, kind: user}'}
  - {name: overlapping prefix rejected, operation: yaml, find: '{<<: *control, kind: artifact-, match: prefix}', replace: '{<<: *control, kind: agent-, match: prefix}', error: ambiguous overlapping match}
  - {name: rendered without renderer rejected, operation: yaml, find: 'renderer: internal/transcript EntriesToTurns text projection and fairtrade TranscriptViewer', replace: 'renderer: ""', error: requires a renderer}
  - {name: ignored without reason rejected, operation: yaml, find: 'reason: Entryless control; unexpected conversation content remains a validation error.', replace: 'reason: ""', error: requires a reason}
  - {name: missing supported harness rejected, operation: yaml, find: '  pi:', replace: '  gemini-cli:', error: 'has no section'}
  - {name: unsupported adapter rejected, operation: yaml, find: 'harnesses:', replace: "harnesses:\n  gemini-cli: {}", error: no supported adapter}
  - {name: wrong baseline revision rejected, operation: yaml, find: 'indexer_version: 17', replace: 'indexer_version: 999', error: baseline versions differ}
  - {name: wrong native revision rejected, operation: yaml, find: 'native_versions: {adapter_version: 2, indexer_version: 17', replace: 'native_versions: {adapter_version: 2, indexer_version: 999', error: native versions differ}
  - name: handler addition fails without row
    operation: source
    file: content_capture.go
    find: 'case "summary":'
    replace: 'case "summary", "new_summary_handler":'
    error: has no registry row
  - name: handler removal fails while referenced
    operation: source
    file: pi_source.go
    find: 'case string(piLabel):'
    replace: 'case "retired_label":'
    error: is not matched by production syntax
  - {name: row removal fails while handled, operation: delete-row, harness: pi, context: retained-format-1, namespace: entry, kind: label, error: has no registry row}
  - {name: status mutation fails production witness, operation: mutate-status, harness: claude-code, context: retained-format-1, namespace: record, kind: attachment, status: represented, error: control behavior differs}
  - {name: preview mutation fails production witness, operation: mutate-preview, harness: claude-code, context: retained-format-1, namespace: record, kind: mode, preview: no, error: control behavior differs}
  - {name: tracked control production witness, operation: behavior, harness: claude-code, context: retained-format-1, namespace: record, kind: attachment}
  - {name: represented control production witness, operation: behavior, harness: claude-code, context: retained-format-1, namespace: system_subtype, kind: compact_boundary}
  - {name: arbitrary unseen record retains, operation: lookup, harness: pi, context: retained-format-1, namespace: entry, kind: novel_unlisted_kind, status: retained-unknown, preview: no}
  - {name: arbitrary unseen block retains, operation: lookup, harness: pi, context: retained-format-1, namespace: content_block, kind: novel_unlisted_kind, status: retained-unknown, preview: no}
  - {name: retained media uses fallback, operation: lookup, harness: codex, context: retained-format-1, namespace: message_block, kind: input_image, status: retained-unknown, preview: no}
  - {name: native media is specialized, operation: lookup, harness: codex, context: native-generation, namespace: message_block, kind: input_image, status: represented, preview: yes}
  - {name: diagnostic-only attribution remains represented, operation: diagnostic, harness: codex, context: native-generation, namespace: content_kind, kind: images.unsupported}
  - {name: prefix family is explicit, operation: lookup, harness: claude-code, context: retained-format-1, namespace: record, kind: artifact-new-family-member, status: represented, preview: yes}
