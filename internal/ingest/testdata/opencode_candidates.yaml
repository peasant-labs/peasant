required_resolution_cases:
  - production-channel
  - local-channel
  - sanitized-channel
  - disabled-channel
  - disable-flag-is-upstream-case-sensitive
  - relative-override-deduplicates-default
  - absolute-override-precedes-default
  - memory-override-is-preserved-as-evidence-only
resolution_cases:
  - name: production-channel
    channel: prod
    environment: {}
    paths: [opencode.db, .]
    provenance: [channel_database, legacy_json_root]
  - name: local-channel
    channel: local
    environment: {}
    paths: [opencode-local.db, .]
    provenance: [channel_database, legacy_json_root]
  - name: sanitized-channel
    channel: dev/feature@
    environment: {}
    paths: [opencode-dev-feature-.db, .]
    provenance: [channel_database, legacy_json_root]
  - name: disabled-channel
    channel: nightly
    environment:
      OPENCODE_DISABLE_CHANNEL_DB: "true"
    paths: [opencode.db, .]
    provenance: [channel_database, legacy_json_root]
  - name: disable-flag-is-upstream-case-sensitive
    channel: nightly
    environment:
      OPENCODE_DISABLE_CHANNEL_DB: "TRUE"
    paths: [opencode-nightly.db, .]
    provenance: [channel_database, legacy_json_root]
  - name: relative-override-deduplicates-default
    channel: latest
    environment:
      OPENCODE_DB: opencode.db
    paths: [opencode.db, .]
    provenance: [environment_override, legacy_json_root]
  - name: absolute-override-precedes-default
    channel: beta
    environment:
      OPENCODE_DB: /synthetic/../override.db
    paths: [/synthetic/../override.db, opencode.db, .]
    provenance: [environment_override, channel_database, legacy_json_root]
  - name: memory-override-is-preserved-as-evidence-only
    channel: latest
    environment:
      OPENCODE_DB: ":memory:"
    paths: [":memory:", opencode.db, .]
    provenance: [environment_override, channel_database, legacy_json_root]

required_probe_fixtures:
  - empty-valid
  - legacy-message-part
  - current-session-message
  - hybrid-catalog
  - current-missing-seq
  - current-nullable-seq
  - unsupported-schema
  - corrupt-non-sqlite
  - wal-capable
  - catalog-table-overflow
  - catalog-column-overflow
  - catalog-index-overflow
  - current-partial-ordering-index
# The session table is guarded by an explicit allowlist of readable columns
# (readable_session_columns below), not by a per-column denylist. The shape and
# foreign-table tokens here still fail closed for every statement: no wildcard
# projection, no offset pagination, no set operation, and no read of another
# table's history or payload columns. The session-statistics read projects
# tokens_input, so a bare "input" token would reject a legitimate column, and
# the change-cursor reads project event_sequence and a payload-free MAX(seq)
# aggregate over event, so a bare "event" token would reject them too. The exact
# statement allowlist plus the per-column allowlist, not a coarse substring, is
# what keeps the event stream's data and type payload columns unreadable.
forbidden_query_tokens:
  - "select *"
  - " offset "
  - delta
  - context
  - migration
  - attach
  - payload
  - " union "
# readable_session_columns is the exact allowlist of session-table columns a
# read-only source statement may project. It carries the attribution keys the
# discovery read needs (id, parent_id, time_updated, time_created, directory,
# title) together with the attribution, statistics, identity, and change columns
# the record read carries without folding entries: agent labels a subagent
# session, the token columns and cost fill the session statistics, version fills
# the harness version, slug is the display-name fallback, and revert exposes the
# revert marker directly. Every other session column, including share_url,
# summary, metadata, permission, model, path, workspace_id, time_archived, and
# time_compacting, stays unreadable: a statement that reads FROM the session
# table and names a column outside this set is rejected.
readable_session_columns:
  - id
  - parent_id
  - time_updated
  - time_created
  - directory
  - title
  - agent
  - tokens_input
  - tokens_output
  - tokens_reasoning
  - tokens_cache_read
  - tokens_cache_write
  - cost
  - version
  - slug
  - revert
required_session_column_mutations:
  - reject-forbidden-session-projection
session_column_mutations:
  - name: reject-forbidden-session-projection
    statement: 'select id, parent_id, time_updated, share_url from session order by id limit ?1'
    forbidden_column: share_url
# readable_table_columns extends the fail-closed allowlist to the project,
# project_directory, workspace, and event_sequence tables. Each row is the exact
# set of columns a read-only source statement may project FROM that table; a
# statement that reads the table and names a column outside its set is rejected,
# so every new read fails closed on an unlisted column. The event table itself
# stays payload-unreadable: only a MAX(seq) aggregate over it is allowed, wired
# in the change-cursor read, and its data and type columns are never projected.
readable_table_columns:
  - table: project
    columns: [id, worktree, vcs, name]
  - table: project_directory
    columns: [project_id, directory, type]
  - table: workspace
    columns: [id, type, name, branch, directory, extra, project_id, time_used]
  - table: event_sequence
    columns: [aggregate_id, seq, owner_id]
required_table_column_mutations:
  - reject-forbidden-project-projection
  - reject-forbidden-project-directory-projection
  - reject-forbidden-workspace-projection
  - reject-forbidden-event-sequence-projection
table_column_mutations:
  - name: reject-forbidden-project-projection
    table: project
    statement: 'select id, worktree, name, sandboxes from project order by id limit ?1'
    forbidden_column: sandboxes
  - name: reject-forbidden-project-directory-projection
    table: project_directory
    statement: 'select project_id, directory, type, strategy from project_directory order by project_id limit ?1'
    forbidden_column: strategy
  - name: reject-forbidden-workspace-projection
    table: workspace
    statement: 'select id, type, name, time_created from workspace order by id limit ?1'
    forbidden_column: time_created
  - name: reject-forbidden-event-sequence-projection
    table: event_sequence
    statement: 'select aggregate_id, seq, data from event_sequence order by aggregate_id limit ?1'
    forbidden_column: data
allowed_query_statements:
  - name: current-substantive-probe
    statement: "select 1 from session_message where session_id = ?1 and type not in ('agent-switched', 'model-switched') limit 1"
  - name: enable-query-only
    statement: "pragma query_only=on"
  - name: read-query-only
    statement: "pragma query_only"
  - name: catalog-tables
    statement: "select name from sqlite_schema where type = 'table' order by name limit 257"
  - name: catalog-columns
    statement: 'select name, "notnull", pk from pragma_table_info(?1) order by cid limit 33'
  - name: catalog-indexes
    statement: 'select il.name, il."unique", il.partial, xi.seqno, xi.cid, xi.name, xi.desc, xi.coll, xi.key from pragma_index_list(?1) as il join pragma_index_xinfo(il.name) as xi order by il.name, xi.seqno limit 65'
  - name: legacy-sessions-first
    statement: 'select distinct session_id from message order by session_id limit ?1'
  - name: legacy-sessions-after
    statement: 'select distinct session_id from message where session_id > ?1 order by session_id limit ?2'
  - name: legacy-messages-first
    statement: 'select id, session_id, time_created, time_updated, data from message where session_id = ?1 order by time_created, id limit ?2'
  - name: legacy-messages-after
    statement: 'select id, session_id, time_created, time_updated, data from message where session_id = ?1 and (time_created > ?2 or (time_created = ?2 and id > ?3)) order by time_created, id limit ?4'
  - name: current-sessions-first
    statement: 'select distinct session_id from session_message order by session_id limit ?1'
  - name: current-sessions-after
    statement: 'select distinct session_id from session_message where session_id > ?1 order by session_id limit ?2'
  - name: current-messages-first
    statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 order by seq limit ?2'
  - name: current-messages-after
    statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 and seq > ?2 order by seq limit ?3'
  - name: legacy-message-freshness-by-session
    statement: 'select session_id, max(max(time_created, time_updated)) from message group by session_id'
  - name: legacy-part-freshness-by-session
    statement: 'select session_id, max(max(time_created, time_updated)) from part group by session_id'
  - name: current-freshness-by-session
    statement: 'select session_id, max(max(time_created, time_updated)) from session_message group by session_id'
  - name: session-records-first
    statement: 'select id, parent_id, time_updated from session order by id limit ?1'
  - name: session-records-after
    statement: 'select id, parent_id, time_updated from session where id > ?1 order by id limit ?2'
  - name: session-attribution-first
    statement: 'select id, parent_id, time_updated, directory, title, time_created from session order by id limit ?1'
  - name: session-attribution-after
    statement: 'select id, parent_id, time_updated, directory, title, time_created from session where id > ?1 order by id limit ?2'
  - name: session-extended-first
    statement: 'select id, parent_id, time_updated, directory, title, time_created, agent, tokens_input, tokens_output, tokens_reasoning, tokens_cache_read, tokens_cache_write, cost, version, slug, revert from session order by id limit ?1'
  - name: session-extended-after
    statement: 'select id, parent_id, time_updated, directory, title, time_created, agent, tokens_input, tokens_output, tokens_reasoning, tokens_cache_read, tokens_cache_write, cost, version, slug, revert from session where id > ?1 order by id limit ?2'
  - name: event-sequence-first
    statement: 'select aggregate_id, seq from event_sequence order by aggregate_id limit ?1'
  - name: event-sequence-after
    statement: 'select aggregate_id, seq from event_sequence where aggregate_id > ?1 order by aggregate_id limit ?2'
  - name: event-max-seq
    statement: 'select max(seq) from event where aggregate_id = ?1'
  - name: project-first
    statement: 'select id, worktree, vcs, name from project order by id limit ?1'
  - name: project-after
    statement: 'select id, worktree, vcs, name from project where id > ?1 order by id limit ?2'
  - name: project-directory-first
    statement: 'select project_id, directory, type from project_directory order by project_id, directory limit ?1'
  - name: project-directory-after
    statement: 'select project_id, directory, type from project_directory where project_id > ?1 or (project_id = ?1 and directory > ?2) order by project_id, directory limit ?3'
  - name: session-parents-first
    statement: 'select id, parent_id from session order by id limit ?1'
  - name: session-parents-after
    statement: 'select id, parent_id from session where id > ?1 order by id limit ?2'
  - name: session-clock-first
    statement: 'select id, time_updated from session order by id limit ?1'
  - name: session-clock-after
    statement: 'select id, time_updated from session where id > ?1 order by id limit ?2'
  - name: legacy-session-parts-first
    statement: 'select id, message_id, session_id, time_created, time_updated, data from part where session_id = ?1 order by id limit ?2'
  - name: legacy-session-parts-after
    statement: 'select id, message_id, session_id, time_created, time_updated, data from part where session_id = ?1 and id > ?2 order by id limit ?3'
required_query_guard_mutations:
  - payload-table-scope
  - keyset-predicate
  - canonical-order
  - bound-parameter
  - forbidden-history
  - generic-offset-escape
  - current-unscoped-scan
  - current-session-enumeration-offset
  - current-session-enumeration-history
  - current-offset-pagination
  - current-timestamp-order
  - current-wildcard-projection
query_guard_mutations:
  - name: payload-table-scope
    replace_statement: 'select id, session_id, time_created, time_updated, data from message where session_id = ?1 order by time_created, id limit ?2'
    replacement_statement: 'select id, session_id, time_created, time_updated, data from session_message where session_id = ?1 order by time_created, id limit ?2'
  - name: keyset-predicate
    replace_statement: 'select id, session_id, time_created, time_updated, data from message where session_id = ?1 and (time_created > ?2 or (time_created = ?2 and id > ?3)) order by time_created, id limit ?4'
    replacement_statement: 'select id, session_id, time_created, time_updated, data from message where session_id = ?1 order by time_created, id limit ?4'
  - name: canonical-order
    replace_statement: 'select id, message_id, session_id, time_created, time_updated, data from part where session_id = ?1 order by id limit ?2'
    replacement_statement: 'select id, message_id, session_id, time_created, time_updated, data from part where session_id = ?1 order by time_created limit ?2'
  - name: bound-parameter
    replace_statement: 'select distinct session_id from message order by session_id limit ?1'
    replacement_statement: 'select distinct session_id from message order by session_id limit 129'
  - name: forbidden-history
    replace_statement: 'select id, message_id, session_id, time_created, time_updated, data from part where session_id = ?1 and id > ?2 order by id limit ?3'
    replacement_statement: 'select id, stable_id, session_id, time_created, time_created, data from event where session_id = ?1 and id > ?2 order by id limit ?3'
  - name: generic-offset-escape
    replace_statement: 'select distinct session_id from message where session_id > ?1 order by session_id limit ?2'
    replacement_statement: 'select distinct session_id from message order by session_id limit ?2 offset ?1'
  - name: current-unscoped-scan
    replace_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 order by seq limit ?2'
    replacement_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message order by seq limit ?2'
  - name: current-session-enumeration-offset
    replace_statement: 'select distinct session_id from session_message where session_id > ?1 order by session_id limit ?2'
    replacement_statement: 'select distinct session_id from session_message order by session_id limit ?2 offset ?1'
  - name: current-session-enumeration-history
    replace_statement: 'select distinct session_id from session_message order by session_id limit ?1'
    replacement_statement: 'select distinct session_id from event order by session_id limit ?1'
  - name: current-offset-pagination
    replace_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 and seq > ?2 order by seq limit ?3'
    replacement_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 order by seq limit ?3 offset ?2'
  - name: current-timestamp-order
    replace_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 order by seq limit ?2'
    replacement_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 order by time_created limit ?2'
  - name: current-wildcard-projection
    replace_statement: 'select id, session_id, type, time_created, time_updated, data, seq from session_message where session_id = ?1 and seq > ?2 order by seq limit ?3'
    replacement_statement: 'select * from session_message where session_id = ?1 and seq > ?2 order by seq limit ?3'
