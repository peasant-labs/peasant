requiredNames:
  - completed-empty-cursor
  - completed-empty-strike
  - mixed-malformed-cursor-preserves-last-good
  - mixed-malformed-strike-preserves-last-good
  - legacy-v1-result
  - versioned-v1-result
  - completed-empty-v1
  - legacy-empty-preserves-last-good
  - malformed-claude-preserves-last-good
  - completed-empty-claude
  - completed-empty-codex
  - mixed-malformed-claude-preserves-last-good
  - mixed-malformed-codex-preserves-last-good
  - missing-opencode-tree-preserves-last-good
  - parse-error-preserves-last-good
  - absent-versioned-result-refused
  - typed-nil-versioned-result-refused
  - mismatched-versioned-result-refused
  - legacy-indexer-cannot-declare-v2
  - writer-must-support-declaration
  - future-format-write-refusal-is-visible
  - logs-ignore-unwritten-index-format
cases:
  - {name: completed-empty-cursor, declaredFormat: 1, payload: empty, realIndexer: true, harness: cursor, emptyTranscript: true, wantIndexed: true}
  - {name: completed-empty-strike, declaredFormat: 1, payload: empty, realIndexer: true, harness: strike, emptyTranscript: true, wantIndexed: true}
  - name: mixed-malformed-cursor-preserves-last-good
    declaredFormat: 1
    payload: v1
    realIndexer: true
    harness: cursor
    transcript: |
      {"role":"user","content":"new content that must not replace old data"}
      malformed
    wantLogError: could not verify complete input
  - name: mixed-malformed-strike-preserves-last-good
    declaredFormat: 1
    payload: v1
    realIndexer: true
    harness: strike
    transcript: |
      {"type":"user.message","data":{"text":"new content that must not replace old data"}}
      {"type":"usage.reported","data":{"inputTokens":"wrong"}}
    wantLogError: could not verify complete input
  - {name: legacy-v1-result, declaredFormat: 1, payload: v1, wantIndexed: true}
  - {name: versioned-v1-result, declaredFormat: 1, versioned: true, payload: v1, wantIndexed: true}
  - {name: completed-empty-v1, declaredFormat: 1, versioned: true, payload: empty, wantIndexed: true}
  - {name: legacy-empty-preserves-last-good, declaredFormat: 1, payload: empty, wantDiagnostic: true}
  - {name: malformed-claude-preserves-last-good, declaredFormat: 1, payload: empty, realIndexer: true, harness: claude-code, transcript: "malformed json", wantLogError: could not verify complete input}
  - {name: completed-empty-claude, declaredFormat: 1, payload: empty, realIndexer: true, harness: claude-code, emptyTranscript: true, wantIndexed: true}
  - {name: completed-empty-codex, declaredFormat: 1, payload: empty, realIndexer: true, harness: codex, emptyTranscript: true, wantIndexed: true}
  - name: mixed-malformed-claude-preserves-last-good
    declaredFormat: 1
    payload: v1
    realIndexer: true
    harness: claude-code
    transcript: |
      {"type":"user","message":{"role":"user","content":"new content that must not replace old data"}}
      malformed
    wantLogError: could not verify complete input
  - name: mixed-malformed-codex-preserves-last-good
    declaredFormat: 1
    payload: v1
    realIndexer: true
    harness: codex
    transcript: |
      {"type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"input_text","text":"new content that must not replace old data"}]}}
      malformed
    wantLogError: could not verify complete input
  - {name: missing-opencode-tree-preserves-last-good, declaredFormat: 1, payload: empty, realIndexer: true, harness: opencode, transcript: "{}", sourceRoot: /synthetic/missing-opencode, wantDiagnostic: true}
  - {name: parse-error-preserves-last-good, declaredFormat: 1, payload: parse-error, wantLogError: synthetic parser failure}
  - {name: absent-versioned-result-refused, declaredFormat: 1, versioned: true, payload: absent, wantLogError: no concrete result}
  - {name: typed-nil-versioned-result-refused, declaredFormat: 1, versioned: true, payload: nil-v1, wantLogError: no concrete result}
  - {name: mismatched-versioned-result-refused, declaredFormat: 1, versioned: true, payload: v2, wantLogError: declared format 1}
  - {name: legacy-indexer-cannot-declare-v2, declaredFormat: 2, payload: v1, wantConstructorError: slice-returning indexer}
  - {name: writer-must-support-declaration, declaredFormat: 2, versioned: true, payload: v2, wantConstructorError: unsupported output format 2}
  - {name: future-format-write-refusal-is-visible, declaredFormat: 1, storedFormat: 99, payload: v1, wantLogError: unsupported index format 99}
  - {name: logs-ignore-unwritten-index-format, declaredFormat: 2, payload: v1, logsOnly: true}
