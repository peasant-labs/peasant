# Native thinking-level mapping table: one case per harness/native value.
# Every exact canonical spelling is identity (no raw) for every harness,
# checked before harness aliases.
# level empty = unknown (absent), never off. raw empty = no raw evidence.
# rawDropped = the native value could not be kept as raw and the mapper
# reports one thinking_level_raw_dropped diagnostic. nativeGo is a Go
# double-quoted literal for bytes YAML cannot carry (invalid UTF-8).
cases:
  - name: codex_none_maps_off_with_raw
    harness: codex
    native: "none"
    level: off
    raw: "none"
  - name: codex_minimal_identity
    harness: codex
    native: "minimal"
    level: minimal
  - name: codex_low_identity
    harness: codex
    native: "low"
    level: low
  - name: codex_medium_identity
    harness: codex
    native: "medium"
    level: medium
  - name: codex_high_identity
    harness: codex
    native: "high"
    level: high
  - name: codex_xhigh_identity
    harness: codex
    native: "xhigh"
    level: xhigh
  - name: codex_max_identity
    harness: codex
    native: "max"
    level: max
  - name: codex_ultra_identity_without_raw
    harness: codex
    native: "ultra"
    level: ultra
  - name: codex_persistent_maps_off_with_raw
    harness: codex
    native: "persistent"
    level: off
    raw: "persistent"
  - name: codex_custom_is_unknown_with_raw
    harness: codex
    native: "custom"
    raw: "custom"
  - name: codex_arbitrary_is_unknown_with_exact_bytes
    harness: codex
    native: "Turbo-Mode"
    raw: "Turbo-Mode"
  - name: codex_off_identity
    harness: codex
    native: "off"
    level: off
  - name: codex_case_is_not_folded
    harness: codex
    native: "High"
    raw: "High"
  - name: codex_numeric_budget_is_never_a_level
    harness: codex
    native: "8192"
    raw: "8192"
    note: "a budget-like string reaching the effort field is unknown evidence, never a level"
  - name: codex_empty_is_not_observed
    harness: codex
    native: ""
  - name: claude_effort_low_identity
    harness: claude
    native: "low"
    level: low
  - name: claude_effort_medium_identity
    harness: claude
    native: "medium"
    level: medium
  - name: claude_effort_high_identity
    harness: claude
    native: "high"
    level: high
  - name: claude_effort_xhigh_identity
    harness: claude
    native: "xhigh"
    level: xhigh
  - name: claude_effort_max_identity
    harness: claude
    native: "max"
    level: max
  - name: claude_effort_ultra_identity_without_raw
    harness: claude
    native: "ultra"
    level: ultra
  - name: claude_effort_ultracode_identity_without_raw
    harness: claude
    native: "ultracode"
    level: ultracode
  - name: claude_effort_none_maps_off_with_raw
    harness: claude
    native: "none"
    level: off
    raw: "none"
  - name: claude_effort_small_is_unknown_with_raw
    harness: claude
    native: "small"
    raw: "small"
  - name: claude_effort_trivial_is_unknown_with_raw
    harness: claude
    native: "trivial"
    raw: "trivial"
  - name: claude_effort_minimal_identity
    harness: claude
    native: "minimal"
    level: minimal
  - name: claude_effort_empty_is_not_observed
    harness: claude
    native: ""
  - name: claude_legacy_none_maps_off_with_raw
    harness: claude_legacy
    native: "none"
    level: off
    raw: "none"
  - name: claude_legacy_high_identity
    harness: claude_legacy
    native: "high"
    level: high
  - name: claude_legacy_off_identity
    harness: claude_legacy
    native: "off"
    level: off
  - name: claude_legacy_ultra_identity
    harness: claude_legacy
    native: "ultra"
    level: ultra
  - name: claude_legacy_other_is_unknown_with_raw
    harness: claude_legacy
    native: "think-hard"
    raw: "think-hard"
  - name: claude_legacy_budget_string_is_never_a_level
    harness: claude_legacy
    native: "31999"
    raw: "31999"
    note: "maxThinkingTokens is never passed to the mapper; even a numeric string reaching level is not mapped to a canonical"
  - name: opencode_minimal_identity
    harness: opencode
    native: "minimal"
    level: minimal
