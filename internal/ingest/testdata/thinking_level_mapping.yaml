  - name: claude_legacy_minimal_identity
    harness: claude_legacy
    native: "minimal"
    level: minimal
  - name: claude_legacy_low_identity
    harness: claude_legacy
    native: "low"
    level: low
  - name: claude_legacy_medium_identity
    harness: claude_legacy
    native: "medium"
    level: medium
  - name: claude_legacy_xhigh_identity
