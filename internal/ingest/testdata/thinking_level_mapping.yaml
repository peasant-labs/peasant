  - name: opencode_deep_label_is_unknown_with_raw
    harness: opencode
    native: "deep"
    raw: "deep"
  - name: opencode_multibyte_label_kept_exact
    harness: opencode
    native: "思考"
    raw: "思考"
  - name: pi_off_identity
    harness: pi
    native: "off"
    level: off
  - name: pi_minimal_identity
    harness: pi
    native: "minimal"
    level: minimal
  - name: pi_low_identity
    harness: pi
    native: "low"
    level: low
  - name: pi_medium_identity
    harness: pi
    native: "medium"
    level: medium
  - name: pi_high_identity
    harness: pi
    native: "high"
    level: high
  - name: pi_xhigh_identity
    harness: pi
