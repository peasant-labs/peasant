  - name: opencode_ultra_identity
    harness: opencode
    native: "ultra"
    level: ultra
  - name: raw_edge_whitespace_is_dropped_with_diagnostic
    harness: codex
    native: " high"
    rawDropped: true
    note: "nothing is trimmed: the padded value is not identity and cannot be raw"
  - name: raw_invalid_utf8_is_dropped_with_diagnostic
    harness: opencode
    nativeGo: "\"fast\\xff\""
    rawDropped: true
  - name: raw_over_byte_bound_is_dropped_with_diagnostic
    harness: pi
    native: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    rawDropped: true
  - name: raw_multibyte_over_byte_bound_is_dropped_with_diagnostic
    harness: claude
    native: "ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé"
    rawDropped: true
    note: "65 code points, 130 encoded bytes"
  - name: raw_at_byte_bound_is_kept
    harness: claude_legacy
    native: "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
    raw: "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
