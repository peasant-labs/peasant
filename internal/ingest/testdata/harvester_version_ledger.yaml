# Every producer bump, in the order it happened. `from`/`to` are the version
# values; `reason` and `lane` state what the bump invalidates and which lane
# repairs it. The chain for one harness/kind is contiguous: each row starts at
# the previous row's `to`, so a baseline checkpoint and the managed-generation
# target are both on the same chain. A registry value that is missing from the
# chain, or a chain whose last row disagrees with the current registry, fails
# the ledger tests.
- id: pi-adapter-3
  harness: pi
  kind: adapter
  from: 2
  to: 3
  reason: adapter_behind
  lane: stored-metadata
- id: pi-indexer-18
  harness: pi
  kind: indexer
  from: 17
  to: 18
  reason: indexer_behind
  lane: stored-index
- id: pi-format-1
  harness: pi
  kind: format
  from: 0
  to: 1
  reason: indexer_behind
  lane: stored-index

