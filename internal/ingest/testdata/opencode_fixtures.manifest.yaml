# Every OpenCode fixture in the repository, partitioned into raw directories,
# corpus YAML documents read by the metadata-half differential, and non-corpus
# YAML documents with explicit reasons. Manifest files (*.manifest.yaml) are
# excluded from the walk.
directories:
  - internal/store/testdata/content_model_parity_goldens

