# The retained corpus the reconciliation walk reports progress over.
#
# Every case is one retained session the walk must visit and count. The walk
# runs before discovery, so without this stage a large retained tree is a blank
# screen; the total is the inventory count and the counter advances once per
# session, whatever that session cost.
requiredNames:
  - settled-retained-session-alpha
  - settled-retained-session-bravo
  - settled-retained-session-charlie
transcript: '{"type":"user","message":{"role":"user","content":"retained progress input"}}'
cases:
  - name: settled-retained-session-alpha
    sessionID: 66666666-6666-4666-8666-666666666666
  - name: settled-retained-session-bravo
    sessionID: 77777777-7777-4777-8777-777777777777
  - name: settled-retained-session-charlie
    sessionID: 88888888-8888-4888-8888-888888888888
