requiredNames:
  - claude-retained-context
  - codex-retained-context
  - cursor-retained-clock
  - codex-missing-session-metadata
  - malformed-retained-jsonl
cases:
  - name: claude-retained-context
    harness: claude-code
    transcript: |
      {"type":"user","timestamp":"2026-01-01T00:00:00Z","version":"native-version","message":{"content":"hello"}}
      {"type":"assistant","timestamp":"2026-01-01T00:00:01Z","message":{"model":"claude-sonnet-4","content":[{"type":"text","text":"hi"}],"usage":{"input_tokens":3,"output_tokens":2}}}
    turns: 2
    tokensIn: 3
    tokensOut: 2
  - name: codex-retained-context
    harness: codex
    transcript: |
      {"type":"session_meta","timestamp":"2026-01-01T00:00:00Z","payload":{"id":"retained-session","timestamp":"2026-01-01T00:00:00Z","cli_version":"native-version","cwd":"/retained/project"}}
      {"type":"turn_context","payload":{"model":"gpt-5"}}
      {"type":"response_item","timestamp":"2026-01-01T00:00:01Z","payload":{"type":"message","role":"user"}}
      {"type":"event_msg","payload":{"type":"token_count","info":{"total_token_usage":{"input_tokens":3,"output_tokens":2}}}}
    turns: 1
    tokensIn: 3
    tokensOut: 2
  - name: cursor-retained-clock
    harness: cursor
    transcript: |
      {"role":"user","message":{"content":"hello"}}
      {"role":"assistant","message":{"model":"gpt-5","content":"hi","usage":{"input_tokens":3,"output_tokens":2}}}
    turns: 2
    tokensIn: 3
    tokensOut: 2
    preserveTimes: true
  - name: codex-missing-session-metadata
    harness: codex
    transcript: |
      {"type":"response_item","payload":{"type":"message","role":"user"}}
    insufficient: true
  - name: malformed-retained-jsonl
    harness: claude-code
    transcript: '{"type":"user"'
    insufficient: true
