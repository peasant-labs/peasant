# Whether a mixed malformed/healthy harvest repeats a refusal on the next
# harvest.
#
# A refusal about the source bytes is reported once. A capture refusal that is
# not yet classified as an unusable source record is still reported on every
# harvest. The healthy sibling is indexed either way: a content-recovery
# failure is not a reason to skip it.
required_names:
  - claude-code
  - codex
  - cursor
  - opencode
  - pi
  - strike

cases:
  - harness: claude-code
    index_refusal_settles: true
    content_recovery_settles: true
  - harness: codex
    index_refusal_settles: true
    content_recovery_settles: true
  - harness: cursor
    index_refusal_settles: true
    content_recovery_settles: true
  - harness: opencode
    index_refusal_settles: true
    content_recovery_settles: true
  # Pi and Strike validation refusals are not unusable source records, so both
  # the index refusal and the content-recovery warning are reported on every
  # harvest until those capture paths say the bytes are the problem.
  - harness: pi
    index_refusal_settles: false
    content_recovery_settles: false
    note: validation refusal is not an unusable source record, so both refusals are reported on every harvest
  - harness: strike
    index_refusal_settles: false
    content_recovery_settles: false
    note: validation refusal is not an unusable source record, so both refusals are reported on every harvest
