# Cases for how one OpenCode message renders as turns: the tool name, the tool
# output, and the single rendering of a message's own prose.
#
# `want_message_entry_type` is the entry type the depth-0 message row itself
# carries after indexing, before any fold. It is what decides whether a message
# is presented as a tool turn at all, so a message whose parts hold no tool call
# must stay a text entry.
#
# `parts` holds the exact part JSON a row stores, so a case states the real
# stored shape rather than a helper's idea of it. `want_turns` is the full turn
# list the message must fold to, in order. `content_rendered_once` names a
# string that must appear in exactly one turn's content, which is what stops the
# same prose from rendering twice.
#
# Output precedence, asserted by the four precedence cases below: "output" is
# what a current OpenCode row writes, "result" is the older alias for the same
# value, "error" names a failure that produced no output, and "content" is the
# last legacy alias. The first present field wins.
#
# required_cases names the cases that must stay present. Removing one goes red
# by name; adding a case need not appear here. The list, not a count, guards.
required_cases:
  - tool-name-comes-from-the-tool-field
  - tool-name-still-comes-from-the-name-field
  - tool-output-comes-from-state-output
  - output-wins-over-result-error-and-content
  - result-wins-when-output-is-absent
  - error-shows-when-output-and-result-are-absent
  - content-shows-when-it-is-the-only-alias
  - a-structured-output-stays-compact-json
  - a-trailing-assistant-text-part-renders-once
  - a-reasoning-part-does-not-make-a-tool-turn
  - a-synthetic-completed-task-result-is-a-system-entry
  - a-synthetic-failed-task-result-is-a-system-entry
  - a-real-user-message-about-a-task-stays-a-user-turn
  - a-synthetic-part-on-an-assistant-message-is-a-system-entry
  - a-user-message-with-one-synthetic-annotation-stays-a-user-turn
  - a-message-whose-two-parts-are-both-synthetic-is-a-system-entry

cases:
  - name: tool-name-comes-from-the-tool-field
    role: assistant
    parts:
      - '{"id":"prt_tool_field","type":"tool","tool":"task","callID":"call_1","state":{"status":"completed","input":{"description":"explore"},"output":"task done"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: task
            input: '{"description":"explore"}'
            output: "task done"

  - name: tool-name-still-comes-from-the-name-field
    role: assistant
    parts:
      - '{"id":"prt_name_field","type":"tool","name":"read","state":{"status":"completed","input":{"path":"/tmp/a"},"output":"file body"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: read
            input: '{"path":"/tmp/a"}'
            output: "file body"

  - name: tool-output-comes-from-state-output
    role: assistant
    parts:
      - '{"id":"prt_output","type":"tool","tool":"bash","state":{"status":"completed","input":{"command":"ls"},"output":"a\nb\n"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: bash
            input: '{"command":"ls"}'
            output: "a\nb\n"

  - name: output-wins-over-result-error-and-content
    role: assistant
    parts:
      - '{"id":"prt_all","type":"tool","tool":"bash","state":{"status":"completed","input":{},"output":"from output","result":"from result","error":"from error","content":"from content"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: bash
            input: '{}'
            output: "from output"

  - name: result-wins-when-output-is-absent
    role: assistant
    parts:
      - '{"id":"prt_result","type":"tool","tool":"bash","state":{"status":"completed","input":{},"result":"from result","error":"from error","content":"from content"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: bash
            input: '{}'
            output: "from result"

  - name: error-shows-when-output-and-result-are-absent
    role: assistant
    parts:
      - '{"id":"prt_error","type":"tool","tool":"webfetch","state":{"status":"error","input":{},"error":"non 2xx status code","content":"from content"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: webfetch
            input: '{}'
            output: "non 2xx status code"

  - name: content-shows-when-it-is-the-only-alias
    role: assistant
    parts:
      - '{"id":"prt_content","type":"tool","tool":"webfetch","state":{"status":"completed","input":{},"content":"from content"}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: webfetch
            input: '{}'
            output: "from content"

  - name: a-structured-output-stays-compact-json
    role: assistant
    parts:
      - '{"id":"prt_structured","type":"tool","tool":"grep","state":{"status":"completed","input":{},"output":{"matches":2}}}'
    want_message_entry_type: tool_use
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: tool_use
        content: ""
        tools:
          - name: grep
            input: '{}'
            output: '{"matches":2}'

  - name: a-trailing-assistant-text-part-renders-once
    role: assistant
    parts:
      - '{"id":"prt_reason","type":"reasoning","text":"weighing the report wording"}'
      - '{"id":"prt_report","type":"text","text":"## Objective\nthe finished report"}'
    content_rendered_once: "## Objective\nthe finished report"
    want_message_entry_type: text
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: text
        content: "## Objective\nthe finished report"
      - role: assistant
        entry_type: thinking
        content: "weighing the report wording"

  - name: a-reasoning-part-does-not-make-a-tool-turn
    role: assistant
    parts:
      - '{"id":"prt_reason_only","type":"reasoning","text":"thinking with no tool call"}'
    want_message_entry_type: text
    want_message_role: assistant
    want_turns:
      - role: assistant
        entry_type: thinking
        content: "thinking with no tool call"

  # OpenCode's task tool injects the finished result of a background task back
  # into the parent session as a user-role message whose one text part carries
  # synthetic: true. The flag, not the text shape, is what says the harness
  # wrote the message, so the indexer reads the flag alone.
  - name: a-synthetic-completed-task-result-is-a-system-entry
    role: user
    parts:
      - '{"id":"prt_task_done","type":"text","synthetic":true,"text":"<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> <summary>Background task completed: Research serving runtimes</summary> <task_result>the runtimes report</task_result> </task>"}'
    want_message_entry_type: system
    want_message_role: system
    want_turns:
      - role: system
        entry_type: system
        content: "<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> <summary>Background task completed: Research serving runtimes</summary> <task_result>the runtimes report</task_result> </task>"

  - name: a-synthetic-failed-task-result-is-a-system-entry
    role: user
    parts:
      - '{"id":"prt_task_error","type":"text","synthetic":true,"text":"<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"error\"> <summary>Background task failed: Research serving runtimes</summary> <task_error>the model refused the request</task_error> </task>"}'
    want_message_entry_type: system
    want_message_role: system
    want_turns:
      - role: system
        entry_type: system
        content: "<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"error\"> <summary>Background task failed: Research serving runtimes</summary> <task_error>the model refused the request</task_error> </task>"

  # A person may write about a task and even paste the tag. Without the flag the
  # message is theirs and stays a user turn, which is why no text-shape
  # recognizer decides this.
  - name: a-real-user-message-about-a-task-stays-a-user-turn
    role: user
    parts:
      - '{"id":"prt_user_task_text","type":"text","text":"what does <task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> mean in the log?"}'
    want_message_entry_type: text
    want_message_role: user
    want_turns:
      - role: user
        entry_type: text
        content: "what does <task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> mean in the log?"

  # The documented outcome for a synthetic part on an assistant message: the
  # flag reclassifies whatever message holds it, exactly as a compaction,
  # subtask, or agent part does.
  - name: a-synthetic-part-on-an-assistant-message-is-a-system-entry
    role: assistant
    parts:
      - '{"id":"prt_assistant_synthetic","type":"text","synthetic":true,"text":"harness-authored assistant note"}'
    want_message_entry_type: system
    want_message_role: system
    want_turns:
      - role: system
        entry_type: system
        content: "harness-authored assistant note"

  # OpenCode attaches a synthetic part to a message a person really wrote
  # whenever it annotates that message: a plan-mode reminder, an attached file,
  # an MCP resource, an agent mention. The person's own part is not synthetic,
  # so the message stays theirs and their words keep rendering as their turn.
  #
  # The annotation itself still folds to a turn of its own, which is the
  # long-standing rendering of a second text part and is not decided here. What
  # this case fixes in place is that the person's question is not swallowed:
  # reclassifying the whole message on one synthetic part would have hidden it.
  - name: a-user-message-with-one-synthetic-annotation-stays-a-user-turn
    role: user
    parts:
      - '{"id":"prt_person_asked","type":"text","text":"can you also check the auth module?"}'
      - '{"id":"prt_plan_reminder","type":"text","synthetic":true,"text":"You are in plan mode. Do not edit files."}'
    content_rendered_once: "can you also check the auth module?"
    want_message_entry_type: text
    want_message_role: user
    want_turns:
      - role: user
        entry_type: text
        content: "can you also check the auth module?"
      - role: user
        entry_type: text
        content: "You are in plan mode. Do not edit files."

  # The rule is "every part", not "one part". OpenCode appends a reminder part
  # to the last user message of a turn, and that message can be one the harness
  # itself injected. Both parts are then synthetic and the whole message is
  # harness-authored, so it must still reclassify.
  - name: a-message-whose-two-parts-are-both-synthetic-is-a-system-entry
    role: user
    parts:
      - '{"id":"prt_two_result","type":"text","synthetic":true,"text":"<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> <summary>Background task completed: Research serving runtimes</summary> <task_result>the runtimes report</task_result> </task>"}'
      - '{"id":"prt_two_reminder","type":"text","synthetic":true,"text":"You are in plan mode. Do not edit files."}'
    want_message_entry_type: system
    want_message_role: system
    want_turns:
      - role: system
        entry_type: system
        content: "<task id=\"ses_ffe6cce48ffefzK8rzeIauasaI\" state=\"completed\"> <summary>Background task completed: Research serving runtimes</summary> <task_result>the runtimes report</task_result> </task>"
      # The second part folds to its own turn and keeps its own text type.
      # The role is what decides whose words a reader is looking at, and it
      # follows the reclassified message.
      - role: system
        entry_type: text
        content: "You are in plan mode. Do not edit files."
