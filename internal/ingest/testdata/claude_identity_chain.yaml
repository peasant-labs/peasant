# Lineage answers that must survive replacing the per-line list with the
# deduplicated coordinate chain. Each case is decided twice: once by walking
# the full record list, and once by walking the compact chain. Both answers
# must equal want. A chain that drops type, subtype, or a later identical copy
# fails one of these cases. The two middle-copy cases are the ones a key of
# (sessionId, uuid, parentUuid) gets wrong: that key keeps the agreeing ends
# and drops the middle record whose type or subtype is the refusal.
requiredNames:
  - restamped copy agrees
  - foreign compact boundary is a segment start
  - copied type mismatch is refused
  - copied parent mismatch is refused
  - later identical copy witnesses the transition
  - first copy alone does not witness that transition
  - continuation from snapshot parent
  - empty uuid foreign record does not prove a fork
  - disconnected foreign record is refused
  - middle type-mismatch copy
  - middle non-boundary copy between foreign compact boundaries

cases:
  - name: restamped copy agrees
    own: "22222222-2222-4222-8222-222222222222"
    source: "11111111-1111-4111-8111-111111111111"
    want: true
    snapshot:
      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: s1, parentUuid: "", type: user, subtype: ""}
    records:
      - {sessionId: "22222222-2222-4222-8222-222222222222", uuid: s1, parentUuid: "", type: user, subtype: ""}
      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: command, parentUuid: s1, type: system, subtype: local_command}
      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: fork-tail, parentUuid: command, type: assistant, subtype: ""}
  - name: foreign compact boundary is a segment start
    own: "44444444-4444-4444-8444-444444444444"
    source: "11111111-1111-4111-8111-111111111111"
    want: true
    snapshot:
      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: s1, parentUuid: "", type: user, subtype: ""}
      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: s2, parentUuid: s1, type: assistant, subtype: ""}
    records:
