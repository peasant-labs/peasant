      - {sessionId: "11111111-1111-4111-8111-111111111111", uuid: boundary-foreign, parentUuid: "", type: system, subtype: compact_boundary}
      - {sessionId: "44444444-4444-4444-8444-444444444444", uuid: own-root, parentUuid: "", type: progress, subtype: ""}
