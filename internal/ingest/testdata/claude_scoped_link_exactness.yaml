required_names:
  - scoped dry run links from the read-only evidence cache
  - scoped run links past an unreadable stored evidence row
  - scoped run links when the declarer's spawns list is unreadable
# Each case seeds in two phases: the child alone (so its sessions row has no
# parent), then the spawner (so the store gains the spawns row without
# re-linking the unchanged child). The scoped phase then has to form the link
# itself. `touch` makes the dry run re-mine, which would write a deferred
# evidence upsert if the forecast did not gate it.
cases:
  - name: scoped dry run links from the read-only evidence cache
    dry_run: true
    seed_excludes:
      - -workspace/11111111-1111-4111-8111-111111111111.jsonl
    touch: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    child: "22222222-2222-4222-8222-222222222222"
    selected:
      - "22222222-2222-4222-8222-222222222222"
      - "11111111-1111-4111-8111-111111111111"
    want_parent: "11111111-1111-4111-8111-111111111111"
    files:
      - path: -workspace/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/workspace","toolUseResult":{"status":"teammate_spawned","team_name":"migration","name":"tests"},"message":{"role":"user","content":"spawn"}}'
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/workspace","teamName":"migration","agentName":"tests","message":{"role":"user","content":"write tests"}}'

  - name: scoped run links past an unreadable stored evidence row
    dry_run: false
    seed_excludes:
      - -workspace/11111111-1111-4111-8111-111111111111.jsonl
    corrupt: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    child: "22222222-2222-4222-8222-222222222222"
    selected:
      - "22222222-2222-4222-8222-222222222222"
      - "11111111-1111-4111-8111-111111111111"
    want_parent: "11111111-1111-4111-8111-111111111111"
    files:
      - path: -workspace/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/workspace","toolUseResult":{"status":"teammate_spawned","team_name":"migration","name":"tests"},"message":{"role":"user","content":"spawn"}}'
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/workspace","teamName":"migration","agentName":"tests","message":{"role":"user","content":"write tests"}}'

  - name: scoped run links when the declarer's spawns list is unreadable
    dry_run: false
    seed_excludes:
      - -workspace/11111111-1111-4111-8111-111111111111.jsonl
    corrupt_spawns: -workspace/22222222-2222-4222-8222-222222222222.jsonl
    child: "22222222-2222-4222-8222-222222222222"
    selected:
      - "22222222-2222-4222-8222-222222222222"
      - "11111111-1111-4111-8111-111111111111"
    want_parent: "11111111-1111-4111-8111-111111111111"
    files:
      - path: -workspace/11111111-1111-4111-8111-111111111111.jsonl
        lines:
          - '{"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/workspace","toolUseResult":{"status":"teammate_spawned","team_name":"migration","name":"tests"},"message":{"role":"user","content":"spawn"}}'
      - path: -workspace/22222222-2222-4222-8222-222222222222.jsonl
        lines:
          - '{"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/workspace","teamName":"migration","agentName":"tests","message":{"role":"user","content":"write tests"}}'
