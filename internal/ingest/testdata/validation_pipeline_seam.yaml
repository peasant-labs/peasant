# The optional validator runs after a not-proven unchanged proof. Only a
# consistent proven answer settles; every other answer (unsupported, an error,
# an inconsistent pair, no validator) leaves the proof not proven and the
# session parses. No answer copies the stored generation.
cases:
  - name: unsupported-parses
    outcome: unsupported
    validatorCalls: 1
    builds: 1
    unsupported: true
  - name: proven-settles
    outcome: proven
    validatorCalls: 1
    settles: 1
  - name: validated-settle-refused-parses
    outcome: proven
    validatorCalls: 1
    settles: 1
    builds: 1
    settleRefused: true
  - name: not-proven-parses
    outcome: not-proven
    mismatch: content-hash
    validatorCalls: 1
    builds: 1
    diagnostic: true
  - name: validator-error-parses
    error: true
    validatorCalls: 1
    builds: 1
  - name: inconsistent-proven-parses
    outcome: proven
    mismatch: content-hash
    validatorCalls: 1
    builds: 1
    unsupported: true
  - name: missing-validator-parses
    missing: true
    builds: 1
