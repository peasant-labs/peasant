# A dispatch corpus with no row for the UNDECLARED source kind.
#
# It is the state the corpus was in before the zero value had an arm of its own:
# the two declared kinds are covered - both of their exits each - and the one an
# indexer reaches by FORGETTING to declare anything is not. That is the likelier
# mistake, because forgetting is easier than mis-declaring, and it is the one
# whose old behaviour - assume a file source - reproduced the silent zero-entry
# import.

requiredNames:
  - a-file-source-is-handed-the-bytes
  - a-file-source-with-no-bytes-reads-what-was-written
  - a-directory-source-is-never-handed-bytes
  - a-directory-source-that-lost-its-root-is-refused
cases:
  - name: a-file-source-is-handed-the-bytes
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-file-source-with-no-bytes-reads-what-was-written
    sourceKind: file
    originalRoot: present
    nativeLocator: present
    transcriptBytes: absent
    entryPoint: bytes
    indexOutcome: indexed

  - name: a-directory-source-is-never-handed-bytes
    sourceKind: directory
    originalRoot: present
    nativeLocator: present
    transcriptBytes: present
    entryPoint: tree
    indexOutcome: indexed

  - name: a-directory-source-that-lost-its-root-is-refused
    sourceKind: directory
    originalRoot: absent
    nativeLocator: absent
    transcriptBytes: present
    entryPoint: none
    indexOutcome: error
    errorContains: valid original locator is unavailable
