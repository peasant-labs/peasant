  # The real store's index writer seeds a synthetic strict-refusal state at
  # revision zero; this build's parser instead retains unknown data.
  - name: legacy-strict-refusal-without-publication-does-not-churn
    harness: claude-code
    source: current
    discover: true
    stored_adapter: current
    metadata_schema: current
    pair: present
    indexer: current
    refusal: strict_capture_refused
    refusal_indexer: current
    publication: missing
    want_seed_publishable: false
    want_capture_revision: 0
    want_publication_bound: false
    want_reason: none
    want_lane: none
    want_native_read: false
    second_source_reads: 0
    want_pair_writes: []
    want_indexed: false

  # A preview with the same failure code is not certified as full content.
  - name: legacy-unknown-preview-without-publication-does-not-churn
    harness: claude-code
    source: current
    discover: true
    stored_adapter: current
    metadata_schema: current
    pair: present
    indexer: current
    refusal: unknown_data_retained
