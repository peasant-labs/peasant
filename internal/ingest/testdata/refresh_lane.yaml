# One refresh decision per stored session, driven through the production
# harvest pipeline with an in-memory filesystem and a real store. Each case
# seeds the same current session, applies one mutation, and states the decision
# the pipeline must make, whether the native source may be read, which pair
# files may be renamed into place, whether the index is rewritten, and that the
# stored row settles to none.
#
# The source transcripts are synthetic: a session id, a working directory, a
# user turn and an assistant turn. `append_record` adds one more synthetic
# user turn.
session_id: 97200000-0000-4000-8000-000000000001
transcript:
  - '{"sessionId":"97200000-0000-4000-8000-000000000001","type":"user","uuid":"entry-first","timestamp":"2023-11-14T22:13:20Z","cwd":"/work/project","message":{"role":"user","content":"first synthetic turn"}}'
  - '{"sessionId":"97200000-0000-4000-8000-000000000001","type":"assistant","uuid":"entry-second","timestamp":"2023-11-14T22:13:21Z","cwd":"/work/project","message":{"role":"assistant","model":"claude-synthetic","content":[{"type":"text","text":"second synthetic turn"}]}}'
append_record: '{"sessionId":"97200000-0000-4000-8000-000000000001","type":"user","uuid":"entry-third","timestamp":"2023-11-14T22:13:22Z","cwd":"/work/project","message":{"role":"user","content":"appended synthetic turn"}}'
