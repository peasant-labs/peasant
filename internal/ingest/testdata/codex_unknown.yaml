required_names:
  - envelope
  - event
  - response
  - nested
  - corrupt_known_after_unknown
  - reasoning_block
  - canonical_item
  - canonical_block
  - inherited_envelope
  - reverted_envelope
  - broken_json
cases:
  - name: inherited_envelope
    native_only: true
    copy_boundary: 2
    record: '{"type":"future","payload":{"new":true}}'
    namespace: envelope
    kind: future
    pointer: ''
  - name: reverted_envelope
    native_only: true
    reverted: true
    record: '{"type":"future","payload":{"new":true}}'
    namespace: envelope
    kind: future
    pointer: ''
  - name: broken_json
    record: '{"type":"future"'
    error: true
  - name: reasoning_block
    record: '{"type":"response_item","payload":{"type":"reasoning","summary":[{"type":"summary_text","text":"before"},{"type":"future","text":{"new":true}},{"type":"summary_text","text":"after"}]}}'
    namespace: content_block
    kind: future
    pointer: /payload/summary/1
  - name: canonical_item
    native_only: true
    record: '{"type":"event_msg","payload":{"type":"item_completed","id":"new-item","item":{"type":"FutureItem","content":{"new":true}}}}'
    namespace: item
    kind: FutureItem
    pointer: /payload/item
  - name: canonical_block
    native_only: true
    record: '{"type":"event_msg","payload":{"type":"item_completed","item":{"type":"UserMessage","id":"new-item","content":[{"type":"input_text","text":"before"},{"type":"future","text":{"new":true}},{"type":"input_text","text":"after"}]}}}'
    namespace: content_block
    kind: future
    pointer: /payload/item/content/1
  - name: envelope
    record: '{"type":"future","payload":{"large":9007199254740993,"token":"ghp_abcdefghijklmnopqrstuvwxyz0123456789ABCD"}}'
    namespace: envelope
    kind: future
    pointer: ''
  - name: event
    record: '{"type":"event_msg","payload":{"type":"future","message":{"new":true}}}'
    namespace: event_msg
    kind: future
    pointer: /payload
  - name: response
    record: '{"type":"response_item","payload":{"type":"future","content":{"new":true}}}'
    namespace: response_item
    kind: future
    pointer: /payload
  - name: nested
    record: '{"type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"input_text","text":"before"},{"type":"future","text":{"new":true}},{"type":"input_text","text":"after"}]}}'
    namespace: content_block
    kind: future
    pointer: /payload/content/1
  - name: corrupt_known_after_unknown
    record: '{"type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"future"},{"type":"input_text","text":42}]}}'
    error: true
