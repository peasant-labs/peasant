# The ingest test hooks of the metadata halves, and the only functions
# that may read each. BuildGeneration must never read a metadata-half
# mutation. No production file may assign one (internal/testkit/hookguard).
hooks:
  - name: claudeMetadataHalfMutationForTest
    readers: [ClaudeIndexer.BuildGenerationMetadata]
  - name: openCodeMetadataHalfMutationForTest
    readers: [OpenCodeIndexer.BuildGenerationMetadata]
