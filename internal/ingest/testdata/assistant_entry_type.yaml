    harness: claude-code
    jsonl:
      - '{"type":"assistant","uuid":"a2","timestamp":"2026-01-02T10:01:00Z","message":{"role":"assistant","content":[{"type":"thinking","thinking":"let me think about the layout"},{"type":"text","text":"Here is the layout."}]}}'
    want:
      entries:
        - {role: assistant, entry_type: text, has_tool_use: false, has_thinking: true}
      turns:
        - role: assistant
          entry_type: text
          content: 'Here is the layout.'
        - role: assistant
          entry_type: thinking
          content: 'let me think about the layout'

  - name: claude-thinking-only
    paths: [indexer, managed]
    harness: claude-code
    jsonl:
      - '{"type":"assistant","uuid":"a3","timestamp":"2026-01-02T10:02:00Z","message":{"role":"assistant","content":[{"type":"thinking","thinking":"only thinking here"}]}}'
    want:
      entries:
        - {role: assistant, entry_type: thinking, has_tool_use: false, has_thinking: true}
      turns:
        - role: assistant
          entry_type: thinking
          content: 'only thinking here'
    # The managed build keeps the carrier and its thinking child as two
    # turns; the stored indexer folds the record to one.
    want_managed:
      entries:
        - {role: assistant, entry_type: thinking, has_tool_use: false, has_thinking: true}
      turns:
        - role: assistant
          entry_type: thinking
          content: 'only thinking here'
        - role: assistant
          entry_type: thinking
          content: 'only thinking here'

