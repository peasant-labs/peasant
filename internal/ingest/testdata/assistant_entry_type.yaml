      - '{"type":"assistant","uuid":"a1","timestamp":"2026-01-02T10:00:01Z","message":{"role":"assistant","content":[{"type":"thinking","thinking":"pondering the diff"}]}}'
      - '{"type":"assistant","uuid":"a2","timestamp":"2026-01-02T10:00:02Z","message":{"role":"assistant","content":[{"type":"tool_use","id":"toolu_9","name":"Read","input":{"path":"diff.go"}}]}}'
      - '{"type":"user","uuid":"t9","timestamp":"2026-01-02T10:00:03Z","message":{"role":"tool","content":[{"type":"tool_result","tool_use_id":"toolu_9","content":"changed lines"}]}}'
      - '{"type":"assistant","uuid":"a3","timestamp":"2026-01-02T10:00:04Z","message":{"role":"assistant","content":[{"type":"text","text":"The diff looks good."}]}}'
      - '{"type":"system","uuid":"s1","timestamp":"2026-01-02T10:00:05Z","content":"context compacted"}'
    want:
      entries:
        - {role: user, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: thinking, has_tool_use: false, has_thinking: true}
        - {role: assistant, entry_type: tool_use, has_tool_use: true, has_thinking: false}
        - {role: tool, entry_type: tool_result, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: system, entry_type: system, has_tool_use: false, has_thinking: false}
      turns:
        - role: user
          entry_type: text
          content: 'what changed?'
        - role: assistant
          entry_type: thinking
          content: 'pondering the diff'
        - role: assistant
          entry_type: tool_use
          content: ''
          tools:
            - {name: Read, input: '{"path":"diff.go"}', output: 'changed lines'}
        - role: assistant
          entry_type: text
          content: 'The diff looks good.'
        - role: system
          entry_type: system
          content: 'context compacted'
    want_managed:
      entries:
        - {role: user, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: thinking, has_tool_use: false, has_thinking: true}
        - {role: assistant, entry_type: tool_use, has_tool_use: true, has_thinking: false}
        - {role: tool, entry_type: tool_result, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: system, entry_type: system, has_tool_use: false, has_thinking: false}
      turns:
        - role: user
          entry_type: text
          content: 'what changed?'
        - role: assistant
          entry_type: thinking
          content: 'pondering the diff'
        - role: assistant
          entry_type: thinking
          content: 'pondering the diff'
        - role: assistant
          entry_type: tool_use
          content: ''
          tools:
            - {name: Read, input: '{"path":"diff.go"}', output: 'changed lines'}
        - role: assistant
          entry_type: text
          content: 'The diff looks good.'
        - role: system
          entry_type: system
          content: 'context compacted'

