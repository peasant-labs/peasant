# How an assistant reply is typed: prose is text, a prose-less tool record is
# tool_use, a thinking-only record is thinking. Source records are in each
# harness's real shape; each row runs one path (the stored indexer, then
# EntriesToTurns) or both paths (indexer plus the managed BuildGeneration /
# BuildV2WithContent build, then EntriesToTurns).
#
# want.entries is every depth-0 stored entry in order: role, entry type and
# the two flags. want.turns is the full folded turn list in order: role,
# entry type, content and tool calls as literals. The count columns belong to
# the counts slice and are added to these rows later.
#
# requiredNames names the rows that must stay present. Removing one goes red
# by name; adding a row need not appear here. The list, not a count, guards.
requiredNames:
  - claude-prose-and-tool-use-in-one-record
  - claude-thinking-and-prose-in-one-record
  - claude-thinking-only
  - claude-blank-text-and-tool-use
  - claude-blocks-as-separate-records
  - claude-image-only-prompt
  - opencode-unmanaged-text-part-and-tool-part
  - opencode-unmanaged-tool-parts-only
  - opencode-unmanaged-reasoning-only
  - cursor-prose-and-tool-calls
  - cursor-tool-calls-only
  - opencode-managed-tool-only
  - opencode-managed-tool-form-shell
  - opencode-managed-text-then-tool
  - opencode-managed-reasoning-then-tool
  - opencode-managed-blank-text-then-tool
  - codex-managed-tool-only-segment
  - codex-managed-text-then-tool
  - blank-text-counts
  - harness-notice-as-user-text-counts
  - reclassified-command-is-system
  - pi-nested-tool-calls
  - cursor-session-shape

cases:
  - name: claude-prose-and-tool-use-in-one-record
    paths: [indexer, managed]
    harness: claude-code
    jsonl:
      - '{"type":"user","uuid":"u1","timestamp":"2026-01-02T10:00:00Z","message":{"role":"user","content":"list the project files"}}'
      - '{"type":"assistant","uuid":"a1","timestamp":"2026-01-02T10:00:05Z","message":{"role":"assistant","content":[{"type":"text","text":"I will list the project files."},{"type":"tool_use","id":"toolu_1","name":"Bash","input":{"command":"ls"}}],"usage":{"input_tokens":10,"output_tokens":20}}}'
      - '{"type":"user","uuid":"t1","timestamp":"2026-01-02T10:00:10Z","message":{"role":"tool","content":[{"type":"tool_result","tool_use_id":"toolu_1","content":"main.go\nstore.go"}]}}'
    want:
      entries:
        - {role: user, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: text, has_tool_use: true, has_thinking: false}
        - {role: tool, entry_type: tool_result, has_tool_use: false, has_thinking: false}
      turns:
        - role: user
          entry_type: text
          content: 'list the project files'
        - role: assistant
          entry_type: text
          content: 'I will list the project files.'
          tools:
            - {name: Bash, input: '{"command":"ls"}', output: "main.go\nstore.go"}
    # The managed carrier is built from the parsed entry but carries no
    # tool-use flag of its own: only the stored indexer record names the
    # tool calls it holds.
    want_managed:
      entries:
        - {role: user, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: assistant, entry_type: text, has_tool_use: false, has_thinking: false}
        - {role: tool, entry_type: tool_result, has_tool_use: false, has_thinking: false}
      turns:
        - role: user
          entry_type: text
          content: 'list the project files'
        - role: assistant
          entry_type: text
          content: 'I will list the project files.'
          tools:
            - {name: Bash, input: '{"command":"ls"}', output: "main.go\nstore.go"}

