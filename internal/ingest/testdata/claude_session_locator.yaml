# Parity between the full Claude discovery walk and the two paths a scoped run
# uses: the by-name lookup and the located-source build. Each case writes its own
# source tree, drives the production adapter over it, and asserts the exact set
# of filesystem operations the step performs, so a lookup that reads a fourth
# place, a build that walks the tree, or a probe that stats during construction
# fails here.
#
# Every located case runs the full walk first, then the located build over the
# same tree with the evidence the walk left behind, and compares the readable
# members field for field. A case may name the fields it allows to differ, and
# nothing else.
requiredNames:
  - root-hit
  - miss
  - subagent-located
  - subagent-probe
  - workflow-located
  - duplicate-root
  - two-hit
  - stale-owner
  - teammate-unique
  - teammate-ambiguous
  - stored-link-kept-gap
  - stored-child-gone
  - source-gone
  - source-id-mismatch
root: /claude
cases:
  - name: root-hit
    files:
      - path: project-a/11111111-1111-4111-8111-111111111111.jsonl
        body: |
          {"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/work/project","message":{"role":"user","content":"hello"}}
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      sources:
        - project-a/11111111-1111-4111-8111-111111111111.jsonl
      readdirs:
        - "."
        - project-a
      stats:
        - project-a/11111111-1111-4111-8111-111111111111.jsonl
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: project-a/11111111-1111-4111-8111-111111111111.jsonl
      reads: []
      stats:
        - project-a/11111111-1111-4111-8111-111111111111.jsonl
      readdirs:
        - project-a/11111111-1111-4111-8111-111111111111/subagents
      wantMembers:
        - "11111111-1111-4111-8111-111111111111"

  - name: miss
    files: []
    lookup:
      id: "11111111-1111-4111-8111-111111111111"
      sources: []
      searched:
        - harness: claude-code
          method: name-pattern
          location: /claude/*/11111111-1111-4111-8111-111111111111.jsonl
        - harness: claude-code
          method: name-pattern
          location: /claude/*/*/subagents/11111111-1111-4111-8111-111111111111.jsonl
        - harness: claude-code
          method: name-pattern
          location: /claude/*/*/subagents/workflows/wf_*/11111111-1111-4111-8111-111111111111.jsonl
      readdirs:
        - "."
      stats: []

  - name: subagent-located
    files:
      - path: project-a/22222222-2222-4222-8222-222222222222.jsonl
        body: |
          {"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/work/project","message":{"role":"user","content":"drive"}}
      - path: project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
        body: |
          {"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","isSidechain":true,"agentId":"abcdef01","cwd":"/work/project","message":{"role":"user","content":"work"}}
    lookup:
      id: agent-abcdef01
      sources:
        - project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
      readdirs:
        - "."
        - project-a
        - project-a/22222222-2222-4222-8222-222222222222/subagents/workflows
      stats:
        - project-a/agent-abcdef01.jsonl
        - project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
    located:
      id: agent-abcdef01
      path: project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
      storedParent: "22222222-2222-4222-8222-222222222222"
      contextPaths:
        - project-a/22222222-2222-4222-8222-222222222222.jsonl
      reads: []
      stats:
        - project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
        - project-a/22222222-2222-4222-8222-222222222222.jsonl
      readdirs: []
      wantMembers:
        - agent-abcdef01

  - name: subagent-probe
    files:
      - path: project-a/22222222-2222-4222-8222-222222222222.jsonl
        body: |
          {"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","cwd":"/work/project","message":{"role":"user","content":"drive"}}
      - path: project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
        body: |
          {"sessionId":"22222222-2222-4222-8222-222222222222","type":"user","isSidechain":true,"agentId":"abcdef01","cwd":"/work/project","message":{"role":"user","content":"work"}}
    located:
      id: agent-abcdef01
      path: project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
      contextPaths:
        - project-a/22222222-2222-4222-8222-222222222222.jsonl
      reads: []
      stats:
        - project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef01.jsonl
        - project-a/22222222-2222-4222-8222-222222222222.jsonl
      readdirs: []
      wantMembers:
        - agent-abcdef01
      wantProbe:
        kind: path
        path: project-a/22222222-2222-4222-8222-222222222222.jsonl

