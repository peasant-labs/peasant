  - name: stored-link-kept-gap
    # The located build still emits a probe when the child's own transcript
    # names a parent: the adapter never asks the store, so a probe for a parent
    # the link step proved stored is correct here. The core owns the stop -- it
    # asks the store once per probe hit and never builds a recorded ancestor.
    files:
      - path: project-a/11111111-1111-4111-8111-111111111111.jsonl
        body: |
          {"sessionId":"11111111-1111-4111-8111-111111111111","type":"user","cwd":"/work/project","message":{"role":"user","content":"no teammate evidence"}}
    located:
      id: "11111111-1111-4111-8111-111111111111"
      path: project-a/11111111-1111-4111-8111-111111111111.jsonl
      storedParent: "55555555-5555-4555-8555-555555555555"
      allowedDiffs:
        - parentUUID
      reads: []
      stats:
        - project-a/11111111-1111-4111-8111-111111111111.jsonl
      readdirs:
        - project-a/11111111-1111-4111-8111-111111111111/subagents
      wantMembers:
        - "11111111-1111-4111-8111-111111111111"

