      readdirs:
        - "."
        - project-a
        - project-a/22222222-2222-4222-8222-222222222222/subagents/workflows
      stats:
        - project-a/agent-abcdef02.jsonl
        - project-a/22222222-2222-4222-8222-222222222222/subagents/agent-abcdef02.jsonl
        - project-a/22222222-2222-4222-8222-222222222222/subagents/workflows/wf_run/agent-abcdef02.jsonl
    located:
      id: agent-abcdef02
      path: project-a/22222222-2222-4222-8222-222222222222/subagents/workflows/wf_run/agent-abcdef02.jsonl
      storedParent: "22222222-2222-4222-8222-222222222222"
      contextPaths:
