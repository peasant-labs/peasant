declared_page_cases: 1
page_cases:
  - name: sparse-sequence-pages-are-session-scoped
    fixture: current-reader-pages
    session_id: ses_current_reader_a
    page_size: 2
    pages:
      - ids: [sm_current_first, sm_current_equal_time]
        seqs: [2, 7]
        has_next: true
      - ids: [sm_current_late, sm_current_last]
        seqs: [20, 41]
        has_next: false

declared_malformed_cases: 8
malformed_cases:
