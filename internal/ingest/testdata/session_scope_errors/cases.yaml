# Method goldens for a session-scope miss. Each case states the misses the core
# would record and the three renderings they must produce: Reason() (one line
# for `open`), FixLine() (the fix clause alone), and Error() (the labelled
# block). Every case is rendered twice, once with no prefix and once with the
# prefix below, because a suggested command must carry the store the run used.
#
# The block's layout is part of the contract: the label column, the hanging
# indent, the searched rows, and the wrap of the two long prose fields. A change
# to any of them is a change to what the user reads.
prefix: peasant --data-dir '/srv/peasant'
cases:
    - name: not_found
      command: harvest
      store: attached
      misses:
        - id: 0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60
          reason: not_found
          searched:
            - harness: claude-code
              method: name_pattern
              location: ~/.claude/projects/*/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl and ~/.claude/projects/*/*/subagents/{,workflows/wf_*/}0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
            - harness: codex
              method: name_pattern
              location: ~/.codex/sessions/*/*/*/rollout-*-0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
            - harness: cursor
              method: name_pattern
              location: ~/.cursor/projects/*/agent-transcripts/{0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60,*/subagents/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60}.jsonl
            - harness: opencode
              method: sqlite_row
              location: session row in ~/.local/share/opencode/opencode.db
            - harness: opencode
              method: unsupported
              location: ""
              reason: file_body
            - harness: strike
              method: name_pattern
              location: ~/.strike/sessions/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
            - harness: pi
              method: unsupported
              location: ""
              reason: file_header
      bare:
        reason: 'session 0f3c... was not found, so nothing was recorded; searched store, claude-code, codex, cursor, opencode (SQLite), strike; cannot search by id: opencode (legacy JSON), pi'
        fix: check the id with `peasant sessions list`, or run `peasant harvest` once without --session, then retry
        block: |-
            peasant: harvest failed: session 0f3c... was not found, so nothing was recorded
              what:     this session-scoped harvest looked for session 0f3c... and no enabled source holds it
              why:      the store has no row for this id, and no harness that can search by id has a file or row with it
              where:    session lookup (ingest scoped locate)
              when:     before any session was swept, recorded, or indexed
              searched:
                store         no recorded session with this id
                claude-code   ~/.claude/projects/*/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl and ~/.claude/projects/*/*/subagents/{,workflows/wf_*/}0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
                codex         ~/.codex/sessions/*/*/*/rollout-*-0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
                cursor        ~/.cursor/projects/*/agent-transcripts/{0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60,*/subagents/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60}.jsonl
                opencode      session row in ~/.local/share/opencode/opencode.db
                opencode      legacy JSON storage: cannot be searched by id (the id is only in the file body)
                strike        ~/.strike/sessions/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
                pi            cannot be searched by id (the id is only in the file header)
              impact:   no session was recorded or changed. Start-up maintenance (recovery of interrupted writes,
                        store migration, search-index repair) may still have run. No full scan was run.
              fix:      check the id with `peasant sessions list`, or run `peasant harvest` once without
                        --session, then retry
      prefixed:
        reason: 'session 0f3c... was not found, so nothing was recorded; searched store, claude-code, codex, cursor, opencode (SQLite), strike; cannot search by id: opencode (legacy JSON), pi'
        fix: check the id with `peasant --data-dir '/srv/peasant' sessions list`, or run `peasant --data-dir '/srv/peasant' harvest` once without --session, then retry
        block: |-
            peasant: harvest failed: session 0f3c... was not found, so nothing was recorded
              what:     this session-scoped harvest looked for session 0f3c... and no enabled source holds it
              why:      the store has no row for this id, and no harness that can search by id has a file or row with it
              where:    session lookup (ingest scoped locate)
              when:     before any session was swept, recorded, or indexed
              searched:
                store         no recorded session with this id
                claude-code   ~/.claude/projects/*/0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl and ~/.claude/projects/*/*/subagents/{,workflows/wf_*/}0f3c1a2b-4d5e-4f60-8a71-9b2c3d4e5f60.jsonl
