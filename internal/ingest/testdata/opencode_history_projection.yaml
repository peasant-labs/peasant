# Typed OpenCode history materialization fixture. Every case drives the real
# fork/revert materializer, the section 3.2 classifier, and the shared
# projection builder over sanitized native JSON rows. Copied rows decode under
# their captured source identity and receive the child identity the copy proof
# records, exactly as the read-only native fork read does.
