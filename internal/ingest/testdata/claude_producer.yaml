  - name: root-plain
    transcript: |
      {"type":"user","uuid":"u1","sessionId":"99d59925-36bc-424c-a789-8be54d9702ba","timestamp":"2026-01-01T00:00:00Z","message":{"role":"user","content":"hello there"}}
