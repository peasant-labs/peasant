# Claude managed-generation producer fixtures.
#
# Each case captures one Claude transcript as bytes and states, literally, the
# generation the production builder must emit from it: the classifier's record
# and block native keys (observed as the persisted `block:` aliases, in resolved
# order), the admitted submission keys (the `accept:` aliases), the shared
# counts, the prose-title refs, and each stored entry's role, entry type, part
# type, thinking flag, depth, parent link, tool correlation, private extension,
# raw size and preview. A refusal case states that the builder must refuse and
# that the refusal must not carry the recorded locator or a raw kernel cause.
#
# The default session is 99d59925-36bc-424c-a789-8be54d9702ba; a case that
# names another recorded session or a parent states it.
#
# The managed stream is pinned directly rather than by comparing against the
# retained entry stream: the managed block channels deliberately differ from the
# retained shape where the plan requires it (a tool result whose call was never
# observed is demoted to depth 0 and names its source tool id directly, and a
# tool entry's content preview is the projection's own tool payload), so a
# field-for-field retained comparison would assert the wrong contract.
