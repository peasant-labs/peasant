# Automatic claims read the pipeline's FirstStored flag, never the diff status.
# These cases pin the filter itself; the production write site is covered by the
# pipeline-level auto-claim tests in claim_test.go.
requiredNames:
  - first-stored-new-included
  - first-stored-active-included
  - not-first-stored-skipped
  - failed-or-excluded-skipped
cases:
  - name: first-stored-new-included
    results:
      - {id: new-session, status: new, firstStored: true}
    want: [new-session]
  - name: first-stored-active-included
    results:
      - {id: active-session, status: active, firstStored: true}
    want: [active-session]
  - name: not-first-stored-skipped
    results:
      - {id: updated-session, status: updated, firstStored: false}
      - {id: rebuilt-session, status: updated, firstStored: false}
    want: []
  - name: failed-or-excluded-skipped
    results:
      - {id: failed-session, status: new, firstStored: true, error: true}
      - {id: excluded-session, status: new, firstStored: true, excluded: true}
      - {id: kept-session, status: new, firstStored: true}
    want: [kept-session]
