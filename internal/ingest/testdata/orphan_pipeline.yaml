            - 'pipeline: re-queue stale parent-linked origin verdicts'
        expectParentCache:
          22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectOrigin:
          22222222-2222-4222-8222-222222222222: {verdict: unknown, version: 0}
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: {verdict: agent, version: 3}
    expectStored:
