# Two-pass repair of a stored spawned child. The settled OpenCode child is
# stored first, while its parent is absent: its FK cache stays NULL, and only
# its durable publication snapshot names the parent. It already carries the
# unknown verdict at the current rule version. The first harvest discovers the
# parent only; the reverse heal sets the child's cache and re-queues its origin
# in the same statement, so after that harvest the child is linked and still
# unknown at version 0. The second harvest's resolve pass judges the linked
# child and settles it agent at the rule version. The parent itself is first
# written by the first harvest, so the resolve pass, which judges only rows an
# earlier run stored, settles it on the second.
  - name: stored-child-heals-then-reclassifies-agent-over-two-harvests
    runs:
      - discovered:
          - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectParentCache:
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectOrigin:
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb:
            verdict: unknown
            version: 0
          aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:
            verdict: unknown
            version: 0
      - discovered:
          - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectParentCache:
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectOrigin:
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb:
            verdict: agent
            version: 3
          aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:
            verdict: unknown
            version: 3
    seedCapture:
      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
    seedOrigin:
      bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb:
        verdict: unknown
        version: 3
    expectParentCacheAfterSeed:
      bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: null
    allowed: null
    excluded: []
    filtered: null
    failParents: []
    expectStored:
      - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    expectNotStored: []
    expectParentCache:
      bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    expectLogicalParent: {}
  - name: origin-requeue-failure-warns-heals-and-retries-without-discovery
    invalidateFault: "synthetic database failure at /private/synthetic-store/private-value"
    seedStored:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
    seedCapture:
      - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
    seedOrigin:
      22222222-2222-4222-8222-222222222222: {verdict: unknown, version: 3}
      bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: {verdict: unknown, version: 3}
    expectParentCacheAfterSeed:
      22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
      bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: null
    runs:
      - discovered:
          - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectWarning:
          contains:
            - 'pipeline: re-queue stale parent-linked origin verdicts'
            - '"step":"reconcile orphan parent caches"'
            - '"reason":"unavailable"'
            - 'stale unknown origin verdicts were not requeued'
            - 'the store origin requeue operation failed'
            - 'existing parent links stay unchanged; cache healing continues'
            - 'the next harvest retries even without parent discovery'
            - 'restore database access and rerun harvest'
          excludes:
            - '/private/synthetic-store'
            - 'private-value'
            - 'synthetic database failure'
            - 'child keeps a nil FK cache'
            - 'next harvest that discovers the same parent'
        expectParentCache:
          22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        expectOrigin:
          22222222-2222-4222-8222-222222222222: {verdict: unknown, version: 3}
          bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb: {verdict: unknown, version: 0}
      - discovered: []
        expectWarning:
