# Origin requeue arms. The stored parent root is seeded first so the stuck
# child's FK cache lands; the child is then settled unknown at the current
# origin rule version, the verdict judged before its parent link existed. The
# parent root seeds unjudged, and the harvest's own resolve pass settles it
# unknown at the rule version before the reconcile pass runs. The reconcile pass
# must re-queue the child even when the harvest names no reconciliation target
# or finds no cache to heal, and must leave the parentless root settled.
  - name: no-target-requeues-stuck-child-keeps-parent-root
    runs:
      - discovered:
          - 66666666-6666-4636-8636-666666666666
        expectParentCache:
          22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
        expectOrigin:
          22222222-2222-4222-8222-222222222222:
            verdict: unknown
            version: 0
          11111111-1111-4111-8111-111111111111:
            verdict: unknown
            version: 3
    seedStored:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
    seedOrigin:
      22222222-2222-4222-8222-222222222222:
        verdict: unknown
        version: 3
    expectParentCacheAfterSeed:
      22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
      11111111-1111-4111-8111-111111111111: null
    allowed: null
    excluded: []
    filtered: null
    failParents: []
    expectStored:
      - 66666666-6666-4636-8636-666666666666
    expectNotStored: []
    expectParentCache:
      22222222-2222-4222-8222-222222222222: 11111111-1111-4111-8111-111111111111
    expectLogicalParent: {}
