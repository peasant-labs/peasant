# Synthetic Strike lifecycle, control and metadata events (#449). One case
# per event kind; payload shapes follow Strike pkg/protocol. No real data.
required_kinds:
  - session.header
  - agent.selected
  - effort.selected
  - autonomy.selected
  - permission.mode
  - fast.selected
  - context.controls
  - session.meta
  - prompt.effective
  - permission.asked
  - permission.resolved
  - permission.decided
  - admission.decided
  - question.asked
  - question.resolved
  - turn.steered
  - verification.started
  - verification.completed
  - harness.progress
  - phase.changed
  - plan.handoff
  - artifact.updated
  - ledger.updated
  - phase.grant_approved
  - files.invalidated
  - path.overlap
  - engine.error
  - child.started
  - child.completed
  - child.escalated
  - delegation.changed
  - wait.started
  - wait.resolved
  - agent.contract.timeout
  - team.roster
  - provider.retrying
