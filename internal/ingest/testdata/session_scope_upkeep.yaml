# Upkeep guards a parity table cannot see: the evidence cache is read by path
# only on a scoped run, and the loader refuses a case that cannot witness it.
requiredNames:
  - read-recorder-stale-origin
  - read-recorder-cohort
  - empty-expected-set
  - stale-path-is-context
refusals:
  - name: empty-expected-set
    guard: read_recorder
    expected: []
    stalePaths: []
    contextPaths: []
    wantErrorContain: "empty expected evidence set"
  - name: stale-path-is-context
    guard: read_recorder
    expected:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
    stalePaths:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
    contextPaths:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
    wantErrorContain: "also a context path"
cases:
  - name: read-recorder-cohort
    guard: read_recorder
    staleOrigin: false
    deleteSource: false
    wantWholeLoads: 0
    wantRequested:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
  - name: read-recorder-stale-origin
    guard: read_recorder
    staleOrigin: true
    deleteSource: true
    stalePaths:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
    contextPaths: []
    wantWholeLoads: 0
    wantRequested:
      - project-a/11111111-1111-4111-8111-111111111111.jsonl
