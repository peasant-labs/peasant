# One real ordinary harvest of a mixed conversation/control Claude session,
# plus its unknown-kind counterpart. Both cases run the production adapter, the
# production pipeline and the production store writer; the assertions then read
# the reopened store, the export path and the publication preparation.
#
# The control case must certify complete and stay readable by the complete-
# content readers export and publication use: a control record dropped or
# stored incomplete would still preview, so only the durable read proves it.
# Unknown evidence with source traversal coordinates is full but partial.
required_names:
  - control-records-certify
  - codex-control-records-certify
  - unknown-record-refused
cases:
  - name: control-records-certify
    transcript: |
      {"sessionId":"SESSION_ID","type":"user","uuid":"entry-first","timestamp":"2026-01-01T00:00:00Z","cwd":"/workspace","gitBranch":"main","message":{"role":"user","content":"inspect the fixture"}}
      {"sessionId":"SESSION_ID","type":"assistant","uuid":"entry-second","timestamp":"2026-01-01T00:00:01Z","message":{"role":"assistant","model":"claude-sonnet-4-20250514","content":[{"type":"text","text":"I will inspect the fixture now."}]}}
      {"sessionId":"SESSION_ID","type":"permission-mode","permissionMode":"acceptEdits","uuid":"entry-third","timestamp":"2026-01-01T00:00:02Z"}
      {"sessionId":"SESSION_ID","type":"attachment","attachment":{"type":"hook_success"},"uuid":"entry-fourth","timestamp":"2026-01-01T00:00:03Z"}
    capture_status: complete
    capture_format: full
    failure_code: ""
    control_part_type: permission-mode
    control_preview: "permission mode: acceptEdits"
    control_extra_members:
      permissionMode: acceptEdits
    export_accepted: true
    publication_ready: true
    preflight_accepts: true
  - name: codex-control-records-certify
    harness: codex
    transcript: |
      {"timestamp":"2026-01-01T00:00:00Z","type":"session_meta","payload":{"id":"SESSION_ID","cwd":"/synthetic/workspace","model_provider":"openai"}}
      {"timestamp":"2026-01-01T00:00:00.500Z","type":"turn_context","payload":{"model":"synthetic-model","effort":"medium"}}
      {"timestamp":"2026-01-01T00:00:01Z","type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"input_text","text":"inspect the fixture"}]}}
      {"timestamp":"2026-01-01T00:00:02Z","type":"response_item","payload":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"I will inspect the fixture now."}]}}
      {"timestamp":"2026-01-01T00:00:03Z","type":"world_state","payload":{"state":{"mode":"synthetic"}}}
      {"timestamp":"2026-01-01T00:00:04Z","type":"event_msg","payload":{"type":"sub_agent_activity","kind":"started","agent_path":"/root/worker"}}
      {"timestamp":"2026-01-01T00:00:05Z","type":"event_msg","payload":{"type":"patch_apply_end","call_id":"patch-1","status":"completed"}}
      {"timestamp":"2026-01-01T00:00:06Z","type":"event_msg","payload":{"type":"thread_settings_applied","thread_settings":{"model":"synthetic-model"}}}
      {"timestamp":"2026-01-01T00:00:07Z","type":"compacted","payload":{"summary":"synthetic summary"}}
      {"timestamp":"2026-01-01T00:00:08Z","type":"event_msg","payload":{"type":"web_search_end","call_id":"search-1","query":"synthetic query"}}
    capture_status: complete
    capture_format: full
    failure_code: ""
    control_part_type: compacted
    control_preview: "Context compacted"
    control_extra_members:
      summary: synthetic summary
    export_accepted: true
    publication_ready: true
    preflight_accepts: true
  - name: unknown-record-refused
    transcript: |
      {"sessionId":"SESSION_ID","type":"user","uuid":"entry-first","timestamp":"2026-01-01T00:00:00Z","cwd":"/workspace","gitBranch":"main","message":{"role":"user","content":"inspect the fixture"}}
      {"sessionId":"SESSION_ID","type":"assistant","uuid":"entry-second","timestamp":"2026-01-01T00:00:01Z","message":{"role":"assistant","model":"claude-sonnet-4-20250514","content":[{"type":"text","text":"I will inspect the fixture now."}]}}
      {"sessionId":"SESSION_ID","type":"future-record","payload":"a record kind no shipped build represents","uuid":"entry-third","timestamp":"2026-01-01T00:00:02Z"}
    capture_status: incomplete
    capture_format: full
    failure_code: unknown_data_retained
    retained_kind: future-record
    export_accepted: true
    publication_ready: true
    preflight_accepts: true
