requiredNames:
  - real invocation after a cd
  - assignment-prefixed invocation
  - heredoc-only mention
  - non-shell arguments
  - multiple URLs in one result
  - duplicate calls
  - gh pr view is not an invocation
  - errored call
  - raw text arguments
  - two distinct pull requests, first-seen order
  - last matching url wins
  - pull zero ignored
  - piped gh pr create
  - quoted mention
  - sudo gh pr create
  - sudo with an environment flag
  - command gh pr create
  - env assignment before gh pr create
  - bash -c script
  - sh -lc script
  - sudo bash -c script
  - windows gh executable
  - bash -c echoes a quoted mention
  - bash -c echoes the words
  - bash -c with an escaped quote
  - bash -c plain script
  - command -v is not an invocation
  - command with the default-search flag
  - nohup --help is not an invocation
  - nohup gh pr create
  - sudo with the end-of-options marker
  - sudo with an unknown flag
  - sudo -u user
  - sudo -u consumes the command word
  - env -u variable
  - env -u consumes the command word
  - bash -o pipefail -c script
  - bash -c nested two levels
  - bash -c nested four levels
  - bash -c nested five levels
  - bash -c non-literal script
  - quoted command word
  - bash with a script file
  - env long unset option
  - bash -c with an escaped title
urlRequiredNames:
  - fragment after the number
  - pull request sub-page
  - query string after the number
  - dotted owner and dashed repository
  - another host is not GitHub
  - plural pulls path
  - no pull request URL
  - created url first, lower number later
cases:
  - name: real invocation after a cd
    calls:
      - arguments: |
          {"command":"cd /home/dev/storytold/photocraft && gh pr create --title \"Add the export flow\" --body-file body.md"}
        result: |
          https://github.com/storytold/photocraft/pull/12
    expected:
      - owner: storytold
        repo: photocraft
        number: 12
        url: https://github.com/storytold/photocraft/pull/12
  - name: assignment-prefixed invocation
    calls:
      - arguments: |
          {"command":"GH_TOKEN=ghp_example gh pr create --fill --base develop"}
        result: |
          Warning: 1 uncommitted change
          https://github.com/acme/widgets/pull/7
    expected:
      - owner: acme
        repo: widgets
        number: 7
        url: https://github.com/acme/widgets/pull/7
  - name: heredoc-only mention
    calls:
      - arguments: |
          {"command":"cat > notes.md <<'EOF'\ngh pr create --title mentioned-only https://github.com/acme/widgets/pull/9\nEOF"}
        result: |
          notes written
          https://github.com/acme/widgets/pull/9
    expected: []
  - name: non-shell arguments
    calls:
      - arguments: |
          {"file_path":"/work/app.go","content":"gh pr create --fill"}
        result: |
          https://github.com/acme/widgets/pull/11
    expected: []
  - name: multiple URLs in one result
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          Creating pull request for feature in acme/widgets
          https://github.com/acme/widgets/compare/develop...feature
          https://github.com/acme/widgets/pull/31
    expected:
      - owner: acme
        repo: widgets
        number: 31
        url: https://github.com/acme/widgets/pull/31
  - name: duplicate calls
    calls:
      - arguments: |
          {"command":"gh pr create --title first --fill"}
        result: |
          https://github.com/acme/widgets/pull/21
      - arguments: |
          {"cmd":"gh pr create --title second --fill"}
        result: |
          https://github.com/acme/widgets/pull/21
    expected:
      - owner: acme
        repo: widgets
        number: 21
        url: https://github.com/acme/widgets/pull/21
  - name: gh pr view is not an invocation
    calls:
      - arguments: |
          {"command":"gh pr view 12 --json url"}
        result: |
          {"url":"https://github.com/storytold/photocraft/pull/12"}
    expected: []
  - name: errored call
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          https://github.com/acme/widgets/pull/13
        isError: true
    expected: []
  - name: raw text arguments
    calls:
      - arguments: |
          cd /home/dev/acme && gh pr create --fill
        result: |
          https://github.com/acme/widgets/pull/15
    expected:
      - owner: acme
        repo: widgets
        number: 15
        url: https://github.com/acme/widgets/pull/15
  - name: two distinct pull requests, first-seen order
    calls:
      - arguments: |
          {"command":"gh pr create --repo acme/web --fill"}
        result: |
          https://github.com/acme/web/pull/42
      - arguments: |
          {"command":"gh pr create --repo acme/api --fill"}
        result: |
          https://github.com/acme/api/pull/42
      - arguments: |
          {"command":"gh pr create --repo acme/web --fill"}
        result: |
          https://github.com/acme/web/pull/42
    expected:
      - owner: acme
        repo: web
        number: 42
        url: https://github.com/acme/web/pull/42
      - owner: acme
        repo: api
        number: 42
        url: https://github.com/acme/api/pull/42
  - name: last matching url wins
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          Draft pull request https://github.com/acme/api/pull/5
          Pull request created https://github.com/acme/api/pull/31
    expected:
      - owner: acme
        repo: api
        number: 31
        url: https://github.com/acme/api/pull/31
  - name: pull zero ignored
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/0
    expected: []
  - name: piped gh pr create
    calls:
      - arguments: |
          {"command":"gh pr create --fill | tee /tmp/pr.log"}
        result: |
          https://github.com/acme/api/pull/56
    expected:
      - owner: acme
        repo: api
        number: 56
        url: https://github.com/acme/api/pull/56
  - name: quoted mention
    calls:
      - arguments: |
          {"command":"echo \"gh pr create\""}
        result: |
          https://github.com/acme/api/pull/57
    expected: []
  - name: sudo gh pr create
    calls:
      - arguments: |
          {"command":"sudo gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/61
    expected:
      - owner: acme
        repo: api
        number: 61
        url: https://github.com/acme/api/pull/61
  - name: sudo with an environment flag
    calls:
      - arguments: |
          {"command":"sudo -E gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/62
    expected:
      - owner: acme
        repo: api
        number: 62
        url: https://github.com/acme/api/pull/62
  - name: command gh pr create
    calls:
      - arguments: |
          {"command":"command gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/63
    expected:
      - owner: acme
        repo: api
        number: 63
        url: https://github.com/acme/api/pull/63
  - name: env assignment before gh pr create
    calls:
      - arguments: |
          {"command":"env GH_TOKEN=ghp_example gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/64
    expected:
      - owner: acme
        repo: api
        number: 64
        url: https://github.com/acme/api/pull/64
  - name: bash -c script
    calls:
      - arguments: |
          {"command":"bash -c 'cd /home/dev/acme && gh pr create --fill'"}
        result: |
          https://github.com/acme/api/pull/65
    expected:
      - owner: acme
        repo: api
        number: 65
        url: https://github.com/acme/api/pull/65
  - name: sh -lc script
    calls:
      - arguments: |
          {"command":"sh -lc \"gh pr create --fill\""}
        result: |
          https://github.com/acme/api/pull/66
    expected:
      - owner: acme
        repo: api
        number: 66
        url: https://github.com/acme/api/pull/66
  - name: sudo bash -c script
    calls:
      - arguments: |
          {"command":"sudo bash -c 'gh pr create --fill'"}
        result: |
          https://github.com/acme/api/pull/67
    expected:
      - owner: acme
        repo: api
        number: 67
        url: https://github.com/acme/api/pull/67
  - name: windows gh executable
    calls:
      - arguments: |
          {"command":"gh.exe pr create --fill"}
        result: |
          https://github.com/acme/api/pull/68
    expected:
      - owner: acme
        repo: api
        number: 68
        url: https://github.com/acme/api/pull/68
  - name: bash -c echoes a quoted mention
    calls:
      - arguments: |
          {"command":"bash -c 'echo \"gh pr create\"'"}
        result: |
          https://github.com/acme/api/pull/69
    expected: []
  - name: bash -c echoes the words
    calls:
      - arguments: |
          {"command":"bash -c 'echo gh pr create'"}
        result: |
          https://github.com/acme/api/pull/70
    expected: []
  # The -c script keeps the backslash a shell would consume, so detection deliberately
  # does not unwrap it: read back, the echoed string would look like a real invocation.
  - name: bash -c with an escaped quote
    calls:
      - arguments: |
          {"command":"bash -c \"echo \\\"; gh pr create; echo \\\"\""}
        result: |
          https://github.com/acme/api/pull/71
    expected: []
  - name: bash -c plain script
    calls:
      - arguments: |
          {"command":"bash -c 'gh pr create --fill'"}
        result: |
          https://github.com/acme/api/pull/72
    expected:
      - owner: acme
        repo: api
        number: 72
        url: https://github.com/acme/api/pull/72
  # `command -v` reports on the command instead of running it.
  - name: command -v is not an invocation
    calls:
      - arguments: |
          {"command":"command -v gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/73
    expected: []
  - name: command with the default-search flag
    calls:
      - arguments: |
          {"command":"command -p gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/74
    expected:
      - owner: acme
        repo: api
        number: 74
        url: https://github.com/acme/api/pull/74
  # `nohup --help` prints usage instead of running the command.
  - name: nohup --help is not an invocation
    calls:
      - arguments: |
          {"command":"nohup --help gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/75
    expected: []
  - name: nohup gh pr create
    calls:
      - arguments: |
          {"command":"nohup gh pr create"}
        result: |
          https://github.com/acme/api/pull/76
    expected:
      - owner: acme
        repo: api
        number: 76
        url: https://github.com/acme/api/pull/76
  - name: sudo with the end-of-options marker
    calls:
      - arguments: |
          {"command":"sudo -- gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/77
    expected:
      - owner: acme
        repo: api
        number: 77
        url: https://github.com/acme/api/pull/77
  # An option detection does not know becomes the wrapped command, so it fails closed.
  - name: sudo with an unknown flag
    calls:
      - arguments: |
          {"command":"sudo -Q gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/78
    expected: []
  - name: sudo -u user
    calls:
      - arguments: |
          {"command":"sudo -u root gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/79
    expected:
      - owner: acme
        repo: api
        number: 79
        url: https://github.com/acme/api/pull/79
  # -u takes a value, so `gh` is the user and `pr` is the command.
  - name: sudo -u consumes the command word
    calls:
      - arguments: |
          {"command":"sudo -u gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/80
    expected: []
  - name: env -u variable
    calls:
      - arguments: |
          {"command":"env -u GH_TOKEN gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/81
    expected:
      - owner: acme
        repo: api
        number: 81
        url: https://github.com/acme/api/pull/81
  - name: env -u consumes the command word
    calls:
      - arguments: |
          {"command":"env -u gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/82
    expected: []
  - name: bash -o pipefail -c script
    calls:
      - arguments: |
          {"command":"bash -o pipefail -c 'gh pr create --fill'"}
        result: |
          https://github.com/acme/api/pull/83
    expected:
      - owner: acme
        repo: api
        number: 83
        url: https://github.com/acme/api/pull/83
  - name: bash -c nested two levels
    calls:
      - arguments: |
          {"command":"bash -c 'bash -c \"gh pr create --fill\"'"}
        result: |
          https://github.com/acme/api/pull/84
    expected:
      - owner: acme
        repo: api
        number: 84
        url: https://github.com/acme/api/pull/84
  # Four nested -c scripts sit exactly on maxWrapperDepth. Each level splices the next
  # level's quotes in as separate words (the '"'"' idiom), so no level carries a backslash.
  - name: bash -c nested four levels
    calls:
      - arguments: |
          {"command":"bash -c 'bash -c '\"'\"'bash -c \"bash -c '\"'\"'\"'\"'\"'\"'\"'\"'gh pr create --fill'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"''"}
        result: |
          https://github.com/acme/api/pull/85
    expected:
      - owner: acme
        repo: api
        number: 85
        url: https://github.com/acme/api/pull/85
  # Five nested -c scripts exceed maxWrapperDepth; the same command detects with a larger
  # budget, so the rejection is the bound and not a quoting artifact.
  - name: bash -c nested five levels
    calls:
      - arguments: |
          {"command":"bash -c 'bash -c '\"'\"'bash -c '\"'\"'\"'\"'\"'\"'\"'\"'bash -c \"bash -c '\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'gh pr create --fill'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"'\"''\"'\"''"}
        result: |
          https://github.com/acme/api/pull/86
    expected: []
  # An expansion is not a literal script, so the text it runs is unknown.
  - name: bash -c non-literal script
    calls:
      - arguments: |
          {"command":"bash -c \"$SCRIPT\""}
        result: |
          https://github.com/acme/api/pull/87
    expected: []
  # A quoted command word has no literal value, so it never matches the command name.
  - name: quoted command word
    calls:
      - arguments: |
          {"command":"\"gh\" pr create --fill"}
        result: |
          https://github.com/acme/api/pull/88
    expected: []
  # A shell given a script file runs that file, not an inline -c script.
  - name: bash with a script file
    calls:
      - arguments: |
          {"command":"bash script.sh gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/89
    expected: []
  # GNU env treats --unset as an option; the loose assignment check sees its
  # "=" and still reaches the command, matching what env actually runs.
  - name: env long unset option
    calls:
      - arguments: |
          {"command":"env --unset=GH_TOKEN gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/90
    expected:
      - owner: acme
        repo: api
        number: 90
        url: https://github.com/acme/api/pull/90
  # Knowingly accepted miss: an escaped title keeps a backslash in the literal
  # script, so the escape policy refuses to unwrap it rather than guess.
  - name: bash -c with an escaped title
    calls:
      - arguments: |
          {"command":"bash -c \"gh pr create --title \\\"feat: x\\\" --fill\""}
        result: |
          https://github.com/acme/api/pull/91
    expected: []
urls:
  - name: fragment after the number
    text: https://github.com/acme/widgets/pull/42#issuecomment-1
    expected:
      owner: acme
      repo: widgets
      number: 42
      url: https://github.com/acme/widgets/pull/42
  - name: pull request sub-page
    text: https://github.com/acme/widgets/pull/43/files
    expected:
      owner: acme
      repo: widgets
      number: 43
      url: https://github.com/acme/widgets/pull/43
  - name: query string after the number
    text: https://github.com/acme/widgets/pull/44?diff=split
    expected:
      owner: acme
      repo: widgets
      number: 44
      url: https://github.com/acme/widgets/pull/44
  - name: dotted owner and dashed repository
    text: https://github.com/dayvid.pham/my-repo_name/pull/45
    expected:
      owner: dayvid.pham
      repo: my-repo_name
      number: 45
      url: https://github.com/dayvid.pham/my-repo_name/pull/45
  - name: another host is not GitHub
    text: https://gitlab.com/acme/widgets/pull/46
    expected: {}
  - name: plural pulls path
    text: https://github.com/acme/widgets/pulls/47
    expected: {}
  - name: no pull request URL
    text: pull request created successfully
    expected: {}
  - name: created url first, lower number later
    text: |
      https://github.com/acme/api/pull/31
      Draft pull request https://github.com/acme/api/pull/5
    expected:
      owner: acme
      repo: api
      number: 5
      url: https://github.com/acme/api/pull/5
