requiredNames:
  - real invocation after a cd
  - assignment-prefixed invocation
  - heredoc-only mention
  - non-shell arguments
  - multiple URLs in one result
  - duplicate calls
  - gh pr view is not an invocation
  - errored call
  - raw text arguments
  - two distinct pull requests, first-seen order
  - last matching url wins
  - pull zero ignored
  - piped gh pr create
  - quoted mention
urlRequiredNames:
  - fragment after the number
  - pull request sub-page
  - query string after the number
  - dotted owner and dashed repository
  - another host is not GitHub
  - plural pulls path
  - no pull request URL
  - created url first, lower number later
cases:
  - name: real invocation after a cd
    calls:
      - arguments: |
          {"command":"cd /home/dev/storytold/photocraft && gh pr create --title \"Add the export flow\" --body-file body.md"}
        result: |
          https://github.com/storytold/photocraft/pull/12
    expected:
      - owner: storytold
        repo: photocraft
        number: 12
        url: https://github.com/storytold/photocraft/pull/12
  - name: assignment-prefixed invocation
    calls:
      - arguments: |
          {"command":"GH_TOKEN=ghp_example gh pr create --fill --base develop"}
        result: |
          Warning: 1 uncommitted change
          https://github.com/acme/widgets/pull/7
    expected:
      - owner: acme
        repo: widgets
        number: 7
        url: https://github.com/acme/widgets/pull/7
  - name: heredoc-only mention
    calls:
      - arguments: |
          {"command":"cat > notes.md <<'EOF'\ngh pr create --title mentioned-only https://github.com/acme/widgets/pull/9\nEOF"}
        result: |
          notes written
          https://github.com/acme/widgets/pull/9
    expected: []
  - name: non-shell arguments
    calls:
      - arguments: |
          {"file_path":"/work/app.go","content":"gh pr create --fill"}
        result: |
          https://github.com/acme/widgets/pull/11
    expected: []
  - name: multiple URLs in one result
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          Creating pull request for feature in acme/widgets
          https://github.com/acme/widgets/compare/develop...feature
          https://github.com/acme/widgets/pull/31
    expected:
      - owner: acme
        repo: widgets
        number: 31
        url: https://github.com/acme/widgets/pull/31
  - name: duplicate calls
    calls:
      - arguments: |
          {"command":"gh pr create --title first --fill"}
        result: |
          https://github.com/acme/widgets/pull/21
      - arguments: |
          {"cmd":"gh pr create --title second --fill"}
        result: |
          https://github.com/acme/widgets/pull/21
    expected:
      - owner: acme
        repo: widgets
        number: 21
        url: https://github.com/acme/widgets/pull/21
  - name: gh pr view is not an invocation
    calls:
      - arguments: |
          {"command":"gh pr view 12 --json url"}
        result: |
          {"url":"https://github.com/storytold/photocraft/pull/12"}
    expected: []
  - name: errored call
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          https://github.com/acme/widgets/pull/13
        isError: true
    expected: []
  - name: raw text arguments
    calls:
      - arguments: |
          cd /home/dev/acme && gh pr create --fill
        result: |
          https://github.com/acme/widgets/pull/15
    expected:
      - owner: acme
        repo: widgets
        number: 15
        url: https://github.com/acme/widgets/pull/15
  - name: two distinct pull requests, first-seen order
    calls:
      - arguments: |
          {"command":"gh pr create --repo acme/web --fill"}
        result: |
          https://github.com/acme/web/pull/42
      - arguments: |
          {"command":"gh pr create --repo acme/api --fill"}
        result: |
          https://github.com/acme/api/pull/42
      - arguments: |
          {"command":"gh pr create --repo acme/web --fill"}
        result: |
          https://github.com/acme/web/pull/42
    expected:
      - owner: acme
        repo: web
        number: 42
        url: https://github.com/acme/web/pull/42
      - owner: acme
        repo: api
        number: 42
        url: https://github.com/acme/api/pull/42
  - name: last matching url wins
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          Draft pull request https://github.com/acme/api/pull/5
          Pull request created https://github.com/acme/api/pull/31
    expected:
      - owner: acme
        repo: api
        number: 31
        url: https://github.com/acme/api/pull/31
  - name: pull zero ignored
    calls:
      - arguments: |
          {"command":"gh pr create --fill"}
        result: |
          https://github.com/acme/api/pull/0
    expected: []
  - name: piped gh pr create
    calls:
      - arguments: |
          {"command":"gh pr create --fill | tee /tmp/pr.log"}
        result: |
          https://github.com/acme/api/pull/56
    expected:
      - owner: acme
        repo: api
        number: 56
        url: https://github.com/acme/api/pull/56
  - name: quoted mention
    calls:
      - arguments: |
          {"command":"echo \"gh pr create\""}
        result: |
          https://github.com/acme/api/pull/57
    expected: []
urls:
  - name: fragment after the number
    text: https://github.com/acme/widgets/pull/42#issuecomment-1
    expected:
      owner: acme
      repo: widgets
      number: 42
      url: https://github.com/acme/widgets/pull/42
  - name: pull request sub-page
    text: https://github.com/acme/widgets/pull/43/files
    expected:
      owner: acme
      repo: widgets
      number: 43
      url: https://github.com/acme/widgets/pull/43
  - name: query string after the number
    text: https://github.com/acme/widgets/pull/44?diff=split
    expected:
      owner: acme
      repo: widgets
      number: 44
      url: https://github.com/acme/widgets/pull/44
  - name: dotted owner and dashed repository
    text: https://github.com/dayvid.pham/my-repo_name/pull/45
    expected:
      owner: dayvid.pham
      repo: my-repo_name
      number: 45
      url: https://github.com/dayvid.pham/my-repo_name/pull/45
  - name: another host is not GitHub
    text: https://gitlab.com/acme/widgets/pull/46
    expected: {}
  - name: plural pulls path
    text: https://github.com/acme/widgets/pulls/47
    expected: {}
  - name: no pull request URL
    text: pull request created successfully
    expected: {}
  - name: created url first, lower number later
    text: |
      https://github.com/acme/api/pull/31
      Draft pull request https://github.com/acme/api/pull/5
    expected:
      owner: acme
      repo: api
      number: 5
      url: https://github.com/acme/api/pull/5
