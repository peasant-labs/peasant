# Pre-test steps that `make check` runs before the test passes.
#
# The gate's per-class decision table charges the whole `make check`, so these
# steps are inside the budget. The commands here mirror the `check` target's
# recipe lines; `makefile` names the source of truth so a reader can diff them.
# Each step runs alone, under the outer getrusage(RUSAGE_CHILDREN) accumulator,
# so its wall/user/system are exact.
#
# required_names is a deletion-protection manifest: it lists the five step names
# the table must carry, in execution order. Adding a step never requires editing
# it; removing one does.
required_names:
  - fmt
  - lint
  - ast-grep-scan
  - ast-grep-gate-test
  - release-guard

steps:
  - step: fmt
    program: go
    args: ["fmt", "./..."]
    makefile: "Makefile:70-75"
  - step: lint
    program: go
    args: ["vet", "./..."]
    makefile: "Makefile:81"
  - step: ast-grep-scan
    program: ast-grep
    args: ["scan", "--config", "sgconfig.yml", "."]
    makefile: "Makefile:84"
  - step: ast-grep-gate-test
    program: go
    args: ["test", "-race", "-tags=astgrep", "./internal/tui/gates/..."]
    makefile: "Makefile:90"
  - step: release-guard
    program: go
    args: ["run", "github.com/peasant-labs/schema/cmd/release-guard", "check-workflow", "--policy", ".github/release-guard.policy.yml", "--release", ".github/workflows/release.yml"]
    makefile: "Makefile:91"
