# Frozen IP-A shapes for the gate contract (SLICE-0).
#
# This fixture is the authoritative expected shape of every exported type a
# consumer (SLICE-2..SLICE-12) compiles against. contract_test.go reflects the
# real types and compares field-for-field, in order, including struct tags. A
# rename, removal, retype, retag, or reorder in the source fails the test with
# the exact field named.
#
# required_names is a deletion-protection manifest, not a row count: adding a new
# frozen shape never requires editing it; removing or renaming a required one
# does. Every `type` string is the exact reflect.Type.String() value.
required_names:
  - testgate.Record
  - testgate.Invocation
  - testgate.Runner
  - testgate.RunResult
  - testgate.Report
  - testgate.PassReport
  - testgate.Calibration
  - testgate.ReportRecord
  - testgate.ReportTest
  - testgate.ReportFinding
  - testgate.Cost
  - testgate.Entry
  - testgate.Registry
  - testgate.Budget
  - testgate.Finding

shapes:
  # --- IP-1 per-invocation record: {unit, class, wall, user, system} --------
  - name: testgate.Record
    fields:
      - { name: Unit,   type: string }
      - { name: Class,  type: testgate.Class }
      - { name: Pass,   type: testgate.PassMode }
      - { name: Wall,   type: time.Duration }
      - { name: User,   type: time.Duration }
      - { name: System, type: time.Duration }

  - name: testgate.Invocation
    fields:
      - { name: ImportPath, type: string }
      - { name: Dir,        type: string }
      - { name: Test,       type: string }
      - { name: Pass,       type: testgate.PassMode }
      - { name: Class,      type: testgate.Class }
      - { name: Args,       type: "[]string" }
      - { name: OutputDir,  type: string }
      - { name: StreamPath, type: string }
      - { name: ErrPath,    type: string }

  - name: testgate.Runner
    fields:
      - { name: Root,        type: string }
      - { name: OutDir,      type: string }
      - { name: GoBin,       type: string }
      - { name: Concurrency, type: int }
      - { name: Env,         type: "[]string" }
      - { name: SerialPassB, type: bool }

  - name: testgate.RunResult
    fields:
      - { name: Records, type: "map[testgate.PassMode][]testgate.Record" }
      - { name: Streams, type: "map[testgate.PassMode]map[string][]teststream.Record" }
      - { name: Walls,   type: "map[testgate.PassMode]time.Duration" }
      - { name: Errors,  type: "[]string" }

  # --- IP-1 report document schema (report.json) ----------------------------
  - name: testgate.Report
    fields:
      - { name: SchemaVersion,    type: int,                   json: schema_version }
      - { name: Module,           type: string,                json: module }
      - { name: Race,             type: bool,                  json: race }
      - { name: Concurrency,      type: int,                   json: concurrency }
      - { name: GOMAXPROCS,       type: int,                   json: gomaxprocs }
      - { name: ListWallMS,       type: int64,                 json: list_wall_ms }
      - { name: PassA,            type: "*testgate.PassReport", json: "pass_a,omitempty" }
      - { name: PassB,            type: "*testgate.PassReport", json: "pass_b,omitempty" }
      - { name: CombinedWallMS,   type: int64,                 json: combined_test_wall_ms }
      - { name: PreTestWallMS,    type: int64,                 json: "pre_test_wall_ms,omitempty" }
      - { name: Calibration,      type: testgate.Calibration,  json: calibration }
      - { name: Records,          type: "[]testgate.ReportRecord",  json: records }
      - { name: Findings,         type: "[]testgate.ReportFinding", json: findings }
      - { name: FailedTests,      type: "[]testgate.ReportTest",    json: failed_tests }
      - { name: InvocationErrors, type: "[]string",                json: invocation_errors }

  - name: testgate.PassReport
    fields:
      - { name: Name,     type: string, json: name }
      - { name: WallMS,   type: int64,  json: wall_ms }
      - { name: Packages, type: int,    json: packages }
      - { name: Tests,    type: int,    json: tests }

  - name: testgate.Calibration
    fields:
      - { name: L,            type: float64, json: l }
      - { name: ProbeMS,      type: int64,   json: probe_ms }
      - { name: ReferenceMS,  type: int64,   json: reference_ms }
      - { name: Inconclusive, type: bool,    json: inconclusive }

  - name: testgate.ReportRecord
    fields:
      - { name: Unit,     type: string, json: unit }
      - { name: Class,    type: string, json: class }
      - { name: Pass,     type: string, json: pass }
      - { name: WallMS,   type: int64,  json: wall_ms }
      - { name: UserMS,   type: int64,  json: user_ms }
      - { name: SystemMS, type: int64,  json: system_ms }

  - name: testgate.ReportTest
    fields:
      - { name: Package, type: string, json: package }
      - { name: Test,    type: string, json: test }

  - name: testgate.ReportFinding
    fields:
      - { name: Rule,     type: string, json: rule }
      - { name: Severity, type: string, json: severity }
      - { name: What,     type: string, json: what }
      - { name: Why,      type: string, json: why }
      - { name: Where,    type: string, json: where }
      - { name: When,     type: string, json: when }
      - { name: Means,    type: string, json: means }
      - { name: Fix,      type: string, json: fix }

  # --- IP-2 registry schema (no-race-partition.yaml) ------------------------
  - name: testgate.Cost
    fields:
      - { name: WallMS, type: int64, yaml: wall_ms }
      - { name: CPUMs,  type: int64, yaml: cpu_ms }

  - name: testgate.Entry
    fields:
      - { name: Package,         type: string,            yaml: package }
      - { name: Test,            type: string,            yaml: test }
      - { name: Class,           type: testgate.Class,    yaml: class }
      - { name: Evidence,        type: string,            yaml: evidence }
      - { name: Justification,   type: string,            yaml: justification }
      - { name: Cost,            type: testgate.Cost,     yaml: cost }
      - { name: BuildFlags,      type: "*testgate.BuildFlags", yaml: "build_flags,omitempty" }
      - { name: ExecCommandSite, type: string,            yaml: "exec_command_site,omitempty" }

  - name: testgate.Registry
    fields:
      - { name: Version,   type: int,               yaml: version }
      - { name: Partition, type: "[]testgate.Entry", yaml: partition }
      - { name: Protected, type: "[]testgate.Entry", yaml: protected }

  # --- IP-3 budget schema (budget.yaml) -------------------------------------
  - name: testgate.Budget
    fields:
      - { name: Version, type: int,    yaml: version }
      - { name: Seconds, type: int,    yaml: seconds }
      - { name: Basis,   type: string, yaml: basis }

  # --- Screen finding shape that drives the exit verdict --------------------
  - name: testgate.Finding
    fields:
      - { name: Rule,     type: string }
      - { name: Severity, type: testgate.Severity }
      - { name: What,     type: string }
      - { name: Why,      type: string }
      - { name: Where,    type: string }
      - { name: When,     type: string }
      - { name: Means,    type: string }
      - { name: Fix,      type: string }

# Closed sets: membership and order are the contract. RegistryClasses is the
# admission set and the report order; PreTestSteps is execution order.
enums:
  - name: testgate.RegistryClasses
    members: [single-threaded-bytes, subprocess, static-analysis, toolchain]
  - name: testgate.PreTestSteps
    members: [fmt, lint, ast-grep-scan, ast-grep-gate-test, release-guard]
  - name: testgate.PassModeValues
    members: [race, no-race]
