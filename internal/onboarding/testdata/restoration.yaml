      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-b/app, branch: main, sessionId: app-b}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app, clonePaths: [/fixtures/team-b/app]}
    expectInitiallyChecked: [app-b]
    # The restored checkout holds one branch, so it is re-saved as that branch.
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app, clonePaths: [/fixtures/team-b/app], branches: [main]}

  - name: duplicate-non-git-paths-keep-separate-branch-policies
    listings:
      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-a/app, branch: main, sessionId: app-a-main}
      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-a/app, branch: release, sessionId: app-a-release}
      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-b/app, branch: main, sessionId: app-b-main}
      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-b/app, branch: release, sessionId: app-b-release}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app, clonePaths: [/fixtures/team-a/app]}
            - {name: app, clonePaths: [/fixtures/team-b/app], branches: [release, unavailable]}
    expectInitiallyChecked: [app-a-main, app-a-release, app-b-release]
    # team-a's saved whole-checkout rule is re-saved as its two branches; team-b
    # keeps its own list, so the two clones stay two rules.
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app, clonePaths: [/fixtures/team-a/app], branches: [main, release]}
            - {name: app, clonePaths: [/fixtures/team-b/app], branches: [release, unavailable]}

  - name: ambiguous-pathless-name-selects-nothing
    listings:
