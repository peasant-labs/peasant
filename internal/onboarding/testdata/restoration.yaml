    expectInitiallyChecked: [auto-feature, auto-main]
    expected:
      mode: selected
      autoIngestNewBranches: true
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [feature, main]}

