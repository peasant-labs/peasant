# Pure restoration and merge cases. All working directories are pre-resolved
# fixture identities; real symlink and missing-directory behavior is tested with
# the production resolver and temporary directories.
#
# Choosing a branch saves that branch, even when it is the only branch in its
# checkout and even when every branch of the checkout is chosen. A checkout is
# saved whole (no branches) only when it has no named branch to save. A branch
# that appears later is admitted by autoIngestNewBranches, never by the shape of
# the rule. The same chosen sessions give the same rule whichever row was ticked.
# A saved whole-checkout rule is therefore re-saved as its branch list when the
# selection is saved again after an edit.
requiredNames:
  - restore-exact-clone-whole-project
  - new-project-starts-clear
  - new-branch-stays-clear-when-policy-is-off
  - new-branch-follows-enabled-policy
  - explicit-branches-survive-when-all-visible-branches-are-checked
  - unavailable-choices-survive-another-edit
  - explicit-clear-removes-available-choice
  - explicit-branch-clear-keeps-only-unavailable-branch
  - clearing-available-project-does-not-recreate-it-for-an-unavailable-branch
  - clearing-available-clone-keeps-only-the-unavailable-clone
  - duplicate-name-restores-by-exact-path
  - duplicate-non-git-paths-keep-separate-branch-policies
  - ambiguous-pathless-name-selects-nothing
  - ambiguous-pathless-remote-selects-nothing
  - select-all-saves-exact-current-clones
  - explicit-session-wins-over-ambiguous-remote
  - sole-explicit-session-stays-session-scoped
  - all-current-explicit-sessions-stay-session-scoped
  - derived-selection-matches-equivalence-corpus
  - restore-returns-whole-residual
  - locked-node-blocks-commit
  - rescan-keeps-ids-only
  - single-branch-checkout-saves-the-chosen-branch
  - project-row-saves-every-branch-it-shows
  - checkout-with-no-named-branch-saves-the-checkout
  - checkout-with-named-and-branchless-sessions-saves-branches-and-sessions
  - new-branch-in-a-branch-rule-checkout-needs-auto-ingest
  - new-branch-in-a-branch-rule-checkout-follows-auto-ingest-when-on
  - rerun-prefill-shows-exactly-the-chosen-branch
expectedCaseCount: 29
cases:
  - name: restore-exact-clone-whole-project
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: exact-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: release, sessionId: exact-release}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool]}
    expectInitiallyChecked: [exact-main, exact-release]
    # The saved whole-checkout rule names a checkout with two named branches, so
    # the re-saved rule lists them.
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main, release]}

  - name: new-project-starts-clear
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: known}
      - {harness: claude-code, projectName: new-tool, gitRemote: "git@github.com:acme/new-tool.git", workingDir: /fixtures/team-a/new-tool, branch: main, sessionId: new}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool]}
    expectInitiallyChecked: [known]
    # The saved whole-checkout rule names a checkout that holds one branch, so the
    # re-saved rule is that branch's.
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}

  - name: new-branch-stays-clear-when-policy-is-off
    listings:
