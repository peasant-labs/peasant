          sessions: [explicit-current-a, explicit-current-b]
    expectInitiallyChecked: [explicit-current-a, explicit-current-b]
    laterListings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: explicit-current-a}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: explicit-current-b}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: future-sibling}
    expectLaterChecked: [explicit-current-a, explicit-current-b]
    expected:
