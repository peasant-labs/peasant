            - {gitRemote: "git@github.com:acme/missing.git", clonePaths: [/fixtures/missing/tool], branches: [gone]}
          sessions: [missing-session]
    expectInitiallyChecked: [old-visible]
    clearProjectPaths: [/fixtures/team-a/tool]
    selectProjectPaths: [/fixtures/team-a/other]
    # The chosen project holds one branch, so its rule is that branch's.
    expected:
