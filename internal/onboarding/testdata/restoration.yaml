      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}

  # Ticking the project row chooses every session it shows, so the rule lists every
  # branch it shows. A branch that appears later is not in it.
  - name: project-row-saves-every-branch-it-shows
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: whole-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: release, sessionId: whole-release}
    saved: {mode: selected, autoIngestNewBranches: false}
    expectInitiallyChecked: []
    selectProjectPaths: [/fixtures/team-a/tool]
    laterListings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: whole-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: release, sessionId: whole-release}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: whole-new-branch}
    expectLaterChecked: [whole-main, whole-release]
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main, release]}

  # The whole-checkout rule is for a checkout with no named branch: there is no
  # branch to name.
  - name: checkout-with-no-named-branch-saves-the-checkout
    listings:
      - {harness: claude-code, projectName: notes, workingDir: /fixtures/team-a/notes, sessionId: branchless-only}
    saved: {mode: selected, autoIngestNewBranches: false}
    expectInitiallyChecked: []
    selectProjectPaths: [/fixtures/team-a/notes]
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: notes, clonePaths: [/fixtures/team-a/notes]}

  # A checkout that holds named branches and sessions with no recorded branch
  # saves the branches, and names the branchless sessions one by one.
  - name: checkout-with-named-and-branchless-sessions-saves-branches-and-sessions
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: mixed-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, sessionId: mixed-branchless}
    saved: {mode: selected, autoIngestNewBranches: false}
    expectInitiallyChecked: []
    selectProjectPaths: [/fixtures/team-a/tool]
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}
          sessions: [mixed-branchless]

  # A session on a branch that did not exist when the branch was chosen is
  # admitted only by the new-branch setting.
  - name: new-branch-in-a-branch-rule-checkout-needs-auto-ingest
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: chosen-main}
    saved: {mode: selected, autoIngestNewBranches: false}
    expectInitiallyChecked: []
    selectBranches:
      - {clonePath: /fixtures/team-a/tool, branch: main}
    laterListings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: chosen-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: later-feature}
    expectLaterChecked: [chosen-main]
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}

  - name: new-branch-in-a-branch-rule-checkout-follows-auto-ingest-when-on
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: auto-chosen-main}
    saved: {mode: selected, autoIngestNewBranches: true}
    expectInitiallyChecked: []
    selectBranches:
      - {clonePath: /fixtures/team-a/tool, branch: main}
    laterListings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: auto-chosen-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: auto-later-feature}
    expectLaterChecked: [auto-chosen-main, auto-later-feature]
    expected:
      mode: selected
      autoIngestNewBranches: true
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}

  # Opening setup again shows exactly the branch that was chosen, and saving it
  # unchanged writes the same rule.
  - name: rerun-prefill-shows-exactly-the-chosen-branch
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: rerun-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: rerun-feature}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}
    expectInitiallyChecked: [rerun-main]
    laterListings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: rerun-main}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: rerun-feature}
    expectLaterChecked: [rerun-main]
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}
