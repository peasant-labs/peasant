      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: feature, sessionId: branch-feature}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
