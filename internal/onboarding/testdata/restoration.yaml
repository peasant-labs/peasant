      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/other.git", clonePaths: [/fixtures/team-a/other], branches: [main]}
            - {gitRemote: "git@github.com:acme/missing.git", clonePaths: [/fixtures/missing/tool], branches: [gone]}
