  - name: derived-selection-matches-equivalence-corpus
    check: corpus
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/claude/acme-tool, branch: feature/x, sessionId: cc-featx-1}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/claude/acme-tool, branch: feature/x, sessionId: cc-featx-2}
    saved:
      mode: selected
      autoIngestNewBranches: false
    expectInitiallyChecked: []
    expected:
      mode: selected
      autoIngestNewBranches: false

  - name: restore-returns-whole-residual
    check: residual
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: visible-session}
    saved:
      mode: selected
