      - {harness: claude-code, projectName: app, workingDir: /fixtures/team-b/app, branch: main, sessionId: ambiguous-name-b}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app}
    expectInitiallyChecked: []
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {name: app}

  - name: ambiguous-pathless-remote-selects-nothing
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: ambiguous-remote-a}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-b/tool, branch: main, sessionId: ambiguous-remote-b}
    saved:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git"}
    expectInitiallyChecked: []
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git"}

  - name: select-all-saves-exact-current-clones
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: select-all-a}
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-b/tool, branch: release, sessionId: select-all-b}
    saved: {mode: selected, autoIngestNewBranches: false}
    expectInitiallyChecked: []
    selectAll: true
    # Select-all chooses what is on screen: each clone holds one branch, so each
    # clone is saved as its branch. The two clones keep their own rules because
    # their branches differ.
    expected:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          projects:
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-a/tool], branches: [main]}
            - {gitRemote: "git@github.com:acme/tool.git", clonePaths: [/fixtures/team-b/tool], branches: [release]}

  - name: explicit-session-wins-over-ambiguous-remote
    listings:
