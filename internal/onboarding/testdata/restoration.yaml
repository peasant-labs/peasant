  - name: single-branch-checkout-saves-the-chosen-branch
    listings:
      - {harness: claude-code, projectName: tool, gitRemote: "git@github.com:acme/tool.git", workingDir: /fixtures/team-a/tool, branch: main, sessionId: only-main}
    saved: {mode: selected, autoIngestNewBranches: false}
