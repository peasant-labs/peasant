resolve_cases:
  - name: ldflags-real-version-wins-over-build-info
    ldflags: "0.1.0"
    build_info_ok: true
    build_info_version: "v9.9.9"
    want: "0.1.0"
  - name: dev-placeholder-falls-back-to-module-version
    ldflags: "dev"
    build_info_ok: true
    build_info_version: "v1.2.3"
    want: "v1.2.3"
  - name: dev-placeholder-with-devel-sentinel-stays-dev
    ldflags: "dev"
    build_info_ok: true
    build_info_version: "(devel)"
    want: "dev"
  - name: dev-placeholder-with-empty-module-version-stays-dev
    ldflags: "dev"
    build_info_ok: true
    build_info_version: ""
    want: "dev"
  - name: dev-placeholder-with-no-build-info-stays-dev
    ldflags: "dev"
    build_info_ok: false
    want: "dev"
  - name: dev-placeholder-with-nil-build-info-stays-dev
    ldflags: "dev"
    build_info_ok: true
    build_info_nil: true
    want: "dev"
  - name: empty-ldflags-falls-back-to-module-version
    ldflags: ""
    build_info_ok: true
    build_info_version: "v2.0.0"
    want: "v2.0.0"

dev_build_cases:
  - name: normal-git-metadata
    describe_tag: "v0.5.0-rc1"
    commit_count: "813"
    short_hash: "2153f8143"
    want: "v0.5.0-rc1-dev.813+2153f8143"
  - name: exact-tag-source-build-is-still-dev
    describe_tag: "v0.5.0-rc1"
    commit_count: "0"
    short_hash: "abcdef123"
    want: "v0.5.0-rc1-dev.0+abcdef123"
  - name: missing-release-tag-fails
    describe_error: "fatal: No names found"
    commit_count: "813"
    short_hash: "2153f8143"
    want_error_contains:
      - "latest reachable release tag could not be found"
      - "Peasant would otherwise stamp an unordered development version"
  - name: invalid-commit-distance-fails
    describe_tag: "v0.5.0-rc1"
    commit_count: "not-a-count"
    short_hash: "2153f8143"
    want_error_contains:
      - "commit distance not-a-count is not numeric"
      - "development versions need a numeric build distance"
  - name: invalid-short-hash-fails
    describe_tag: "v0.5.0-rc1"
    commit_count: "813"
    short_hash: "not-a-hash"
    want_error_contains:
      - "commit hash not-a-hash is not a hexadecimal short hash"
      - "development versions need a source commit hash"
