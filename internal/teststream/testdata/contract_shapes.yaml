# Frozen shapes for the shared stream library.
#
# The parse/report core is consumed by scripts/testgate: the gate's run mode and
# its timing mode. Its exported shape is a contract; see
# internal/testgate/testdata/contract_shapes.yaml for the same mechanism on the
# gate side.
required_names:
  - teststream.Event
  - teststream.Record
  - teststream.ReportOptions

shapes:
  - name: teststream.Event
    fields:
      - { name: Action,  type: string, tag: 'json:"Action"' }
      - { name: Package, type: string, tag: 'json:"Package"' }
      - { name: Test,    type: string, tag: 'json:"Test"' }
      - { name: Elapsed, type: float64, tag: 'json:"Elapsed"' }
      - { name: Output,  type: string, tag: 'json:"Output"' }
      - { name: Time,    type: string, tag: 'json:"Time"' }

  - name: teststream.Record
    fields:
      - { name: Package, type: string }
      - { name: Test,    type: string }
      - { name: Elapsed, type: time.Duration }
      - { name: Skipped, type: bool }
      - { name: Failed,  type: bool }

  - name: teststream.ReportOptions
    fields:
      - { name: Top,        type: int }
      - { name: FamilyRe,   type: "*regexp.Regexp" }
      - { name: NoFamilies, type: bool }
      - { name: WarnPct,    type: float64 }
