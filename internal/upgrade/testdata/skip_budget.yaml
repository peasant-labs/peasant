# Measurements remain unmeasured until the corpus runs on an idle machine.
# Each row names the harness command and the cases whose reports supply its
# costs. Head, base, date, samples and costs stay empty until a quiet-machine
# run at the default 240 x 1000 shape fills them from those reports.
# measurementRequired is false until the quiet-machine report lands. Set it to
# true (or remove it; the loader defaults to true) in the same change that
# fills the rows: every row must then pass the measured-budget validator.
measurementRequired: false
requiredNames:
  - proven-settle
  - copy-refresh
  - stored-index
budgets:
  - name: proven-settle
    lane: stored-metadata
    disposition: proven
    cases: [C1, C5]
    provenance:
      command: 'go run -tags skipbudget ./cmd/skip-budget -case C1,C2,C3,C5,C6 -base "$(git merge-base HEAD origin/develop)"'
  - name: copy-refresh
    lane: stored-metadata
    disposition: copy
    cases: [C2]
    provenance:
      command: 'go run -tags skipbudget ./cmd/skip-budget -case C1,C2,C3,C5,C6 -base "$(git merge-base HEAD origin/develop)"'
  - name: stored-index
    lane: stored-index
    disposition: index
    cases: [C3]
    provenance:
      command: 'go run -tags skipbudget ./cmd/skip-budget -case C1,C2,C3,C5,C6 -base "$(git merge-base HEAD origin/develop)"'
cases:
  - name: winning-ratio
    proof: 1
    settle: 1
    avoided: 3
    valid: true
  - name: break-even-ratio
    proof: 1
    settle: 1
    avoided: 2
    valid: false
  - name: losing-ratio
    proof: 2
    settle: 1
    avoided: 2
    valid: false
  - name: unmeasured-settle
    proof: 1
    avoided: 3
    valid: false
  - name: zero-avoided
    proof: 0
    settle: 0
    avoided: 0
    valid: false
  - name: negative-proof
    proof: -1
    settle: 1
    avoided: 3
    valid: false
  - name: not-a-number
    proof: .nan
    settle: 1
    avoided: 3
    valid: false
  - name: infinite-avoided
    proof: 1
    settle: 1
    avoided: .inf
    valid: false
missingProvenance:
  - head
  - base
  - command
  - recorded-date
  - samples
