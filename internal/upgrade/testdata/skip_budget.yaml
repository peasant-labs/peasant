# Measured budgets, one row per planned skip, each from its own 240 x 1000
# harness report (5 rounds). Every row must pass the measured-budget validator.
#
# Field mapping, all in milliseconds and all medians over the report's rounds:
#   proof   = skip arm medianProofMs: the stored refresh_proof stage.
#   settle  = skip arm medianIndexStageMs: the INDEX stage of the skip arm. The
#             stored profile has no separate settle stage, so INDEX (which
#             holds the settle, or the stored-index re-index) is the skip's own
#             cost. The proof runs inside the index stage, so its time may be
#             counted twice; that can only overstate the skip's cost, which
#             keeps the ratio conservative.
#   avoided = baseline arm medianIndexStageMs: the INDEX stage of the work the
#             skip replaces.
# The ratio the validator checks is (proof + settle) / avoided.
#
# proven-settle (C1, stamp-only adapter bump): (82.025 + 1166.654) / 16230.268
#   = 0.077. Wall: 11052 ms against 25847 ms.
# stored-index (C3, indexer bump): (0 + 17211.152) / 39884.35 = 0.432. The
#   lane has no proof. Wall: 22555 ms against 50865 ms.
#
# A not-proven proof parses, so the stored-metadata lane has no other skip to
# budget; the copy refresh that once filled that gap was measured slower than
# the parse when metadata changed and removed.
measurementRequired: true
requiredNames:
  - proven-settle
  - stored-index
budgets:
  - name: proven-settle
    lane: stored-metadata
    disposition: proven
    cases: [C1]
    proof: 82.025
    settle: 1166.654
    avoided: 16230.268
    provenance:
      head: 0c4084f45bfc6430b6e363a00eee7a09480c4e28
      base: 5908f8e1e
      command: 'go run -tags skipbudget ./cmd/skip-budget -case C1,C2,C3,C5,C6 -base 5908f8e1e'
      date: '2026-11-18T23:26:55Z'
      samples: 5
  - name: stored-index
    lane: stored-index
    disposition: index
    cases: [C3]
    proof: 0
    settle: 17211.152
    avoided: 39884.35
    provenance:
      head: c14b7259ab9a1d42f65896808fec49e5149aac12
      base: a8eaf1e84
      command: 'go run -tags skipbudget ./cmd/skip-budget -case C3,C6 -base a8eaf1e84'
      date: '2026-11-19T06:05:45Z'
      samples: 5
cases:
  - name: winning-ratio
    proof: 1
    settle: 1
    avoided: 3
    valid: true
  - name: break-even-ratio
    proof: 1
    settle: 1
    avoided: 2
    valid: false
  - name: losing-ratio
    proof: 2
    settle: 1
    avoided: 2
    valid: false
  - name: unmeasured-settle
    proof: 1
    avoided: 3
    valid: false
  - name: zero-avoided
    proof: 0
    settle: 0
    avoided: 0
    valid: false
  - name: negative-proof
    proof: -1
    settle: 1
    avoided: 3
    valid: false
  - name: not-a-number
    proof: .nan
    settle: 1
    avoided: 3
    valid: false
  - name: infinite-avoided
    proof: 1
    settle: 1
    avoided: .inf
    valid: false
missingProvenance:
  - head
  - base
  - command
  - recorded-date
  - samples
