# Measurements remain unmeasured until the corpus runs on an idle machine.
requiredNames:
  - proven-settle
  - copy-refresh
  - stored-index
budgets:
  - name: proven-settle
    lane: stored-metadata
    disposition: proven
  - name: copy-refresh
    lane: stored-metadata
    disposition: copy
  - name: stored-index
    lane: stored-index
    disposition: index
cases:
  - name: winning-ratio
    proof: 1
    settle: 1
    avoided: 3
    valid: true
  - name: break-even-ratio
    proof: 1
    settle: 1
    avoided: 2
    valid: false
  - name: losing-ratio
    proof: 2
    settle: 1
    avoided: 2
    valid: false
missingProvenance:
  - head
  - base
  - command
  - recorded-date
  - samples
