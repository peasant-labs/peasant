# Every producer bump, in the order it happened. This file is test data: the
# declaration table in producer_declarations.go is the runtime source, and the
# ledger tests prove the two agree. Nothing at runtime reads this file.
#
# `from`/`to` are the version values a registry declared before and after the
# bump. The chain for one producer (kind plus harness or name) is contiguous in
# file order: each row starts at the previous row's `to`, so a baseline
# checkpoint and the managed-generation target are both on the same chain. A
# registry value that is missing from its chain, a chain whose last `to` is not
# the newest registry value, and a registered producer with no chain all fail
# the ledger tests.
#
# `change_scope`, `input`, `output_proof`, `precheck` and `fallback` state what
# the bump changes, what it reads, which stored values can prove its output
# unchanged, the cheap check run first and the work done when the proof fails.
# The newest row of each chain must match the producer's declaration. `reason`
# and `lane` state what the bump invalidates for a stored session and which
# lane repairs it; `none` on both means the bump schedules no session work.
#
# A per-harness producer (metadata adapter, transcript indexer, index format)
# names its `harness`. A content model names its capability token in `name`; a
# token is immutable, so it is its own version and its chain starts from no
# prior version. The metadata schema, the redaction rule set and the store
# schema each have one producer and name neither.
- id: pi-adapter-3
  harness: pi
  kind: metadata-adapter
  from: 2
  to: 3
  change_scope: metadata-only
  input: stored-transcript
  output_proof: [content-hash, metadata-context-digest]
  precheck: adapter-context-equivalence
  fallback: parse
  reason: adapter_behind
  lane: stored-metadata
