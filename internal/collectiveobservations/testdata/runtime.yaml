  - {name: runtime-unitless-refused, value: '2', invalid: true}
  - {name: runtime-negative-refused, value: '-1s', invalid: true}
  - {name: runtime-zero-refused, value: 0s, invalid: true}
  - {name: runtime-too-short-refused, value: 99ms, invalid: true}
  - {name: runtime-too-long-refused, value: 601s, invalid: true}
  - {name: runtime-overflow-refused, value: 999999999999999999h, invalid: true}
