# Deterministic mutation of each frozen coverage-map axis.
# Each case mutates the frozen expectation and asserts the comparator detects a
# mismatch against the real declaration.
required_names:
  - rename-field
  - drop-field
  - retype-field
  - retag-yaml
  - reorder-fields
  - drop-enum-member
  - reorder-enum-members

mutations:
  - { name: rename-field,         target: coveragemap.Destination,       op: rename,  field: Ref,  to: Target }
  - { name: drop-field,           target: coveragemap.CoverageMap,       op: drop,    field: Inventory }
  - { name: retype-field,         target: coveragemap.Inventory,         op: retype,  field: Version, to: int64 }
  - { name: retag-yaml,           target: coveragemap.InventoryName,     op: retag,   tag: yaml, field: Where, value: location }
  - { name: reorder-fields,       target: coveragemap.Destination,       op: reorder, field: Kind, with: Ref }
  - { name: drop-enum-member,     target: coveragemap.AllDestinationKinds, op: drop,  field: followup }
  - { name: reorder-enum-members, target: coveragemap.AllDestinationKinds, op: reorder, field: retained-in-place, with: followup }
