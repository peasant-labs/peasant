# Deterministic mutation of each frozen decorator-contract axis.
# Each case mutates the frozen expectation and asserts the comparator detects a
# mismatch against the real declaration, proving the freeze is not vacuous.
required_names:
  - rename-field
  - drop-field
  - retype-field
  - retag-yaml
  - reorder-fields
  - drop-enum-member
  - reorder-enum-members
  - drop-interface-method
  - retype-interface-method

mutations:
  - { name: rename-field,            target: fsdecorator.Gate,             op: rename,         field: Path,  to: Location }
  - { name: drop-field,              target: fsdecorator.Bound,            op: drop,           field: MaxBytes }
  - { name: retype-field,            target: fsdecorator.Bound,            op: retype,         field: MaxCalls, to: int }
  - { name: retag-yaml,              target: fsdecorator.Gate,             op: retag,          field: Op, value: 'yaml:"operation"' }
  - { name: reorder-fields,          target: fsdecorator.Gate,             op: reorder,        field: Op, with: Path }
  - { name: drop-enum-member,        target: fsdecorator.AllOps,           op: drop,           field: CopyFile }
  - { name: reorder-enum-members,    target: fsdecorator.AllCapabilities,  op: reorder,        field: counting, with: none }
  - { name: drop-interface-method,   target: fsdecorator.GatedFS,          op: drop-method,    field: Release }
  - { name: retype-interface-method, target: fsdecorator.BoundedFS,        op: retype-method,  field: Limit, to: "func(fsdecorator.Bound) error" }
