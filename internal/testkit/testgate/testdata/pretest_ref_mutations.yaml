# Mutation cases for the pre-test fixture's Makefile source anchors.
#
# Each case mutates a copy of the embedded fixture and asserts
# validatePreTestSources rejects it, proving the source check is not vacuous: a
# fragment absent from its declared target, a target that does not exist, a
# fragment placed in the wrong target, a reordered step, and a changed or
# misplaced standalone workflow check must each fail.
#
# required_names keeps a mutation case from being deleted silently.
required_names:
  - fragment-absent
  - target-absent
  - fragment-wrong-target
  - step-reordered
  - workflow-wrong-target
  - workflow-fragment-truncated
  - workflow-prerequisite-of-check
  - workflow-in-check-recipe
  - unstring-missing-from-check
  - unstring-missing-from-target

mutations:
  - name: fragment-absent
    step: lint
    op: set-fragment
    value: "go vet ./does-not-exist"
  - name: target-absent
    step: fmt
    op: set-target
    value: no-such-target
  - name: fragment-wrong-target
    step: ast-grep-scan
    op: set-target
    value: lint
  - name: step-reordered
    step: ast-grep-scan
    op: swap
    with: projection-negative-scope
  - name: workflow-wrong-target
    step: check-workflows
    op: set-target
    value: check
  - name: workflow-fragment-truncated
    step: check-workflows
    op: set-fragment
    value: check-workflows
  - name: workflow-prerequisite-of-check
    op: replace-makefile
    value: "check: fmt-check lint docs-cli-check"
    with: "check: fmt-check lint docs-cli-check check-workflows"
  - name: workflow-in-check-recipe
    op: replace-makefile
    value: "ast-grep scan --error=unused-suppression --config sgconfig.yml ."
    with: "$(MAKE) check-workflows; ast-grep scan --error=unused-suppression --config sgconfig.yml ."
  - name: unstring-missing-from-check
    op: replace-makefile
    value: "$(UNSTRING) check; \\"
    with: "true; \\"
  - name: unstring-missing-from-target
    op: replace-makefile
    value: "check-unstring:\n\t$(UNSTRING) check"
    with: "check-unstring:\n\ttrue"
