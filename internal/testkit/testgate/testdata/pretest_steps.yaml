# Pre-test steps that `make check` runs before the test passes.
#
# The gate's per-class decision table charges the whole `make check`, so these
# steps are inside the budget. The commands here mirror the `check` target's
# execution; each step names the Makefile `target` that runs it and a literal
# `fragment` of that target's recipe. A test resolves both against the
# repository Makefile and asserts the steps run in this order, so a recipe that
# drops, reorders, or renames a step fails loudly instead of the fixture
# measuring a step the Makefile no longer runs. The fragment is the recipe's own
# text, which may use Make variables (`$(UNSTRING)` and `$(GORACE_FLAG)`), so
# it cannot be derived from `program` + `args`.
#
# Each step runs alone, under the outer getrusage(RUSAGE_CHILDREN) accumulator,
# so its wall/user/system are exact.
#
# required_names is a deletion-protection manifest: it lists the step names
# the table must carry, in execution order. Adding a step never requires editing
# it; removing one does.
required_names:
  - fmt
  - lint
  - ast-grep-scan
  - unstring
  - ast-grep-gate-test
  - projection-negative-seed
  - projection-negative-scope

steps:
  # The step keeps its name "fmt" (budget tables key on it); since `check`
  # asserts formatting instead of rewriting files, it runs the read-only
  # fmt-check recipe with the building toolchain's gofmt.
  - step: fmt
    program: sh
    args: ["-c", "unformatted=$(git ls-files -z -- '*.go' | xargs -0 \"$(go env GOROOT)/bin/gofmt\" -l -e) || exit 1; if [ -n \"$unformatted\" ]; then echo \"$unformatted\"; exit 1; fi"]
    target: fmt-check
    fragment: "xargs -0 \"$$(go env GOROOT)/bin/gofmt\" -l"
  - step: lint
    program: ./scripts/vet-go.sh
    args: []
    target: lint
    fragment: "./scripts/vet-go.sh"
  - step: ast-grep-scan
    program: ast-grep
    args: ["scan", "--error=unused-suppression", "--config", "sgconfig.yml", "."]
    target: check
    fragment: "ast-grep scan --error=unused-suppression --config sgconfig.yml ."
  - step: unstring
    program: make
    args: ["check-unstring"]
    target: check-unstring
    fragment: "$(UNSTRING) check"
  - step: ast-grep-gate-test
    program: go
    args: ["test", "-race", "-tags=astgrep", "./internal/tui/gates/...", "./internal/testkit/astgreprules/..."]
    target: check
    fragment: "go test -tags=astgrep $(GORACE_FLAG) ./internal/tui/gates/... ./internal/testkit/astgreprules/..."
  - step: projection-negative-seed
    program: go
    args: ["test", "-tags=projection_negative_seed", "-run", "^(TestThinkingSeedNegativeFailsOnlyDesignatedCases|TestModelProjectionNegativeFailsOnlyDesignatedCase)$", "./internal/transcript/"]
    target: check
    fragment: "go test -tags=projection_negative_seed -run '^(TestThinkingSeedNegativeFailsOnlyDesignatedCases|TestModelProjectionNegativeFailsOnlyDesignatedCase)$$' ./internal/transcript/"
  - step: projection-negative-scope
    program: go
    args: ["test", "-tags=projection_negative_scope", "-run", "^(TestThinkingSeedNegativeFailsOnlyDesignatedCases|TestModelProjectionNegativeFailsOnlyDesignatedCase)$", "./internal/transcript/"]
    target: check
    fragment: "go test -tags=projection_negative_scope -run '^(TestThinkingSeedNegativeFailsOnlyDesignatedCases|TestModelProjectionNegativeFailsOnlyDesignatedCase)$$' ./internal/transcript/"

# This check is a separate target, not a `make check` pre-test measurement.
workflow_check:
  target: check-workflows
  fragment: '"$$tmp/release-intent" check-workflows --policy .github/release-queue.policy.yml --dir .github/workflows'
