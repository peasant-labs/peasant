# Auto-publish rules: which rules publish a repository, what installing a
# rule's hooks does, what a hook push under a rule publishes, and what
# `peasant village auto` prints.
#
# Each case names the driver that runs it (autopublishtest.Driver):
#   matcher       internal/autopublish  Decide on the repository below; "~/"
#                                       in its root is the home directory.
#   validate      internal/autopublish  the rule, or the rules file, is
#                                       refused when read.
#   install       internal/api          PUT the rules, then POST install for
#                                       the recorded or the unrecorded
#                                       repository, on the mounted server.
#   rule-body     internal/api          a body the settings routes refuse.
#   push          cmd/peasant           `peasant village push` over sessions
#                                       recorded in the world's repositories,
#                                       against a Village double.
#   hook          cmd/peasant           git push through the hook
#                                       `peasant village auto` installed, with
#                                       an upload that fails.
#   village-auto  cmd/peasant           `peasant village auto` in the recorded
#                                       repository.
#
# autopublishtest.fieldsOf names the fields each driver reads; a case that
# sets another field is refused when the fixture loads. In a match,
# "{world}" is the directory holding the world's repositories, and "{remote}"
# the recorded repository's remote in bare form. Rules name collectives by
# alias.
#
# Every case is required by name. The first eight are the acceptance cases
# of auto-publish rules; the rest guard the behavior around them.
requiredNames:
  - uncovered-public-push-requests-an-owner-update
  - multiple-documents-refuse-a-save
  - active-document-followed-by-paused-document
  - paused-document-followed-by-active-document
  - rules-followed-by-empty-document
  - rules-followed-by-malformed-document
  - rule-required-push-stops-with-only-a-commit-binding
  - rule-required-commit-keeps-a-commit-binding
  - paused-session-is-absent-from-redaction-record
  - rule-required-hook-stops-after-deletion
  - rule-required-hook-keeps-a-retained-binding
  - rule-required-hook-stops-at-a-paused-binding
  - rule-required-hook-keeps-unbound-sessions-out
  - unchanged-bound-session-needs-no-visibility-read
  - unreadable-audience-holds-the-update
  - unreadable-share-history-stops-the-share
  - unrelated-rule-keeps-the-scoped-audience
  - rule-outside-selection-keeps-the-selected-audience
  - folder-rule-binds-a-gone-subfolder
  - remote-rule-binds-a-gone-clone
  - remote-double-wildcard-is-refused
  - folder-glob-match
  - remote-match
  - no-match
  - overlapping-rules
  - unrecorded-repo-not-installed
  - foreign-hook-refused-with-remedy
  - failed-upload-exits-zero
  - village-auto-output
  - double-star-matches-any-depth
  - folder-rule-does-not-cover-a-nested-repository
  - escaped-folder-covers-only-itself
  - escaped-folder-covers-itself
  - remote-wildcard-ignores-case
  - remote-wildcard-stays-in-one-segment
  - remote-pattern-in-scp-form
  - remote-pattern-as-a-url
  - remote-pattern-with-a-user-and-a-port
  - remote-rule-matches-the-origin-of-a-fork-branch
  - remote-rule-skips-a-repository-without-a-remote
  - folder-rule-does-not-read-the-remote
  - rule-without-events-is-paused
  - folder-glob-must-be-absolute
  - malformed-folder-glob
  - remote-pattern-needs-a-path
  - remote-pattern-needs-a-repository
  - malformed-remote-pattern
  - unknown-kind
  - repeated-event
  - collective-must-be-a-village-identifier
  - identifier-must-fit-a-url-path
  - file-repeats-an-identifier
  - file-of-another-version
  - file-rule-without-an-events-list
  - file-with-an-unknown-field
  - recorded-repo-installs-every-rule-event
  - remote-rule-installs-in-its-repository
  - rule-that-does-not-cover-the-repository-installs-nothing
  - paused-rule-installs-nothing
  - rule-body-with-a-visibility-is-refused
  - rule-body-with-null-events-is-refused
  - rule-body-with-a-relative-glob-is-refused
  - rule-body-with-two-values-is-refused
  - install-body-without-a-path-is-refused
  - covered-push-publishes-private-and-shares
  - covered-update-keeps-the-collectives
  - update-does-not-resubmit-a-rejected-share
  - unchanged-session-is-not-shared-again
  - folder-rule-covers-the-push
  - folder-rule-covers-a-repository-without-a-remote
  - rules-bind-each-session-by-its-own-clone
  - folder-rule-binds-a-session-whose-folder-is-gone
  - unscoped-push-binds-a-session-whose-folder-is-gone
  - folder-rule-covers-a-linked-worktree
  - unscoped-push-applies-the-rules
  - uncovered-push-is-unchanged
  - paused-rule-publishes-nothing
  - paused-rule-names-its-reason
  - public-transcript-is-not-updated-under-a-rule
  - public-hold-is-released-when-made-private
  - visibility-flag-is-refused-under-a-rule
  - license-flag-is-refused-under-a-rule
  - unreadable-rules-refuse-the-push
  - failed-share-names-the-session
  - budget-expiry-records-the-unshared-session
  - village-auto-reads-the-last-publication
  - village-auto-again-updates-the-rule
  - village-auto-names-every-rule-that-covers-the-repository
  - village-auto-binds-the-origin-of-a-fork-branch
  - village-auto-matches-an-existing-rule-without-case
  - village-auto-after-the-rule-was-edited
  - village-auto-accepts-a-hand-added-section
  - village-auto-warns-of-a-committable-hook
  - village-auto-needs-a-publication
  - village-auto-needs-a-collective
  - village-auto-needs-a-recorded-repository
  - village-auto-needs-a-sign-in
  - village-auto-keeps-a-foreign-hook

  - unreadable-rules-refuse-a-save
  - missing-store-refuses-a-save
  - missing-store-refuses-a-delete
  - missing-store-refuses-an-install
  - village-auto-unreadable-audience-changes-nothing

collectives:
  platform: {id: 11111111-1111-4111-8111-111111111111, name: platform, acceptance: open}
  research: {id: 22222222-2222-4222-8222-222222222222, name: research, acceptance: open}
  review: {id: 33333333-3333-4333-8333-333333333333, name: review, acceptance: curated}
  not-a-uuid: {id: Platform, name: not-a-uuid, acceptance: open}

cases:
  # --- the matcher ---
  - name: folder-glob-match
    driver: matcher
    rules:
      - {id: acme-folders, kind: folder, match: "~/work/acme/*", events: [pre-push], collectives: [platform]}
    repository: {root: ~/work/acme/tools}
    expect: {applying: [acme-folders], collectives: [platform]}

  - name: remote-match
    driver: matcher
    rules:
      - {id: acme-tools, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [review]}
    repository: {root: /home/dev/src/tools, remote: "git@github.com:acme/tools.git"}
    expect: {applying: [acme-tools], collectives: [review]}

  - name: no-match
    driver: matcher
    rules:
      - {id: acme-folders, kind: folder, match: "~/work/acme/*", events: [pre-push], collectives: [platform]}
      - {id: acme-tools, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [review]}
    repository: {root: /home/dev/personal/notes, remote: "https://github.com/dev/notes.git"}
    expect: {applying: [], collectives: []}

  - name: overlapping-rules
    driver: matcher
    rules:
      - {id: work, kind: folder, match: "~/work/**", events: [post-commit], collectives: [platform]}
      - {id: acme, kind: remote, match: "github.com/acme/*", events: [pre-push], collectives: [review, platform]}
    repository: {root: ~/work/acme/tools, remote: "https://github.com/acme/tools.git"}
    expect: {applying: [work, acme], collectives: [platform, review]}

  - name: double-star-matches-any-depth
    driver: matcher
    rules:
      - {id: work, kind: folder, match: /home/dev/work/**, events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/work/clients/acme/tools}
    expect: {applying: [work], collectives: [platform]}

  - name: folder-rule-does-not-cover-a-nested-repository
    driver: matcher
    rules:
      - {id: tools, kind: folder, match: /home/dev/work/tools, events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/work/tools/vendor/lib}
    expect: {applying: [], collectives: []}

  - name: escaped-folder-covers-only-itself
    driver: matcher
    rules:
      - {id: literal, kind: folder, match: '/home/dev/work/a\*b', events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/work/aXb}
    expect: {applying: [], collectives: []}

  - name: escaped-folder-covers-itself
    driver: matcher
    rules:
      - {id: literal, kind: folder, match: '/home/dev/work/a\*b', events: [pre-push], collectives: [platform]}
    repository: {root: '/home/dev/work/a*b'}
    expect: {applying: [literal], collectives: [platform]}

  - name: remote-wildcard-ignores-case
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "github.com/acme/*", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "https://github.com/ACME/Tools.git"}
    expect: {applying: [acme], collectives: [platform]}

  - name: remote-wildcard-stays-in-one-segment
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "gitlab.com/acme/*", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "https://gitlab.com/acme/group/tools.git"}
    expect: {applying: [], collectives: []}

  - name: remote-pattern-in-scp-form
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "github.com:acme/tools", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "https://github.com/acme/tools"}
    expect: {applying: [acme], collectives: [platform]}

  - name: remote-pattern-as-a-url
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "https://github.com/acme/tools.git", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "git@github.com:acme/tools.git"}
    expect: {applying: [acme], collectives: [platform]}

  - name: remote-pattern-with-a-user-and-a-port
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "ssh://git@gitlab.example.com:2222/acme/tools.git", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "https://gitlab.example.com/acme/tools"}
    expect: {applying: [acme], collectives: [platform]}

  - name: remote-rule-matches-the-origin-of-a-fork-branch
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/tools, remote: "https://github.com/dev/tools.git", origin: "https://github.com/acme/tools.git"}
    expect: {applying: [acme], collectives: [platform]}

  - name: remote-rule-skips-a-repository-without-a-remote
    driver: matcher
    rules:
      - {id: acme, kind: remote, match: "github.com/acme/*", events: [pre-push], collectives: [platform]}
    repository: {root: ~/work/acme/tools}
    expect: {applying: [], collectives: []}

  - name: folder-rule-does-not-read-the-remote
    driver: matcher
    rules:
      - {id: acme, kind: folder, match: "/home/dev/work/acme", events: [pre-push], collectives: [platform]}
    repository: {root: /home/dev/src/acme, remote: "https://github.com/dev/work/acme.git"}
    expect: {applying: [], collectives: []}

  - name: rule-without-events-is-paused
    driver: matcher
    rules:
      - {id: paused, kind: folder, match: "~/work/**", events: [], collectives: [platform]}
    repository: {root: ~/work/tools}
    expect: {applying: [], paused: [paused], collectives: []}

  # --- rules and files that are refused when read ---
  - name: folder-glob-must-be-absolute
    driver: validate
    rules:
      - {id: work, kind: folder, match: "work/*", events: [pre-push], collectives: [platform]}
    expect: {invalid: not an absolute path}

  - name: malformed-folder-glob
    driver: validate
    rules:
      - {id: work, kind: folder, match: "/home/dev/[work", events: [pre-push], collectives: [platform]}
    expect: {invalid: malformed segment}

  - name: remote-pattern-needs-a-path
    driver: validate
    rules:
      - {id: acme, kind: remote, match: github.com, events: [pre-push], collectives: [platform]}
    expect: {invalid: names no host and repository path}

  - name: remote-pattern-needs-a-repository
    driver: validate
    rules:
      - {id: acme, kind: remote, match: github.com/acme, events: [pre-push], collectives: [platform]}
    expect: {invalid: "write github.com/acme/* for every repository"}

  - name: malformed-remote-pattern
    driver: validate
    rules:
      - {id: acme, kind: remote, match: "github.com/acme/[tools", events: [pre-push], collectives: [platform]}
    expect: {invalid: 'remote pattern "github.com/acme/[tools" is malformed'}

  - name: unknown-kind
    driver: validate
    rules:
      - {id: acme, kind: branch, match: main, events: [pre-push], collectives: [platform]}
    expect: {invalid: outside the closed set}

  - name: repeated-event
    driver: validate
    rules:
      - {id: acme, kind: folder, match: /home/dev/work, events: [pre-push, pre-push], collectives: [platform]}
    expect: {invalid: listed twice}

  - name: collective-must-be-a-village-identifier
    driver: validate
    rules:
      - {id: acme, kind: folder, match: /home/dev/work, events: [pre-push], collectives: [not-a-uuid]}
    expect: {invalid: not a Village collective identifier}

  - name: identifier-must-fit-a-url-path
    driver: validate
    rules:
      - {id: acme/tools, kind: folder, match: /home/dev/work, events: [pre-push], collectives: [platform]}
    expect: {invalid: identifier}

  - name: file-repeats-an-identifier
    driver: validate
    rulesFile: |
      version: 1
      autoPublish:
        - {id: acme, kind: folder, match: /home/dev/a, events: [pre-push], collectives: []}
        - {id: acme, kind: folder, match: /home/dev/b, events: [pre-push], collectives: []}
    expect: {invalid: listed twice}

  - name: file-of-another-version
    driver: validate
    rulesFile: |
      version: 2
      autoPublish: []
    expect: {invalid: version 2}

  - name: file-rule-without-an-events-list
    driver: validate
    rulesFile: |
      autoPublish:
        - {id: acme, kind: folder, match: /home/dev/a, collectives: []}
    expect: {invalid: no events or no collectives list}

  - name: file-with-an-unknown-field
    driver: validate
    rulesFile: |
      version: 1
      autoPublish:
        - {id: acme, kind: folder, match: /home/dev/a, events: [], collectives: [], visibility: public}
    expect: {invalid: field visibility not found}

  # --- installing a rule's hooks through the settings routes ---
  - name: unrecorded-repo-not-installed
    driver: install
    rules:
      - {id: work, kind: folder, match: "{world}/*", events: [pre-push], collectives: [platform]}
    install: unrecorded
    expect: {status: 400, code: auto_publish_repository_not_covered, installed: []}

  - name: foreign-hook-refused-with-remedy
    driver: install
    rules:
      - {id: work, kind: folder, match: "{world}/*", events: [pre-push], collectives: [platform]}
    install: recorded
    foreignHook: |
      #!/bin/sh
      echo "team policy check"
    expect:
      status: 200
      hooks: {pre-push: blocked}
      remedyContains: [Peasant did not write, add the section below]
      snippetContains: ["# BEGIN peasant village upload", "village push --non-interactive"]
      installed: []

  - name: recorded-repo-installs-every-rule-event
    driver: install
    rules:
      - {id: work, kind: folder, match: "{world}/*", events: [pre-push, post-commit], collectives: [platform]}
    install: recorded
    expect:
      status: 200
      hooks: {pre-push: installed, post-commit: installed}
      installed: [recorded]

  - name: remote-rule-installs-in-its-repository
    driver: install
    rules:
      - {id: acme, kind: remote, match: "github.com/acme/tools", events: [pre-push], collectives: [platform]}
    install: recorded
    remoteRecorded: true
    expect:
      status: 200
      hooks: {pre-push: installed}
      label: "github.com:acme/tools"
      installed: [recorded]

  - name: rule-that-does-not-cover-the-repository-installs-nothing
    driver: install
    rules:
      - {id: elsewhere, kind: remote, match: "github.com/acme/other", events: [pre-push], collectives: [platform]}
    install: recorded
    remoteRecorded: true
    expect: {status: 400, code: auto_publish_repository_not_covered, installed: []}

  - name: paused-rule-installs-nothing
    driver: install
    rules:
      - {id: paused, kind: folder, match: "{world}/*", events: [], collectives: [platform]}
    install: recorded
    expect: {status: 400, code: auto_publish_rule_invalid, installed: []}

  # --- bodies the settings routes refuse ---
  - name: rule-body-with-a-visibility-is-refused
    driver: rule-body
    method: PUT
    body: '{"kind": "folder", "match": "/home/dev/work", "events": [], "collectives": [], "visibility": "public"}'
    expect: {status: 400, code: auto_publish_rule_invalid}

  - name: rule-body-with-null-events-is-refused
    driver: rule-body
    method: PUT
    body: '{"kind": "folder", "match": "/home/dev/work", "events": null, "collectives": []}'
    expect: {status: 400, code: auto_publish_rule_invalid}

  - name: rule-body-with-a-relative-glob-is-refused
    driver: rule-body
    method: PUT
    body: '{"kind": "folder", "match": "work/*", "events": ["pre-push"], "collectives": []}'
    expect: {status: 400, code: auto_publish_rule_invalid}

  - name: rule-body-with-two-values-is-refused
    driver: rule-body
    method: PUT
    body: '{"kind": "folder", "match": "/home/dev/work", "events": [], "collectives": []} {}'
    expect: {status: 400, code: auto_publish_rule_invalid}

  - name: install-body-without-a-path-is-refused
    driver: rule-body
    method: POST
    body: '{"path": ""}'
    expect: {status: 400, code: auto_publish_rule_invalid}

  # --- a push the rules may bind ---
  - name: covered-push-publishes-private-and-shares
    driver: push
    flags: [--verbose]
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform, review]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
      outputContains: ["rule acme binds 1 session(s)", "1 share(s) made, 1 waiting"]
      publishes: 1
      license: ""
      ownerUpdates: 0
      audience: {platform: approved, review: pending}

  - name: covered-update-keeps-the-collectives
    driver: push
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform, review]}
    config: {visibility: public, license: CC-BY-4.0}
    again: [--force]
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      license: ""
      ownerUpdates: 0
      audience: {platform: approved, review: pending}

  - name: update-does-not-resubmit-a-rejected-share
    driver: push
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform, review]}
    config: {visibility: private}
    villageDecides: {review: rejected, platform: retracted}
    again: [--force]
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      audience: {}

  - name: unchanged-session-is-not-shared-again
    driver: push
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform]}
    config: {visibility: private}
    villageDecides: {platform: retracted}
    again: []
    expect: {visibilityIntent: private, public: false, publishes: 1, audience: {}}

  - name: folder-rule-covers-the-push
    driver: push
    rules:
      - {id: world, kind: folder, match: "{world}/*", events: [post-commit], collectives: [research]}
    config: {visibility: private, license: CC-BY-4.0}
    expect: {visibilityIntent: private, public: false, publishes: 1, license: "", audience: {research: approved}}

  - name: folder-rule-covers-a-repository-without-a-remote
    driver: push
    noRemote: true
    rules:
      - {id: world, kind: folder, match: "{world}/*", events: [pre-push], collectives: [research]}
    config: {visibility: public, license: CC-BY-4.0}
    expect: {visibilityIntent: private, public: false, publishes: 1, license: "", ownerUpdates: 0, audience: {research: approved}}

  - name: rules-bind-each-session-by-its-own-clone
    driver: push
    sessions: [clone]
    rules:
      - {id: tools, kind: folder, match: "{world}/tools", events: [pre-push], collectives: [research]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      license: ""
      ownerUpdates: 0
      audience: {research: approved}
      others: {clone: {}}

  - name: folder-rule-binds-a-session-whose-folder-is-gone
    driver: push
    sessions: [gone]
    rules:
      - {id: gone, kind: folder, match: "{world}/gone", events: [pre-push], collectives: [platform]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      license: ""
      ownerUpdates: 0
      audience: {}
      others: {gone: {platform: approved}}

  - name: unscoped-push-binds-a-session-whose-folder-is-gone
    driver: push
    unscoped: true
    sessions: [gone]
    rules:
      - {id: gone, kind: folder, match: "{world}/gone", events: [pre-push], collectives: [platform]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      license: ""
      ownerUpdates: 0
      audience: {}
      others: {gone: {platform: approved}}

  - name: folder-rule-covers-a-linked-worktree
    driver: push
    sessions: [linked]
    rules:
      - {id: world, kind: folder, match: "{world}/*", events: [pre-push], collectives: [platform]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
      publishes: 2
      license: ""
      ownerUpdates: 0
      audience: {platform: approved}
      others: {linked: {platform: approved}}

  - name: unscoped-push-applies-the-rules
    driver: push
    unscoped: true
    rules:
      - {id: acme, kind: remote, match: github.com/acme/tools, events: [pre-push], collectives: [platform]}
    config: {visibility: public, license: CC-BY-4.0}
    expect: {visibilityIntent: private, public: false, publishes: 1, license: "", ownerUpdates: 0, audience: {platform: approved}}

  - name: uncovered-push-is-unchanged
    driver: push
    rules:
      - {id: other, kind: remote, match: github.com/acme/other, events: [pre-push], collectives: [platform]}
    config: {visibility: private, license: CC-BY-4.0}
    expect: {visibilityIntent: private, public: false, publishes: 1, license: CC-BY-4.0, audience: {}}

  - name: paused-rule-publishes-nothing
    driver: push
    rules:
      - {id: paused, kind: remote, match: github.com/acme/tools, events: [], collectives: [platform]}
    config: {visibility: public, license: CC-BY-4.0}
    expect:
      visibilityIntent: private
      public: false
