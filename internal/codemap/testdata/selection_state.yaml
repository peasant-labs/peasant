cases:
  - name: all_mode_selection_inactive_nothing_hidden
    classification: must-pass
    provenance: {source: requirement, ref: peasant-166-all-mode-inactive}
    mutation: {description: switch selection.mode to selected so Active flips true even though nothing new is hidden}
    input:
      selection: {mode: all, allowed_project_names: [], allowed_sessions: []}
      projects:
        - cwd: /work/alpha
          sessions: ["11111111-1111-1111-1111-111111111111", "22222222-2222-2222-2222-222222222222"]
        - cwd: /work/beta
          sessions: ["33333333-3333-3333-3333-333333333333"]
    expected: {active: false, hidden_projects: 0, hidden_sessions: 0, visible_project_count: 2}

  - name: selected_mode_hides_one_project_entirely
    classification: must-pass
    provenance: {source: bug, ref: peasant-166-project-fully-hidden}
    mutation: {description: add /work/beta to the allowed project names so it is no longer fully hidden}
    input:
      selection: {mode: selected, allowed_project_names: ["/work/alpha"], allowed_sessions: []}
      projects:
        - cwd: /work/alpha
          sessions: ["44444444-4444-4444-4444-444444444444", "55555555-5555-5555-5555-555555555555"]
        - cwd: /work/beta
          sessions: ["66666666-6666-6666-6666-666666666666", "77777777-7777-7777-7777-777777777777", "88888888-8888-8888-8888-888888888888"]
    expected: {active: true, hidden_projects: 1, hidden_sessions: 3, visible_project_count: 1}

  - name: selected_mode_hides_some_sessions_without_hiding_the_project_row
    classification: must-pass
    provenance: {source: requirement, ref: peasant-166-partial-session-hide-still-lists-project}
    mutation: {description: allowlist the whole project by name so no individual session is hidden}
    input:
      selection: {mode: selected, allowed_project_names: [], allowed_sessions: ["99999999-9999-9999-9999-999999999999"]}
      projects:
        - cwd: /work/gamma
          sessions: ["99999999-9999-9999-9999-999999999999", "aaaaaaaa-1111-1111-1111-111111111111", "bbbbbbbb-2222-2222-2222-222222222222"]
    expected: {active: true, hidden_projects: 0, hidden_sessions: 2, visible_project_count: 1}
