# no-race-partition.yaml — the anti-partition registry.
#
# `partition` entries run in the gate's no-race pass and are excluded from the
# race pass; `protected` entries are pinned into the race pass and must never be
# registered as partition members. Every entry carries:
#   class            one of: single-threaded-bytes | subprocess | static-analysis | toolchain
#   evidence         #<testName>, a test declared in the entry's package; the file is
#                    implied by the package/test, so an unrelated edit cannot drift it
#   justification    why the production path has no shared-memory concurrency subject
#   cost             the observed wall/cpu pair from a committed measurement
#   build_flags      (subprocess only) the child build flags, resolved against exec_command_site;
#                    a partition child must not be built with -race
#   exec_command_site (subprocess only) <file>#<funcName>#<fragment> locating the
#                    exec.Command call inside the named function by a required source fragment
#
# The fixture test internal/testkit/testgate/registry_test.go validates every entry
# against the tree. The registry records no baseline and compares nothing across
# time; it is the admission record for the partition only.
version: 1

partition:
  - package: internal/moduleboundary
    test: TestRedactionModuleBoundary
    class: toolchain
    evidence: '#TestRedactionModuleBoundary'
    justification: >-
      Reads the module graph through `go mod edit`/`go list -m` and walks the
      source tree for forbidden imports; the production path is the go tool and
      the AST, with no shared-memory concurrency subject of its own.
    cost: { wall_ms: 634, cpu_ms: 1014 }

  - package: internal/moduleboundary
    test: TestRedactionBoundaryFixtureStrictDecoding
    class: single-threaded-bytes
    evidence: '#TestRedactionBoundaryFixtureStrictDecoding'
    justification: >-
      Strict-decodes the embedded boundary fixture in-process; pure byte work,
      no goroutines or shared state.
    cost: { wall_ms: 583, cpu_ms: 934 }

  - package: internal/moduleboundary
    test: TestRedactionScannerHoldsALineAtTheRecordLimit
    class: single-threaded-bytes
    evidence: '#TestRedactionScannerHoldsALineAtTheRecordLimit'
    justification: >-
      Redacts one at-limit record through the pinned engine; single-threaded
      byte work on a private input.
    cost: { wall_ms: 895, cpu_ms: 1240 }

  - package: internal/moduleboundary
    test: TestRedactionEngineHandlesRecordOverTheOldLimit
    class: single-threaded-bytes
    evidence: '#TestRedactionEngineHandlesRecordOverTheOldLimit'
    justification: >-
      Redacts a record over the retired 10 MiB limit through the real engine.
      The size is the invariant, so it stays; the work is single-threaded bytes
      with no concurrency subject, and the race detector only inflates it.
    cost: { wall_ms: 25700, cpu_ms: 26013 }

  - package: internal/e2e
    test: TestPeasantBinSeamUnsetBuildsGoBinary
    class: subprocess
    evidence: '#TestPeasantBinSeamUnsetBuildsGoBinary'
    justification: >-
      The build IS the assertion: with PEASANT_BIN empty the seam must build the
      real CLI and run it. The production code runs in the `go build` child, so
      the race detector would instrument the child and change what is proven.
    build_flags: []
    exec_command_site: 'internal/e2e/skipgate_seams.go#buildPeasant#exec.Command("go", "build"'
    cost: { wall_ms: 2773, cpu_ms: 4218 }

  - package: cmd/peasant
    test: TestWebCapabilitiesMatrix
    class: subprocess
    evidence: '#TestWebCapabilitiesMatrix'
    justification: >-
      Boots the real CLI built without the race detector for each matrix case and
      asserts the advertised capability set plus the mounted SPA routes. The
      production code under test runs in the `go build` child; the in-process test
      body only drives HTTP and asserts tokens, so it has no shared-memory
      concurrency subject of its own.
    build_flags: ["-race=false"]
    exec_command_site: 'cmd/peasant/web_capabilities_matrix_test.go#buildPeasantMatrixBinary#exec.Command("go", "build", "-race=false"'
    cost: { wall_ms: 21330, cpu_ms: 138425 }

  - package: internal/transcript
    test: TestBuildSnapshotDetailBytesSerializesInsideSnapshotCallback
    class: static-analysis
    evidence: '#TestBuildSnapshotDetailBytesSerializesInsideSnapshotCallback'
    justification: >-
      The deterministic source oracle for the snapshot-lock boundary: it parses
      production source and asserts where serialization lives. It reads bytes
      and the AST; it runs no production goroutines.
    cost: { wall_ms: 773, cpu_ms: 1331 }

  - package: internal/ingest
    test: TestOpenCodePrivateExecutionGuardCoversFixtureOwnedBuildTopology
    class: static-analysis
    evidence: '#TestOpenCodePrivateExecutionGuardCoversFixtureOwnedBuildTopology'
    justification: >-
      The source oracle for the private-execution guard across build topologies:
      it copies production source into isolated packages, inventories each build
      configuration with `go list`, and parses and type-checks the files to assert
      which SQLite callables are reachable. The go tool only lists files and export
      data; the assertion is over the AST and types, and no production goroutines
      run, so the detector has no shared-memory subject here. The guard itself and
      the SQLite paths it inspects stay race-covered by the rest of the ingest
      suite; the residual risk is a race inside the checker helpers, which are
      sequential over private per-case directories.
    cost: { wall_ms: 31410, cpu_ms: 94540 }

  - package: internal/ingest
    test: TestOpenCodePrivateExecutionGuardRejectsFixtureOwnedBuildTaggedBypasses
    class: static-analysis
    evidence: '#TestOpenCodePrivateExecutionGuardRejectsFixtureOwnedBuildTaggedBypasses'
    justification: >-
      Resolves each build-tagged production configuration with `go list`, writes a
      fixture-owned bypass file, type-checks it with the configuration's sources,
      and asserts the guard rejects it. The oracle is the AST and type information;
      no production goroutines run, so the detector has no shared-memory subject.
      The guard and the tagged production sources stay race-covered by the rest of
      the ingest suite; the residual risk is a race inside the sequential checker
      helpers over private temp files.
    cost: { wall_ms: 23410, cpu_ms: 68970 }

  - package: internal/ingest
    test: TestLargeRecordsAreHandledUniformlyAcrossHarnesses
    class: single-threaded-bytes
    evidence: '#TestLargeRecordsAreHandledUniformlyAcrossHarnesses'
    justification: >-
      Filters, indexes, and extracts metadata from over-limit JSONL records for
      every harness synchronously in-process: no goroutines, channels, atomics,
      store opens, or SQL on the path. The record sizes are the invariant, so they
      stay; the race detector only instruments bulk byte touches it cannot observe
      as sharing. The filter, scanner, indexers, and adapters stay race-covered by
      the rest of the ingest suite; the moved assertions are deterministic byte
      outcomes (placeholder counts and marker presence).
    cost: { wall_ms: 5220, cpu_ms: 6420 }

protected:
  - package: internal/ingest
    test: TestOpenCodeNativeCLI
    class: subprocess
    evidence: '#TestOpenCodeNativeCLI'
    justification: >-
      The pinned counter-example: its `go build` child is built with
      nativeCLIRaceFlag, which is `-race=true` under the `race` build tag, so it
      can never be a partition member — the child must carry the detector with
      the enclosing suite.
    build_flags: ["-race=true"]
    exec_command_site: 'internal/ingest/opencode_native_cli_test.go#TestOpenCodeNativeCLI#exec.CommandContext(ctx, "go", "build", nativeCLIRaceFlag'
    cost: { wall_ms: 39216, cpu_ms: 53162 }
