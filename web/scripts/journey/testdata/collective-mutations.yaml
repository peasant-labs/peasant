requiredNames: [typed-partial-report-discarded, village-back-in-nav, village-body-missing]
cases:
  - name: typed-partial-report-discarded
    testName: web-catalog-updated-history-old-502
    asset: /app/village/
    # The request options and the response check are semantic; the minified identifiers around
    # them (request helper, schema namespace) move with the compiler. The injected guard names
    # the response local, so a rename fails the expected-error check instead of passing silently.
    find: '{method:"POST",signal:e});if(!'
    replace: '{method:"POST",signal:e});if(!s.ok)throw Error("typed partial report discarded");if(!'
    expectedError: metadata fetch partial
  - name: village-back-in-nav
    testName: village-route-only-from-home
    # fairtrade's registry lands in a shared numbered chunk; the find is unique across them.
    asset: /_next/static/chunks/
    find: 'Object.freeze({id:"village",label:"online",inNav:!1})'
    replace: 'Object.freeze({id:"village",label:"online",inNav:!0})'
    expectedError: 'a[href^="/village"]'
  - name: village-body-missing
    testName: village-direct-link-mounts-body
    asset: /app/village/
    find: '("div",{className:"village-page",children:['
    replace: '("section",{className:"village-page",hidden:!0,children:['
    expectedError: online observations
