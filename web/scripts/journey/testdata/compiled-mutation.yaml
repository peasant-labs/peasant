    source: 'async function read(){return {ok:true}}'
    missing: true
  - name: duplicate-anchor
    source: 'async function one(e){let s=await (0,c.yT)(t,{method:"POST",signal:e});if(!o.rHE.safeParse(s.body).success)throw Error("invalid")}async function two(e){let s=await (0,c.yT)(t,{method:"POST",signal:e});if(!o.rHE.safeParse(s.body).success)throw Error("invalid")}'
