    source: 'async function fetcher(t){let a=await (0,c.yT)(u,{method:"POST",signal:t});if(!o.rHE.safeParse(a.body).success)throw Error("invalid");return a}'
    guard: 'if(!a.ok)throw Error("typed partial report discarded")'
  - name: renamed-locals
    source: 'async function m(e){let t="".concat(u,"/fetch"),s=await (0,c.yT)(t,{method:"POST",signal:e});if(!o.rHE.safeParse(s.body).success)throw Error("invalid");return s}'
