# The transcript reads its display metadata from the local
# SessionDetailReadPayload after the full quality topic is retired: the stored
# title becomes the hero heading, the personal medians reach the scorecard, and
# a new read revision carries the new baseline. The durable push payload stays
# unchanged, so none of these read-only fields ever reaches adaptTranscript.
cases:
  - name: the read payload medians reach the scorecard unchanged
    revision: '7'
    medians: { retryShare: 0.03, specQualityScore: 61, withinSessionReverts: 0 }
    expectedMedians: { retryShare: 0.03, specQualityScore: 61, withinSessionReverts: 0 }
  - name: an absent medians baseline stays absent
    revision: '7'
    medians: null
    expectedMedians: null
  - name: a new read revision carries the new medians
    revision: '7'
    medians: { retryShare: 0.03, specQualityScore: 61 }
    expectedMedians: { retryShare: 0.03, specQualityScore: 61 }
    nextRevision: '8'
    nextMedians: { retryShare: 0.09, specQualityScore: 70 }
    expectedNextMedians: { retryShare: 0.09, specQualityScore: 70 }
