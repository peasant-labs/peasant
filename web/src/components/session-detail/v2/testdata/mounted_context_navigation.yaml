# Retained-history disclosure and authorized current-target links, exercised
# through the real packed Fairtrade adapter and viewer mounted by the production
# session-detail component. Every case carries the durable relationships, the
# separately authorized read navigation, and the exact header the reader must
# see. A case with `navigation:` omitted is a read that could not authorize a
# target, so it must stay an honest reference rather than a link.
cases:
  - name: distinct-context-and-starter
    search: ''
    relationships:
      - {kind: context_from, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000f0', evidence: native_typed}
      - {kind: started_by, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000e0', evidence: native_typed}
    navigation:
      - {kind: context_from, status: resolved, localId: '00000000-0000-4000-8000-0000000000f0'}
      - {kind: started_by, status: resolved, localId: '00000000-0000-4000-8000-0000000000e0'}
    expectedHeader:
      - {label: context inherited from, link: true}
      - {label: started by, link: true}
    expectedPushRowIndex: 1
    expectedPushLocalId: '00000000-0000-4000-8000-0000000000e0'
  - name: same-target-combined
    search: ''
    relationships:
      - {kind: context_from, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000f0', evidence: native_typed}
      - {kind: started_by, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000f0', evidence: native_typed}
    navigation:
      - {kind: context_from, status: resolved, localId: '00000000-0000-4000-8000-0000000000f0'}
      - {kind: started_by, status: resolved, localId: '00000000-0000-4000-8000-0000000000f0'}
    expectedHeader:
      - {label: context inherited from and started by, link: true}
    expectedPushLocalId: '00000000-0000-4000-8000-0000000000f0'
  - name: absent-target-unavailable
    search: ''
    relationships:
      - {kind: started_by, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000e0', evidence: native_typed}
    navigation:
      - {kind: started_by, status: known_unavailable}
    expectedHeader:
      - {label: started by, status: source unavailable, link: false}
    expectedPushLocalId: ''
  - name: unknown-target
    search: ''
    relationships:
      - {kind: started_by, targetState: unknown, evidence: unknown}
    navigation:
      - {kind: started_by, status: unknown}
    expectedHeader:
      - {label: started by, status: unknown source, link: false}
    expectedPushLocalId: ''
  - name: conflicting-evidence
    search: ''
    relationships:
      - {kind: context_from, targetState: conflicting_current_native_evidence, evidence: conflict}
    navigation:
      - {kind: context_from, status: conflicting}
    expectedHeader:
      - {label: context inherited from, status: conflicting source evidence, link: false}
    expectedPushLocalId: ''
  - name: navigation-omitted
    search: ''
    relationships:
      - {kind: started_by, targetState: target_known, targetLocalId: '00000000-0000-4000-8000-0000000000e0', evidence: native_typed}
    expectedHeader:
      - {label: started by, status: source unavailable, link: false}
    expectedPushLocalId: ''
  - name: explicit-none-has-no-header-row
    search: ''
    relationships:
      - {kind: started_by, targetState: explicit_none, evidence: native_typed}
    navigation:
      - {kind: started_by, status: resolved, localId: '00000000-0000-4000-8000-0000000000e0'}
    expectedHeader: []
    expectedPushLocalId: ''
  - name: earlier-history-collapsed-then-restored
    search: ''
    earlierSections:
      - state: uncertain_migrated
        turns:
          - {index: 0, content: unique old child question}
    expectedHeader: []
    expectedEarlierCount: 1
  - name: earlier-history-restored-from-route
    search: '?earlier=earlier-0'
    earlierSections:
      - state: uncertain_migrated
        turns:
          - {index: 0, content: unique old child question}
    expectedHeader: []
    expectedEarlierCount: 1
