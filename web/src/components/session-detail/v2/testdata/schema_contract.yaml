cases:
  - name: flat git context drives file navigation
    family: flat-git-fields
    harness: antigravity
    turnsMode: populated
    depth: 3
    stopReason: max_turn_requests
    toolOptionalNumbersMode: populated
    durationMs: 125
    exitCode: 0
    scorecardMode: absent
    workingDirectoryMode: populated
    workingDirectory: /workspace/flat-project
    legacyWorkingDirectory: /workspace/legacy-project
    filePath: /workspace/flat-project/src/index.ts
    expectedTurnCount: 1
    expectedFileNode: src/index.ts
    expectedScorecardState: absent
  - name: null turns normalize at the mounted boundary
    family: nullable-turns
    harness: codex
    turnsMode: 'null'
    depth: 0
    stopReason: end_turn
    toolOptionalNumbersMode: absent
    durationMs: 0
    exitCode: 0
    scorecardMode: 'null'
    workingDirectoryMode: populated
    workingDirectory: /workspace/null-turns
    legacyWorkingDirectory: /workspace/legacy-null-turns
    filePath: ''
    expectedTurnCount: 0
    expectedFileNode: ''
    expectedScorecardState: absent
  - name: refusal survives canonical transcript adaptation
    family: expanded-stop-reasons
    harness: claude-code
    turnsMode: populated
    depth: 2
    stopReason: refusal
    toolOptionalNumbersMode: absent
    durationMs: 0
    exitCode: 0
    scorecardMode: absent
    workingDirectoryMode: populated
    workingDirectory: /workspace/refusal
    legacyWorkingDirectory: /workspace/legacy-refusal
    filePath: ''
    expectedTurnCount: 1
    expectedFileNode: ''
    expectedScorecardState: absent
  - name: nullable scorecard members reach analytics unchanged
    family: nullable-scorecard-members
    harness: gemini-cli
    turnsMode: populated
    depth: 1
    stopReason: end_turn
    toolOptionalNumbersMode: absent
    durationMs: 0
    exitCode: 0
    scorecardMode: nullable-member
    workingDirectoryMode: populated
    workingDirectory: /workspace/scorecard
    legacyWorkingDirectory: /workspace/legacy-scorecard
    filePath: ''
    expectedTurnCount: 1
    expectedFileNode: ''
    expectedScorecardState: nullable-member
  - name: legacy working directory cannot authorize map navigation
    family: legacy-git-context-isolation
    harness: cursor
    turnsMode: populated
    depth: 1
    stopReason: end_turn
    toolOptionalNumbersMode: absent
    durationMs: 0
    exitCode: 0
    scorecardMode: absent
    workingDirectoryMode: absent
    workingDirectory: ''
    legacyWorkingDirectory: /workspace/legacy-only
    filePath: /workspace/legacy-only/src/legacy.ts
    expectedTurnCount: 1
    expectedFileNode: ''
    expectedScorecardState: absent
