expectedCaseCount: 3
requiredNames:
  - the read payload medians reach the scorecard unchanged
  - an absent medians baseline stays absent
  - a new read revision carries the new medians
expectedLoaderMutationCount: 2
loaderMutations:
  - name: read payload metadata case count drift is rejected
    target: manifest
    find: "expectedCaseCount: 3\nrequiredNames:"
    replace: "expectedCaseCount: 2\nrequiredNames:"
    expectedError: independent manifest
  - name: read payload metadata duplicate names are rejected
    target: cases
    find: "an absent medians baseline stays absent"
    replace: "the read payload medians reach the scorecard unchanged"
    expectedError: duplicate
expectedMutationCount: 3
mutations:
  - name: the scorecard cannot lose the read payload medians
    target: /src/components/session-detail/v2/SessionDetailV2.tsx
    find: "      medians,\n    });"
    replace: "    });"
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.qualityMedianBridge.test.tsx
    expectedFailedTestNames:
      - the read payload medians reach the scorecard unchanged
    expectedFailurePattern: 'expected undefined to deeply equal'
  - name: the hero heading cannot lose the stored read title
    target: /src/components/session-detail/v2/SessionDetailV2.tsx
    find: "title: sessionTitle ?? UNTITLED_SESSION_TITLE"
    replace: "title: UNTITLED_SESSION_TITLE"
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.qualityMedianBridge.test.tsx
    expectedFailedTestNames:
      - the read payload medians reach the scorecard unchanged
    expectedFailurePattern: 'refactor the ingest pipeline'
  - name: the durable push payload cannot absorb read-only metadata
    target: /src/components/session-detail/v2/SessionDetailV2.tsx
    find: "      title: _title,\n"
    replace: ""
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.qualityMedianBridge.test.tsx
    expectedFailedTestNames:
      - the read payload medians reach the scorecard unchanged
    expectedFailurePattern: 'the durable payload must not carry title'
