expectedCaseCount: 9
requiredNames:
  - distinct-context-and-starter
  - same-target-combined
  - absent-target-unavailable
  - unknown-target
  - conflicting-evidence
  - navigation-omitted
  - explicit-none-has-no-header-row
  - earlier-history-collapsed-then-restored
  - earlier-history-restored-from-route
expectedLoaderMutationCount: 5
loaderMutations:
  - {name: manifest count drift is rejected, target: manifest, find: "expectedCaseCount: 9\nrequiredNames:", replace: "expectedCaseCount: 8\nrequiredNames:", expectedError: independent manifest count}
  - {name: manifest duplicate names are rejected, target: manifest, find: "  - distinct-context-and-starter\n  - same-target-combined", replace: "  - distinct-context-and-starter\n  - distinct-context-and-starter", expectedError: unique}
  - {name: case unknown fields are rejected, target: cases, find: "  - name: unknown-target\n    search: ''", replace: "  - name: unknown-target\n    unknown: true\n    search: ''", expectedError: fields}
  - {name: case names are rejected, target: cases, find: "  - name: conflicting-evidence", replace: "  - name: renamed-evidence-case", expectedError: independent manifest names}
  - {name: multiple YAML documents are rejected, target: cases, find: "cases:", replace: "---\ncases:", expectedError: one YAML document}
expectedMutationCount: 3
mutations:
  - name: durable payload keeps the read navigation mixed in
    find: "const { relationshipNavigation: _readMetadata, ...durable } = detail;"
    replace: "const durable = detail;"
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.relationshipNavigation.test.tsx
    expectedFailedTestNames:
      - distinct-context-and-starter
      - same-target-combined
      - absent-target-unavailable
      - unknown-target
      - conflicting-evidence
      - explicit-none-has-no-header-row
    expectedFailurePattern: refused the durable payload
  - name: host stops persisting the retained-history disclosure
    find: "onEarlierHistoryOpenChange={setEarlierHistoryOpen}"
    replace: "onEarlierHistoryOpenChange={undefined}"
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.relationshipNavigation.test.tsx
    expectedFailedTestNames:
      - earlier-history-collapsed-then-restored
    expectedFailurePattern: mounted context navigation invariant failed
  - name: host routes a relationship link to the current session instead of the authorized target
    find: "router.push(transcriptHref(projectHash, entry.localId));"
    replace: "router.push(transcriptHref(projectHash, sessionId));"
    expectedTestFile: src/components/session-detail/v2/SessionDetailV2.relationshipNavigation.test.tsx
    expectedFailedTestNames:
      - distinct-context-and-starter
      - same-target-combined
    expectedFailurePattern: mounted context navigation invariant failed
