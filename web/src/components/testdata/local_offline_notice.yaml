# When the local offline notice shows. Each case drives the real LayoutShell —
# the real WebSocketProvider through a mock socket, GET /api/v1/health through a
# mock fetch — step by step on fake timers (LocalOfflineNotice.test.tsx).
#
# Steps, in order:
#   health: up | down | error | hang
#                         how the health route answers from now on: 200, a
#                         refused connection, a 503, or no answer at all
#   socket: open | close  the newest socket opens, or closes (a closed socket
#                         schedules the provider's own reconnect: 1 s, then 2 s,
#                         then 4 s …)
#   wait: <ms>            advance the clock; also settles pending checks
#   retry: true           press `try again` on the notice
#   focus: retry          put keyboard focus on `try again`
#   expect: shown | hidden
#   checkedAt: <ms>       the notice's `last checked` time is this many ms after
#                         the page mounted
#   sockets: <n>          how many sockets the provider has opened so far
#   healthChecks: <n>     how many health requests the page has made so far
#   announce: stopped | still | back | none
#                         what the always-mounted live region says now (the
#                         shell manifest's announcements; `still` is followed
#                         by the time of the failed check)
#   focused: main | elsewhere
#                         keyboard focus is on the page body, or is not
#
# startCommands: the command the notice offers for the port the page came
# from. `peasant web start` listens on 8690 unless told otherwise.
startCommands:
  - port: ''
    command: peasant web start
  - port: '8690'
    command: peasant web start
  - port: '8691'
    command: peasant web start --port 8691
cases:
  - name: reachable-app-shows-nothing
    steps:
      - health: up
      - socket: open
      - wait: 30000
      - expect: hidden
      - healthChecks: 1
      - announce: none

  - name: first-connect-within-grace-shows-nothing
    steps:
      - health: up
      - wait: 1500
      - expect: hidden
      - socket: open
      - wait: 30000
      - expect: hidden

  - name: stopped-app-shows-at-once
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - checkedAt: 0
      - announce: stopped

  - name: error-status-counts-as-stopped
    steps:
      - health: up
      - socket: open
      - health: error
      - socket: close
      - wait: 0
      - expect: shown

  - name: unanswered-check-times-out
    steps:
      - health: up
      - socket: open
      - health: hang
      - socket: close
      - wait: 2000
      - expect: shown
      - checkedAt: 0
      - wait: 1000
      - checkedAt: 3000

  - name: socket-blip-reconnects-without-notice
    steps:
      - health: up
      - socket: open
      - socket: close
      - wait: 0
      - sockets: 1
      - expect: hidden
      - wait: 1000
      - sockets: 2
      - socket: open
      - wait: 30000
      - expect: hidden

  - name: socket-down-past-grace-shows
    steps:
      - health: up
      - socket: open
      - socket: close
      - wait: 1900
      - expect: hidden
      - wait: 100
      - expect: shown

  - name: recheck-reconnects-at-once
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - healthChecks: 2
      - wait: 1000
      - socket: close
      - wait: 2000
      - socket: close
      - sockets: 3
      - health: up
      - wait: 2000
      - healthChecks: 3
      - sockets: 4
      - socket: open
      - wait: 0
      - expect: hidden
      - announce: back
      # Focus was never in the notice, so recovery must not move it.
      - focused: elsewhere

  - name: returning-socket-clears-a-failed-check
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - wait: 1000
      - socket: open
      - wait: 0
      - expect: hidden
      # The next drop starts clean: the old failure must not raise the notice
      # while the new check is still out.
      - health: hang
      - socket: close
      - wait: 0
      - expect: hidden

  - name: late-failure-loses-to-reconnected-socket
    steps:
      - health: up
      - socket: open
      - health: hang
      - socket: close
      - wait: 1000
      - socket: open
      - wait: 2500
      - expect: hidden

  - name: try-again-reconnects-at-once
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - health: up
      - focus: retry
      - retry: true
      - wait: 0
      - sockets: 2
      - socket: open
      - wait: 0
      - expect: hidden
      - announce: back
      - focused: main

  - name: failed-try-again-stays-usable
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - healthChecks: 2
      - retry: true
      - wait: 0
      - announce: still
      # A failed check does not reconnect: still the one closed socket.
      - sockets: 1
      - retry: true
      - wait: 0
      - healthChecks: 4
      - sockets: 1
      - expect: shown

  - name: second-outage-keeps-grace
    steps:
      - health: up
      - socket: open
      - socket: close
      - wait: 2000
      - expect: shown
      - socket: open
      - wait: 0
      - expect: hidden
      - socket: close
      - wait: 0
      - expect: hidden

  - name: unanswered-retry-does-not-reconnect
    steps:
      - health: up
      - socket: open
      - health: down
      - socket: close
      - wait: 0
      - expect: shown
      - wait: 1000
      - sockets: 2
      - socket: close
      - health: hang
      - retry: true
      - wait: 2000
      - sockets: 3
      - socket: close
      # The hung `try again` times out at 4 s: a timeout is no answer, so it
      # must not reconnect ahead of the backoff (due at 7 s).
      - wait: 2000
      - sockets: 3
      - expect: shown

  - name: stale-check-loses-to-newer-answer
    steps:
      - health: up
      - socket: open
      - health: hang
      - socket: close
      - wait: 1000
      - socket: open
      - wait: 0
      - expect: hidden
      - health: up
      - wait: 1000
      - socket: close
      - wait: 900
      - expect: hidden
      # The first check times out at 3 s, after the newer one answered: it
      # must not raise the notice.
      - wait: 200
      - expect: hidden
