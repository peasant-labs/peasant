# --app-chrome-height is the persistent chrome above page content: nothing on a
# wide screen, where fairtrade's sidebar is a column beside the page, and the
# sidebar's top bar (fairtrade's --nav-h) below its 768px breakpoint, the one
# override. --app-header-height is where page content starts: that chrome plus,
# while it shows, the local offline notice at the top of the page column, grown
# by the notice's measured height. --app-body-height is what a full-height page
# fills below it, with a floor on short screens. The test requires every
# consumer path below.
chromeVariable: --app-chrome-height
chromeValue: 0px
chromeNarrow: '@media (width < 768px) {'
chromeNarrowValue: 'var(--nav-h)'
variable: --app-header-height
value: calc(var(--app-chrome-height) + var(--app-notice-height, 0px))
bodyVariable: --app-body-height
# The floor a full-height page keeps under the notice on a short screen (the
# offline gate checks it binds there).
bodyFloor: 24rem
# The one declaration of "a screen with room to pin the offline notice".
noticePinnedVariant: '@custom-variant notice-pinned (@media (min-height: 40rem) and (min-width: 48rem));'
noticePinnedClass: notice-pinned:sticky
noticeHeight:
  path: src/components/LocalOfflineNotice.tsx
  token: setProperty('--app-notice-height'
consumers:
  - path: src/components/session-detail/v2/SessionDetailV2.tsx
    token: flex h-full min-h-0 flex-col
forbidden:
  - calc(100vh - 64px)
  - calc(100dvh - 64px)
# <main> must not be focusable at rest: a click in the page would focus it and
# steer Tab and keyboard scrolling. The offline notice makes it focusable only
# for its own focus move. Nothing fixed sits over it, so it pads no top.
restingMain:
  path: src/components/LayoutShell.tsx
