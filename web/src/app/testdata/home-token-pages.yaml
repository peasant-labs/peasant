requiredNames:
  - page-offset-and-next-items
  - child-page-offset
  - revision-change-clears-cache
  - scope-error-restarts-once
  - generic400-does-not-restart
  - project-options-do-not-block-rows
  - project-filter-aborts-old-continuation
  - late-options-cannot-win-filter-reset
  - account-reset-reloads-project-options
  - project-options-error-retains-rows-and-retries
  - project-options-selection-error-retains-rows-and-retries
  - beyond-last-clamps-and-rewrites-url
  - page-size-resets-to-one
  - omitted-view-serves-home-page
  - empty-store-page-one-total-zero
projects:
  - { projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, projectName: alpha }
  - { projectHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, projectName: beta }
cases:
  - name: page-offset-and-next-items
    pages:
      '1': { ids: [root-one], nextIds: [root-two], total: 26 }
      '2': { ids: [root-two], nextIds: [], total: 26 }

  - name: child-page-offset
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    children:
      root-one:
        '1': { ids: [child-one], nextIds: [child-two], total: 2 }
        '2': { ids: [child-two], nextIds: [], total: 2 }

  - name: revision-change-clears-cache
    pages:
      '1': { ids: [root-one], nextIds: [], total: 26, revision: '1' }
      '2': { ids: [root-two], nextIds: [], total: 26, revision: '1' }
    refreshed:
      '1': { ids: [fresh-root-one], nextIds: [], total: 26, revision: '2' }
      '2': { ids: [fresh-root-two], nextIds: [], total: 26, revision: '2' }

  - name: scope-error-restarts-once
    pages:
      '1': { ids: [root-one], nextIds: [], total: 26 }
      '2': { ids: [root-two], nextIds: [], total: 26, failOnce: { status: 400, code: sync_page_scope_changed } }
    rejectRestart: true

  - name: generic400-does-not-restart
    pages:
      '1': { ids: [root-one], nextIds: [], total: 26 }
      '2': { ids: [], nextIds: [], total: 26, status: 400, code: invalid_query }

  - name: project-options-do-not-block-rows
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    deferOptions: true

  - name: project-filter-aborts-old-continuation
    pages:
      '1': { ids: [root-one], nextIds: [], total: 26 }
      '2': { ids: [old-off-page], nextIds: [], total: 26, deferred: true }
    refreshed:
      '1': { ids: [fresh-root-one], nextIds: [], total: 1 }
      '2': { ids: [], nextIds: [], total: 1 }

  - name: late-options-cannot-win-filter-reset
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    deferOptions: true

  - name: account-reset-reloads-project-options
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    refreshed:
      '1': { ids: [fresh-root-one], nextIds: [], total: 1 }

  - name: project-options-error-retains-rows-and-retries
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    optionsError: { status: 503, code: sync_page_unavailable }

  - name: project-options-selection-error-retains-rows-and-retries
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }
    optionsError: { status: 500, code: selection_visibility }

  - name: beyond-last-clamps-and-rewrites-url
    search: 'page=99&perPage=25'
    pages:
      '99': { ids: [root-last], nextIds: [], total: 30, servedPage: 2 }
      '2': { ids: [root-last], nextIds: [], total: 30 }

  - name: page-size-resets-to-one
    pages:
      '1': { ids: [root-one], nextIds: [], total: 26 }
      '2': { ids: [root-two], nextIds: [], total: 26 }
    resized:
      '1': { ids: [root-one, root-two], nextIds: [], total: 51 }

  - name: omitted-view-serves-home-page
    pages:
      '1': { ids: [root-one], nextIds: [], total: 1 }

  - name: empty-store-page-one-total-zero
    pages:
      '1': { ids: [], nextIds: [], total: 0 }
