# Root page publish-state filters, asserted on the mounted page.
#
# Each case supplies the canonical sync/publication stimulus for the mocked
# GET /api/v1/sync/sessions?view=home projection, presses `filter`, and checks
# the rows in order across the pages of the table, read with `next page`.
# expectedCounts describes this complete fixture population for membership
# assertions; no UI total is shown.
#
# sessions: the sync list, newest first. `count` > 1 expands one entry into that
#   many sessions named `<id>-00`, `<id>-01`, ... A session with
#   `publication: false` gets no publication row, and one with
#   `outsideSelection: true` is marked outside the saved selection: the list
#   shows neither, and neither may appear anywhere on the page.
# expectedPages: the rows on each page of the table, first to last. Omitted,
#   the whole list fits on the first page.
# expectedLabels: the publish state each named row shows.
requiredNames:
  - pending-root-read-omits-session-stat
  - failed-root-read-omits-session-stat
  - all-counts
  - not-published-counts
  - published-counts
  - auto-counts
  - outside-selection-hidden
  - next-page
  - pending-collectives-cannot-read
  - parent-visible-child-grouped
  - recursive-family-and-refresh
  - deep-family-expands-one-level-at-a-time
  - snapshot-and-evidence-children-with-absent-parents-hidden
  - unresolved-child-hidden
  - cache-only-child-grouped
  - filtered-parent-omits-child
  - selection-hidden-parent-and-child
  - fork-without-markers-top-level
  - paging-keeps-child-with-parent
  - child-search-keeps-publish-label
cases:
  - name: pending-root-read-omits-session-stat
    readState: pending
    expectedSessions: null
    sessions: [{ id: pending-root, project: alpha, syncStatus: new, state: unpublished }]
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [pending-root]
  - name: failed-root-read-omits-session-stat
    readState: error
    expectedSessions: null
    sessions: [{ id: failed-root, project: alpha, syncStatus: new, state: unpublished }]
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [failed-root]
  # Synthetic depth stimulus, not a claim about a live corpus or a UI depth cap.
  # chainLength generates unique <id>-<index> rows, each parented by its predecessor.
  - name: deep-family-expands-one-level-at-a-time
    sessions:
      - { id: deep, chainLength: 20000, project: alpha, syncStatus: new, state: unpublished }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [deep-0]
    expectedGroups: [deep-0]
    steps:
      - { expand: deep-0, children: [deep-1], groups: [deep-0, deep-1] }
      - { expand: deep-1, children: [deep-1, deep-2], groups: [deep-0, deep-1, deep-2] }
      - { expand: deep-0, children: [], groups: [deep-0] }
      - { expand: deep-0, children: [deep-1, deep-2], groups: [deep-0, deep-1, deep-2] }
  - name: all-counts
    sessions:
      - { id: s-new, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-pub, project: alpha, syncStatus: synced, state: published, audience: 2 }
      - { id: s-turns, project: beta, syncStatus: updated, state: published, audience: 1 }
      - { id: s-auto, project: beta, syncStatus: new, state: unpublished, autoPublish: true }
    filter: all
    expectedCounts: { all: 4, notPublished: 2, published: 2, auto: 1 }
    expectedRows: [s-new, s-pub, s-turns, s-auto]
    expectedLabels:
      s-new: not published
      s-pub: published to 2 collectives
      s-turns: needs update
      s-auto: auto-publish on

  - name: not-published-counts
    sessions:
      - { id: s-a, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-b, project: alpha, syncStatus: synced, state: published }
      - { id: s-c, project: beta, syncStatus: new, state: unpublished }
      - { id: s-d, project: beta, syncStatus: new, state: unpublished, autoPublish: true }
    filter: not-published
    expectedCounts: { all: 4, notPublished: 3, published: 1, auto: 1 }
    expectedRows: [s-a, s-c, s-d]

  - name: published-counts
    sessions:
      - { id: s-a, project: alpha, syncStatus: synced, state: published }
      - { id: s-b, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-c, project: beta, syncStatus: updated, state: published, autoPublish: true, audience: 0 }
    filter: published
    expectedCounts: { all: 3, notPublished: 1, published: 2, auto: 1 }
    expectedRows: [s-a, s-c]
    expectedLabels:
      s-c: needs update

  - name: auto-counts
    sessions:
      - { id: s-a, project: alpha, syncStatus: new, state: unpublished, autoPublish: true }
      - { id: s-b, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-c, project: beta, syncStatus: synced, state: published, autoPublish: true }
    filter: auto
    expectedCounts: { all: 3, notPublished: 2, published: 1, auto: 2 }
    expectedRows: [s-a, s-c]
    expectedLabels:
      s-a: auto-publish on

  - name: outside-selection-hidden
    sessions:
      - { id: s-seen, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-hidden, project: beta, syncStatus: synced, state: published, outsideSelection: true }
      - { id: s-unread, project: beta, syncStatus: new, state: unpublished, publication: false }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [s-seen]

  - name: next-page
    sessions:
      - { id: bulk, count: 30, project: alpha, syncStatus: new, state: unpublished }
      - { id: s-last, project: beta, syncStatus: synced, state: published }
    filter: all
    expectedCounts: { all: 31, notPublished: 30, published: 1, auto: 0 }
    expectedPages: [25, 6]
    expectedRows: [bulk-00, bulk-01, bulk-02, bulk-03, bulk-04, bulk-05, bulk-06, bulk-07, bulk-08, bulk-09, bulk-10, bulk-11, bulk-12, bulk-13, bulk-14, bulk-15, bulk-16, bulk-17, bulk-18, bulk-19, bulk-20, bulk-21, bulk-22, bulk-23, bulk-24, bulk-25, bulk-26, bulk-27, bulk-28, bulk-29, s-last]

  - name: pending-collectives-cannot-read
    sessions:
      - { id: s-approved, project: alpha, syncStatus: synced, state: published, audience: 3, audienceStatuses: [approved, pending, pending] }
      - { id: s-pending, project: beta, syncStatus: synced, state: published, audience: 2, audienceStatuses: [pending, pending] }
    filter: published
    expectedCounts: { all: 2, notPublished: 0, published: 2, auto: 0 }
    expectedRows: [s-approved, s-pending]
    expectedLabels:
      s-approved: published to 1 collective
      s-pending: published

  - name: parent-visible-child-grouped
    sessions:
      - { id: root, project: alpha, syncStatus: new, state: unpublished }
      - { id: child, project: beta, syncStatus: synced, state: published, parentSessionId: root, title: Delegate Task, turnCount: 3, durationMs: 420000, startTime: '2026-05-20T08:00:00.000Z', audience: 1 }
      - { id: child-two, project: alpha, syncStatus: new, state: unpublished, parentSessionId: root, startTime: '', title: 'Lint Run' }
      - { id: other, project: alpha, syncStatus: new, state: unpublished }
      - { id: other-child, project: alpha, syncStatus: new, state: unpublished, parentSessionId: other }
    filter: all
    expectedCounts: { all: 2, notPublished: 2, published: 0, auto: 0 }
    expectedRows: [root, other]
    expectedGroups: [root, other]
    steps:
      - { expand: root, children: [child, child-two] }
    childLabels: { child: Delegate Task, child-two: 'Lint Run' }
    expectedLabels:
      child: 'published to 1 collective'
      child-two: 'not published'

  - name: recursive-family-and-refresh
    # Anonymized grandparent -> delegated parent -> two delegated children, so
    # one level of the family lists more than one subagent. Each level carries
    # its own turns, duration and start time, so a capture of the mounted family
    # proves every row renders its own values instead of the first row's.
    sessions:
      - { id: ancestor, project: alpha, syncStatus: synced, state: published, turnCount: 2, durationMs: 60000, startTime: 2026-07-29T09:00:00Z }
      - { id: delegate, project: beta, syncStatus: new, state: unpublished, parentSessionId: ancestor, preview: Inspect the Parser, turnCount: 4, durationMs: 480000, startTime: 2026-09-02T09:00:00Z }
      - { id: nested-agent, project: beta, syncStatus: synced, state: published, parentSessionId: delegate, turnCount: 9, durationMs: 1320000, startTime: 2026-10-02T09:00:00Z }
      - { id: second-agent, project: beta, syncStatus: new, state: unpublished, parentSessionId: delegate, turnCount: 1, durationMs: 120000, startTime: 2026-10-11T09:00:00Z }
    filter: all
    expectedCounts: { all: 1, notPublished: 0, published: 1, auto: 0 }
    expectedRows: [ancestor]
    expectedGroups: [ancestor]
    steps:
      - { expand: ancestor, children: [delegate] }
      - { expand: delegate, children: [delegate, nested-agent, second-agent] }
      - { refresh: true, children: [delegate, nested-agent, second-agent] }
    childLabels: { delegate: '“Inspect the Parser”', nested-agent: nested-a, second-agent: second-a }

  - name: snapshot-and-evidence-children-with-absent-parents-hidden
    sessions:
      - { id: root, project: alpha, syncStatus: new, state: unpublished }
      - { id: snapshot-child, project: alpha, syncStatus: synced, state: published, parentSessionId: absent-snapshot-parent }
      - { id: evidence-child, project: beta, syncStatus: new, state: unpublished, parentSessionId: unstored-evidence-parent }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [root]
    expectedGroups: []

  - name: unresolved-child-hidden
    sessions:
      - { id: root, project: alpha, syncStatus: new, state: unpublished }
      - { id: unresolved-agent, project: beta, syncStatus: new, state: unpublished, parentUnresolved: true }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [root]
    expectedGroups: []

  - name: cache-only-child-grouped
    sessions:
      - { id: stored-parent, project: alpha, syncStatus: new, state: unpublished }
      - { id: cache-child, project: beta, syncStatus: new, state: unpublished, parentSessionId: stored-parent }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [stored-parent]
    expectedGroups: [stored-parent]
    steps:
      - { expand: stored-parent, children: [cache-child] }
    childLabels: { cache-child: cache-ch }

  - name: filtered-parent-omits-child
    sessions:
      - { id: shown, project: alpha, syncStatus: synced, state: published }
      - { id: filtered-parent, project: alpha, syncStatus: new, state: unpublished }
      - { id: published-child, project: beta, syncStatus: synced, state: published, parentSessionId: filtered-parent }
    filter: published
    expectedCounts: { all: 2, notPublished: 1, published: 1, auto: 0 }
    expectedRows: [shown]
    expectedGroups: []

  - name: selection-hidden-parent-and-child
    sessions:
      - { id: shown, project: alpha, syncStatus: new, state: unpublished }
      - { id: hidden-parent, project: beta, syncStatus: new, state: unpublished, outsideSelection: true }
      - { id: visible-child, project: beta, syncStatus: new, state: unpublished, parentSessionId: hidden-parent }
      - { id: hidden-child, project: alpha, syncStatus: new, state: unpublished, parentSessionId: shown, outsideSelection: true }
      - { id: unread-child, project: alpha, syncStatus: new, state: unpublished, parentSessionId: shown, publication: false }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [shown]
    expectedGroups: []

  - name: fork-without-markers-top-level
    sessions:
      - { id: fork, project: alpha, syncStatus: new, state: unpublished }
      - { id: fork-child, project: alpha, syncStatus: new, state: unpublished, parentSessionId: fork }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [fork]
    expectedGroups: [fork]

  - name: paging-keeps-child-with-parent
    sessions:
      - { id: bulk, count: 25, project: alpha, syncStatus: new, state: unpublished }
      - { id: last-parent, project: beta, syncStatus: synced, state: published }
      - { id: last-child, project: beta, syncStatus: synced, state: published, parentSessionId: last-parent }
    filter: all
    expectedCounts: { all: 26, notPublished: 25, published: 1, auto: 0 }
    expectedRows: [bulk-00, bulk-01, bulk-02, bulk-03, bulk-04, bulk-05, bulk-06, bulk-07, bulk-08, bulk-09, bulk-10, bulk-11, bulk-12, bulk-13, bulk-14, bulk-15, bulk-16, bulk-17, bulk-18, bulk-19, bulk-20, bulk-21, bulk-22, bulk-23, bulk-24, last-parent]
    expectedPages: [25, 1]
    expectedGroups: []
    steps:
      - { expand: last-parent, children: [last-child] }

  - name: child-search-keeps-publish-label
    sessions:
      - { id: root, project: alpha, syncStatus: new, state: unpublished }
      - { id: search-child, project: beta, syncStatus: synced, state: published, parentSessionId: root }
    filter: all
    expectedCounts: { all: 1, notPublished: 1, published: 0, auto: 0 }
    expectedRows: [root]
    expectedGroups: [root]
    searchChild: search-child
