requiredNames:
  - numbered-pages-from-the-url
  - loaded-refresh-keeps-content-on-failure
  - stale-filter-response
  - lazy-children-and-child-more
  - account-change-clears-old-rows
  - collapsed-late-child-is-ignored
  - selection-error-keeps-loaded-content
  - overlapping-refresh-does-not-race
  - collapse-cancels-expanded-refresh
  - collapsed-ancestor-skips-descendant-refresh
  - successful-refresh-invalidates-collapsed-family
  - successful-refresh-invalidates-collapsed-descendant
  - canonical-missing-parent-commits-refreshed-roots
  - generic-child404-retains-visible-content
  - publish-settlement-refreshes-loaded-window
  - publish-during-refresh-queues-one-loaded-window
  - selection-error-retry-failure-keeps-loaded-content
  - selection-error-account-change-refreshes-loaded-content
  - claude-teammate-line
  - no-claude-teammate-line
