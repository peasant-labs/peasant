# The one "install in N repositories" action of the auto-publish group. Each
# case mounts the page with the listed rules (as GET /api/v1/settings answers
# them), checks what the page offers before any click, clicks the action when
# one is offered, answers each POST .../{id}/install by rule id and repository
# path, and checks the calls and what each repository shows. No install call may
# be made before the click. The install endpoint is rule-scoped: a call answers
# only for the calling rule's events, so the fixture answers per rule.
#
# offer: the action's label, or null when no action may be offered.
# calls: every install call after the click, in order, as "rule id -> path".
# preview: text each repository's install preview must show before the click,
#   by path (timing, audience, failure behavior, uninstall command, remedy).
# shows: text each repository's result must show, by path (a remedy included).
# refreshed: text each rule's view must show after the install, by rule id.
requiredNames:
  - installs once per repository and shows a foreign hook's remedy
  - a repository two rules with the same event installs once
  - a repository two rules cover with different events installs once per event
  - a blocked hook in a repository to install shows its remedy in the preview
  - a paused rule offers no install
  - nothing is offered when every hook is there
  - a refused call shows the server's reason
  - a path with a space and an apostrophe is quoted in the uninstall command
  - a failed event stays failed when a later call succeeds for another event
cases:
  - name: installs once per repository and shows a foreign hook's remedy
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
          - {path: /home/alice/work/acme/web, label: "github.com:acme/web", hooks: [{event: pre-push, status: absent}]}
          - {path: /home/alice/work/acme/worker, label: "github.com:acme/worker", hooks: [{event: pre-push, status: absent}]}
    answers:
      acme-work:
        /home/alice/work/acme/api: {status: 200, body: {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: installed}]}}
        /home/alice/work/acme/web: {status: 200, body: {path: /home/alice/work/acme/web, label: "github.com:acme/web", hooks: [{event: pre-push, status: installed}]}}
        /home/alice/work/acme/worker:
          status: 200
          body:
            path: /home/alice/work/acme/worker
            label: "github.com:acme/worker"
            hooks:
              - event: pre-push
                status: blocked
                remedy:
                  message: "a pre-push hook that Peasant did not write is already at /home/alice/work/acme/worker/.git/hooks/pre-push. add the section below to it by hand."
                  snippet: "# BEGIN peasant village upload (pre-push)\npeasant village push --non-interactive --quiet --timeout 5s --repository /home/alice/work/acme/worker\n# END peasant village upload (pre-push)"
    offer: install in 3 repositories
    calls:
      - acme-work -> /home/alice/work/acme/api
      - acme-work -> /home/alice/work/acme/web
      - acme-work -> /home/alice/work/acme/worker
    preview:
      /home/alice/work/acme/api:
        - on git push
        - publishes to Acme Platform, private
        - always exits 0
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event pre-push
      /home/alice/work/acme/web:
        - on git push
        - peasant village hooks uninstall --dir '/home/alice/work/acme/web' --event pre-push
      /home/alice/work/acme/worker:
        - on git push
        - peasant village hooks uninstall --dir '/home/alice/work/acme/worker' --event pre-push
    shows:
      /home/alice/work/acme/api: [hook installed]
      /home/alice/work/acme/web: [hook installed]
      /home/alice/work/acme/worker:
        - blocked
        - "a pre-push hook that Peasant did not write is already at /home/alice/work/acme/worker/.git/hooks/pre-push. add the section below to it by hand."
        - "peasant village push --non-interactive --quiet --timeout 5s --repository /home/alice/work/acme/worker"
    refreshed:
      acme-work: ["hook in 2 of 3 repositories", "blocked in 1"]
  - name: a repository two rules with the same event installs once
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
          - {path: /home/alice/work/acme/web, label: "github.com:acme/web", hooks: [{event: pre-push, status: absent}]}
      - id: acme-remote
        kind: remote
        match: "github.com:acme/api"
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000002]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
    answers:
      acme-work:
        /home/alice/work/acme/api: {status: 200, body: {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: installed}]}}
        /home/alice/work/acme/web: {status: 200, body: {path: /home/alice/work/acme/web, label: "github.com:acme/web", hooks: [{event: pre-push, status: installed}]}}
    offer: install in 2 repositories
    calls:
      - acme-work -> /home/alice/work/acme/api
      - acme-work -> /home/alice/work/acme/web
    preview:
      /home/alice/work/acme/api:
        - on git push · publishes to Acme Platform, private
        - on git push · publishes to Acme Labs, private
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event pre-push
      /home/alice/work/acme/web:
        - on git push · publishes to Acme Platform, private
        - peasant village hooks uninstall --dir '/home/alice/work/acme/web' --event pre-push
    shows:
      /home/alice/work/acme/api: [hook installed]
      /home/alice/work/acme/web: [hook installed]
    refreshed:
      acme-work: [hook in 2 of 2 repositories]
      acme-remote: [hook in 1 of 1 repository]
  - name: a repository two rules cover with different events installs once per event
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
      - id: acme-remote
        kind: remote
        match: "github.com:acme/api"
        events: [post-commit]
        collectives: [3f9c1a2b-0000-4000-8000-000000000002]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: post-commit, status: absent}]}
    answers:
      acme-work:
        /home/alice/work/acme/api:
          status: 200
          body:
            path: /home/alice/work/acme/api
            label: "github.com:acme/api"
            hooks:
              - {event: pre-push, status: installed}
      acme-remote:
        /home/alice/work/acme/api:
          status: 200
          body:
            path: /home/alice/work/acme/api
            label: "github.com:acme/api"
            hooks:
              - {event: post-commit, status: installed}
    offer: install in 1 repository
    calls:
      - acme-work -> /home/alice/work/acme/api
      - acme-remote -> /home/alice/work/acme/api
    preview:
      /home/alice/work/acme/api:
        - on git push · publishes to Acme Platform, private
        - on each commit · publishes to Acme Labs, private
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event pre-push
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event post-commit
    shows:
      /home/alice/work/acme/api: ["pre-push: hook installed", "post-commit: hook installed"]
    refreshed:
      acme-work: [hook in 1 of 1 repository]
      acme-remote: [hook in 1 of 1 repository]
  - name: a blocked hook in a repository to install shows its remedy in the preview
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push, post-commit]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - path: /home/alice/work/acme/api
            label: "github.com:acme/api"
            hooks:
              - {event: pre-push, status: absent}
              - event: post-commit
                status: blocked
                remedy:
                  message: "a post-commit hook that Peasant did not write is already at /home/alice/work/acme/api/.git/hooks/post-commit. add the section below to it by hand."
                  snippet: "# BEGIN peasant village upload (post-commit)\npeasant village push --non-interactive --quiet --timeout 5s --repository /home/alice/work/acme/api\n# END peasant village upload (post-commit)"
    answers:
      acme-work:
        /home/alice/work/acme/api:
          status: 200
          body:
            path: /home/alice/work/acme/api
            label: "github.com:acme/api"
            hooks:
              - {event: pre-push, status: installed}
              - event: post-commit
                status: blocked
                remedy:
                  message: "a post-commit hook that Peasant did not write is already at /home/alice/work/acme/api/.git/hooks/post-commit. add the section below to it by hand."
                  snippet: "# BEGIN peasant village upload (post-commit)\npeasant village push --non-interactive --quiet --timeout 5s --repository /home/alice/work/acme/api\n# END peasant village upload (post-commit)"
    offer: install in 1 repository
    calls:
      - acme-work -> /home/alice/work/acme/api
    preview:
      /home/alice/work/acme/api:
        - on git push
        - on each commit
        - "a post-commit hook that Peasant did not write is already at /home/alice/work/acme/api/.git/hooks/post-commit. add the section below to it by hand."
        - "peasant village push --non-interactive --quiet --timeout 5s --repository /home/alice/work/acme/api"
    shows:
      /home/alice/work/acme/api:
        - blocked
        - "a post-commit hook that Peasant did not write is already at /home/alice/work/acme/api/.git/hooks/post-commit. add the section below to it by hand."
    refreshed:
      acme-work: ["hook in 0 of 1 repository", "blocked in 1"]
  - name: a paused rule offers no install
    rules:
      - id: personal
        kind: folder
        match: ~/personal/**
        events: []
        collectives: []
        repositories:
          - {path: /home/alice/personal/notes, hooks: []}
    answers: {}
    offer: null
    calls: []
    preview: {}
    shows: {}
    refreshed: {}
  - name: nothing is offered when every hook is there
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: installed}]}
          - {path: /home/alice/work/acme/web, label: "github.com:acme/web", hooks: [{event: pre-push, status: blocked, remedy: {message: "the hooks path is shared outside this repository."}}]}
    answers: {}
    offer: null
    calls: []
    preview: {}
    shows: {}
    refreshed: {}
  - name: a refused call shows the server's reason
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
    answers:
      acme-work:
        /home/alice/work/acme/api:
          status: 400
          body: {error: "No hook was installed because redaction.level is \"maximum\", which this version cannot apply. Set redaction.level to standard, then retry.", code: auto_publish_rule_invalid}
    offer: install in 1 repository
    calls:
      - acme-work -> /home/alice/work/acme/api
    preview:
      /home/alice/work/acme/api:
        - on git push · publishes to Acme Platform, private
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event pre-push
    shows:
      /home/alice/work/acme/api:
        - install failed
        - "No hook was installed because redaction.level is \"maximum\", which this version cannot apply. Set redaction.level to standard, then retry."
    refreshed:
      acme-work: [hook in 0 of 1 repository]
  - name: a path with a space and an apostrophe is quoted in the uninstall command
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: "/home/alice/work/acme/o'brien api", hooks: [{event: pre-push, status: absent}]}
    answers:
      acme-work:
        "/home/alice/work/acme/o'brien api":
          status: 200
          body:
            path: "/home/alice/work/acme/o'brien api"
            hooks:
              - {event: pre-push, status: installed}
    offer: install in 1 repository
    calls:
      - acme-work -> /home/alice/work/acme/o'brien api
    preview:
      "/home/alice/work/acme/o'brien api":
        - peasant village hooks uninstall --dir '/home/alice/work/acme/o'\''brien api' --event pre-push
    shows:
      "/home/alice/work/acme/o'brien api": [hook installed]
    refreshed:
      acme-work: [hook in 1 of 1 repository]
  - name: a failed event stays failed when a later call succeeds for another event
    rules:
      - id: acme-work
        kind: folder
        match: ~/work/acme/**
        events: [pre-push]
        collectives: [3f9c1a2b-0000-4000-8000-000000000001]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: pre-push, status: absent}]}
      - id: acme-remote
        kind: remote
        match: "github.com:acme/api"
        events: [post-commit]
        collectives: [3f9c1a2b-0000-4000-8000-000000000002]
        repositories:
          - {path: /home/alice/work/acme/api, label: "github.com:acme/api", hooks: [{event: post-commit, status: absent}]}
    answers:
      acme-work:
        /home/alice/work/acme/api:
          status: 400
          body: {error: "No hook was installed for rule acme-work: the pre-push hook could not be written.", code: auto_publish_rule_invalid}
      acme-remote:
        /home/alice/work/acme/api:
          status: 200
          body:
            path: /home/alice/work/acme/api
            label: "github.com:acme/api"
            hooks:
              - {event: post-commit, status: installed}
    offer: install in 1 repository
    calls:
      - acme-work -> /home/alice/work/acme/api
      - acme-remote -> /home/alice/work/acme/api
    preview:
      /home/alice/work/acme/api:
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event pre-push
        - peasant village hooks uninstall --dir '/home/alice/work/acme/api' --event post-commit
    shows:
      /home/alice/work/acme/api:
        - "pre-push: install failed"
        - "No hook was installed for rule acme-work: the pre-push hook could not be written."
        - "post-commit: hook installed"
    refreshed:
      acme-work: [hook in 0 of 1 repository]
      acme-remote: [hook in 1 of 1 repository]
