# The finish panel after a save: the server's next steps, the import's pushed
# progress, the notes the server sends with the save. It never installs a hook
# and never publishes. Each case reaches the review stop and saves.
# Every case below is played with the forest of the session it opens answered,
# because the page reads it whatever the case is about. A case that is about the
# forest scripts the route itself.
defaultServer:
  "GET /api/v1/kickstart/sessions/ses-full/tree": {body: {$tree: forest}}
requiredNames:
  - auto-publish-link-navigates-to-real-section
  - diagnostics-render
  - a-retention-failure-is-listed-as-a-note-from-the-save
  - import-now-disabled-while-running
  - no-hook-install
  - no-mid-run-ticks-keep-the-running-state-until-the-end-event
  - the-end-event-with-a-failure-shows-its-error
  - import-now-refused-shows-its-reason-on-the-panel
  - import-now-after-the-first-import-ended-shows-the-end
  - import-now-leaves-a-running-import-to-the-push
  - import-now-reads-a-failed-end
  - a-push-that-arrives-while-the-status-is-read-wins
  - reconnect-while-importing-reads-the-status-once
  - reconnect-after-the-import-ended-reads-nothing
  - import-now-while-another-import-runs-says-so
  - import-now-whose-status-cannot-be-read-says-so
  - a-status-the-page-does-not-know-is-refused
cases:
  - name: auto-publish-link-navigates-to-real-section
    # The href is a section the settings page has; the test checks that against
    # the settings catalogue, so a rename there fails here.
    section: automatic-publishing
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: /home/ada/.config/peasant/config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config, web-start, village-login, village-push, auto-publish-settings]
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [your setup is saved, what to do next]
      - expectLink: {name: choose automatic publishing rules, href: "/settings?section=automatic-publishing"}
      - expectLink: {name: change a setting later, href: /settings}
      - expectLink: {name: open the dashboard, href: /}
      - expectLink: {name: connect to peasant online later, href: "/settings?section=account"}
      - expectLink: {name: "publish later, explicitly", href: /share}

  - name: diagnostics-render
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
          diagnostics:
            - "withheld one session: two saved rules both match the branch feature/x"
            - "withheld one session: its project path is not on this computer"
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText:
          - notes from the save
          - "withheld one session: two saved rules both match the branch feature/x"
          - "withheld one session: its project path is not on this computer"
      - expectNoText: [notes from reading your sessions]

  # The save stood but the Claude retention period was not applied: the server's
  # note is about the save, so it is listed under a heading that says so, and not
  # as if reading the sessions had gone wrong.
  - name: a-retention-failure-is-listed-as-a-note-from-the-save
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
          diagnostics:
            - "config saved, retention not applied: permission denied"
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [your setup is saved, notes from the save, "config saved, retention not applied: permission denied"]
      - expectNoText: [reading your sessions]

  - name: import-now-disabled-while-running
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status": {body: {status: running}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [importing]
      - expectControl: {role: button, name: import now, disabled: true}
      # An earlier import was still running when the save started the next.
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: busy, note: an import started earlier is still running, new: 0, updated: 0}}
      - expectText: [an earlier import is still running, an import started earlier is still running]
      - expectControl: {role: button, name: import now, disabled: false}
      - click: import now
      - expectCalls: {route: "POST /api/v1/sync/ingest", count: 1}
      - expectControl: {role: button, name: import now, disabled: true}
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: failed, error: the store is locked by another process, new: 2, updated: 0}}
      - expectText: [import failed, the store is locked by another process]
      - expectControl: {role: button, name: import now, disabled: false}

  - name: no-hook-install
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config, web-start, village-login, village-push, auto-publish-settings]
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [your setup is saved]
      - expectNoControlMatching: {role: button, pattern: "install|publish now|push|share"}
      - expectNoControlMatching: {role: link, pattern: "install a hook|publish now"}
      # The save and the import are the only writes: no hook, no rule, no village call.
      - expectNoCalls: "hooks|auto-publish|/sync/push|/sync/login|/village/"

  # The server pushes only the end of an import: `idle` with counts, or `failed`.
  # Until then the panel must say the import is running, not that it is stuck.
  - name: no-mid-run-ticks-keep-the-running-state-until-the-end-event
    fakeTimers: true
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [importing, reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: true}
      # Two idle minutes, no event: still running, and nothing was fetched to find out.
      - advance: 120000
      - expectText: [importing, reading your selected sessions]
      - expectNoText: [import finished, import failed]
      - expectNoCalls: "GET /api/v1/sync/ingest"
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: idle, new: 12, updated: 3}}
      - expectText: [import finished]
      - expectNoText: [reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: false}

  - name: the-end-event-with-a-failure-shows-its-error
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [importing]
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: failed, error: the store is locked by another process, new: 0, updated: 0}}
      - expectText: [import failed, the store is locked by another process]
      - expectNoText: [reading your selected sessions, your setup is not saved]
      # The save stands: the panel still says so.
      - expectText: [your setup is saved]

  - name: import-now-refused-shows-its-reason-on-the-panel
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: failed, error: the import could not start, new: 0, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {status: 503, body: {error: config not available}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [import failed, the import could not start]
      - click: import now
      - expectCalls: {route: "POST /api/v1/sync/ingest", count: 1}
      # What failed, what the server said, that nothing was imported, and what to do.
      - expectText: [the import did not start, config not available, nothing was imported and your saved setup is unchanged, choose import now again]
      # It is shown once, on the panel, not also as a page notice.
      - expectCalls: {route: "POST /api/v1/kickstart/sessions/ses-full/commit", count: 1}

  # A reported failure. The save's own import ended and the panel showed its counts;
  # "import now" then started a second run, and the panel waited for a push that
  # the server did not send. The server pushes now, and the page asks once, after
  # the server accepted the import, how it stands: an end that was already pushed
  # is shown, and a page that is only waiting does not poll.
  - name: import-now-after-the-first-import-ended-shows-the-end
    fakeTimers: true
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status":
        body: {status: done, result: {new: 1234, updated: 56, unchanged: 325, errors: 0, indexed: 0, computed: 0, duration: 2s}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [importing]
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: idle, new: 81, updated: 0}}
      - expectText: [import finished, "81"]
      - expectControl: {role: button, name: import now, disabled: false}
      - click: import now
      - expectCalls: {route: "POST /api/v1/sync/ingest", count: 1}
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}
      - expectText: [import finished, "1,234", "56"]
      - expectNoText: [reading your selected sessions, "81"]
      - expectControl: {role: button, name: import now, disabled: false}
      # Nothing polls afterwards.
      - advance: 120000
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}

  # The status says the import is still going: the page keeps saying so and
  # waits for the end to be pushed. It does not ask again.
  - name: import-now-leaves-a-running-import-to-the-push
    fakeTimers: true
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status": {body: {status: running}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: idle, new: 81, updated: 0}}
      - expectText: [import finished]
      - click: import now
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}
      - expectText: [importing, reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: true}
      - advance: 120000
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}
      - expectText: [importing]
      - push: {kind: ingest, sessionId: ses-full, revision: 5, ingest: {state: idle, new: 9, updated: 0}}
      - expectText: [import finished]
      - expectNoText: [reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: false}

  - name: import-now-reads-a-failed-end
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: idle, new: 81, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status": {body: {status: error, error: the store is locked by another process}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - click: import now
      - expectText: [import failed, the store is locked by another process]
      - expectNoText: [reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: false}

  # A pushed end is the newer word: one that arrives while the status is on its
  # way is not replaced by what the status said.
  - name: a-push-that-arrives-while-the-status-is-read-wins
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: idle, new: 81, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status":
        held: true
        body: {status: done, result: {new: 1234, updated: 56, unchanged: 325, errors: 0, indexed: 0, computed: 0, duration: 2s}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - click: import now
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}
      - push: {kind: ingest, sessionId: ses-full, revision: 5, ingest: {state: idle, new: 77, updated: 0}}
      - expectText: [import finished, "77"]
      - release: "GET /api/v1/sync/ingest/status"
      - settle: true
      - expectText: ["77"]
      - expectNoText: ["1,234"]

  # The socket was down while the save's own import ended. When it comes back the
  # page, which shows the import running, asks once how it stands.
  - name: reconnect-while-importing-reads-the-status-once
    fakeTimers: true
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
      "GET /api/v1/sync/ingest/status":
        body: {status: done, result: {new: 1234, updated: 56, unchanged: 325, errors: 0, indexed: 0, computed: 0, duration: 2s}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - expectText: [importing]
      - expectNoCalls: "GET /api/v1/sync/ingest"
      - socket: close
      - expectNoCalls: "GET /api/v1/sync/ingest"
      - socket: open
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}
      - expectText: [import finished, "1,234"]
      - expectNoText: [reading your selected sessions]
      - advance: 120000
      - expectCalls: {route: "GET /api/v1/sync/ingest/status", count: 1}

  - name: reconnect-after-the-import-ended-reads-nothing
    fakeTimers: true
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: running, new: 0, updated: 0}
          nextSteps: [config]
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - push: {kind: ingest, sessionId: ses-full, revision: 3, ingest: {state: idle, new: 81, updated: 0}}
      - expectText: [import finished, "81"]
      - socket: close
      - socket: open
      - settle: true
      - expectNoCalls: "GET /api/v1/sync/ingest"
      - expectText: [import finished, "81"]

  # 409: an import is running that this setup did not start. It may have begun
  # before the save, so the page cannot promise an end; it says what is going on
  # and leaves the button for the next try.
  - name: import-now-while-another-import-runs-says-so
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: busy, note: an import started earlier is still running, new: 0, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {status: 409, body: {error: ingest already running}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - click: import now
      - expectCalls: {route: "POST /api/v1/sync/ingest", count: 1}
      - expectText: [an earlier import is still running, an import is already running, choose import now again when it ends]
      - expectNoText: [reading your selected sessions]
      - expectControl: {role: button, name: import now, disabled: false}
      - expectNoCalls: "GET /api/v1/sync/ingest/status"

  - name: import-now-whose-status-cannot-be-read-says-so
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: idle, new: 81, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status": {status: 500, body: {error: the status store is unavailable}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - click: import now
      - expectText: [the import is running, but peasant did not say how it ended, the status store is unavailable, reload this page]
      - expectText: [importing]

  - name: a-status-the-page-does-not-know-is-refused
    server:
      "POST /api/v1/kickstart/sessions": {body: {$model: second-tab-answer}}
      "POST /api/v1/kickstart/sessions/ses-full/commit":
        body:
          saved: true
          configPath: config.yaml
          ingest: {state: idle, new: 81, updated: 0}
          nextSteps: [config]
      "POST /api/v1/sync/ingest": {body: {status: running}}
      "GET /api/v1/sync/ingest/status": {malformed: true, body: {status: paused}}
    steps:
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: continue
      - click: save and import
      - click: import now
      - expectText: ["peasant sent an import status", '"paused"', which this page does not know]
      - expectText: [importing]
