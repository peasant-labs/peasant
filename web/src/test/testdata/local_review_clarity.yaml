outcomeCases:
  - name: mounted resolved outcome exposes heuristic help
    outcome: resolved
    sessionId: clarity-resolved
    mapLabel: resolved
    taskTitle: resolved fixture task
    entryIndex: 1
    definition: "resolved: no notable recorded error pattern."
  - name: mounted partial outcome exposes heuristic help
    outcome: partial
    sessionId: clarity-partial
    mapLabel: partial
    taskTitle: partial fixture task
    entryIndex: 2
    definition: "partial: some errors, an ending error, or a moderate error cluster."
  - name: mounted failed outcome exposes heuristic help
    outcome: failed
    sessionId: clarity-failed
    mapLabel: not resolved
    taskTitle: failed fixture task
    entryIndex: 3
    definition: "failed: a high or concentrated error pattern."
