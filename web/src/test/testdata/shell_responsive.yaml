# Viewport widths the mounted shell gate (scripts/visual/shell-nav-gate.mjs)
# drives the local header through. The header is one row of fairtrade's --nav-h
# (56px) at every width, so no row carries its own height: at each width the
# gate asserts the shell-header.yaml manifest, that every header item (brand,
# search, theme; settings once its page ships) is visible, inside the row and
# reachable by a pointer, that nothing overflows sideways, and that <main>
# clears the header (and the offline notice while it shows). `reflow` is the
# WCAG 1.4.10 reflow width. The gate requires every name below.
cases:
  - name: desktop
    width: 1460
  - name: tablet
    width: 768
  - name: compact_tablet
    width: 540
  - name: mobile_wide
    width: 480
  - name: mobile_narrow
    width: 390
  - name: reflow
    width: 320
