# Viewport widths the mounted shell gate (scripts/visual/shell-nav-gate.mjs)
# drives the local chrome through: fairtrade's sidebar, a column at 768px and
# up and a top bar of --nav-h (56px) with a drawer below that. At each width
# the gate asserts the shell-chrome.yaml manifest, that every sidebar item is
# visible, inside the sidebar and reachable by a pointer (in the drawer, opened,
# on a narrow screen), that nothing overflows sideways, and that <main> starts
# under the chrome (and the offline notice while it shows). `reflow` is the
# WCAG 1.4.10 reflow width. The gate requires every name below.
cases:
  - name: desktop
    width: 1460
  - name: tablet
    width: 768
  - name: compact_tablet
    width: 540
  - name: mobile_wide
    width: 480
  - name: mobile_narrow
    width: 390
  - name: reflow
    width: 320
