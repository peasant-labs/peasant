# What each in-app issue form in .github/ISSUE_TEMPLATE must declare.
# One row per feedback kind, keyed by the kind's wire value. The test fails
# when a kind has no row or a row names an unknown kind.
forms:
  - kind: problem
    name: "Bug report (in-app)"
    type: Bug
    labels: [bug, ui/ux, feedback]
    problemPrompt: "<!-- what happened -->"
    expectationsPrompt: "<!-- what was the expected behaviour, bullet points. -->"
    problemExample: |
      <!-- example:
      1. open a session from home.
      2. click "share".
      3. the dialog closes and the session is not shared. no error is shown.
      -->
    expectationsExample: |
      <!-- example:
      - the dialog stays open until sharing finishes.
      - if sharing fails, an error says why and how to fix it.
      -->
  - kind: feature
    name: "Feature request (in-app)"
    type: Feature
    labels: [enhancement, ui/ux, feedback]
    problemPrompt: "<!-- what is the problem or need? -->"
    expectationsPrompt: "<!-- what should peasant do instead? bullet points. -->"
    problemExample: |
      <!-- example: in a long session, I lose my place every time I open a tool call. -->
    expectationsExample: |
      <!-- example:
      - opening a tool call keeps my scroll position.
      - a "back to where I was" control returns me to the last turn I read.
      -->
