cases:
  - name: problem-selects-problem-template
    input:
      kind: problem
      title: "Button clipped on narrow viewport"
      elements: []
      context:
        route: "/sessions/abc"
        viewport: { width: 390, height: 844 }
        theme: dark
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Button clipped on narrow viewport"
      forbiddenParams: [labels, "labels[]", screenshot, description]
      bodyContains:
        - "### What happened?"
        - "<!-- Describe it here. -->"
        - "### App context"
        - "peasant version: 0.9.1"
        - "### Screenshots"
        - "Paste the copied images here."

  - name: feature-selects-feature-template
    input:
      kind: feature
      title: "Add keyboard shortcut hint"
      elements: []
      context:
        route: "/"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        template: "in-app-feature.yml"
        title: "Add keyboard shortcut hint"
      forbiddenParams: [labels, "labels[]", screenshot, description]
      bodyContains:
        - "### What would you like to see?"
        - "<!-- Describe it here. -->"

  - name: prefills-all-field-ids
    input:
      kind: problem
      title: "Nav icon misaligned"
      elements:
        - id: 1
          selector: "aside.asb > button[aria-label='settings']"
          label: "button settings"
          section: "sidebar"
          textSnippet: "settings"
          box: { top: 820, left: 12, width: 36, height: 36 }
        - id: 2
          selector: "main > div.toolbar"
          label: "div.toolbar"
          section: "main"
          textSnippet: "filters"
          box: { top: 40, left: 240, width: 480, height: 40 }
      context:
        route: "/settings"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.9.2"
        userAgent: "Firefox/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Nav icon misaligned"
      forbiddenParams: [labels, "labels[]", screenshot, description]
      elementContains:
        - "element 1 (image 1): button settings"
        - "section: sidebar"
        - "selector: aside.asb > button[aria-label='settings']"
        - "36x36"
        - "text: settings"
        - "element 2 (image 2): div.toolbar"
        - "selector: main > div.toolbar"
      bodyContains:
        - "### Picked elements"
        - "element 1 (image 1): button settings"
        - "element 2 (image 2): div.toolbar"
      environmentContains:
        - "peasant version: 0.9.2"
        - "route: /settings"
        - "viewport: 1280x800"
        - "theme: dark"
        - "browser: Firefox/130.0"

  - name: omits-empty-element-field
    input:
      kind: problem
      title: "Scroll jumps on load"
      elements: []
      context:
        route: "/sessions/xyz"
        viewport: { width: 1440, height: 900 }
        theme: dark
        appVersion: unknown
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      absentParams: [element, screenshot, description]

  - name: never-emits-labels
    input:
      kind: feature
      title: "Export transcript summary"
      elements:
        - id: 1
          selector: "main > header"
          label: "session header"
          section: "main"
          textSnippet: "session-1"
          box: { top: 0, left: 200, width: 1000, height: 64 }
      context:
        route: "/sessions/1"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "1.0.0"
        userAgent: "Safari/18.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      forbiddenParams: [labels, "labels[]", screenshot, description]

  - name: body-has-empty-description-prompt
    input:
      kind: problem
      title: "Empty prompt check"
      elements:
        - id: 1
          selector: "main > button.submit"
          label: "button.submit"
          section: "Composer"
          textSnippet: "Submit"
          box: { top: 40, left: 80, width: 110, height: 36 }
      context:
        route: "/sessions/42"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.9.5"
        userAgent: "TestBrowser/2.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      forbiddenParams: [labels, "labels[]", screenshot, description]
      bodyContains:
        - "### What happened?\n\n<!-- Describe it here. -->\n\n\n### App context"
        - "### Picked elements"
        - "```text"
        - "element 1 (image 1): button.submit"
        - "### Screenshots\n\nPaste the copied images here."

  - name: body-starts-context-with-version
    input:
      kind: feature
      title: "Version first check"
      elements:
        - id: 1
          selector: "main > nav"
          label: "nav"
          section: "shell"
          textSnippet: "home"
          box: { top: 0, left: 0, width: 200, height: 800 }
      context:
        route: "/sessions/42"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.14.0"
        userAgent: "TestBrowser/2.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      environmentStartsWith: "peasant version: 0.14.0\n"
      bodyContains:
        - "### What would you like to see?\n\n<!-- Describe it here. -->"
        - "### App context\n\n```text\npeasant version: 0.14.0\n"
      bodyOrder:
        - "### What would you like to see?"
        - "### App context"
        - "### Picked elements"
        - "### Screenshots"

  - name: empty-title-falls-back-to-kind-label
    input:
      kind: feature
      title: "   "
      elements: []
      context:
        route: "/"
        viewport: { width: 1280, height: 720 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        title: "request a feature"

  - name: drops-trailing-elements-when-elements-exceed-cap
    maxLength: 1050
    input:
      kind: problem
      title: "Overflow"
      elements:
        - id: 1
          selector: "main > button.first"
          label: "button.first"
          section: "toolbar"
          textSnippet: "First element fits under the cap."
          box: { top: 20, left: 30, width: 100, height: 32 }
        - id: 2
          selector: "div.very-deep-container > ul > li:nth-child(42) > button.action-trigger"
          label: "button.second"
          section: "transcript"
          textSnippet: "Second element gets dropped when the tight URL cap is reached."
          box: { top: 200, left: 300, width: 120, height: 40 }
        - id: 3
          selector: "div.very-deep-container > ul > li:nth-child(43) > button.action-other"
          label: "button.third"
          section: "transcript"
          textSnippet: "Third element also gets dropped when the tight URL cap is reached."
          box: { top: 260, left: 300, width: 120, height: 40 }
      context:
        route: "/s"
        viewport: { width: 800, height: 600 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 1050
      elementContains:
        - "element 1 (image 1): button.first"
        - "2 more elements omitted"
      elementExcludes:
        - "button.second"
        - "button.third"
      bodyContains:
        - "element 1 (image 1): button.first"
        - "2 more elements omitted"
      environmentContains:
        - "peasant version: 1.0.0"
        - "route: /s"
        - "viewport: 800x600"
        - "theme: dark"
        - "browser: UA"

  - name: shortens-element-snippet-when-single-element-exceeds-cap
    maxLength: 940
    input:
      kind: problem
      title: "Snippet trim"
      elements:
        - id: 1
          selector: "main > button.long"
          label: "button.long"
          section: "toolbar"
          textSnippet: "A very long text snippet inside the picked element that will be shortened once trailing elements are already gone."
          box: { top: 20, left: 30, width: 100, height: 32 }
      context:
        route: "/s"
        viewport: { width: 800, height: 600 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 940
      elementContains:
        - "element 1 (image 1): button.long"
        - "… [truncated]"
      bodyContains:
        - "element 1 (image 1): button.long"
        - "… [truncated]"
      environmentContains:
        - "peasant version: 1.0.0"
        - "route: /s"

  - name: strips-query-and-hash-from-route
    input:
      kind: problem
      title: "Route leak check"
      elements: []
      context:
        route: "/sessions/abc?secret=token#frag"
        viewport: { width: 1024, height: 768 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      environmentContains:
        - "route: /sessions/abc"
      environmentExcludes:
        - "secret=token"
        - "#frag"
