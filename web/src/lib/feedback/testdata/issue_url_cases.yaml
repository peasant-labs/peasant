cases:
  - name: problem-selects-problem-template
    input:
      kind: problem
      title: "Button clipped on narrow viewport"
      description: "The submit button clips at 390px."
      elements: []
      context:
        route: "/sessions/abc"
        viewport: { width: 390, height: 844 }
        theme: dark
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Button clipped on narrow viewport"
      forbiddenParams: [labels, "labels[]", screenshot]
      bodyContains:
        - "### What happened?"
        - "The submit button clips at 390px."
        - "### Screenshots"
        - "Paste the copied images here."
        - "### App context"

  - name: feature-selects-feature-template
    input:
      kind: feature
      title: "Add keyboard shortcut hint"
      description: "Show shortcut tooltip on hover."
      elements: []
      context:
        route: "/"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        template: "in-app-feature.yml"
        title: "Add keyboard shortcut hint"
      forbiddenParams: [labels, "labels[]", screenshot]
      bodyContains:
        - "### What would you like to see?"
        - "Show shortcut tooltip on hover."

  - name: prefills-all-field-ids
    input:
      kind: problem
      title: "Nav icon misaligned"
      description: "Settings gear shifts 2px down."
      elements:
        - id: 1
          selector: "aside.asb > button[aria-label='settings']"
          label: "button settings"
          section: "sidebar"
          textSnippet: "settings"
          box: { top: 820, left: 12, width: 36, height: 36 }
        - id: 2
          selector: "main > div.toolbar"
          label: "div.toolbar"
          section: "main"
          textSnippet: "filters"
          box: { top: 40, left: 240, width: 480, height: 40 }
      context:
        route: "/settings"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.9.2"
        userAgent: "Firefox/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Nav icon misaligned"
        description: "Settings gear shifts 2px down."
      elementContains:
        - "element 1 (image 1): button settings"
        - "section: sidebar"
        - "selector: aside.asb > button[aria-label='settings']"
        - "36x36"
        - "text: settings"
        - "element 2 (image 2): div.toolbar"
        - "selector: main > div.toolbar"
      bodyContains:
        - "### Picked elements"
        - "element 1 (image 1): button settings"
        - "element 2 (image 2): div.toolbar"
      environmentContains:
        - "route: /settings"
        - "viewport: 1280x800"
        - "theme: dark"
        - "peasant: 0.9.2"
        - "browser: Firefox/130.0"

  - name: omits-empty-element-field
    input:
      kind: problem
      title: "Scroll jumps on load"
      description: "Opening transcript jumps to bottom."
      elements: []
      context:
        route: "/sessions/xyz"
        viewport: { width: 1440, height: 900 }
        theme: dark
        appVersion: unknown
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      absentParams: [element, screenshot]

  - name: never-emits-labels
    input:
      kind: feature
      title: "Export transcript summary"
      description: "Allow copying markdown summary."
      elements:
        - id: 1
          selector: "main > header"
          label: "session header"
          section: "main"
          textSnippet: "session-1"
          box: { top: 0, left: 200, width: 1000, height: 64 }
      context:
        route: "/sessions/1"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "1.0.0"
        userAgent: "Safari/18.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      forbiddenParams: [labels, "labels[]", screenshot]

  - name: body-fallback-contains-description
    input:
      kind: problem
      title: "Description missing in fallback"
      description: "Writing details here must appear in the fallback body."
      elements:
        - id: 1
          selector: "main > button.submit"
          label: "button.submit"
          section: "Composer"
          textSnippet: "Submit"
          box: { top: 40, left: 80, width: 110, height: 36 }
      context:
        route: "/sessions/42"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.9.5"
        userAgent: "TestBrowser/2.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      forbiddenParams: [labels, "labels[]", screenshot]
      bodyContains:
        - "### What happened?"
        - "Writing details here must appear in the fallback body."
        - "### Picked elements"
        - "```text"
        - "element 1 (image 1): button.submit"
        - "selector: main > button.submit"
        - "### Screenshots"
        - "Paste the copied images here."
        - "### App context"
        - "route: /sessions/42"
        - "peasant: 0.9.5"

  - name: truncates-deterministically-under-cap
    input:
      kind: problem
      title: "Huge description"
      description: ""
      descriptionRepeat: { unit: "a", count: 12000 }
      elements:
        - id: 1
          selector: "main > div.card"
          label: "session card"
          section: "home"
          textSnippet: "Session title"
          box: { top: 100, left: 260, width: 400, height: 120 }
      context:
        route: "/"
        viewport: { width: 1440, height: 900 }
        theme: dark
        appVersion: "0.9.1"
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 7500
      descriptionEndsWith: "… [truncated]"
      elementContains:
        - "element 1 (image 1): session card"
        - "selector: main > div.card"
        - "text: Session title"
      environmentContains:
        - "route: /"
        - "viewport: 1440x900"
        - "theme: dark"
        - "peasant: 0.9.1"
        - "browser: Chrome/130.0"

  - name: empty-title-falls-back-to-kind-label
    input:
      kind: feature
      title: "   "
      description: "Need compact view toggle."
      elements: []
      context:
        route: "/"
        viewport: { width: 1280, height: 720 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        title: "request a feature"

  - name: drops-trailing-elements-when-description-and-elements-exceed-cap
    maxLength: 1200
    input:
      kind: problem
      title: "Overflow"
      description: "This description is long enough that even after shrinking, trailing element blocks must be dropped to fit."
      elements:
        - id: 1
          selector: "main > button.first"
          label: "button.first"
          section: "toolbar"
          textSnippet: "First element fits under the cap."
          box: { top: 20, left: 30, width: 100, height: 32 }
        - id: 2
          selector: "div.very-deep-container > ul > li:nth-child(42) > button.action-trigger"
          label: "button.second"
          section: "transcript"
          textSnippet: "Second element gets dropped when the tight URL cap is reached."
          box: { top: 200, left: 300, width: 120, height: 40 }
        - id: 3
          selector: "div.very-deep-container > ul > li:nth-child(43) > button.action-other"
          label: "button.third"
          section: "transcript"
          textSnippet: "Third element also gets dropped when the tight URL cap is reached."
          box: { top: 260, left: 300, width: 120, height: 40 }
      context:
        route: "/s"
        viewport: { width: 800, height: 600 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 1200
      descriptionEndsWith: "… [truncated]"
      elementContains:
        - "element 1 (image 1): button.first"
        - "2 more elements omitted"
      elementExcludes:
        - "button.second"
        - "button.third"
      bodyContains:
        - "element 1 (image 1): button.first"
        - "2 more elements omitted"
      environmentContains:
        - "route: /s"
        - "viewport: 800x600"
        - "theme: dark"
        - "peasant: 1.0.0"
        - "browser: UA"

  - name: strips-query-and-hash-from-route
    input:
      kind: problem
      title: "Route leak check"
      description: "Check route sanitization."
      elements: []
      context:
        route: "/sessions/abc?secret=token#frag"
        viewport: { width: 1024, height: 768 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      environmentContains:
        - "route: /sessions/abc"
      environmentExcludes:
        - "secret=token"
        - "#frag"
