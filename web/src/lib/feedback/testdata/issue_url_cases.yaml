cases:
  - name: problem-selects-problem-template
    input:
      kind: problem
      title: "Button clipped on narrow viewport"
      description: "The submit button clips at 390px."
      element: null
      context:
        route: "/sessions/abc"
        viewport: { width: 390, height: 844 }
        theme: dark
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Button clipped on narrow viewport"
      forbiddenParams: [labels, "labels[]", body, screenshot]

  - name: feature-selects-feature-template
    input:
      kind: feature
      title: "Add keyboard shortcut hint"
      description: "Show shortcut tooltip on hover."
      element: null
      context:
        route: "/"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "TestBrowser/1.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        template: "in-app-feature.yml"
        title: "Add keyboard shortcut hint"
      forbiddenParams: [labels, "labels[]", body, screenshot]

  - name: prefills-all-field-ids
    input:
      kind: problem
      title: "Nav icon misaligned"
      description: "Settings gear shifts 2px down."
      element:
        selector: "aside.asb > button[aria-label='settings']"
        label: "button settings"
        section: "sidebar"
        textSnippet: "settings"
        box: { top: 820, left: 12, width: 36, height: 36 }
      context:
        route: "/settings"
        viewport: { width: 1280, height: 800 }
        theme: dark
        appVersion: "0.9.2"
        userAgent: "Firefox/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      params:
        template: "in-app-problem.yml"
        title: "Nav icon misaligned"
        description: "Settings gear shifts 2px down."
      elementContains:
        - "label: button settings"
        - "section: sidebar"
        - "selector: aside.asb > button[aria-label='settings']"
        - "36x36"
        - "text: settings"
      environmentContains:
        - "route: /settings"
        - "viewport: 1280x800"
        - "theme: dark"
        - "peasant: 0.9.2"
        - "browser: Firefox/130.0"

  - name: omits-empty-element-field
    input:
      kind: problem
      title: "Scroll jumps on load"
      description: "Opening transcript jumps to bottom."
      element: null
      context:
        route: "/sessions/xyz"
        viewport: { width: 1440, height: 900 }
        theme: dark
        appVersion: unknown
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      absentParams: [element, screenshot]

  - name: never-emits-labels-or-body
    input:
      kind: feature
      title: "Export transcript summary"
      description: "Allow copying markdown summary."
      element:
        selector: "main > header"
        label: "session header"
        section: "main"
        textSnippet: "session-1"
        box: { top: 0, left: 200, width: 1000, height: 64 }
      context:
        route: "/sessions/1"
        viewport: { width: 1440, height: 900 }
        theme: light
        appVersion: "1.0.0"
        userAgent: "Safari/18.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      forbiddenParams: [labels, "labels[]", body, screenshot]

  - name: truncates-deterministically-under-cap
    input:
      kind: problem
      title: "Huge description"
      description: ""
      descriptionRepeat: { unit: "a", count: 12000 }
      element:
        selector: "main > div.card"
        label: "session card"
        section: "home"
        textSnippet: "Session title"
        box: { top: 100, left: 260, width: 400, height: 120 }
      context:
        route: "/"
        viewport: { width: 1440, height: 900 }
        theme: dark
        appVersion: "0.9.1"
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 7500
      descriptionEndsWith: "… [truncated]"
      elementContains:
        - "selector: main > div.card"
        - "text: Session title"
      environmentContains:
        - "route: /"
        - "viewport: 1440x900"
        - "theme: dark"
        - "peasant: 0.9.1"
        - "browser: Chrome/130.0"

  - name: empty-title-falls-back-to-kind-label
    input:
      kind: feature
      title: "   "
      description: "Need compact view toggle."
      element: null
      context:
        route: "/"
        viewport: { width: 1280, height: 720 }
        theme: light
        appVersion: "0.9.1"
        userAgent: "Chrome/130.0"
    expect:
      template: "in-app-feature.yml"
      truncated: false
      params:
        title: "request a feature"

  - name: truncates-element-when-description-and-element-exceed-cap
    maxLength: 350
    input:
      kind: problem
      title: "Overflow"
      description: "This description is long enough that even after shrinking, the element block also has to be shrunk to fit."
      element:
        selector: "div.very-deep-container > ul > li:nth-child(42) > button.action-trigger"
        label: "button action trigger"
        section: "transcript"
        textSnippet: "A long snippet of visible UI text inside the selected element that exceeds the tight URL cap."
        box: { top: 200, left: 300, width: 120, height: 40 }
      context:
        route: "/s"
        viewport: { width: 800, height: 600 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: true
      maxUrlLength: 350
      descriptionEndsWith: "… [truncated]"
      elementEndsWith: "… [truncated]"
      environmentContains:
        - "route: /s"
        - "viewport: 800x600"
        - "theme: dark"
        - "peasant: 1.0.0"
        - "browser: UA"

  - name: strips-query-and-hash-from-route
    input:
      kind: problem
      title: "Route leak check"
      description: "Check route sanitization."
      element: null
      context:
        route: "/sessions/abc?secret=token#frag"
        viewport: { width: 1024, height: 768 }
        theme: dark
        appVersion: "1.0.0"
        userAgent: "UA"
    expect:
      template: "in-app-problem.yml"
      truncated: false
      environmentContains:
        - "route: /sessions/abc"
      environmentExcludes:
        - "secret=token"
        - "#frag"
