cases:
  - name: open-menu-from-closed
    steps:
      - event: { type: open_menu }
        expect:
          step: menu_open
          kind: problem
          attachElement: false
          attachPage: false
          maskMode: masked
          clipboardOutcome: not-needed

  - name: select-problem-opens-attach
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
        expect:
          step: attach_options
          kind: problem
          attachElement: false
          attachPage: false

  - name: attach-none-skips-straight-to-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
        expect:
          step: compose
          attachElement: false
          attachPage: false
          pickedElement: null
          captures: []

  - name: attach-page-only-enters-capturing
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
        expect:
          step: capturing
          attachElement: false
          attachPage: true

  - name: attach-element-enters-picking
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
        expect:
          step: picking
          attachElement: true
          attachPage: false

  - name: pick-cancel-returns-to-attach
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_cancelled }
        expect:
          step: attach_options
          kind: feature
          attachElement: true
          attachPage: true

  - name: capture-failure-still-opens-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_failed, error: "snapdom render failed", partialCaptures: [element] }
        expect:
          step: compose
          captureError: "snapdom render failed"
          captures: [element]

  - name: unmask-triggers-recapture
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_succeeded, captures: [page] }
      - event: { type: set_mask_mode, maskMode: unmasked }
        expect:
          step: capturing
          maskMode: unmasked
          captureError: null

  - name: change-kind-preserves-draft
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
      - event: { type: update_draft, title: "Sidebar clips label", description: "Long label overflows container." }
      - event: { type: change_kind, kind: feature }
        expect:
          step: compose
          kind: feature
          title: "Sidebar clips label"
          description: "Long label overflows container."

  - name: close-resets-state
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [element, page] }
      - event: { type: set_mask_mode, maskMode: unmasked }
      - event: { type: capture_succeeded, captures: [element, page] }
      - event: { type: update_draft, title: "Add filter", description: "Filter by status" }
      - event: { type: submit_succeeded, url: "https://github.com/peasant-labs/peasant/issues/new?template=in-app-feature.yml", clipboardOutcome: copied }
      - event: { type: close_all }
        expect:
          step: closed
          kind: problem
          attachElement: false
          attachPage: false
          pickedElement: null
          maskMode: masked
          captures: []
          captureError: null
          title: ""
          description: ""
          submittedUrl: null
          clipboardOutcome: not-needed

  - name: remove-capture-drops-matching-kind
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [element, page] }
      - event: { type: remove_capture, kind: element }
        expect:
          step: compose
          captures: [page]

  - name: reopen-picker-from-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
      - event: { type: update_draft, description: "Need to pick button" }
      - event: { type: reopen_picker }
        expect:
          step: picking
          attachElement: true
          description: "Need to pick button"

  - name: back-to-attach-preserves-draft-and-toggles
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_succeeded, captures: [page] }
      - event: { type: update_draft, title: "Keep me", description: "Keep body" }
      - event: { type: back_to_attach }
        expect:
          step: attach_options
          kind: feature
          attachPage: true
          title: "Keep me"
          description: "Keep body"
          captures: [page]

  - name: invalid-event-in-closed-is-noop
    steps:
      - event: { type: proceed_from_attach }
        sameState: true
        expect:
          step: closed

  - name: capturing-ignores-close-all
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: close_all }
        sameState: true
        expect:
          step: capturing
