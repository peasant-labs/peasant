cases:
  - name: open-menu-from-closed
    steps:
      - event: { type: open_menu }
        expect:
          step: menu_open
          kind: problem
          attachElement: false
          attachPage: false
          maskMode: masked
          clipboardOutcome: not-needed

  - name: select-problem-opens-attach
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
        expect:
          step: attach_options
          kind: problem
          attachElement: false
          attachPage: false

  - name: attach-none-skips-straight-to-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
        expect:
          step: compose
          attachElement: false
          attachPage: false
          pickedElementsCount: 0
          captures: []

  - name: attach-page-only-enters-capturing
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
        expect:
          step: capturing
          attachElement: false
          attachPage: true
          pendingCaptureKind: all

  - name: attach-element-enters-picking
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
        expect:
          step: picking
          attachElement: true
          attachPage: false

  - name: pick-cancel-returns-to-attach
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_cancelled }
        expect:
          step: attach_options
          kind: feature
          attachElement: true
          attachPage: true

  - name: capture-failure-still-opens-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_failed, error: "snapdom render failed", partialCaptures: [{ kind: element, elementId: 1 }] }
        expect:
          step: compose
          captureError: "snapdom render failed"
          captures: [element]

  - name: unmask-triggers-recapture
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_succeeded, captures: [{ kind: page }] }
      - event: { type: set_mask_mode, maskMode: unmasked }
        expect:
          step: capturing
          maskMode: unmasked
          pendingCaptureKind: all
          captureError: null

  - name: change-kind-preserves-draft
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
      - event: { type: update_draft, title: "Sidebar clips label", description: "Long label overflows container." }
      - event: { type: change_kind, kind: feature }
        expect:
          step: compose
          kind: feature
          title: "Sidebar clips label"
          description: "Long label overflows container."

  - name: close-resets-state
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: set_mask_mode, maskMode: unmasked }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: update_draft, title: "Add filter", description: "Filter by status" }
      - event: { type: submit_succeeded, url: "https://github.com/peasant-labs/peasant/issues/new?template=in-app-feature.yml", clipboardOutcome: copied }
      - event: { type: close_all }
        expect:
          step: closed
          kind: problem
          attachElement: false
          attachPage: false
          pickedElementsCount: 0
          maskMode: masked
          captures: []
          captureError: null
          title: ""
          description: ""
          submittedUrl: null
          clipboardOutcome: not-needed
          copiedCaptureId: null

  - name: remove-element-capture-removes-element
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 2 }] }
      - event: { type: remove_capture, id: 1 }
        expect:
          step: compose
          captures: [element, page]
          pickedElementIds: [2]
          attachPage: true
      - event: { type: remove_capture, id: 2 }
        expect:
          step: compose
          captures: [element]
          pickedElementIds: [2]
          attachPage: false

  - name: reopen-picker-from-compose
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: proceed_from_attach }
      - event: { type: update_draft, description: "Need to pick button" }
      - event: { type: reopen_picker }
        expect:
          step: picking
          attachElement: true
          description: "Need to pick button"
      - event: { type: pick_cancelled }
        expect:
          step: compose
          description: "Need to pick button"

  - name: back-to-attach-preserves-draft-and-toggles
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: feature }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: capture_succeeded, captures: [{ kind: page }] }
      - event: { type: update_draft, title: "Keep me", description: "Keep body" }
      - event: { type: back_to_attach }
        expect:
          step: attach_options
          kind: feature
          attachPage: true
          title: "Keep me"
          description: "Keep body"
          captures: [page]

  - name: append-second-pick
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
        expect:
          step: capturing
          pickedElementIds: [1]
          pendingCaptureKind: element
          pendingElementId: 1
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
        expect:
          step: capturing
          pickedElementIds: [1, 2]
          pendingCaptureKind: element
          pendingElementId: 2
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 2 }] }
        expect:
          step: compose
          pickedElementIds: [1, 2]
          captures: [element, element]

  - name: merge-keeps-existing-captures
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 2 }] }
        expect:
          step: compose
          captures: [element, element, page]
          captureElementIds: [1, 2, null]
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_failed, error: "element capture failed", partialCaptures: [] }
        expect:
          step: compose
          captureError: "element capture failed"
          captures: [element, element, page]

  - name: mask-change-recaptures-all
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 2 }] }
      - event: { type: set_mask_mode, maskMode: unmasked }
        expect:
          step: capturing
          maskMode: unmasked
          pendingCaptureKind: all
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: element, elementId: 2 }, { kind: page }] }
        expect:
          step: compose
          maskMode: unmasked
          captures: [element, element, page]
          captureElementIds: [1, 2, null]

  - name: pick-limit-reached
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 2 }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 3 }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 4 }] }
      - event: { type: reopen_picker }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 5 }] }
        expect:
          step: compose
          pickedElementsCount: 5
          pickedElementIds: [1, 2, 3, 4, 5]
      - event: { type: reopen_picker }
        sameState: true
        expect:
          step: compose
          pickedElementsCount: 5

  - name: invalid-event-in-closed-is-noop
    steps:
      - event: { type: proceed_from_attach }
        sameState: true
        expect:
          step: closed

  - name: capturing-ignores-close-all
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: close_all }
        sameState: true
        expect:
          step: capturing

  - name: submitted-copy-updates-copied-capture-id
    steps:
      - event: { type: open_menu }
      - event: { type: select_kind, kind: problem }
      - event: { type: toggle_attach_element }
      - event: { type: toggle_attach_page }
      - event: { type: proceed_from_attach }
      - event: { type: pick_confirmed }
      - event: { type: capture_succeeded, captures: [{ kind: element, elementId: 1 }, { kind: page }] }
      - event: { type: update_draft, description: "Button overlaps" }
      - event: { type: submit_succeeded, url: "https://github.com/peasant-labs/peasant/issues/new?template=in-app-problem.yml", clipboardOutcome: copied }
        expect:
          step: submitted
          clipboardOutcome: copied
          copiedCaptureId: 1
      - event: { type: copy_capture_settled, captureId: 2, clipboardOutcome: copied }
        expect:
          step: submitted
          clipboardOutcome: copied
          copiedCaptureId: 2
