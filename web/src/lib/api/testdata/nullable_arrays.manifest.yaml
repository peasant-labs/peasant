expectedCount: 8
requiredNames:
  - project summaries null projects
  - map graph null collections
  - node detail null collections
  - project tasks normalize nested task collections
  - change detail normalizes every nullable collection
  - change diff null hunks
  - change diff normalizes nested lines
  - search null results
requiredOperations:
