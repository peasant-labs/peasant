  - name: expired-scope-omits-only-that-group
    query: guardian
    searchLimit: 20
    searchPayload:
      page: 1
      limit: 20
      totalItems: 3
      ordinarySessionTotal: 1
      helperThreadTotal: 2
      items:
        - kind: transcript
          transcript:
            session:
              id: agent-p1
              harness: codex
              startTime: "2026-01-01T00:00:00Z"
              durationMins: 1
              turnCount: 2
              totalTokens: 10
              toolCallCount: 0
            matches:
              - {sessionId: agent-p1, project: /work/alpha-project, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, entryIndex: 0, role: user, snippet: ordinary hit, score: 1}
          helperGroups:
            - {groupId: hg_stale, purpose: helper_review, helperThreadCount: 1, memberScope: scope-stale}
        - kind: context_container
          context: {groupId: hg_live, ownerStatus: unknown}
          helperGroups:
            - {groupId: hg_live, purpose: helper_review, helperThreadCount: 1, memberScope: scope-live}
    responses:
      - groupId: hg_stale
        scope: scope-stale
        page: 1
        outcome: expired
        body: {error: scope expired, code: group_scope_expired}
      - groupId: hg_live
        scope: scope-live
        page: 1
        outcome: ok
        body:
          page: 1
          limit: 20
          total: 1
          members:
            - kind: transcript
              transcript:
                session:
                  id: agent-live
                  harness: codex
                  startTime: "2026-01-01T00:00:00Z"
                  durationMins: 1
                  turnCount: 2
                  totalTokens: 10
                  toolCallCount: 0
                matches:
                  - {sessionId: agent-live, project: /work/alpha-project, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, entryIndex: 5, role: user, snippet: live hit, score: 2}
    expectedMemberRequests:
      - {groupId: hg_stale, scope: scope-stale, page: 1}
      - {groupId: hg_live, scope: scope-live, page: 1}
    expectedSessionIds: [agent-p1, agent-live]

