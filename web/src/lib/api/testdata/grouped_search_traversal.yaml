# Search-navigation traversal cases for the opt-in grouped search route.
#
# The command palette flattens a grouped search response into individual
# transcript hits. A saved helper group is fetched from the exact opaque scope
# the route issued, and a member row may itself own further helper groups, so the
# traversal must follow the NESTED groups the server returns: when the server
# suppresses a group from the top level because its owner is also a candidate,
# the nested group is the only path to its hits.
#
# Each case drives the REAL fetchGroupedSearchMatches over a fetch boundary that
# answers only the member requests named here; an unexpected request fails the
# case. `expectedMemberRequests` pins every (groupId, scope, page) the traversal
# is allowed to ask for, so paging, deduplication and fail-closed expiry are all
# observable at the wire boundary.
cases:
  - name: nested-helper-reachable-through-nonmatching-owner
    query: guardian
    searchLimit: 20
    searchPayload:
      page: 1
      perPage: 25
      nextItems: []
      revision: '0'
      total: 2
      ordinarySessionTotal: 1
      helperThreadTotal: 1
      items:
        - kind: transcript
          transcript:
            session:
              id: agent-p1
              harness: codex
              startTime: "2026-01-01T00:00:00Z"
              durationMins: 1
              turnCount: 2
              totalTokens: 10
              toolCallCount: 0
            matches:
              - {sessionId: agent-p1, project: /work/alpha-project, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, entryIndex: 0, role: user, snippet: guardian hit, score: 1}
          helperGroups:
            - {groupId: hg_g1, purpose: helper_review, helperThreadCount: 1, memberScope: scope-g1}
    responses:
      - groupId: hg_g1
        scope: scope-g1
        page: 1
        outcome: ok
        body:
          page: 1
          perPage: 25
          nextItems: []
          revision: '0'
          total: 1
          members:
            - kind: transcript
              transcript:
                session:
                  id: agent-g1
                  harness: codex
                  startTime: "2026-01-01T00:00:00Z"
                  durationMins: 1
                  turnCount: 2
                  totalTokens: 10
                  toolCallCount: 0
              helperGroups:
                - {groupId: hg_g2, purpose: helper_review, helperThreadCount: 1, memberScope: scope-g2}
      - groupId: hg_g2
        scope: scope-g2
        page: 1
        outcome: ok
        body:
          page: 1
          perPage: 25
          nextItems: []
          revision: '0'
          total: 1
          members:
            - kind: transcript
              transcript:
                session:
                  id: agent-g2
                  harness: codex
                  startTime: "2026-01-01T00:00:00Z"
                  durationMins: 1
                  turnCount: 2
                  totalTokens: 10
                  toolCallCount: 0
                matches:
                  - {sessionId: agent-g2, project: /work/alpha-project, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, entryIndex: 4, role: assistant, snippet: guardian nested hit, score: 2}
    expectedMemberRequests:
      - {groupId: hg_g1, scope: scope-g1, page: 1}
      - {groupId: hg_g2, scope: scope-g2, page: 1}
    expectedSessionIds: [agent-p1, agent-g2]

