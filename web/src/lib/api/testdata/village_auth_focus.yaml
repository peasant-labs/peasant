# The sign-in read on window focus, shared by the sidebar and the online page,
# played on a fake clock. Each case is a timeline of subscriptions, focus
# events and unsubscriptions (`at` in milliseconds from the start), the reads
# the server answers in order (`ms` it takes, then what it says: a username
# when signed in, `signed out`, or `fail`; the last answer repeats), and what
# is expected: the times each read started, what each subscriber heard in
# order (`no account` when the read failed), and whether the reader still
# listens for focus when the timeline ends (`pendingTimers` checks how many
# timers are waiting at that moment, `listeners` how many focus listeners it
# holds). No two reads are ever in flight at once, in any case.
requiredNames:
  - one-read-per-focus-burst
  - focus-during-a-read-starts-no-read
  - gap-is-two-seconds-from-read-end
  - dropped-focus-gets-one-trailing-read
  - two-subscribers-share-one-read
  - failed-read-reports-no-account-and-allows-the-next
  - last-unsubscribe-removes-the-listener-and-the-timer
  - unsubscribe-last-during-a-read-remount-waits-for-its-end
cases:
  # Five focus events inside one second: one read at once, one after the gap.
  - name: one-read-per-focus-burst
    reads: [{ms: 100, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 3000, focus: true}
      - {at: 3200, focus: true}
      - {at: 3400, focus: true}
      - {at: 3600, focus: true}
      - {at: 3800, focus: true}
    until: 10000
    expectReads: [0, 3000, 5100]
    expectHeard: {sidebar: [ada, ada, ada]}
    expectListening: true

  # The first read is slow; a focus while it runs starts nothing then, and is
  # read once, the gap after that read ends.
  - name: focus-during-a-read-starts-no-read
    reads: [{ms: 1000, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 500, focus: true}
      - {at: 900, focus: true}
    until: 8000
    expectReads: [0, 3000]
    expectHeard: {sidebar: [ada, ada]}
    expectListening: true

  # The gap is measured from where a read ended, not where it started: a focus
  # 2400 ms after a read that started at 0 and ended at 500 is inside it.
  - name: gap-is-two-seconds-from-read-end
    reads: [{ms: 500, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 2400, focus: true}
      - {at: 5100, focus: true}
    until: 9000
    expectReads: [0, 2500, 5100]
    expectHeard: {sidebar: [ada, ada, ada]}
    expectListening: true

  # A sign-in finished in another window during the gap is not missed: the
  # focus that came back with it is read at the end of the gap, once.
  - name: dropped-focus-gets-one-trailing-read
    reads: [{ms: 100, answer: signed out}, {ms: 100, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 1000, focus: true}
      - {at: 1500, focus: true}
      - {at: 1900, focus: true}
    until: 8000
    expectReads: [0, 2100]
    expectHeard: {sidebar: [signed out, ada]}
    expectListening: true

  # The online page mounts the sidebar and its own reader: both hear one read.
  - name: two-subscribers-share-one-read
    reads: [{ms: 100, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 0, subscribe: online}
      - {at: 5000, focus: true}
    until: 9000
    expectReads: [0, 5000]
    expectHeard: {sidebar: [ada, ada], online: [ada, ada]}
    expectListening: true

  # A failed read reports no account, as it always has, and the next focus
  # after the gap reads again.
  - name: failed-read-reports-no-account-and-allows-the-next
    reads: [{ms: 100, answer: ada}, {ms: 100, answer: fail}, {ms: 100, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 3000, focus: true}
      - {at: 6000, focus: true}
    until: 9000
    expectReads: [0, 3000, 6000]
    expectHeard: {sidebar: [ada, no account, ada]}
    expectListening: true

  # When the last page leaves, the focus listener and the trailing read it was
  # owed go with it: a later focus reads nothing.
  - name: last-unsubscribe-removes-the-listener-and-the-timer
    reads: [{ms: 100, answer: ada}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 0, subscribe: online}
      - {at: 1000, focus: true}
      - {at: 1500, unsubscribe: online}
      - {at: 1600, unsubscribe: sidebar}
      # The trailing read the focus at 1000 was owed is no longer scheduled.
      - {at: 1650, pendingTimers: 0}
      - {at: 1700, focus: true}
      - {at: 4000, focus: true}
    until: 9000
    expectReads: [0]
    expectHeard: {sidebar: [ada], online: [ada]}
    expectListening: false

  # The last subscriber leaves while its read is slow. A new subscriber mounts
  # before that read settles: no second read starts, the old answer is told to
  # nobody, and a fresh read runs two seconds after the old read actually ends.
  # A focus during the transition is held for that fresh read.
  - name: unsubscribe-last-during-a-read-remount-waits-for-its-end
    reads: [{ms: 1000, answer: ada}, {ms: 100, answer: signed out}]
    timeline:
      - {at: 0, subscribe: sidebar}
      - {at: 300, unsubscribe: sidebar}
      - {at: 600, subscribe: online}
      - {at: 601, listeners: 1}
      - {at: 800, focus: true}
      # The old read ends at 1000 and schedules the fresh read for 3000.
      - {at: 1000, pendingTimers: 1}
      - {at: 1200, focus: true}
      # The fresh read reaches the new subscriber and ends at 3100.
      - {at: 3200, unsubscribe: online}
      - {at: 3201, listeners: 0, pendingTimers: 0}
      - {at: 4000, focus: true}
    until: 8000
    expectReads: [0, 3000]
    expectHeard: {sidebar: [], online: [signed out]}
    expectListening: false
