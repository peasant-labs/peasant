diffCases:
  - name: normal text diff preserves per-hunk attribution
    payload:
      branch: feat/x
      file: a.go
      status: M
      binary: false
      truncated: false
      hunks:
        - oldStart: 1
          oldLines: 1
          newStart: 1
          newLines: 2
          sessionId: s1
          sessionTitle: Refactor
          lines: [{kind: context, text: package a}, {kind: add, text: 'func A() {}'}]
  - name: binary file has no hunks
    payload: {branch: b, file: img.png, status: A, binary: true, truncated: false, hunks: []}
  - name: truncated large diff remains marked
    payload:
      branch: b
      file: big.go
      status: M
      binary: false
      truncated: true
      hunks:
        - {oldStart: 1, oldLines: 1, newStart: 1, newLines: 1, lines: [{kind: context, text: x}]}
