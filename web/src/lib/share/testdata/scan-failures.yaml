# A failed redaction scan as the publish popup receives it, and the line its
# failure box shows. A stale local index (stored evidence the strict
# publication reader refuses, or a capture not verified yet) is healed by the
# popup's one action, which re-indexes this one session, so it gets one short
# line naming that. Any other failure keeps its own words in the line, on one line,
# unless they hold JSON, a web address or the online service's name; then the
# line points at details. message is the whole reason the details view shows,
# without the transport wrapper. requiredNames pins the cases.
requiredNames:
  - stale-local-index
  - stale-position-evidence
  - unverified-capture
  - server-error-envelope
  - actionable-client-error
  - multi-line-reason
  - online-service-reason
cases:
  - name: stale-local-index
    detail: 'redaction scan failed (404): {"error":"retain unknown source evidence in ingest: extra is missing, null, malformed, duplicated, or unrecognized; no evidence was certified; restore an intact capture or re-index the source"}'
    kind: needs-reindex
    line: this session needs a quick re-index on this computer before it can be published.
    message: 'retain unknown source evidence in ingest: extra is missing, null, malformed, duplicated, or unrecognized; no evidence was certified; restore an intact capture or re-index the source'
  - name: stale-position-evidence
    detail: 'redaction scan failed (404): {"error":"retain unknown source evidence in ingest: position.public is wholly absent; this stored evidence predates traversal coordinates and no full-data certificate was issued; re-index the original source with a position-aware adapter"}'
    kind: needs-reindex
    line: this session needs a quick re-index on this computer before it can be published.
    message: 'retain unknown source evidence in ingest: position.public is wholly absent; this stored evidence predates traversal coordinates and no full-data certificate was issued; re-index the original source with a position-aware adapter'
  - name: unverified-capture
    detail: 'redaction scan failed (404): {"error":"load publication input from peasant.db: database publication metadata needs ingest; metadata and indexed entries are not a verified capture; nothing uploaded; run peasant ingest with the stored source available and retry"}'
    kind: needs-reindex
    line: this session needs a quick re-index on this computer before it can be published.
    message: 'load publication input from peasant.db: database publication metadata needs ingest; metadata and indexed entries are not a verified capture; nothing uploaded; run peasant ingest with the stored source available and retry'
  - name: server-error-envelope
    detail: 'redaction scan failed (404): {"error":"session sess-1 is not recorded on this computer"}'
    kind: other
    line: the scan failed, so publish is off. session sess-1 is not recorded on this computer.
    message: session sess-1 is not recorded on this computer
  - name: actionable-client-error
    detail: 'redaction category "LOCATION" is not recognized; sharing remains blocked'
    kind: other
    line: 'the scan failed, so publish is off. redaction category "LOCATION" is not recognized; sharing remains blocked.'
    message: 'redaction category "LOCATION" is not recognized; sharing remains blocked'
  - name: multi-line-reason
    detail: "redaction scan failed (500): {\"error\":\"prepare configured custom redaction patterns: pattern private-alias does not compile\\nwhat: the custom pattern is not a valid expression\\nfix: correct redaction.custom_patterns in config.yaml and retry\"}"
    kind: other
    line: 'the scan failed, so publish is off. prepare configured custom redaction patterns: pattern private-alias does not compile what: the custom pattern is not a valid expression fix: correct redaction.custom_patterns in config.yaml and retry.'
    message: "prepare configured custom redaction patterns: pattern private-alias does not compile\nwhat: the custom pattern is not a valid expression\nfix: correct redaction.custom_patterns in config.yaml and retry"
  - name: online-service-reason
    detail: 'redaction scan failed (502): {"error":"reading the publication from https://village.example failed"}'
    kind: other
    line: the scan failed, so publish is off. details say why.
    message: reading the publication from https://village.example failed
