# Host-owned paging for one expanded helper group. The window arithmetic is the
# only place a page, a page size and a server total meet, so every page/perPage/
# total combination the footer can render is pinned here as one case.
#
# perPage is the schema-owned PageSize set: 25, 50, or 100. A short page uses
# fewer rows; it never lowers perPage.
cases:
  - name: first-page-of-many
    operation: window
    paging: {page: 1, perPage: 25, total: 60}
    expected: {start: 0, end: 25, pageCount: 3, hasPrevious: false, hasNext: true}

  - name: middle-page
    operation: window
    paging: {page: 2, perPage: 25, total: 60}
    expected: {start: 25, end: 50, pageCount: 3, hasPrevious: true, hasNext: true}

  - name: last-partial-page
    operation: window
    paging: {page: 3, perPage: 25, total: 60}
    expected: {start: 50, end: 60, pageCount: 3, hasPrevious: true, hasNext: false}

  - name: exact-multiple-final-page
    operation: window
    paging: {page: 2, perPage: 25, total: 50}
    expected: {start: 25, end: 50, pageCount: 2, hasPrevious: true, hasNext: false}

  - name: clamped-past-last-page
    operation: window
    paging: {page: 9, perPage: 25, total: 60}
    expected: {start: 50, end: 60, pageCount: 3, hasPrevious: true, hasNext: false}

  - name: empty-scope-window
    operation: window
    paging: {page: 1, perPage: 25, total: 0}
    expected: {start: 0, end: 0, pageCount: 1, hasPrevious: false, hasNext: false}

  - name: single-short-page
    operation: window
    paging: {page: 1, perPage: 25, total: 3}
    expected: {start: 0, end: 3, pageCount: 1, hasPrevious: false, hasNext: false}

  - name: page-size-25
    operation: window
    paging: {page: 3, perPage: 25, total: 75}
    expected: {start: 50, end: 75, pageCount: 3, hasPrevious: true, hasNext: false}

  - name: first-page-default-perPage
    operation: firstPage
    perPage: 25
    expected: {page: 1, perPage: 25, total: 0}

  - name: first-page-custom-perPage
    operation: firstPage
    perPage: 50
    expected: {page: 1, perPage: 50, total: 0}

  - name: goto-next-page
    operation: gotoPage
    paging: {page: 1, perPage: 25, total: 60}
    page: 2
    expected: {page: 2, perPage: 25, total: 60}

  - name: goto-page-preserves-perPage-and-total
    operation: gotoPage
    paging: {page: 3, perPage: 25, total: 75}
    page: 1
    expected: {page: 1, perPage: 25, total: 75}

  - name: with-total-records-served-page
    operation: withTotal
    paging: {page: 1, perPage: 25, total: 0}
    served: {page: 1, total: 5}
    expected: {page: 1, perPage: 25, total: 5}

  - name: with-total-follows-server-lower-page
    operation: withTotal
    paging: {page: 3, perPage: 25, total: 50}
    served: {page: 2, total: 25}
    expected: {page: 2, perPage: 25, total: 25}

  - name: window-rejects-zero-page
    operation: window
    paging: {page: 0, perPage: 25, total: 60}
    expectError: true

  - name: window-rejects-zero-perPage
    operation: window
    paging: {page: 1, perPage: 0, total: 60}
    expectError: true

  - name: window-rejects-fractional-page
    operation: window
    paging: {page: 1.5, perPage: 25, total: 60}
    expectError: true

  - name: goto-page-rejects-nonexistent-page
    operation: gotoPage
    paging: {page: 1, perPage: 25, total: 60}
    page: 0
    expectError: true

  - name: first-page-rejects-zero-perPage
    operation: firstPage
    perPage: 0
    expectError: true
