name: Release PR

# Two-trigger release-PR gate (the "release(vX.Y.Z): …" ceremony).
#
# Trigger A — while a release PR is OPEN (opened/edited/synchronize/reopened/
#   labeled): validate the title grammar (via the release-guard CLI, the single
#   source of the grammar) and assert the PR author is a maintainer
#   (admin/maintain collaborator). Failures surface at PR time, before merge.
#   The e2e and release-validate matrices re-run on a push only when the push
#   touches their inputs or their previous run on this PR has not passed; add
#   the `full-gate` label to force the complete matrix before merge.
#
# Trigger B — when a release PR MERGES (closed && merged):
#   run make nix-vendor-hash on the merge commit, commit a flake.nix hash fix if
#   needed, then push an annotated tag on the hash-current commit using a GitHub App
#   token (the default GITHUB_TOKEN cannot push a tag that re-triggers release.yml —
#   GitHub's recursive-workflow guard; the App token can). Hard-fail if the tag
#   exists.
#
# The App token needs Contents:write on peasant (an App installation setting).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, closed]
    branches: [develop]

# A push (synchronize) supersedes the running gates for this PR. A body edit
# does NOT: it shares the `gates` group with the push run, so it queues behind
# it instead of cancelling it, and the surviving edited run cannot leave the PR
# with no pre-merge signal. A label add gets its own per-label group so an
# unrelated label cannot replace a queued `full-gate` run; a full-gate run may
# therefore overlap a push's run, but the child workflows are keyed per head and
# cannot cancel each other across heads.
concurrency:
  group: release-pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name || 'gates' }}
  cancel-in-progress: ${{ github.event.action != 'edited' && github.event.action != 'labeled' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Trigger A: validate an OPEN release PR (grammar + maintainer author).
  validate:
    name: validate release PR
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.title, 'release(')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release PR title grammar
        id: title
        run: go run github.com/peasant-labs/schema/cmd/release-guard parse-title "$PR_TITLE"

      # Maintainer predicate is single-sourced in release-guard
      # (release.IsMaintainer); the workflow just consumes its exit code.
      - name: Assert author is a maintainer (admin/maintain)
        run: go run github.com/peasant-labs/schema/cmd/release-guard check-maintainer --user "$PR_AUTHOR"

  # Input probe for the expensive matrices. A synchronize push re-runs a gate
  # when the push touches the gate's inputs, or when the previous head has no
  # complete passing child check-run set for the gate. Everything the probe
  # cannot establish runs the gate (see scripts/release-pr-delta). The callers
  # tolerate a failed probe; `tests.yml` never depends on it. The `full-gate`
  # label ignores the probe's decision (the job still runs). The probe runs on
  # open events so that the `needs` graph cannot skip an affected gate.
  changes:
    name: changed gates
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.title, 'release(')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      e2e: ${{ steps.delta.outputs.e2e }}
      release_validate: ${{ steps.delta.outputs.release_validate }}
    steps:
      - name: Checkout repository (full history for the previous head)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Classify the delta and the previous head's gate evidence
        id: delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          go run ./scripts/release-pr-delta
          -action "${{ github.event.action }}"
          -before "${{ github.event.before }}"
          -head "${{ github.event.pull_request.head.sha }}"
          -repo "${{ github.repository }}"
          -pr "${{ github.event.pull_request.number }}"

  # Validation matrices on an OPEN release PR. `tests.yml` runs on opened,
  # reopened, synchronize, and full-gate labeled events; `e2e.yml` and
  # `release-validate.yml` run on the same events, and on a push only when the
  # `changes` probe marks them affected or without passing evidence.
  # A push also fires the path-filtered standalone Tests/E2E runs. Their jobs
  # skip release(...) PRs through caller-aware guards, so the called copies here
  # are the single execution of each suite and of the harvester guard. Keep
  # those guards in tests.yml/e2e.yml in step with this workflow's `name:` (the
  # guards compare against it).
  tests:
    name: tests (release PR)
    needs: validate
    # The general gate: it runs on every eligible event, independent of the
    # probe, so a probe failure can never silence the suite.
    if: >-
      startsWith(github.event.pull_request.title, 'release(') &&
      (contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'full-gate'))
    permissions:
      contents: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets: inherit
    uses: ./.github/workflows/tests.yml

  e2e:
    name: e2e (release PR)
    needs: [validate, changes]
    # `!cancelled()` plus the explicit validate check keeps a failed probe from
    # skipping the gate through the implicit dependency cascade: on a push the
    # gate skips only when the probe succeeded and explicitly said "false".
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      startsWith(github.event.pull_request.title, 'release(') &&
      (contains(fromJSON('["opened","reopened"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'full-gate') ||
       (github.event.action == 'synchronize' &&
        (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false')))
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  release-validate:
    name: release-validate (release PR)
    needs: [validate, changes]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      startsWith(github.event.pull_request.title, 'release(') &&
      (contains(fromJSON('["opened","reopened"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'full-gate') ||
       (github.event.action == 'synchronize' &&
        (needs.changes.result != 'success' || needs.changes.outputs.release_validate != 'false')))
    permissions:
      contents: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets: inherit
    uses: ./.github/workflows/release-validate.yml

  # Trigger B: a release PR MERGED — assert maintainer approval, then tag.
  tag:
    name: tag merged release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release(')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Mint App token (Contents:write to push the tag)
        id: tok
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PEASANT_RELEASER_APP_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: peasant

      - name: Checkout repository (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.tok.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Derive version + kind from the PR title
        id: title
        run: go run github.com/peasant-labs/schema/cmd/release-guard parse-title "$PR_TITLE"

      # The maintainer-approval assertion is deliberately not enforced: with a
      # single active maintainer, GitHub's no-self-approval rule makes it
      # unsatisfiable. The subcommand + tests live in the shared
      # github.com/peasant-labs/schema/cmd/release-guard for a future governance
      # decision, but the current release flow must remain satisfiable.

      - name: Update Nix vendor hash before tagging
        id: nix_hash
        run: |
          set -euo pipefail
          if [ -z "${MERGE_SHA}" ]; then
            echo "::error::merge_commit_sha is empty; cannot update vendorHash before tagging. (Was the PR actually merged?)"
            exit 1
          fi
          git checkout -B release-nix-hash "${MERGE_SHA}"
          make nix-vendor-hash
          if git diff --quiet -- flake.nix; then
            tag_sha="$(git rev-parse HEAD)"
            echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            echo "::notice::vendorHash already current at ${tag_sha}"
            exit 0
          fi
          git config user.name "peasant-release-bot"
          git config user.email "noreply@peasantlabs.org"
          git add flake.nix
          git commit -m "chore: update nix vendor hash"
          max_push_attempts=3
          for attempt in $(seq 1 "$max_push_attempts"); do
            git fetch origin develop
            if ! git rebase origin/develop; then
              echo "::error::failed to rebase nix vendor hash commit onto origin/develop on attempt ${attempt}/${max_push_attempts}. Resolve the flake.nix conflict on develop and rerun the release PR."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:develop"; then
              tag_sha="$(git rev-parse HEAD)"
              echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
              echo "::notice::updated vendorHash and will tag ${tag_sha}"
              exit 0
            fi
            echo "::warning::push to develop failed on attempt ${attempt}/${max_push_attempts}; fetching and rebasing before retry."
          done
          echo "::error::failed to push nix vendor hash commit to develop after ${max_push_attempts} attempts. Check for a protected-branch rejection or repeated concurrent updates, then rerun the release PR."
          exit 1

      - name: Push annotated tag (hard-fail if it exists)
        env:
          VERSION: ${{ steps.title.outputs.version }}
          TAG_SHA: ${{ steps.nix_hash.outputs.tag_sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::tag_sha is empty; cannot tag."
            exit 1
          fi
          # Refuse to move an existing tag — a duplicate/mistyped release PR.
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists; refusing to move a published tag. Bump the version in a new release PR."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION} already exists on origin; refusing to overwrite. Bump the version in a new release PR."
            exit 1
          fi
          git config user.name "peasant-release-bot"
          git config user.email "noreply@peasantlabs.org"
          git tag -a "${VERSION}" "${TAG_SHA}" -m "${PR_TITLE}"
          git push origin "refs/tags/${VERSION}"
          echo "::notice::pushed annotated tag ${VERSION} on ${TAG_SHA}"
