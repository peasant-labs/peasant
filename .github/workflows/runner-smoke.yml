name: runner-smoke

# End-to-end check of the org self-hosted runner pool (desktop).
# Only triggers on PRs that touch this file so it stays quiet afterwards.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/runner-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: desktop self-hosted runner
    runs-on: [self-hosted, nixos]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Nix daemon
        run: |
          nix store ping
          nix --version

      - name: Rootless podman
        run: |
          podman unshare cat /proc/self/uid_map
          podman run --rm docker.io/library/alpine:3.20 echo podman-ok

      - name: Docker-compatible shim
        run: docker version --format '{{.Server.Version}}'
