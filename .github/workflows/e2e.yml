name: E2E

# Heavy full-stack push smoke test: `make e2e` provisions an ephemeral stack with
# podman (Postgres + RustFS + the real village ./cmd/server) and drives the real
# peasant CLI through ingest → village push (skip-gate + retraction) → the village
# secret-scan. It runs on the classified release merge group, at release-tag
# time, and on demand. Ordinary PRs and post-merge branch pushes skip it.
on:
  pull_request:
    branches: [develop]
    paths:
      - internal/e2e/**
      - internal/ingest/**
      - internal/pull/**
      - internal/push/**
      - cmd/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/e2e.yml
  # The push trigger stays so the workflow remains push-triggerable (a guarded
  # contract invariant), but the job's `if` skips develop/main branch pushes, so
  # a merge to develop does not run e2e. Release tags reach e2e through
  # release.yml's workflow_call, not this trigger.
  push:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

# Only PR runs cancel superseded runs; merge groups use separate ref keys.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The disposable Village checkout the harness provisions. Two invariants ride
  # on this pin, both fail-closed:
  #   1. Its backend/go.mod must require the same github.com/peasant-labs/schema
  #      module as this repo's go.mod — `make e2e-schema-parity` enforces it
  #      before any container starts, and the harness re-asserts it.
  #   2. Its server must advertise every content capability the release emits
  #      (today including session_graph_provenance_v1, gated behind the
  #      provenance preservation proof). A Village ref that predates an
  #      advertised capability leaves the enriched fixture sessions refused and
  #      the fail-closed assertion in this workflow turns that into a red gate.
  # Bump this ref and the schema module pin together; keep release-e2e.yml and
  # internal/e2e/testdata/workflows/e2e_contract.yaml in lockstep.
  VILLAGE_REF: 1b78974649af33da6689d8d345d2a2156091ab68

permissions:
  contents: read
  pull-requests: read

jobs:
  entry:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peasant-labs/infra
          ref: 7d2a604afe5b50a3dcc20df06f02e85c2a0d4027
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Resolve and classify the entry
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP:$PATH"
          bash scripts/release-group-entry

  e2e:
    name: full-stack push e2e (podman)
    # A release group is identified by the resolver, not by its PR title.
    needs: entry
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'merge_group' && needs.entry.result == 'success' &&
        needs.entry.outputs.kind == 'release'))
    # This job is deliberately NOT routed through the determine-runner pool
    # selector the other x86_64 jobs use. The self-hosted container pool cannot
    # host it: rootless podman and the disposable Village stack do not come up
    # inside those pool containers, so a pool landing leaves the harness
    # t.Skip()ing and the assertion step below failing with no coverage
    # (release PR run 35268401677, runner desktop-container-1). The warm stack
    # is amd64-only, so the label is the amd64 Blacksmith runner and must never
    # be an arm64 one.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout peasant
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout village (for ./cmd/server + ./cmd/village-setup-demo)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: peasant-labs/village
          ref: ${{ env.VILLAGE_REF }}
          path: _village
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify schema module pin parity
        env:
          VILLAGE_REPO: ${{ github.workspace }}/_village
        run: make e2e-schema-parity

      # Pin/assert the CI podman version for local<->CI parity. The pinned amd64
      # Blacksmith runner now ships podman 5.8.x. The stderr object-count
      # regression and the status=dead filter break were both shaped by the older
      # 4.9.x runner image (see docs/e2e.md); the real fixes are version-immune,
      # but a runner-image bump that changes podman must still fail loudly here
      # and force a lockstep update of docs/e2e.md's local repro.
      - name: Verify and pin podman version (local<->CI parity)
        env:
          EXPECTED_PODMAN_MAJOR_MINOR: "5.8"
        run: |
          set -euo pipefail
          podman --version
          actual="$(podman version --format '{{.Client.Version}}')"
          case "$actual" in
            "${EXPECTED_PODMAN_MAJOR_MINOR}".*)
              echo "podman $actual matches the pinned ${EXPECTED_PODMAN_MAJOR_MINOR}.x parity floor" ;;
            *)
              echo "::error::podman $actual does not match the pinned ${EXPECTED_PODMAN_MAJOR_MINOR}.x parity floor; update .github/workflows/e2e.yml and docs/e2e.md (local repro) in lockstep"
              exit 1 ;;
          esac

      # Status set is TERMINAL + NON-RACY: `exited` + `stopped` are the podman
      # terminal states a finished sibling lands in. `created` (a sibling's brief
      # created-window) and `running` (a live sibling) are deliberately EXCLUDED.
      # NB: do NOT use `status=dead` — it is a Docker state that podman
      # REJECTS ("unknown container state: dead"), which broke this cleanup step
      # (the piped command erred → no-op → stale containers were never reaped).
      - name: Clean up stale e2e podman containers
        run: |
          mapfile -t containers < <(
            {
              podman ps -aq --filter name=peasant-e2e- --filter status=exited
              podman ps -aq --filter name=peasant-e2e- --filter status=stopped
            } | sort -u
          )
          if [ "${#containers[@]}" -gt 0 ]; then
            podman rm -fv "${containers[@]}"
          fi

      # The harness builds the peasant CLI, whose binary embeds web/out
      # (//go:embed all:web/out). The frontend is not under test here, so use the
      # shared `make web-stub` target — the single source for the
      # placeholder. It is idempotent and non-destructive: it writes an
      # index.html stub when absent (the tracked placeholder is web/out/.gitkeep;
      # the written index.html is gitignored). This job uses setup-go (no nix
      # dev shell), so `make` is invoked directly from the runner's PATH.
      - name: Stub web/out for the //go:embed
        run: make web-stub

      # The village backend lives at <VILLAGE_REPO>/backend; the harness appends it.
      - name: make e2e
        id: e2e
        env:
          VILLAGE_REPO: ${{ github.workspace }}/_village
        run: |
          set +e
          set -o pipefail
          log="$GITHUB_WORKSPACE/e2e.log"
          E2E_MEMORY_MODE=external make e2e E2E_TEST_FLAGS=-v 2>&1 | tee "$log"
          test_status=${PIPESTATUS[0]}
          echo "captured e2e log tail:"; tail -5 "$log" || true
          assert_status=0
          fail() { echo "::error::$1"; assert_status=1; }
          if grep -qi 'no tests to run' "$log"; then
            fail "go test reported no tests to run; asserted e2e tests did not execute."
          fi
          if grep -qE '^--- SKIP: TestSkipGateE2E' "$log"; then
            fail "TestSkipGateE2E was SKIPPED — podman/village/network setup is incomplete; no e2e coverage ran."
          fi
          if ! grep -qE '^--- PASS: TestSkipGateE2E' "$log"; then
            fail "TestSkipGateE2E did not produce a positive PASS line; no asserted e2e coverage was proven."
          fi
          if grep -qE '^--- SKIP: TestPullRoundTripE2E' "$log"; then
            fail "TestPullRoundTripE2E was SKIPPED — pull regression coverage did not run."
          fi
          if ! grep -qE '^--- PASS: TestPullRoundTripE2E' "$log"; then
            fail "TestPullRoundTripE2E did not produce a positive PASS line; pull regression coverage was not proven."
          fi
          if grep -qE '^--- SKIP: TestHarnessRefreshE2E' "$log"; then
            fail "TestHarnessRefreshE2E was SKIPPED — warm-stack refresh coverage did not run."
          fi
          if ! grep -qE '^--- PASS: TestHarnessRefreshE2E' "$log"; then
            fail "TestHarnessRefreshE2E did not produce a positive PASS line; refresh regression coverage was not proven."
          fi
          if grep -qE '^--- SKIP: TestPublicationConvergenceE2E' "$log" || ! grep -qE '^--- PASS: TestPublicationConvergenceE2E' "$log"; then
            fail "TestPublicationConvergenceE2E did not run and pass."
          fi
          if grep -qE '^--- SKIP: TestPiRoundTripE2E' "$log" || ! grep -qE '^--- PASS: TestPiRoundTripE2E' "$log"; then
            fail "TestPiRoundTripE2E did not run and pass; check the disposable Village stack and matching schema pins, then rerun native Pi preservation."
          fi
          if grep -qE '^--- SKIP: TestPostCommitHookPublishesConfiguredRepositoryToRealVillage' "$log" || ! grep -qE '^--- PASS: TestPostCommitHookPublishesConfiguredRepositoryToRealVillage' "$log"; then
            fail "joined post-commit publication evidence did not run and pass."
          fi
          if grep -qE '^--- SKIP: TestPrePushHookRefusesUnsupportedRedactionWithoutBlockingThePush' "$log" || ! grep -qE '^--- PASS: TestPrePushHookRefusesUnsupportedRedactionWithoutBlockingThePush' "$log"; then
            fail "joined pre-push refusal evidence did not run and pass."
          fi
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$assert_status"
