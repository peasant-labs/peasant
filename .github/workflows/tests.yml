name: Tests

# Every PR and merge group gets an always-reporting merge-gate. The first job
# classifies changed paths and the live merge-group entry; heavy jobs run for
# relevant changes and the release group. Push CI remains until same-SHA queue
# evidence justifies removing it. The check job stubs the dashboard; the web
# jobs build and exercise the actual embedded frontend.
on:
  pull_request:
  merge_group:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Only PR runs cancel superseded runs; queue builds use separate ref keys.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      release: ${{ steps.entry.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Checkout release-intent
        if: github.event_name == 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peasant-labs/infra
          ref: bcdaa02f9defd528b4dd9cb3077238573e709749
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - name: Set up Go
        if: github.event_name == 'merge_group'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        if: github.event_name == 'merge_group'
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Classify the merge-group entry
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != merge_group ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PATH="$RUNNER_TEMP:$PATH"
          kind="$(bash scripts/release-group-entry)"
          if [ "$kind" = 'kind=release' ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          RELEASE: ${{ steps.entry.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ "$RELEASE" = true ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE" "$HEAD"
          code=false
          git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.go|*/testdata/*|go.mod|go.sum|third_party/zombiezen-sqlite/*|internal/sqliteforkaudit/*|scripts/vet-go.sh|scripts/check-module-install/*|scripts/release-group-entry|Makefile|sgconfig.yml|.unstring.yaml|.unstring-baseline.yaml|ast-grep/*|internal/tui/gates/astrules/*|flake.nix|flake.lock|.gitignore|web/*|.github/workflows/*|.github/release-queue.policy.yml|.github/release-intent.yaml|.goreleaser.yml|scripts/install-goreleaser|scripts/goreleaser-v2.17.1-homebrew.patch|scripts/update-nix-vendor-hash.sh|scripts/gen-third-party-notices.sh|scripts/check-dep-licenses.sh|THIRD_PARTY_NOTICES|scripts/release-e2e/*)
                code=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  release-content:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peasant-labs/infra
          ref: bcdaa02f9defd528b4dd9cb3077238573e709749
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Recheck release content against the current default branch
        env:
          FLOOR: ${{ vars.RELEASE_BATCH_FLOOR }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          "$RUNNER_TEMP/release-intent" release-pr --check --branch origin/develop --floor "$FLOOR"

  vendor-hash:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.release == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Check vendor hash
        continue-on-error: ${{ needs.changes.outputs.release != 'true' }}
        run: |
          set -euo pipefail
          make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale; let the vendor hash PR land before releasing."
            git diff -- flake.nix
            exit 1
          fi

  schema-parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read the existing Village fixture pin
        id: pin
        run: |
          set -euo pipefail
          ref="$(yq -e '.expected_village_ref' internal/e2e/testdata/workflows/e2e_contract.yaml)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout Village
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peasant-labs/village
          ref: ${{ steps.pin.outputs.ref }}
          path: _village
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify schema pin parity
        env:
          VILLAGE_REPO: ${{ github.workspace }}/_village
        run: make e2e-schema-parity

  e2e:
    needs: [changes, release-content, vendor-hash]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  release-validate:
    needs: [changes, release-content, vendor-hash]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
      pull-requests: read
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    uses: ./.github/workflows/release-validate.yml

  # Route the architecture-neutral jobs to the self-hosted MicroVM pool, with a
  # Blacksmith amd64 fallback when the pool is unavailable. Routing comes from
  # the shared runner-router reusable workflow; every routed job reads the label
  # array from its output. `check` and `cgo0` build and test the Go suite on
  # arm64 and stay on their arm64 runner. `check-arm64` is release-only and runs
  # on the arm64 Blacksmith runner directly.
  determine-runner:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@71e687cef7eede9a63659be98ce9adac3c563398
    with:
      fallback: '["blacksmith-2vcpu-ubuntu-2404"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # A push that squashes a pull request already validated by `make check` does
  # not repeat the job. The probe proves the pushed tree is the tested pull
  # request head and that the head carries a successful GitHub Actions
  # `make check`; everything it cannot prove runs the gate. See
  # scripts/post-merge-evidence.
  post-merge-evidence:
    name: post-merge evidence
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      skip: ${{ steps.evidence.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prove the merged tree already passed the checks
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          go run ./scripts/post-merge-evidence
          -head "${{ github.sha }}"
          -repo "${{ github.repository }}"

  # Push evidence may skip the post-merge check only when it proves the
  # previously tested tree. Group and PR builds use the path decision above.
  check:
    name: make check
    # The probe governs only the push runs; a skipped or failed probe runs the
    # gate, and the release-PR guard stays intact for every event.
    needs: [changes, determine-runner, post-merge-evidence]
    permissions:
      contents: read
    if: >-
      !cancelled() &&
      (needs.post-merge-evidence.result != 'success' ||
       needs.post-merge-evidence.outputs.skip != 'true') &&
      needs.changes.outputs.code == 'true'
    # Routed to the x86_64 pool. `make check` needs only the Go toolchain, a C
    # compiler for `go vet`/cgo, and the ast-grep binary. It does not need the
    # Nix devShell. The pool hands a lone
    # job the whole 24-core pool budget
    # (hosts/desktop/configuration.nix: pool cpuQuota 2400%, per-runner
    # cpuWeight with no quota), against 2 vCPU on the arm64 Blacksmith runner.
    #
    # The race detector is disabled on this gate for now: the release race suite
    # does not fit the 30-minute budget. cmd/peasant alone is an 18-minute race
    # run and the full suite needs ~40 minutes, so the gate runs the suite
    # without the detector until the test-performance work in #389 lands.
    # Race is opt-in locally (`make check RACE=1`); see CONTRIBUTING.md.
    # TMPDIR=/tmp is load-bearing on the pool, not a workaround. The pool
    # exports its work dir as TMPDIR and that dir lives under the desktop user's
    # home (~/.local/share/github-runner-containers/work/...), so every test temp
    # path matches redact's built-in `unix_home_path` rule instead of the xdg_*
    # rules the fixtures assert. The same check on Blacksmith sees
    # /home/runner/work/_temp/... and classifies differently, so the metrics
    # assertions were runner-shaped. /tmp keeps the harness paths out of any
    # home directory, so the rule distribution is the same on every runner.
    # fairtrade's ci.yml sets the same thing for the same class of reason.
    env:
      RACE: '0'
      TMPDIR: /tmp
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    # 30 minutes = the measured ~9m30s amd64 pool gate plus headroom for the
    # internal/ingest regression (#941). The suite exceeds 20 minutes when
    # internal/ingest is disk-bound, and the old cap killed the gate before its
    # non-blocking budget report could run. This
    # remains a wedging cap, not the budget check: the committed budget fixture
    # reports a slow suite and the gate stays green, and the 5-minute aggregate
    # is assessed on this job's wall (it is the critical path; the other pool
    # jobs run in parallel). See docs/testing/ci-phase-measurement.md.
    timeout-minutes: 30
    steps:
      # Job-start clock for the phase report. It must be the first step so the
      # pre-test phase covers checkout, toolchain setup, and cache restore.
      - name: Phase clock start
        run: echo "PHASE_START_S=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      # `make check` shells out to `ast-grep scan`. The pool image does not
      # provide ast-grep, so install the prebuilt npm binary (glibc, linux-x64-gnu).
      # Version pinned to the devShell's ast-grep so the rules keep their
      # semantics; the scan itself stays the Makefile's, unchanged.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.51.2

      # Cache the Go build + module dirs. The key is namespaced `-go-amd64-`:
      # `runner.os` is `Linux` on the arm64 runner too, so the old shared
      # `${{ runner.os }}-go-` key/restore-key was a PREFIX of the arm64 lane's
      # `Linux-go-arm64-<hash>` (and the harvester guard's `Linux-go-r1-<hash>`),
      # so an amd64 run could restore an arm64 tarball and then pay a full cold
      # rebuild. Every job now restores only its own architecture's lane.
      #
      # Restore and save are split so each is its own timed step (the combined
      # action saves in an untimed-by-name post step). `if: success() &&
      # cache-hit != 'true'` reproduces the combined action's `post-if:
      # success()` save semantics. The old DeterminateSystems/magic-nix-cache-action
      # was REMOVED: it was retired in favour of FlakeHub Cache, which requires a
      # FlakeHub account and now fails ("Unable to authenticate to FlakeHub") on
      # a plain repo.
      - name: Restore Go build + modules cache (amd64)
        id: cache-go
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-amd64-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-amd64-

      # RACE comes from the job-level env above. The phase summary makes the
      # pre-test / go-test split quotable per run; the gate itself prints its own
      # in-`make check` pre-test, plan, and per-pass walls.
      - name: make check (amd64 pool gate)
        run: |
          set -euo pipefail
          start=$(date +%s)
          # The gate's out dir follows its local convention — UTC-stamped
          # $TESTGATE_OUT — redirected into $RUNNER_TEMP so the streams never
          # touch the pool runner's persistent workspace; the GITHUB_ENV stamp
          # is the artifact step's pointer to it. make check passes it through
          # to `cmd/testgate run` unmodified.
          TESTGATE_OUT="$RUNNER_TEMP/testgate/$(date -u +%Y%m%dT%H%M%SZ)"
          echo "TESTGATE_DIR=$TESTGATE_OUT" >> "$GITHUB_ENV"
          export TESTGATE_OUT
          # Root in the container pool otherwise bypasses the DAC permissions
          # that filesystem tests must exercise. Drop only those bypass powers
          # irreversibly for this command and its children, not the runner.
          if [ "$(id -u)" -eq 0 ]; then
            setpriv --bounding-set=-dac_override,-dac_read_search \
              --inh-caps=-dac_override,-dac_read_search \
              --ambient-caps=-dac_override,-dac_read_search --no-new-privs \
              make check RACE=${{ env.RACE }}
          else
            make check RACE=${{ env.RACE }}
          fi
          end=$(date +%s)
          {
            echo "### amd64 pool gate — phase wall"
            echo ""
            echo "| phase | seconds |"
            echo "| --- | --- |"
            echo "| pre-test (job start -> gate start) | $(( start - ${PHASE_START_S:-$start} )) |"
            echo "| go test (make check body, RACE=${{ env.RACE }}) | $(( end - start )) |"
            echo ""
            echo "Cache phases are the two \`cache (amd64)\` step durations (restore, then save)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Go build + modules cache (amd64)
        if: success() && steps.cache-go.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache-go.outputs.cache-primary-key }}

      # Durable gate evidence, matching the arm64 lane: report.json + the
      # per-package go test -json streams (and stderr captures) from the out
      # dir, inspectable offline (`testgate timing` reads a stream from stdin).
      # The run_attempt suffix keeps a rerun from clashing with the prior
      # attempt's artifact. A failure before the plan completes (registry,
      # go list) leaves no out-dir at all — ignore keeps the upload from
      # failing the already-failed job.
      - name: Upload testgate streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testgate-amd64-${{ github.run_attempt }}
          path: ${{ env.TESTGATE_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  # arm64 lane. `check` moved to the x86_64 pool, so arm64 signal would otherwise
  # disappear from CI entirely. This keeps it on a subset rather than the whole
  # suite: the full suite on both architectures doubles the Blacksmith bill the
  # pool migration exists to cut, and the packages below are the ones that ship
  # in the binary and carry the real architecture risk.
  #
  #   cmd/peasant   - the shipped CLI entry point
  #   internal/ingest - the parser/hot path, also exercised by the harvester
  #                     guard and the CGO=0 job
  #
  # Widen this list deliberately: a package added here is an arm64 gate on every
  # release. Narrowing it trades arm64 coverage for cost, so the tradeoff belongs
  # in the PR description, not silently in this list.
  #
  # Release-group only, after content and vendor-hash checks.
  check-arm64:
    name: make check (arm64 subset)
    needs: [changes, determine-runner, release-content, vendor-hash]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # 20 minutes = the measured arm64 subset job wall (9m54s-10m31s on a 2-vCPU
    # Blacksmith runner) plus ~2x headroom. This lane is measured and reported,
    # not a budget commitment (its wall-clock variance is not deterministically
    # testable); the cap is wedging protection only. It is NOT gated on the
    # 5-minute aggregate, which is assessed on the amd64 pool gate.
    timeout-minutes: 20
    # The lane's no-race posture is pinned explicitly by -race=false in the
    # test step below: the gate's -race flag defaults ON, so the flag is the
    # single driver. No RACE env is set here — the gate reads no environment.
    steps:
      # Job-start clock for the phase report (covers checkout, the Nix install,
      # cache restore, and the web stub).
      - name: Phase clock start
        run: echo "PHASE_START_S=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      # Namespaced `-go-arm64-` for the same reason as the amd64 lane: the old
      # shared `${{ runner.os }}-go-` restore-key let this lane seed or restore
      # another job's artifacts. Restore and save are split for phase timing.
      - name: Restore Go build + modules cache (arm64)
        id: cache-go
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-arm64-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-arm64-

      # The Nix install + web stub are part of this lane's pre-test cost; stamp
      # the stub separately so the arm64 pre-test budget can be attributed.
      - name: make web-stub
        run: |
          set -euo pipefail
          start=$(date +%s)
          nix develop -c make web-stub
          echo "WEB_STUB_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: arm64 subset
        run: |
          set -euo pipefail
          start=$(date +%s)
          # The gate machinery in subset mode: the plan comes from
          # `go test -list`, the exactly-once screen is scoped to the plan (a
          # planned package that emits no events fails), and the whole-suite
          # budget is not applicable (TESTING.md, "Subset runs"). The gate's
          # -race flag defaults ON, so -race=false pins the lane's no-race
          # posture explicitly. The gate runs each package with -timeout=0, so
          # this job's 20-minute cap is the wall.
          # The out dir follows the gate's local convention — UTC-stamped
          # $TESTGATE_OUT — and lands in $RUNNER_TEMP, not the workspace; the
          # GITHUB_ENV stamp is the artifact step's pointer to it.
          TESTGATE_OUT="$RUNNER_TEMP/testgate/$(date -u +%Y%m%dT%H%M%SZ)"
          echo "TESTGATE_DIR=$TESTGATE_OUT" >> "$GITHUB_ENV"
          export TESTGATE_OUT
          nix develop -c go run ./cmd/testgate run \
            -pkgs ./cmd/peasant/...,./internal/ingest/... \
            -race=false
          end=$(date +%s)
          {
            echo "### arm64 lane — phase wall"
            echo ""
            echo "| phase | seconds |"
            echo "| --- | --- |"
            echo "| pre-test (job start -> test start) | $(( start - ${PHASE_START_S:-$start} )) |"
            echo "| — of which web stub | ${WEB_STUB_S:-n/a} |"
            echo "| testgate subset | $(( end - start )) |"
            echo ""
            echo "Cache phases are the two \`cache (arm64)\` step durations (restore, then save)."
            echo "Reported, not budget-gated: the aggregate is assessed on the amd64 pool gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Go build + modules cache (arm64)
        if: success() && steps.cache-go.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache-go.outputs.cache-primary-key }}

      # Durable gate evidence: report.json + the per-package go test -json
      # streams (and stderr captures) from the out dir, so a failed or hung
      # lane can be inspected offline (testgate timing reads a stream from
      # stdin). GitHub takes nothing structural from these; the artifact is
      # the inspection surface, the step summary and exit code stay the gate.
      # The run_attempt suffix keeps a rerun from clashing with the prior
      # attempt's artifact. A failure before the plan completes (registry,
      # go list) leaves no out-dir at all — ignore keeps the upload from
      # failing the already-failed job.
      - name: Upload testgate streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testgate-arm64-${{ github.run_attempt }}
          path: ${{ env.TESTGATE_DIR }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Cross-compile for Windows
        run: nix develop -c env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      # `go build` does not typecheck _test.go files, so a Windows-only test file
      # that stops compiling passes the step above unnoticed. That is how a store
      # test referencing syscall.Stat_t - a type Windows does not have - reached
      # this branch: it broke no build and ran in no job. `go vet` does typecheck
      # test files, and the repository's own vet wrapper already keeps the
      # vendored driver's audited uintptr conversions exempt, so it is reused
      # here with the target set rather than reimplemented. About 17 seconds.
      - name: Typecheck Windows test files
        run: nix develop -c env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 ./scripts/vet-go.sh

  # The cross-revision harvester guard compiles the reviewed base and the
  # candidate as separate trees and probes both. On a 2-vCPU runner that is
  # ~15 minutes, so it gets its own job and its own budget in parallel with
  # `make check`: serialized inside `check` it consumed half of that job's 30
  # minutes and starved the -race suite. It runs for PR and group changes.
  harvester-version-guard:
    name: harvester version guard
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    # Routed to the container pool. The guard needs no Nix: it shells out only
    # to git, tar, and `go test -race` (see scripts/harvester-version-guard),
    # and the pool image already carries git, tar, and the C compiler the race
    # detector requires. setup-go supplies the toolchain `nix develop` used to,
    # and the Makefile target stays the single source of the guard invocation.
    needs: [changes, determine-runner]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # The guard archives and compiles the exact base revision.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      # The guard's probes compile and run under -race, so it keeps its own race
      # lane rather than sharing the plain `make check` artifacts. The key and its
      # restore-key are both namespaced `-go-r1-` so no other job can restore (or
      # seed) this race lane, and this lane cannot restore another architecture's
      # tarball.
      - name: Cache Go build + modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-r1-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-r1-

      - name: Require harvester version bumps for changed behavior
        env:
          GUARD_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: make check-harvester-versions BASE="$GUARD_BASE" CANDIDATE=HEAD

  # CGO=0 build mode gate. The release binaries are built CGO_ENABLED=0 (static,
  # portable) — that is the mode the goreleaser/nix/distro builds ship. This job
  # proves Peasant's public-module redaction seam compiles AND behaves correctly without cgo:
  # `NewRedactor(Maximum)` must HARD-ERROR actionably (never silently weaker
  # redaction) when tree-sitter is not linked. The redact + e2e suites carry the
  # build-tag-gated negative assertions (TestMaximumAvailability_NoCGO,
  # TestFixture_MaximumDifferential branch on redact.MaximumAvailable). Runs
  # WITHOUT -race: the data-race detector requires cgo, so -race under
  # CGO_ENABLED=0 is a contradiction.
  cgo0:
    name: CGO=0 consumer/e2e + module-zip proxy
    # Release-group only, after content and vendor-hash checks.
    if: needs.changes.outputs.release == 'true'
    # Routed to the x86_64 pool: Go handles build/test/module ZIP installation.
    # No Nix devShell is required.
    needs: [changes, determine-runner, release-content, vendor-hash]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      # Already namespaced `-go-cgo0-` on both the key and the restore-key, so
      # this release-only lane never collided with the shared prefix; kept as the
      # consistent pattern for every job.
      - name: Cache Go build + modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-cgo0-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-cgo0-

      # Satisfy the `//go:embed all:web/out` directive for `go build ./...`. The
      # committed web/out/.gitkeep placeholder already satisfies the embed on a
      # fresh checkout; `make web-stub` (idempotent + non-destructive)
      # recreates it. Belt-and-suspenders in case `make clean` ever runs first.
      - name: Stub web/out embed
        run: make web-stub

      - name: CGO=0 build + targeted tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test ./internal/config/ ./internal/ingest/ ./internal/e2e/

      # Exercise the actual Go module ZIP semantics and go install @version.
      # A second named fixture omits the driver and must fail installation.
      - name: Install CLI from a real Go module zip
        run: make module-install-check

  # Dependency-license gate. Two invariants on the third-party Go modules
  # compiled into the binary:
  #   1. THIRD_PARTY_NOTICES is fresh — regenerating it from the pinned module
  #      set produces no diff (the file that ships with the binary matches the
  #      deps).
  #   2. No copyleft (forbidden/restricted) license has entered the module set.
  # Both run via `make third-party-notices-check`. web-stub satisfies the
  # //go:embed all:web/out directive so `go list ./cmd/peasant` can load.
  third-party-notices:
    name: third-party license notices
    if: needs.changes.outputs.code == 'true'
    needs: [changes, determine-runner]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      - name: Notices are fresh + no copyleft dependency
        run: make third-party-notices-check

  # ---------------------------------------------------------------------------
  # web/ package-manager gates. web/ carries one dependency graph in
  # web/pnpm-lock.yaml. Before these jobs nothing
  # mechanically asserted that (1) the lockfile tracks web/package.json, or
  # (2) the real pnpm build produces a non-stub dashboard.
  # The two jobs below close those gaps.
  # They set pnpm/node up the same way release.yml / release-validate.yml do
  # (pnpm/action-setup@v4 with package_json_file: web/package.json; setup-node@v4
  # node 26).
  # ---------------------------------------------------------------------------

  # Lockfile drift: assert web/pnpm-lock.yaml is in sync with
  # web/package.json: `pnpm install --frozen-lockfile` fails if it drifted.
  # Catches the common mistake of bumping web/package.json without
  # regenerating the lockfile.
  web-lockfiles-in-sync:
    name: web lockfiles in sync
    if: needs.changes.outputs.code == 'true'
    needs: [changes, determine-runner]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm-lock.yaml in sync with web/package.json
        run: cd web && pnpm install --frozen-lockfile

  # Run the real pnpm `make web` with no stub fallback so a broken pnpm/Next build fails
  # this job, then assert web/out/index.html exists AND is the real dashboard
  # (not the web-stub notice). Artifact workflows enforce the same invariant.
  web-pnpm-build:
    name: web real pnpm build (no stub fallback)
    if: needs.changes.outputs.code == 'true'
    needs: [changes, determine-runner]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # NO `|| make web-stub`: a failing real build must fail the job, not fall
      # through to a stub dashboard that lets the job pass green.
      - name: Lint web source
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web lint && pnpm --dir web test:unstring-guard

      - name: make web (real pnpm build)
        run: make web

      - name: Assert real (non-stub) dashboard was built
        run: |
          set -euo pipefail
          test -f web/out/index.html || { echo "FAIL: web/out/index.html missing after make web"; exit 1; }
          if grep -qF "is not bundled in this build" web/out/index.html; then
            echo "FAIL: web/out/index.html is the web-stub notice, not a real pnpm build"
            exit 1
          fi
          echo "OK: real pnpm-built dashboard present at web/out/index.html"

      - name: Set up Go for the mounted Home gate
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # The pool already shares /var/cache/runner/gobuild, so the action
          # cache is redundant here. Saving the multi-GB cache in the post-step
          # ran past the job timeout after every test step had passed.
          cache: false

      # The mounted Home check runs in a separate job inside the Playwright
      # image, which has no Go. Build the binary here (it embeds web/out) and
      # hand it over with the exported web/out the check compares it against.
      # CGO_ENABLED=0 matches the released binary (.goreleaser.yml) and keeps it
      # static, so it starts in the image whatever glibc the runner host has.
      - name: Build the binary for the mounted Home gate
        run: CGO_ENABLED=0 go build -o peasant ./cmd/peasant

      - name: Upload the binary and exported dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mounted-home-build
          # Two paths share the workspace root, so the artifact keeps
          # `peasant` and `web/out/` at the paths the check reads.
          path: |
            peasant
            web/out/
          retention-days: 1
          if-no-files-found: error

  # Mounted Home on the exact binary the web job built. The official Playwright
  # image carries Chromium and its system libraries, so this job installs no
  # operating-system packages and downloads no browser: a package mirror
  # outage cannot fail it.
  home-phone-gate:
    name: mounted Home table scroll at phone width
    if: needs.changes.outputs.code == 'true'
    needs: [changes, determine-runner, web-pnpm-build]
    permissions:
      contents: read
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 10
    container:
      # mcr.microsoft.com/playwright:v1.63.0-noble, linux/amd64 manifest. Must match
      # @playwright/test in web/package.json; bump both together.
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host --init
    # Inside a container `run:` defaults to sh (dash), which rejects
    # `set -o pipefail`; use bash like the host jobs.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      # The image ships Node 24; the repo builds and tests on Node 26.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Download the binary and exported dashboard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mounted-home-build
          path: .

      - name: Gate mounted Home table scroll at phone width
        run: |
          set -euo pipefail
          chmod +x peasant
          mkdir -p /tmp/opencode
          PLAYWRIGHT_MODULE=@playwright/test node web/scripts/visual/home-pages-visual.mjs

  windows:
    name: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build every package
        run: go build ./...

      # internal/proc is the console-window helper and is green here in full.
      - name: Run focused tests
        run: go test ./internal/defaults/... ./internal/config/... ./internal/proc/...

      - name: Run credential commit guards
        run: go test ./internal/auth/ -run 'TestCredential|TestNormalizeVillageURL|TestLogout|TestCancelledLogout|TestAlreadyCancelledLogout'

      # The Windows-specific behaviour this branch adds is named explicitly
      # instead of running these packages whole. internal/ingest has pre-existing
      # Windows failures unrelated to this work (80 at the time of writing, in the
      # OpenCode and filesystem suites), so running all of it would report that
      # unrelated breakage rather than guarding drive-letter slug decoding, the
      # absolute-path form check, worktree containment and the debug/ prune.
      #
      # `go build ./...` does not typecheck _test.go files, so a Windows test
      # file that stops compiling would pass it unnoticed. `go vet` does typecheck
      # test files; run the repository's own wrapper, which keeps the vendored
      # driver's audited uintptr conversions exempt. This runs on every pull
      # request, unlike the cross-compile lane's release-gated copy.
      - name: Typecheck Windows test files
        shell: bash
        run: ./scripts/vet-go.sh

      # One `go test` command for every package: the default pwsh shell returns
      # the last command's exit code, so two commands here would discard the
      # first package's failure and let the job report green over a red test.
      # A single invocation reports every failing package and exits non-zero.
      - name: Run the Windows-specific tests
        run: |
          go test ./internal/ingest/ ./internal/api/ ./cmd/peasant/ ./internal/store/ ./internal/testutil/ -run 'TestDecodeClaudeSlug|TestDecodeCursorSlug|TestHasAbsolutePathForm|TestDecodeClaudeProjectDir|TestParsePiDocumentAcceptsWindowsRecordedCWD|TestPipeline_moveSessionFiles_PrunesBelowDebugDirectory|TestPipeline_replaceSessionDir_PrunesObsoleteDebugFiles|TestExecGitResolver_Worktree|TestIsAddrInUseMatchesARealPortConflict|TestPredicatesMatchEveryDocumentedErrno|TestReplaceExecutable|TestSweepUpgradeSidecar|TestTerminateProcessStopsAChild|TestPidFilePath|TestBackgroundProcAttr|TestSessionLockAcrossProcesses|TestMemFS|TestPlatformAbsPath|TestHarmonized|TestContentModelParity|TestContentPromotion|TestContentOneCopy|TestContentConcurrency|TestContentHarvestENOSPC|TestContentMigration|TestContentCorruption|TestContentCrashSeams|TestContentWriteBudget|TestContentGC|TestContentReleaseGuard|TestContentFamilyInventory|TestContentCLISurface|TestMigrationV62|TestStatsOverflowFamily|TestSessionCapturedStats|TestSchemaFreshVsMigrated|TestGoldenTemplateBodyInsert|TestSerializeEntry|TestComputeActivationBinding|TestEntryFromRow|TestRebuildExtra|TestLegacyShape|TestSeedWriteAllowed|TestComputeDerivedScopeNativeVsLegacy|TestInsertSessionsSeedingGates|TestStoredMetadataSeedSource|TestSweepSession|TestSweepFlagged|TestSweepCrash|TestSweepCorrupt|TestReclaimSelectsByFlag|TestReclaimSweepsOrphans|TestReclaimHarmonized|TestReclaimTableInventory|TestSearchRecall|TestSearchCorruption|TestSearchDeleteTimeCheck|TestSearchRebuildGate|TestSearchSizeRatioReported|TestSearchHealthEntry|TestPruneVerifiesBodies|TestMigrate|TestPlanMigration|TestAnnotationTargetsNoFK|TestEvaluateRetirementPreconditions|TestRequireTerminalRefusesRedirectedStdout|TestIsWebServerCommandLine|TestWebProcessRequiresExactExecutablePath|TestPortFlagsValidateBeforeCommandsRun'

      - name: Build peasant.exe and print its version
        run: |
          go build -o peasant.exe ./cmd/peasant
          ./peasant.exe version

  merge-gate:
    name: merge-gate
    needs: [changes, determine-runner, post-merge-evidence, check, check-arm64, harvester-version-guard, cgo0, third-party-notices, web-lockfiles-in-sync, web-pnpm-build, home-phone-gate, windows, release-content, vendor-hash, schema-parity, e2e, release-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful or intentionally skipped jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
          test "$(jq -r '.changes.result' <<< "$RESULTS")" = success
          if [ "$RELEASE" = true ]; then
            for job in release-content vendor-hash check-arm64 cgo0 e2e release-validate; do
              test "$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")" = success
            done
          fi
