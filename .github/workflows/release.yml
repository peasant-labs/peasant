name: Release

# Tag-triggered binary release pipeline. The tag is pushed by release-batch.yml's
# App token (the default GITHUB_TOKEN cannot push a tag that re-triggers a
# workflow), so this runs automatically when a release PR merges.
#
# The `v*` filter matches Peasant release tags (v0.1.0, v0.1.0-rc1).
# release-guard parse-tag is the defense-in-depth re-check inside the guard job.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Route the x86_64 release and smoke jobs to the self-hosted MicroVM pool,
  # with a Blacksmith amd64 fallback when the pool is unavailable. Routing comes from
  # the shared runner-router reusable workflow. `guard`, `nix-vendor-hash`, the
  # arm64 `smoke` entry, and `macos-cask-smoke` keep their current runners.
  determine-runner:
    # The caller must grant at least what the called router workflow declares
    # (contents: read); this workflow's top-level permissions are empty, so the
    # grant is explicit here.
    permissions:
      contents: read
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@71e687cef7eede9a63659be98ce9adac3c563398
    with:
      fallback: '["blacksmith-4vcpu-ubuntu-2404"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # Gate the build: reject tags not created by the release App and tags outside
  # the Peasant release grammar. Final releases no longer require a prior rc.
  guard:
    name: guard
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      prerelease: ${{ steps.parse.outputs.kind == 'rc' }}
      latest: ${{ steps.parse.outputs.kind == 'final' }}
    steps:
      - name: Verify release tag actor
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_RELEASE_ACTOR: peasant-labs-releaser[bot]
          EXPECTED_RELEASE_ACTOR_ID: "291504229"
        run: |
          if [ "$RELEASE_ACTOR" != "$EXPECTED_RELEASE_ACTOR" ] || [ "$RELEASE_ACTOR_ID" != "$EXPECTED_RELEASE_ACTOR_ID" ]; then
            echo "::error::release tag ${TAG} was pushed by ${RELEASE_ACTOR} (${RELEASE_ACTOR_ID}), not the peasant-labs-releaser App. Use the release batch to tag a fresh queued release."
            exit 1
          fi

      - name: Checkout repository (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Parse + classify the tag
        id: parse
        run: go run github.com/peasant-labs/schema/cmd/release-guard parse-tag "$TAG"

  verify-tag:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check out release-intent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peasant-labs/infra
          ref: 7d2a604afe5b50a3dcc20df06f02e85c2a0d4027
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Verify the tag is on the default branch
        run: '"${RUNNER_TEMP}/release-intent" verify-tag --tag "${GITHUB_REF_NAME}" --branch "origin/${DEFAULT_BRANCH}"'

  nix-vendor-hash:
    name: assert nix vendorHash current
    needs: guard
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Check Nix vendor hash freshness
        run: |
          set -euo pipefail
          make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale on ${GITHUB_REF_NAME}. Create the release tag from a commit that has run make nix-vendor-hash."
            git diff -- flake.nix
            exit 1
          fi

  e2e:
    name: full-stack e2e
    needs: [guard, nix-vendor-hash]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  release-e2e:
    name: release e2e (installed packages)
    needs: [guard, nix-vendor-hash]
    permissions:
      contents: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    uses: ./.github/workflows/release-e2e.yml

  # Build without a write token. The publish job receives only the built files.
  build:
    name: build release artifacts
    needs: [determine-runner, guard, verify-tag, nix-vendor-hash, e2e, release-e2e]
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The release body. The staging steps keep it beside dist/assets, never
      # inside it, and the publisher reads it as dist/release-notes.md.
      RELEASE_NOTES: release-notes.md
    steps:
      - name: Checkout repository (full history for changelog)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - name: Set up Node (for the embedded web dashboard build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build real web dashboard
        run: make web

      - name: Assert real dashboard artifact
        run: |
          set -euo pipefail
          test -s web/out/index.html || { echo "::error::web/out/index.html is missing or empty"; exit 1; }
          if grep -qF "is not bundled in this build" web/out/index.html; then
            echo "::error::release artifact contains the web-stub dashboard"
            exit 1
          fi

      - name: Install patched GoReleaser v2.17.1
        run: |
          scripts/install-goreleaser "$RUNNER_TEMP/goreleaser-bin"
          echo "$RUNNER_TEMP/goreleaser-bin" >> "$GITHUB_PATH"
      - name: Run goreleaser
        env:
          TAG: ${{ github.ref_name }}
          AUR_KEY: "publisher-disabled"
        run: |
          set -euo pipefail
          PEASANT_RELEASE_HEADER="$(go run ./scripts/release-header -tag "$TAG")"
          export PEASANT_RELEASE_HEADER
          "$RUNNER_TEMP/goreleaser-bin/goreleaser" release --clean --skip=publish
          printf '%s\n' "$PEASANT_RELEASE_HEADER" > "dist/${RELEASE_NOTES}"

      - name: Stage the bare Windows binary at its checksum name
        run: |
          set -euo pipefail
          # `goreleaser release --skip=publish` leaves the bare Windows binary
          # in its build subdirectory, but the checksums and release assets name
          # it `peasant_<version>_windows_amd64.exe` at the dist root. The
          # publisher would normally copy it there; stage it so the checksum
          # verification and the release-dist artifact both see it.
          exe_name="$(awk '$2 ~ /_windows_amd64\.exe$/ {print $2; exit}' dist/checksums.txt)"
          test -n "${exe_name}"
          exe_src="$(find dist -type f -name '*.exe' ! -path "dist/${exe_name}" -print -quit)"
          test -n "${exe_src}"
          cp "${exe_src}" "dist/${exe_name}"
          ls -l "dist/${exe_name}"

      - name: Verify release checksums
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)

      # gh release create refuses a directory, so the publisher's one asset
      # glob must match only files. GoReleaser's dist holds per-target build
      # directories, so its top-level files are copied into dist/assets and
      # the rest is moved out of the artifact. The notes sit beside the
      # assets, not inside them, so they are the release body and not an
      # asset.
      - name: Stage the release assets in one flat directory
        run: |
          set -euo pipefail
          goreleaser_out="$(mktemp -d "$RUNNER_TEMP/goreleaser-dist.XXXXXX")"
          mv dist "${goreleaser_out}/dist"
          mkdir -p dist/assets
          mv "${goreleaser_out}/dist/${RELEASE_NOTES}" "dist/${RELEASE_NOTES}"
          find "${goreleaser_out}/dist" -mindepth 1 -maxdepth 1 -type f -exec cp -- {} dist/assets/ \;

      # The published asset set is exact: every file checksums.txt names,
      # checksums.txt itself, and GoReleaser's four metadata files, and
      # nothing else. A new or missing file fails here, before any release
      # exists, instead of publishing a release the install docs do not
      # describe.
      - name: Verify the staged release assets
        run: |
          set -euo pipefail
          test -s "dist/${RELEASE_NOTES}" || { echo "::error::dist/${RELEASE_NOTES} is missing or empty"; exit 1; }
          stray="$(find dist/assets -mindepth 1 ! -type f -print -quit)"
          if [ -n "${stray}" ]; then
            echo "::error::dist/assets must hold only regular files; found ${stray}"
            exit 1
          fi
          test -s dist/assets/checksums.txt || { echo "::error::dist/assets/checksums.txt is missing or empty"; exit 1; }
          expected="$( { awk '{print $2}' dist/assets/checksums.txt; echo checksums.txt; printf '%s\n' CHANGELOG.md artifacts.json config.yaml metadata.json; } | LC_ALL=C sort)"
          staged="$(find dist/assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [ "${staged}" != "${expected}" ]; then
            echo "::error::dist/assets does not hold exactly the checksummed files, checksums.txt and the GoReleaser metadata. If GoReleaser's output changed on purpose, update the expected metadata list in BOTH this step of .github/workflows/release.yml and internal/e2e/testdata/workflows/release_publish_contract.yaml."
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${staged}") || true
            exit 1
          fi
          (cd dist/assets && sha256sum --check checksums.txt)
          ls -l dist dist/assets

      - name: Hand release artifacts to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub Release
    needs: [guard, verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dist
          path: dist
      # Any view failure, including a network or authentication error, is
      # treated as no release; the list check below then fails closed.
      - name: Look for an existing release
        id: view
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      # A rerun after a published release succeeds only when that release is
      # complete. \u0024 prints a dollar sign in the jq message without a jq
      # variable. A leftover draft is deleted by its id: gh release delete
      # resolves a tag that has several drafts to the oldest one.
      - name: Verify the existing release is complete
        if: steps.view.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'if (.isDraft | type) != "boolean" then error("release draft status is invalid; inspect the release before retrying") elif .isDraft then error("release is an unpublished draft; list the drafts for this tag with gh api repos/\u0024GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/\u0024GITHUB_REPOSITORY/releases/<id> (never gh release delete \u0024TAG), then rerun; do not create a new tag") elif (.assets | type) != "array" then error("published release assets are invalid; inspect the release before retrying") elif (.assets | length == 0) then error("published release has no assets; tags are never moved, so fix forward with a new tag") else "existing release is published and has assets" end'

      # A failed view may be a rate limit, a 5xx or an authentication error
      # rather than an absent release, and GitHub keeps several drafts for one
      # tag. gh lists drafts too, so this fails when any release or leftover
      # draft names the tag, and it fails closed on any API error, stopping
      # the run before anything is created.
      - name: Refuse an existing release for the tag
        id: list
        if: steps.view.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '[.[] | select(.tagName == env.TAG)] | if length > 0 then error("a release or draft already exists for this tag, so nothing was created; list the drafts with gh api repos/\u0024GITHUB_REPOSITORY/releases, delete stale drafts by id with gh api -X DELETE repos/\u0024GITHUB_REPOSITORY/releases/<id> (never gh release delete \u0024TAG), then rerun; no new tag is needed") else "no release or draft exists for this tag" end'

      # One command creates the draft and uploads every asset to that same
      # release. A separate uploader finds its release by tag and can create
      # a second release, which is how other releases were published empty.
      - name: Create the draft release with its assets
        id: create
        if: steps.view.outcome == 'failure' && steps.list.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file dist/release-notes.md --prerelease="$PRERELEASE" 'dist/assets/*'

      - name: Verify the draft before publishing
        if: steps.view.outcome == 'failure' && steps.create.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'if .isDraft != true or (.assets | type) != "array" or (.assets | length) == 0 then error("the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/\u0024GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/\u0024GITHUB_REPOSITORY/releases/<id> (never gh release delete \u0024TAG), then rerun; no new tag is needed") else "draft holds \(.assets | length) assets" end'

      - name: Publish the release
        if: steps.view.outcome == 'failure' && steps.create.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"

      # Peasant releases are not immutable, so this checks only that the
      # release left draft and still holds its assets.
      - name: Verify the published release
        if: steps.view.outcome == 'failure' && steps.create.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'if .isDraft != false or (.assets | type) != "array" or (.assets | length) == 0 then error("the release did not publish with its assets; inspect it with gh release view \u0024TAG, and fix forward with a new tag rather than moving this one") else "release is published and holds \(.assets | length) assets" end'

  # Post-publish smoke: download the released linux archives on NATIVE runners
  # (no QEMU) and assert the binary is static and reports the tag version.
  smoke:
    name: smoke (${{ matrix.arch }})
    needs: [determine-runner, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: blacksmith-2vcpu-ubuntu-2404
            arch: amd64
          - runs-on: blacksmith-2vcpu-ubuntu-2404-arm
            arch: arm64
    # Only the amd64 entry routes to the pool; the arm64 entry keeps its arm64
    # runner so the native arm64 archive still installs on arm64.
    runs-on: ${{ matrix.arch == 'amd64' && fromJson(needs.determine-runner.outputs.runner) || matrix.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The pool's runners keep their workspace between jobs, so this job never
      # downloads into the (reused) repository workspace: a fresh directory per
      # run keeps a same-version rerun and an older-version archive from making
      # `gh release download` or the archive glob ambiguous.
      - name: Stage a clean download directory
        run: |
          set -euo pipefail
          staging="$(mktemp -d "$RUNNER_TEMP/release-smoke.XXXXXX")"
          echo "SMOKE_DIR=$staging" >> "$GITHUB_ENV"

      - name: Download the released archive
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -euxo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "peasant_*_linux_${ARCH}.tar.gz" \
            --dir .
          tar xzf peasant_*_linux_"${ARCH}".tar.gz

      - name: Assert the binary is statically linked
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -uo pipefail
          # Capture both probes before judging: `ldd` exits non-zero for a
          # static binary (which `pipefail` would turn into a false failure),
          # and some pool runners have no `file` (which must not fail the
          # assertion while `ldd` already proved the binary static).
          ldd_output="$(ldd ./peasant 2>&1 || true)"
          file_output="$(file ./peasant 2>/dev/null || true)"
          case "$ldd_output" in
            *"not a dynamic executable"*)
              echo "static OK (ldd: not a dynamic executable)"
              exit 0
              ;;
          esac
          case "$file_output" in
            *"statically linked"*)
              echo "static OK (file: statically linked)"
              exit 0
              ;;
          esac
          echo "::error::peasant is not statically linked (CGO_ENABLED=0 expected)"
          printf 'ldd: %s\nfile: %s\n' "${ldd_output:-<no output>}" "${file_output:-<no output>}"
          exit 1

      - name: Assert version matches the tag
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          got="$(./peasant version)"
          echo "peasant version output: '${got}' (must contain '${expected}')"
          if ! printf '%s' "$got" | grep -qF "$expected"; then
            echo "::error::peasant version '${got}' does not match tag '${TAG}'"
            exit 1
          fi

  # Post-publish Windows smoke. The native Windows build publishes TWO assets
  # from one archive template: the zip (the documented install path) and the bare
  # .exe (the direct download, and what `peasant upgrade` replaces in place).
  # Both are exercised, because a release that publishes one but not the other
  # silently breaks a documented install route.
  #
  # There is no `ldd` here to repeat the Linux job's static-linking assertion.
  # What stands in for it is the runner: windows-latest carries no Go toolchain
  # and no MinGW runtime, so a CGO_ENABLED=0 binary that starts and serves has no
  # non-system DLL dependency. That is weaker than `ldd`, which is part of why
  # this job also starts the dashboard rather than only reading `version`.
  #
  # Windows arm64 is deliberately unpublished (.goreleaser.yml ignores it), so
  # there is no arch matrix.
  windows-smoke:
    name: windows smoke (amd64)
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      # A fresh directory per run keeps a same-version rerun and an older
      # version's assets from making the download or the globs ambiguous.
      - name: Stage a clean download directory
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP ('release-smoke-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          "SMOKE_DIR=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PEASANT_VERSION=$($env:TAG -replace '^v', '')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the published Windows assets
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PEASANT_VERSION
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY `
            --pattern "peasant_${version}_windows_amd64.zip" `
            --pattern "peasant_${version}_windows_amd64.exe" `
            --pattern "checksums.txt" `
            --dir .
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          Get-ChildItem | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      # The install docs tell Windows users to verify against checksums.txt, so a
      # published asset the file does not name is a broken documented install.
      - name: Verify both assets against checksums.txt
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $published = @{}
          foreach ($line in Get-Content checksums.txt) {
            $fields = ($line -split '\s+') | Where-Object { $_ -ne '' }
            if ($fields.Count -ge 2) { $published[$fields[-1]] = $fields[0].ToLower() }
          }
          $assets = @(
            "peasant_$($env:PEASANT_VERSION)_windows_amd64.zip",
            "peasant_$($env:PEASANT_VERSION)_windows_amd64.exe"
          )
          foreach ($asset in $assets) {
            if (-not $published.ContainsKey($asset)) {
              throw "checksums.txt does not name $asset; the release published no checksum for a documented install asset"
            }
            $got = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
            if ($got -ne $published[$asset]) {
              throw "$asset sha256 $got does not match the published $($published[$asset])"
            }
            Write-Host "checksum OK: $asset"
          }

      # LICENSE and THIRD_PARTY_NOTICES are required for binary redistribution,
      # so a zip missing them is a licensing failure rather than a cosmetic one.
      - name: Assert the zip carries the documented payload
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "peasant_$($env:PEASANT_VERSION)_windows_amd64.zip" -DestinationPath zip -Force
          $names = @(Get-ChildItem zip -Recurse -File | ForEach-Object { $_.Name })
          foreach ($required in @('peasant.exe', 'LICENSE', 'README.md', 'THIRD_PARTY_NOTICES')) {
            if ($names -notcontains $required) {
              throw "the zip is missing $required; it contains: $($names -join ', ')"
            }
          }
          Write-Host "zip payload OK: $($names -join ', ')"

      - name: Assert both binaries report the tag version
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "peasant_$($env:PEASANT_VERSION)_windows_amd64.exe" bare-peasant.exe
          foreach ($exe in @('.\zip\peasant.exe', '.\bare-peasant.exe')) {
            $got = (& $exe version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$exe version exited $LASTEXITCODE" }
            if ($got -notlike "*$($env:PEASANT_VERSION)*") {
              throw "$exe version '$got' does not contain '$($env:PEASANT_VERSION)'"
            }
            Write-Host "version OK: $exe -> $got"
          }

      # `peasant version` writes nothing and starts no process, so it passes
      # while Windows-specific code is broken: every config write was once
      # defeated by a POSIX directory fsync, and the detached `web start` spawn
      # and its PID file are Windows-only code paths. Starting the dashboard
      # exercises those and proves the published binary embeds the real web app
      # rather than the not-bundled notice a stub build serves.
      - name: Start the dashboard, probe it, and stop it
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 8791
          & .\zip\peasant.exe web start --no-browser --port $port
          if ($LASTEXITCODE -ne 0) { throw "web start exited $LASTEXITCODE" }
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $body = $null
            while ((Get-Date) -lt $deadline) {
              try {
                $body = (Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5).Content
                break
              } catch {
                Start-Sleep -Seconds 3
              }
            }
            if (-not $body) { throw "the dashboard never answered on http://127.0.0.1:$port/" }
            if ($body -match 'is not bundled in this build') {
              throw "the published binary serves the stub dashboard instead of the built web app"
            }
            Write-Host "dashboard OK ($($body.Length) bytes served)"
          } finally {
            & .\zip\peasant.exe web stop --port $port
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::web stop exited $LASTEXITCODE" }
          }

  # Post-publish macOS smoke: on final tags, install the cask users get, rendered
  # here from the tap's own template and this release's checksums. The tap's
  # scheduled publisher is best-effort and peasant holds no tap credential, so
  # this job never waits on it. The tap's publisher renders and audits the cask
  # before it pushes; this smoke does not check that the tap has published, so a
  # stale tap shows only as a failed or missing publish-cask run in the tap. The
  # checkout tracks the tap's main unpinned on purpose, so the smoke renders with
  # the template the tap publishes from.
  macos-cask-smoke:
    name: macos cask smoke (final only)
    needs: publish
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tap (read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: peasant-labs/homebrew-tap
          path: homebrew-tap
          persist-credentials: false

      - name: Render the cask from the tap template and this release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --dir "${RUNNER_TEMP}/release" --clobber
          # render-cask.sh needs bash 4 (mapfile); macOS ships bash 3.2. The
          # script is fail-closed: a missing archive digest or a surviving
          # placeholder exits non-zero before anything is installed.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          "$(brew --prefix bash)/bin/bash" homebrew-tap/scripts/render-cask.sh \
            "${TAG#v}" \
            "${RUNNER_TEMP}/release/checksums.txt" \
            homebrew-tap/templates/peasant.rb.tmpl \
            "${RUNNER_TEMP}/peasant.rb"
          grep -F "version \"${TAG#v}\"" "${RUNNER_TEMP}/peasant.rb"

      - name: Install the rendered cask from a throwaway tap
        run: |
          set -euxo pipefail
          tap="peasant-labs/cask-smoke"
          brew tap-new "$tap"
          tap_dir="$(brew --repository "$tap")"
          mkdir -p "$tap_dir/Casks"
          cp "${RUNNER_TEMP}/peasant.rb" "$tap_dir/Casks/peasant.rb"
          brew trust --cask "$tap/peasant"
          # Fully-qualified token so this never resolves a same-named cask from
          # another tap.
          brew install --cask "$tap/peasant"

      - name: Assert version matches the tag
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          got="$(peasant version)"
          echo "peasant version output: '${got}' (must contain '${expected}')"
          if ! printf '%s' "$got" | grep -qF "$expected"; then
            echo "::error::peasant version '${got}' does not match tag '${TAG}'"
            exit 1
          fi

  # On the rc path only, also run the full packaging-validation matrix
  # (deb/rpm/makepkg/brew/nix/macos) against a snapshot build. This is the darwin
  # + distro coverage the linux-only `smoke` job deliberately omits; it does NOT
  # re-run the linux ldd/version smoke, which remains a separate focused gate.
  validate-packaging:
    name: validate packaging (rc)
    needs: guard
    if: contains(github.ref_name, '-rc')
    permissions:
      contents: read
      pull-requests: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    uses: ./.github/workflows/release-validate.yml
