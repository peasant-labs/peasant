name: Release

# Tag-triggered binary release pipeline. The tag is pushed by release-pr.yml's
# App token (the default GITHUB_TOKEN cannot push a tag that re-triggers a
# workflow), so this runs automatically when a release PR merges.
#
# The `v*` filter matches Peasant release tags (v0.1.0, v0.1.0-rc1).
# release-guard parse-tag is the defense-in-depth re-check inside the guard job.
on:
  # Instantiate the complete caller/reusable-workflow graph on relevant PRs so
  # GitHub validates permission propagation before an immutable tag exists. The
  # guard job is push-only, so every production job skips after static validation.
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/release-e2e.yml"
      - ".github/workflows/release-validate.yml"
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Route the x86_64 release and smoke jobs to the self-hosted container pool
  # (rootless podman on the desktop; labels self-hosted/container), with a
  # Blacksmith amd64 fallback when no pool runner is online. Routing comes from
  # the shared runner-router reusable workflow. `guard`, `nix-vendor-hash`, the
  # arm64 `smoke` entry, and `macos-cask-smoke` keep their current runners.
  determine-runner:
    # The caller must grant at least what the called router workflow declares
    # (contents: read); this workflow's top-level permissions are empty, so the
    # grant is explicit here.
    permissions:
      contents: read
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@runner-router-v1
    with:
      fallback: '["blacksmith-4vcpu-ubuntu-2404"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # Gate the build: reject tags not created by the release App and tags outside
  # the Peasant release grammar. Final releases no longer require a prior rc.
  guard:
    name: guard
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Verify release tag actor
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_RELEASE_ACTOR: peasant-labs-releaser[bot]
          EXPECTED_RELEASE_ACTOR_ID: "291504229"
        run: |
          if [ "$RELEASE_ACTOR" != "$EXPECTED_RELEASE_ACTOR" ] || [ "$RELEASE_ACTOR_ID" != "$EXPECTED_RELEASE_ACTOR_ID" ]; then
            echo "::error::release tag ${TAG} was pushed by ${RELEASE_ACTOR} (${RELEASE_ACTOR_ID}), not the peasant-labs-releaser App. Create releases only by merging a protected release PR."
            exit 1
          fi

      - name: Checkout repository (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Parse + classify the tag
        id: parse
        run: go run github.com/peasant-labs/schema/cmd/release-guard parse-tag "$TAG"

  nix-vendor-hash:
    name: assert nix vendorHash current
    needs: guard
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Check Nix vendor hash freshness
        run: |
          set -euo pipefail
          make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale on ${GITHUB_REF_NAME}. Create the release tag from a commit that has run make nix-vendor-hash."
            git diff -- flake.nix
            exit 1
          fi

  e2e:
    name: full-stack e2e
    needs: [guard, nix-vendor-hash]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  release-e2e:
    name: release e2e (installed packages)
    needs: [guard, nix-vendor-hash]
    permissions:
      contents: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets: inherit
    uses: ./.github/workflows/release-e2e.yml

  # Build + publish: one Linux runner cross-compiles all four targets (pure-Go,
  # CGO_ENABLED=0), then goreleaser produces archives + checksums + deb/rpm and
  # creates the GitHub (pre)release. The Homebrew cask push is skip_upload:"auto"
  # (final tags only, never rc); the AUR push stays skip_upload:"true" (no-op).
  release:
    name: release (goreleaser)
    needs: [determine-runner, guard, nix-vendor-hash, e2e, release-e2e]
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Checkout repository (full history for changelog)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - name: Set up Node (for the embedded web dashboard build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build real web dashboard
        run: make web

      - name: Assert real dashboard artifact
        run: |
          set -euo pipefail
          test -s web/out/index.html || { echo "::error::web/out/index.html is missing or empty"; exit 1; }
          if grep -qF "is not bundled in this build" web/out/index.html; then
            echo "::error::release artifact contains the web-stub dashboard"
            exit 1
          fi

      - name: Mint App token for Homebrew tap
        id: tap_tok
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PEASANT_RELEASER_APP_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: homebrew-tap

      - name: Install patched GoReleaser v2.17.1
        run: |
          scripts/install-goreleaser "$RUNNER_TEMP/goreleaser-bin"
          echo "$RUNNER_TEMP/goreleaser-bin" >> "$GITHUB_PATH"
      - name: Run goreleaser
        run: |
          "$RUNNER_TEMP/goreleaser-bin/goreleaser" release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # AUR_KEY is a placeholder: the AUR push stays skip_upload:"true", so it
          # is never used until AUR publishing is separately approved. The tap
          # token IS used — the Homebrew cask push is skip_upload:"auto" and writes
          # to the tap on final tags — and is minted from the GitHub App above.
          AUR_KEY: ${{ secrets.AUR_KEY || 'unset-publisher-disabled' }}
          TAP_GITHUB_TOKEN: ${{ steps.tap_tok.outputs.token }}

  # Post-publish smoke: download the released linux archives on NATIVE runners
  # (no QEMU) and assert the binary is static and reports the tag version.
  smoke:
    name: smoke (${{ matrix.arch }})
    needs: [determine-runner, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: blacksmith-2vcpu-ubuntu-2404
            arch: amd64
          - runs-on: blacksmith-2vcpu-ubuntu-2404-arm
            arch: arm64
    # Only the amd64 entry routes to the pool; the arm64 entry keeps its arm64
    # runner so the native arm64 archive still installs on arm64.
    runs-on: ${{ matrix.arch == 'amd64' && fromJson(needs.determine-runner.outputs.runner) || matrix.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The pool's runners keep their workspace between jobs, so this job never
      # downloads into the (reused) repository workspace: a fresh directory per
      # run keeps a same-version rerun and an older-version archive from making
      # `gh release download` or the archive glob ambiguous.
      - name: Stage a clean download directory
        run: |
          set -euo pipefail
          staging="$(mktemp -d "$RUNNER_TEMP/release-smoke.XXXXXX")"
          echo "SMOKE_DIR=$staging" >> "$GITHUB_ENV"

      - name: Download the released archive
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -euxo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "peasant_*_linux_${ARCH}.tar.gz" \
            --dir .
          tar xzf peasant_*_linux_"${ARCH}".tar.gz

      - name: Assert the binary is statically linked
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -uo pipefail
          # Capture both probes before judging: `ldd` exits non-zero for a
          # static binary (which `pipefail` would turn into a false failure),
          # and some pool runners have no `file` (which must not fail the
          # assertion while `ldd` already proved the binary static).
          ldd_output="$(ldd ./peasant 2>&1 || true)"
          file_output="$(file ./peasant 2>/dev/null || true)"
          case "$ldd_output" in
            *"not a dynamic executable"*)
              echo "static OK (ldd: not a dynamic executable)"
              exit 0
              ;;
          esac
          case "$file_output" in
            *"statically linked"*)
              echo "static OK (file: statically linked)"
              exit 0
              ;;
          esac
          echo "::error::peasant is not statically linked (CGO_ENABLED=0 expected)"
          printf 'ldd: %s\nfile: %s\n' "${ldd_output:-<no output>}" "${file_output:-<no output>}"
          exit 1

      - name: Assert version matches the tag
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          got="$(./peasant version)"
          echo "peasant version output: '${got}' (must contain '${expected}')"
          if ! printf '%s' "$got" | grep -qF "$expected"; then
            echo "::error::peasant version '${got}' does not match tag '${TAG}'"
            exit 1
          fi

  # Post-publish Windows smoke. The native Windows build publishes TWO assets
  # from one archive template: the zip (the documented install path) and the bare
  # .exe (the direct download, and what `peasant upgrade` replaces in place).
  # Both are exercised, because a release that publishes one but not the other
  # silently breaks a documented install route.
  #
  # There is no `ldd` here to repeat the Linux job's static-linking assertion.
  # What stands in for it is the runner: windows-latest carries no Go toolchain
  # and no MinGW runtime, so a CGO_ENABLED=0 binary that starts and serves has no
  # non-system DLL dependency. That is weaker than `ldd`, which is part of why
  # this job also starts the dashboard rather than only reading `version`.
  #
  # Windows arm64 is deliberately unpublished (.goreleaser.yml ignores it), so
  # there is no arch matrix.
  windows-smoke:
    name: windows smoke (amd64)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      # A fresh directory per run keeps a same-version rerun and an older
      # version's assets from making the download or the globs ambiguous.
      - name: Stage a clean download directory
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP ('release-smoke-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          "SMOKE_DIR=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PEASANT_VERSION=$($env:TAG -replace '^v', '')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the published Windows assets
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PEASANT_VERSION
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY `
            --pattern "peasant_${version}_windows_amd64.zip" `
            --pattern "peasant_${version}_windows_amd64.exe" `
            --pattern "checksums.txt" `
            --dir .
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          Get-ChildItem | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      # The install docs tell Windows users to verify against checksums.txt, so a
      # published asset the file does not name is a broken documented install.
      - name: Verify both assets against checksums.txt
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $published = @{}
          foreach ($line in Get-Content checksums.txt) {
            $fields = ($line -split '\s+') | Where-Object { $_ -ne '' }
            if ($fields.Count -ge 2) { $published[$fields[-1]] = $fields[0].ToLower() }
          }
          $assets = @(
            "peasant_$($env:PEASANT_VERSION)_windows_amd64.zip",
            "peasant_$($env:PEASANT_VERSION)_windows_amd64.exe"
          )
          foreach ($asset in $assets) {
            if (-not $published.ContainsKey($asset)) {
              throw "checksums.txt does not name $asset; the release published no checksum for a documented install asset"
            }
            $got = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
            if ($got -ne $published[$asset]) {
              throw "$asset sha256 $got does not match the published $($published[$asset])"
            }
            Write-Host "checksum OK: $asset"
          }

      # LICENSE and THIRD_PARTY_NOTICES are required for binary redistribution,
      # so a zip missing them is a licensing failure rather than a cosmetic one.
      - name: Assert the zip carries the documented payload
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "peasant_$($env:PEASANT_VERSION)_windows_amd64.zip" -DestinationPath zip -Force
          $names = @(Get-ChildItem zip -Recurse -File | ForEach-Object { $_.Name })
          foreach ($required in @('peasant.exe', 'LICENSE', 'README.md', 'THIRD_PARTY_NOTICES')) {
            if ($names -notcontains $required) {
              throw "the zip is missing $required; it contains: $($names -join ', ')"
            }
          }
          Write-Host "zip payload OK: $($names -join ', ')"

      - name: Assert both binaries report the tag version
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "peasant_$($env:PEASANT_VERSION)_windows_amd64.exe" bare-peasant.exe
          foreach ($exe in @('.\zip\peasant.exe', '.\bare-peasant.exe')) {
            $got = (& $exe version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$exe version exited $LASTEXITCODE" }
            if ($got -notlike "*$($env:PEASANT_VERSION)*") {
              throw "$exe version '$got' does not contain '$($env:PEASANT_VERSION)'"
            }
            Write-Host "version OK: $exe -> $got"
          }

      # `peasant version` writes nothing and starts no process, so it passes
      # while Windows-specific code is broken: every config write was once
      # defeated by a POSIX directory fsync, and the detached `web start` spawn
      # and its PID file are Windows-only code paths. Starting the dashboard
      # exercises those and proves the published binary embeds the real web app
      # rather than the stub the `web-stub` target writes.
      - name: Start the dashboard, probe it, and stop it
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 8791
          & .\zip\peasant.exe web start --no-browser --port $port
          if ($LASTEXITCODE -ne 0) { throw "web start exited $LASTEXITCODE" }
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $body = $null
            while ((Get-Date) -lt $deadline) {
              try {
                $body = (Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5).Content
                break
              } catch {
                Start-Sleep -Seconds 3
              }
            }
            if (-not $body) { throw "the dashboard never answered on http://127.0.0.1:$port/" }
            if ($body -match 'is not bundled in this build') {
              throw "the published binary serves the stub dashboard instead of the built web app"
            }
            Write-Host "dashboard OK ($($body.Length) bytes served)"
          } finally {
            & .\zip\peasant.exe web stop --port $port
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::web stop exited $LASTEXITCODE" }
          }

  # Post-publish macOS smoke: on FINAL tags only, install the just-published cask
  # from the live tap and assert it runs + reports the tag version. This exercises
  # the real tap push end-to-end — homebrew_casks skip_upload:"auto" writes the
  # cask to peasant-labs/homebrew-tap on finals (and never on rc), so this job is
  # gated to non-rc pushes. goreleaser commits the cask inside the `release` job
  # before it exits, so a fresh `brew tap` clone (needs: release) observes it.
  macos-cask-smoke:
    name: macos cask smoke (final only)
    needs: release
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tap + install the published cask
        run: |
          set -euxo pipefail
          brew tap peasant-labs/tap
          # Fully-qualified token so this never resolves a same-named cask from
          # another tap.
          brew install --cask peasant-labs/tap/peasant

      - name: Assert version matches the tag
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          got="$(peasant version)"
          echo "peasant version output: '${got}' (must contain '${expected}')"
          if ! printf '%s' "$got" | grep -qF "$expected"; then
            echo "::error::peasant version '${got}' does not match tag '${TAG}'"
            exit 1
          fi

  # On the rc path only, also run the full packaging-validation matrix
  # (deb/rpm/makepkg/brew/nix/macos) against a snapshot build. This is the darwin
  # + distro coverage the linux-only `smoke` job deliberately omits; it does NOT
  # re-run the linux ldd/version smoke, which remains a separate focused gate.
  validate-packaging:
    name: validate packaging (rc)
    needs: guard
    if: contains(github.ref_name, '-rc')
    permissions:
      contents: read
    # The called workflow's determine-runner job reads secrets.RUNNER_STATUS_TOKEN;
    # secrets do not cross a reusable-workflow call unless passed explicitly.
    secrets: inherit
    uses: ./.github/workflows/release-validate.yml
