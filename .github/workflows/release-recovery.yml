name: Recover v0.1.0 Release

# One-time recovery for the immutable v0.1.0 tag. Its original tag-triggered
# Release run failed during workflow startup, before GitHub created any jobs.
# This workflow is intentionally fixed to that tag, commit, incident, operator,
# the fixed failed preflight, one reviewed replacement, and a short expiry.
# Remove it after publication and native smoke both succeed.
on:
  workflow_dispatch:
    inputs:
      e2e_run_id:
        description: Exact first-attempt E2E run ID dispatched at v0.1.0
        required: true
        type: string
      release_e2e_run_id:
        description: Exact first-attempt Release E2E run ID dispatched at v0.1.0
        required: true
        type: string
      confirm_tag:
        description: Type v0.1.0 to confirm the immutable release tag
        required: true
        type: string
      confirm_commit:
        description: Type the full immutable release commit SHA
        required: true
        type: string
      confirm_recovery_commit:
        description: Type the full reviewed recovery commit SHA executing from develop
        required: true
        type: string

run-name: Recover immutable v0.1.0 Release

concurrency:
  group: release-refs/tags/v0.1.0
  cancel-in-progress: false

permissions: {}

env:
  TAG: v0.1.0
  TAG_REF: refs/tags/v0.1.0
  TAG_OBJECT_SHA: b1f8fe4b9a40ac32c1d7e1a8748cb11575595c4f
  TAG_COMMIT_SHA: 807a1b68c8ec1952db6c289f383f42cbb0701db9

jobs:
  preflight:
    name: verify immutable recovery evidence
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_REPOSITORY: ${{ github.repository }}
      RECOVERY_EVENT: ${{ github.event_name }}
      RECOVERY_REF: ${{ github.ref }}
      RECOVERY_RUN_ID: ${{ github.run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
      RECOVERY_ACTOR: ${{ github.actor }}
      RECOVERY_ACTOR_ID: ${{ github.actor_id }}
      RECOVERY_HEAD_SHA: ${{ github.sha }}
      E2E_RUN_ID: ${{ inputs.e2e_run_id }}
      RELEASE_E2E_RUN_ID: ${{ inputs.release_e2e_run_id }}
      CONFIRM_TAG: ${{ inputs.confirm_tag }}
      CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
      CONFIRM_RECOVERY_COMMIT: ${{ inputs.confirm_recovery_commit }}
    steps:
      - name: Checkout reviewed recovery verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/v0.1.0
          path: release-src
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: |
            orchestrator/go.sum
            release-src/go.sum

      - name: Verify GitHub recovery evidence
        working-directory: orchestrator
        run: go run ./cmd/release-recovery-verify preflight

      - name: Verify local immutable tag and protected-branch reachability
        working-directory: release-src
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$TAG_REF")" = tag || { echo "::error::$TAG is no longer an annotated tag"; exit 1; }
          test "$(git rev-parse "$TAG_REF")" = "$TAG_OBJECT_SHA" || { echo "::error::$TAG no longer points to the reviewed tag object"; exit 1; }
          test "$(git rev-parse "$TAG_REF^{commit}")" = "$TAG_COMMIT_SHA" || { echo "::error::$TAG no longer peels to the reviewed commit"; exit 1; }
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT_SHA" || { echo "::error::release-src is not checked out at the immutable tag commit"; exit 1; }
          if git ls-remote --exit-code --heads origin "refs/heads/$TAG" >/dev/null 2>&1; then
            echo "::error::a branch named $TAG makes workflow run evidence ambiguous"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
          git merge-base --is-ancestor "$TAG_COMMIT_SHA" refs/remotes/origin/develop || { echo "::error::$TAG_COMMIT_SHA is no longer reachable from protected develop"; exit 1; }

      - name: Re-run tagged release guards
        working-directory: release-src
        run: |
          set -euo pipefail
          go run github.com/peasant-labs/schema/cmd/release-guard parse-tag "$TAG"
          go run github.com/peasant-labs/schema/cmd/release-guard check-final --tag "$TAG" --initial-final v0.1.0

      - name: Verify tagged external publishers remain disabled
        working-directory: orchestrator
        run: go run ./cmd/release-recovery-verify publishers-disabled "$GITHUB_WORKSPACE/release-src/.goreleaser.yml"

  nix-vendor-hash:
    name: assert immutable Nix vendorHash current
    needs: preflight
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/v0.1.0
          path: release-src
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Check immutable Nix vendor hash freshness
        working-directory: release-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT_SHA" || { echo "::error::Nix source is not the immutable release commit"; exit 1; }
          make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale on immutable $TAG; do not alter or recreate the tag"
            git diff -- flake.nix
            exit 1
          fi

  release:
    name: publish immutable release (goreleaser)
    needs: [preflight, nix-vendor-hash]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout reviewed recovery verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/v0.1.0
          path: release-src
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: release-src/go.mod
          cache-dependency-path: |
            orchestrator/go.sum
            release-src/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: release-src/web/package.json

      - name: Set up Node for the immutable web dashboard
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-src/web/pnpm-lock.yaml

      - name: Verify immutable source and disabled external publishers
        working-directory: orchestrator
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/release-src" rev-parse HEAD)" = "$TAG_COMMIT_SHA" || { echo "::error::publication source is not the immutable release commit"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/release-src" cat-file -t "$TAG_REF")" = tag || { echo "::error::$TAG is no longer an annotated tag in publication source"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/release-src" rev-parse "$TAG_REF")" = "$TAG_OBJECT_SHA" || { echo "::error::publication source does not contain the reviewed tag object"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/release-src" rev-parse "$TAG_REF^{commit}")" = "$TAG_COMMIT_SHA" || { echo "::error::publication source tag does not peel to the reviewed commit"; exit 1; }
          go run ./cmd/release-recovery-verify publishers-disabled "$GITHUB_WORKSPACE/release-src/.goreleaser.yml"

      - name: Build real web dashboard from immutable source
        working-directory: release-src
        run: make web

      - name: Assert real dashboard artifact
        working-directory: release-src
        run: |
          set -euo pipefail
          test -s web/out/index.html || { echo "::error::web/out/index.html is missing or empty"; exit 1; }
          if grep -qF "is not bundled in this build" web/out/index.html; then
            echo "::error::release artifact contains the web-stub dashboard"
            exit 1
          fi

      - name: Install patched GoReleaser v2.17.1
        run: |
          release-src/scripts/install-goreleaser "$RUNNER_TEMP/goreleaser-bin"
          echo "$RUNNER_TEMP/goreleaser-bin" >> "$GITHUB_PATH"

      - name: Authoritatively re-check immutable tag and release absence
        working-directory: orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_HEAD_SHA: ${{ github.sha }}
        run: go run ./cmd/release-recovery-verify pre-publish

      - name: Publish immutable GitHub Release
        working-directory: release-src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: v0.1.0
          AUR_KEY: unset-publisher-disabled
          TAP_GITHUB_TOKEN: unset-publisher-disabled
        run: |
          "$RUNNER_TEMP/goreleaser-bin/goreleaser" release --clean

  smoke:
    name: smoke immutable release (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: blacksmith-2vcpu-ubuntu-2404
            arch: amd64
          - runs-on: blacksmith-2vcpu-ubuntu-2404-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: v0.1.0
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download the released archive
        run: |
          set -euxo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "peasant_*_linux_${ARCH}.tar.gz" \
            --dir .
          tar xzf peasant_*_linux_"${ARCH}".tar.gz

      - name: Assert the binary is statically linked
        run: |
          set -uo pipefail
          if ldd ./peasant 2>&1 | grep -q "not a dynamic executable"; then
            echo "static OK (ldd: not a dynamic executable)"
          elif file ./peasant | grep -q "statically linked"; then
            echo "static OK (file: statically linked)"
          else
            echo "::error::peasant is not statically linked (CGO_ENABLED=0 expected)"
            ldd ./peasant || true
            file ./peasant
            exit 1
          fi

      - name: Assert version matches the immutable tag
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          got="$(./peasant version)"
          echo "peasant version output: '${got}' (must contain '${expected}')"
          if ! printf '%s' "$got" | grep -qF "$expected"; then
            echo "::error::peasant version '${got}' does not match tag '${TAG}'"
            exit 1
          fi
