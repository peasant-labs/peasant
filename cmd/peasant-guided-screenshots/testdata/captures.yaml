pushStates:
  - key: start
    wantContains: ["push to village", "session(s) are ready to push", "yes"]
  - key: selection
    wantContains: ["selected", "withheld by a branch conflict", "tab", "project: peasant", "sessions: 1"]
  - key: session-preview
    wantContains: ["push-current-0001", "<ANTHROPIC_KEY>", "peasant publishes the redacted form"]
  - key: consent
    wantContains: ["metadata", "known patterns", "before it publishes them to the village"]
  - key: receipt
    wantContains: ["to the village.", "nothing is removed from this machine.", "sessions in this push"]

push:
  sessions:
    - sessionId: push-current-0001
      harness: claude-code
      project: peasant
      startMs: 1700000000000
      redaction: current
    - sessionId: push-stale-0002
      harness: opencode
      project: village
      startMs: 1700001000000
      redaction: stale
    - sessionId: push-raw-0003
      harness: claude-code
      project: schema
      startMs: 1700002000000
      redaction: raw
      withheld: true
  transcripts:
    push-current-0001:
      - {role: user, entryType: text, content: "ship the release with sk-ant-api03-abcdefghijklmnopqrstuvwxyz0123456789"}
      - {role: assistant, entryType: text, content: "peasant publishes the redacted form of this turn"}
    push-stale-0002:
      - {role: user, entryType: text, content: "check the village accepted the last publish"}

