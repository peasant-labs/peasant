requiredPushSessionNames:
  - push-current-0001
  - push-stale-0002
  - push-raw-0003

sheets:
  - name: guided-dark
    kind: guided
    title: "final guided sections: dark theme"
    theme: dark
    viewport: {width: 1800, height: 3420}
  - name: guided-light
    kind: guided
    title: "final guided sections: light theme"
    theme: light
    viewport: {width: 1800, height: 3420}
  - name: selection
    kind: selection
    title: "mounted selection: linked submodule project, branch, and session previews"
    theme: dark
    viewport: {width: 1800, height: 6750}
  - name: push
    kind: push
    title: "mounted push wizard: start, selection, published-transcript preview, consent, and receipt in both themes"
    theme: dark
    viewport: {width: 1800, height: 6000}
  - name: ingest-progress
    kind: ingest-progress
    title: "mounted kickstart local import progress after save"
    theme: dark
    viewport: {width: 1800, height: 1200}

guidedSections:
  - key: auto-ingest
    wantContains: [auto-ingest new branches in fully-selected projects, "[on]"]
  - key: publication
    wantContains: [publication preference, keep local]
  - key: privacy
    wantContains: [redaction level, "- before:", "+ after:"]
  - key: license
    wantContains: [default license attached to pushed transcripts, none]
  - key: destination
    wantContains: [default visibility for pushed transcripts, private]
  - key: retention
    wantContains: [how long claude code keeps its transcripts, 30 days]

selectionStates:
  - key: default
    query: ""
    wantContains: ["search:", harness, claude code, cursor]
  - key: search
    query: cursor
    wantContains: ["search: cursor", harness, "cursor se"]
  - key: project-preview
    query: ""
    wantContains: ["project: github.com:acme/tool", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  - key: branch-preview
    query: ""
    wantContains: ["project: github.com:acme/tool", "branch: main", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  # The row title is a PREFIX marker: with the child-session count moved to its
  # own line, the parent row carries its tracked chip again, so a narrow split
  # pane clips the title where it previously had room for all of it.
  - key: session-preview
    query: ""
    wantContains: ["parent se", "harness: claude code", scrubbed-body]
  - key: harness-source-preview
    query: ""
    wantContains: ["harness: claude code", scrubbed-source-body, read in place]
  - key: origin-hidden
    query: ""
    # Every marker here is a PREFIX, because the narrower capture splits its
    # width between the tree and the preview pane and clips both the row title
    # and the count line. The kit's own rendered-screen goldens pin the full
    # text and the exact indentation at each width; these markers pin that the
    # right things reach the mounted screen.
    #
    # The child-session count is asserted at EVERY width. It renders on its own
    # line beneath its parent rather than competing with the title for the row,
    # so it no longer disappears when the terminal is narrow. It is also the
    # only marker here that the fixture cannot produce by listing: the parent's
    # listing names subagent ids while the cohort holds no child at all, exactly
    # as production discovery hands it over, so this count can only come from
    # resolving the discovered subagent relation.
    wantContains: ["user driv", "parent se", "+ 2 child"]
    wantAbsent: ["agent driven session"]

ingestProgressStates:
  - key: running
    wantContains: [importing transcripts, local import progress, discover 1/4, "_|||_"]

selection:
  repositories:
    - {clonePath: /fixtures/worktrees/pasture-a, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-a}
    - {clonePath: /fixtures/worktrees/pasture-b, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-b}
  listings:
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: parent session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-parent
      subagentIds: [cc-child]
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: imported session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-imported
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: not imported yet
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: 5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47
      source:
        origin: file
    - harness: cursor
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: cursor session
      workingDir: /fixtures/worktrees/pasture-b
      sessionId: cur-1
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: agent driven session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: origin-agent-hidden
      origin: agent
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: user driven session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: origin-user-visible
      origin: user
  # The parent-to-subagent relation over the whole DISCOVERED set, which is
  # what production discovery hands the picker beside the ROOTS-ONLY listing
  # above. Naming a session here does NOT put it in the picker: cc-child and
  # cc-grandchild are the subagent sessions production finds and never shows,
  # and they exist only here. This is the shape the badge has to survive - a
  # cohort that holds no child at all - so the capture proves what a person
  # will actually see, not merely that the renderer can draw a count.
  subagentDiscovery:
    - {sessionId: cc-parent, subagentIds: [cc-child]}
    - {sessionId: cc-child, subagentIds: [cc-grandchild]}
    - {sessionId: cc-grandchild}
    - {sessionId: cc-imported}
    - {sessionId: 5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47}
    - {sessionId: cur-1}
    - {sessionId: origin-agent-hidden}
    - {sessionId: origin-user-visible}
  transcripts:
    cc-parent:
      - {role: user, entryType: text, content: "scrubbed-body: inspect the fixture safely"}
      - {role: assistant, entryType: text, content: "the fixture transcript is loaded through the normal preview boundary"}
  sourceTranscripts:
    5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47:
      - '{"type":"user","uuid":"h1","message":{"role":"user","content":"scrubbed-source-body: peasant read in place from the harness file"}}'
      - '{"type":"assistant","uuid":"h2","parentUuid":"h1","message":{"role":"assistant","content":[{"type":"text","text":"peasant copies nothing and imports nothing to show this preview"}]}}'
  ingested: [cc-imported]
  requiredSessionNames:
    - cc-parent
    - cc-imported
    - 5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47
    - cur-1
    - origin-agent-hidden
    - origin-user-visible
  requiredHarnessNames:
    - claude-code
    - cursor
  requiredIngestedNames:
    - cc-imported
  # Deletion protection for the subagent sessions that exist ONLY in the
  # relation. They are what makes the capture production-shaped: delete either
  # and the fixture is rejected rather than quietly rendering a smaller count.
  requiredSubagentDiscoveryNames:
    - cc-child
    - cc-grandchild

