sheets:
  - name: guided-dark
    kind: guided
    title: "final guided sections: dark theme"
    theme: dark
    viewport: {width: 1800, height: 3300}
  - name: guided-light
    kind: guided
    title: "final guided sections: light theme"
    theme: light
    viewport: {width: 1800, height: 3300}
  - name: selection
    kind: selection
    title: "mounted selection: linked submodule project, branch, and session previews"
    theme: dark
    viewport: {width: 1800, height: 5700}
  - name: push
    kind: push
    title: "mounted push wizard: start, selection, consent, and receipt in both themes"
    theme: dark

guidedSections:
  - key: auto-ingest
    wantContains: [auto-ingest new branches in fully-selected projects, "[on]"]
  - key: publication
    wantContains: [publication preference, keep local]
  - key: privacy
    wantContains: [redaction level, "- before:", "+ after:"]
  - key: license
    wantContains: [default license attached to pushed transcripts, none]
  - key: destination
    wantContains: [default visibility for pushed transcripts, private]
  - key: retention
    wantContains: [how long claude code keeps its transcripts, 30 days]

selectionStates:
  - key: default
    query: ""
    wantContains: ["search:", harness, claude code, cursor]
  - key: search
    query: cursor
    wantContains: ["search: cursor", harness, "cursor se"]
  - key: project-preview
    query: ""
    wantContains: ["project: github:acme/tool", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  - key: branch-preview
    query: ""
    wantContains: ["project: github:acme/tool", "branch: main", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  - key: session-preview
    query: ""
    wantContains: ["parent ses", "harness: claude code", scrubbed-body]
  - key: harness-source-preview
    query: ""
    wantContains: ["harness: claude code", scrubbed-source-body, read in place]

selection:
  repositories:
    - {clonePath: /fixtures/worktrees/pasture-a, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-a}
    - {clonePath: /fixtures/worktrees/pasture-b, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-b}
  listings:
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: parent session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-parent
      subagentIds: [cc-child]
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: child subagent
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-child
      subagentIds: [cc-grandchild]
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: grandchild subagent
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-grandchild
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: imported session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-imported
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: not imported yet
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: 5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47
      source:
        origin: file
    - harness: cursor
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: cursor session
      workingDir: /fixtures/worktrees/pasture-b
      sessionId: cur-1
  transcripts:
    cc-parent:
      - {role: user, entryType: text, content: "scrubbed-body: inspect the fixture safely"}
      - {role: assistant, entryType: text, content: "the fixture transcript is loaded through the normal preview boundary"}
  sourceTranscripts:
    5c8b1a24-7d63-4e19-9f02-3b6d8c1e5a47:
      - '{"type":"user","uuid":"h1","message":{"role":"user","content":"scrubbed-source-body: peasant read in place from the harness file"}}'
      - '{"type":"assistant","uuid":"h2","parentUuid":"h1","message":{"role":"assistant","content":[{"type":"text","text":"peasant copies nothing and imports nothing to show this preview"}]}}'
  ingested: [cc-imported]

