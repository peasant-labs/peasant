expectedSheetCount: 3
expectedGuidedSectionCount: 5
expectedGuidedCaptureCount: 20
expectedSelectionStateCount: 5
expectedSelectionCaptureCount: 16
expectedSelectionSessionCount: 5
expectedSelectionHarnessCount: 2
expectedSelectionIngestedCount: 1

sheets:
  - name: guided-dark
    kind: guided
    title: "final guided sections: dark theme"
    theme: dark
    viewport: {width: 1800, height: 3300}
  - name: guided-light
    kind: guided
    title: "final guided sections: light theme"
    theme: light
    viewport: {width: 1800, height: 3300}
  - name: selection
    kind: selection
    title: "mounted selection: linked submodule project, branch, and session previews"
    theme: dark
    viewport: {width: 1800, height: 4800}

guidedSections:
  - key: auto-ingest
    wantContains: [auto-ingest new branches in fully-selected projects, "[on]"]
  - key: privacy
    wantContains: [redaction level, "- before:", "+ after:"]
  - key: license
    wantContains: [default license attached to pushed transcripts, none]
  - key: destination
    wantContains: [default visibility for pushed transcripts, private]
  - key: retention
    wantContains: [how long claude code keeps its transcripts, 30 days]

selectionStates:
  - key: default
    query: ""
    wantContains: ["search:", harness, claude code, cursor]
  - key: search
    query: cursor
    wantContains: ["search: cursor", harness, "cursor se"]
  - key: project-preview
    query: ""
    wantContains: ["project: github:acme/tool", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  - key: branch-preview
    query: ""
    wantContains: ["project: github:acme/tool", "branch: main", "git directories: 2", /fixtures/gitdirs/pasture-a, /fixtures/gitdirs/pasture-b]
  - key: session-preview
    query: ""
    wantContains: ["parent ses", "harness: claude code", scrubbed-body]

selection:
  repositories:
    - {clonePath: /fixtures/worktrees/pasture-a, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-a}
    - {clonePath: /fixtures/worktrees/pasture-b, cohortKey: "submodule:fixture-super:7:pasture", gitDirectory: /fixtures/gitdirs/pasture-b}
  listings:
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: parent session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-parent
      subagentIds: [cc-child]
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: child subagent
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-child
      subagentIds: [cc-grandchild]
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: grandchild subagent
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-grandchild
    - harness: claude-code
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: imported session
      workingDir: /fixtures/worktrees/pasture-a
      sessionId: cc-imported
    - harness: cursor
      projectName: acme/tool
      gitRemote: "git@github.com:acme/tool.git"
      branch: main
      title: cursor session
      workingDir: /fixtures/worktrees/pasture-b
      sessionId: cur-1
  transcripts:
    cc-parent:
      - {role: user, entryType: text, content: "scrubbed-body: inspect the fixture safely"}
      - {role: assistant, entryType: text, content: "the fixture transcript is loaded through the normal preview boundary"}
  ingested: [cc-imported]

guidedCaptures:
  - {name: auto-ingest-dark-80x24, section: auto-ingest, theme: dark, width: 80, height: 24}
  - {name: auto-ingest-dark-120x40, section: auto-ingest, theme: dark, width: 120, height: 40}
  - {name: auto-ingest-light-80x24, section: auto-ingest, theme: light, width: 80, height: 24}
  - {name: auto-ingest-light-120x40, section: auto-ingest, theme: light, width: 120, height: 40}
  - {name: privacy-dark-80x24, section: privacy, theme: dark, width: 80, height: 24}
  - {name: privacy-dark-120x40, section: privacy, theme: dark, width: 120, height: 40}
  - {name: privacy-light-80x24, section: privacy, theme: light, width: 80, height: 24}
  - {name: privacy-light-120x40, section: privacy, theme: light, width: 120, height: 40}
  - {name: license-dark-80x24, section: license, theme: dark, width: 80, height: 24}
  - {name: license-dark-120x40, section: license, theme: dark, width: 120, height: 40}
  - {name: license-light-80x24, section: license, theme: light, width: 80, height: 24}
  - {name: license-light-120x40, section: license, theme: light, width: 120, height: 40}
  - {name: destination-dark-80x24, section: destination, theme: dark, width: 80, height: 24}
