lifecycle:
  required_cases: [raw-key-awaits-acknowledgment, external-context-awaits-acknowledgment, successful-completion]
  cases:
    - {name: raw-key-awaits-acknowledgment, key: true}
    - {name: external-context-awaits-acknowledgment, external: true}
    - {name: successful-completion}
interrupt:
  required_cases:
    - raw-control-c
    - diff-raw-control-c
    - pipe-sigint
    - pipe-sigterm
    - json-sigint
    - json-sigterm
    - terminal-sigterm
    - terminal-sigint
    - terminal-json-sigint
  cases:
    - name: raw-control-c
      terminal: true
      interrupt: key
    - name: diff-raw-control-c
      terminal: true
      interrupt: key
      diff_session: ses_3cd91f52effeXd3QAJ54jOyzn1
    - name: pipe-sigint
      interrupt: sigint
    - name: pipe-sigterm
      interrupt: sigterm
    - name: json-sigint
      json: true
      interrupt: sigint
    - name: json-sigterm
      json: true
      interrupt: sigterm
    - name: terminal-sigterm
      terminal: true
      interrupt: sigterm
    - name: terminal-sigint
      terminal: true
      interrupt: sigint
    - name: terminal-json-sigint
      terminal: true
      json: true
      interrupt: sigint
inline:
  required_cases:
    - dark-standard
    - light-wide
    - short-retains-focus-and-timings
    - one-row-retains-interrupt
    - canceling-retains-stage-and-clock
    - canceled-retains-stage-and-clock
    - short-canceled-retains-timings
    - one-row-canceling-status
  cases:
    - name: dark-standard
      theme: dark
      width: 80
      height: 24
      contains: [local import progress, 4/10, "total elapsed: 8s", estimate unavailable, ctrl+c to cancel]
      absent: []
    - name: light-wide
      theme: light
      width: 120
      height: 40
      contains: [local import progress, 4/10, "total elapsed: 8s", estimate unavailable, ctrl+c to cancel]
      absent: []
    - name: short-retains-focus-and-timings
      theme: dark
      width: 80
      height: 6
      contains: [index, 4/10, "total elapsed: 8s", estimate unavailable, ctrl+c to cancel]
      absent: [_|||_]
    - name: one-row-retains-interrupt
      theme: light
      width: 80
      height: 1
      contains: [ctrl+c to cancel]
      absent: [local import progress, _|||_]
    - name: canceling-retains-stage-and-clock
      theme: dark
      width: 80
      height: 24
      cancel: true
      contains: [local import progress, 4/10, "total elapsed: 8s", canceling harvest]
      absent: [ctrl+c to cancel, harvest canceled]
    - name: canceled-retains-stage-and-clock
      theme: light
      width: 120
      height: 40
      cancel: true
      stop: true
      contains: [local import progress, 4/10, "total elapsed: 8s", harvest canceled]
      absent: [ctrl+c to cancel, canceling harvest]
    - name: short-canceled-retains-timings
      theme: dark
      width: 80
      height: 6
      cancel: true
      stop: true
      contains: [index, 4/10, "total elapsed: 8s", harvest canceled]
      absent: [_|||_, ctrl+c to cancel]
    - name: one-row-canceling-status
      theme: light
      width: 80
      height: 1
      cancel: true
      contains: [canceling harvest]
      absent: [local import progress, _|||_, ctrl+c to cancel]
