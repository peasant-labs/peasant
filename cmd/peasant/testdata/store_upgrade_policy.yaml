# step76Cases tie the search repair's cost to the policy: the same schema-75
# store is a long plan only when it carries stale search results.
step76Cases:
  - name: step-76-is-long-only-when-the-store-has-search-residue
    longStore: long
    quickStore: quick

# pushCases run the real `village push` command on a store with a long step.
# Every caller is refused before any village request and exits with the
# nothing-attempted status, so a generated hook (with or without an
# auto-publish rule) prints its "nothing reached peasant online" meaning and
# exits 0, and a script sees the nothing-attempted code. caller picks the
# argument list: hook-with-rule and hook-without-rule are rendered by the
# real hook generator, script is a hand-written non-interactive push.
pushCases:
  - name: push-hook-with-rule-nothing-attempted
    caller: hook-with-rule
  - name: push-hook-without-rule-nothing-attempted
    caller: hook-without-rule
  - name: push-script-nothing-attempted
    caller: script

# entryCases run the real entry functions with no terminal. store: affected
# and clean are the minimal schema-75 fixtures (long and quick plans; the
# quick upgrade cannot finish on the minimal fixture, so a case on it asserts
# only that the entry point did not refuse); current is a real head store;
# real-v75 is a real schema-75 store with no stale results, and wantOpened
# requires the entry point to upgrade it and open it at the head schema.
# wantRefuse requires the typed refusal with the database file and its
# sidecars byte-identical. confirm is --confirm for the migrate and reclaim
# openers. The kickstart mount and the web server never upgrade, so they
# refuse the clean store as well.
entryCases:
  - name: opendb-affected-refuses
    entry: openDB
    store: affected
    wantRefuse: true
  - name: opendb-clean-proceeds
    entry: openDB
    store: clean
