# Store upgrade policy: what each entry point does with a store that is
# behind the schema this build needs.
#
# policyCases drive the one helper every entry point calls
# (ensureStoreCurrent) with the upgrade itself replaced by a recorder, so a
# case states the policy and nothing else. mode is how the entry point is
# classed: terminal and piped come from the one terminal check, hook from
# --non-interactive, server is fixed. store names the fixture: quick is a
# schema-75 store with no stale search results (one quick step), long is a
# schema-75 store with stale search results (one long step), current is at
# the head schema, missing has no file. want is the policy outcome: ran,
# asked (the plan and a prompt were shown; wantRan says whether the answer
# let the upgrade run), skipped (the nothing-attempted status, which a
# generated hook turns into exit 0), refused, or none. exit is peasant's
# process status. A skip and a refusal assert that no byte of the database
# changed and that the upgrade never started. tightDisk makes the plan report
# free disk below twice what it asks for. confirm is --confirm on a command
# that owns the upgrade.
#
# One case per row and column of the entry-point table is named
# <entry>-<terminal|piped|hook|server>-<quick|long>. The named rulings and
# the cases of the 0.16.2 search-repair gate follow, under their names.
policyCases:
  - name: kickstart-terminal-quick
    entry: kickstart
    mode: terminal
    store: quick
    want: ran
    exit: 0
  - name: kickstart-terminal-long
    entry: kickstart
    mode: terminal
    store: long
    answer: "y"
    want: asked
    wantRan: true
    exit: 0
  - name: kickstart-piped-quick
