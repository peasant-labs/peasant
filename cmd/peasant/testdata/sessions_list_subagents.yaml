# One store, read through the real sessions list command. Start times order the
# rows newest first: main-new, child-known, child-dangling, child-unresolved,
# main-old.
sessions:
  - { id: main-new, start: 5 }
  - { id: child-known, start: 4, parent: main-new }
  - { id: child-dangling, start: 3, parentNotStored: gone-parent }
  - { id: child-unresolved, start: 2, unresolved: true }
  - { id: main-old, start: 1, root: main-old }
cases:
  - name: default_hides_subagents
    want: [main-new, main-old]
  - name: include_subagents_shows_all
    args: [--include-subagents]
    want: [main-new, child-known, child-dangling, child-unresolved, main-old]
  - name: unresolved_parent_hidden_by_default
    wantAbsent: [child-unresolved]
  - name: dangling_parent_hidden_by_default
    wantAbsent: [child-dangling]
  - name: session_flag_returns_subagent_row
    args: [--session, child-known]
    want: [child-known]
  - name: limit_applies_after_filter
    args: [--limit, "2"]
    want: [main-new, main-old]
  - name: json_fields_always_present
    args: [--include-subagents]
  - name: json_fields_match_local_session_row
    args: [--include-subagents]
    wantRows:
      - { id: main-new, parentSessionId: "", parentUnresolved: false, rootSessionId: "" }
      - { id: child-known, parentSessionId: main-new, parentUnresolved: false, rootSessionId: "" }
      - { id: child-dangling, parentSessionId: gone-parent, parentUnresolved: false, rootSessionId: "" }
      - { id: child-unresolved, parentSessionId: "", parentUnresolved: true, rootSessionId: "" }
      - { id: main-old, parentSessionId: "", parentUnresolved: false, rootSessionId: main-old }
  - name: list_matches_local_api_predicate
