# A corpus that never expects more than ONE session to be reported.
#
# It satisfies every other requirement - all five outcomes appear, one session
# records several rows, and a session that fails and then succeeds is present -
# so nothing else in the loader objects. What it cannot tell apart is a counter
# that returns how many sessions failed from one that returns whether ANY did,
# and the defect the real corpus exists for was a wrong NUMBER printed directly
# beneath the session total, not a wrong yes or no.

expectedCaseCount: 5
cases:
  - name: a-clean-run-reports-nothing
    rows:
      - {session: s1, outcome: indexed}
    wantCount: 0

  - name: a-session-the-sweep-recovers-is-not-a-failure
    rows:
      - {session: s1, outcome: error}
      - {session: s1, outcome: reindexed}
    wantCount: 0

  - name: a-fallback-indexed-session-is-not-a-failure-either
    rows:
      - {session: s1, outcome: fallback}
    wantCount: 0

  - name: a-skipped-session-is-not-a-failure
    rows:
      - {session: s1, outcome: skipped}
    wantCount: 0

  - name: one-failing-session-is-reported
    rows:
      - {session: s1, outcome: error}
    wantCount: 1
