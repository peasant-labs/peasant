# Mounted-harvest re-ingest cases for the two OpenCode session-clock fixtures.
# Each case names the source fixture and the freshness mutation applied before
# the second harvest. A moved file mtime without changed captured bytes is a
# no-op even for an older database without a session clock. A changed session
# attribute remains captured evidence and drives a refresh.
# required_cases names the cases that must stay present; removing one goes red
# by name. Adding a case need not appear here.
required_cases:
  - absent-clock-unchanged-when-only-the-mtime-floor-moves
  - clock-bearing-session-re-ingests-when-its-session-clock-moves
cases:
  - name: absent-clock-unchanged-when-only-the-mtime-floor-moves
    fixture: session-clock-absent-floor
    mutation: mtime-floor
    sessionID: ses_3cd91f52effeXd3QAJ54jOyzGA
  - name: clock-bearing-session-re-ingests-when-its-session-clock-moves
    fixture: session-clock-lagging
    mutation: session-clock
    sessionID: ses_3cd91f52effeXd3QAJ54jOyzGB
