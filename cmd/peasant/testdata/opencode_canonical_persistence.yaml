# compute_version in expected_metrics must equal metrics.CurrentComputeVersion
# (internal/metrics/engine.go). A metrics bump on develop updates every row here.
# required_* name entries that must stay present; removing one goes red by name.
required_cases:
  - mixed-canonical-sessions-persist-through-detail-and-analytics
cases:
  - name: mixed-canonical-sessions-persist-through-detail-and-analytics
    source_fixture: canonical-selection-mixed
    expected_sessions: 9
    json_sessions:
      - {session_id: ses_3cd91f52effeXd3QAJ54jOyzv5, marker: JSON_ALL}
      - {session_id: ses_3cd91f52effeXd3QAJ54jOyzv7, marker: JSON_CURRENT}
      - {session_id: ses_3cd91f52effeXd3QAJ54jOyzv8, marker: JSON_LEGACY}
      - {session_id: ses_3cd91f52effeXd3QAJ54jOyzvB, marker: JSON_ONLY}
    canonical_sessions:
      - name: all-three-prefers-current
        combination: current_legacy_json
        session_id: ses_3cd91f52effeXd3QAJ54jOyzv5
        winning_marker: CURRENT_ALL
        losing_markers: [LEGACY_ALL, JSON_ALL]
        ordered_entry_ids: [msg_current_all]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: current-and-legacy-prefers-current
        combination: current_legacy
        session_id: ses_3cd91f52effeXd3QAJ54jOyzv6
        winning_marker: CURRENT_LEGACY
        losing_markers: [LEGACY_CURRENT]
        ordered_entry_ids: [msg_current_legacy]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: current-and-json-prefers-current
        combination: current_json
        session_id: ses_3cd91f52effeXd3QAJ54jOyzv7
        winning_marker: CURRENT_JSON
        losing_markers: [JSON_CURRENT]
        ordered_entry_ids: [msg_current_json]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: legacy-and-json-prefers-legacy
        combination: legacy_json
        session_id: ses_3cd91f52effeXd3QAJ54jOyzv8
        winning_marker: LEGACY_JSON
        losing_markers: [JSON_LEGACY]
        ordered_entry_ids: [msg_legacy_json, part_legacy_json]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: current-only
        combination: current_only
        session_id: ses_3cd91f52effeXd3QAJ54jOyzv9
        winning_marker: CURRENT_ONLY
        losing_markers: []
        ordered_entry_ids: [msg_current_only]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: legacy-only
        combination: legacy_only
        session_id: ses_3cd91f52effeXd3QAJ54jOyzvA
        winning_marker: LEGACY_ONLY
        losing_markers: []
        ordered_entry_ids: [msg_legacy_only, part_legacy_only]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
      - name: json-only
        combination: json_only
        session_id: ses_3cd91f52effeXd3QAJ54jOyzvB
        winning_marker: JSON_ONLY
        losing_markers: []
        ordered_entry_ids: [msg_json_ses_3cd91f52effeXd3QAJ54jOyzvB]
        expected_metrics: {turn_count: 1, tool_calls: 0, compute_version: 7}
    graph_session: ses_3cd91f52effeXd3QAJ54jOyzvC
    parent_entry: msg_current_root
    child_entry: msg_current_child
    missing_parent_entry: msg_current_parent
    tool_call_id: call_current_parent
    tool_result_contains: CURRENT_TOOL_RESULT
    orphan_session: ses_3cd91f52effeXd3QAJ54jOyzvD
    orphan_entry: part_legacy_orphan
    orphan_content_contains: LEGACY_ORPHAN_PART
    # The graph session holds one real tool call, counted on the message row and
    # again on its part row. Its third message carries only a text part and is
    # not a tool call, so it adds nothing here.
    expected_metrics: {turn_count: 3, tool_calls: 2, compute_version: 7}
required_loader_mutations:
  - unknown-field
  - wrong-count
  - duplicate-name
  - trailing-document
  - wrong-session-count
  - duplicate-session-id
  - unknown-combination
  - orphan-json-reference
  - missing-winning-marker
  - missing-ordered-entry
  - invalid-metrics
loader_mutations:
  - {name: unknown-field, kind: unknown_field}
  - {name: wrong-count, kind: wrong_count}
  - {name: duplicate-name, kind: duplicate_name}
  - {name: trailing-document, kind: trailing_document}
  - {name: wrong-session-count, kind: wrong_session_count}
  - {name: duplicate-session-id, kind: duplicate_session_id}
  - {name: unknown-combination, kind: unknown_combination}
  - {name: orphan-json-reference, kind: orphan_json_reference}
  - {name: missing-winning-marker, kind: missing_winning_marker}
  - {name: missing-ordered-entry, kind: missing_ordered_entry}
  - {name: invalid-metrics, kind: invalid_metrics}
