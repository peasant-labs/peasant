# Each case states two things the loader cross-checks against each other:
#
#   git_policy     whether complete-cohort preparation needs project evidence,
#                  DERIVED from the row and compared with the declared token
#   expected_match what the selection filter answers — a closed set of three
#                  tokens, because the matcher is three-valued
#
# The (git_policy, expected_match) pair is the second layer beside the row-count
# floor. It makes MOST rows load-bearing: where two rows share a pair, deleting
# either leaves the pair covered by the other, and only the floor catches it.
#
# With the floor relaxed, deletion checks catch 7 of these 8 rows. Three conflict
# rows share (resolves, withheld); rendered-entry shape coverage distinguishes two
# of them. The base two-pinned-entries conflict shares its observable behavior
# with the variants, so the declared row-count floor is its independent guard.
declared_rows: 10
cases:
  - name: non-selected-harness-skips-git
    harness: opencode
    configured_harness: claude-code
    session_id: 11111111-1111-4111-8111-111111111111
    git_policy: "harness-absent"
    expected_match: "rejected"
    expected_git_calls: 0
  # With no project entries configured, cohort preparation does not need Git,
  # whether or not the session is on the allowlist.
  - name: no-project-entries-skips-git
    harness: claude-code
    configured_harness: claude-code
    explicit_sessions: [11111111-1111-4111-8111-111111111111]
    session_id: 11111111-1111-4111-8111-111111111111
    git_policy: "no-project-entries"
    expected_match: "selected"
    expected_git_calls: 0
  - name: session-only-harness-skips-git-for-unlisted-session
    harness: claude-code
    configured_harness: claude-code
    explicit_sessions: [11111111-1111-4111-8111-111111111111]
    session_id: 22222222-2222-4222-8222-222222222222
    original_root: /workspace/tool
    git_policy: "no-project-entries"
    expected_match: "rejected"
    expected_git_calls: 0
  # An explicit session still contributes physical identity to the complete
  # cohort. Its own decision remains session-first, but sibling clone evidence
  # must not disappear and make a remote look unique.
  - name: explicit-session-still-prepares-project-evidence
    harness: claude-code
    configured_harness: claude-code
    projects: [{gitRemote: https://github.com/acme/tool.git, branches: [main]}]
    explicit_sessions: [11111111-1111-4111-8111-111111111111]
    session_id: 11111111-1111-4111-8111-111111111111
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "selected"
    expected_git_calls: 2
  - name: same-directory-resolves-once
    harness: claude-code
    configured_harness: claude-code
    projects: [{gitRemote: https://github.com/acme/tool.git, branches: [main]}]
    session_id: 11111111-1111-4111-8111-111111111111
    second_session_id: 22222222-2222-4222-8222-222222222222
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "selected"
    expected_git_calls: 2
  - name: conflict-is-withheld-and-reported
    harness: claude-code
    configured_harness: claude-code
    projects:
      - {gitRemote: https://github.com/acme/tool.git, branches: [main]}
      - {name: workbench, branches: [other]}
    project_name: workbench
    session_id: 11111111-1111-4111-8111-111111111111
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "withheld"
    expected_git_calls: 2
  # An UNRESTRICTED entry is the default shape a project entry takes, and it is
  # the likeliest permissive side of a real conflict — so "all branches" versus
  # "branches [x]" is exactly the distinction the warning has to make legible.
  - name: conflict-between-an-all-branches-entry-and-a-pinned-one
    harness: claude-code
    configured_harness: claude-code
    projects:
      - {gitRemote: https://github.com/acme/tool.git}
      - {name: workbench, branches: [other]}
    project_name: workbench
    session_id: 11111111-1111-4111-8111-111111111111
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "withheld"
    expected_git_calls: 2
  # The kickstart wizard writes BOTH identity fields, so a saved selection really
  # does carry entries like this and a warning really does have to render them.
  #
  # Names here are deliberately absent from EVERY remote in the case. The warning
  # renders all the disagreeing entries into one string, so a name that appears
  # in a SIBLING's URL is matched by that URL and a dropped rendering arm goes
  # unnoticed — which is exactly what happened when this guard only compared a
  # name against its own entry's remote.
  - name: conflict-naming-an-entry-that-carries-remote-and-name
    harness: claude-code
    configured_harness: claude-code
    projects:
      - {gitRemote: https://github.com/acme/tool.git, name: workbench, branches: [main]}
      - {name: satchel, branches: [other]}
    project_name: satchel
    session_id: 11111111-1111-4111-8111-111111111111
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "withheld"
    expected_git_calls: 2

  - name: auto-new-branches-keeps-an-exact-branch-denied
    harness: claude-code
    configured_harness: claude-code
    exclusions:
      branches:
        - clonePath: /workspace/tool
          branches: [main]
    auto_new_branches: true
    session_id: 33333333-3333-4333-8333-333333333333
    original_root: /workspace/tool
    git_policy: "prepare-project-evidence"
    expected_match: "rejected"
    expected_exact_exclusion: true
    expected_git_calls: 2

  - name: exact-session-denial-skips-git
    harness: claude-code
    configured_harness: claude-code
    exclusions:
      sessions: [55555555-5555-4555-8555-555555555555]
    session_id: 55555555-5555-4555-8555-555555555555
    original_root: /workspace/tool
    git_policy: "no-project-entries"
    expected_match: "rejected"
    expected_exact_exclusion: true
    expected_git_calls: 0

# mounted_conflict drives the real `peasant harvest` command against a real git
# repository so the withheld-conflict notice is proven where the user sees it,
# not only on the recorder in isolation.
mounted_conflict:
  # A Claude project slug that must NOT decode to any real directory, so the
  # filter falls back to the discovered session's harness root (the repository).
  claude_slug: -nonexistent-peasant-selection-conflict-fixture-root
  session_id: 44444444-4444-4444-8444-444444444444
  git_remote: https://github.com/acme/conflicted.git
  admitted_branch: trunk
  rejected_branch: release
  # A third configured entry for a DIFFERENT project. It is configured for the
  # same harness but takes no part in the disagreement, so the warning must not
  # name it: dumping every entry a harness carries gets less actionable the more
  # projects a user configures, which is backwards from what the warning is for.
  unrelated_remote: https://github.com/acme/untouched-by-the-conflict.git
  unrelated_branch: main
  # The warning has to answer all four questions to be actionable. Each is a
  # named axis rather than a list entry, so none can be dropped silently.
  notice:
    what: was withheld during ingest
    why: disagree on branch
    means: the session was not ingested
    fix: edit one entry or add the branch

# overflow drives the notice past its per-run cap. Untested, this arm can say
# less than the truth about how much of a user's work was held back — and the
# whole point of the disclosure is that withheld data is not silently withheld.
# declared_conflicts is deliberately more than the cap so the summary line is
# reached; expected_listed is what the cap allows.
overflow:
  declared_conflicts: 13
  expected_listed: 10
  summary_contains:
    count: "3 additional sessions"
    reason: "selection rules conflict"
    remedy: "edit one project entry or add the branch"
