# One CLI, two villages: the released village serves pull contract 0.2.0
# (account strings) and the public-owner village serves 0.3.0. The same
# commands pull from both, and the manifest records the envelope each transfer
# used. A 0.2.0 village showed every person, so its cases carry profiles only.
#
# Each case pulls one transcript by reference (the pipeline negotiates) and one
# collective (the command negotiates once and the pipeline skips it).
requiredNames:
  - released village serves pull contract 0.2.0
  - public owner village serves pull contract 0.3.0
  - public owner village shows an owner anonymously

cases:
  - name: released village serves pull contract 0.2.0
    legacyEnvelope: true
    owner: alice
    wantEnvelope: "0.2.0"
    wantContextOwner: "owner:   @alice"
  - name: public owner village serves pull contract 0.3.0
    owner: alice
    wantEnvelope: "0.3.0"
    wantContextOwner: "owner:   @alice"
  - name: public owner village shows an owner anonymously
    anonymous: true
    wantEnvelope: "0.3.0"
    wantContextOwner: "owner:   anon"
