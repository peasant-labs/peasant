declaredCases: 8
declaredStoredRows: 9
declaredScannerRows: 1
cases:
  - name: db-only explicit session aligns gate viewer and push
    behavior: stored-explicit
    storeState: readable
    selection:
      kind: explicit-session
      sessionId: 71000000-0000-4000-8000-000000000001
    paths:
      - key: selected-canonical
        state: directory
      - key: selected-worktree
        state: directory
      - key: sibling-canonical
        state: directory
      - key: sibling-worktree
        state: directory
    storedRows:
      - harness: claude-code
        sessionId: 71000000-0000-4000-8000-000000000001
        projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        projectName: stored-alignment
        gitRemote: git@github.com:example/stored-alignment.git
        branch: main
        canonicalPathKey: selected-canonical
        worktreePathKey: selected-worktree
      - harness: claude-code
        sessionId: 71000000-0000-4000-8000-000000000002
        projectHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        projectName: stored-alignment
        gitRemote: git@github.com:example/stored-alignment.git
        branch: topic
        canonicalPathKey: sibling-canonical
        worktreePathKey: sibling-worktree
    scannerRows:
      - harness: claude-code
        sessionId: 71000000-0000-4000-8000-000000000002
        projectName: stored-alignment
        gitRemote: git@github.com:example/stored-alignment.git
        branch: topic
        worktreePathKey: sibling-worktree
    expectedGate: none
    expectedCandidateCount: 2
    expectedDescendantCount: 2
    expectedViewerProjects: 1
    expectedViewerSessions: 1
    expectedPushSessionIds:
      - 71000000-0000-4000-8000-000000000001

