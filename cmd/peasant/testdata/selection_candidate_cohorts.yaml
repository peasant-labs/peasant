declared_cases: 9
declared_rows: 16
cases:
  - name: exact clone path selects one clone of an ambiguous remote
    harness: claude-code
    projects:
      - gitRemote: https://github.com/acme/tool.git
        clonePaths: [/physical/tool-a]
        branches: [main]
    rows:
      - session_id: 11111111-1111-4111-8111-111111111111
        git_remote: https://github.com/acme/tool.git
        project_name: tool
        project_hash: hash-tool
        project_path: /raw/tool-a
        resolved_path: /physical/tool-a
        branch: main
        expected_clone_path: /physical/tool-a
        expected_remote_multiplicity: ambiguous
        expected_name_multiplicity: ambiguous
        expected_branch_match: selected
        expected_project_match: true
      - session_id: 22222222-2222-4222-8222-222222222222
        git_remote: https://github.com/acme/tool.git
        project_name: tool
        project_hash: hash-tool
        project_path: /raw/tool-b
        resolved_path: /physical/tool-b
        branch: main
        expected_clone_path: /physical/tool-b
        expected_remote_multiplicity: ambiguous
        expected_name_multiplicity: ambiguous
        expected_branch_match: rejected
        expected_project_match: false

