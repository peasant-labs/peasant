# Harvest applies the saved selection only for a native discovery run that is
# not index-only, not --all, and not an explicit --session. requiredNames is
# the deletion guard. A count is not the contract.
requiredNames:
  - harvest-selected-applies-filter
  - harvest-index-only-skips-filter
  - harvest-all-skips-filter
  - harvest-explicit-session-skips-filter
  - harvest-selected-admits-the-session-recorded-on-the-chosen-branch
  - harvest-selected-refuses-a-session-recorded-on-another-branch
ids:
  selected: 11111111-1111-4111-8111-111111111111
  other: 22222222-2222-4222-8222-222222222222
cases:
  - name: harvest-selected-applies-filter
    expectFilter: true
    expectImported:
      - 11111111-1111-4111-8111-111111111111
    expectAbsent:
      - 22222222-2222-4222-8222-222222222222
  - name: harvest-index-only-skips-filter
    indexOnly: true
    conflict: true
    preludeAll: true
    expectFilter: false
    expectNoWithholdNotice: true
  - name: harvest-all-skips-filter
    all: true
    expectFilter: false
    expectImported:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
  - name: harvest-explicit-session-skips-filter
    session: other
    expectFilter: false
    expectImported:
      - 22222222-2222-4222-8222-222222222222
    expectAbsent:
      - 11111111-1111-4111-8111-111111111111
  # The clone sits on the chosen branch. A session recorded on that branch is
  # imported; a session recorded on another branch is not, whatever the clone
  # has checked out now.
  - name: harvest-selected-admits-the-session-recorded-on-the-chosen-branch
    branchRule: true
    expectFilter: true
    expectImported:
      - 44444444-4444-4444-8444-444444444444
  - name: harvest-selected-refuses-a-session-recorded-on-another-branch
    branchRule: true
    recordedElsewhere: true
    expectFilter: true
    expectAbsent:
      - 44444444-4444-4444-8444-444444444444
