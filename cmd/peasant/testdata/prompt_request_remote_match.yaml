# Cases for the line the push prints about a waiting prompt request.
#
# The village serves a request's remote as GitHub's repository full_name:
# "owner/name", with no host and no scheme, because that is what the App reads
# out of the webhook. The remote on this machine is whatever the user cloned
# from, in any form git accepts, so each case exercises the whole path — the
# shared normalization, the reduction to "owner/name", the state the request is
# in, and the match that follows — and asserts the printed line, not the
# comparison behind it.
#
# A request names two repositories: the base its pull request was opened against
# (requestRemote) and the repository its head came from (requestHeadRemote, a
# fork's repository or the base itself for a same-repository pull request). A
# case that sets no head is a request from a village older than the field, which
# names the base alone.
#
# The cases that print nothing are the point of the fixture as much as the ones
# that do: a hint about a pull request that is not this repository's, or one that
# is no longer waiting, sends an author looking for a request that is not open.
# A case with no state is a request still waiting.
cases:
  - name: scp-remote-matches
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: scp-remote-without-git-suffix-matches
    pushedRemote: "git@github.com:peasant-labs/village"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: https-remote-matches
    pushedRemote: "https://github.com/peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: https-remote-with-a-trailing-slash-matches
    pushedRemote: "https://github.com/peasant-labs/village.git/"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: https-remote-with-credentials-matches
    pushedRemote: "https://token@github.com/peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: ssh-url-with-port-matches
    pushedRemote: "ssh://git@github.com:22/peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: host-case-difference-matches
    pushedRemote: "git@GitHub.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: owner-and-repository-case-difference-matches
    pushedRemote: "git@github.com:Peasant-Labs/Village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: true
  - name: waiting-request-matches
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    state: waiting
    wantMatch: true
  - name: already-attached-request-does-not-match
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    state: attached
    wantMatch: false
  - name: unconfirmed-preview-does-not-match
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    state: preview
    wantMatch: false
  - name: detached-request-does-not-match
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    state: detached
    wantMatch: false
  - name: same-repository-name-under-another-owner-does-not-match
    pushedRemote: "git@github.com:someone-else/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: different-repository-in-the-same-owner-does-not-match
    pushedRemote: "git@github.com:peasant-labs/schema.git"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: another-host-does-not-match
    pushedRemote: "git@gitlab.com:peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: subgroup-on-another-host-does-not-match
    pushedRemote: "https://gitlab.com/group/peasant-labs/village.git"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: nested-path-on-github-does-not-match
    pushedRemote: "https://github.com/peasant-labs/village/extra.git"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: remote-without-a-host-does-not-match
    pushedRemote: "peasant-labs/village"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: local-path-remote-does-not-match
    pushedRemote: "/Users/developer/code/village"
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: empty-remote-does-not-match
    pushedRemote: ""
    requestRemote: "peasant-labs/village"
    wantMatch: false
  - name: empty-request-remote-does-not-match
    pushedRemote: "git@github.com:peasant-labs/village.git"
    requestRemote: ""
    wantMatch: false

  # The fork workflow: the author cloned their fork, so the remote on their
  # machine names the fork while the request names the base it was raised
  # against. The head remote is what lets that clone match.
  - name: fork-clone-matches-its-request
    pushedRemote: "git@github.com:author/widgets.git"
    requestRemote: "peasant-labs/widgets"
    requestHeadRemote: "author/widgets"
    wantMatch: true
  # A renamed fork matches here, because the request names the fork as its head.
  # Completing that request by hand is narrower than this match: the by-hand push
  # finds an attachment by the repository name the fork shares with the base,
  # which a renamed fork no longer shares. The pull request's own attach flow is
  # not affected.
  - name: fork-clone-with-another-name-matches-its-request
    pushedRemote: "git@github.com:author/widgets-fork.git"
    requestRemote: "peasant-labs/widgets"
    requestHeadRemote: "author/widgets-fork"
    wantMatch: true
  - name: base-clone-matches-a-request-whose-head-is-a-fork
    pushedRemote: "git@github.com:peasant-labs/widgets.git"
    requestRemote: "peasant-labs/widgets"
    requestHeadRemote: "author/widgets"
    wantMatch: true
  - name: fork-clone-does-not-match-another-forks-request
    pushedRemote: "git@github.com:author/widgets.git"
    requestRemote: "peasant-labs/widgets"
    requestHeadRemote: "someone-else/widgets"
    wantMatch: false
  - name: fork-clone-does-not-match-a-same-repository-request
    pushedRemote: "git@github.com:author/widgets.git"
    requestRemote: "peasant-labs/widgets"
    requestHeadRemote: "peasant-labs/widgets"
    wantMatch: false
  - name: fork-owner-case-difference-matches-its-request
    pushedRemote: "git@github.com:Author/village.git"
    requestRemote: "peasant-labs/village"
    requestHeadRemote: "author/village"
    wantMatch: true
  - name: request-without-a-head-remote-still-matches-the-base
    pushedRemote: "git@github.com:peasant-labs/widgets.git"
    requestRemote: "peasant-labs/widgets"
    wantMatch: true
