# Each row is one planned session. Deleting a row must be caught, so the loader
# carries floor == row count AND derived coverage over the ROLE each row plays
# in the exactness proof — a floor is one constant in another file that the same
# edit which drops a row can decrement.
declared_rows: 2
sessions:
  - session_id: 11111111-1111-4111-8111-111111111111
    output_path: github.com--acme--tool
    role: "first-of-slug"
  - session_id: 22222222-2222-4222-8222-222222222222
    output_path: github.com--acme--tool
    role: "second-of-slug"
concurrent_session:
  session_id: 33333333-3333-4333-8333-333333333333
  output_path: github.com--acme--tool

# consent_window drives the real prune command with the consent prompt held
# open. That is the only point at which a session can arrive mid-run, so it is
# the only place the frozen plan's guarantee can be observed on both halves —
# the filesystem AND the database — and the only place the residue notice can be
# read with a live arrival present.
consent_window:
  # Arrives on disk only, after the plan is frozen: the filesystem half.
  late_disk_session:
    session_id: cccccccc-cccc-cccc-cccc-cccccccccccc
    output_path: github.com-test-prune
  # Arrives in the STORE after the plan is frozen: the database half. Without
  # this, re-deriving the delete set from the store at execute time — the exact
  # time-of-check/time-of-use bug the plan exists to prevent — goes unobserved.
  late_store_session:
    session_id: dddddddd-dddd-dddd-dddd-dddddddddddd
    output_path: github.com-test-prune
  # Already on disk before the run, with no database row: the only thing that is
  # genuinely leftover, and the only thing the notice may tell a user to delete.
  orphan_session:
    session_id: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
    output_path: orphan-host-slug
  # The notice has to answer all four to be safe as well as actionable. The
  # safeguard axis is not decoration: the previous wording named the transcript
  # tree itself as the thing to remove, which followed literally destroys the
  # live session the command just protected.
  notice:
    finding: have no database row
    consequence: were left in place
    remedy: remove those specific paths
    safeguard: do NOT remove
