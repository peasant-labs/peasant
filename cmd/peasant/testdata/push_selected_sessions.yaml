              - { id: 5b5b5b5b-0000-4000-8000-0000000000b1, verdict: will_publish, selectedBy: parent, selectionInheritedFrom: 0a0a0a0a-0000-4000-8000-00000000000a }

  - name: subagent_named_alone_keeps_own_selection
    # Named on its own, the subagent session is not pulled in by a parent,
