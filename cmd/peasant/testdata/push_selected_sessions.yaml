    selectedBranches: [main]
    seeds:
      - { id: 0a0a0a0a-0000-4000-8000-00000000000a, kind: ready }
      - { id: 5a5a5a5a-0000-4000-8000-0000000000a1, kind: ready, parent: 0a0a0a0a-0000-4000-8000-00000000000a, branch: worktree-agent-a1b2c3 }
