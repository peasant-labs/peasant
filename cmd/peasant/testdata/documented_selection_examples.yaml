declared_cases: 3
declared_flag_help_entries: 1
cases:
  - name: README selection configuration
    document: README.md
    marker: selection-config
    kind: config
    expected_selection:
      mode: selected
      autoIngestNewBranches: true
      harnesses:
        claude-code:
          projects:
            - gitRemote: https://github.com/example/atlas.git
              clonePaths:
                - /projects/atlas
                - /projects/atlas-review
              branches:
                - main
                - release
          sessions:
            - 11111111-1111-4111-8111-111111111111
          exclusions:
            branches:
              - clonePath: /projects/atlas-review
                branches:
                  - experiment
            sessions:
              - 22222222-2222-4222-8222-222222222222

  - name: kickstart command examples
    document: docs/KICKSTART.md
    marker: kickstart-commands
    kind: commands
    commands:
      - [peasant, kickstart]
      - [peasant, kickstart, --reset]

  - name: manual unselected prune commands
    document: docs/KICKSTART.md
    marker: unselected-prune-commands
    kind: commands
    commands:
      - [peasant, prune, --unselected, --dry-run]
      - [peasant, prune, --unselected]
    flag_help:
      command: prune
      flag: unselected
      usage: Prune sessions not selected by harness, project, clone, branch, or explicit session rules (requires selection.mode=selected)
      generated_document: docs/cli/peasant_prune.md
