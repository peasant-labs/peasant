# Search-residue gate cases: one per terminal/non-terminal entry point shape.
# isTTY simulates the terminal the command runs under (stubbed in tests;
# production reads stdin). db selects the fixture store: affected is a
# version-75 store with union residue, clean is version-75 without residue,
# current is already migrated, missing is a fresh install with no file.
# Non-interactive runs on an affected store refuse; everything else opens.
cases:
  - name: terminal-affected-proceeds
    isTTY: true
    db: affected
    wantRefuse: false
  - name: terminal-clean-proceeds
    isTTY: true
    db: clean
    wantRefuse: false
  - name: nonterminal-affected-refuses
    isTTY: false
    db: affected
    wantRefuse: true
  - name: nonterminal-clean-proceeds
    isTTY: false
    db: clean
    wantRefuse: false
  - name: nonterminal-current-proceeds
    isTTY: false
    db: current
    wantRefuse: false
  - name: nonterminal-missing-proceeds
    isTTY: false
    db: missing
    wantRefuse: false

# Push callers on an affected store: every one is refused before any village
# request and exits with the nothing-attempted status, so a generated hook
# (with or without an auto-publish rule) prints its "nothing reached peasant
# online" meaning and a script sees the nothing-attempted code. caller picks
# the argument list: hook-with-rule and hook-without-rule are rendered by the
# real hook generator (githooks.RepositoryArgv), script is a hand-written
# non-interactive push.
pushCases:
  - name: push-hook-with-rule-nothing-attempted
    caller: hook-with-rule
  - name: push-hook-without-rule-nothing-attempted
    caller: hook-without-rule
  - name: push-script-nothing-attempted
    caller: script
