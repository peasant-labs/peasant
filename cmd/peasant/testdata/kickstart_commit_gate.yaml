declaredCaseCount: 12
declaredCandidateCaseCount: 2
declaredCandidateCheckCount: 3
messageBlock: |-
  You selected no projects.
  Your existing projects stay ingested and indexed.
  The web viewer will not list them.
  You cannot select them for a future push until you change this selection.
  Peasant does not delete data.
  Save this choice?
paths:
  - key: worktree
    state: directory
listings:
  - harness: claude-code
    projectName: acme/tool
    gitRemote: git@github.com:acme/tool.git
    pathKey: worktree
    branch: main
    sessionId: 11111111-1111-4111-8111-111111111111
    title: parent session
    subagentIds:
      - 22222222-2222-4222-8222-222222222222
  - harness: claude-code
    projectName: acme/tool
    gitRemote: git@github.com:acme/tool.git
    pathKey: worktree
    branch: main
    sessionId: 22222222-2222-4222-8222-222222222222
    title: child session
cases:
  - name: first-run-user-selects-explicit-session-and-suppresses-confirmation
    runState: first
    initialSelection: all
    editKeys: [right, j, right, j, space]
    answerKeys: []
    expectPrompt: false
    expectCommit: true
    expectExit: false
    expectSelection: explicit-parent
  - name: later-run-explicit-session-suppresses-confirmation
    runState: later
    initialSelection: explicit-parent
    editKeys: []
    answerKeys: []
    expectPrompt: false
    expectCommit: true
    expectExit: false
    expectSelection: explicit-parent
  - name: first-run-empty-selection-confirms-and-saves-on-yes
    runState: first
    initialSelection: all
    editKeys: []
    answerKeys: [left, enter]
    expectPrompt: true
    expectCommit: true
    expectExit: false
    expectSelection: empty
  - name: later-run-user-clears-project-confirms-and-saves-on-yes
    runState: later
    initialSelection: whole-project
    editKeys: [space]
    answerKeys: [left, enter]
    expectPrompt: true
    expectCommit: true
    expectExit: false
    expectSelection: empty
  - name: first-run-default-no-writes-nothing
    runState: first
    initialSelection: all
    editKeys: []
    answerKeys: [enter]
    expectPrompt: true
    expectCommit: false
    expectExit: false
    expectSelection: empty
  - name: later-run-user-clears-project-and-default-no-writes-nothing
    runState: later
    initialSelection: whole-project
    editKeys: [space]
    answerKeys: [enter]
    expectPrompt: true
    expectCommit: false
    expectExit: false
    expectSelection: empty
  - name: first-run-back-writes-nothing
    runState: first
    initialSelection: all
    editKeys: []
    answerKeys: [esc]
    expectPrompt: true
    expectCommit: false
    expectExit: false
    expectSelection: empty
  - name: later-run-user-clears-project-and-back-writes-nothing
    runState: later
    initialSelection: whole-project
    editKeys: [space]
    answerKeys: [esc]
    expectPrompt: true
    expectCommit: false
    expectExit: false
    expectSelection: empty
  - name: first-run-cancel-writes-nothing
    runState: first
    initialSelection: all
    editKeys: []
    answerKeys: [q]
    expectPrompt: true
    expectCommit: false
    expectExit: true
    expectSelection: empty
  - name: later-run-user-clears-project-and-cancel-writes-nothing
    runState: later
    initialSelection: whole-project
    editKeys: [space]
    answerKeys: [q]
    expectPrompt: true
    expectCommit: false
    expectExit: true
    expectSelection: empty
  - name: first-run-interruption-writes-nothing
    runState: first
    initialSelection: all
    editKeys: []
    answerKeys: [ctrl+c]
    expectPrompt: true
    expectCommit: false
    expectExit: true
    expectSelection: empty
  - name: later-run-user-clears-project-and-interruption-writes-nothing
    runState: later
    initialSelection: whole-project
    editKeys: [space]
    answerKeys: [ctrl+c]
    expectPrompt: true
    expectCommit: false
    expectExit: true
    expectSelection: empty
candidateCases:
  - name: unresolved-sibling-keeps-pathless-identity-ambiguous
    expectedCandidateCount: 1
    paths:
      - key: resolved-clone
        state: directory
      - key: missing-clone
        state: missing
    listings:
      - harness: claude-code
        projectName: acme/tool
        gitRemote: git@github.com:acme/tool.git
        pathKey: resolved-clone
        branch: main
        sessionId: 11111111-1111-4111-8111-111111111111
        title: resolved session
      - harness: claude-code
        projectName: acme/tool
        gitRemote: git@github.com:acme/tool.git
        pathKey: missing-clone
        branch: main
        sessionId: 99999999-9999-4999-8999-999999999999
        title: unavailable sibling
    expectedCandidates:
      - harness: claude-code
        pathKey: resolved-clone
        gitRemote: ""
        projectName: ""
        descendants:
          - sessionId: 11111111-1111-4111-8111-111111111111
            parentSessionId: ""
    gateChecks:
      - name: pathless-remote-and-name-leave-editor-clear
        selection:
          harness: claude-code
          gitRemote: git@github.com:acme/tool.git
          projectName: acme/tool
          pathKey: ""
        expectedEditorProjectCount: 0
        expectedGate: confirm-no-projects
      - name: exact-clone-path-still-selects-project
        selection:
          harness: claude-code
          gitRemote: git@github.com:acme/tool.git
          projectName: acme/tool
          pathKey: resolved-clone
        expectedEditorProjectCount: 1
        expectedGate: none
