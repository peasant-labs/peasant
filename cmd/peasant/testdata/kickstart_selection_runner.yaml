# Real Claude transcript files cross the committed-selection adapter and the
# production kickstart runner before assertions inspect the persisted store.
expectedSourceSessionCount: 3
expectedCaseCount: 4
expectedLegacyBroadeningMutationCount: 2
sourceSessions:
  - sessionId: "11111111-1111-4111-8111-111111111111"
    projectDir: -workspace-example-tool
    projectName: tool
    workingDir: /workspace/example/tool
    branch: main
    title: first real session
  - sessionId: "22222222-2222-4222-8222-222222222222"
    projectDir: -workspace-example-tool
    projectName: tool
    workingDir: /workspace/example/tool
    branch: main
    title: admitted real session
  - sessionId: "33333333-3333-4333-8333-333333333333"
    projectDir: -workspace-example-tool
    projectName: tool
    workingDir: /workspace/example/tool
    branch: main
    title: third real session
cases:
  - name: selected-empty-imports-nothing
    legacyBroadeningMutation: true
    selection:
      mode: selected
      autoIngestNewBranches: false
    wantStoredSessionIds: []
  - name: stale-selected-session-imports-nothing
    legacyBroadeningMutation: true
    selection:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          sessions: ["99999999-9999-4999-8999-999999999999"]
    wantStoredSessionIds: []
  - name: one-real-match-imports-only-that-session
    selection:
      mode: selected
      autoIngestNewBranches: false
      harnesses:
        claude-code:
          sessions: ["22222222-2222-4222-8222-222222222222"]
    wantStoredSessionIds: ["22222222-2222-4222-8222-222222222222"]
  - name: all-mode-proves-source-fixtures-are-ingestible
    selection:
      mode: all
      autoIngestNewBranches: true
    wantStoredSessionIds:
      - "11111111-1111-4111-8111-111111111111"
      - "22222222-2222-4222-8222-222222222222"
      - "33333333-3333-4333-8333-333333333333"
