expectedRows: 10
cases:
  - name: absent file seeds the recommendation and creates the selected value
    scenario: missing-file
    selectedRetention: 365
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: false
  - name: absent key stays bound to the opened path and preserves unrelated settings
    scenario: missing-key-path-stability
    initialDocument: |
      {
        "theme": "dark",
        "nested": {"keep": true}
      }
    selectedRetention: 90
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: false
  - name: malformed json stops before the screen mounts
    scenario: malformed-json
    initialDocument: '{"cleanupPeriodDays": 30'
    expectOpenCalls: 1
    expectRunnerCalls: 0
    expectWriterCalls: 0
    expectError: true
    wantErrorContains: [malformed, no settings were changed]
  - name: non-object json stops before the screen mounts
    scenario: non-object-json
    initialDocument: '[{"cleanupPeriodDays": 30}]'
    expectOpenCalls: 1
    expectRunnerCalls: 0
    expectWriterCalls: 0
    expectError: true
    wantErrorContains: [object, no settings were changed]
  - name: invalid cleanup value stops before the screen mounts
    scenario: invalid-retention
    initialDocument: '{"cleanupPeriodDays": "thirty"}'
    expectOpenCalls: 1
    expectRunnerCalls: 0
    expectWriterCalls: 0
    expectError: true
    wantErrorContains: [cleanupPeriodDays, positive integer]
  - name: unreadable settings path stops before the screen mounts
    scenario: unreadable-path
    expectOpenCalls: 1
    expectRunnerCalls: 0
    expectWriterCalls: 0
    expectError: true
    wantErrorContains: [read, no settings were changed]
  - name: late unreadable same-path edit fails before replacement
    scenario: late-unreadable
    initialDocument: |
      {
        "cleanupPeriodDays": 30,
        "theme": "dark",
        "nested": {"keep": true}
      }
    selectedRetention: 365
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: true
    wantErrorContains: [read, remains committed, did not change]
  - name: late valid same-path edit preserves its unrelated values
    scenario: late-valid-edit
    initialDocument: |
      {
        "cleanupPeriodDays": 30,
        "theme": "dark"
      }
    lateDocument: |
      {
        "cleanupPeriodDays": 30,
        "theme": "light",
        "late": {"keep": true}
      }
    selectedRetention: 365
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: false
    wantDocumentContains: ['"theme": "light"', '"keep": true']
  - name: late malformed same-path edit fails without replacement
    scenario: late-malformed-edit
    initialDocument: '{"cleanupPeriodDays": 30, "theme": "dark"}'
    lateDocument: '{"cleanupPeriodDays": 30'
    selectedRetention: 365
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: true
    wantErrorContains: [malformed, remains committed, did not change]
  - name: late retention drift fails without replacement
    scenario: late-retention-drift
    initialDocument: '{"cleanupPeriodDays": 30, "theme": "dark"}'
    lateDocument: '{"cleanupPeriodDays": 90, "theme": "late"}'
    selectedRetention: 365
    expectOpenCalls: 1
    expectRunnerCalls: 1
    expectWriterCalls: 1
    expectError: true
    wantErrorContains: [changed outside, remains committed, did not change]
