cases:
  - name: spinner-shows-done-and-total-during-discovery
    mode: discover
    root: /sources
    files:
      - path: project/11111111-1111-4111-8111-111111111111.jsonl
        body: '{"type":"user","message":{"role":"user","content":"first"}}'
      - path: project/22222222-2222-4222-8222-222222222222.jsonl
        body: '{"type":"user","message":{"role":"user","content":"second"}}'
    block: project/22222222-2222-4222-8222-222222222222.jsonl
    want: 'Discovering Claude Code sessions... (1/2) · 1 re-read'
  - name: spinner-clears-counts-before-a-phase-only-harness
    mode: phase-reset
    phase: Discovering Other sessions...
    want: Discovering Other sessions...
  - name: spinner-remains-phase-only-for-adapter-without-progress
    mode: unsupported-adapter
    phase: Discovering Other sessions...
    root: /sources
    files:
      - path: project/33333333-3333-4333-8333-333333333333.jsonl
        body: '{"type":"user","message":{"role":"user","content":"fixture"}}'
    want: Discovering Other sessions...
