seeds:
  - sessionID: 11111111-1111-1111-1111-111111111111
    projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    projectPath: /synthetic/alpha
    gitRemote: https://github.com/example/alpha.git
    harness: claude-code
    startMs: 1767312000000 # 2026-01-02T00:00:00Z
    entries: [caching caching caching, unrelated material]
  - sessionID: 22222222-2222-2222-2222-222222222222
    projectHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    projectPath: /synthetic/beta
    harness: codex
    startMs: 1767398399999 # final millisecond of Jan 2
    entries: [caching with detailed notes, caching with detailed notes, caching with detailed notes]
  - sessionID: 33333333-3333-3333-3333-333333333333
    projectHash: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    projectPath: /synthetic/unknown
    harness: opencode
    startMs: 0
    entries: [caching with detailed notes]
parity: {query: caching, limit: '20'}
cases:
  - name: happy_path_ranked_columns
    setup: &seeded {dataDir: directory, store: seeded}
    args: [caching]
    wantColumns: &columns [SESSION, PROJECT, ROLE, ENTRY, SNIPPET]
    wantStdoutContains: ['11111111-111', alpha, user, '[caching]']
    wantStderrEmpty: true
  - name: json_payload_parity
    setup: *seeded
    args: [caching, --json]
    wantStdoutContains: ['"query": "caching"', '"score":', '"warnings": []']
    wantStderrEmpty: true
  - name: short_query_unopenable_datadir
    setup: &unopenable {dataDir: regularFile, store: none}
    args: [' a ']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [fewer than two non-whitespace characters, No store was opened, Enter at least two characters]
    wantNoDBFile: true
  - name: short_query_no_db_created
    setup: &none {dataDir: directory, store: none}
    args: [' ']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [fewer than two non-whitespace characters]
    wantNoDBFile: true
  - name: unopenable_datadir_control
    setup: *unopenable
    args: [caching]
    wantExit: 1
    wantStdoutEmpty: true
    wantStderrContains: [not a directory]
    wantNoDBFile: true
  - name: short_query_single_multibyte_rune_accepted
    setup: *seeded
    args: [é, --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: no indexed entry
    wantStderrEmpty: true
  - name: query_arg_count
    setup: *none
    args: [two, terms]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [takes one search query, wrap a multi-word query in quotes]
    wantNoDBFile: true
  - name: limit_not_integer
    setup: *none
    args: [caching, --limit, abc]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --limit value "abc"', 1..50]
    wantNoDBFile: true
  - name: limit_not_integer_unopenable_datadir
    setup: *unopenable
    args: [caching, --limit, abc]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --limit value "abc"']
    wantNoDBFile: true
  - name: limit_not_positive
    setup: *none
    args: [caching, --limit, '0']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [1..50, 0 does not mean no limit]
    wantNoDBFile: true
  - name: limit_negative
    setup: *none
    args: [caching, --limit, '-1']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --limit value "-1"', 1..50]
    wantNoDBFile: true
  - name: limit_at_bound
    setup: *seeded
    args: [caching, --limit, '50', --json]
    wantStdoutContains: ['"score":']
    wantStderrEmpty: true
  - name: limit_above_bound
    setup: *none
    args: [caching, --limit, '51']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --limit value "51"', 1..50]
    wantNoDBFile: true
  - name: offset_not_integer
    setup: *none
    args: [caching, --offset, abc]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --offset value "abc"', integer >= 0]
    wantNoDBFile: true
  - name: offset_negative
    setup: *none
    args: [caching, --offset, '-1']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid --offset value "-1"', integer >= 0]
    wantNoDBFile: true
  - name: offset_zero
    setup: *seeded
    args: [caching, --offset, '0', --json]
    wantStdoutContains: ['"score":']
    wantStderrEmpty: true
  - name: index_needs_rebuild_surfaces
    setup: {store: needsRebuild}
    args: [caching, --json]
    wantExit: 1
    wantStdoutEmpty: true
    wantStderrContains: [search index needs a rebuild, peasant harvest verify --content]
    wantStderrNotContains: [no matches]
  - name: no_index_surfaces
    setup: {store: noIndex}
    args: [caching, --json]
    wantExit: 1
    wantStdoutEmpty: true
    wantStderrContains: [no search index exists, peasant harvest index]
    wantStderrNotContains: [no matches]
  - name: empty_no_match
    setup: *seeded
    args: [absentword, --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: no indexed entry
    wantResults: []
    wantStderrEmpty: true
  - name: empty_table_reason
    setup: *seeded
    args: [absentword]
    wantStdoutContains: [no indexed entry, whole tokens]
    wantStderrEmpty: true
  - name: empty_store
    setup: {store: empty}
    args: [caching, --offset, '5', --json]
    wantEmptyCode: store_has_no_sessions
    wantReasonContains: peasant harvest
    wantResults: []
    wantStderrEmpty: true
  - name: empty_store_before_identity_offset
    setup: {store: empty}
    args: [11111111-1111-1111-1111-111111111111, --offset, '5', --project, nonexistent, --json]
    wantEmptyCode: store_has_no_sessions
    wantReasonContains: peasant harvest
    wantStdoutNotContains: [smaller --offset]
    wantStderrEmpty: true
  - name: filter_excluded_query_matches_elsewhere
    setup: *seeded
    args: [caching, --project, nonexistent, --json]
    wantEmptyCode: filters_excluded_all
    wantReasonContains: widen
    wantStderrEmpty: true
  - name: filter_no_match_anywhere
    setup: *seeded
    args: [absentword, --project, beta, --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: no indexed entry
    wantStderrEmpty: true
  - name: filter_empty_stream_with_offset
    setup: *seeded
    args: [caching, --project, nonexistent, --offset, '5', --json]
    wantEmptyCode: filters_excluded_all
    wantReasonContains: widen
    wantStdoutNotContains: [smaller --offset]
    wantStderrEmpty: true
  - name: filter_no_match_anywhere_with_offset
    setup: *seeded
    args: [absentword, --project, beta, --offset, '5', --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: no indexed entry
    wantStdoutNotContains: [smaller --offset]
    wantStderrEmpty: true
  - name: no_match_with_offset
    setup: *seeded
    args: [absentword, --offset, '5', --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: no indexed entry
    wantStdoutNotContains: [smaller --offset]
    wantStderrEmpty: true
  - name: offset_past_end
    setup: *seeded
    args: [caching, --offset, '20', --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: smaller --offset
    wantStderrEmpty: true
  - name: filtered_offset_past_end
    setup: *seeded
    args: [caching, --project, beta, --offset, '20', --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: smaller --offset
    wantStderrEmpty: true
  - name: direct_session_id
    setup: *seeded
    args: [11111111-1111-1111-1111-111111111111, --json]
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrEmpty: true
  - name: direct_lookup_without_index
    setup: {store: noIndex}
    args: [11111111-1111-1111-1111-111111111111, --json]
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrEmpty: true
  - name: direct_project_hash
    setup: *seeded
    args: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, --json]
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrEmpty: true
  - name: direct_table_full_id
    setup: *seeded
    args: [11111111-1111-1111-1111-111111111111]
    wantColumns: *columns
    wantStdoutContains: [11111111-1111-1111-1111-111111111111, '—']
    wantStderrEmpty: true
  - name: direct_session_id_unknown_empty_reason
    setup: *seeded
    args: [99999999-9999-9999-9999-999999999999, --project, nonexistent, --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: identifier
    wantStdoutNotContains: [whole tokens]
    wantStderrEmpty: true
  - name: direct_project_hash_unknown_empty_reason
    setup: *seeded
    args: [dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd, --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: identifier
    wantStdoutNotContains: [whole tokens]
    wantStderrEmpty: true
  - name: direct_with_filter_warns
    setup: *seeded
    args: [11111111-1111-1111-1111-111111111111, --harness, codex, --json]
    wantWarningCode: filter_ignored
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrContains: [filters did not apply]
  - name: direct_with_unmatched_project_filter
    setup: *seeded
    args: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, --project, nonexistent, --json]
    wantWarningCode: filter_ignored
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrContains: [filters did not apply]
  - name: direct_with_offset_empty_reason
    setup: *seeded
    args: [11111111-1111-1111-1111-111111111111, --project, nonexistent, --offset, '1', --json]
    wantEmptyCode: no_matching_entries
    wantReasonContains: smaller --offset
    wantStderrEmpty: true
  - name: filter_project_substring
    setup: *seeded
    args: [caching, --project, example/alpha, --json]
    wantResults: ['11111111-1111-1111-1111-111111111111:0']
    wantStderrEmpty: true
  - name: filter_project_basename
    setup: *seeded
    args: [caching, --project, beta, --json]
    wantResults: &betaResults ['22222222-2222-2222-2222-222222222222:0', '22222222-2222-2222-2222-222222222222:1', '22222222-2222-2222-2222-222222222222:2']
    wantStderrEmpty: true
  - name: filter_harness
    setup: *seeded
    args: [caching, --harness, codex, --json]
    wantResults: *betaResults
    wantStderrEmpty: true
  - name: filter_since
    setup: *seeded
    args: [caching, --since, '2026-01-02T23:59:59.999Z', --json]
    wantResults: *betaResults
    wantStderrEmpty: true
  - name: filter_until
    setup: *seeded
    args: [caching, --until, '2026-01-02T23:59:59.999Z', --harness, codex, --json]
    wantEmptyCode: filters_excluded_all
    wantReasonContains: widen
    wantStderrEmpty: true
  - name: filter_until_date_only_includes_day
    setup: *seeded
    args: [caching, --until, '2026-01-02', --harness, codex, --json]
    wantResults: *betaResults
    wantStderrEmpty: true
  - name: filter_since_unknown_start
    setup: *seeded
    args: [caching, --since, '2026-01-01', --harness, opencode, --json]
    wantEmptyCode: filters_excluded_all
    wantReasonContains: widen
    wantStderrEmpty: true
  - name: filter_until_unknown_start
    setup: *seeded
    args: [caching, --until, '2026-01-01', --json]
    wantResults: ['33333333-3333-3333-3333-333333333333:0']
    wantStderrEmpty: true
  - name: filter_sessions_from
    setup:
      store: seeded
      sessionsFrom: {path: '{{dir}}/ids.txt', write: ids, ids: [22222222-2222-2222-2222-222222222222]}
    args: [caching, --sessions-from, '{{dir}}/ids.txt', --json]
    wantResults: *betaResults
    wantStderrEmpty: true
  - name: filter_excludes_higher_ranked
    setup: *seeded
    args: [caching, --project, beta, --limit, '2', --json]
    wantResults: ['22222222-2222-2222-2222-222222222222:0', '22222222-2222-2222-2222-222222222222:1']
    wantStderrEmpty: true
  - name: filter_all_combined
    setup:
      store: seeded
      sessionsFrom: {path: '{{dir}}/ids.txt', write: ids, ids: [22222222-2222-2222-2222-222222222222]}
    args: [caching, --project, beta, --harness, codex, --since, '2026-01-02', --until, '2026-01-02', --sessions-from, '{{dir}}/ids.txt', --json]
    wantResults: *betaResults
    wantStderrEmpty: true
  - name: filter_paging_no_skip
    setup: *seeded
    args: [caching, --project, beta, --limit, '2', --offset, '2', --json]
    wantResults: ['22222222-2222-2222-2222-222222222222:2']
    wantStderrEmpty: true
  - name: full_page_next_offset
    setup: *seeded
    args: [caching, --project, beta, --limit, '2']
    wantColumns: *columns
    wantStdoutContains: [--offset 2]
    wantStderrEmpty: true
  - name: snippet_fts_truncated_single_marker
    setup: *seeded
    seeds:
      - &longSeed
        sessionID: 11111111-1111-1111-1111-111111111111
        projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        projectPath: /synthetic/alpha
        harness: claude-code
        startMs: 1767312000000
        entries: [caching one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty]
    args: [caching]
    wantColumns: *columns
    wantSnippetSuffix: '…'
    wantStdoutNotContains: ['……']
    wantStderrEmpty: true
  - name: snippet_renderer_clipped
    setup: *seeded
    seeds:
      - <<: *longSeed
        entries: [caching xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx]
    args: [caching]
    wantColumns: *columns
    wantSnippetSuffix: '…'
    wantSnippetRunes: 121
    wantStderrEmpty: true
  - name: snippet_json_unclipped
    setup: *seeded
    seeds:
      - <<: *longSeed
        entries: [caching xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx]
    args: [caching, --json]
    wantStdoutContains: ['[caching] xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx']
    wantStderrEmpty: true
  - name: control_chars_project_and_snippet
    setup: *seeded
    seeds:
      - <<: *longSeed
        projectPath: "/synthetic/al\epha\nline"
        entries: ["caching a\e[31mb\nsecond\tline"]
    args: [caching]
    wantColumns: *columns
    wantStdoutContains: ['al\x1bpha line', '[caching] a\x1b[31mb second line']
    wantStdoutNotContains: ["\e", "\t"]
    wantStderrEmpty: true
  - name: sessions_from_missing_file
    setup: {store: none, sessionsFrom: {path: '{{dir}}/ids.txt', write: none}}
    args: [caching, --sessions-from, '{{dir}}/ids.txt']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [open --sessions-from, could not be opened]
    wantNoDBFile: true
  - name: sessions_from_empty_file
    setup: {store: none, sessionsFrom: {path: '{{dir}}/ids.txt', write: empty}}
    args: [caching, --sessions-from, '{{dir}}/ids.txt']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [names no session ids]
    wantNoDBFile: true
  - name: sessions_from_invalid_id
    setup: {store: none, sessionsFrom: {path: '{{dir}}/ids.txt', write: ids, ids: [11111111-1111-1111-1111-111111111111, bad/id]}}
    args: [caching, --sessions-from, '{{dir}}/ids.txt']
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: ['invalid session id "bad/id"', position 2]
    wantNoDBFile: true
  - name: harness_invalid
    setup: *none
    args: [caching, --harness, unknown]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [invalid --harness value]
    wantNoDBFile: true
  - name: since_invalid
    setup: *none
    args: [caching, --since, unknown]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [invalid --since value]
    wantNoDBFile: true
  - name: until_invalid
    setup: *none
    args: [caching, --until, unknown]
    wantExit: 2
    wantStdoutEmpty: true
    wantStderrContains: [invalid --until value]
    wantNoDBFile: true
  - name: tag_not_exposed
    setup: *none
    args: [caching, --tag, example]
    wantExit: 1
    wantStdoutEmpty: true
    wantStderrContains: ['unknown flag: --tag']
    wantNoDBFile: true
