# Real-binary matrix for the web capability advertisement across the four
# foreground/background x default/experimental invocations of `peasant web start`.
#
# Each case boots the actual built binary on a free port with isolated XDG dirs,
# polls GET /api/v1/config/capabilities, and asserts the advertised token set
# plus the JSON content type and no-store cache header. The direct /map and
# /projects routes must stay mounted (200 + HTML from the SPA handler) in every
# case, since capabilities gate discoverability only, never routes.
#
# The background cases are the forwarding proof: `web start` without --foreground
# forks a foreground child, so the advertised set is correct only if
# --experimental is forwarded to that child. Deleting the forwarding line in
# cmd_web.go makes exactly experimental-background go red (its advert collapses
# to empty) while default-background stays green (guarding inverted forwarding).
declared_rows: 4

strict_commands:
  - [harvest]
  - [harvest, --dry-run]
  - [village, push, --json]
  - [village, push, --dry-run, --json]
  - [prune, --unselected]

startup_cases:
  - name: unsupported-selection-mode
    document: |
      selection: {mode: hostile-invalid}
    selection_error: selection.mode
  - name: deprecated-selection-policy
    document: |
      selection:
        mode: selected
        providers: {claude-code: {sessions: [11111111-1111-4111-8111-111111111111]}}
    selection_error: selection.providers
  - name: malformed-selection-exclusion
    document: |
      selection:
        mode: selected
        harnesses:
          claude-code:
            exclusions: {sessions: [not-a-session]}
    selection_error: exclusions.sessions
  - name: unrelated-redaction-stays-strict
    document: |
      selection: {mode: hostile-invalid}
      redaction:
        custom_patterns: [{id: bad, category: unsupported, pattern: secret}]
    startup_error: unknown category
  - name: unrelated-display-stays-strict
    document: |
      selection: {mode: hostile-invalid}
      display: {theme: unsupported}
    startup_error: display.theme
  - name: unrelated-write-budget-stays-strict
    document: |
      selection: {mode: hostile-invalid}
      write: {batchSessions: -1}
    startup_error: write
  - name: malformed-yaml-stays-strict
    document: 'selection: ['
    startup_error: parse YAML

# Deletion protection by NAME, not by count. A count alone cannot tell which case
# went missing, so removing the forwarding proof named above and decrementing the
# number left the suite green while the behaviour it guarded was unprotected.
required_cases:
  - default-foreground
  - experimental-foreground
  - experimental-background
  - default-background

cases:
  - name: default-foreground
    experimental: false
    foreground: true
    expected_tokens: []
  - name: experimental-foreground
    experimental: true
    foreground: true
    expected_tokens:
      - code_map_navigation_v1
  - name: experimental-background
    experimental: true
    foreground: false
    expected_tokens:
      - code_map_navigation_v1
  - name: default-background
    experimental: false
    foreground: false
    expected_tokens: []
