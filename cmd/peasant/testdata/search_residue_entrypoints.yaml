# Gated entry-point matrix: every migrating open funnels through the
# residue gate. affected is a version-75 store with union residue (the open
# must be refused with the typed refusal; the database file and any sidecars
# stay byte-identical); clean is version-75 without residue (the gate passes;
# a later open may still fail for unrelated missing-schema reasons on the
# minimal fixture, but never with the residue refusal); current is a real
# head-schema store (the open proceeds as usual); real-v75 is a real clean
# version-75 store, and wantOpened requires the open to succeed and migrate it
# to the build schema. confirm is --confirm for the migrate and reclaim
# openers: without it a non-interactive run is refused before the open (it
# would otherwise pay the rebuild unseen and then refuse at the prompt); with
# it the user consented, so the gate is skipped.
cases:
  - name: opendb-affected-refuses
    entry: openDB
    store: affected
    wantRefuse: true
  - name: opendb-clean-proceeds
    entry: openDB
    store: clean
    wantRefuse: false
  - name: opendb-current-proceeds
    entry: openDB
    store: current
    wantRefuse: false
  - name: openrunstore-affected-refuses
    entry: openRunStore
    store: affected
    wantRefuse: true
  - name: openrunstore-clean-proceeds
    entry: openRunStore
    store: clean
    wantRefuse: false
  - name: openrunstore-current-proceeds
    entry: openRunStore
    store: current
    wantRefuse: false
  - name: verifystore-affected-refuses
    entry: openVerifyContentStore
    store: affected
    wantRefuse: true
  - name: verifystore-clean-proceeds
    entry: openVerifyContentStore
    store: clean
    wantRefuse: false
  - name: verifystore-current-proceeds
    entry: openVerifyContentStore
    store: current
    wantRefuse: false
  - name: kickstartstore-affected-refuses
    entry: openKickstartStore
    store: affected
    wantRefuse: true
  - name: kickstartstore-clean-proceeds
    entry: openKickstartStore
    store: clean
    wantRefuse: false
  - name: kickstartstore-current-proceeds
    entry: openKickstartStore
    store: current
    wantRefuse: false
  - name: webpreopen-affected-refuses
    entry: webPreopen
    store: affected
    wantRefuse: true
  - name: webpreopen-clean-proceeds
    entry: webPreopen
    store: clean
    wantRefuse: false
  - name: webpreopen-current-proceeds
    entry: webPreopen
    store: current
    wantRefuse: false
  - name: webforeground-affected-refuses
    entry: runWebForeground
    store: affected
    wantRefuse: true
  - name: webforeground-clean-passes-gate
    entry: runWebForeground
    store: clean
    wantRefuse: false
  - name: ftuerunner-affected-refuses
    entry: ftueRunner
    store: affected
    wantRefuse: true
  - name: ftuerunner-clean-passes-gate
    entry: ftueRunner
    store: clean
    wantRefuse: false
  - name: runverify-affected-refuses
    entry: runVerify
    store: affected
    wantRefuse: true
  - name: runverify-clean-passes-gate
    entry: runVerify
    store: clean
    wantRefuse: false
  - name: opendb-real-v75-clean-opens-and-migrates
    entry: openDB
    store: real-v75
    wantRefuse: false
    wantOpened: true
  - name: migratestore-affected-without-confirm-refuses
    entry: openMigrateStore
    store: affected
    wantRefuse: true
  - name: migratestore-affected-with-confirm-passes-gate
    entry: openMigrateStore
    store: affected
    confirm: true
    wantRefuse: false
  - name: migratestore-clean-without-confirm-passes-gate
    entry: openMigrateStore
    store: clean
    wantRefuse: false
  - name: reclaimstore-affected-without-confirm-refuses
    entry: openReclaimStore
    store: affected
    wantRefuse: true
  - name: reclaimstore-affected-with-confirm-passes-gate
    entry: openReclaimStore
    store: affected
    confirm: true
    wantRefuse: false
  - name: reclaimstore-clean-without-confirm-passes-gate
    entry: openReclaimStore
    store: clean
    wantRefuse: false
