# Gated entry-point matrix: every migrating open funnels through the
# residue gate. affected is a version-75 store with union residue (the open
# must be refused with the typed refusal; the database file and any sidecars
# stay byte-identical); clean is version-75 without residue (the gate passes;
# a later open may still fail for unrelated missing-schema reasons on the
# minimal fixture, but never with the residue refusal); current is a real
# head-schema store (the open proceeds as usual). dbVersion is absent: db.go
# is build-ignored dead code, so there is no compiled dbVersion to gate.
cases:
  - name: opendb-affected-refuses
    entry: openDB
    store: affected
    wantRefuse: true
  - name: opendb-clean-proceeds
    entry: openDB
    store: clean
    wantRefuse: false
  - name: opendb-current-proceeds
    entry: openDB
    store: current
    wantRefuse: false
  - name: openrunstore-affected-refuses
    entry: openRunStore
    store: affected
    wantRefuse: true
  - name: openrunstore-clean-proceeds
    entry: openRunStore
    store: clean
    wantRefuse: false
  - name: openrunstore-current-proceeds
    entry: openRunStore
    store: current
    wantRefuse: false
  - name: verifystore-affected-refuses
    entry: openVerifyContentStore
    store: affected
    wantRefuse: true
  - name: verifystore-clean-proceeds
    entry: openVerifyContentStore
    store: clean
    wantRefuse: false
  - name: verifystore-current-proceeds
    entry: openVerifyContentStore
    store: current
    wantRefuse: false
  - name: kickstartstore-affected-refuses
    entry: openKickstartStore
    store: affected
    wantRefuse: true
  - name: kickstartstore-clean-proceeds
    entry: openKickstartStore
    store: clean
    wantRefuse: false
  - name: kickstartstore-current-proceeds
    entry: openKickstartStore
    store: current
    wantRefuse: false
  - name: webpreopen-affected-refuses
    entry: webPreopen
    store: affected
    wantRefuse: true
  - name: webpreopen-clean-proceeds
    entry: webPreopen
    store: clean
    wantRefuse: false
  - name: webpreopen-current-proceeds
    entry: webPreopen
    store: current
    wantRefuse: false
  - name: webforeground-affected-refuses
    entry: runWebForeground
    store: affected
    wantRefuse: true
  - name: webforeground-clean-passes-gate
    entry: runWebForeground
    store: clean
    wantRefuse: false
  - name: ftuereunner-affected-refuses
    entry: ftueRunner
    store: affected
    wantRefuse: true
  - name: ftuereunner-clean-passes-gate
    entry: ftueRunner
    store: clean
    wantRefuse: false
  - name: runverify-affected-refuses
    entry: runVerify
    store: affected
    wantRefuse: true
  - name: runverify-clean-passes-gate
    entry: runVerify
    store: clean
    wantRefuse: false
